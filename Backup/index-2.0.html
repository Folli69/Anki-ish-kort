6.42],[11.667,28.148,18.111,7.531],[63.889,69.259,32.111,6.42],[43.778,76.296,27.222,6.296],[33.556,84.815,13.556,6.296],[0.0,91.852,15.0,6.296],[18.222,93.704,17.778,6.296]],"target":7,"a":"N. medianus (Median)","n":"Fra radix lateralis og radix medialis."}],"mcq":[{"id":"q1","t":"ax5.led","q":"Hvad kendetegner et ægte led?","o":["Bindevævsforbindelse mellem to knogler med små forskydninger","Ledhule med synovialvæske og ledkapsel","Kun brusk mellem knoglerne","Altid seks frihedsgrader"],"c":1,"e":"Ægte led (synovialled) har ledhule, synovialvæske, ledkapsel og store bevægeudslag. De andre svar beskriver uægte led."},{"id":"q2","t":"ax5.led","q":"Hvor mange frihedsgrader har ægte led?","o":["1–3","3–5","Altid 6","Ingen"],"c":0,"e":"Ægte led har 1–3 frihedsgrader. Syndesmoser har 3–5, men aldrig 6."},{"id":"q3","t":"ax5.led","q":"Hvilket af følgende er en sekundær synchondrose?","o":["Epifyseskive","Ribbensbrusk","Discus intervertebralis","Membrana interossea antebrachii"],"c":2,"e":"Discus intervertebralis og symphysis pubica er sekundære synchondroser. Epifyseskiver og ribbensbrusk er primære, og membrana interossea er en syndesmose."},{"id":"q4","t":"ax5.led","q":"Hvad er ledforbindelsen mellem radius og ulna (membrana interossea)?","o":["Primær synchondrose","Sekundær synchondrose","Syndesmose","Ægte hængselled"],"c":2,"e":"Membrana interossea er en syndesmose – simpelt bindevæv mellem knoglerne."},{"id":"q5","t":"ax5.led","q":"Hvilken ledtype har kun én frihedsgrad?","o":["Kugleled","Saddelled","Ellipsoid-led","Hængselled"],"c":3,"e":"Hængselled (albue, knæ, fingerled) og drejeled har 1 frihedsgrad. Kugleled har 3, saddel- og ellipsoid-led har 2."},{"id":"q6","t":"ax5.led","q":"Hvad er et kombineret led?","o":["Et led med to knogler","Et led med flere end to knogler i samme ledhule","To adskilte ledhuler mellem de samme knogler","Et led uden ledkapsel"],"c":2,"e":"Enkelt = to knogler. Sammensat = flere end to knogler i samme ledhule. Kombineret = to adskilte ledhuler mellem de samme knogler."},{"id":"q7","t":"ax5.led","q":"Hvilken bevægelse foregår i frontalplanet omkring en sagittal akse?","o":["Fleksion–ekstension","Abduktion–adduktion","Indad–udadrotation","Supination–pronation"],"c":1,"e":"Abduktion–adduktion sker i frontalplanet omkring en sagittal akse. Fleksion–ekstension sker i sagittalplanet omkring en transversal akse."},{"id":"q8","t":"ax5.led","q":"Hvad er forskellen på discus og meniscus articularis?","o":["Discus er kileformet, meniscus er ringformet","Discus er fæstnet langs hele kapselranden; meniscus er kileformet og ikke fæstnet hele vejen","Kun meniscus består af fibrøs brusk","Discus findes kun i hofteleddet"],"c":1,"e":"Begge er fibrøs brusk. Discus er fæstnet til ledkapslen langs hele randen; meniscus er kileformet og ikke fæstnet langs hele randen."},{"id":"q9","t":"ax5.led","q":"Hvad betyder opponensbevægelsen?","o":["At strække tommelfingeren","At modstille sig – bruges ved præcisionsgrebet","At dreje underarmen","At føre armen i en keglebevægelse"],"c":1,"e":"Opponens = at modstille sig (tommelen mod fingrene). Keglebevægelsen hedder cirkumduktion."},{"id":"q10","t":"ax5.sb","q":"Hvilke led indgår i skulderbæltet?","o":["Art. sternoclavicularis og art. acromioclavicularis (samt art. scapulothoracalis)","Art. humeri og art. cubiti","Art. humeri og art. acromioclavicularis","Art. sternoclavicularis og art. humeri"],"c":0,"e":"Skulderbæltet er IKKE det samme som skulderleddet. Art. humeri (det egentlige skulderled) indgår ikke i ringen."},{"id":"q11","t":"ax5.sb","q":"Hvilken vinkel danner scapula med frontalplanet?","o":["10°","30°","40°","90°"],"c":2,"e":"Scapula danner 40° med frontalplanet; clavicula 30° i modsat retning."},{"id":"q12","t":"ax5.sb","q":"Hvordan klassificeres art. sternoclavicularis?","o":["Ægte, enkelt, delt glideled (funktionelt kugleled)","Ægte, sammensat hængselled","Ægte, kombineret drejeled","Uægte led (syndesmose)"],"c":0,"e":"Leddet er et delt glideled, men fungerer som et kugleled med cirkumduktion omkring en dobbeltkegle."},{"id":"q13","t":"ax5.sb","q":"Hvilken struktur deler ledhulen i art. sternoclavicularis i to?","o":["Labrum articulare","Discus articularis (tyk)","Lig. costoclaviculare","M. subclavius"],"c":1,"e":"Discus articularis er tyk og opdeler ledhulen i to."},{"id":"q14","t":"ax5.sb","q":"Hvor ligger skæringspunktet for akserne i dobbeltkeglen i art. sternoclavicularis?","o":["Ved lig. costoclaviculare","Ved processus coracoideus","Ved acromion","Ved lig. interclaviculare"],"c":0,"e":"Skæringspunktet for akserne ligger ved lig. costoclaviculare."},{"id":"q15","t":"ax5.sb","q":"Hvilket ligament ligger medialt i lig. coracoclaviculare?","o":["Lig. trapezoideum","Lig. conoideum","Lig. acromioclaviculare","Lig. coracoacromiale"],"c":1,"e":"Lig. coracoclaviculare består af lig. conoideum (medialt) og lig. trapezoideum (lateralt)."},{"id":"q16","t":"ax5.sb","q":"Hvad kaldes m. subclavius i forhold til art. sternoclavicularis?","o":["Discus","Dynamisk ligament","Labrum","Bursa"],"c":1,"e":"M. subclavius er et dynamisk ligament, der trækker medialt og nedad."},{"id":"q17","t":"ax5.sb","q":"Hvorfor er art. scapulothoracalis ikke et ægte led?","o":["Den har ingen bevægelighed","Bevægelserne sker i en bindevævsspalte mellem m. serratus anterior og thoraxvæg","Den har to ledhuler","Den er en syndesmose mellem clavicula og sternum"],"c":1,"e":"Der er hverken ledhule eller ledkapsel: knogle – muskel – bindevæv – knogle."},{"id":"q18","t":"ax5.sb","q":"Hvor stor en andel af abduktionen står scapula for (over 30° i frontalplanet)?","o":["Ca. 1/10","Ca. 1/3","Ca. 1/2","Hele abduktionen"],"c":1,"e":"Scapula bidrager med 1/3 af abduktionen."},{"id":"q19","t":"ax5.sb","q":"Hvad er funktionen af art. acromioclavicularis?","o":["Kun små forskydninger – forlænger bevægelserne fra art. sternoclavicularis","Stor bevægelighed i alle planer","Den låser clavicula fast til scapula","Den bærer kropsvægten ved hængen i armene"],"c":0,"e":"AC-leddet tillader små forskydninger/medbevægelser."},{"id":"q20","t":"ax5.hu","q":"Hvordan klassificeres art. humeri?","o":["Ægte, enkelt kugleled","Ægte, sammensat hængselled","Uægte led","Ægte, kombineret drejeled"],"c":0,"e":"Art. humeri er et ægte, enkelt kugleled mellem scapula og humerus."},{"id":"q21","t":"ax5.hu","q":"Hvor stor en del af caput humeri artikulerer med cavitas glenoidalis?","o":["Ca. 1/3","Ca. 1/2","Ca. 2/3","Hele caput"],"c":0,"e":"Cavitas glenoidalis artikulerer kun med ca. 1/3 af caput humeri – derfor stor mobilitet og lav stabilitet."},{"id":"q22","t":"ax5.hu","q":"Hvilken struktur forstørrer cavitas glenoidalis?","o":["Labrum glenoidale","Lig. coracoacromiale","Recessus axillaris","Bursa subacromialis"],"c":0,"e":"Labrum glenoidale forstørrer ledskålen, så mere af caput humeri dækkes."},{"id":"q23","t":"ax5.hu","q":"Hvad er en betingelse for skulderleddets store bevægelighed i kapslen?","o":["En stram kapsel","En meget løs kapsel med recessus axillaris nedadtil","En discus articularis","Manglende synovialmembran"],"c":1,"e":"Kapslen er meget løs, og den store omslagsfold nedadtil (recessus axillaris) er betingelsen for den store bevægelighed."},{"id":"q24","t":"ax5.hu","q":"Hvilke ligamenter kaldes 'abe-ligamenterne'?","o":["Ligg. glenohumeralia","Lig. coracohumerale","Lig. coracoclaviculare","Lig. transversum scapulae"],"c":0,"e":"Ligg. glenohumeralia (superius, medius, inferius) kan bære kropsvægten ved hængen i armene."},{"id":"q25","t":"ax5.hu","q":"Hvilket ligament er 'indkøbspose-ligamentet' og begrænser udadrotation?","o":["Lig. coracohumerale","Lig. coracoacromiale","Lig. acromioclaviculare","Lig. conoideum"],"c":0,"e":"Lig. coracohumerale løber fra processus coracoideus til tuberculum majus og aflaster m. supraspinatus."},{"id":"q26","t":"ax5.hu","q":"Hvilken sene løber intraartikulært i skulderleddet?","o":["Caput longum af m. biceps brachii","Caput breve af m. biceps brachii","Senen fra m. supraspinatus","Senen fra m. deltoideus"],"c":0,"e":"Caput longum af m. biceps brachii løber intraartikulært, dækket af vagina synovialis intertubercularis."},{"id":"q27","t":"ax5.hu","q":"Hvilken muskel hører IKKE til rotatormanchetten?","o":["M. supraspinatus","M. infraspinatus","M. teres minor","M. teres major"],"c":3,"e":"Rotatormanchetten består af m. subscapularis, m. supraspinatus, m. infraspinatus og m. teres minor."},{"id":"q28","t":"ax5.hu","q":"Hvilken bursa kommunikerer med bursa subacromialis?","o":["Bursa subdeltoidea","Bursa subtendinea m. subscapularis","Bursa subcutanea olecrani","Bursa subtendinea tricipitis brachii"],"c":0,"e":"Bursa subdeltoidea kommunikerer med bursa subacromialis."},{"id":"q29","t":"ax5.hu","q":"Omkring hvilken akse foregår fleksion–ekstension i art. humeri?","o":["Sagittal","Transversal","Vertikal","Ingen – leddet har kun rotation"],"c":1,"e":"Transversal akse: fleksion/ekstension. Sagittal akse: abduktion/adduktion. Vertikal akse: rotation."},{"id":"q30","t":"ax5.hu","q":"Hvad er bevægeomfanget for ekstension i art. humeri?","o":["0–180°","0–90°","0–75°","0–60°"],"c":3,"e":"Ekstension 0–60°. Fleksion 0–180°, adduktion 0–75°, indadrotation 0–90°, udadrotation 0–70°."},{"id":"q31","t":"ax5.hu","q":"Hvad sker der med humerus ved abduktion over 90° i scapulas plan?","o":["Indadrotation","Udadrotation, så lig. glenohumeralia afspændes","Ingen rotation","Maksimal ekstension"],"c":1,"e":"Humerus udadroteres, så ligg. glenohumeralia afspændes, og tuberculum majus får plads under acromion."},{"id":"q32","t":"ax5.hu","q":"Hvad sker der med humerus ved fleksion til 180°?","o":["Udadrotation","Indadrotation, så epicondylus medialis vendes fremad","Adduktion","Supination"],"c":1,"e":"Ved fleksion til 180° sker en indadrotation, så epicondylus medialis vendes fremad."},{"id":"q33","t":"ax5.hu","q":"Hvilke fire strukturer stabiliserer art. humeri?","o":["Rotatormanchet, labrum glenoidale, bicepssenen og ligamenterne","Discus, meniscus, labrum og kapsel","Bursae, discus, fedtpude og labrum","Kun m. deltoideus"],"c":0,"e":"Stabiliteten ligger udelukkende i muskler og ligamenter – de fire hovedstrukturer er rotatormanchet, labrum, bicepssene og ligamenter."},{"id":"q34","t":"ax5.kn","q":"Hvilken struktur på radius er insertion for m. biceps brachii?","o":["Tuberositas radii","Tuberculum dorsale","Processus styloideus radii","Incisura ulnaris"],"c":0,"e":"Tuberositas radii = insertion for m. biceps brachii."},{"id":"q35","t":"ax5.kn","q":"Hvilken muskel hæfter på tuberositas ulnae?","o":["M. brachialis","M. biceps brachii","M. triceps brachii","M. pronator teres"],"c":0,"e":"Tuberositas ulnae er insertion for m. brachialis."},{"id":"q36","t":"ax5.kn","q":"Hvad fungerer tuberculum dorsale radii (Listers tuberkel) som?","o":["Trisse for tendo m. extensor pollicis longus","Ledskål for caput ulnae","Ledhoved mod håndroden","Insertion for m. brachialis"],"c":0,"e":"Tuberculum dorsale er en trisse for tendo m. extensor pollicis longus."},{"id":"q37","t":"ax5.kn","q":"Hvilke to strukturer danner incisura trochlearis?","o":["Olecranon og processus coronoideus","Caput ulnae og processus styloideus","Caput radii og collum radii","Olecranon og tuberositas ulnae"],"c":0,"e":"Incisura trochlearis dannes af olecranon og processus coronoideus og griber om trochlea humeri."},{"id":"q38","t":"ax5.kn","q":"Hvilken struktur på ulna er ledskål for caput radii?","o":["Incisura radialis","Incisura trochlearis","Olecranon","Processus styloideus"],"c":0,"e":"Incisura radialis ulnae er ledskålen for caput radii (art. radioulnaris proximalis)."},{"id":"q39","t":"ax5.cu","q":"Hvordan klassificeres art. cubiti som helhed?","o":["Ægte, sammensat led (hængselled med indbygget drejeled)","Ægte, enkelt kugleled","Ægte, enkelt hængselled","Syndesmose"],"c":0,"e":"Art. cubiti er et ægte, sammensat led: hængselled med indbygget drejeled."},{"id":"q40","t":"ax5.cu","q":"Hvilke delled indgår i art. cubiti?","o":["Humeroulnaris, humeroradialis og radioulnaris proximalis","Humeroulnaris, humeroradialis og radioulnaris distalis","Glenohumeralis, humeroulnaris og humeroradialis","Sternoclavicularis, humeroulnaris og humeroradialis"],"c":0,"e":"Art. radioulnaris distalis ligger ved håndleddet og hører ikke til albueleddet."},{"id":"q41","t":"ax5.cu","q":"Hvad er ledhovedet i art. humeroulnaris?","o":["Trochlea humeri","Capitulum humeri","Caput radii","Caput ulnae"],"c":0,"e":"Trochlea humeri (trisseformet) er ledhoved; incisura trochlearis ulnae er ledskål."},{"id":"q42","t":"ax5.cu","q":"Hvorfor kaldes art. humeroradialis et 'indskrænket' kugleled?","o":["Fordi radius er tæt bundet til ulna","Fordi den mangler ledkapsel","Fordi den kun har én knogle","Fordi den ligger uden for kapslen"],"c":0,"e":"Radius er tæt bundet til ulna, så der er ingen kugleledsfunktion – leddet faciliterer kun rotation og fleksion/ekstension."},{"id":"q43","t":"ax5.cu","q":"Hvad danner en osteofibrøs ring sammen med incisura radialis ulnae?","o":["Lig. anulare radii","Lig. collaterale ulnare","Membrana interossea","Discus articularis"],"c":0,"e":"Lig. anulare radii er let tragtformet og omslutter caput/collum radii."},{"id":"q44","t":"ax5.cu","q":"Hvad er stopstrukturen for ekstension i albueleddet?","o":["Ossøs og ligamentøs (fossa olecrani)","Muskuløs (bløddelsstop)","Kun ledkapslen","Discus articularis"],"c":0,"e":"Fleksion stoppes af bløddele (muskuløst), ekstension af knogle og ligamenter."},{"id":"q45","t":"ax5.cu","q":"Hvorfor hæfter lig. collaterale radiale i lig. anulare og ikke direkte på radius?","o":["For ikke at indskrænke supination og pronation","For at forhindre ekstension","Fordi radius mangler periost","For at stabilisere art. humeri"],"c":0,"e":"Hvis det hæftede på radius, ville det begrænse rotationen af radius."},{"id":"q46","t":"ax5.cu","q":"Hvilke muskler er kapselstrammere i albueleddet?","o":["M. triceps brachii og m. brachialis","M. biceps brachii og m. brachioradialis","M. pronator teres og m. supinator","M. anconeus og m. pronator quadratus"],"c":0,"e":"De forhindrer, at kapslen klemmes."},{"id":"q47","t":"ax5.cu","q":"Hvilken fossa udfylder subsynovialt fedt ved ekstension?","o":["Fossa coronoidea","Fossa olecrani","Fossa radialis","Fossa infraspinata"],"c":0,"e":"Fedtpuden udfylder fossa olecrani ved fleksion og fossa coronoidea ved ekstension."},{"id":"q48","t":"ax5.cu","q":"Hvilken muskel fleksionerer især ved supination?","o":["M. biceps brachii","M. pronator teres","M. triceps brachii","M. anconeus"],"c":0,"e":"M. biceps brachii er især aktiv ved supination; m. pronator teres ved pronation."},{"id":"q49","t":"ax5.cu","q":"Hvad er den typiske cubitalvinkel?","o":["150°","170°","190°","120°"],"c":1,"e":"Typisk 170°. Cubital varus > 170°, cubital valgus < 170°."},{"id":"q50","t":"ax5.cu","q":"Cubital valgus er en cubitalvinkel på...","o":["Mindre end 170°","Præcis 170°","Mere end 170°","Mere end 190°"],"c":0,"e":"Valgus < 170°, varus > 170°."},{"id":"q51","t":"ax5.cu","q":"Hvilken bursa er involveret i 'students elbow'?","o":["Bursa subcutanea olecrani","Bursa subacromialis","Bursa subdeltoidea","Bursa subtendinea m. subscapularis"],"c":0,"e":"Students elbow er bursitis i bursa subcutanea olecrani."},{"id":"q52","t":"ax5.ru","q":"Hvordan går aksen for supination–pronation?","o":["Fra caput radii til caput ulnae og ned gennem 5. finger","Fra olecranon til tommelfingeren","Fra epicondylus medialis til 2. finger","Tværs gennem humerus"],"c":0,"e":"Aksen løber fra caput radii til caput ulnae og ned gennem 5. finger."},{"id":"q53","t":"ax5.ru","q":"Hvilke muskler pronerer underarmen?","o":["M. pronator teres og m. pronator quadratus","M. supinator og m. biceps brachii","M. triceps brachii og m. anconeus","M. brachialis og m. brachioradialis"],"c":0,"e":"Pronation: m. pronator teres og m. pronator quadratus. Supination: m. supinator og m. biceps brachii."},{"id":"q54","t":"ax5.ru","q":"Hvilken muskel kan både supinere og pronere til kantstilling?","o":["M. brachioradialis","M. supinator","M. pronator quadratus","M. brachialis"],"c":0,"e":"M. brachioradialis bringer underarmen i kantstilling."},{"id":"q55","t":"ax5.ru","q":"Hvordan er fiberretningen i membrana interossea antebrachii?","o":["Fra radius skråt distalt-ulnart","Fra ulna skråt distalt-radialt","Kun tværgående","Kun langsgående"],"c":0,"e":"Fibrene løber fra radius skråt distalt-ulnart; proksimalt findes også radiale fibre (chorda obliqua)."},{"id":"q56","t":"ax5.ru","q":"Hvilken form har discus articularis i art. radioulnaris distalis?","o":["Trekantet","Kileformet","Ringformet","Rund"],"c":0,"e":"Den trekantede discus binder processus styloideus ulnae til incisura ulnaris radii."},{"id":"q57","t":"ax5.ru","q":"Hvad er bevægeomfanget for supination–pronation?","o":["80–0–80°","150–0°","40–0–40°","180–0–180°"],"c":0,"e":"Supination–pronation: 80–0–80°."},{"id":"q58","t":"ax5.kl","q":"Scapulae alatae skyldes skade på hvilken nerve?","o":["N. thoracicus longus","N. axillaris","N. radialis","N. medianus"],"c":0,"e":"N. thoracicus longus innerverer m. serratus anterior, som holder scapula ind mod thorax."},{"id":"q59","t":"ax5.kl","q":"Hvad sker der ved subluxatio caput radii (nursemaid's elbow)?","o":["Caput radii lukserer nedadtil og klemmes i lig. anulare radii","Olecranon brækker","Humerus lukserer fremad","Lig. collaterale ulnare rives over"],"c":0,"e":"Ses hos børn under 5 år ved træk i ekstenderet og proneret arm. Behandling: reponering af radius."},{"id":"q60","t":"ax5.kl","q":"Hvilket ligament er meget stærkt og relevant ved Colles-fraktur?","o":["Lig. radiocarpale palmare","Lig. anulare radii","Lig. collaterale ulnare","Lig. coracohumerale"],"c":0,"e":"Lig. radiocarpale palmare er stærkere end knoglevævet i radius: ved et fald holder båndet, mens radius overrives proksimalt for tilhæftningen."},{"id":"ax6-q1","t":"ax6.ml","q":"Hvad er punctum fixum?","o":["Punktet, der bevæger sig, som regel insertionen","Punktet, der som regel ikke bevæger sig, som regel udspringet","Midten af muskelbugen","Senens overgang til knoglehinden"],"c":1,"e":"Punctum fixum er som regel udspringet og bevæger sig ikke. Punctum mobile er som regel insertionen."},{"id":"ax6-q2","t":"ax6.ml","q":"En muskel arbejder under forlængelse. Hvilken kontraktionstype er det?","o":["Koncentrisk","Excentrisk","Isometrisk","Tonisk"],"c":1,"e":"Excentrisk: musklen arbejder under forlængelse. Koncentrisk: forkortes. Isometrisk: arbejder uden bevægelse."},{"id":"ax6-q3","t":"ax6.ml","q":"Hvilken muskeltype har fibre på kun den ene side af senebladet?","o":["Fusiform","Semipennat","Bipennat","Multipennat"],"c":1,"e":"Semipennat er grundformen. Pennat (bipennat) er to semipennate enheder, og multipennat er flere."},{"id":"ax6-q4","t":"ax6.ml","q":"M. brachioradialis er navngivet efter…","o":["Tilhæftning","Form","Antal hoveder","Størrelse"],"c":0,"e":"Tilhæftning: m. brachioradialis og m. coracobrachialis. Form: m. piriformis. Antal hoveder: m. biceps brachii."},{"id":"ax6-q5","t":"ax6.sm","q":"Hvilken gruppe hører m. subclavius til?","o":["Dorsal gruppe","Ventral gruppe","Lateral gruppe","Rotatormanchetten"],"c":1,"e":"De ventrale skuldermuskler er m. pectoralis major og minor, m. serratus anterior og m. subclavius."},{"id":"ax6-q6","t":"ax6.sm","q":"Hvilke muskler hører IKKE til rotatormanchetten?","o":["M. supraspinatus og m. infraspinatus","M. teres minor og m. subscapularis","M. deltoideus og m. teres major","M. infraspinatus og m. teres minor"],"c":2,"e":"Rotatormanchetten er supraspinatus, infraspinatus, teres minor og subscapularis."},{"id":"ax6-q7","t":"ax6.sm","q":"Hvilke to muskler innerveres af n. axillaris?","o":["M. deltoideus og m. teres minor","M. deltoideus og m. teres major","M. supraspinatus og m. infraspinatus","M. subscapularis og m. teres major"],"c":0,"e":"N. axillaris innerverer m. deltoideus og m. teres minor. Nn. subscapulares innerverer subscapularis og teres major."},{"id":"ax6-q8","t":"ax6.sm","q":"Hvilke muskler danner den bagerste axilfold?","o":["M. pectoralis major og minor","M. latissimus dorsi og m. teres major","M. deltoideus og m. teres minor","M. serratus anterior og m. subscapularis"],"c":1,"e":"M. latissimus dorsi og m. teres major danner den bagerste axilfold. M. pectoralis major danner den forreste."},{"id":"ax6-q9","t":"ax6.ry","q":"Hvilken nerve innerverer m. trapezius?","o":["N. dorsalis scapulae","N. thoracodorsalis","N. accessorius (XI)","N. suprascapularis"],"c":2,"e":"M. trapezius: n. accessorius. Mm. rhomboidei og levator scapulae: n. dorsalis scapulae. M. latissimus dorsi: n. thoracodorsalis."},{"id":"ax6-q10","t":"ax6.ry","q":"Hvilken del af m. trapezius giver adduktion af scapula?","o":["Pars descendens","Pars horisontalis","Pars ascendens","Alle tre lige meget"],"c":1,"e":"Pars descendens: elevation + udadrotation. Pars horisontalis: adduktion. Pars ascendens: depression + udadrotation."},{"id":"ax6-q11","t":"ax6.ry","q":"Hvor hæfter m. latissimus dorsi på humerus?","o":["Tuberculum majus","Crista tuberculi minoris","Tuberositas deltoidea","Crista tuberculi majoris"],"c":1,"e":"M. latissimus dorsi og m. teres major hæfter på crista tuberculi minoris."},{"id":"ax6-q12","t":"ax6.ry","q":"Hvad er funktionen af m. levator scapulae?","o":["Elevation af scapula","Abduktion af scapula","Udadrotation af scapula","Depression af scapula"],"c":0,"e":"Elevation (sammen med m. trapezius) og indadrotation af scapula samt sidebøjning af columna. Nerve: n. dorsalis scapulae."},{"id":"ax6-q13","t":"ax6.ry","q":"Hvorfor kan m. latissimus dorsi fungere som accessorisk eksspirationsmuskel?","o":["Den udspringer fra costae 1–3","På grund af musklens forløb","Den er innerveret af n. phrenicus","Den hæfter på sternum"],"c":1,"e":"Pga. forløbet kan den hjælpe ved fx hostestød."},{"id":"ax6-q14","t":"ax6.br","q":"Hvilken nerve innerverer m. serratus anterior?","o":["N. thoracodorsalis","N. dorsalis scapulae","N. thoracicus longus","N. subclavius"],"c":2,"e":"Skade på n. thoracicus longus giver scapula alata (englevinger)."},{"id":"ax6-q15","t":"ax6.br","q":"Hvor udspringer m. pectoralis minor, og hvor hæfter den?","o":["Costa 3–5 til proc. coracoideus","Costa 1 til clavicula","Sternum til crista tuberculi majoris","Costa 1–8 til margo medialis scapulae"],"c":0,"e":"M. pectoralis minor: costa 3–5 til proc. coracoideus. Den trækker scapula fremad og nedad."},{"id":"ax6-q16","t":"ax6.br","q":"Hvilken rolle har m. subclavius for art. sternoclavicularis?","o":["Dynamisk ligament","Kapselstrammer","Fiksator af humerus","Synergist for pectoralis major"],"c":0,"e":"M. subclavius fikserer clavicula og fungerer som dynamisk ligament for art. sternoclavicularis."},{"id":"ax6-q17","t":"ax6.br","q":"Hvilken funktion har m. pectoralis major IKKE?","o":["Fleksion af humerus","Adduktion af humerus","Indadrotation af humerus","Udadrotation af humerus"],"c":3,"e":"M. pectoralis major: fleksion, adduktion og indadrotation af humerus."},{"id":"ax6-q18","t":"ax6.la","q":"Hvilken del af m. deltoideus giver abduktion?","o":["Pars anterior","Pars media","Pars posterior","Ingen, det gør kun supraspinatus"],"c":1,"e":"Pars media: abduktion (synergi med m. supraspinatus). Pars anterior: fleksion, indadrotation, adduktion. Pars posterior: ekstension, udadrotation, adduktion."},{"id":"ax6-q19","t":"ax6.la","q":"Hvad hedder spalten mellem m. deltoideus og m. pectoralis major?","o":["Trigonum clavipectorale","Subacromialrummet","Foramen quadrilaterum","Fossa infraclavicularis"],"c":0,"e":"Trigonum clavipectorale: her løber v. cephalica, og proc. coracoideus kan palperes i dybden."},{"id":"ax6-q20","t":"ax6.rm","q":"Hvilken rotatormanchetmuskel hæfter på tuberculum minus?","o":["M. supraspinatus","M. infraspinatus","M. teres minor","M. subscapularis"],"c":3,"e":"M. subscapularis er den eneste, der hæfter på tuberculum minus. De øvrige hæfter på tuberculum majus."},{"id":"ax6-q21","t":"ax6.rm","q":"Hvilken nerve innerverer både m. supraspinatus og m. infraspinatus?","o":["N. axillaris","N. suprascapularis","Nn. subscapulares","N. radialis"],"c":1,"e":"N. suprascapularis innerverer supraspinatus og infraspinatus."},{"id":"ax6-q22","t":"ax6.rm","q":"Hvilken rotatormanchetmuskel initierer abduktion?","o":["M. supraspinatus","M. infraspinatus","M. teres minor","M. subscapularis"],"c":0,"e":"M. supraspinatus initierer abduktionen. Ved parese ses besvær med abduktion og positiv droparm-test."},{"id":"ax6-q23","t":"ax6.rm","q":"Hvilken bevægelse laver m. infraspinatus?","o":["Indadrotation","Udadrotation","Adduktion","Fleksion"],"c":1,"e":"Udadrotation af art. humeri (samt stabilitet). Indadrotation laves af m. subscapularis."},{"id":"ax6-q24","t":"ax6.ov","q":"Hvilken nerve innerverer alle tre muskler i overarmens forreste loge?","o":["N. radialis","N. medianus","N. musculocutaneus","N. ulnaris"],"c":2,"e":"Forreste fleksorloge (biceps, coracobrachialis, brachialis): n. musculocutaneus. Bagerste ekstensorloge (triceps): n. radialis."},{"id":"ax6-q25","t":"ax6.ov","q":"Hvor hæfter m. brachialis?","o":["Tuberositas radii","Tuberositas ulnae og ledkapslen","Olecranon","Epicondylus medialis"],"c":1,"e":"Tuberositas ulnae (på proc. coronoideus) og ledkapslen i art. cubiti (kapselstrammer). Funktion: fleksion af albuen."},{"id":"ax6-q26","t":"ax6.ov","q":"Hvor løber caput longum af m. biceps brachii?","o":["Uden for ledkapslen på forsiden af humerus","Inde i art. humeri, beklædt af synovialis","Bag om collum chirurgicum","Gennem foramen quadrilaterum"],"c":1,"e":"Caput longum løber inde i art. humeri (vagina synovialis intertubercularis) og forlader leddet gennem sulcus intertubercularis."},{"id":"ax6-q27","t":"ax6.ov","q":"Hvilken funktion har m. biceps brachii i radioulnarleddet?","o":["Pronation","Supination","Ekstension","Adduktion"],"c":1,"e":"Albueled: fleksion. Radioulnarled: supination. Skulderled: let fleksion + stabilitet."},{"id":"ax6-q28","t":"ax6.ov","q":"Hvor udspringer caput longum af m. triceps brachii?","o":["Tuberculum supraglenoidale","Tuberculum infraglenoidale","Proc. coracoideus","Bag på humerus, distalt for sulcus n. radialis"],"c":1,"e":"Caput longum: tuberculum infraglenoidale. Caput laterale og mediale udspringer på humerus, hhv. proksimalt og distalt for sulcus n. radialis."},{"id":"ax6-q29","t":"ax6.ov","q":"Hvilken muskel perforeres af n. musculocutaneus?","o":["M. biceps brachii","M. brachialis","M. coracobrachialis","M. triceps brachii"],"c":2,"e":"M. coracobrachialis perforeres af n. musculocutaneus (spot)."},{"id":"ax6-q30","t":"ax6.hk","q":"Hvilken knogle har en saddelformet ledfacet til pollex?","o":["Os scaphoideum","Os trapezium","Os capitatum","Os hamatum"],"c":1,"e":"Os trapezium danner saddelled med os metacarpale 1."},{"id":"ax6-q31","t":"ax6.hk","q":"Hvilken carpalknogle er størst og omdrejningspunkt?","o":["Os capitatum","Os lunatum","Os hamatum","Os trapezoideum"],"c":0,"e":"Os capitatum er størst og omdrejningspunkt. Den prominerer ind i den proksimale række."},{"id":"ax6-q32","t":"ax6.hk","q":"Hvilken carpalknogle bærer hamulus?","o":["Os pisiforme","Os triquetrum","Os hamatum","Os trapezium"],"c":2,"e":"Os hamatum har hamulus ossis hamati."},{"id":"ax6-q33","t":"ax6.hk","q":"Hvilken carpalknogle hører til den proksimale række?","o":["Os trapezoideum","Os lunatum","Os capitatum","Os hamatum"],"c":1,"e":"Proksimal række: scaphoideum, lunatum, triquetrum, pisiforme. Distal række: trapezium, trapezoideum, capitatum, hamatum."},{"id":"ax6-q34","t":"ax6.hk","q":"Hvilken finger mangler phalanx media?","o":["Index","Digitus medius","Pollex","Digitus minimus"],"c":2,"e":"Pollex har ikke et mellemstykke, men kraftigere grund- og yderstykke."},{"id":"ax6-q35","t":"ax6.hk","q":"Hvordan er os metacarpale 1 orienteret?","o":["Udadroteret 70 grader","Indadroteret 70 grader og forskudt palmart","Parallel med de andre","Forskudt dorsalt"],"c":1,"e":"Os metacarpale 1 er kortere og tykkere, indadroteret 70 grader og forskudt palmart."},{"id":"ax6-q36","t":"ax6.kl","q":"Hvorfor er en proksimal fraktur af os scaphoideum problematisk?","o":["Knoglen mangler periost helt","Blodforsyningen kommer distalt fra og kan afbrydes, så knoglen ikke heler","Nervus medianus klemmes altid","Lig. anulare rives over"],"c":1,"e":"Kun den distale del er velforsynet. Proksimal fraktur kan give pseudoartrose og iskæmi med risiko for håndledsarthrose."},{"id":"ax6-q37","t":"ax6.kl","q":"En patient over 50 har haft et mildt skuldertraume og kan ikke abducere armen, og droparm-testen er positiv. Hvad mistænker du?","o":["Ruptur af m. supraspinatus","Lammelse af n. thoracicus longus","Fraktur af os scaphoideum","Skade på m. biceps' ulnare sene"],"c":0,"e":"M. supraspinatus er den rotatormanchetmuskel, der oftest rumperer, og risikoen stiger med alderen."},{"id":"ax7-q1","t":"ax7.hl","q":"Hvilken ledtype er art. radiocarpalis?","o":["Ægte, enkelt kugleled","Ægte, sammensat ellipsoidled","Ægte, enkelt saddelled","Uægte led"],"c":1,"e":"Art. radiocarpalis er et ægte, sammensat ellipsoidled ('det egentlige håndled')."},{"id":"ax7-q2","t":"ax7.hl","q":"Hvilke knogler udgør ledhovedet i art. radiocarpalis?","o":["Scaphoideum, lunatum og triquetrum","Scaphoideum, lunatum og pisiforme","Capitatum, hamatum og triquetrum","Trapezium, trapezoideum og capitatum"],"c":0,"e":"Scaphoideum, lunatum og triquetrum (ikke pisiforme) + de interossøse ligamenter."},{"id":"ax7-q3","t":"ax7.hl","q":"Hvilke ligamenter er involveret i Colles' fraktur?","o":["Lig. radiocarpale palmare","Lig. collaterale carpi ulnare","Lig. pisohamatum","Lig. carpi radiatum"],"c":0,"e":"Lig. radiocarpale palmare kan fremtvinge en avulsionsfraktur af distale radius ved fald på udstrakt hånd."},{"id":"ax7-q4","t":"ax7.hl","q":"Hvad udgør ledhoved i art. mediocarpalis?","o":["Os scaphoideum","Os capitatum","Os hamatum","Os lunatum"],"c":1,"e":"Os capitatum rager ind i den proksimale række og fungerer som ledhoved."},{"id":"ax7-q5","t":"ax7.hl","q":"Hvilke bevægeudslag har håndleddet for ulnar- og radialfleksion?","o":["20–0–60°","60–0–20° (ulnar–radial)","80–0–80°","45–0–45°"],"c":1,"e":"Ulnarfleksion–radialfleksion: 60–0–20°. Palmar- og dorsalfleksion: 80–0–80°."},{"id":"ax7-q6","t":"ax7.fl","q":"Hvilken ledtype er MCP-leddet (fingrenes grundled)?","o":["Hængselled","Indskrænket kugleled","Saddelled","Glideled"],"c":1,"e":"Ægte, enkelt, indskrænket kugleled. PIP og DIP er hængselled."},{"id":"ax7-q7","t":"ax7.fl","q":"Hvorfor er MCP-leddets sidebevægelser indskrænket ved fleksion?","o":["Kapslen er stram ved fleksion","Ligg. collateralia forløber dorsalt for aksen og strammes ved fleksion","Volarpladerne blokerer leddet","Sesamknoglerne låser leddet"],"c":1,"e":"Ligg. collateralia er løse ved ekstension og strammes ved fleksion."},{"id":"ax7-q8","t":"ax7.fl","q":"Hvilken muskel flekterer DIP-leddet?","o":["M. flexor digitorum superficialis","M. flexor digitorum profundus","Mm. lumbricales","M. extensor digitorum"],"c":1,"e":"DIP flekteres kun af m. flexor digitorum profundus. PIP flekteres af både superficialis og profundus."},{"id":"ax7-q9","t":"ax7.fl","q":"Hvilken ledtype er tommelens CMC-led?","o":["Hængselled","Kugleled","Saddelled","Glideled"],"c":2,"e":"Ægte, enkelt saddelled mellem os trapezium og basis af metacarpal I."},{"id":"ax7-q10","t":"ax7.fl","q":"Hvilken bevægelse består af abduktion, fleksion og medialrotation af tommelen?","o":["Reposition","Opposition","Cirkumduktion","Adduktion"],"c":1,"e":"Opposition = abduktion + fleksion + medialrotation (mod digitus minimus)."},{"id":"ax7-q11","t":"ax7.gr","q":"Hvilket greb er kendetegnet ved MCP-fleksion og PIP-/DIP-ekstension, uden håndledsinvolvering?","o":["Kraftgreb","Præcisionsgreb","Længdegreb","Nøglegreb"],"c":1,"e":"Præcisionsgreb (pincetgreb). Håndleddet er ikke involveret, kun håndens egne muskler."},{"id":"ax7-q12","t":"ax7.uf","q":"Hvilken muskel i fleksorlogen innerveres af n. ulnaris?","o":["M. pronator teres","M. flexor carpi radialis","M. flexor carpi ulnaris","M. flexor pollicis longus"],"c":2,"e":"M. flexor carpi ulnaris (og den ulnare del af FDP). Resten innerveres af n. medianus."},{"id":"ax7-q13","t":"ax7.uf","q":"Hvilke muskler udgør 3. lag af fleksorlogen?","o":["M. flexor digitorum superficialis","M. flexor digitorum profundus og m. flexor pollicis longus","M. pronator quadratus","M. palmaris longus og m. flexor carpi ulnaris"],"c":1,"e":"1. lag: 4 muskler. 2. lag: FDS. 3. lag: FDP + FPL. 4. lag: pronator quadratus."},{"id":"ax7-q14","t":"ax7.uf","q":"Hvad går igennem chiasma tendinum?","o":["Senerne fra FDS","Senerne fra FDP","Senerne fra m. palmaris longus","N. medianus"],"c":1,"e":"FDS' sener spaltes, og FDP's sener passerer imellem snipperne for at inserere på yderstykket."},{"id":"ax7-q15","t":"ax7.uf","q":"Hvad løber mellem de to hoveder af m. pronator teres?","o":["N. ulnaris","N. medianus","N. radialis","A. radialis"],"c":1,"e":"N. medianus passerer mellem caput humerale og caput ulnare."},{"id":"ax7-q16","t":"ax7.ue","q":"Hvilken kulisse indeholder m. extensor pollicis longus?","o":["1. kulisse","2. kulisse","3. kulisse (skråkulissen)","4. kulisse"],"c":2,"e":"3. kulisse: m. extensor pollicis longus. 1: APL + EPB. 2: ECRL + ECRB. 4: ED + extensor indicis. 5: EDM. 6: ECU."},{"id":"ax7-q17","t":"ax7.ue","q":"Hvilken kulisse indeholder m. extensor carpi ulnaris?","o":["3. kulisse","4. kulisse","5. kulisse","6. kulisse"],"c":3,"e":"6. kulisse. 5. kulisse er m. extensor digiti minimi."},{"id":"ax7-q18","t":"ax7.ue","q":"Hvilken nerve innerverer alle underarmens ekstensorer?","o":["N. medianus","N. ulnaris","N. radialis","N. musculocutaneus"],"c":2,"e":"N. radialis: direkte til brachioradialis og ECRL, resten via r. profundus."},{"id":"ax7-q19","t":"ax7.ue","q":"Hvad hedder r. profundus n. radialis efter passagen gennem m. supinator?","o":["N. interosseus anterior","N. interosseus posterior","N. cutaneus antebrachii posterior","N. digitalis dorsalis"],"c":1,"e":"Den passerer Frohses kanal og hedder derefter n. interosseus posterior."},{"id":"ax7-q20","t":"ax7.ue","q":"Hvilke muskler kan som de eneste flektere MCP og samtidig ekstendere PIP og DIP?","o":["M. extensor digitorum","Mm. interossei og lumbricales","M. flexor digitorum superficialis","M. extensor indicis"],"c":1,"e":"Deres sener går palmart for MCP-aksen og dorsalt for PIP-/DIP-akserne via ekstensoraponeurosen."},{"id":"ax7-q21","t":"ax7.sc","q":"Hvilken sene løber mest radialt i canalis carpi?","o":["M. flexor digitorum superficialis","M. flexor digitorum profundus","M. flexor pollicis longus","M. flexor carpi radialis"],"c":2,"e":"M. flexor pollicis longus. M. flexor carpi radialis løber i sin egen kanal."},{"id":"ax7-q22","t":"ax7.sc","q":"Hvilken bursa indeholder både de profunde og de superficielle fleksorer?","o":["Bursa radialis","Bursa ulnaris","Bursa subacromialis","Bursa subtendinea"],"c":1,"e":"Bursa ulnaris. Bursa radialis indeholder senen fra m. flexor pollicis longus."},{"id":"ax7-q23","t":"ax7.pm","q":"Hvilken af følgende muskler innerveres af n. medianus?","o":["M. adductor pollicis","M. opponens pollicis","M. abductor digiti minimi","Mm. interossei dorsales"],"c":1,"e":"½ LOAF: radiale lumbricales, opponens pollicis, abductor pollicis brevis, flexor pollicis brevis."},{"id":"ax7-q24","t":"ax7.pm","q":"Hvilken muskel adducerer tommelen?","o":["M. adductor pollicis","M. opponens pollicis","M. abductor pollicis brevis","M. flexor pollicis brevis"],"c":0,"e":"M. adductor pollicis (3. lag), innerveret af n. ulnaris."},{"id":"ax7-q25","t":"ax7.pm","q":"Hvor mange mm. interossei dorsales og palmares er der?","o":["4 dorsale og 3 palmare","3 dorsale og 4 palmare","4 dorsale og 4 palmare","3 dorsale og 3 palmare"],"c":0,"e":"4 dorsale (spreder) og 3 palmare (samler)."},{"id":"ax7-q26","t":"ax7.pm","q":"Hvor udspringer mm. lumbricales?","o":["Fra metacarpalerne","Fra tendo m. flexor digitorum profundus","Fra retinaculum flexorum","Fra aponeurosis palmaris"],"c":1,"e":"De udspringer fra senerne af m. flexor digitorum profundus og inserer i ekstensoraponeurosen."},{"id":"ax7-q27","t":"ax7.pm","q":"Hvilken lokalisation har m. palmaris brevis?","o":["I subcutis over hypothenar","Under aponeurosis palmaris i 2. lag","Mellem metacarpalerne","Under fleksorretinaklet"],"c":0,"e":"M. palmaris brevis ligger i subcutis over hypothenar og rynker huden."},{"id":"ax7-q28","t":"ax7.kl","q":"Hvor skal snittet ligge ved dekompression af karpaltunnelsyndrom?","o":["Radialt for fleksorretinaklet","Ulnart for fleksorretinaklet","Dorsalt på håndleddet","Distalt i hulhånden"],"c":1,"e":"Ulnart, for at undgå den motoriske gren til thenar, som afgår radialt fra n. medianus."},{"id":"ax7-q29","t":"ax7.kl","q":"En skiløber falder og hyperabducerer tommelen. Hvilken struktur er sandsynligvis revet over?","o":["Lig. collaterale ulnare ved MCP pollicis","Lig. radiocarpale palmare","Sene fra m. extensor pollicis longus","Lig. metacarpale transversum profundum"],"c":0,"e":"Ruptur af tommelens UCL. Ubehandlet kan den give manglende nøglegrebsfunktion."},{"id":"ax8-q1","t":"ax8.kg","q":"Hvilken arterie starter OE's kar (dvs. hedder først a. axillaris)?","o":["A. subclavia ved costa 1's laterale kant","A. brachialis","A. thoracica interna","Truncus brachiocephalicus"],"c":0,"e":"A. subclavia skifter navn til a. axillaris ved lateral kant af costa 1."},{"id":"ax8-q2","t":"ax8.kg","q":"Hvad løber foran skalenerporten?","o":["A. subclavia","Plexus brachialis","V. subclavia","N. phrenicus"],"c":2,"e":"V. subclavia løber foran m. scalenus anterior; a. subclavia og plexus brachialis løber gennem porten."},{"id":"ax8-q3","t":"ax8.kg","q":"Hvilken af følgende er IKKE en gren fra a. subclavias mediale del?","o":["A. vertebralis","A. thoracica interna","Truncus costocervicalis","A. thoracica lateralis"],"c":3,"e":"A. thoracica lateralis afgår fra a. axillaris. A. subclavias grene: vertebralis, thyrocervicalis, thoracica interna og costocervicalis."},{"id":"ax8-q4","t":"ax8.fa","q":"Hvilke strukturer løber gennem det firkantede interstice?","o":["A. circumflexa scapulae","A. circumflexa humeri posterior + n. axillaris","A. profunda brachii + n. radialis","A. thoracodorsalis + n. thoracodorsalis"],"c":1,"e":"Mediale trekantede: a. circumflexa scapulae. Firkantede: a. circumflexa humeri posterior + n. axillaris. Nedre trekantede: a. profunda brachii + n. radialis."},{"id":"ax8-q5","t":"ax8.fa","q":"Hvad løber gennem det nedre trekantede interstice?","o":["N. axillaris","N. radialis + a. profunda brachii","A. circumflexa scapulae","N. ulnaris"],"c":1,"e":"N. radialis og a. profunda brachii."},{"id":"ax8-q6","t":"ax8.fa","q":"Hvilken muskel afgrænser IKKE det mediale trekantede interstice?","o":["M. teres minor","M. teres major","M. subscapularis","M. deltoideus"],"c":3,"e":"Afgrænses af teres minor, teres major, subscapularis og caput longum af triceps."},{"id":"ax8-q7","t":"ax8.fa","q":"Hvad udgør fossa axillaris' bagvæg kranielt?","o":["M. subscapularis","M. pectoralis minor","M. serratus anterior","M. latissimus dorsi"],"c":0,"e":"Kranielt m. subscapularis; kaudalt m. latissimus dorsi + m. teres major."},{"id":"ax8-q8","t":"ax8.aa","q":"Hvilken af følgende er en gren af a. axillaris' 3. stykke?","o":["A. thoracoacromialis","A. subscapularis","A. thoracica lateralis","A. thoracica superior"],"c":1,"e":"3. stykke: a. subscapularis og aa. circumflexae humeri. 2. stykke: thoracoacromialis + thoracica lateralis."},{"id":"ax8-q9","t":"ax8.aa","q":"Hvilken arterie går gennem det mediale trekantede interstice?","o":["A. circumflexa scapulae","A. circumflexa humeri posterior","A. thoracodorsalis","A. profunda brachii"],"c":0,"e":"A. circumflexa scapulae (fra a. subscapularis) går til fossa infraspinata."},{"id":"ax8-q10","t":"ax8.aa","q":"Hvilken arterie ender i m. latissimus dorsi?","o":["A. circumflexa scapulae","A. thoracodorsalis","A. thoracica lateralis","A. thoracoacromialis"],"c":1,"e":"A. thoracodorsalis følger n. thoracodorsalis mod angulus inferior."},{"id":"ax8-q11","t":"ax8.aa","q":"Hvor deler a. brachialis sig i a. radialis og a. ulnaris?","o":["I fossa axillaris","I fossa cubitalis, proksimalt for m. pronator teres","Ved håndleddet","Ved caput humeri"],"c":1,"e":"I fossa cubitalis profundt for aponeurosis m. bicipitis brachii, proksimalt for m. pronator teres."},{"id":"ax8-q12","t":"ax8.aa","q":"Hvilken arterie afgives helt proksimalt fra a. brachialis og løber gennem nedre trekantede interstice?","o":["A. profunda brachii","A. circumflexa humeri posterior","A. thoracodorsalis","A. subscapularis"],"c":0,"e":"A. profunda brachii løber sammen med n. radialis til bagsiden af overarmen."},{"id":"ax8-q13","t":"ax8.fc","q":"Hvad afgrænser fossa cubitalis lateralt og medialt?","o":["M. brachioradialis lateralt og m. pronator teres medialt","M. biceps lateralt og m. triceps medialt","M. supinator lateralt og m. brachialis medialt","M. pronator teres lateralt og m. brachioradialis medialt"],"c":0,"e":"Lateralt m. brachioradialis, medialt m. pronator teres."},{"id":"ax8-q14","t":"ax8.fc","q":"Hvilken struktur ligger superficielt i fossa cubitalis?","o":["N. medianus","V. mediana cubiti","R. profundus n. radialis","A. brachialis"],"c":1,"e":"V. mediana cubiti ligger superficielt."},{"id":"ax8-q15","t":"ax8.ar","q":"Hvorigennem træder a. ulnaris ind i hånden?","o":["Canalis carpi","Guyons kanal, superficielt for fleksorretinaklet","Tabatieren","Frohses kanal"],"c":1,"e":"A. ulnaris løber gennem Guyons kanal og fortsætter som arcus palmaris superficialis."},{"id":"ax8-q16","t":"ax8.ar","q":"Hvor ligger arcus palmaris profundus i forhold til fleksorsenerne?","o":["Prætendinøst (foran senerne)","Retrotendinøst (bag senerne)","Superficielt for aponeurosis palmaris","I subcutis"],"c":1,"e":"Arcus profundus ligger retrotendinøst. Arcus superficialis ligger prætendinøst."},{"id":"ax8-q17","t":"ax8.ar","q":"Hvilken arterie fortsætter i arcus palmaris profundus?","o":["A. ulnaris","A. radialis","A. interossea anterior","A. princeps pollicis"],"c":1,"e":"Arcus profundus er fortsættelsen af a. radialis; arcus superficialis er fortsættelsen af a. ulnaris."},{"id":"ax8-q18","t":"ax8.ar","q":"Hvor krydser a. radialis senerne i kulisse 1 og ligger i bunden af tabatieren?","o":["Ved proc. styloideus radii, hvor den snor sig om tommelens CMC-led","Ved olecranon","Ved caput ulnae","Ved pisiforme"],"c":0,"e":"Her kan pulsen mærkes."},{"id":"ax8-q19","t":"ax8.ar","q":"Hvilken arterie afgives fra a. radialis inden arcus palmaris profundus?","o":["A. princeps pollicis","A. interossea posterior","A. digitalis dorsalis","A. thoracodorsalis"],"c":0,"e":"A. princeps pollicis og a. radialis indicis."},{"id":"ax8-q20","t":"ax8.ve","q":"Hvor ender v. cephalica?","o":["I v. brachialis","I v. axillaris efter at have perforeret trigonum clavipectorale","I v. basilica","I v. jugularis interna"],"c":1,"e":"V. cephalica perforerer trigonum clavipectorale og ender i v. axillaris."},{"id":"ax8-q21","t":"ax8.ve","q":"Hvad kendetegner vv. comitantes?","o":["De er superficielle og upar","De følger arterierne og er 2 pr. arterie","De løber kun på håndryggen","De tømmer sig direkte i v. cava superior"],"c":1,"e":"Profunde vener følger arterierne, 2 pr. arterie til en vis størrelse."},{"id":"ax8-q22","t":"ax8.ve","q":"Hvilken vene løber i sulcus bicipitalis medialis og tømmer i v. brachialis?","o":["V. cephalica","V. basilica","V. mediana cubiti","V. mediana antebrachii"],"c":1,"e":"V. basilica perforerer fascia brachii midt på armen og tømmer i v. brachialis."},{"id":"ax8-q23","t":"ax8.ly","q":"Hvilke lymfeknuder modtager fra de tre fremskudte grupper og ligger ved basis af fossa axillaris?","o":["Apikale","Centrale","Laterale","Pectorale"],"c":1,"e":"De centrale knuder dræner de fremskudte (laterale, pectorale, subscapulære) og videre til de apikale."},{"id":"ax8-q24","t":"ax8.ly","q":"Hvor ender lymfen fra venstre arm?","o":["Ductus lymphaticus dxt.","Ductus thoracicus","V. cava inferior","V. azygos"],"c":1,"e":"Venstre side (den største) dræner til ductus thoracicus, højre øvre del til ductus lymphaticus dxt."},{"id":"ax9-q1","t":"ax9.ms","q":"Hvor slutter medulla spinalis?","o":["Ved foramen magnum","Mellem L1 og L2","Ved S2","Ved coccyx"],"c":1,"e":"Medulla spinalis slutter mellem L1 og L2 (conus medullaris)."},{"id":"ax9-q2","t":"ax9.ms","q":"Hvorfor findes der 8 cervicale spinalnerver, men 7 cervicale vertebrae?","o":["C1 udspringer over første cervicale hvirvel","C8 udspringer under vertebra C8","Der er en ekstra hvirvel","T1 tælles med til halsen"],"c":0,"e":"C1 udgår over første cervicale hvirvel, og C8 udgår under C7."},{"id":"ax9-q3","t":"ax9.ms","q":"Hvad forsyner ramus dorsalis af en spinalnerve?","o":["Ekstremitetsplexerne","Den dybe rygmuskulatur og huden bagpå ryggen","Bugvæggen","Tarmen"],"c":1,"e":"Ekstremitetsplexerne dannes af rami ventrales."},{"id":"ax9-q4","t":"ax9.pb","q":"Hvilke segmenter danner truncus superior?","o":["C4 + C5","C5 + C6","C7","C8 + T1"],"c":1,"e":"Truncus superior: C5 + C6. Truncus medius: C7. Truncus inferior: C8 + T1."},{"id":"ax9-q5","t":"ax9.pb","q":"Hvilke grene danner fasciculus lateralis?","o":["Anteriore grene fra truncus superior + medius","Posteriore grene fra alle trunci","Anterior gren fra truncus inferior","Posteriore grene fra truncus superior"],"c":0,"e":"Lateralis: anteriore grene fra superior + medius. Medialis: anterior gren fra inferior. Posterior: posteriore grene fra alle."},{"id":"ax9-q6","t":"ax9.pb","q":"Hvilken nerve udgår fra fasciculus posterior?","o":["N. musculocutaneus","N. ulnaris","N. radialis","N. medianus"],"c":2,"e":"Fasciculus posterior: n. axillaris og n. radialis."},{"id":"ax9-q7","t":"ax9.pb","q":"Hvilke nerver danner n. medianus?","o":["Radix lateralis fra fasciculus lateralis og radix medialis fra fasciculus medialis","Kun fasciculus posterior","Kun fasciculus medialis","Truncus superior alene"],"c":0,"e":"N. medianus har to rødder, en lateral og en medial."},{"id":"ax9-q8","t":"ax9.pb","q":"Hvad løber IKKE gennem skalenerporten?","o":["Plexus brachialis","A. subclavia","N. phrenicus","V. subclavia"],"c":3,"e":"V. subclavia løber foran m. scalenus anterior."},{"id":"ax9-q9","t":"ax9.sn","q":"Hvilken nerve innerverer m. rhomboideus og m. levator scapulae?","o":["N. thoracodorsalis","N. dorsalis scapulae","N. suprascapularis","N. subclavius"],"c":1,"e":"N. dorsalis scapulae (C4–C5) perforerer m. scalenus medius."},{"id":"ax9-q10","t":"ax9.sn","q":"Hvilken nerve løber under lig. transversum scapulae superius?","o":["N. suprascapularis","N. axillaris","N. thoracodorsalis","N. dorsalis scapulae"],"c":0,"e":"N. suprascapularis går under lig. transversum scapulae superius og innerverer supra- og infraspinatus."},{"id":"ax9-q11","t":"ax9.sn","q":"Hvilken nerve innerverer m. latissimus dorsi?","o":["N. subscapularis","N. thoracodorsalis","N. thoracicus longus","N. pectoralis lateralis"],"c":1,"e":"N. thoracodorsalis (C6–C8), som følger a. thoracodorsalis."},{"id":"ax9-q12","t":"ax9.sn","q":"Hvilken nerve perforerer m. pectoralis minor?","o":["N. pectoralis medialis","N. pectoralis lateralis","N. thoracicus longus","N. subclavius"],"c":0,"e":"N. pectoralis medialis perforerer m. pectoralis minor; lateralis fremkommer superiort og medialt for den."},{"id":"ax9-q13","t":"ax9.mu","q":"Hvilken muskel perforeres af n. musculocutaneus?","o":["M. biceps brachii","M. brachialis","M. coracobrachialis","M. deltoideus"],"c":2,"e":"N. musculocutaneus perforerer m. coracobrachialis."},{"id":"ax9-q14","t":"ax9.mu","q":"Hvad hedder n. musculocutaneus' kutane endegren?","o":["N. cutaneus brachii medialis","N. cutaneus antebrachii lateralis","N. cutaneus antebrachii posterior","N. cutaneus brachii lateralis inferior"],"c":1,"e":"N. cutaneus antebrachii lateralis følger v. cephalica."},{"id":"ax9-q15","t":"ax9.mu","q":"Hvilken nerve snor sig om collum chirurgicum?","o":["N. radialis","N. axillaris","N. ulnaris","N. medianus"],"c":1,"e":"N. axillaris går gennem det firkantede interstice og snor sig om collum chirurgicum."},{"id":"ax9-q16","t":"ax9.me","q":"Hvilken gren af n. medianus innerverer thenar og de to radiale lumbricaler?","o":["N. interosseus anterior","R. palmaris","R. muscularis","N. digitalis palmaris communis"],"c":2,"e":"R. muscularis afgår distalt for retinaklet og løber recurrent ind i thenar."},{"id":"ax9-q17","t":"ax9.me","q":"Hvilke muskler innerverer n. interosseus anterior?","o":["M. flexor digitorum profundus (radiale del), m. flexor pollicis longus og m. pronator quadratus","M. extensor digitorum og m. supinator","M. flexor carpi ulnaris og m. pronator teres","Mm. interossei"],"c":0,"e":"N. interosseus anterior er gren af n. medianus til 3. og 4. lag i fleksorlogen."},{"id":"ax9-q18","t":"ax9.me","q":"Hvilket kutant område forsynes af n. medianus?","o":["3½ radiale fingre og radiale palma","1½ ulnare finger og ulnare palma","Håndryggen radialt","Kun tommelfingeren"],"c":0,"e":"Medianus: 3½ radiale fingre palmart og radiale palma."},{"id":"ax9-q19","t":"ax9.me","q":"Hvilken muskel i thenar innerveres IKKE af n. medianus?","o":["M. opponens pollicis","M. abductor pollicis brevis","M. adductor pollicis","M. flexor pollicis brevis"],"c":2,"e":"M. adductor pollicis innerveres af n. ulnaris."},{"id":"ax9-q20","t":"ax9.ul","q":"Hvor passerer n. ulnaris til underarmen (albuestød)?","o":["Sulcus nervi radii","Sulcus nervi ulnaris bag epicondylus medialis","Foran epicondylus lateralis","Gennem canalis carpi"],"c":1,"e":"Bag epicondylus medialis i sulcus nervi ulnaris."},{"id":"ax9-q21","t":"ax9.ul","q":"Hvilken gren af n. ulnaris er rent motorisk?","o":["R. superficialis","R. dorsalis","R. profundus","R. palmaris"],"c":2,"e":"R. profundus: hypothenar, interossei, lumbricales III + IV og m. adductor pollicis."},{"id":"ax9-q22","t":"ax9.ul","q":"Hvor passerer n. ulnaris fleksorretinaklet?","o":["Gennem canalis carpi","Superficielt for retinaklet i Guyons kanal","Dybt for retinaklet","Gennem tabatieren"],"c":1,"e":"Guyons kanal, sammen med a. ulnaris."},{"id":"ax9-q23","t":"ax9.ul","q":"Hvilket kutant område forsynes af n. ulnaris dorsalt?","o":["2½ ulnare fingre","3½ radiale fingre","Kun lillefingeren","Hele håndryggen"],"c":0,"e":"Dorsalt de 2½ ulnare fingre (r. dorsalis), palmart de 1½ ulnare fingre."},{"id":"ax9-q24","t":"ax9.ra","q":"Hvor passerer n. radialis fra fossa axillaris til ekstensorlogen?","o":["Det mediale trekantede interstice","Det firkantede interstice","Det nedre trekantede interstice","Skalenerporten"],"c":2,"e":"Det nedre trekantede interstice, sammen med a. profunda brachii."},{"id":"ax9-q25","t":"ax9.ra","q":"Hvad hedder r. profundus n. radialis efter Frohses kanal?","o":["N. interosseus anterior","N. interosseus posterior","N. cutaneus antebrachii posterior","N. digitalis dorsalis"],"c":1,"e":"Efter passagen af m. supinator hedder den n. interosseus posterior."},{"id":"ax9-q26","t":"ax9.ra","q":"Hvilken gren af n. radialis er rent motorisk til underarmens ekstensorer?","o":["R. superficialis","R. profundus","N. cutaneus brachii posterior","N. cutaneus antebrachii posterior"],"c":1,"e":"R. profundus. R. superficialis er sensorisk til den radiale håndryg og 2½ radiale fingre."},{"id":"ax9-q27","t":"ax9.ki","q":"Hvilket segment repræsenterer ekstension i albuen (m. triceps brachii)?","o":["C5","C6","C7","C8"],"c":2,"e":"C5 abduktion i skulder, C6 albuefleksion (biceps), C7 albueekstension (triceps), C8 fleksion i yderled på de ulnare fingre."},{"id":"ax9-q28","t":"ax9.ki","q":"Hvilken nervelæsion giver drophånd?","o":["N. medianus","N. ulnaris","N. radialis","N. axillaris"],"c":2,"e":"N. radialis: drophånd. N. ulnaris: klohånd. N. medianus: sværgehånd."},{"id":"ax9-q29","t":"ax9.ki","q":"Hvilken læsion giver Duchenne-Erbs parese?","o":["Truncus superior (C5–C6)","Truncus inferior (C8–T1)","Fasciculus posterior","N. ulnaris"],"c":0,"e":"Duchenne-Erb: ofte truncus superior. Klumpke: ofte truncus inferior."},{"id":"ax9-q30","t":"ax9.ki","q":"Hvordan testes n. medianus motorisk?","o":["Abduktion i skulder","Opposition af tommelen (m. opponens pollicis)","Dorsalfleksion i håndled","Spredning af fingrene"],"c":1,"e":"N. medianus: m. opponens pollicis. Spredning af fingrene: n. ulnaris (interossei)."}]};

    '<div class="actions"><button class="btn again" data-a="grade" data-v="again">Igen<small>om lidt</small></button><button class="btn" data-a="grade" data-v="hard">Næsten<small>senere</small></button><button class="btn good" data-a="grade" data-v="good" data-af="1">Kunne det<small>kendt</small></button></div>'+
    '<p class="kbd">Tastatur: 1 = Igen, 2 = Næsten, 3 = Kunne det.</p>':
    '<div class="actions one"><button class="btn primary" data-a="reveal" data-af="1">Vis svar</button></div><p class="kbd">Tastatur: mellemrum viser svaret.</p>';
  var article='<article class="card"><p class="tag">'+(lab?'<b class="pill">'+lab+'</b>':'')+tag(c.t)+'</p><p class="q">'+prompt+'</p>'+
    (isImg||fig?ans+media+'<button class="linkbtn" data-a="zoom">'+(st.zoom?'Vis hele figuren':'Forstør figuren')+'</button>':ans)+'</article>';
  return {article:article,actions:actions};
}
function cardView(){
  var c=byId[C.queue[0]],p=cardParts(c,C,'');
  return '<div class="wrap">'+
  '<div class="top"><button class="linkbtn" data-a="home">Tilbage til menu</button><span class="count">'+C.queue.length+' i køen, '+C.done+' af '+C.total+' kendt</span></div>'+
  '<div class="bar"><i style="width:'+(C.done/C.total*100)+'%"></i></div>'+p.article+p.actions+'</div>';
}
function reveal(){curSt().revealed=true;render();var a=document.getElementById('ans');if(a){try{a.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}catch(e){}}}
function grade(g){
  if(S.view==='mix')return mixGrade(g);
  var id=C.queue.shift();
  if(g==='good'){known.add(id);saveKnown();C.done++;}
  else{
    var pos=Math.min(g==='again'?3:9,C.queue.length);
    C.queue.splice(pos,0,id);C.tries++;
    if(g==='again')C.missed.add(id);
  }
  C.revealed=false;C.zoom=false;
  if(!C.queue.length)S.view='cdone';
  render();window.scrollTo(0,0);
}
function cdoneView(){
  var m=C.missed.size;
  return '<div class="wrap"><h1>Runden er færdig</h1>'+
  '<p class="lede">Du har gennemgået '+C.total+' kort og markeret dem alle som kendt'+(C.tries?' efter '+C.tries+' gange, hvor du ikke kunne dem straks':'')+'.</p>'+
  '<div class="stack">'+
  (m?'<button class="btn primary" data-a="retryMissed">Gentag de '+m+' kort, du missede</button>':'')+
  '<button class="btn" data-a="again">Kør samme runde igen</button>'+
  '<button class="btn" data-a="home">Tilbage til menu</button></div></div>';
}

/* ---------- quiz ---------- */
function startQuiz(list){
  var p=list||MCQ.filter(function(q){return on(q.t);});
  if(!p.length){S.msg=!S.decks.size?'Vælg mindst én pakke.':!T.some(function(t){return on(t.k);})?'Vælg mindst ét emne.':'Ingen quizspørgsmål i det valgte.';render();return;}
  S.msg='';
  p=shuffle(p);if(!list&&prefs.qn!=='all')p=p.slice(0,Number(prefs.qn));
  Q={list:p.map(function(q){return {q:q,order:shuffle(q.o.map(function(_,i){return i;}))};}),i:0,pick:null,score:0,missed:[]};
  S.view='quiz';render();window.scrollTo(0,0);
}
function quizParts(it,pk,lab,nextLabel){
  var q=it.q,picked=pk!==null,letters=['A','B','C','D','E'];
  var opts=it.order.map(function(oi,di){
    var cls='opt';
    if(picked){if(oi===q.c)cls+=' right';else if(di===pk)cls+=' wrong';}
    return '<button class="'+cls+'" data-a="pick" data-v="'+di+'"'+(picked?' disabled':'')+'><span class="l">'+letters[di]+'</span><span>'+esc(q.o[oi])+'</span></button>';
  }).join('');
  var fb='';
  if(picked){
    var ok=it.order[pk]===q.c;
    fb='<div class="answer" tabindex="-1" id="ans"><p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Rigtigt.':'Ikke helt. Det rigtige svar er: '+esc(q.o[q.c]))+'</p><div class="ans-note" style="margin-top:0">'+fmt(q.e)+'</div></div>';
  }
  var article='<article class="card"><p class="tag">'+(lab?'<b class="pill">'+lab+'</b>':'')+tag(q.t)+'</p><p class="q">'+esc(q.q)+'</p><div class="opts">'+opts+'</div>'+fb+'</article>';
  var actions=picked?'<div class="actions one"><button class="btn primary" data-a="next" data-af="1">'+nextLabel+'</button></div>':'<p class="kbd">Tastatur: tryk 1–4 for at vælge svar.</p>';
  return {article:article,actions:actions};
}
function quizView(){
  var last=Q.i===Q.list.length-1,p=quizParts(Q.list[Q.i],Q.pick,'',last?'Se resultat':'Næste spørgsmål');
  return '<div class="wrap">'+
  '<div class="top"><button class="linkbtn" data-a="home">Afslut quiz</button><span class="count">Spørgsmål '+(Q.i+1)+' af '+Q.list.length+'</span></div>'+
  '<div class="bar"><i style="width:'+(Q.i/Q.list.length*100)+'%"></i></div>'+p.article+p.actions+'</div>';
}
function pick(di){
  if(S.view==='mix')return mixPick(di);
  if(Q.pick!==null)return;
  var it=Q.list[Q.i];Q.pick=di;
  if(it.order[di]===it.q.c)Q.score++;else Q.missed.push(it.q);
  render();
  var a=document.getElementById('ans');if(a){try{a.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}catch(e){}}
}
function next(){
  if(S.view==='mix')return mixNext();
  if(Q.i>=Q.list.length-1){S.view='qdone';render();window.scrollTo(0,0);return;}
  Q.i++;Q.pick=null;render();window.scrollTo(0,0);
}
function qdoneView(){
  var n=Q.list.length,pc=Math.round(Q.score/n*100);
  var miss=Q.missed.map(function(q){
    return '<div class="miss"><p class="mq">'+esc(q.q)+'</p><p class="ma">'+esc(q.o[q.c])+'</p><p class="me">'+fmt(q.e)+'</p></div>';
  }).join('');
  return '<div class="wrap"><h1>Resultat</h1><p class="score">'+Q.score+' / '+n+'</p>'+
  '<p class="lede">'+pc+' % rigtige.'+(Q.missed.length?' Her er de spørgsmål, du missede:':' Du svarede rigtigt på det hele.')+'</p>'+miss+
  '<div class="stack">'+(Q.missed.length?'<button class="btn primary" data-a="retryQuiz">Prøv de '+Q.missed.length+' forkerte igen</button>':'')+
  '<button class="btn" data-a="startQuiz">Ny quiz</button><button class="btn" data-a="home">Tilbage til menu</button></div></div>';
}

/* ---------- blandet runde ---------- */
function startMix(list){
  var cp,qp;
  if(list){cp=list.cards.slice();qp=list.qs.slice();}
  else{
    cp=shuffle(pool('all')).map(function(c){return c.id;});
    qp=shuffle(MCQ.filter(function(q){return on(q.t);}));
    if(prefs.qn!=='all'){var n=Number(prefs.qn);cp=cp.slice(0,n);qp=qp.slice(0,n);}
  }
  if(!cp.length&&!qp.length){S.msg=!S.decks.size?'Vælg mindst én pakke.':!T.some(function(t){return on(t.k);})?'Vælg mindst ét emne.':'Ingen kort at vise. Slå "Skjul kendte kort" fra, eller nulstil fremskridt.';render();return;}
  S.msg='';
  var queue=[],ia=0,ib=0,na=cp.length,nb=qp.length;
  while(ia<na||ib<nb){
    if(ib>=nb||(ia<na&&ia*nb<=ib*na)){queue.push({k:'c',id:cp[ia++]});}
    else{var q=qp[ib++];queue.push({k:'q',it:{q:q,order:shuffle(q.o.map(function(_,i){return i;}))}});}
  }
  M={queue:queue,total:queue.length,done:0,score:0,nq:nb,nc:na,tries:0,missedC:new Set(),missedQ:[],revealed:false,pick:null,zoom:false};
  S.view='mix';render();window.scrollTo(0,0);
}
function mixView(){
  var e=M.queue[0],p=e.k==='c'?cardParts(byId[e.id],M,'Flashcard'):quizParts(e.it,M.pick,'Quiz','Næste');
  return '<div class="wrap">'+
  '<div class="top"><button class="linkbtn" data-a="home">Afslut runden</button><span class="count">'+M.done+' af '+M.total+' gennemført</span></div>'+
  '<div class="bar"><i style="width:'+(M.done/M.total*100)+'%"></i></div>'+p.article+p.actions+'</div>';
}
function mixGrade(g){
  var e=M.queue.shift();
  if(g==='good'){known.add(e.id);saveKnown();M.done++;}
  else{
    var pos=Math.min(g==='again'?3:9,M.queue.length);
    M.queue.splice(pos,0,e);M.tries++;
    if(g==='again')M.missedC.add(e.id);
  }
  M.revealed=false;M.zoom=false;
  if(!M.queue.length)S.view='mdone';
  render();window.scrollTo(0,0);
}
function mixPick(di){
  if(M.pick!==null)return;
  var it=M.queue[0].it;M.pick=di;
  if(it.order[di]===it.q.c)M.score++;else M.missedQ.push(it.q);
  render();
  var a=document.getElementById('ans');if(a){try{a.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}catch(e){}}
}
function mixNext(){
  M.queue.shift();M.done++;M.pick=null;
  if(!M.queue.length)S.view='mdone';
  render();window.scrollTo(0,0);
}
function mdoneView(){
  var mq=M.missedQ,mc=M.missedC.size;
  var miss=mq.map(function(q){
    return '<div class="miss"><p class="mq">'+esc(q.q)+'</p><p class="ma">'+esc(q.o[q.c])+'</p><p class="me">'+fmt(q.e)+'</p></div>';
  }).join('');
  return '<div class="wrap"><h1>Runden er færdig</h1>'+
  (M.nq?'<p class="score">'+M.score+' / '+M.nq+'</p><p class="lede">rigtige quizspørgsmål.</p>':'')+
  (M.nc?'<p class="lede">Du har gennemgået '+M.nc+' flashcards og markeret dem alle som kendt'+(M.tries?' efter '+M.tries+' gange, hvor du ikke kunne dem straks':'')+'.</p>':'')+
  (mq.length?'<h2>Quizspørgsmål, du missede</h2>'+miss:'')+
  '<div class="stack">'+((mq.length||mc)?'<button class="btn primary" data-a="retryMix">Gentag de '+(mq.length+mc)+' missede</button>':'')+
  '<button class="btn" data-a="startMix">Ny blandet runde</button><button class="btn" data-a="home">Tilbage til menu</button></div></div>';
}

/* ---------- rendering og events ---------- */
function render(){
  var h={home:home,cards:cardView,cdone:cdoneView,quiz:quizView,qdone:qdoneView,mix:mixView,mdone:mdoneView}[S.view]();
  app.innerHTML=h;
  var t=app.querySelector('[data-af]');
  if(t&&(S.view==='cards'||S.view==='quiz'||S.view==='mix')){try{t.focus({preventScroll:true});}catch(e){}}
}
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
  switch(a){
    case 'deck':S.msg='';
      if(S.decks.has(v)){S.decks.delete(v);}else{S.decks.add(v);T.forEach(function(t){if(t.d===v)S.topics.add(t.k);});}
      prefs.offDecks=DK.filter(function(d){return !S.decks.has(d.k);}).map(function(d){return d.k;});savePrefs();render();break;
    case 'topic':S.msg='';if(S.topics.has(v))S.topics.delete(v);else S.topics.add(v);render();break;
    case 'openDeck':if(S.open.has(v))S.open.delete(v);else S.open.add(v);render();break;
    case 'allDeck':T.forEach(function(t){if(t.d===v)S.topics.add(t.k);});render();break;
    case 'noDeck':T.forEach(function(t){if(t.d===v)S.topics.delete(t.k);});render();break;
    case 'catOn':case 'catOff':S.msg='';
      DK.forEach(function(d){if(d.c!==v)return;if(a==='catOn'){S.decks.add(d.k);T.forEach(function(t){if(t.d===d.k)S.topics.add(t.k);});}else S.decks.delete(d.k);});
      prefs.offDecks=DK.filter(function(d){return !S.decks.has(d.k);}).map(function(d){return d.k;});savePrefs();render();break;
    case 'occ':prefs.occ=v;savePrefs();render();break;
    case 'qn':prefs.qn=v==='all'?'all':Number(v);savePrefs();render();break;
    case 'startCards':startCards(v);break;
    case 'startQuiz':startQuiz();break;
    case 'startMix':startMix();break;
    case 'retryMix':startMix({cards:Array.from(M.missedC),qs:M.missedQ.slice()});break;
    case 'reveal':reveal();break;
    case 'grade':grade(v);break;
    case 'zoom':var zs=curSt();zs.zoom=!zs.zoom;var m=app.querySelector('.media');if(m)m.classList.toggle('zoom',zs.zoom);el.textContent=zs.zoom?'Vis hele figuren':'Forstør figuren';break;
    case 'again':startCards(C.kind);break;
    case 'retryMissed':
      var ids=Array.from(C.missed);C={kind:C.kind,queue:shuffle(ids),total:ids.length,done:0,tries:0,missed:new Set(),revealed:false,zoom:false};S.view='cards';render();window.scrollTo(0,0);break;
    case 'pick':pick(Number(v));break;
    case 'next':next();break;
    case 'retryQuiz':startQuiz(Q.missed.slice());break;
    case 'home':S.view='home';S.resetArmed=false;render();window.scrollTo(0,0);break;
    case 'reset':
      if(S.resetArmed){known=new Set();saveKnown();S.resetArmed=false;}else{S.resetArmed=true;}
      render();break;
  }
});
app.addEventListener('change',function(e){
  if(e.target.getAttribute('data-a')==='hideKnown'){prefs.hideKnown=e.target.checked;savePrefs();render();}
});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(S.view==='cards'){
    if(!C.revealed){if((e.key===' '||e.key==='Enter')&&!onBtn){e.preventDefault();reveal();}}
    else{
      if(e.key==='1')grade('again');else if(e.key==='2')grade('hard');else if(e.key==='3')grade('good');
    }
  }else if(S.view==='mix'){
    var e0=M.queue[0];
    if(e0.k==='c'){
      if(!M.revealed){if((e.key===' '||e.key==='Enter')&&!onBtn){e.preventDefault();reveal();}}
      else{if(e.key==='1')grade('again');else if(e.key==='2')grade('hard');else if(e.key==='3')grade('good');}
    }else{
      if(M.pick===null){var mn=Number(e.key);if(mn>=1&&mn<=e0.it.q.o.length)pick(mn-1);}
      else if((e.key==='Enter'||e.key===' ')&&!onBtn){e.preventDefault();next();}
    }
  }else if(S.view==='quiz'){
    if(Q.pick===null){var n=Number(e.key);if(n>=1&&n<=Q.list[Q.i].q.o.length)pick(n-1);}
    else if((e.key==='Enter'||e.key===' ')&&!onBtn){e.preventDefault();next();}
  }
});
render();
})();
</script>
</body>
</html>
