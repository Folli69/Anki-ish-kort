const DATA={"cats":[{"k":"oe","n":"Overekstremiteten"}],"decks":[{"k":"ax5","n":"AX5","sub":"Skulderbæltets led, skulder- og albueled, underarmens led","c":"oe"},{"k":"ax6","n":"AX6","sub":"Skulderens og overarmens muskler, håndens knogler","c":"oe"},{"k":"ax7","n":"AX7","sub":"Håndens og fingrenes led, underarmens muskler, palma manus, håndens muskler","c":"oe"},{"k":"ax8","n":"AX8","sub":"Fossa axillaris, fossa cubitalis, OE kar (arterier, vener, lymfekar)","c":"oe"},{"k":"ax9","n":"AX9","sub":"Medulla spinalis og spinalnerver, OE nerver, plexus brachialis","c":"oe"}],"topics":[{"k":"ax5.led","n":"Ledlære","d":"ax5"},{"k":"ax5.sb","n":"Skulderbæltet","d":"ax5"},{"k":"ax5.hu","n":"Skulderleddet","d":"ax5"},{"k":"ax5.kn","n":"Radius og ulna","d":"ax5"},{"k":"ax5.cu","n":"Albueleddet","d":"ax5"},{"k":"ax5.ru","n":"Underarmens led","d":"ax5"},{"k":"ax5.kl","n":"Klinik","d":"ax5"},{"k":"ax6.ml","n":"Muskellære","d":"ax6"},{"k":"ax6.sm","n":"Skuldermuskler: overblik og nerver","d":"ax6"},{"k":"ax6.ry","n":"Rygmuskler (dorsal)","d":"ax6"},{"k":"ax6.br","n":"Brystmuskler (ventral)","d":"ax6"},{"k":"ax6.la","n":"Skuldermuskler (lateral)","d":"ax6"},{"k":"ax6.rm","n":"Rotatormanchetten","d":"ax6"},{"k":"ax6.ov","n":"Overarmens muskler","d":"ax6"},{"k":"ax6.hk","n":"Håndens knogler","d":"ax6"},{"k":"ax6.kl","n":"Klinik og eksamen","d":"ax6"},{"k":"ax7.hl","n":"Håndleddet","d":"ax7"},{"k":"ax7.fl","n":"Fingrenes og tommelens led","d":"ax7"},{"k":"ax7.gr","n":"Håndens greb","d":"ax7"},{"k":"ax7.uf","n":"Underarmens fleksorer","d":"ax7"},{"k":"ax7.ue","n":"Underarmens ekstensorer","d":"ax7"},{"k":"ax7.sc","n":"Seneforhold og canalis carpi","d":"ax7"},{"k":"ax7.pm","n":"Palma manus og håndens muskler","d":"ax7"},{"k":"ax7.kl","n":"Klinik","d":"ax7"},{"k":"ax8.kg","n":"Karsystemet og a. subclavia","d":"ax8"},{"k":"ax8.fa","n":"Fossa axillaris og intersticerne","d":"ax8"},{"k":"ax8.aa","n":"A. axillaris og a. brachialis","d":"ax8"},{"k":"ax8.fc","n":"Fossa cubitalis","d":"ax8"},{"k":"ax8.ar","n":"Underarmens og håndens arterier","d":"ax8"},{"k":"ax8.ve","n":"OE vener","d":"ax8"},{"k":"ax8.ly","n":"Lymfekar og lymfeknuder","d":"ax8"},{"k":"ax9.ms","n":"Medulla spinalis og spinalnerver","d":"ax9"},{"k":"ax9.pb","n":"Plexus brachialis: opbygning","d":"ax9"},{"k":"ax9.sn","n":"Plexus brachialis: de mindre nerver","d":"ax9"},{"k":"ax9.mu","n":"N. musculocutaneus og n. axillaris","d":"ax9"},{"k":"ax9.me","n":"N. medianus","d":"ax9"},{"k":"ax9.ul","n":"N. ulnaris","d":"ax9"},{"k":"ax9.ra","n":"N. radialis","d":"ax9"},{"k":"ax9.ki","n":"Innervation, test og klinik","d":"ax9"}],"cards":[{"id":"t1","t":"ax5.led","k":"text","q":"Hvad er forskellen på ægte og uægte led?","a":"**Ægte led:** ledhule med synovialvæske, ledkapsel (fibrøs + synovial membran) og store bevægeudslag.\n**Uægte led:** bindevævsforbindelse mellem to knogler med kun små forskydninger.","img":"r_ax5_5-0"},{"id":"t2","t":"ax5.led","k":"text","q":"Hvilke to lag har en ledkapsel (capsula articularis)?","a":"Yderst **membrana fibrosa** (den fibrøse kapsel), inderst **membrana synovialis**, som danner synovialvæsken.\nKapslen har omslagsfolder (plica synovialis, inkl. villi synovialis).","img":"r_ax5_5-0"},{"id":"t3","t":"ax5.led","k":"text","q":"Hvad er synovia, og hvad bruges den til?","a":"Ledvæske i cavitas articularis. Den smører leddet og mindsker friktion.\nNavnet kommer af 'syn' (sammen med) + 'ovium' (æg): væsken ligner æggehvide – klar, sej og trådtrækkende.","img":"r_ax5_5-0"},{"id":"t4","t":"ax5.led","k":"text","q":"Hvor mange frihedsgrader har ægte led, og hvor mange har syndesmoser?","a":"Ægte led: **1–3**.\nSyndesmoser: **3–5**, aldrig 6, fordi frihedsgraden i strøgretningen ikke kan realiseres.","img":"r_ax5_18-0"},{"id":"t5","t":"ax5.led","k":"text","q":"Hvad menes med 6 frihedsgrader?","a":"3 parallelforskydninger (transversal, sagittal, vertikal retning) + 3 vinkelbevægelser (omkring transversal, sagittal og vertikal akse).\nKun et frit svævende legeme har alle seks.","img":"r_ax5_18-0"},{"id":"t6","t":"ax5.led","k":"text","q":"Syndesmose vs. synchondrose – hvad er forskellen?","a":"**Syndesmose** = simpelt bindevæv (ligamenter, membraner, suturer) – 'bundet sammen' (desmos = bånd).\n**Synchondrose** = bruskvæv – 'brusket sammen' (chondros = brusk).","img":"r_ax5_12-1"},{"id":"t7","t":"ax5.led","k":"text","q":"Primær vs. sekundær synchondrose: opbygning og eksempler?","a":"**Primær:** rest af det oprindelige kondroskelet. Hyalinbrusk med perichondrium yderst. Eks. ribbensbrusk (permanent) og epifyseskiver (transitoriske).\n**Sekundær:** persisterende. Gelatinøs viskøs væske omgivet af koncentriske lameller af fibrøst brusk + to endeplader af hyalinbrusk. Eks. discus intervertebralis og symphysis pubica.","img":"r_ax5_12-1"},{"id":"t8","t":"ax5.led","k":"text","q":"Hvilket uægte led sidder mellem radius og ulna?","a":"En syndesmose: **membrana interossea antebrachii**.","img":"r_ax5_5-0"},{"id":"t9","t":"ax5.led","k":"text","q":"Hvilke ekstra strukturer kan nogle ægte led have?","a":"Subsynovialt fedtvæv (mellem membrana synovialis og fibrosa), labrum articulare (ledlæbe) og discus/meniscus articularis (ledskive af fibrøs brusk).","img":"r_ax5_5-0"},{"id":"t10","t":"ax5.led","k":"text","q":"Hvad gør et labrum articulare (ledlæbe)?","a":"Forstørrer ledskålen og beskytter samtidig knoglekanten. (Ved skulderen betyder det, at mere af caput humeri dækkes.)","img":"r_ax5_15-0"},{"id":"t11","t":"ax5.led","k":"text","q":"Hvad er forskellen på discus og meniscus articularis?","a":"Begge er fibrøs brusk og giver ekstra støddæmpning mellem ledfladerne.\n**Discus:** fæstnet til ledkapslen langs hele randen.\n**Meniscus:** kileformet og ikke fæstnet langs hele randen.","img":"r_ax5_15-3"},{"id":"t12","t":"ax5.led","k":"text","q":"Enkelt, sammensat og kombineret led – hvad er definitionerne?","a":"**Enkelt:** to knogler.\n**Sammensat:** flere end to knogler i samme ledhule.\n**Kombineret:** to adskilte ledhuler mellem de samme knogler.","img":"r_ax5_5-0"},{"id":"t13","t":"ax5.led","k":"text","q":"Ledtyper og frihedsgrader: hvilke typer har 3, 2 og 1 frihedsgrad?","a":"**3:** kugleled (skulderled, hofteled).\n**2:** saddelled (tommelens rodled) og ellipsoid-led (håndled).\n**1:** hængselled (albue, knæ, fingerled) og drejeled (underarmens led, led mellem to øverste halshvirvler).","img":"r_ax5_18-0"},{"id":"t14","t":"ax5.led","k":"text","q":"Hvilke planer og akser hører til fleksion–ekstension, abduktion–adduktion og rotation?","a":"**Fleksion–ekstension:** sagittalplanet, omkring transversal akse.\n**Abduktion–adduktion:** frontalplanet, omkring sagittal akse (hhv. væk fra og mod midten).\n**Ind-/udadrotation:** omkring vertikal (longitudinel) akse.","img":"r_ax5_9-2"},{"id":"t15","t":"ax5.led","k":"text","q":"Hvad betyder cirkumduktion, opponens og inversion–eversion?","a":"**Cirkumduktion:** keglebevægelse med centrum ved knoglens ene ende (den anden ende beskriver en lukket linje).\n**Opponens:** at modstille sig (tommelen), bruges ved præcisionsgrebet.\n**Inversion–eversion:** foden tiltes mod/væk fra midten.","img":"r_ax5_9-2"},{"id":"t16","t":"ax5.led","k":"text","q":"Hvordan er dispositionen til at beskrive et ægte led?","a":"**Indledning:** navn, beliggenhed, klassifikation.\n**Isoleret led:** ledhoved, ledskål, ledkapsel, ledhule, kapselforstærkninger, intra- og ekstraartikulære strukturer.\n**Indsat i organismen:** akser, bevægelser og bevægeomfang, stopstrukturer, styrestrukturer.\n**Muskler:** de vigtigste og dem, der er hovedansvarlige for bevægelserne.","img":"r_ax5_5-0"},{"id":"t17","t":"ax5.sb","k":"text","q":"Hvilke knogler og led indgår i skulderbæltet (cingulum membri superioris)?","a":"**Knogler:** clavicula, scapula og (sternum).\n**Led:** art. sternoclavicularis, art. acromioclavicularis og (art. scapulothoracalis, uægte led).\nSkulderbæltet er en bagtil åben ring omkring øverste del af thorax.","img":"r_ax5_21-0"},{"id":"t18","t":"ax5.sb","k":"text","q":"Hvad er skulderbæltets funktion?","a":"At placere/ophænge overekstremiteten ud fra truncus (især clavicula) og give stor bevægelighed (især scapula).\nOphænget sker gennem muskler, der fæstner til rygsøjle, hoved og brystkassens dorsale og ventrale omfang.","img":"r_ax5_21-0"},{"id":"t19","t":"ax5.sb","k":"text","q":"Hvilke vinkler danner scapula og clavicula?","a":"**Scapula:** 40° med frontalplanet (retroverteret).\n**Clavicula:** 30° i modsat retning (anteverteret).","img":"r_ax5_28-0"},{"id":"t20","t":"ax5.sb","k":"text","q":"Er skulderbæltet det samme som skulderleddet?","a":"Nej.\n**Skulderbæltet:** manubrium sterni + art. sternoclavicularis + clavicula + art. acromioclavicularis + scapula.\n**Skulderleddet:** art. humeri (art. glenohumerale), det egentlige skulderled.","img":"r_ax5_21-0"},{"id":"t21","t":"ax5.sb","k":"text","q":"Hvad er 'skulderens 4 led'?","a":"Art. sternoclavicularis, art. acromioclavicularis, (art. scapulothoracalis – uægte) og art. humeri (det egentlige skulderled).","img":"r_ax5_21-0"},{"id":"t22","t":"ax5.sb","k":"text","q":"Art. sternoclavicularis: klassifikation, ledhoved og ledskål?","a":"Ægte, enkelt, delt glideled (funktionelt kugleled).\n**Ledhoved:** facies articularis sternalis claviculae.\n**Ledskål:** incisura clavicularis sterni.","img":"r_ax5_24-5"},{"id":"t23","t":"ax5.sb","k":"text","q":"Art. sternoclavicularis: kapselforstærkninger og øvrige strukturer?","a":"Stærk kapsel med ligg. sternoclaviculare anterior, posterior og superior.\n**Intraartikulært:** discus articularis (tyk, deler ledhulen i to).\n**Ekstraartikulært:** lig. interclaviculare (= lig. sternoclaviculare sup.), lig. costoclaviculare og m. subclavius (dynamisk ligament, trækker medialt og nedad).","img":"r_ax5_24-5"},{"id":"t24","t":"ax5.sb","k":"text","q":"Hvilke bevægelser har art. sternoclavicularis, og hvor ligger skæringspunktet for akserne?","a":"Cirkumduktion omkring en dobbeltkegle. Skæringspunktet ligger ved **lig. costoclaviculare**.\nEksempel: den mediale del (extremitas sternalis) sænkes, når den laterale del (extremitas acromialis) løftes.","img":"r_ax5_24-5"},{"id":"t25","t":"ax5.sb","k":"text","q":"Art. acromioclavicularis: klassifikation og ledflader?","a":"Ægte, enkelt, delt glideled.\n**Ledflader:** facies articularis acromialis claviculae og facies articularis clavicularis acromii.","img":"r_ax5_26-5"},{"id":"t26","t":"ax5.sb","k":"text","q":"Art. acromioclavicularis: ligamenter og intraartikulær struktur?","a":"Lig. acromioclaviculare (indvævet i oversiden), discus articularis (tynd) og lig. coracoclaviculare (ekstraartikulært), der er delt i lig. trapezoideum (lateralt) og lig. conoideum (medialt).","img":"r_ax5_26-5"},{"id":"t27","t":"ax5.sb","k":"text","q":"Hvad er funktionen af art. acromioclavicularis?","a":"Små forskydninger/medbevægelser – den 'forlænger' bevægelserne fra art. sternoclavicularis.","img":"r_ax5_26-5"},{"id":"t28","t":"ax5.sb","k":"text","q":"Hvorfor er art. scapulothoracalis 'uægte'?","a":"Den er ikke et egentligt led. Bevægelserne foregår i en spalte med løst bindevæv (det scapulothoracale spatium) mellem m. serratus anterior og thoraxvæggen.\nLagene: knogle – muskel – bindevæv – knogle.","img":"r_ax5_28-0"},{"id":"t29","t":"ax5.sb","k":"text","q":"Hvilke bevægelser foregår i art. scapulothoracalis?","a":"Elevation/depression (løft/sænkning), abduktion/adduktion og udad-/indadrotation (omkring akse vinkelret på fossa infraspinata).\nUdadrotation = scapulas nederste hjørne svinger lateralt.","img":"r_ax5_28-0"},{"id":"t30","t":"ax5.sb","k":"text","q":"Hvor stor en del af abduktionen står scapula for, og hvad sker der ved maksimal abduktion?","a":"Scapula står for **1/3** af abduktionen (når armen føres over 30° i frontalplanet).\nVed maksimal abduktion/fleksion står clavicula næsten vertikalt, og cavitas glenoidalis føres ind under caput humeri til støtte.","img":"r_ax5_28-0"},{"id":"t31","t":"ax5.hu","k":"text","q":"Art. humeri: beliggenhed og klassifikation?","a":"Mellem scapula og humerus. Ægte, enkelt kugleled (art. glenohumerale).","img":"r_ax5_33-3"},{"id":"t32","t":"ax5.hu","k":"text","q":"Art. humeri: beskriv ledhoved og ledskål.","a":"**Caput humeri:** halvkugleformet, afgrænses af collum anatomicum, vender medialt, kranialt og dorsalt.\n**Cavitas glenoidalis:** pæreformet, vender lateralt, kranialt og ventralt, artikulerer kun med 1/3 af caput humeri. Forstørres af labrum glenoidale.","img":"r_ax5_33-3"},{"id":"t33","t":"ax5.hu","k":"text","q":"Hvorfor er skulderleddet kroppens mest mobile led – og hvad koster det?","a":"Ledhoved og ledskål passer dårligt sammen (lille knoglebegrænsning) → stor mobilitet.\nTil gengæld lav stabilitet: mobilitet og stabilitet er omvendte af hinanden, og stabiliteten ligger udelukkende i muskler og ligamenter.","img":"r_ax5_33-3"},{"id":"t34","t":"ax5.hu","k":"text","q":"Art. humeri: hvordan er ledkapslen, og hvor hæfter den?","a":"Meget løs/slap med en stor omslagsfold nedadtil (**recessus axillaris**) – betingelse for den store bevægelighed.\nMembrana fibrosa hæfter ved collum anatomicum opadtil og collum chirurgicum nedadtil.","img":"r_ax5_33-3"},{"id":"t35","t":"ax5.hu","k":"text","q":"Ligg. glenohumeralia: antal, placering og funktion?","a":"Tre (superius, medius, inferius) på forsiden af kapslen – 'abe-ligamenterne' (kan bære kropsvægten ved hængen i armene).\nFra underside af forreste labrum glenoidale til collum chirurgicum. Begrænser udadrotation, abduktion og ekstension.","img":"r_ax5_35-0"},{"id":"t36","t":"ax5.hu","k":"text","q":"Lig. coracohumerale: forløb og funktion?","a":"Forstærker kapslens overside (processus coracoideus → tuberculum majus). 'Indkøbspose-ligamentet'.\nBegrænser udadrotation, forhindrer nedadglidning af humerus og aflaster m. supraspinatus.","img":"r_ax5_35-0"},{"id":"t37","t":"ax5.hu","k":"text","q":"Lig. coracoacromiale: hvad er det, og hvad danner det sammen med knoglefremspringene?","a":"Tyndt fladt ligament mellem processus coracoideus og acromion.\nSammen med de to fremspring danner det 'det osteofibrøse halvtag' – 'den ydre ledskål'.","img":"r_ax5_34-3"},{"id":"t38","t":"ax5.hu","k":"text","q":"Hvilken struktur er specielt intraartikulær i art. humeri?","a":"Tendo caput longum m. bicipitis brachii med vagina synovialis intertubercularis (skedeformet udløber af membrana synovialis).\nUdspringer fra tuberculum supraglenoidale og forlader leddet gennem sulcus intertubercularis. Presser caput humeri ind mod ledskålen.","img":"r_ax5_37-5"},{"id":"t39","t":"ax5.hu","k":"text","q":"Hvilke tre bursae hører til skulderleddet, og hvor ligger de?","a":"**Bursa subacromialis:** mellem den ydre ledskål og art. humeri.\n**Bursa subdeltoidea:** kommunikerer med bursa subacromialis; ligger, hvor m. deltoideus glider mod tuberculum majus.\n**Bursa subtendinea m. subscapularis:** dybt for m. subscapularis-senen (kommunikerer med ledhulen).","img":"r_ax5_34-3"},{"id":"t40","t":"ax5.hu","k":"text","q":"Hvad er bursae, og hvad er bursitis?","a":"Tyndvæggede slimsække, der minimerer friktion på steder med høj lokal spænding, oftest omkring led.\nDe kan inflammeres (bursitis) – det er smertefuldt og ikke sjældent.","img":"r_ax5_34-3"},{"id":"t41","t":"ax5.hu","k":"text","q":"Hvilke akser og bevægelser har art. humeri?","a":"**Sagittal akse:** abduktion/adduktion.\n**Transversal akse:** fleksion/ekstension.\n**Vertikal akse:** indadrotation/udadrotation.\n(3 akser = 3 frihedsgrader, kugleled.)","img":"r_ax5_38-3"},{"id":"t42","t":"ax5.hu","k":"text","q":"Hvad er bevægeomfanget i art. humeri?","a":"Fleksion 0–180°, ekstension 0–60°.\nAbduktion 0–180°, adduktion 0–75°.\nIndadrotation 0–90°, udadrotation 0–70°.","img":"r_ax5_38-3"},{"id":"t43","t":"ax5.hu","k":"text","q":"Hvad sker der med humerus ved abduktion over 90° i scapulas plan, og hvorfor?","a":"Humerus **udadroteres**, så lig. glenohumeralia afspændes – og så tuberculum majus kan få plads bagtil under acromion (lig. coracoacromiale).","img":"r_ax5_38-3"},{"id":"t44","t":"ax5.hu","k":"text","q":"Hvad sker der med humerus ved fleksion til 180°?","a":"Den **indadroteres**, så epicondylus medialis vendes fremad (ventralt).","img":"r_ax5_38-3"},{"id":"t45","t":"ax5.hu","k":"text","q":"Hvordan forløber abduktion i scapulas plan (40° med frontalplanet)?","a":"Udelukkende i skulderleddet, indtil humerus er horisontal. Først derefter begynder scapula at dreje med.","img":"r_ax5_38-3"},{"id":"t46","t":"ax5.hu","k":"text","q":"Hvilke fire strukturer stabiliserer art. humeri?","a":"1) Rotatormanchetten\n2) Labrum glenoidale\n3) Bicepssenen (caput longum)\n4) Ligamenterne","img":"r_ax5_33-3"},{"id":"t47","t":"ax5.hu","k":"text","q":"Rotatormanchetten: hvilke muskler, og hvorfor stabiliserer den?","a":"M. subscapularis, m. supraspinatus, m. infraspinatus og m. teres minor.\nFire muskler, der fra tre sider hæfter omkring humerus, og hvis insertionssener er indvævet i skulderleddets ledkapsel.","img":"r_ax5_39-2"},{"id":"t48","t":"ax5.hu","k":"text","q":"Hvilke ligamenter hører til 'Ligament rep' for skulderregionen?","a":"Lig. acromioclaviculare, lig. coracoacromiale, lig. coracoclaviculare (conoideum medialt, trapezoideum lateralt), lig. coracohumerale, ligg. glenohumeralia (superius, medius, inferius) og lig. transversum scapulae (superius).","img":"r_ax5_35-0"},{"id":"t49","t":"ax5.kn","k":"text","q":"Radius: placering og overordnet opdeling?","a":"Underarmens laterale knogle.\nCaput – collum – corpus – extremitas distalis. Margo anterior, posterior og interossea (medialis).","img":"r_ax5_57-3"},{"id":"t50","t":"ax5.kn","k":"text","q":"Radius proksimalt: hvilke strukturer findes?","a":"Caput radii med fovea articularis og circumferentia articularis, collum radii og tuberositas radii (insertion for m. biceps brachii).","img":"r_ax5_57-3"},{"id":"t51","t":"ax5.kn","k":"text","q":"Radius distalt: hvilke strukturer findes?","a":"Tuberculum dorsale (Listers tuberkel), incisura ulnaris, processus styloideus (pyramideformet) og facies articularis carpalis (led med håndroden).","img":"r_ax5_57-3"},{"id":"t52","t":"ax5.kn","k":"text","q":"Hvilken funktion har tuberculum dorsale (Listers tuberkel)?","a":"Det fungerer som trisse for tendo m. extensor pollicis longus.","img":"r_ax5_57-3"},{"id":"t53","t":"ax5.kn","k":"text","q":"Ulna: placering, form og overordnet opdeling?","a":"Albuebenet: skruenøgleformet, underarmens mediale knogle.\nExtremitas proximalis – corpus – caput. Margo anterior, posterior og interossea (lateralis).","img":"r_ax5_43-0"},{"id":"t54","t":"ax5.kn","k":"text","q":"Ulna proksimalt: hvilke strukturer findes?","a":"Olecranon, processus coronoideus, incisura radialis (ledskål for caput radii), incisura trochlearis og tuberositas ulnae (insertion for m. brachialis).","img":"r_ax5_43-0"},{"id":"t55","t":"ax5.kn","k":"text","q":"Ulna distalt: hvilke strukturer findes?","a":"Caput ulnae med circumferentia articularis (artikulerer med radius) og processus styloideus (tapformet).","img":"r_ax5_43-0"},{"id":"t56","t":"ax5.kn","k":"text","q":"Hvad danner incisura trochlearis, og hvordan griber den om humerus?","a":"Olecranon + processus coronoideus. Den har en førringskam og griber om trochlea humeri som en skruenøgle.","img":"r_ax5_43-0"},{"id":"t57","t":"ax5.kn","k":"text","q":"Hvilke kanter af radius og ulna vender mod membrana interossea?","a":"Margo interosseus: radius' mediale kant og ulnas laterale kant.","img":"r_ax5_43-0"},{"id":"t58","t":"ax5.cu","k":"text","q":"Art. cubiti: beliggenhed og klassifikation?","a":"Mellem humerus og underarmsknoglerne. Ægte, sammensat led: hængselled med indbygget drejeled.","img":"r_ax5_46-2"},{"id":"t59","t":"ax5.cu","k":"text","q":"Hvilke tre delled består art. cubiti af?","a":"Art. humeroulnaris, art. humeroradialis og art. radioulnaris proximalis (i samme kapsel).","img":"r_ax5_55-4"},{"id":"t60","t":"ax5.cu","k":"text","q":"Art. humeroulnaris: type, ledhoved og ledskål?","a":"Ægte hængselled.\n**Ledhoved:** trochlea humeri (trisseformet med asymmetrisk førringsfure og tværstillet akse).\n**Ledskål:** incisura trochlearis ulnae (har førringskam, dannet af olecranon og proc. coronoideus).","img":"r_ax5_55-4"},{"id":"t61","t":"ax5.cu","k":"text","q":"Art. humeroradialis: type, ledhoved, ledskål og funktion?","a":"Ægte, indskrænket kugleled (indskrænket, da radius er tæt bundet til ulna).\n**Ledhoved:** capitulum humeri (halvkugleformet, vender fremad).\n**Ledskål:** fovea articularis capitis radii.\nIngen kugleledsfunktion – faciliterer kun rotationen fra art. radioulnaris proximalis og samtidig fleksion/ekstension.","img":"r_ax5_55-4"},{"id":"t62","t":"ax5.cu","k":"text","q":"Art. radioulnaris proximalis: type, ledflader og ligament?","a":"Ægte, kombineret drejeled.\nCircumferentia articularis caput radii (kort cylinder) mod incisura radialis ulnae.\nLig. anulare radii (let tragtformet) danner en osteofibrøs ring sammen med incisura radialis ulnae.","img":"r_ax5_50-5"},{"id":"t63","t":"ax5.cu","k":"text","q":"Hvilke bevægelser og hvilket bevægeomfang har art. cubiti?","a":"Fleksion–ekstension: 150–0° (evt. –5°).\nSupination–pronation: 80–0–80°.","img":"r_ax5_46-2"},{"id":"t64","t":"ax5.cu","k":"text","q":"Hvad er stopstrukturerne i art. cubiti?","a":"**Fleksion:** bløddelsstop (muskuløst).\n**Ekstension:** ossøst og ligamentøst (fossa olecrani).","img":"r_ax5_50-5"},{"id":"t65","t":"ax5.cu","k":"text","q":"Hvad er styrestrukturerne i art. cubiti?","a":"Lig. collaterale ulnare og radiale samt lig. anulare radii.","img":"r_ax5_50-5"},{"id":"t66","t":"ax5.cu","k":"text","q":"Lig. collaterale ulnare og radiale: hvor løber de?","a":"**Ulnare:** vifteformet fra epicondylus medialis humeri til mediale kant af incisura trochlearis.\n**Radiale:** vifteformet fra epicondylus lateralis humeri til lig. anulare radii.","img":"r_ax5_50-5"},{"id":"t67","t":"ax5.cu","k":"text","q":"Hvorfor hæfter lig. collaterale radiale i lig. anulare og ikke direkte på radius?","a":"Fordi det ikke må indskrænke supination og pronation.","img":"r_ax5_50-5"},{"id":"t68","t":"ax5.cu","k":"text","q":"Den fælles ledkapsel i art. cubiti: hvad karakteriserer den?","a":"Slap for- og bagtil. Forsynet med subsynovialt fedt (udfylder fossa coronoidea og olecrani) og kapselstrammere: **m. triceps brachii** og **m. brachialis**, som forhindrer, at kapslen klemmes.","img":"r_ax5_52-1"},{"id":"t69","t":"ax5.cu","k":"text","q":"Subsynovialt fedt i albuen: hvad er det, og hvad gør det?","a":"Fedtpuder mellem membrana synovialis og membrana fibrosa.\nUdfylder fossa olecrani ved fleksion og fossa coronoidea ved ekstension.","img":"r_ax5_52-1"},{"id":"t70","t":"ax5.cu","k":"text","q":"Hvad er recessus sacciformis?","a":"En omslagsfold mellem radius og ulna, som spændes af lig. anulare.","img":"r_ax5_52-1"},{"id":"t71","t":"ax5.cu","k":"text","q":"Hvilke bursaer findes omkring albuen?","a":"Bursa subcutanea olecrani (klinik: students elbow) og bursa subtendinea tricipitis brachii.","img":"r_ax5_46-2"},{"id":"t72","t":"ax5.cu","k":"text","q":"Hvilke muskler fleksionerer i albueleddet?","a":"M. biceps brachii (især ved supination), m. brachialis, m. pronator teres (ved pronation) og m. brachioradialis (ved kantstilling).","img":"r_ax5_60-0"},{"id":"t73","t":"ax5.cu","k":"text","q":"Hvilke muskler ekstenderer i albueleddet, og hvad er reglen for muskler på ulna vs. radius?","a":"M. triceps brachii og m. anconeus.\nMuskler, der hæfter på **ulna**, er rene fleksorer/ekstensorer. Muskler, der hæfter på **radius**, kan også bidrage til supination og pronation.","img":"r_ax5_60-0"},{"id":"t74","t":"ax5.cu","k":"text","q":"Hvad er cubitalvinklen, og hvornår er der varus/valgus?","a":"Typisk 170°.\n**Cubital varus:** > 170°.\n**Cubital valgus:** < 170°.","img":"r_ax5_46-2"},{"id":"t75","t":"ax5.cu","k":"text","q":"Hvad er huskereglen for supination?","a":"'SU eller suppe': man beder om SU, når man 'SU'pinerer. Bevægelsen foregår ved kantstillet hånd.","img":"r_ax5_46-2"},{"id":"t76","t":"ax5.ru","k":"text","q":"Art. radioulnaris distalis: type, ledflader og bevægelse?","a":"Ægte, kombineret drejeled.\nCircumferentia articularis caput ulnae mod incisura ulnaris radii. Relativt stram.\nSupination–pronation 80–0–80°.","img":"r_ax5_54-2"},{"id":"t77","t":"ax5.ru","k":"text","q":"Hvad er discus articularis i art. radioulnaris distalis?","a":"En trekantet skive af fibrøs brusk ('ulnocarpalis'). Den binder processus styloideus ulnae stramt til incisura ulnaris radii og aflukker ledhulen nedad mod håndleddet.","img":"r_ax5_56-5"},{"id":"t78","t":"ax5.ru","k":"text","q":"Hvilke ligamenter nævnes omkring art. radioulnaris distalis?","a":"Lig. radioulnare palmare og dorsale, lig. collaterale carpi ulnare og radiale.\nI noterne desuden lig. ulnocarpale palmare/dorsale og lig. radiocarpale palmare/dorsale.","img":"r_ax5_56-5"},{"id":"t79","t":"ax5.ru","k":"text","q":"Membrana interossea antebrachii: type, opbygning og fiberretning?","a":"Uægte led: en syndesmose.\nStærk fibrøs membran mellem underarmsknoglernes margines interossei.\nFibre løber fra radius skråt distalt-ulnart; proksimalt findes også radiale fibre (chorda obliqua).\nBruges også som muskeludspring.","img":"r_ax5_57-3"},{"id":"t80","t":"ax5.ru","k":"text","q":"Hvor går aksen for supination–pronation?","a":"Fra caput radii til caput ulnae og ned gennem 5. finger.","img":"r_ax5_54-2"},{"id":"t81","t":"ax5.ru","k":"text","q":"Hvilke muskler udfører pronation, supination og kantstilling?","a":"**Pronation:** m. pronator teres, m. pronator quadratus.\n**Supination:** m. supinator, m. biceps brachii.\n**Kantstilling:** m. brachioradialis (kan både supinere og pronere til kantstilling).","img":"r_ax5_60-0"},{"id":"t82","t":"ax5.ru","k":"text","q":"Hvad er bevægeomfanget for supination–pronation?","a":"80–0–80°.","img":"r_ax5_54-2"},{"id":"t83","t":"ax5.kl","k":"text","q":"Hvad er scapulae alatae ('englevinger'), og hvad er årsagen?","a":"Scapula lægger sig ud fra thorax (også kaldt 'rucksack paralysis').\nN. thoracicus longus innerverer m. serratus anterior, som holder scapula ind mod thorax. Vedvarende tryk på skulderen klemmer nerven og skaber tilstanden.","img":"r_ax5_30-3"},{"id":"t84","t":"ax5.kl","k":"text","q":"Subluxatio caput radii ('nursemaid's elbow'): hvem, hvordan, og hvad sker der?","a":"Næsten kun hos børn (under 5 år). Ved træk i ekstenderet og proneret arm (barnet løftes i hånden eller snubler) lukserer caput radii nedadtil og klemmes fast i lig. anulare radii.\nBehandling: reponering af radius.","img":"r_ax5_48-2"},{"id":"t85","t":"ax5.kl","k":"text","q":"Hvad har lig. radiocarpale palmare med Colles-fraktur at gøre?","a":"Lig. radiocarpale palmare er meget stærkt – stærkere end knoglevævet i radius. Ved fald fremover på hånden holder båndet, mens radius overrives proksimalt for båndets tilhæftning.","img":"r_ax5_56-4"},{"id":"t86","t":"ax5.kl","k":"text","q":"Hvad er 'students elbow'?","a":"Bursitis i bursa subcutanea olecrani.","img":"r_ax5_52-1"},{"id":"o87","t":"ax5.sb","k":"occ","img":"e46","boxes":[[10.692,12.722,8.011,3.778],[30.618,7.611,10.048,11.389],[43.686,12.944,9.47,7.444],[54.379,6.333,6.11,11.333],[63.035,2.444,5.804,15.222],[42.566,85.778,10.353,7.556]],"target":0,"a":"Clavicula","n":"Ledhoved i art. sternoclavicularis: facies articularis sternalis claviculae."},{"id":"o88","t":"ax5.sb","k":"occ","img":"e46","boxes":[[10.692,12.722,8.011,3.778],[30.618,7.611,10.048,11.389],[43.686,12.944,9.47,7.444],[54.379,6.333,6.11,11.333],[63.035,2.444,5.804,15.222],[42.566,85.778,10.353,7.556]],"target":1,"a":"Lig. sternoclaviculare anterius","n":"Kapselforstærkning sammen med lig. sternoclaviculare posterius og superius."},{"id":"o89","t":"ax5.sb","k":"occ","img":"e46","boxes":[[10.692,12.722,8.011,3.778],[30.618,7.611,10.048,11.389],[43.686,12.944,9.47,7.444],[54.379,6.333,6.11,11.333],[63.035,2.444,5.804,15.222],[42.566,85.778,10.353,7.556]],"target":2,"a":"Lig. interclaviculare","n":"Også kaldet lig. sternoclaviculare superius."},{"id":"o90","t":"ax5.sb","k":"occ","img":"e46","boxes":[[10.692,12.722,8.011,3.778],[30.618,7.611,10.048 ","img":"uln","bone":"Ulna","nr":4,"a":"Tuberositas ulnae","n":"Insertion for m. brachialis."},{"id":"n173","t":"ax5.kn","k":"num","img":"uln","bone":"Ulna","nr":5,"a":"Caput ulnae (med circumferentia articularis)","n":"Artikulerer med radius."},{"id":"n174","t":"ax5.kn","k":"num","img":"uln","bone":"Ulna","nr":6,"a":"Processus styloideus (ulnae)","n":"Tapformet."},{"id":"b175","t":"ax5.cu","k":"box","img":"box","colour":"rød","a":"Art. humeroulnaris","n":"Ægte hængselled: trochlea humeri mod incisura trochlearis ulnae."},{"id":"b176","t":"ax5.cu","k":"box","img":"box","colour":"grøn","a":"Art. humeroradialis","n":"Ægte, indskrænket kugleled: capitulum humeri mod fovea articularis capitis radii."},{"id":"b177","t":"ax5.cu","k":"box","img":"box","colour":"gul","a":"Art. radioulnaris proximalis","n":"Ægte, kombineret drejeled: circumferentia articularis caput radii mod incisura radialis ulnae (med lig. anulare radii)."},{"id":"ax6-t1","t":"ax6.ml","k":"text","q":"Hvordan er en skeletmuskel organiseret, fra knogle til knogle?","a":"**Knogle – sene (aponeurose) – muskel – sene (aponeurose) – knogle.**\nVed kontraktion forsøger sekvensen at bringe to punkter på hver sin side af et led tættere sammen."},{"id":"ax6-t2","t":"ax6.ml","k":"text","q":"Hvad er forskellen på punctum fixum og punctum mobile?","a":"**Punctum fixum** er (som regel) udspringet og bevæger sig ikke.\n**Punctum mobile** er (som regel) insertionen og bevæger sig."},{"id":"ax6-t3","t":"ax6.ml","k":"text","q":"Hvor ligger udspringet i forhold til det axiale skelet, og hvad betyder axialt og appendikulært?","a":"Udspringet er altid tættest på det axiale skelet, og insertionen ligger længst væk.\n**Axialt skelet:** axial = akse (latin). **Appendikulært skelet:** appendix = vedhæng."},{"id":"ax6-t4","t":"ax6.ml","k":"text","q":"Hvad er fascier?","a":"Fibrøs muskelhinde, der **forbinder, stabiliserer, indkapsler og separerer** muskler. Ses om enkeltmuskler og muskelgrupper.\nEkstremitetsfascier omkranser hele ekstremiteten og er via stærke **septa intermuscularia** forbundet til den centrale knogle, så musklerne opdeles i loger.","img":"r_ax6_6-5"},{"id":"ax6-t5","t":"ax6.ml","k":"text","q":"Hvordan hænger muskelloge, muskelgruppe og muskel sammen, og hvad afgrænser en loge?","a":"Muskelloge (compartment) → muskelgruppe → muskel.\nEn muskelgruppe er en funktionel enhed i en velafgrænset loge med en fælles gruppe- eller logenerve.\nLogen afgrænses af ekstremitetsfascien, septa intermuscularia og evt. en membrana interossea.","img":"r_ax6_6-5"},{"id":"ax6-t6","t":"ax6.ml","k":"text","q":"Hvordan er en muskel opbygget fra muskel til myofilament?","a":"Muskel → muskelfasicler (bindevævstrøg) → **muskelfibre** (den cellulære enhed) → muskelfibriller (myofibriller) → kontraktile **myofilamenter**.","img":"r_ax6_6-0"},{"id":"ax6-t7","t":"ax6.ml","k":"text","q":"Hvilke tre typer kontraktion findes der?","a":"**Koncentrisk:** musklen forkortes under arbejde.\n**Excentrisk:** musklen arbejder under forlængelse.\n**Isometrisk:** musklen arbejder uden bevægelse."},{"id":"ax6-t8","t":"ax6.ml","k":"text","q":"Hvilken rolle har musklen ofte ved koncentrisk, excentrisk og isometrisk kontraktion?","a":"Koncentrisk: ofte **agonisten** eller synergister (samarbejdere) over et led.\nExcentrisk: ofte **antagonisten**.\nIsometrisk: ofte **neutralisatorer eller fiksatorer**."},{"id":"ax6-t9","t":"ax6.ml","k":"text","q":"Hvad er en biartikulær muskel?","a":"En muskel, der passerer to led og derfor har funktion på begge. Musklen har effekt på alle led, den passerer.\nEksempler fra AX6: m. biceps brachii og m. triceps brachii (caput longum)."},{"id":"ax6-t10","t":"ax6.ml","k":"text","q":"Hvilke muskeltyper skelner man mellem efter fiberretning?","a":"**Semipennat:** fibrene sidder kun på den ene side af senebladet (grundformen).\n**Pennat (bipennat):** fibre fra et centralt seneblad, dvs. to semipennate enheder.\n**Multipennat:** flere semipennate enheder.\n**Fusiform:** tenformet, tykkest på midten.\n(Penna = fuglefjer.)","img":"r_ax6_8-2"},{"id":"ax6-t11","t":"ax6.ml","k":"text","q":"Efter hvilke principper navngives muskler? Giv et eksempel på hvert.","a":"**Beliggenhed:** m. pectoralis, m. latissimus dorsi\n**Antal hoveder:** m. biceps/triceps brachii, m. quadriceps femoris\n**Fiberretning:** m. rectus abdominis\n**Tilhæftning:** m. brachioradialis, m. coracobrachialis\n**Form:** m. piriformis\n**Størrelse:** m. gluteus maximus/minimus\n**Funktion:** m. pronator teres, m. supinator"},{"id":"ax6-t12","t":"ax6.ml","k":"text","q":"Hvad betyder rectus, latissimus, dorsi og serratus?","a":"**Rectus** = lige. **Latissimus** = bred. **Dorsi** = bagpå. **Serratus** = savtakket.","img":"r_ax6_18-3"},{"id":"ax6-t13","t":"ax6.ml","k":"text","q":"Hvad indgår i en god muskelbeskrivelse?","a":"Navn (latin), **udspring** (origo, punctum fixum), **insertion** (insertio, punctum mobile), **funktion**, **innervation** og andet (muskelgrupper, udseende).\nTip: Udled funktionen af udspring og insertion i stedet for at terpe bevægelserne."},{"id":"ax6-t14","t":"ax6.sm","k":"text","q":"Hvor mange muskler har skulderen, og hvordan inddeles de?","a":"**14 muskler** i tre grupper:\n**Dorsal** (overfladiske rygmuskler): 4\n**Ventral** (overfladiske brystmuskler): 4\n**Lateral** (de egentlige skuldermuskler): 6"},{"id":"ax6-t15","t":"ax6.sm","k":"text","q":"Nævn de fire dorsale skuldermuskler (overfladiske rygmuskler).","a":"M. trapezius, m. latissimus dorsi, mm. rhomboidei (major et minor), m. levator scapulae."},{"id":"ax6-t16","t":"ax6.sm","k":"text","q":"Nævn de fire ventrale skuldermuskler (overfladiske brystmuskler).","a":"M. pectoralis major, m. pectoralis minor, m. serratus anterior, m. subclavius."},{"id":"ax6-t17","t":"ax6.sm","k":"text","q":"Nævn de seks laterale skuldermuskler (de egentlige skuldermuskler).","a":"M. deltoideus, m. teres major, m. subscapularis, m. supraspinatus, m. infraspinatus, m. teres minor."},{"id":"ax6-t18","t":"ax6.sm","k":"text","q":"Hvilke muskler udgør rotatormanchetten?","a":"**M. supraspinatus, m. infraspinatus, m. teres minor og m. subscapularis.**\nM. deltoideus og m. teres major hører til de laterale skuldermuskler, men ikke til rotatormanchetten.","img":"r_ax6_36-2"},{"id":"ax6-t19","t":"ax6.sm","k":"text","q":"Hvad kendetegner de dorsale skuldermuskler?","a":"Udspring fra rygsøjlen og insertion på humerus og skulderbæltet.\nFunktion: bevæger scapula, clavicula og humerus for at styre overekstremitetens bevægelser."},{"id":"ax6-t20","t":"ax6.sm","k":"text","q":"Hvad kendetegner de ventrale skuldermuskler?","a":"Udspringer fra brystkassens for- og sideflader og insererer på humerus eller skulderbæltet."},{"id":"ax6-t21","t":"ax6.sm","k":"text","q":"Hvad kendetegner de laterale skuldermuskler?","a":"Bevægelse og stabilisering af skulderleddet (stabilisering især via rotatormanchetten).\nAlle udspringer fra skulderbæltet og hæfter proksimalt på humerus."},{"id":"ax6-t22","t":"ax6.sm","k":"text","q":"Hvilken nerve innerverer m. trapezius?","a":"**N. accessorius (XI).**","img":"r_ax6_17-0"},{"id":"ax6-t23","t":"ax6.sm","k":"text","q":"Hvilke muskler innerveres af n. dorsalis scapulae?","a":"Mm. rhomboidei (major og minor) og m. levator scapulae."},{"id":"ax6-t24","t":"ax6.sm","k":"text","q":"Hvilken nerve innerverer m. latissimus dorsi?","a":"**N. thoracodorsalis.**","img":"r_ax6_18-3"},{"id":"ax6-t25","t":"ax6.sm","k":"text","q":"Hvilke muskler innerveres af nn. pectorales medialis et lateralis?","a":"M. pectoralis major og m. pectoralis minor."},{"id":"ax6-t26","t":"ax6.sm","k":"text","q":"Hvilken nerve innerverer m. serratus anterior, og hvad sker der, hvis den skades?","a":"**N. thoracicus longus.** Ved skade opstår scapula alata (englevinger), fordi scapulas mediale kant ikke kan holdes ind mod thorax.","img":"r_ax6_28-0"},{"id":"ax6-t27","t":"ax6.sm","k":"text","q":"Hvilken nerve innerverer m. subclavius?","a":"**N. subclavius.**"},{"id":"ax6-t28","t":"ax6.sm","k":"text","q":"Hvilke muskler innerveres af n. axillaris?","a":"M. deltoideus og m. teres minor."},{"id":"ax6-t29","t":"ax6.sm","k":"text","q":"Hvilke muskler innerveres af n. suprascapularis?","a":"M. supraspinatus og m. infraspinatus."},{"id":"ax6-t30","t":"ax6.sm","k":"text","q":"Hvilke muskler innerveres af nn. subscapulares?","a":"M. subscapularis og m. teres major."},{"id":"ax6-t31","t":"ax6.sm","k":"text","q":"Hvilke muskler danner den forreste og den bagerste axilfold?","a":"**Forreste axilfold:** m. pectoralis major.\n**Bagerste axilfold:** m. latissimus dorsi og m. teres major."},{"id":"ax6-t32","t":"ax6.sm","k":"text","q":"Hvilke muskler holder scapula ind til thoraxvæggen?","a":"En muskelkæde med **mm. rhomboidei og m. serratus anterior** som de vigtigste. M. trapezius, m. pectoralis minor og m. latissimus dorsi bidrager også."},{"id":"ax6-t33","t":"ax6.ry","k":"text","q":"M. trapezius: udspring og insertion?","a":"**Udspring:** linea nuchalis superior, protuberantia occipitalis externa, lig. nuchae og proc. spinosi C7–T12.\n**Insertion:** pars descendens på laterale 1/3 af clavicula, pars horisontalis på acromion, pars ascendens på spina scapulae (medialt).","img":"r_ax6_17-0"},{"id":"ax6-t34","t":"ax6.ry","k":"text","q":"M. trapezius: funktion?","a":"**Bevæger scapula:**\nPars descendens: elevation + udadrotation\nPars horisontalis: adduktion\nPars ascendens: depression + udadrotation\nHjælper abduktion af skulderen ved at udadrotere scapula og stabiliserer scapula ind mod thorax (sammen med rhomboidei, serratus anterior og pectoralis minor).\nNerve: n. accessorius (XI).","img":"r_ax6_17-0"},{"id":"ax6-t35","t":"ax6.ry","k":"text","q":"Hvad angiver pars descendens, media og ascendens hos m. trapezius?","a":"Musklens fiberretning.","img":"r_ax6_17-0"},{"id":"ax6-t36","t":"ax6.ry","k":"text","q":"M. latissimus dorsi: udspring og insertion?","a":"**Udspring:** proc. spinosi T7–L5 (+ lig. supraspinalia) via fascia thoracolumbalis, crista sacralis mediana, plus snipper fra nederste costae (9–12), angulus inferior scapulae og crista iliaca.\n**Insertion:** crista tuberculi minoris (sammen med m. teres major).","img":"r_ax6_18-3"},{"id":"ax6-t37","t":"ax6.ry","k":"text","q":"M. latissimus dorsi: funktion og innervation?","a":"**Indadrotation, adduktion og ekstension** i art. humeri. Danner bagerste axilfold sammen med m. teres major.\nAuxiliær (hjælpe-)eksspirationsmuskel pga. forløbet (fx hostestød).\nNerve: n. thoracodorsalis.","img":"r_ax6_18-3"},{"id":"ax6-t38","t":"ax6.ry","k":"text","q":"Hvad er fascia thoracolumbalis?","a":"En stor aponeurose. M. latissimus dorsi udspringer via den fra proc. spinosi T7–L5.","img":"r_ax6_18-3"},{"id":"ax6-t39","t":"ax6.ry","k":"text","q":"Mm. rhomboidei: udspring og insertion?","a":"**Udspring:** proc. spinosi + lig. supraspinalia C6–C7 (minor) og T1–T4 (major).\n**Insertion:** margo medialis scapulae.","img":"r_ax6_21-3"},{"id":"ax6-t40","t":"ax6.ry","k":"text","q":"Mm. rhomboidei: funktion og innervation?","a":"**Elevation, adduktion og let indadrotation** af scapula.\nVigtigste funktion: at holde scapula ind til thorax i muskelkæde med m. serratus anterior, så de styrer art. scapulothoracalis.\nNerve: n. dorsalis scapulae.","img":"r_ax6_21-3"},{"id":"ax6-t41","t":"ax6.ry","k":"text","q":"M. levator scapulae: udspring og insertion?","a":"**Udspring:** fire senede snipper fra proc. transversi (tuberculi posteriores) C1–C4.\n**Insertion:** angulus superior scapulae (medialt).","img":"r_ax6_20-4"},{"id":"ax6-t42","t":"ax6.ry","k":"text","q":"M. levator scapulae: funktion og innervation?","a":"**Elevation** af scapula (primær funktion sammen med m. trapezius), **indadrotation** af scapula (modvirker trapezius' udadrotation) og sidebøjning af columna.\nDækket af m. sternocleidomastoideus og m. trapezius.\nNerve: n. dorsalis scapulae.","img":"r_ax6_20-4"},{"id":"ax6-t43","t":"ax6.br","k":"text","q":"M. pectoralis major: udspring og insertion?","a":"**Udspring:** pars clavicularis (mediale ½ af clavicula), pars sternocostalis (sternum + costa 1–6, bruskdelen), pars abdominalis (lille snip fra rectusskeden).\n**Insertion:** U-formet sene på crista tuberculi majoris humeri.","img":"r_ax6_25-5"},{"id":"ax6-t44","t":"ax6.br","k":"text","q":"M. pectoralis major: funktion og innervation?","a":"**Fleksion, adduktion og indadrotation** af humerus (kastemuskel). Danner forreste axilfold.\nAuxiliær inspirationsmuskel (Fowlers leje).\nPars clavicularis bidrager mest til fleksion og adduktion (sammen med deltoideus).\nNerve: nn. pectorales medialis et lateralis.","img":"r_ax6_25-5"},{"id":"ax6-t45","t":"ax6.br","k":"text","q":"M. pectoralis minor: udspring og insertion?","a":"**Udspring:** costa 3–5. **Insertion:** proc. coracoideus.","img":"r_ax6_26-4"},{"id":"ax6-t46","t":"ax6.br","k":"text","q":"M. pectoralis minor: funktion og innervation?","a":"Trækker scapula **fremad (abduktion) og nedad**. Auxiliær inspirationsmuskel. Bidrager til at holde scapula ind til thorax.\nNerve: nn. pectorales medialis et lateralis.","img":"r_ax6_26-4"},{"id":"ax6-t47","t":"ax6.br","k":"text","q":"M. subclavius: udspring, insertion, funktion og innervation?","a":"**Udspring:** costa 1 (medialt). **Insertion:** midt på undersiden af clavicula.\n**Funktion:** trækker clavicula medialt og nedad; mest af alt fiksation af clavicula (\"dynamisk ligament\" for art. sternoclavicularis). Beskytter vasa subclavia.\n**Nerve:** n. subclavius.","img":"r_ax6_25-5"},{"id":"ax6-t48","t":"ax6.br","k":"text","q":"M. serratus anterior: udspring og insertion?","a":"**Udspring:** costa 1–8/9 (kødet, savtakket).\n**Insertion:** margo medialis scapulae (de 3–4 øverste snipper) og angulus inferior scapulae (de 4–5 nederste snipper).","img":"r_ax6_28-0"},{"id":"ax6-t49","t":"ax6.br","k":"text","q":"M. serratus anterior: funktion og innervation?","a":"Holder scapula ind til thoraxvæggen. **Abduktion og udadrotation** af scapula (skubbe-/rækkebevægelse). Støtter abduktion af skulderen, så deltoideus virker på humerus og ikke på scapula.\nMuskelkæde med m. rhomboideus og m. obliquus externus abdominis.\nNerve: n. thoracicus longus.","img":"r_ax6_28-0"},{"id":"ax6-t50","t":"ax6.la","k":"text","q":"M. deltoideus: udspring og insertion?","a":"**Udspring:** pars anterior fra laterale 1/3 af clavicula, pars media fra acromion (lateralt), pars posterior fra spina scapulae (lateralt). Samme steder som trapezius' insertion.\n**Insertion:** tuberositas deltoidea humeri.","img":"r_ax6_33-4"},{"id":"ax6-t51","t":"ax6.la","k":"text","q":"M. deltoideus: funktion og innervation?","a":"**Pars anterior:** fleksion, indadrotation, adduktion.\n**Pars media:** abduktion.\n**Pars posterior:** ekstension, udadrotation, adduktion.\nNerve: n. axillaris. Muskelkæde med m. trapezius.","img":"r_ax6_33-4"},{"id":"ax6-t52","t":"ax6.la","k":"text","q":"Hvilke synergister har de tre dele af m. deltoideus?","a":"Forreste fibre: m. pectoralis major.\nMidterste fibre: m. supraspinatus.\nBageste fibre: mm. latissimus dorsi og teres major.","img":"r_ax6_33-4"},{"id":"ax6-t53","t":"ax6.la","k":"text","q":"Hvad er trigonum clavipectorale?","a":"Spalten mellem m. deltoideus og m. pectoralis major. Her løber v. cephalica, og i dybden kan proc. coracoideus palperes.","img":"r_ax6_34-0"},{"id":"ax6-t54","t":"ax6.la","k":"text","q":"M. teres major: udspring og insertion?","a":"**Udspring:** nederste 1/3 af margo lateralis scapulae og angulus inferior scapulae.\n**Insertion:** crista tuberculi minoris (sammen med m. latissimus dorsi).","img":"r_ax6_35-3"},{"id":"ax6-t55","t":"ax6.la","k":"text","q":"M. teres major: funktion og innervation?","a":"**Adduktion, ekstension og indadrotation** af skulderen (ligesom m. latissimus dorsi). Danner bagerste axilfold med lat. dorsi.\nSkubber cavitas glenoidalis ind under caput humeri ved abduktion over horisontalplanet.\nNerve: nn. subscapulares.","img":"r_ax6_35-3"},{"id":"ax6-t56","t":"ax6.rm","k":"text","q":"M. supraspinatus: udspring og insertion?","a":"**Udspring:** fossa supraspinata (+ egen fascie).\n**Insertion:** tuberculum majus humeri, øverst.","img":"r_ax6_38-4"},{"id":"ax6-t57","t":"ax6.rm","k":"text","q":"M. supraspinatus: funktion og innervation?","a":"**Abduktion** af art. humeri (initierer bevægelsen). Stabilitet: holder caput humeri ind til cavitas glenoidalis.\nNerve: n. suprascapularis.","img":"r_ax6_38-4"},{"id":"ax6-t58","t":"ax6.rm","k":"text","q":"M. infraspinatus: udspring, insertion, funktion og innervation?","a":"**Udspring:** fossa infraspinata (+ egen fascie). **Insertion:** tuberculum majus, under supraspinatus.\n**Funktion:** udadrotation af art. humeri; holder caput humeri ind til cavitas.\n**Nerve:** n. suprascapularis.","img":"r_ax6_39-4"},{"id":"ax6-t59","t":"ax6.rm","k":"text","q":"M. teres minor: udspring, insertion, funktion og innervation?","a":"**Udspring:** øverste 2/3 af margo lateralis scapulae. **Insertion:** tuberculum majus, under infraspinatus.\n**Funktion:** udadrotation og svag adduktion.\n**Nerve:** n. axillaris.","img":"r_ax6_38-0"},{"id":"ax6-t60","t":"ax6.rm","k":"text","q":"M. subscapularis: udspring og insertion?","a":"**Udspring:** fossa subscapularis.\n**Insertion:** tuberculum minus humeri (som den eneste rotatormanchetmuskel).","img":"r_ax6_37-3"},{"id":"ax6-t61","t":"ax6.rm","k":"text","q":"M. subscapularis: funktion og innervation?","a":"**Indadrotation** og fiksation. Trækker caput humeri kaudalt og medialt (stabiliserer skulderleddet under abduktion).\nAdskilt fra capsula articularis og cavitas glenoidalis af bursa subtendinea m. subscapularis.\nNerve: nn. subscapulares.","img":"r_ax6_37-3"},{"id":"ax6-t62","t":"ax6.rm","k":"text","q":"Hvilke rotatormanchetmuskler hæfter på tuberculum majus, og i hvilken rækkefølge oppefra?","a":"**M. supraspinatus** (øverst), **m. infraspinatus** og **m. teres minor**.\nM. subscapularis hæfter i stedet på tuberculum minus.","img":"r_ax6_36-2"},{"id":"ax6-t63","t":"ax6.rm","k":"text","q":"Hvilke rotatormanchetmuskler laver udadrotation, og hvilken laver indadrotation?","a":"Udadrotation: m. infraspinatus og m. teres minor.\nIndadrotation: m. subscapularis.\nM. supraspinatus abducerer.","img":"r_ax6_36-2"},{"id":"ax6-t64","t":"ax6.rm","k":"text","q":"Hvilken bursa adskiller m. supraspinatus fra acromion og lig. coracoacromiale?","a":"**Bursa subacromialis.** Musklen løber gennem det virtuelle subacromialrum.","img":"r_ax6_38-4"},{"id":"ax6-t65","t":"ax6.ov","k":"text","q":"Hvordan er overarmens muskler inddelt i loger, og hvad innerverer hver loge?","a":"Fascia brachii opdeler musklerne i to loger, adskilt af septa intermuscularia (medialt og lateralt).\n**Forreste fleksorloge (3):** m. biceps brachii, m. coracobrachialis, m. brachialis. Nerve: n. musculocutaneus.\n**Bagerste ekstensorloge (1):** m. triceps brachii. Nerve: n. radialis.","img":"r_ax6_48-0"},{"id":"ax6-t66","t":"ax6.ov","k":"text","q":"M. biceps brachii: udspring og insertion?","a":"**Caput longum:** tuberculum supraglenoidale + labrum glenoidale (løber inde i art. humeri og forlader leddet gennem sulcus intertubercularis).\n**Caput breve:** proc. coracoideus (conjoined tendon med m. coracobrachialis).\n**Insertion:** radial sene (kraftigst) på tuberositas radii og ulnar sene som aponeurosis m. bicipitis brachii.","img":"r_ax6_48-0"},{"id":"ax6-t67","t":"ax6.ov","k":"text","q":"M. biceps brachii: funktion og innervation?","a":"**Albueled:** fleksion. **Radioulnarled:** supination. **Skulderled:** let fleksion + stabilitet.\nBiartikulær.\nNerve: n. musculocutaneus.","img":"r_ax6_48-0"},{"id":"ax6-t68","t":"ax6.ov","k":"text","q":"Hvor løber caput longum af m. biceps brachii?","a":"Inde i art. humeri, beklædt af vagina synovialis intertubercularis. Den forlader leddet gennem sulcus intertubercularis.","img":"r_ax6_48-0"},{"id":"ax6-t69","t":"ax6.ov","k":"text","q":"M. coracobrachialis: udspring, insertion, funktion og innervation?","a":"**Udspring:** proc. coracoideus. **Insertion:** medialt midt på humerus.\n**Funktion:** fleksion og adduktion af art. humeri.\n**Nerve:** n. musculocutaneus, som perforerer musklen (spot). Svarer til lårets adduktorgruppe.","img":"r_ax6_49-4"},{"id":"ax6-t70","t":"ax6.ov","k":"text","q":"M. brachialis: udspring og insertion?","a":"**Udspring:** distalt på forfladen af corpus humeri + septa intermuscularia.\n**Insertion:** tuberositas ulnae (på forfladen af proc. coronoideus) og ledkapslen i art. cubiti (kapselstrammer).","img":"r_ax6_50-2"},{"id":"ax6-t71","t":"ax6.ov","k":"text","q":"M. brachialis: funktion, innervation og beliggenhed?","a":"**Fleksion** af art. cubiti. Nerve: n. musculocutaneus.\nLigger i det dybe lag, mens m. biceps brachii og m. coracobrachialis ligger overfladisk.","img":"r_ax6_50-2"},{"id":"ax6-t72","t":"ax6.ov","k":"text","q":"M. triceps brachii: udspring og insertion?","a":"**Caput longum:** tuberculum infraglenoidale.\n**Caput laterale:** bag på humerus, proksimalt og lateralt for sulcus n. radialis.\n**Caput mediale:** bag på humerus, distalt og medialt for sulcus n. radialis.\n**Insertion:** olecranon (fælles insertionssene). Inserer også i ledkapslen.","img":"r_ax6_52-5"},{"id":"ax6-t73","t":"ax6.ov","k":"text","q":"M. triceps brachii: funktion og innervation?","a":"**Ekstension** i art. cubiti og art. humeri (biartikulær).\nNerve: n. radialis.","img":"r_ax6_52-5"},{"id":"ax6-t74","t":"ax6.ov","k":"text","q":"Intersticerne (kort; skjult slide i decket): hvad begrænser dem, og hvad løber igennem?","a":"Begrænses af to vandrette strukturer (m. teres minor og major) og to lodrette (caput longum af triceps og humerus).\n**Mediale trekantede:** a. circumflexa scapulae.\n**Firkantede:** a. circumflexa humeri posterior + n. axillaris.\n**Nedre trekantede:** a. profunda brachii + n. radialis.","img":"r_ax6_53-3"},{"id":"ax6-t75","t":"ax6.hk","k":"text","q":"Hvordan inddeles manus?","a":"**Carpus** (håndrod), **metacarpus** (mellemhånd) og **digiti manus** (fingre).","img":"r_ax6_61-0"},{"id":"ax6-t76","t":"ax6.hk","k":"text","q":"Hvad hedder fingrene?","a":"Pollex (første finger), index (anden finger), digitus medius, digitus anularis og digitus minimus.","img":"r_ax6_57-3"},{"id":"ax6-t77","t":"ax6.hk","k":"text","q":"Hvor mange knogler har carpus, og hvordan er de opdelt?","a":"8 knogler i en proksimal og en distal række med komplementære ledflader og samlet bevægelse.","img":"r_ax6_57-3"},{"id":"ax6-t78","t":"ax6.hk","k":"text","q":"Nævn den proksimale række af carpalknogler (radialt → ulnart).","a":"Os scaphoideum, os lunatum, os triquetrum, os pisiforme.","img":"r_ax6_58-1"},{"id":"ax6-t79","t":"ax6.hk","k":"text","q":"Nævn den distale række af carpalknogler (radialt → ulnart).","a":"Os trapezium, os trapezoideum, os capitatum, os hamatum.","img":"r_ax6_58-1"},{"id":"ax6-t80","t":"ax6.hk","k":"text","q":"Hvilken huskeregel bruges til de otte carpalknogler?","a":"**S**indssyge **L**æger **T**isser **P**å **T**rappen **T**il **C**apitol **H**ill\nScaphoideum, lunatum, triquetrum, pisiforme, trapezium, trapezoideum, capitatum, hamatum.","img":"r_ax6_58-1"},{"id":"ax6-t81","t":"ax6.hk","k":"text","q":"Hvilken alternativ huskeregel står i noterne til carpalknoglerne?","a":"Skaldede Ludere Trækker På Halmtorvet Ca Tretten Tredive: scaphoideum, lunatum, triquetrum, pisiforme, hamatum, capitatum, trapezoideum, trapezium.\nDen proksimale række er radialt → ulnart, den distale ulnart → radialt.","img":"r_ax6_58-1"},{"id":"ax6-t82","t":"ax6.hk","k":"text","q":"Os scaphoideum: form og kendetegn?","a":"Bådformet, med en særlig arteriegren (blodforsyning, se klinik).","img":"r_ax6_58-1"},{"id":"ax6-t83","t":"ax6.hk","k":"text","q":"Os lunatum: form og kendetegn?","a":"Måneformet, centrum for ligamenter.","img":"r_ax6_58-1"},{"id":"ax6-t84","t":"ax6.hk","k":"text","q":"Os triquetrum: form og kendetegn?","a":"Trekantet, bærer os pisiforme.","img":"r_ax6_58-1"},{"id":"ax6-t85","t":"ax6.hk","k":"text","q":"Os pisiforme: form og kendetegn?","a":"Ærtformet, ligger palmart og er fikspunkt for sener og ligamenter.","img":"r_ax6_58-1"},{"id":"ax6-t86","t":"ax6.hk","k":"text","q":"Os trapezium: form og kendetegn?","a":"Har en saddelformet ledfacet til pollex.","img":"r_ax6_58-1"},{"id":"ax6-t87","t":"ax6.hk","k":"text","q":"Os trapezoideum: kendetegn?","a":"Solid basis for 2. metacarpal.","img":"r_ax6_58-1"},{"id":"ax6-t88","t":"ax6.hk","k":"text","q":"Os capitatum: kendetegn?","a":"Størst af carpalknoglerne og omdrejningspunkt. Prominerer ind i den proksimale række.","img":"r_ax6_58-1"},{"id":"ax6-t89","t":"ax6.hk","k":"text","q":"Os hamatum: kendetegn?","a":"Har hamulus ossis hamati.","img":"r_ax6_58-1"},{"id":"ax6-t90","t":"ax6.hk","k":"text","q":"Hvilken carpalknogle har saddelformet ledflade mod pollex?","a":"**Os trapezium.**","img":"r_ax6_58-1"},{"id":"ax6-t91","t":"ax6.hk","k":"text","q":"Hvilken carpalknogle bærer hamulus?","a":"**Os hamatum.**","img":"r_ax6_58-1"},{"id":"ax6-t92","t":"ax6.hk","k":"text","q":"Hvilken carpalknogle bærer os pisiforme?","a":"**Os triquetrum.**","img":"r_ax6_58-1"},{"id":"ax6-t93","t":"ax6.hk","k":"text","q":"Hvad kendetegner ossa metacarpales generelt?","a":"Fem rørknogler, nummereret radialt → ulnart (I–V), hver med basis (proksimalt), corpus og caput (distalt).\nDe er stadig dækket af hud og hører ikke til fingrene.","img":"r_ax6_58-1"},{"id":"ax6-t94","t":"ax6.hk","k":"text","q":"Hvad kendetegner basis og caput på os metacarpale 2–5?","a":"**Basis** er kasseformet og kongruent med de tilstødende carpalknogler.\n**Caput** er kugleformet.","img":"r_ax6_58-1"},{"id":"ax6-t95","t":"ax6.hk","k":"text","q":"Hvad er særligt ved os metacarpale 1?","a":"Kortere og tykkere, indadroteret 70 grader og forskudt palmart.\nBasis er saddelformet og danner **saddelled med os trapezium**.\nCaput har to sesamknogler (ossa sesamoidea) på palmarsiden.","img":"r_ax6_58-1"},{"id":"ax6-t96","t":"ax6.hk","k":"text","q":"Hvilke knogler har hver finger, og hvad er undtagelsen?","a":"Phalanx proximalis (grundstykket), phalanx media (mellemstykket) og phalanx distalis (yderstykket).\n**Pollex har ikke et mellemstykke**, men kraftigere grund- og yderstykke.","img":"r_ax6_61-0"},{"id":"ax6-t97","t":"ax6.hk","k":"text","q":"Hvordan er ledfladerne på fingerknoglernes basis og caput?","a":"**Basis:** tværoval ledflade (med føringskam på mellem- og yderstykket).\n**Caput:** trisseformet ledflade (med føringsfure på grund- og mellemstykket).","img":"r_ax6_61-0"},{"id":"ax6-t98","t":"ax6.hk","k":"text","q":"Hvad hedder den distale ende af yderstykket, og hvad bærer den?","a":"**Tuberositas phalangealis distalis**, som bærer neglelejet.","img":"r_ax6_57-3"},{"id":"ax6-t99","t":"ax6.kl","k":"text","q":"Hvad er scapula alata, og hvad kan være årsagen?","a":"Englevinger (også kaldet rucksack paralysis). N. thoracicus longus innerverer m. serratus anterior, som holder scapula ind til thorax. Ved vedvarende tryk på skulderen presses nerven, og scapulas mediale kant kan ikke holdes ind mod thorax.","img":"r_ax6_28-0"},{"id":"ax6-t100","t":"ax6.kl","k":"text","q":"Hvorfor er m. supraspinatus klinisk vigtig?","a":"Den er den rotatormanchetmuskel, der oftest rumperer. Pga. degenerative forandringer i den specielle blodforsyning stiger risikoen med alderen.\nMistænk ruptur ved skuldertraume (også mildt) og alder over 50.","img":"r_ax6_38-4"},{"id":"ax6-t101","t":"ax6.kl","k":"text","q":"Hvad ses klinisk ved parese eller ruptur af m. supraspinatus?","a":"1) Besvær med abduktion, fordi musklen initierer bevægelsen. 2) Positiv **droparm-test**. 3) Risiko for op- eller nedglidning af caput humeri.\nBursit i bursa subacromialis giver smertebue-smerter.","img":"r_ax6_38-4"},{"id":"ax6-t102","t":"ax6.kl","k":"text","q":"Hvorfor giver en fraktur af os scaphoideum risiko for komplikationer?","a":"Kun den distale del af knoglen er velforsynet med blod. Ved fraktur i den proksimale del kan blodforsyningen afbrydes, så knoglen ikke heler (**pseudoartrose**).\nDer kan opstå iskæmi med risiko for håndledsarthrose senere."},{"id":"ax6-t103","t":"ax6.kl","k":"text","q":"Hvad er ikke omfattet af eksamensspørgsmålet om overekstremitetens muskler, og hvad gør man, hvis man trækker det?","a":"Spørgsmålet omfatter ikke håndens muskler.\nTrækker man spørgsmålet, bliver man bedt om fokus på en bestemt muskelgruppe. Ellers: spørg eksaminator."},{"id":"ax6-o104","t":"ax6.rm","k":"occ","img":"rmc","boxes":[[34.722,12.037,21.238,6.996],[38.484,25.103,20.718,6.996],[42.65,64.918,19.329,6.996],[41.84,78.704,17.535,5.761]],"target":0,"a":"M. supraspinatus","n":"Abduktion (initierer). Udspring: fossa supraspinata. Insertion: tuberculum majus, øverst. Nerve: n. suprascapularis."},{"id":"ax6-o105","t":"ax6.rm","k":"occ","img":"rmc","boxes":[[34.722,12.037,21.238,6.996],[38.484,25.103,20.718,6.996],[42.65,64.918,19.329,6.996],[41.84,78.704,17.535,5.761]],"target":1,"a":"M. subscapularis","n":"Indadrotation. Udspring: fossa subscapularis. Insertion: tuberculum minus (som den eneste). Nerve: nn. subscapulares."},{"id":"ax6-o106","t":"ax6.rm","k":"occ","img":"rmc","boxes":[[34.722,12.037,21.238,6.996],[38.484,25.103,20.718,6.996],[42.65,64.918,19.329,6.996],[41.84,78.704,17.535,5.761]],"target":2,"a":"M. infraspinatus","n":"Udadrotation. Udspring: fossa infraspinata. Insertion: tuberculum majus, under supraspinatus. Nerve: n. suprascapularis."},{"id":"ax6-o107","t":"ax6.rm","k":"occ","img":"rmc","boxes":[[34.722,12.037,21.238,6.996],[38.484,25.103,20.718,6.996],[42.65,64.918,19.329,6.996],[41.84,78.704,17.535,5.761]],"target":3,"a":"M. teres minor","n":"Udadrotation og svag adduktion. Udspring: øverste 2/3 af margo lateralis. Insertion: tuberculum majus, under infraspinatus. Nerve: n. axillaris."},{"id":"ax6-o108","t":"ax6.la","k":"occ","img":"post","boxes":[[3.228,1.44,22.673,4.39],[79.429,42.524,19.369,3.292],[46.021,81.824,19.144,3.841],[17.718,92.387,21.246,3.909]],"target":0,"a":"M. supraspinatus","n":"Abduktion (initierer). Nerve: n. suprascapularis. Ligger i fossa supraspinata."},{"id":"ax6-o109","t":"ax6.la","k":"occ","img":"post","boxes":[[3.228,1.44,22.673,4.39],[7
