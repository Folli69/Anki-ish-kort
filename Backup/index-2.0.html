","k":"text","q":"Hvad er forskellen på arterier og vener?","a":"**Arterier** fører blod væk fra hjertet og bringer ilt og næringsstoffer til vævene.\n**Vener** fører blod til hjertet: afiltet, CO2-rigt blod til hjerte-lungekredsløbet. De optager desuden næringsstoffer fra mave-tarmkanalen.","img":"r_ax8_8-6"},{"id":"ax8-t2","t":"ax8.kg","k":"text","q":"Hvilke tre opgaver har lymfesystemet?","a":"Dræner vævsvæske og tømmer sig i venerne ved halsroden. Indeholder lymfeknuder.\n1) Opsamle overflødig væske og føre den tilbage til blodkarsystemet. 2) Detektere vira, bakterier o.l. og præsentere dem for lymfocytter i lymfeknuderne. 3) Transportere fedtmolekyler fra GI-kanalen til blodbanen.","img":"r_ax8_8-6"},{"id":"ax8-t3","t":"ax8.kg","k":"text","q":"Hvad skal man kunne sige om et kar til eksamen?","a":"Navn; hvor karret starter og slutter (hvornår navnet skifter); forløb og relationer til nerver, muskler m.m.; hvilke grene der afgives, hvor og hvordan de forløber; hvilke områder og strukturer karret forsyner.","img":"r_ax8_8-6"},{"id":"ax8-t4","t":"ax8.kg","k":"text","q":"Hvor udspringer OE's arterier fra?","a":"Fra arcus aorta → truncus brachiocephalicus (kun på højre side) → **a. subclavia**, som forsyner hele overekstremiteten. Husk at angive sin. eller dex. ved a./v. subclavia.","img":"r_ax8_8-6"},{"id":"ax8-t5","t":"ax8.kg","k":"text","q":"Hvilke arterier findes fra costa 1 til fingerpulpa, og hvad forsyner de?","a":"**A. axillaris:** axillen og skulderen. **A. brachialis:** overarmen. **Aa. radialis et ulnaris:** underarmen. **Arci palmaris superficialis et profundus:** hånden.","img":"r_ax8_8-6"},{"id":"ax8-t6","t":"ax8.kg","k":"text","q":"Hvornår hedder OE's hovedarterie hvad?","a":"A. subclavia → (ved lateral kant af costa 1) **a. axillaris** → (ved underkanten af m. teres major) **a. brachialis** → (i fossa cubitalis) **a. radialis** og **a. ulnaris**.\nOE kar starter fra a. axillaris; a. subclavia er ikke en del af 'OE kar'.","img":"r_ax8_8-6"},{"id":"ax8-t7","t":"ax8.kg","k":"text","q":"Hvordan er skalenerporten afgrænset, og hvad løber igennem den?","a":"Mellem m. scalenus anterior og m. scalenus medius; bunden er sulcus a. subclaviae på costa 1.\nGennem porten løber **plexus brachialis** og **a. subclavia**. **V. subclavia** løber foran skalenerporten (foran m. scalenus anterior).","img":"r_ax8_12-2"},{"id":"ax8-t8","t":"ax8.kg","k":"text","q":"Skalenermusklerne: udspring og insertion?","a":"**Anterior:** tuberculum anterius på proc. transversus C3–C6 → costa 1 foran sulcus a. subclaviae.\n**Medius:** tuberculum posterius på proc. transversus C1–C7 → costa 1 bagved sulcus a. subclaviae.\n**Posterior:** tuberculum posterius C3–C4 → costa 2.","img":"r_ax8_12-2"},{"id":"ax8-t9","t":"ax8.kg","k":"text","q":"A. subclavia: hvordan forløber den?","a":"Bag art. sternoclavicularis, lateralt gennem skalenerporten hvilende på costa 1 (sulcus a. subclaviae). Fra lateral kant af costa 1 skifter den navn til a. axillaris og løber ned i fossa axillaris i en fælles bindevævsskede med plexus brachialis.","img":"r_ax8_8-6"},{"id":"ax8-t10","t":"ax8.kg","k":"text","q":"Hvilke fire grene afgår fra a. subclavia (mediale del)?","a":"1) **A. vertebralis**. 2) **Truncus thyrocervicalis** (afgiver først a. suprascapularis til m. supra- og infraspinatus). 3) **A. thoracica interna**. 4) **Truncus costocervicalis**.\nGrenene afgår medialt for m. scalenus anterior.","img":"r_ax8_13-2"},{"id":"ax8-t11","t":"ax8.fa","k":"text","q":"Hvad er fossa axillaris?","a":"Et bindevævsrum i armhulen med form som en tresidet pyramide (med apex og basis), som indeholder kar-nervebundtet til OE.","img":"r_ax8_14-2"},{"id":"ax8-t12","t":"ax8.fa","k":"text","q":"Fossa axillaris: hvad udgør apex og basis?","a":"**Apex:** costa 1, angulus superior scapulae og clavicula ('canalis cervico-axillaris'): passage for a. et v. axillaris og plexus brachialis.\n**Basis:** fascia axillaris (mellem m. pectoralis major og m. latissimus dorsi).","img":"r_ax8_14-2"},{"id":"ax8-t13","t":"ax8.fa","k":"text","q":"Fossa axillaris: hvad udgør forvæg og bagvæg?","a":"**Forvæg:** superficielt m. pectoralis major (forreste axilfold); profundt m. subclavius – fascia clavipectoralis – m. pectoralis minor – lig. suspensorium.\n**Bagvæg:** kranielt m. subscapularis; kaudalt mm. latissimus dorsi og teres major (bagerste axilfold); lateralt caput longum af m. triceps brachii.","img":"r_ax8_14-2"},{"id":"ax8-t14","t":"ax8.fa","k":"text","q":"Fossa axillaris: hvad udgør medialvæg og lateralvæg?","a":"**Medialvæg:** de øverste 6 costae, mm. intercostales og m. serratus anterior.\n**Lateralvæg:** findes strengt taget ikke; her ligger humerus.","img":"r_ax8_14-2"},{"id":"ax8-t15","t":"ax8.fa","k":"text","q":"Hvad er fascia axillaris?","a":"Axillens bundfascie; ligger lige under huden i armhulen og løftes op af lig. suspensorium axillae.","img":"r_ax8_14-3"},{"id":"ax8-t16","t":"ax8.fa","k":"text","q":"Hvad afgrænser de tre intersticer?","a":"**Mediale trekantede:** m. teres minor, m. teres major, m. subscapularis, caput longum m. tricipitis.\n**Firkantede (laterale):** caput longum m. tricipitis, m. teres major, m. teres minor, humerus (collum chirurgicum).\n**Nedre (laterale) trekantede:** caput longum m. tricipitis, m. teres major, proksimale humerus.","img":"r_ax8_16-2"},{"id":"ax8-t17","t":"ax8.fa","k":"text","q":"Hvad løber igennem de tre intersticer?","a":"**Mediale trekantede:** a. circumflexa scapulae.\n**Firkantede:** a. circumflexa humeri posterior + n. axillaris.\n**Nedre trekantede:** a. profunda brachii + n. radialis.","img":"r_ax8_16-2"},{"id":"ax8-t18","t":"ax8.fa","k":"text","q":"Hvordan kan man huske intersticerne?","a":"Ved at lave deres form med fingrene.","img":"r_ax8_16-2"},{"id":"ax8-t19","t":"ax8.aa","k":"text","q":"A. axillaris: start, slut og forløb?","a":"**Start:** lateral kant af costa 1 (apex af fossa axillaris). **Slut:** underkanten af m. teres major (bageste axilfold).\nLøber gennem fossa axillaris omkranset af plexus brachialis (medialt, lateralt og posteriort, ikke anteriort, hvor v. axillaris ses) i en fælles bindevævsskede, og posteriort for m. coracobrachialis.","img":"r_ax8_25-6"},{"id":"ax8-t20","t":"ax8.aa","k":"text","q":"Hvordan inddeles a. axillaris, og hvilke grene har den?","a":"Tre stykker i forhold til m. pectoralis minor (før, under, efter):\n**1. stykke:** a. thoracica superior (ikke pensum).\n**2. stykke:** a. thoracoacromialis + a. thoracica lateralis.\n**3. stykke:** a. subscapularis, a. circumflexa humeri anterior + posterior.","img":"r_ax8_25-6"},{"id":"ax8-t21","t":"ax8.aa","k":"text","q":"Hvilken huskeregel bruges til a. axillaris' seks grene?","a":"T-T-T-S-C-C: thoracica superior, thoracoacromialis, thoracica lateralis, subscapularis, circumflexa humeri (anterior og posterior).\n'She Tastes Like Sweet Apple Pie.'","img":"r_ax8_25-6"},{"id":"ax8-t22","t":"ax8.aa","k":"text","q":"A. thoracoacromialis og a. thoracica lateralis: udspring og forsyning?","a":"**A. thoracoacromialis:** udspringer ved overkanten af m. pectoralis minor; grene til acromion (+ hud), m. deltoideus, clavicula og mm. pectorales.\n**A. thoracica lateralis:** udspringer bag og løber langs lateralkanten af m. pectoralis minor; forsyner m. serratus anterior, mm. pectorales og mammae.","img":"r_ax8_25-6"},{"id":"ax8-t23","t":"ax8.aa","k":"text","q":"A. thoracica superior: udspring og forsyning?","a":"Udspringer under m. subclavius og forsyner mm. pectorales og thoraxvæggen. Ikke pensum.","img":"r_ax8_25-6"},{"id":"ax8-t24","t":"ax8.aa","k":"text","q":"A. subscapularis: forløb og grene?","a":"Udspringer fra underkanten af m. subscapularis (som den forsyner) og løber langs margo lateralis. Deler sig i:\n**A. circumflexa scapulae:** gennem det mediale trekantede interstice → fossa infraspinata.\n**A. thoracodorsalis:** fortsætter mod angulus inferior (med n. thoracodorsalis) og ender i m. latissimus dorsi.","img":"r_ax8_25-6"},{"id":"ax8-t25","t":"ax8.aa","k":"text","q":"Aa. circumflexae humeri posterior og anterior: forløb og forsyning?","a":"Afgives ved collum chirurgicum. **Posterior** løber gennem det firkantede interstice; **anterior** løber anteriort for collum chirurgicum.\nForsyner humerus, art. humeri og musklerne omkring.","img":"r_ax8_25-6"},{"id":"ax8-t26","t":"ax8.aa","k":"text","q":"A. brachialis: start, forløb og slut?","a":"**Start:** underkanten af m. teres major. **Forløb:** sulcus bicipitalis medialis i tæt relation til n. medianus (som krydser fra lateralt til medialt foran arterien), n. ulnaris (medialt) og vv. brachiales.\n**Slut:** fossa cubitalis, profundt for aponeurosis m. bicipitis brachii, hvor den deler sig i a. radialis og a. ulnaris proksimalt for m. pronator teres.","img":"r_ax8_27-3"},{"id":"ax8-t27","t":"ax8.aa","k":"text","q":"A. brachialis: hvilke grene afgiver den?","a":"**A. profunda brachii** (helt proksimalt): gennem det nedre trekantede interstice sammen med n. radialis til bagsiden af overarmen; forsyner m. triceps brachii.\n**Rete articulare cubiti:** anastomoserende netværk på bagsiden af art. cubiti (fra a. brachialis + a. profunda brachii); lokal temperaturregulering.\nDeler sig i a. radialis og a. ulnaris.","img":"r_ax8_27-3"},{"id":"ax8-t28","t":"ax8.aa","k":"text","q":"Hvorfor er variationer af a. brachialis klinisk vigtige?","a":"Variationer er hyppige (10–15 %), fx høj deling af a. radialis eller a. ulnaris. Det giver større risiko for lædering af en arterie ved venepunktur og blodtryksmåling; palper altid for pulsation, før der stikkes.","img":"r_ax8_27-3"},{"id":"ax8-t29","t":"ax8.fc","k":"text","q":"Hvad er fossa cubitalis, og hvordan er den afgrænset?","a":"En V-formet grube (bindevævsrum), hvor 'benene' fortsætter i sulcus bicipitalis medialis og lateralis.\n**Superficielt:** fascia antebrachii. **Gulv:** m. brachialis (proksimalt/medialt) og m. supinator (distalt/lateralt). **Lateralt:** m. brachioradialis. **Medialt:** m. pronator teres.","img":"r_ax8_29-2"},{"id":"ax8-t30","t":"ax8.fc","k":"text","q":"Hvad indeholder fossa cubitalis?","a":"N. medianus; r. profundus n. radialis (gennem Frohses kanal i m. supinator); r. superficialis n. radialis; a. brachialis (→ a. radialis og a. ulnaris); v. mediana cubiti (superficielt); tendo + aponeurosis m. bicipitis brachii.","img":"r_ax8_29-2"},{"id":"ax8-t31","t":"ax8.ar","k":"text","q":"A. ulnaris: start og forløb?","a":"Største gren fra a. brachialis; forsyner den ulnare side af underarmen. Start: deling i fossa cubitalis, profundt for CCF-musklerne.\nLøber profundt for muskler med udspring fra CCF, under senebroen fra m. flexor digitorum superficialis, ovenpå m. flexor digitorum profundus og under m. flexor carpi ulnaris med n. ulnaris. Ender radialt for senen til m. flexor carpi ulnaris.","img":"r_ax8_33-2"},{"id":"ax8-t32","t":"ax8.ar","k":"text","q":"A. ulnaris: slut og grene?","a":"**Slut:** træder ind i hånden superficielt for fleksorretinaklet gennem Guyons kanal og fortsætter som arcus palmaris superficialis.\n**Grene:** a. interossea communis (→ anterior + posterior), r. palmaris profundus, grene til rete articulare cubiti og rete carpale dorsale.","img":"r_ax8_33-2"},{"id":"ax8-t33","t":"ax8.ar","k":"text","q":"A. interossea anterior og posterior: forløb?","a":"**Anterior:** løber på forfladen af membrana interossea mellem m. flexor pollicis longus og m. flexor digitorum profundus; perforerer membranen ved overkanten af m. pronator quadratus og ender i rete carpale dorsale.\n**Posterior:** perforerer membranen proksimalt ved underkanten af m. supinator, ligger mellem de superficielle og profunde ekstensorer og ender i rete carpale dorsale.","img":"r_ax8_33-2"},{"id":"ax8-t34","t":"ax8.ar","k":"text","q":"R. palmaris profundus (a. ulnaris): forløb?","a":"Afgives lige før overgangen til arcus palmaris superficialis, perforerer hypothenar, går retrotendinøst og forenes med arcus palmaris profundus.","img":"r_ax8_33-2"},{"id":"ax8-t35","t":"ax8.ar","k":"text","q":"A. radialis: start og forløb i underarmen?","a":"Mindste gren af a. brachialis; forsyner den radiale side af underarmen. Start i fossa cubitalis, superficielt for m. supinator.\nDækkes af m. brachioradialis i næsten hele forløbet og løber på m. pronator teres, m. flexor digitorum superficialis, m. flexor pollicis longus og m. pronator quadratus. Distalt ligger den lateralt for tendo m. flexoris carpi radialis (tydelig puls).","img":"r_ax8_36-6"},{"id":"ax8-t36","t":"ax8.ar","k":"text","q":"A. radialis: distale forløb til hånden?","a":"Ved proc. styloideus radii snor den sig om tommelens CMC-led, krydser senerne i kulisse 1, ligger i bunden af tabatieren (puls) under tendo m. extensoris pollicis longi, går til palma manus mellem de to hoveder af m. interosseus dorsalis I og ender palmart i arcus palmaris profundus.","img":"r_ax8_36-6"},{"id":"ax8-t37","t":"ax8.ar","k":"text","q":"A. radialis: hvilke grene afgives?","a":"Inden arcus palmaris profundus: **a. princeps pollicis** (tommelens palmarside) og **a. radialis indicis** (pegefingerens radialside).\nDesuden **r. palmaris superficialis**, som afgives inden a. radialis forlader palmarsiden og anastomoserer med arcus palmaris superficialis.","img":"r_ax8_36-6"},{"id":"ax8-t38","t":"ax8.ar","k":"text","q":"Arcus palmaris superficialis: forløb og afgivelser?","a":"Fortsættelse af a. ulnaris; starter distalt, radialt for os pisiforme. Ligger prætendinøst i vola manus mellem aponeurosis palmaris og fleksorsenerne. Distal konveks bue mod thenar; anastomoserer med r. palmaris superficialis a. radialis.\nAfgiver **3 aa. digitales palmares communes** → aa. digitales palmares propriae (2 pr. finger, plexus i fingerpulpa). Den laterale a. digitalis propria på 5. finger afgår direkte fra buen.","img":"r_ax8_40-0"},{"id":"ax8-t39","t":"ax8.ar","k":"text","q":"Arcus palmaris profundus: forløb, afgivelser og modtagelser?","a":"Fortsættelse af a. radialis; starter efter passagen af de to hoveder af m. interosseus dorsalis I, går gennem de to hoveder af m. adductor pollicis og ligger retrotendinøst (under fleksorsener og lumbricales, over metacarpalia og mm. interossei palmares), ca. 1 cm proksimalt for arcus superficialis. Anastomoserer med r. palmaris profundus a. ulnaris.\nAfgiver **aa. metacarpales palmares**; modtager rr. perforantes fra aa. metacarpales dorsales.","img":"r_ax8_42-2"},{"id":"ax8-t40","t":"ax8.ar","k":"text","q":"Rete carpale dorsale: tilskud og afgivelser?","a":"Anastomoserende arterielt netværk. Tilskud fra a. ulnaris, a. radialis og a. interossea anterior + posterior.\nDanner aa. metacarpales dorsales (ovenpå mm. interossei dorsales), aa. digitales dorsales (når kun lige distalt for grundleddet) og rr. perforantes, som anastomoserer med arcus palmaris profundus.","img":"r_ax8_42-2"},{"id":"ax8-t41","t":"ax8.ve","k":"text","q":"Hvordan er OE's vener inddelt, og hvor tømmer de sig?","a":"Superficielle og profunde vener. Alle tømmer sig i **v. axillaris → v. subclavia → v. brachiocephalica → v. cava superior**.","img":"r_ax8_44-0"},{"id":"ax8-t42","t":"ax8.ve","k":"text","q":"Hvad er vv. comitantes, og hvad er forskellen på profunde og superficielle vener?","a":"Profunde vener følger arterierne (**vv. comitantes**), 2 pr. arterie til en vis størrelse på overarmen; pulsen fra arterien overføres til venerne.\nSuperficielle vener har eget navn og er ikke parrede. Venerne kommunikerer via vv. perforantes; kombinationen giver optimal termoregulering.","img":"r_ax8_44-0"},{"id":"ax8-t43","t":"ax8.ve","k":"text","q":"Hvad er rete venosum dorsale manus?","a":"Et venenet på håndryggen, der modtager fingervenerne. Det dræneres af **v. cephalica** (radialt), **v. basilica** (ulnart) og **v. mediana antebrachii** (ventralt).","img":"r_ax8_45-2"},{"id":"ax8-t44","t":"ax8.ve","k":"text","q":"V. cephalica: forløb?","a":"Udgår fra den radiale del af rete venosum dorsale. Underarm: langs den radiale side. Regio cubiti: afgiver v. mediana cubiti. Overarm: sulcus bicipitalis lateralis. Skulder: perforerer trigonum clavipectorale mellem m. deltoideus og m. pectoralis major og ender i v. axillaris.","img":"r_ax8_46-1"},{"id":"ax8-t45","t":"ax8.ve","k":"text","q":"V. basilica: forløb?","a":"Udgår fra den ulnare del af rete venosum dorsale. Underarm: langs den ulnare side. Regio cubiti: modtager v. mediana cubiti. Overarm: sulcus bicipitalis medialis; perforerer fascia brachii midt på armen og tømmer i v. brachialis.","img":"r_ax8_46-1"},{"id":"ax8-t46","t":"ax8.ve","k":"text","q":"V. mediana antebrachii og v. mediana cubiti?","a":"**V. mediana antebrachii:** lille vene fra det overfladiske venenet i håndfladen; ascenderer på underarmens forside og tømmes typisk i v. mediana cubiti.\n**V. mediana cubiti:** variabel forbindelse mellem v. cephalica og v. basilica; anastomoserer med dybe vener i fossa cubitalis.","img":"r_ax8_45-2"},{"id":"ax8-t47","t":"ax8.ly","k":"text","q":"Hvordan er armens lymfekar inddelt?","a":"**Superficielle:** starter som grovmasket netværk dorsalt eller finmasket palmart; løber uden stop til lnn. axillares tæt sammen med v. cephalica og v. basilica.\n**Profunde:** følger de store arterier og ender i lnn. axillares, evt. med stop i lnn. cubitales.","img":"r_ax8_49-0"},{"id":"ax8-t48","t":"ax8.ly","k":"text","q":"Hvordan inddeles axillens lymfeknuder (nodi lymphatici axillares)?","a":"**Fremskudte:** laterale (armen langs v. basilica), pectorale (kropsvæg og mammae), subscapulære (bagsiden af thorax og skulderregion).\n**Dybe:** centrale (basis af fossa axillaris; dræner de 3 fremskudte → apikale) og apikale (apex; dræner armen langs v. cephalica og øverste del af mammae og modtager fra resten).","img":"r_ax8_50-0"},{"id":"ax8-t49","t":"ax8.ly","k":"text","q":"Hvor ender lymfen fra axillens knuder?","a":"De efferente kar fortsætter i truncus subclavius → **ductus thoracicus** ved overgangen til v. subclavia sin., eller **ductus lymphaticus dxt.** ved overgangen til v. subclavia dxt.","img":"r_ax8_50-0"},{"id":"ax8-t50","t":"ax8.ly","k":"text","q":"Hvilket drænageområde har ductus lymphaticus dxt. og ductus thoracicus?","a":"Lymfe fra højre øvre del ender i ductus lymphaticus dxt. Den venstre del (den største) ender i ductus thoracicus.","img":"r_ax8_51-2"},{"id":"ax8-t51","t":"ax8.ly","k":"text","q":"Hvordan adskiller man arterier, vener og nerver ved præparation?","a":"**Arterier:** tykvæggede og hule, nogle gange svagt rødlige.\n**Vener:** tyndvæggede og hule, nogle gange svagt blålige; man finder ofte koagelrester.\n**Nerver:** ikke hule, man kan ane nervefibrene; let gullige.\nFarven kan kun nogle gange bruges til at skelne.","img":"r_ax8_5-1"},{"id":"ax8-o52","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":0,"a":"N. musculocutaneus","n":"Forreste (fleksor-)loge; motorisk til overarmens fleksorer."},{"id":"ax8-o53","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":1,"a":"N. medianus","n":"Følger a. brachialis i sulcus bicipitalis medialis."},{"id":"ax8-o54","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":2,"a":"V. cephalica","n":"Ligger i sulcus bicipitalis lateralis, superficielt."},{"id":"ax8-o55","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":3,"a":"V. basilica","n":"Ligger i sulcus bicipitalis medialis, superficielt til den perforerer fascia brachii."},{"id":"ax8-o56","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":4,"a":"Fascia brachii","n":"Omslutter overarmens muskler og opdeler dem i loger."},{"id":"ax8-o57","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":5,"a":"N. ulnaris","n":"Medialt, senere gennem septum intermusculare brachii mediale."},{"id":"ax8-o58","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":6,"a":"Septum intermusculare mediale","n":"Adskiller fleksorloge og ekstensorloge medialt."},{"id":"ax8-o59","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":7,"a":"N. radialis","n":"Ekstensorlogen; snor sig om humerus i sulcus nervi radii."},{"id":"ax8-o60","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":8,"a":"Flexorlogen","n":"Forreste loge: biceps, coracobrachialis, brachialis; n. musculocutaneus."},{"id":"ax8-o61","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":9,"a":"Extensorlogen","n":"Bageste loge: triceps brachii; n. radialis."},{"id":"ax8-n62","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":1,"a":"A. subclavia","n":"Ikke en del af 'OE kar'; skifter navn til a. axillaris ved lateral kant af costa 1.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n63","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":2,"a":"A. axillaris","n":"Fra lateral kant af costa 1 til underkanten af m. teres major.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n64","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":3,"a":"A. brachialis","n":"Fra underkanten af m. teres major til fossa cubitalis.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n65","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":4,"a":"A. radialis","n":"Den radiale (laterale) gren af a. brachialis.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n66","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":5,"a":"A. ulnaris","n":"Den ulnare (mediale) gren af a. brachialis; største gren.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n67","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":1,"a":"A. radialis","n":"Fortsætter i arcus palmaris profundus.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n68","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":2,"a":"A. ulnaris","n":"Fortsætter i arcus palmaris superficialis.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n69","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":3,"a":"A. digitalis palmaris communis","n":"Afgives fra arcus palmaris superficialis (3 stk.).","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n70","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":4,"a":"A. digitalis palmaris propria","n":"Løber langs fingrenes kanter, 2 pr. finger.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n71","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":5,"a":"A. princeps pollicis","n":"Afgives fra a. radialis; forsyner tommelens palmarside.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n72","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":6,"a":"Arcus palmaris profundus","n":"Fortsættelse af a. radialis; retrotendinøs.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax9-t1","t":"ax9.ms","k":"text","q":"Hvor starter og slutter medulla spinalis, og hvad er de to fortykkelser?","a":"Start: foramen magnum. Slut: mellem L1 og L2.\n**Intumescentia cervicalis** (plexus brachialis) og **intumescentia lumbosacralis** (plexus lumbosacralis). Nederst ses conus medullaris og filum terminale.","img":"r_ax9_9-3"},{"id":"ax9-t2","t":"ax9.ms","k":"text","q":"Hvor mange spinalnerver og segmenter er der?","a":"**31 spinalnerver** fordelt på **5 segmenter** (cervicale, thorakale, lumbale, sakrale, coccygeale).","img":"r_ax9_8-2"},{"id":"ax9-t3","t":"ax9.ms","k":"text","q":"Hvordan opstår en spinalnerve?","a":"Af en **ventral motorisk rod** og en **dorsal sensorisk rod** (radix) fra rygmarvssegmenterne. Rødderne løber sammen i foramen intervertebrale og bliver til én spinalnerve. Der er et ganglion spinale på den dorsale rod.","img":"r_ax9_8-2"},{"id":"ax9-t4","t":"ax9.ms","k":"text","q":"Hvordan deler en spinalnerve sig, og hvad forsyner grenene?","a":"Spinalnerver er ganske korte og deler sig i **ramus ventralis** og **ramus dorsalis**.\nEkstremitetsplexerne dannes af rami ventrales. Rami dorsales innerverer den dybe rygmuskulatur og huden bagpå ryggen.","img":"r_ax9_8-2"},{"id":"ax9-t5","t":"ax9.ms","k":"text","q":"Hvorfor er der 8 cervicale spinalnerver, men kun 7 cervicale vertebrae?","a":"C1 udspringer **over** første cervicale hvirvel. De første 7 spinalnerver udgår over den tilhørende hvirvel (C7 over vertebra C7), C8 under vertebra C7. Fra T1 udgår spinalnerverne under den tilhørende hvirvel.","img":"r_ax9_8-2"},{"id":"ax9-t6","t":"ax9.ms","k":"text","q":"Hvad skal man kunne sige, når man beskriver en nerve?","a":"Evt. hvilke spinalsegmenter den kommer fra; navn og om den er motorisk, sensorisk eller blandet; forløb og relationer; om den afgiver rami; innervationsområde (kutant eller muskelinnervation).","img":"r_ax9_8-2"},{"id":"ax9-t7","t":"ax9.pb","k":"text","q":"Hvad løber gennem skalenerporten til OE?","a":"**Plexus brachialis, a. subclavia og n. phrenicus.** Ikke v. subclavia (den løber foran).\nN. dorsalis scapulae og n. thoracicus longus perforerer m. scalenus medius.","img":"r_ax9_14-2"},{"id":"ax9-t8","t":"ax9.pb","k":"text","q":"Hvilke segmenter danner plexus brachialis?","a":"Rami ventrales fra **C5–C8 og T1** (med tilskud fra C4 og T2). Plexus = 'fletværk'.","img":"r_ax9_19-2"},{"id":"ax9-t9","t":"ax9.pb","k":"text","q":"Hvilke tre trunci har plexus brachialis, og hvad består de af?","a":"Trunci dannes i skalenerporten:\n**Truncus superior:** C5 + C6\n**Truncus medius:** C7\n**Truncus inferior:** C8 + T1","img":"r_ax9_36-2"},{"id":"ax9-t10","t":"ax9.pb","k":"text","q":"Hvordan dannes de tre fasciculi?","a":"Trunci deler sig i en anterior og en posterior gren, og de danner tre fasciculi i fossa axillaris:\n**Fasciculus lateralis:** anteriore grene fra truncus superior + medius.\n**Fasciculus medialis:** anterior gren fra truncus inferior.\n**Fasciculus posterior:** posteriore grene fra alle trunci.","img":"r_ax9_36-2"},{"id":"ax9-t11","t":"ax9.pb","k":"text","q":"Hvilke sider af armen forsynes af de tre fasciculi?","a":"Fleksorsiden forsynes af fasciculus lateralis og medialis. Ekstensorsiden forsynes af fasciculus posterior.","img":"r_ax9_36-2"},{"id":"ax9-t12","t":"ax9.pb","k":"text","q":"Hvad er den supra- og infraclaviculære del af plexus brachialis?","a":"Clavicula deler plexet. **Supraclaviculært:** foramina intervertebralia → rr. ventrales → trunci (i skalenerporten) → anteriore og posteriore grene. **Infraclaviculært:** fasciculi og de store blandede nerver.","img":"r_ax9_19-2"},{"id":"ax9-t13","t":"ax9.pb","k":"text","q":"Hvilke nerver udgår fra hver fasciculus?","a":"**Fasciculus lateralis:** n. musculocutaneus + radix lateralis n. mediani.\n**Fasciculus medialis:** n. ulnaris + radix medialis n. mediani.\n**Fasciculus posterior:** n. axillaris + n. radialis.","img":"r_ax9_36-2"},{"id":"ax9-t14","t":"ax9.pb","k":"text","q":"Hvilken huskeregel gælder for de fem blandede nerver?","a":"**M**in **A**xil **M**ed **R**ødt **U**dslæt: n. musculocutaneus, n. axillaris, n. medianus, n. radialis, n. ulnaris.\n(N. medianus danner plexets 'M' mellem fasciculus lateralis og medialis.)","img":"r_ax9_36-2"},{"id":"ax9-t15","t":"ax9.pb","k":"text","q":"Hvordan inddeles plexus brachialis' nerver?","a":"**Supraclaviculære (motoriske):** n. dorsalis scapulae, n. thoracicus longus, n. subclavius, n. suprascapularis.\n**Infraclaviculære, motoriske:** n. pectoralis medialis og lateralis, nn. subscapulares, n. thoracodorsalis.\n**Infraclaviculære, sensoriske:** n. cutaneus brachii medialis, n. cutaneus antebrachii medialis.\n**Blandede:** n. musculocutaneus, n. axillaris, n. medianus, n. radialis, n. ulnaris.","img":"r_ax9_19-2"},{"id":"ax9-t16","t":"ax9.pb","k":"text","q":"Hvilke rygmarvssegmenter har de supraclaviculære nerver?","a":"N. dorsalis scapulae: C4–C5. N. thoracicus longus: C5–C7. N. subclavius: C5–C6. N. suprascapularis: C5–C6.","img":"r_ax9_19-2"},{"id":"ax9-t17","t":"ax9.pb","k":"text","q":"Hvilke segmenter har de infraclaviculære motoriske og sensoriske nerver?","a":"N. pectoralis medialis: C8–T1. N. pectoralis lateralis: C5–C7. Nn. subscapulares: C5–C6. N. thoracodorsalis: C6–C8.\nN. cutaneus brachii medialis: T1. N. cutaneus antebrachii medialis: C8–T1.","img":"r_ax9_19-2"},{"id":"ax9-t18","t":"ax9.pb","k":"text","q":"Hvilke segmenter har de fem blandede nerver?","a":"N. musculocutaneus: C5–C7. N. medianus: C6–T1. N. ulnaris: C7–T1. N. axillaris: C5–C6. N. radialis: C5–T1.","img":"r_ax9_19-2"},{"id":"ax9-t19","t":"ax9.pb","k":"text","q":"Hvad skal man fokusere på ved eksamensspørgsmålene 'OE nerver' og 'Plexus brachialis'?","a":"**OE nerver:** kun de blandede nerver.\n**Plexus brachialis:** alt andet, men med mindre fokus på de blandede nerver.","img":"r_ax9_19-2"},{"id":"ax9-t20","t":"ax9.sn","k":"text","q":"N. dorsalis scapulae: forløb og innervation?","a":"Afgår i foramen intervertebrale fra r. ventralis C5, perforerer m. scalenus medius, løber på forfladen af m. levator scapulae og langs medialkanten af scapula.\nInnerverer **mm. rhomboidei og m. levator scapulae**.","img":"r_ax9_23-0"},{"id":"ax9-t21","t":"ax9.sn","k":"text","q":"N. thoracicus longus: forløb og innervation?","a":"Afgår fra rr. ventrales C5–C7, perforerer m. scalenus medius og løber nedad på lateralfladen af m. serratus anterior sammen med a. thoracica lateralis.\nInnerverer **m. serratus anterior**.","img":"r_ax9_23-0"},{"id":"ax9-t22","t":"ax9.sn","k":"text","q":"N. subclavius: udspring og innervation?","a":"Afgår fra truncus superior (C5–C6), løber fremad mod m. subclavius og innerverer den.","img":"r_ax9_24-0"},{"id":"ax9-t23","t":"ax9.sn","k":"text","q":"N. suprascapularis: forløb og innervation?","a":"Afgår fra truncus superior (C5–C6). Mod scapulas overkant, under lig. transversum scapulae superius (incisura scapulae), lateralt om spina scapulae til fossa infraspinata.\nInnerverer **m. supraspinatus og m. infraspinatus**.","img":"r_ax9_25-0"},{"id":"ax9-t24","t":"ax9.sn","k":"text","q":"N. pectoralis medialis og lateralis: afgang og innervation?","a":"**Medialis:** fasciculus medialis (C8–T1); perforerer m. pectoralis minor.\n**Lateralis:** fasciculus lateralis (C5–C7); fremkommer superiort og medialt for m. pectoralis minor.\nBegge innerverer mm. pectorales major et minor.","img":"r_ax9_28-3"},{"id":"ax9-t25","t":"ax9.sn","k":"text","q":"Nn. subscapulares og n. thoracodorsalis: afgang og innervation?","a":"Begge fra fasciculus posterior.\n**Nn. subscapulares (C5–C6):** løber nedad på forsiden af m. subscapularis; innerverer m. subscapularis + m. teres major.\n**N. thoracodorsalis (C6–C8):** krydser scapulas lateralkant og følger a. thoracodorsalis; innerverer m. latissimus dorsi.","img":"r_ax9_29-2"},{"id":"ax9-t26","t":"ax9.sn","k":"text","q":"N. cutaneus brachii medialis: afgang og innervationsområde?","a":"Fasciculus medialis (T1). Løber distalt bagved, herefter medialt for a. axillaris; anastomoserer med nn. intercostobrachiales; perforerer fascia axillaris og brachii.\nInnerverer **overarmens medialside**.","img":"r_ax9_51-1"},{"id":"ax9-t27","t":"ax9.sn","k":"text","q":"N. cutaneus antebrachii medialis: afgang og innervationsområde?","a":"Fasciculus medialis (C8–T1). Distalt langs a. axillaris og a. brachialis, perforerer fascia brachii sammen med v. basilica og følger den; deler sig ved art. cubiti i en anterior og en ulnar gren.\nInnerverer **underarmens medialside**.","img":"r_ax9_51-1"},{"id":"ax9-t28","t":"ax9.sn","k":"text","q":"Hvad er nn. intercostobrachiales?","a":"Nerver fra to nn. intercostales (T2 og T3), der innerverer axillen og den mediale, proksimale del af brachium og anastomoserer med n. cutaneus brachii medialis.","img":"r_ax9_51-1"},{"id":"ax9-t29","t":"ax9.mu","k":"text","q":"N. musculocutaneus: innervation og segmenter?","a":"C5–C7, fra fasciculus lateralis. **Motorisk:** overarmens fleksorer. **Kutant:** underarmen lateralt.","img":"r_ax9_39-8"},{"id":"ax9-t30","t":"ax9.mu","k":"text","q":"N. musculocutaneus: forløb?","a":"Perforerer m. coracobrachialis, løber distalt mellem m. biceps brachii og m. brachialis, perforerer fascia brachii ud for bicepssenens insertion og ender som **n. cutaneus antebrachii lateralis**, som fortsætter på fascia antebrachii sammen med v. cephalica.","img":"r_ax9_39-8"},{"id":"ax9-t31","t":"ax9.mu","k":"text","q":"N. axillaris: innervation og segmenter?","a":"C5–C6, fra fasciculus posterior. **Motorisk:** m. deltoideus og m. teres minor. **Kutant:** overarmens øvre laterale del (n. cutaneus brachii lateralis superior).","img":"r_ax9_40-0"},{"id":"ax9-t32","t":"ax9.mu","k":"text","q":"N. axillaris: forløb?","a":"Passerer gennem det firkantede interstice i axillens bagvæg sammen med a. circumflexa humeri posterior, snor sig om collum chirurgicum og afgiver motoriske grene til m. deltoideus.\nN. cutaneus brachii lateralis superior løber superficielt ved bagkanten af m. deltoideus.","img":"r_ax9_40-0"},{"id":"ax9-t33","t":"ax9.me","k":"text","q":"N. medianus: innervation og segmenter?","a":"C6–T1, fra fasciculus lateralis + medialis.\n**Motorisk:** alle underarmens fleksorer undtagen m. flexor carpi ulnaris og den ulnare del af m. flexor digitorum profundus; thenar (undtagen m. adductor pollicis); de radiale 2 lumbricaler.\n**Kutant:** 3½ radiale fingre og radiale palma.","img":"r_ax9_43-0"},{"id":"ax9-t34","t":"ax9.me","k":"text","q":"N. medianus: forløb i overarm og underarm?","a":"Følger a. brachialis i sulcus bicipitalis medialis og krydser fra lateralt til medialt for arterien. Passerer til fossa cubitalis profundt for aponeurosis m. bicipitis brachii, mellem m. pronator teres' to hoveder og under senebuen for m. flexor digitorum superficialis; distalt på underarmen profundt for m. flexor digitorum superficialis.","img":"r_ax9_43-0"},{"id":"ax9-t35","t":"ax9.me","k":"text","q":"N. medianus: forløb i hånden og endegrene?","a":"Passerer canalis carpi lige under fleksorretinaklet. Ud for retinaklets distale kant nås endegrenene: **nn. digitales palmares communes** (3 stk.), der deler sig i **nn. digitales palmares proprii** (7 stk. til de 3½ radiale fingre).","img":"r_ax9_44-1"},{"id":"ax9-t36","t":"ax9.me","k":"text","q":"Hvilke grene afgiver n. medianus?","a":"**N. interosseus anterior:** proksimalt på underarmen; løber på membrana interossea og innerverer m. flexor digitorum profundus (radiale del), m. flexor pollicis longus og m. pronator quadratus.\n**R. palmaris:** proksimalt for retinaklet; huden i hulhånden.\n**R. muscularis:** distalt for retinaklet, recurrent ind i thenar; innerverer FPB, APB og opponens + de to radiale lumbricaler.","img":"r_ax9_44-1"},{"id":"ax9-t37","t":"ax9.ul","k":"text","q":"N. ulnaris: innervation og segmenter?","a":"C7–T1, fra fasciculus medialis.\n**Motorisk:** m. flexor carpi ulnaris, ulnare del af m. flexor digitorum profundus, størstedelen af håndens muskler (minus ½ LOAF).\n**Kutant:** ulnare 1½ finger palmart og ulnare 2½ finger dorsalt.","img":"r_ax9_45-3"},{"id":"ax9-t38","t":"ax9.ul","k":"text","q":"N. ulnaris: forløb?","a":"Sulcus bicipitalis medialis, medialt for a. brachialis; perforerer septum intermusculare brachii mediale til overarmens bagerste muskelgruppe; passerer til underarmen via **sulcus nervi ulnaris** bag epicondylus medialis (albuestød); under senebuen af m. flexor carpi ulnaris; mellem m. flexor carpi ulnaris og m. flexor digitorum profundus; superficielt for fleksorretinaklet (**Guyons kanal**) med a. ulnaris.","img":"r_ax9_45-3"},{"id":"ax9-t39","t":"ax9.ul","k":"text","q":"N. ulnaris: endegrene?","a":"**R. superficialis** (næsten rent sensorisk; innerverer m. palmaris brevis motorisk): n. digitalis palmaris communis IV + proprius V til de 1½ ulnare fingre.\n**R. profundus** (rent motorisk): perforerer hypothenar; innerverer hypothenars muskler, mm. interossei, mm. lumbricales III og IV og m. adductor pollicis.","img":"r_ax9_46-4"},{"id":"ax9-t40","t":"ax9.ul","k":"text","q":"N. ulnaris: hvilke kutane grene afgives?","a":"**R. dorsalis:** afgives midt på underarmen og trækker dorsalt mod håndryggen; nn. digitales dorsales til de 2½ ulnare fingre.\n**R. palmaris:** afgives distalt på underarmen, perforerer fascia antebrachii og innerverer den ulnare del af håndfladen.","img":"r_ax9_46-4"},{"id":"ax9-t41","t":"ax9.ra","k":"text","q":"N. radialis: innervation og segmenter?","a":"C5–T1, fra fasciculus posterior. **Motorisk:** over- og underarmens ekstensorer. **Kutant:** huden over ekstensorsiderne (dorsalt).","img":"r_ax9_48-3"},{"id":"ax9-t42","t":"ax9.ra","k":"text","q":"N. radialis: forløb i overarmen?","a":"Passerer det nedre trekantede interstice (med a. profunda brachii) fra fossa axillaris til ekstensorlogen, snor sig om humerus' bagside i sulcus nervi radii og perforerer septum intermusculare brachii laterale i distale 1/3 for at træde ventralt til sulcus bicipitalis lateralis. Ud for m. brachioradialis deler den sig i **r. superficialis** og **r. profundus**.","img":"r_ax9_48-3"},{"id":"ax9-t43","t":"ax9.ra","k":"text","q":"R. superficialis n. radialis: forløb og område?","a":"Fortsætter descenderende mod hånden, profundt for m. brachioradialis; passerer i distale 1/3 under og dorsalt for brachioradialis' sene, følger v. cephalica til håndryggen.\nForsyner sensorisk **radiale håndryg og proksimale del af 2½ radiale fingre** (nn. digitales dorsales).","img":"r_ax9_47-3"},{"id":"ax9-t44","t":"ax9.ra","k":"text","q":"R. profundus n. radialis: forløb og område?","a":"Rent motorisk til underarmens ekstensorer. Dorsalt i fossa cubitalis, perforerer m. supinator (Frohses kanal/arkade), fortsætter mellem det superficielle og profunde ekstensorlag og ender som n. interosseus posterior.","img":"r_ax9_47-3"},{"id":"ax9-t45","t":"ax9.ra","k":"text","q":"Hvilke kutane grene afgiver n. radialis midt på overarmens bagside?","a":"N. cutaneus brachii posterior, n. cutaneus brachii lateralis inferior og n. cutaneus antebrachii posterior.","img":"r_ax9_47-3"},{"id":"ax9-t46","t":"ax9.ki","k":"text","q":"Hvilke muskler repræsenterer segmentær funktion (C5–C8)?","a":"**C5:** abduktion i skulderleddet (m. deltoideus, n. axillaris). **C6:** fleksion i albue (m. biceps brachii, n. musculocutaneus). **C7:** ekstension i albue (m. triceps brachii, n. radialis). **C8:** fleksion i yderled på de 4 ulnare fingre (m. flexor digitorum profundus; n. medianus og n. ulnaris).\nRelevant ved mistanke om diskusprolaps.","img":"r_ax9_55-0"},{"id":"ax9-t47","t":"ax9.ki","k":"text","q":"Hvordan testes de fem blandede nerver motorisk?","a":"**N. axillaris:** m. deltoideus → abduktion i skulderleddet.\n**N. musculocutaneus:** overarmens fleksorer → fleksion i albue.\n**N. radialis:** underarmens ekstensorer → dorsalfleksion i håndled.\n**N. medianus:** m. opponens pollicis → opposition af tommelen.\n**N. ulnaris:** mm. interossei → spredning og samling af de ulnare fingre.","img":"r_ax9_55-0"},{"id":"ax9-t48","t":"ax9.ki","k":"text","q":"Hvordan testes n. medianus, n. ulnaris og n. radialis sensorisk (distalt for retinaklerne)?","a":"**N. medianus:** palmarsiden af den distale pegefinger. **N. ulnaris:** lillefingeren. **N. radialis:** den radiale del af håndryggen.","img":"r_ax9_51-1"},{"id":"ax9-t49","t":"ax9.ki","k":"text","q":"Hvad er Duchenne-Erbs parese og Klumpke-parese?","a":"**Duchenne-Erb:** plexus brachialis-neuropati, ofte truncus superior (C5–C6); lammelse af armen opstået under fødslen.\n**Klumpke:** ofte truncus inferior (C8–T1), n. ulnaris.","img":"r_ax9_60-4"},{"id":"ax9-t50","t":"ax9.ki","k":"text","q":"Hvilke håndstillinger ses ved læsion af n. radialis, n. ulnaris og n. medianus?","a":"**N. radialis:** drophånd. **N. ulnaris:** klohånd. **N. medianus:** 'hand of benediction' (sværgehånd).","img":"r_ax9_60-5"},{"id":"ax9-t51","t":"ax9.ki","k":"text","q":"Hvilken rækkefølge bruges ved plexus brachialis-spot?","a":"Find n. musculocutaneus, hvor den perforerer m. coracobrachialis → følg den tilbage til fasciculus lateralis → find radix lateralis n. mediani → n. medianus og følg radix medialis tilbage til fasciculus medialis → find n. ulnaris.\nHold om nn. musculocutaneus, medianus og ulnaris og led efter n. axillaris (i det firkantede interstice) → følg den tilbage og find n. radialis.\nBonus: n. cutaneus antebrachii medialis (ligner n. ulnaris), n. thoracicus longus, n. thoracodorsalis, nn. subscapulares, n. suprascapularis.","img":"r_ax9_19-3"},{"id":"ax9-t52","t":"ax9.ki","k":"text","q":"Hvordan kan man opsummere de blandede nerver og deres grene?","a":"**N. musculocutaneus:** overarmens fleksorer; n. cutaneus antebrachii lateralis.\n**N. medianus:** n. interosseus anterior, r. muscularis (thenar + lumbrical I–II), r. palmaris, nn. digitales palmares.\n**N. ulnaris:** r. dorsalis, r. palmaris, r. superficialis, r. profundus.\n**N. axillaris:** deltoideus + teres minor; n. cutaneus brachii lateralis superior.\n**N. radialis:** ekstensorer; kutane grene; r. superficialis og r. profundus (→ n. interosseus posterior).","img":"r_ax9_51-1"},{"id":"ax9-o53","t":"ax9.ki","k":"occ","img":"a9post","boxes":[[18.982,1.05,11.676,9.543],[52.598,1.187,17.286,3.425],[48.945,6.53,20.939,3.014],[50.033,11.826,19.852,3.379],[71.146,6.621,7.023,3.105],[11.807,18.402,12.894,3.379],[75.625,20.822,8.871,3.47],[70.102,26.667,14.394,2.968],[51.424,30.776,14.481,9.087],[76.886,31.553,7.61,5.89],[83.714,52.557,15.786,6.393],[86.736,80.822,6.654,3.105],[78.952,90.274,6.523,2.968],[21.635,82.511,19.374,3.105],[55.643,95.982,22.331,3.105],[86.019,27.58,7.023,3.151],[0.5,55.023,13.459,6.393],[75.647,70.959,9.828,6.393],[11.72,73.607,24.766,3.607],[72.516,80.639,12.959,3.516]],"target":0,"a":"N. axillaris (N. cutaneus brachii lateralis superior)","n":"Overarmens øvre laterale del."},{"id":"ax9-o54","t":"ax9.ki","k":"occ","img":"a9post","boxes":[[18.982,1.05,11.676,9.543],[52.598,1.187,17.286,3.425],[48.945,6.53,20.939,3.014],[50.033,11.826,19.852,3.379],[71.146,6.621,7.023,3.105],[11.807,18.402,12.894,3.379],[75.625,20.822,8.871,3.47],[70.102,26.667,14.394,2.968],[51.424,30.776,14.481,9.087],[76.886,31.553,7.61,5.89],[83.714,52.557,15.786,6.393],[86.736,80.822,6.654,3.105],[78.952,90.274,6.523,2.968],[21.635,82.511,19.374,3.105],[55.643,95.982,22.331,3.105],[86.019,
