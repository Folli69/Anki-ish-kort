skler omkring det","Ledbrusken er tykkere"],"c":1,"e":"Den dybere, større ledskål (acetabulum) giver hofteleddet markant mere stabilitet end skulderleddets flade cavitas glenoidalis."},{"id":"ax10-q11","t":"ax10.hm","q":"Hvilken nerve innerverer m. gluteus medius og minimus samt m. tensor fasciae latae?","o":["N. gluteus inferior","N. gluteus superior","N. obturatorius","N. ischiadicus"],"c":1,"e":"N. gluteus superior innerverer 2. og 3. lag (medius, minimus) samt m. tensor fasciae latae i 1. lag."},{"id":"ax10-q12","t":"ax10.hm","q":"Hvad sker der ved svigt af m. gluteus medius under gang?","o":["Hoften hyperekstenderer","'Hip drop' - bækkenet falder mod svingbenssiden","Knæet låser sig","Foden drop-fodes"],"c":1,"e":"Uden m. gluteus medius' kontrol bliver adduktionen fra bækkenkipningen overdrevet, og man ser et 'hip drop'."},{"id":"ax10-q13","t":"ax10.hm","q":"Hvilken muskel er den eneste af hofteleddets små udadrotatorer, der innerveres fra plexus lumbalis?","o":["M. piriformis","M. quadratus femoris","M. obturatorius externus","M. obturatorius internus"],"c":2,"e":"M. obturatorius externus innerveres af n. obturatorius fra plexus lumbalis; de øvrige får direkte grene fra plexus sacralis."},{"id":"ax10-q14","t":"ax10.hm","q":"Hvad opdeler m. piriformis foramen ischiadicum majus i?","o":["Lacuna musculorum og vasorum","Foramen suprapiriforme og infrapiriforme","Canalis obturatorius og adductorius","Trigonum femorale og canalis adductorius"],"c":1,"e":"M. piriformis løber gennem foramen ischiadicum majus og deler det i foramen suprapiriforme og infrapiriforme."},{"id":"ax10-q15","t":"ax10.lm","q":"Hvilken nerve innerverer lårets forreste loge?","o":["N. femoralis","N. obturatorius","N. ischiadicus","N. tibialis"],"c":0,"e":"Forreste loge (m. sartorius, m. quadriceps femoris): n. femoralis."},{"id":"ax10-q16","t":"ax10.lm","q":"Hvilken muskel indgår IKKE i pes anserinus?","o":["M. sartorius","M. gracilis","M. semitendinosus","M. semimembranosus"],"c":3,"e":"Pes anserinus dannes af sartorius, gracilis og semitendinosus. Semimembranosus insererer selvstændigt med tre ben."},{"id":"ax10-q17","t":"ax10.lm","q":"Hvad er patellas funktion som sesamknogle?","o":["Den beskytter kun leddet","Den forlænger m. quadriceps' kraftarm","Den stabiliserer menisken","Den er en del af tractus iliotibialis"],"c":1,"e":"Som sesamknogle forlænger patella momentarmen/kraftarmen for m. quadriceps femoris."},{"id":"ax10-q18","t":"ax10.lm","q":"Hvilken struktur passerer gennem hiatus adductorius?","o":["N. femoralis","Vasa femoralia til fossa poplitea","N. obturatorius","Tractus iliotibialis"],"c":1,"e":"Hiatus adductorius er den nederste, største åbning i m. adductor magnus' insertion og fører vasa femoralia til fossa poplitea."},{"id":"ax10-q19","t":"ax10.lm","q":"Hvilken nerve innerverer adduktorgruppen på låret?","o":["N. femoralis","N. obturatorius","N. ischiadicus","N. gluteus inferior"],"c":1,"e":"N. obturatorius innerverer adduktorgruppen (m. pectineus får desuden grene fra n. femoralis, og m. adductor magnus fra n. ischiadicus)."},{"id":"ax10-q20","t":"ax10.lm","q":"Hvilke muskler afgrænser trigonum femorale medialt og lateralt?","o":["Medialt m. adductor longus, lateralt m. sartorius","Medialt m. sartorius, lateralt m. gracilis","Medialt m. pectineus, lateralt m. iliopsoas","Medialt m. gracilis, lateralt m. adductor longus"],"c":0,"e":"Kranielt lig. inguinale, lateralt-kaudalt m. sartorius, medialt m. adductor longus."},{"id":"ax10-q21","t":"ax10.lm","q":"Hvilken nerve perforerer canalis adductorius?","o":["N. femoralis","N. saphenus","N. obturatorius","N. ischiadicus"],"c":1,"e":"N. saphenus (gren af n. femoralis) perforerer canalis adductorius sammen med vasa femoralia."},{"id":"ax11-q1","t":"ax11.tr","q":"Hvad afgrænser trigonum femorale medialt?","o":["M. sartorius","M. adductor longus","Lig. inguinale","M. iliopsoas"],"c":1,"e":"Medialt afgrænses trigonum femorale af m. adductor longus; lateralt-kaudalt af m. sartorius; kranielt af lig. inguinale."},{"id":"ax11-q2","t":"ax11.kn","q":"Hvad er patella anatomisk set?","o":["En sesamknogle","En del af tibias epifyse","Et ledbånd","En del af femurs condyl"],"c":0,"e":"Patella er en stor sesamknogle indlejret i m. quadriceps' insertionssene, som forøger dens kraftarm."},{"id":"ax11-q3","t":"ax11.kn","q":"Hvilken struktur på tibia hedder tuberculum anterolaterale?","o":["Tuberculum Gerdy","Eminentia intercondylaris","Malleolus medialis","Linea m. solei"],"c":0,"e":"Tuberculum anterolaterale (Gerdy) findes proksimalt på tibia."},{"id":"ax11-q4","t":"ax11.kf","q":"Hvorfor inddeles art. genus i tre dele (pars femoropatellaris, -tibialis med. og lat.)?","o":["Fordi der er tre separate knogler","Fordi leddet anlægges som tre selvstændige ledhuler, der vokser sammen","Fordi der er tre ligamenter","Fordi der er tre bevægeakser"],"c":1,"e":"De tre dele stammer fra tre selvstændige ledhuler tidligt i fosterlivet, som vokser sammen."},{"id":"ax11-q5","t":"ax11.kf","q":"Hvilken menisk er hyppigst udsat for læsioner, og hvorfor?","o":["Den laterale, fordi den er mest mobil","Den mediale, fordi den er mere fikseret og mindre mobil","Den laterale, fordi den er størst","Den mediale, fordi den er avaskulær"],"c":1,"e":"Den mediale menisk er mere fikseret bl.a. pga. kraftig binding til lig. collaterale tibiale og direkte forbindelse til ledkapslen hele vejen rundt."},{"id":"ax11-q6","t":"ax11.kf","q":"Hvad forøger m. quadriceps femoris' kraftarm ved insertion på tibia?","o":["Menisken","Patella som sesamknogle","Lig. cruciatum anterius","Plica synovialis"],"c":1,"e":"Patella fungerer som en sesamknogle, der forøger momentarmen for m. quadriceps femoris."},{"id":"ax11-q7","t":"ax11.kl_lig","q":"Hvilket korsbånd begrænser fremadglidning af tibia?","o":["Lig. cruciatum posterius (PCL)","Lig. cruciatum anterius (ACL)","Lig. collaterale tibiale","Lig. collaterale fibulare"],"c":1,"e":"ACL begrænser fremadglidning (og indadrotation) af tibia; PCL begrænser bagudglidning."},{"id":"ax11-q8","t":"ax11.kl_lig","q":"Hvad betyder huskereglen LAMP for korsbåndene?","o":["Anterior til lateral condyl, posterior til medial condyl","Anterior til medial condyl, posterior til lateral condyl","Alle ligamenter mangler posteriort","Ligamenterne krydser aldrig"],"c":0,"e":"LAMP: Anterior-Lateral, Posterior-Medial — ACL fæstner til indersiden af den laterale condyl, PCL til indersiden af den mediale."},{"id":"ax11-q9","t":"ax11.kl_lig","q":"Hvilken struktur dækker synovialmembranen IKKE?","o":["Ligg. cruciata","Menisci","Corpus adiposum infrapatellare","Fossa intercondylaris"],"c":1,"e":"Synovialmembranen afbrydes ved menisci; den beklæder derimod korsbåndene på siderne."},{"id":"ax11-q10","t":"ax11.kl_lig","q":"Hvilket ligament kan let palperes, fordi det er strengformet?","o":["Lig. collaterale tibiale","Lig. collaterale fibulare","Lig. popliteum obliquum","Lig. patellofemorale mediale"],"c":1,"e":"Lig. collaterale fibulare (laterale) er strengformet og let at palpere, i modsætning til det brede, flade tibiale kollateralligament."},{"id":"ax11-q11","t":"ax11.kkl","q":"Hvilken klassifikation har syndesmosis tibiofibularis?","o":["Ægte glideled","Symfyse","Uægte led, syndesmose","Synostose"],"c":2,"e":"Syndesmosis tibiofibularis er et uægte led (syndesmose), udgjort af membrana interossea og ligg. tibiofibularia."},{"id":"ax11-q12","t":"ax11.kkl","q":"Hvad sker der med fibula ved dorsifleksion af ankelleddet?","o":["Den skubbes distalt","Den skubbes væk fra tibia og trækkes proksimalt","Den roterer indad","Intet, den er fikseret"],"c":1,"e":"Grundet membrana interosseas distal-laterale fiberretning skubbes fibula væk fra tibia og trækkes proksimalt ved dorsifleksion."},{"id":"ax11-q13","t":"ax11.ue_","q":"Hvilken nerve innerverer hele ekstensorlogen?","o":["N. tibialis","N. peroneus superficialis","N. peroneus profundus","N. femoralis"],"c":2,"e":"Ekstensorlogens fire muskler innerveres af n. peroneus (fibularis) profundus."},{"id":"ax11-q14","t":"ax11.ue_","q":"Hvilken muskel løber i ekstensorretinaklets 1. kulisse?","o":["M. extensor hallucis longus","M. tibialis anterior","M. extensor digitorum longus","M. peroneus tertius"],"c":1,"e":"Huskeregel TIB-HAL-VAN-DIG: 1. kulisse er m. tibialis anterior."},{"id":"ax11-q15","t":"ax11.pe","q":"Hvilken nerve innerverer peroneerlogen?","o":["N. peroneus profundus","N. peroneus superficialis","N. tibialis","N. suralis"],"c":1,"e":"Peroneerlogen (m. peroneus longus et brevis) innerveres af n. peroneus superficialis."},{"id":"ax11-q16","t":"ax11.pe","q":"Hvor insererer m. peroneus longus?","o":["Tuberositas ossis metatarsalis I","Tuberositas ossis metatarsalis V","Basis phalanx distalis I","Tuber calcanei"],"c":0,"e":"M. peroneus longus insererer på tuberositas ossis metatarsalis I, efter at have krydset under foden."},{"id":"ax11-q17","t":"ax11.fl","q":"Hvilken muskel regnes med til fleksorlogens profunde gruppe, men flekterer også knæet ved at udadrotere femur?","o":["M. tibialis posterior","M. popliteus","M. flexor hallucis longus","M. soleus"],"c":1,"e":"M. popliteus indadroterer crus / udadroterer femur og kan låse knæet op."},{"id":"ax11-q18","t":"ax11.fl","q":"Hvad er chiasma cruris?","o":["Krydsningen mellem m. tibialis posterior og m. flexor digitorum longus bag på tibia","Krydsningen mellem de to hoveder af m. gastrocnemius","Krydsningen af peroneus-senerne","Krydsningen i planta pedis"],"c":0,"e":"M. tibialis posterior og m. flexor digitorum longus krydser bag på tibia i chiasma cruris; krydsningen i foden hedder chiasma plantare."},{"id":"ax11-q19","t":"ax11.fl","q":"Hvilken kulisse i fleksorretinaklet indeholder m. flexor hallucis longus?","o":["1. kulisse","2. kulisse","3. kulisse","4. kulisse"],"c":3,"e":"Huskeregel TIB-DIG-VAN-HAL: 4. kulisse er m. flexor hallucis longus."},{"id":"ax11-q20","t":"ax11.ga","q":"Hvor stor en del af gangcyklussen udgør standfasen omtrent?","o":["40 %","50 %","60 %","80 %"],"c":2,"e":"Standfasen udgør ca. 60 % af tiden, svingfasen ca. 40 %."},{"id":"ax11-q21","t":"ax11.ga","q":"Hvilken muskel giver den aktive plantarfleksion ved afsæt under gang?","o":["M. tibialis anterior","M. triceps surae","M. quadriceps femoris","M. iliopsoas"],"c":1,"e":"Afsættet er aktiv plantarfleksion via m. triceps surae."},{"id":"ax12-q1","t":"ax12.fk","q":"Hvor mange knogler har tarsus, og hvordan fordeler de sig?","o":["7, i en proksimal (2) og distal (5) række","8, i to rækker af 4","7, alle i én række","5, i en proksimal (3) og distal (2) række"],"c":0,"e":"7 knogler: proksimalt talus og calcaneus (2), distalt naviculare, tre cuneiforme og cuboideum (5)."},{"id":"ax12-q2","t":"ax12.fk","q":"Hvilken fodrodsknogle har ingen muskeltilhæftning?","o":["Calcaneus","Talus","Os cuboideum","Os naviculare"],"c":1,"e":"Talus har ingen muskeltilhæftning — kun ledflader og ligamenttilhæftninger."},{"id":"ax12-q3","t":"ax12.fk","q":"Hvad er sustentaculum tali?","o":["En ledflade på talus","En 'hylde' på calcaneus, der understøtter talus","Et ligament mellem naviculare og cuboideum","En kanal i os cuboideum"],"c":1,"e":"Sustentaculum tali er en fremspringende hylde medialt på calcaneus, som understøtter talus; m. flexor hallucis longus løber under den."},{"id":"ax12-q4","t":"ax12.fk","q":"Hvor mange phalanges har hallux (storetåen)?","o":["Tre","To","Fire","Én"],"c":1,"e":"Hallux har kun proximalis og distalis, i modsætning til de øvrige tæer der har tre phalanges."},{"id":"ax12-q5","t":"ax12.fm","q":"Hvilken nerve innerverer m. extensor digitorum brevis?","o":["N. peroneus profundus","N. plantaris lateralis","N. plantaris medialis","N. tibialis"],"c":0,"e":"N. peroneus profundus innerverer m. extensor digitorum brevis (og hallucis brevis)."},{"id":"ax12-q6","t":"ax12.pp","q":"Hvor udspringer aponeurosis plantaris fra?","o":["Tuber calcanei","Basis af metatarsalerne","Sustentaculum tali","Malleolus medialis"],"c":0,"e":"Aponeurosis plantaris udspringer fra tuber calcanei (proc. medialis et lateralis)."},{"id":"ax12-q7","t":"ax12.lag","q":"Hvilke muskler udgør fodsålens 1. lag?","o":["M. abductor hallucis, m. flexor digitorum brevis, m. abductor digiti minimi","M. quadratus plantae og mm. lumbricales","M. flexor hallucis brevis og m. adductor hallucis","Mm. interossei plantares et dorsales"],"c":0,"e":"1. lag, 'Abduktorerne': abductor hallucis, flexor digitorum brevis, abductor digiti minimi — alle fra tuber calcanei."},{"id":"ax12-q8","t":"ax12.lag","q":"Hvor udspringer m. quadratus plantae, og hvad er dens funktion?","o":["Fra tuber calcanei; støtter m. flexor digitorum longus","Fra ossa cuneiformia; fleksion af storetå","Fra metatarsal 5; abduktion af lilletå","Fra lig. plantare longum; adduktion"],"c":0,"e":"M. quadratus plantae udspringer fra processus lateralis og medialis tuberis calcanei og støtter m. flexor digitorum longus."},{"id":"ax12-q9","t":"ax12.lag","q":"Hvilken retning spreder mm. interossei dorsales i foden tæerne, sammenlignet med interossei plantares?","o":["Dorsales spreder, plantares samler — som på hånden","Dorsales samler, plantares spreder","Begge spreder","Begge samler"],"c":0,"e":"Som på hånden: de dorsale driver tæerne væk (abduktion), de plantare parkerer dem (adduktion) mod 2. tå."},{"id":"ax12-q10","t":"ax12.lag","q":"Fodens længdeakse for interossei-funktionen går gennem hvilken tå?","o":["1. tå","2. tå","3. tå","5. tå"],"c":1,"e":"I modsætning til hånden (3. finger) går fodens længdeakse gennem 2. tå."},{"id":"ax12-q11","t":"ax12.kn_","q":"Hvilken nerve på foden er homolog med håndens n. ulnaris?","o":["N. plantaris medialis","N. plantaris lateralis","N. peroneus profundus","N. suralis"],"c":1,"e":"N. plantaris lateralis er homolog med n. ulnaris og innerverer størstedelen af fodens egne muskler."},{"id":"ax12-q12","t":"ax12.kn_","q":"Hvilken arterie fortsætter som arcus plantaris?","o":["R. profundus fra a. plantaris lateralis (og medialis)","A. dorsalis pedis alene","A. tibialis anterior direkte","A. peronea"],"c":0,"e":"Arcus plantaris dannes af de dybe grene fra a. plantaris lateralis (og modtager bidrag fra medialis)."},{"id":"ax12-q13","t":"ax12.fl","q":"Hvilken klassifikation har art. talocruralis?","o":["Ægte, enkelt kugleled","Ægte, sammensat hængselled","Uægte led, syndesmose","Ægte glideled"],"c":1,"e":"Art. talocruralis er et ægte, sammensat hængselled mellem talus, tibia og fibula."},{"id":"ax12-q14","t":"ax12.fl","q":"Hvilket ligament forstuves hyppigst ved et 'vriklet' traume?","o":["Lig. deltoideum","Lig. talofibulare anterius","Lig. calcaneofibulare","Lig. bifurcatum"],"c":1,"e":"Lig. talofibulare anterius har kun ca. 20 kg trækstyrke og forstuves hyppigst ved plantarfleksion-inversions-traumer."},{"id":"ax12-q15","t":"ax12.fl","q":"Hvilke to ledhuler udgør art. subtalaris?","o":["Art. talocalcanea og art. talocalcaneonavicularis","Art. talocruralis og art. tarsi transversa","Art. tarsometatarsalis og art. talocalcanea","Chopart's og Lisfrancs led"],"c":0,"e":"Art. subtalaris består af art. talocalcanea (bagest) og art. talocalcaneonavicularis (forrest), adskilt af sinus tarsi."},{"id":"ax12-q16","t":"ax12.fl","q":"Hvad kaldes art. tarsi transversa i daglig tale, og hvad svarer den til på hånden?","o":["Lisfrancs led; svarer til CMC-leddene","Chopart's led; svarer til art. mediocarpalis","Chopart's led; svarer til art. radiocarpalis","Lisfrancs led; svarer til art. mediocarpalis"],"c":1,"e":"Art. tarsi transversa kaldes Chopart's led og svarer funktionelt til art. mediocarpalis."},{"id":"ax12-q17","t":"ax12.fl","q":"Hvad kaldes leddet mellem fodrodsknoglerne og metatarsalerne i daglig tale?","o":["Chopart's led","Lisfrancs led","Syndesmosis tibiofibularis","Art. subtalaris"],"c":1,"e":"Artt. tarsometatarsales kaldes Lisfrancs led/linje og er en hyppig amputationslinje."},{"id":"ax12-q18","t":"ax12.fb","q":"Hvilke knogler indgår i den indre (mediale) længdebue?","o":["Calcaneus, talus, naviculare, cuneiformia, metatarsale I-III","Calcaneus, cuboideum, metatarsale IV-V","Cuneiformia og basis af metatarsale II-III","Kun calcaneus og talus"],"c":0,"e":"Den mediale længdebue omfatter calcaneus, talus, os naviculare, ossa cuneiformia og metatarsale I-III."},{"id":"ax12-q19","t":"ax12.fb","q":"Hvad stabiliserer den ydre (laterale) længdebue?","o":["Aponeurosis plantaris og m. tibialis posterior","Lig. plantare longum et breve samt m. peroneus longus","M. adductor hallucis alene","Lig. deltoideum"],"c":1,"e":"Den laterale bue er statisk og stabiliseres af lig. plantare longum et breve samt m. peroneus longus."},{"id":"ax12-q20","t":"ax12.fb","q":"Hvorfor kan fodens knogler (ca. 100 g) bære 4-5 gange kropsvægten?","o":["Fordi de er meget tætte","Fordi de er arrangeret i en trekantskonstruktion der fordeler vægten","Fordi calcaneus alene bærer det hele","Fordi der ikke er nogen led i foden"],"c":1,"e":"Trekantskonstruktionen af fodens buer fordeler kropsvægten ud over hele foden."},{"id":"ax13-q1","t":"ax13.pl","q":"Hvilke segmenter danner plexus lumbalis og plexus sacralis?","o":["Lumbalis T12-L4, sacralis L4-S4","Lumbalis L1-L5, sacralis S1-S5","Lumbalis T12-L2, sacralis L3-S4","Lumbalis L2-S1, sacralis S1-S5"],"c":0,"e":"Plexus lumbalis: T12-L4. Plexus sacralis: L4-S4. De kædes sammen af truncus lumbosacralis (L4-L5)."},{"id":"ax13-q2","t":"ax13.pl","q":"Hvilke to muskler innerveres direkte fra plexus lumbalis (ikke via en navngiven perifer nerve)?","o":["M. quadratus lumborum og m. psoas major","M. iliacus og m. sartorius","M. piriformis og m. obturatorius internus","M. gluteus medius og minimus"],"c":0,"e":"Plekset indlejres mellem m. psoas majors udspring og innerverer direkte m. quadratus lumborum og m. psoas major."},{"id":"ax13-q3","t":"ax13.lu","q":"Hvilken nerve er den eneste, der løber på forfladen af m. psoas major?","o":["N. femoralis","N. genitofemoralis","N. obturatorius","N. cutaneus femoris lateralis"],"c":1,"e":"N. genitofemoralis perforerer og descenderer på forfladen af m. psoas major - god spotteknik."},{"id":"ax13-q4","t":"ax13.lu","q":"Hvilken nerve er den eneste placeret medialt for m. psoas major?","o":["N. femoralis","N. genitofemoralis","N. obturatorius","N. iliohypogastricus"],"c":2,"e":"N. obturatorius er den eneste gren placeret medialt for m. psoas major."},{"id":"ax13-q5","t":"ax13.lu","q":"Hvilket segment har n. femoralis?","o":["L1-L2","L2-L4","L2-L3","L4-S1"],"c":1,"e":"N. femoralis har segment L2-L4."},{"id":"ax13-q6","t":"ax13.lu","q":"Hvad innerverer n. obturatorius' r. anterior motorisk?","o":["Mm. adductores longus et brevis, gracilis, pectineus","M. quadriceps femoris","M. obturatorius externus","Hasemusklerne"],"c":0,"e":"R. anterior innerverer de overfladiske adduktorer; r. posterior innerverer m. obturatorius externus og del af m. adductor magnus."},{"id":"ax13-q7","t":"ax13.tf","q":"Hvor perforerer n. saphenus canalis adductorius (SPOT)?","o":["Gennem membrana vastoadductoria","Gennem hiatus adductorius","Gennem lacuna vasorum","Gennem foramen ischiadicum"],"c":0,"e":"N. saphenus forlader canalis adductorius ved at perforere membrana vastoadductoria."},{"id":"ax13-q8","t":"ax13.sa","q":"Hvad passerer gennem foramen suprapiriforme?","o":["N. ischiadicus","N. gluteus superior og a. glutea superior","N. pudendus","N. cutaneus femoris posterior"],"c":1,"e":"Foramen suprapiriforme: n. gluteus superior + a. glutea superior. Resten passerer infrapiriforme."},{"id":"ax13-q9","t":"ax13.sa","q":"Hvilken nerve innerverer m. gluteus maximus?","o":["N. gluteus superior","N. gluteus inferior","N. ischiadicus direkte","N. pudendus"],"c":1,"e":"N. gluteus inferior (L5-S2) innerverer udelukkende m. gluteus maximus."},{"id":"ax13-q10","t":"ax13.sa","q":"Hvad står huskereglen 'S2, S3, S4' for?","o":["N. ischiadicus' segmenter","N. pudendus' segmenter (keeps the shit off the floor)","Plexus sacralis' øvre grænse","N. gluteus inferiors segmenter"],"c":1,"e":"N. pudendus (S2-S4) innerverer bækkengulv og sphinctere - 'keeps the shit off the floor'."},{"id":"ax13-q11","t":"ax13.is","q":"Hvor deler n. ischiadicus sig i n. tibialis og n. peroneus communis?","o":["Ved foramen infrapiriforme","Ved øverste spids af fossa poplitea","Ved collum fibulae","Ved malleolus medialis"],"c":1,"e":"Delingen sker typisk ved den proksimale spids af fossa poplitea (kan dog variere - høj vs. lav deling)."},{"id":"ax13-q12","t":"ax13.is","q":"Hvilken nerve er homolog med n. radialis?","o":["N. tibialis","N. peroneus communis","N. plantaris medialis","N. saphenus"],"c":1,"e":"N. peroneus communis (posterior ekstensorkomponent) er homolog med n. radialis; n. tibialis er homolog med n. medianus/ulnaris."},{"id":"ax13-q13","t":"ax13.is","q":"Hvor snor n. peroneus communis sig om, på vej ind i peroneerlogen?","o":["Collum fibulae","Malleolus lateralis","Caput tali","Tuber calcanei"],"c":0,"e":"N. peroneus communis snor sig om collum fibulae, hvilket gør den udsat for tryklæsion her."},{"id":"ax13-q14","t":"ax13.is","q":"Hvilken nerve innerverer m. extensor digitorum brevis motorisk?","o":["N. peroneus superficialis","N. peroneus profundus","N. plantaris lateralis","N. suralis"],"c":1,"e":"N. peroneus profundus passerer 3. kulisse og innerverer bl.a. m. extensor digitorum brevis."},{"id":"ax13-q15","t":"ax13.kl","q":"Hvad tester Lasègues test, og hvad angiver et positivt resultat?","o":["Styrke i m. quadriceps; svaghed","Strakt benløft; smerte distalt for knæet før 60° løft tyder på L5/S1-affektion","Ankelrefleks; nedsat refleks","Hoftefleksion; nedsat bevægelse"],"c":1,"e":"Lasègues test er positiv, når smerter stråler distalt for knæet, før benet er løftet over 60°, og peger på L5/S1-affektion."},{"id":"ax13-q16","t":"ax13.kl","q":"Hvilken muskel testes for segment L5?","o":["M. quadriceps femoris","M. tibialis anterior","M. extensor hallucis longus","Mm. peronei"],"c":2,"e":"L5 testes med m. extensor hallucis longus. L4: tibialis anterior. S1: peronei."},{"id":"ax13-q17","t":"ax13.ka","q":"Hvilken arterie fortsætter a. poplitea som efter hiatus adductorius?","o":["A. femoralis","A. poplitea er selv fortsættelsen af a. femoralis efter hiatus adductorius","A. iliaca externa","A. profunda femoris"],"c":1,"e":"A. femoralis fortsætter som a. poplitea efter hiatus adductorius."},{"id":"ax13-q18","t":"ax13.ka","q":"Hvilke tre grene deler a. poplitea sig i?","o":["A. tibialis anterior, a. tibialis posterior, a. peronea","A. dorsalis pedis, a. plantaris medialis, a. plantaris lateralis","A. femoralis, a. profunda femoris, a. circumflexa","A. tibialis anterior, a. dorsalis pedis, a. arcuata"],"c":0,"e":"A. poplitea deler sig i tre grene, én til hver muskelloge i underbenet."},{"id":"ax13-q19","t":"ax13.ka","q":"Hvad bliver a. tibialis anterior til distalt, efter den passerer ekstensorretinaklet?","o":["A. dorsalis pedis","A. plantaris lateralis","A. peronea","A. arcuata alene"],"c":0,"e":"A. tibialis anterior fortsætter som a. dorsalis pedis efter 3. kulisse i ekstensorretinaklet."},{"id":"ax13-q20","t":"ax13.ve","q":"Hvor tømmer v. saphena magna sig?","o":["I v. poplitea","I v. femoralis via hiatus saphenus","I v. tibialis posterior","I v. saphena parva"],"c":1,"e":"V. saphena magna tømmer sig i v. femoralis via hiatus saphenus i fascia lata."},{"id":"ax13-q21","t":"ax13.ve","q":"Hvor munder v. saphena parva ud?","o":["I v. femoralis","I v. poplitea","I v. saphena magna ved knæet","I v. tibialis anterior"],"c":1,"e":"V. saphena parva perforerer fascia cruris i fossa poplitea og munder i v. poplitea."},{"id":"ax14-q1","t":"ax14.cv","q":"Hvor mange vertebrae er der i de præsacrale segmenter?","o":["19","23","24","29"],"c":1,"e":"7 cervicale + 12 thoracale + 5 lumbale = 24... men de præsacrale tælles til 23, da man ofte medregner overgangen; her følger vi underviserens angivelse på 23 stk."},{"id":"ax14-q2","t":"ax14.cv","q":"Hvad skyldes lændelordosen anatomisk?","o":["Kileformede vertebrae","Kileformede disci","Facetleddenes orientering","Lig. flavums elasticitet"],"c":1,"e":"Lændelordosen skyldes kileformede disci intervertebrales; brystkyfosen skyldes kileformede vertebrae."},{"id":"ax14-q3","t":"ax14.cv","q":"Hvilken del af en vertebra kaldes 'den lille fod'?","o":["Lamina","Pediculus","Processus transversus","Ambitus eminens"],"c":1,"e":"Pediculus ('lille fod') er afgangen af arcus vertebrae fra corpus' bagflade."},{"id":"ax14-q4","t":"ax14.cv","q":"Hvordan er corpus formet på en thorakal vertebra?","o":["Rektangulær med uncus corporis","Hjerteform med fovea costalis","Nyreform","Rund og flad"],"c":1,"e":"Thorakale corpora er hjerteformede med fovea costalis superior/inferior til ribbensleddene."},{"id":"ax14-q5","t":"ax14.ao","q":"Hvilken struktur mangler atlas (C1), som de øvrige vertebrae har?","o":["Processus spinosus","Corpus","Foramen transversarium","Massa lateralis"],"c":1,"e":"Atlas mangler et corpus; i stedet rager axis' dens op og danner led med atlas."},{"id":"ax14-q6","t":"ax14.ao","q":"Hvad hedder axis' opadstigende taplignende struktur?","o":["Massa lateralis","Dens axis","Tuberculum posterius","Arcus anterior"],"c":1,"e":"Dens axis ('tanden') skyder sig op fra corpus og danner led med atlas' arcus anterior og lig. transversum atlantis."},{"id":"ax14-q7","t":"ax14.ao","q":"Hvilke tre dele inddeles os occipitale i?","o":["Pars basilaris, pars lateralis, squama occipitalis","Pars petrosa, pars squamosa, pars mastoidea","Pars anterior, media, posterior","Corpus, arcus, processus"],"c":0,"e":"Os occipitale inddeles i pars basilaris, pars lateralis og squama occipitalis."},{"id":"ax14-q8","t":"ax14.cl","q":"Hvilken klassifikation har discus intervertebralis?","o":["Ægte glideled","Symfyse (sekundær synkondrose)","Syndesmose","Ægte drejeled"],"c":1,"e":"Discus intervertebralis er et uægte led, en symfyse (sekundær synkondrose)."},{"id":"ax14-q9","t":"ax14.cl","q":"Hvilket ligament danner et omvendt A på bagsiden af corpora inde i canalis vertebralis?","o":["Lig. longitudinale anterius","Lig. longitudinale posterius","Lig. flavum","Lig. nuchae"],"c":1,"e":"Lig. longitudinale posterius er omvendt A-formet på bagsiden af corpus, inde i kanalen."},{"id":"ax14-q10","t":"ax14.cl","q":"Hvilket afsnit af columna har facetled, der 'låser' ved ekstension?","o":["Cervikalt","Thorakalt","Lumbalt","Ingen af delene"],"c":2,"e":"Lumbalt presses proc. articularis inferior fast i den underliggende superiore facet ved ekstension (rotationslåsning)."},{"id":"ax14-q11","t":"ax14.cl","q":"Hvad forhindrer lig. transversum atlantis?","o":["Fremadglidning af dens axis","Bagudglidning af dens axis","Rotation i atlantoaxialleddet","Lateralfleksion af hovedet"],"c":1,"e":"Lig. transversum atlantis ligger bag dens axis og forhindrer, at tappen glider bagud."},{"id":"ax14-q12","t":"ax14.cl","q":"Hvilken struktur giver klinisk risiko for at trykke på plexus brachialis ved slidgigt?","o":["Uncus corporis (unco-vertebralleddet)","Lig. flavum","Facetleddet","Lig. nuchae"],"c":0,"e":"Uncus danner den forreste begrænsning af foramen intervertebrale; slidgigt her kan indsnævre rummet og trykke på plexus brachialis."},{"id":"ax14-q13","t":"ax14.sn","q":"Hvor mange spinalnervesegmenter er der i alt?","o":["28","31","33","24"],"c":1,"e":"31 segmenter: 8 cervicale, 12 thoracale, 5 lumbale, 5 sacrale, 1 coccygealt."},{"id":"ax14-q14","t":"ax14.sn","q":"Hvad gælder for den kutane innervation fra ramus dorsalis over og under T7?","o":["Over T7 kutan medial gren, under T7 kutan lateral gren","Over T7 kutan lateral gren, under T7 kutan medial gren","Altid den mediale gren","Altid den laterale gren"],"c":0,"e":"Over T7 er den mediale gren kutan, under T7 er den laterale gren kutan."},{"id":"ax14-q15","t":"ax14.sn","q":"Hvilken struktur modtager ALLE spinalnerver fra truncus sympathicus?","o":["Ramus communicans albus","Ramus communicans griseus","Ramus meningeus","Ramus dorsalis"],"c":1,"e":"Alle spinalnerver modtager en ramus communicans griseus; kun T1-L2 afgiver ramus communicans albus."},{"id":"ax14-q16","t":"ax14.ca","q":"Hvor ender medulla spinalis normalt?","o":["L1-L2 niveau","L4-L5 niveau","S1 niveau","T12 niveau"],"c":0,"e":"Medulla ender i L1-L2-niveau som conus medullaris, hvorfra cauda equina fortsætter."},{"id":"ax14-q17","t":"ax14.ca","q":"Hvorfor lægges en lumbalpunktur typisk over eller under L4?","o":["Fordi rygmarven ikke når hertil, kun cauda equina","Fordi discus er tyndest her","For at undgå plexus lumbalis","Fordi der er mest cerebrospinalvæske her"],"c":0,"e":"Under/over L4 er man sikker på kun at møde cauda equina, ikke selve medulla spinalis."},{"id":"ax14-q18","t":"ax14.ca","q":"Hvor hurtigt skal et cauda equina syndrom opereres?","o":["Inden for 24 timer","Inden for en uge","Inden for en måned","Der er ingen tidsgrænse"],"c":0,"e":"Cauda equina syndrom skal opereres akut, inden 24 timer, for at undgå irreversibel skade."},{"id":"ax14-q19","t":"ax14.rm","q":"Hvilken muskelgruppe hører ikke til de dybe rygmuskler?","o":["M. erector spinae","Mm. transversospinales","M. trapezius","Mm. suboccipitales"],"c":2,"e":"M. trapezius hører til de overfladiske rygmuskler (funktionelt knyttet til overekstremiteten)."},{"id":"ax14-q20","t":"ax14.rm","q":"Hvilken del af m. erector spinae ligger mest lateralt?","o":["M. spinalis","M. longissimus","M. iliocostalis","M. semispinalis"],"c":2,"e":"Fra medialt til lateralt: m. spinalis, m. longissimus, m. iliocostalis."},{"id":"ax14-q21","t":"ax14.rm","q":"Hvor mange hvirvler overspringer mm. multifidi?","o":["0-1","2-3","4 eller flere","Alle"],"c":1,"e":"Mm. rotatores overspringer 0-1, mm. multifidi 2-3, m. semispinalis 4 eller flere."},{"id":"ax14-q22","t":"ax14.rm","q":"Hvilken muskel ligger lateralt for m. semispinalis capitis?","o":["M. splenius","M. trapezius","M. rectus capitis posterior major","M. levator scapulae"],"c":0,"e":"M. splenius (capitis) ligger lateralt for m. semispinalis capitis - god spotteknik."},{"id":"ax14-q23","t":"ax14.th","q":"Hvilke costae hæfter direkte til sternum?","o":["1-7","1-10","8-12","Alle 12"],"c":0,"e":"Costa 1-7 hæfter direkte til sternum, 8-10 til det ovenliggende ribben, 11-12 ender frit."},{"id":"ax14-q24","t":"ax14.th","q":"Hvilket lag af ribbensmusklerne løber skråt nedad-fremad ('yderlommerne')?","o":["Mm. intercostales externi","Mm. intercostales interni","Mm. intercostales intimi","M. transversus thoracis"],"c":0,"e":"Mm. intercostales externi løber skråt nedad-fremad, som yderlommerne i en frakke."},{"id":"ax14-q25","t":"ax14.th","q":"Hvilken nerve innerverer huden omkring umbilicus?","o":["T7","T10","T12","L1"],"c":1,"e":"T10 innerverer området omkring navlen."},{"id":"ax14-q26","t":"ax14.th","q":"Hvad bliver a. thoracica interna til efter den passerer intercostalrum 6?","o":["A. epigastrica superior","A. epigastrica inferior","A. musculophrenica","A. pericardiacophrenica"],"c":0,"e":"A. thoracica interna fortsætter som a. epigastrica superior."},{"id":"ax14-q27","t":"ax14.ma","q":"Hvilken lymfeknudegruppe modtager størstedelen (75%) af mammas lymfe?","o":["Lnn. parasternales","Lnn. axillares, pektoral gruppe","Lnn. axillares, apikal gruppe","Peritoneale lymfekar"],"c":1,"e":"Den laterale del af mamma drænerer primært (75%) til lnn. axillares, pektoral gruppe."},{"id":"ax14-q28","t":"ax14.ma","q":"Hvorfor ses metastaser fra brystkræft hyppigt i columna?","o":["Direkte lymfespredning til hvirvlerne","Vv. intercostales posteriores drænerer til det klapløse v. azygos-system, forbundet med columna","Arteriel spredning via a. thoracica interna","Nervespredning langs n. intercostalis"],"c":1,"e":"Det klapløse v. azygos-system forbinder mammas vendrænage med columnas venesystem."},{"id":"ax14-q29","t":"ax14.ma","q":"Hvad er formålet med sentinel node-teknikken?","o":["At finde den første lymfeknude, der modtager lymfe fra en region, for at vurdere spredning","At måle blodgennemstrømning i mamma","At lokalisere selve tumoren","At teste nerveinnervation"],"c":0,"e":"Sentinel node er den første lymfeknude fra regionen; findes den metastase, skal hele axillen tømmes."},{"id":"ax15-q1","t":"ax15.di","q":"Hvilke tre partes har diaphragma?","o":["Sternalis, costalis, lumbalis","Anterior, posterior, lateralis","Superior, media, inferior","Ventralis, dorsalis, medialis"],"c":0,"e":"Pars sternalis, pars costalis og pars lumbalis er diaphragmas tre udspringshoveder."},{"id":"ax15-q2","t":"ax15.di","q":"Hvad danner lig. arcuatum medianum sammen med corpus vertebrae?","o":["Hiatus oesophagus","Hiatus aorticus","Foramen venae cavae","Larreys spalte"],"c":1,"e":"Lig. arcuatum medianum forbinder de to crura og danner sammen med corpus vertebrae hiatus aorticus."},{"id":"ax15-q3","t":"ax15.di","q":"I hvilket niveau ligger hiatus oesophagus?","o":["T8","T10","T12","L1"],"c":1,"e":"Hiatus oesophagus ligger på niveau T10, til venstre for midtlinjen."},{"id":"ax15-q4","t":"ax15.di","q":"Hvilken nerve innerverer diaphragma motorisk?","o":["N. vagus","N. phrenicus","N. intercostalis","N. splanchnicus"],"c":1,"e":"N. phrenicus (C3-C5) innerverer diaphragma motorisk og PPP (perikardiet, pleura, peritoneum) sensorisk."},{"id":"ax15-q5","t":"ax15.di","q":"Hvor løber n. phrenicus i forhold til m. scalenus anterior?","o":["Bagved","På forsiden","Gennem musklen","Lateralt for"],"c":1,"e":"N. phrenicus løber på forsiden af m. scalenus anterior - en klassisk spotteknik."},{"id":"ax15-q6","t":"ax15.ve","q":"Hvor stor en andel af hvilerespirationens inspiration står diaphragma for?","o":["1/3","1/2","2/3","Hele"],"c":2,"e":"Diaphragma står for ca. 2/3 af inspirationen ved hvilerespiration."},{"id":"ax15-q7","t":"ax15.ve","q":"Hvad er hovedfunktionen af mm. intercostales under vejrtrækning?","o":["Løfte ribbenene aktivt","Afstive thoraxvæggen","Trække sternum bagud","Kontrahere diaphragma"],"c":1,"e":"Selvom de bidrager til hhv. inspiration og ekspiration, er deres primære funktion at afstive thoraxvæggen."},{"id":"ax15-q8","t":"ax15.bv","q":"Hvilke 6 muskler udgør bugvæggens muskulatur?","o":["Rectus abd., pyramidalis, obliquus ext., obliquus int., transversus abd., quadratus lumborum","Rectus abd., psoas major, iliacus, sartorius, pectineus, gracilis","Obliquus ext., obliquus int., transversus abd., diaphragma, erector spinae, multifidus","Rectus abd., pyramidalis, iliopsoas, quadratus lumborum, serratus ant., latissimus dorsi"],"c":0,"e":"De 6 muskler er rectus abdominis, pyramidalis, obliquus externus, obliquus internus, transversus abdominis og quadratus lumborum."},{"id":"ax15-q9","t":"ax15.bv","q":"Hvor mange lag har bugvæggen?","o":["6","7","8","9"],"c":2,"e":"8 lag: hud, subcutis, obliquus ext., obliquus int., transversus abd., fascia transversalis, ekstraperitonealt bindevæv, peritoneum."},{"id":"ax15-q10","t":"ax15.bv","q":"Hvad kaldes m. obliquus internus abdominis populært, og hvorfor?","o":["'Yderlommerne i en jakke', pga. retningen udad","'Inderlommerne i en jakke', pga. retningen modsat obliquus externus","'Vesten', pga. cirkulær retning","'Bæltet', pga. horisontal retning"],"c":1,"e":"M. obliquus internus kaldes inderlommerne, modsat m. obliquus externus (yderlommerne)."},{"id":"ax15-q11","t":"ax15.bv","q":"Hvordan er rectusskeden opbygget UNDER linea arcuata?","o":["Alle tre aponeuroser går til det forreste blad","Alle tre aponeuroser går til det bagerste blad","Kun obliquus internus deler sig stadig","Rectusskeden findes ikke her"],"c":0,"e":"Under linea arcuata går alting til det forreste blad; det dorsale blad ophører her."},{"id":"ax15-q12","t":"ax15.bv","q":"Hvilken arterie anastomoserer med a. epigastrica superior?","o":["A. epigastrica inferior","A. iliaca externa","A. femoralis","A. thoracica lateralis"],"c":0,"e":"Aa. epigastricae superior og inferior anastomoserer og sikrer kollateral forsyning af bugvæggen."},{"id":"ax15-q13","t":"ax15.bv","q":"Hvilken muskel danner lig. arcuatum laterale som udspring for diaphragma?","o":["M. rectus abdominis","M. quadratus lumborum","M. psoas major","M. transversus abdominis"],"c":1,"e":"Fascien over m. quadratus lumborum danner lig. arcuatum laterale, udspring for diaphragmas pars lumbalis."},{"id":"ax15-q14","t":"ax15.ci","q":"Hvorfor vandrer testes ned gennem canalis inguinalis?","o":["For at undgå tryk fra bughulen","Fordi spermatogenesen kræver lavere temperatur","For at forkorte ductus deferens","Tilfældig embryologisk placering"],"c":1,"e":"Sædcelleproduktionen kræver en lidt lavere temperatur end i bughulen."},{"id":"ax15-q15","t":"ax15.ci","q":"Hvad passerer gennem canalis inguinalis hos kvinder?","o":["Ovarierne","Lig. teres uteri","Uterus selv","Ductus deferens"],"c":1,"e":"Hos kvinder passerer det runde livmoderbånd (lig. teres uteri) gennem den smallere kanal; ovarierne bliver i bughulen."},{"id":"ax15-q16","t":"ax15.ci","q":"Hvilket lag af funiculus spermaticus kommer fra fascia transversalis?","o":["Fascia spermatica externa","Fascia cremasterica","Fascia spermatica interna","Peritoneum"],"c":2,"e":"Fascia transversalis fortsætter som fascia spermatica interna (det inderste lag)."},{"id":"ax15-q17","t":"ax15.ci","q":"Hvor ligger anulus inguinalis profundus?","o":["Mellem symphysis pubica og SIAS","Ved tuberculum pubicum alene","Lateralt for spina iliaca posterior","I midtlinjen ved navlen"],"c":0,"e":"Anulus inguinalis profundus ligger omtrent midt mellem symphysis pubica og SIAS."},{"id":"ax15-q18","t":"ax15.ci","q":"Hvilken struktur danner bagvæggens kraftige, mediale zone i canalis inguinalis?","o":["Fascia transversalis","Falx inguinalis","Lig. lacunare","M. cremaster"],"c":1,"e":"Falx inguinalis (medialt) er kraftig; fascia transversalis (lateralt) er den svage zone."},{"id":"ax15-q19","t":"ax15.ci","q":"Hvor mærkes pulsen ved en indirekte lyskebrok?","o":["Medialt for brokporten (a. epigastrica inf.)","Lateralt for brokporten","Der er ingen palpabel puls","Kranielt for brokporten"],"c":0,"e":"Ved indirekte hernie mærkes pulsen fra a. epigastrica inferior medialt for brokporten; ved direkte hernie lateralt."},{"id":"ax15-q20","t":"ax15.ci","q":"Hvad er kryptorkisme?","o":["Betændelse i testis","Manglende/delvis nedvandring af testis","Torsion af testis","Hydrocele"],"c":1,"e":"Kryptorkisme (mal-descensus testis) er manglende eller delvis nedvandring af testis."},{"id":"ax15-q21","t":"ax15.bb","q":"Hvilke to dele består bækkenbunden af?","o":["Diaphragma pelvis og diaphragma urogenitale","M. levator ani og m. piriformis","Diaphragma pelvis og m. obturatorius internus","Fascia pelvis og fascia perinei"],"c":0,"e":"Bækkenbunden = diaphragma pelvis (profund) + diaphragma urogenitale (superficiel, 5. sem.)."},{"id":"ax15-q22","t":"ax15.bb","q":"Hvilken nerve innerverer diaphragma pelvis?","o":["N. obturatorius","N. pudendus","N. ischiadicus","N. femoralis"],"c":1,"e":"N. pudendus fra plexus sacralis innerverer diaphragma pelvis."},{"id":"ax15-q23","t":"ax15.bb","q":"Hvad hedder den del af m. pubococcygeus, der fungerer som en 'billig sphincter' om rectum?","o":["M. puborectalis","M. iliococcygeus","M. coccygeus","M. sphincter ani externus"],"c":0,"e":"M. puborectalis er den slyngeformede del af m. pubococcygeus bag om rectum."},{"id":"ax15-q24","t":"ax15.bb","q":"Hvad er levatorspalten passage for?","o":["Kun urethra","Urethra (og hos kvinden vagina)","Kun rectum","N. pudendus"],"c":1,"e":"Levatorspalten er en fortil midtlinjespalte for urethra, og hos kvinden også vagina."},{"id":"ax16-q1","t":"ax16.nk","q":"Hvilke knogler er parrede i hjernekassen?","o":["Os frontale og os occipitale","Os parietale og os temporale","Os sphenoidale og os ethmoidale","Alle er uparrede"],"c":1,"e":"Os parietale og os temporale er de eneste parrede knogler i hjernekassen; de fire øvrige er uparrede."},{"id":"ax16-q2","t":"ax16.nk","q":"Hvilken knogle indeholder crista galli og lamina cribrosa?","o":["Os frontale","Os sphenoidale","Os ethmoidale","Os temporale"],"c":2,"e":"Os ethmoidale består af crista galli, lamina perpendicularis, labyrinthus ethmoidalis og lamina cribrosa."},{"id":"ax16-q3","t":"ax16.nk","q":"Hvilke tre dele inddeles os sphenoidale i?","o":["Corpus, alae majores, alae minores","Pars squamosa, petrosa, tympanica","Pars basilaris, lateralis, squama","Pars orbitalis, nasalis, squamosa"],"c":0,"e":"Os sphenoidale inddeles i corpus, alae majores og alae minores."},{"id":"ax16-q4","t":"ax16.nk","q":"Hvilken fontanel er den største og lukker sidst?","o":["Fonticulus posterior","Fonticulus anterior","Fonticulus sphenoidalis","Fonticulus mastoideus"],"c":1,"e":"Fonticulus anterior ('den firkantede') er størst og lukker først efter 2 år; de øvrige lukker inden for 1 år."},{"id":"ax16-q5","t":"ax16.bc","q":"I hvilken kraniefossa findes sella turcica?","o":["Fossa cranii anterior","Fossa cranii media","Fossa cranii posterior","Basis cranii externa"],"c":1,"e":"Sella turcica med fossa hypophysialis findes i fossa cranii media."},{"id":"ax16-q6","t":"ax16.bc","q":"Hvilken struktur forbinder dorsum sellae med foramen magnum?","o":["Clivus","Crista galli","Canalis opticus","Sulcus caroticus"],"c":0,"e":"Clivus strækker sig fra dorsum sellae til foramen magnum i fossa cranii posterior."},{"id":"ax16-q7","t":"ax16.bc","q":"Hvilket hul i basis cranii externa er dannet af os occipitale?","o":["Foramen ovale","Foramen spinosum","Canalis n. hypoglossi","Foramen stylomastoideum"],"c":2,"e":"Canalis n. hypoglossi hører til os occipitale; foramen ovale og spinosum hører til os sphenoidale."},{"id":"ax16-q8","t":"ax16.vk","q":"Hvor mange knogler danner klassisk ansigtsskelettet (viscerokranium)?","o":["8","10","12","6"],"c":1,"e":"10 knogler: os frontale (delvist), os nasale, maxilla, os lacrimale, os ethmoidale, os zygomaticum, concha nasalis inferior, vomer, os palatinum, mandibula."},{"id":"ax16-q9","t":"ax16.vk","q":"Hvad danner arcus zygomaticus?","o":["Proc. temporalis ossis zygomatici + proc. zygomaticus ossis temporalis","Proc. frontalis ossis zygomatici alene","Maxillas proc. zygomaticus alene","Os nasale + maxilla"],"c":0,"e":"Arcus zygomaticus dannes af proc. temporalis (os zygomaticum) og proc. zygomaticus (os temporale)."},{"id":"ax16-q10","t":"ax16.vk","q":"Hvilken struktur på mandibula fører til canalis mandibulae?","o":["Foramen mentale","Foramen mandibulae","Incisura mandibulae","Fovea pterygoidea"],"c":1,"e":"Foramen mandibulae på ramus mandibulae fører ind til canalis mandibulae."},{"id":"ax16-q11","t":"ax16.hm","q":"Hvad passerer IKKE gennem skalenerporten?","o":["Plexus brachialis","A. subclavia","N. phrenicus","V. subclavia"],"c":3,"e":"V. subclavia passerer foran skalenerporten, ikke igennem den."},{"id":"ax16-q12","t":"ax16.hm","q":"Hvad sker der ved unilateral kontraktion af m. sternocleidomastoideus?","o":["Ventralfleksion af hovedet","Lateralfleksion + rotation til modsatte side","Kun rotation til samme side","Ekstension af nakken"],"c":1,"e":"Unilateral kontraktion giver lateralfleksion til samme side og rotation til modsatte side."},{"id":"ax16-q13","t":"ax16.hm","q":"Hvilke fire muskler udgør prævertebralgruppen?","o":["Longus capitis, longus colli, rectus capitis anterior, rectus capitis lateralis","Scalenus anterior, medius, posterior + longus colli","Splenius capitis, cervicis + 2 suboccipitale","Digastricus, stylohyoideus, mylohyoideus, geniohyoideus"],"c":0,"e":"Prævertebralgruppen: m. longus capitis, m. longus colli, m. rectus capitis anterior et lateralis."},{"id":"ax16-q14","t":"ax16.hy","q":"Hvilken muskel perforeres af tendo m. digastrici?","o":["M. mylohyoideus","M. stylohyoideus","M. geniohyoideus","M. sternohyoideus"],"c":1,"e":"M. stylohyoideus perforeres af senen fra m. digastricus."},{"id":"ax16-q15","t":"ax16.hy","q":"Hvad danner bunden i selve mundhulen?","o":["M. geniohyoideus","M. mylohyoideus (diaphragma oris)","M. digastricus","M. hyoglossus"],"c":1,"e":"M. mylohyoideus danner diaphragma oris, bunden af mundhulen."},{"id":"ax16-q16","t":"ax16.hy","q":"Hvilke infrahyoide muskler ligger superficielt?","o":["M. sternohyoideus og m. omohyoideus","M. sternothyroideus og m. thyrohyoideus","M. digastricus og m. stylohyoideus","M. mylohyoideus og m. geniohyoideus"],"c":0,"e":"M. sternohyoideus og m. omohyoideus ligger superficielt; sternothyroideus og thyrohyoideus ligger profundt."},{"id":"ax16-q17","t":"ax16.hf","q":"Hvilket fascielag danner skede for a. subclavia og plexus brachialis?","o":["Lamina superficialis","Lamina pretrachealis","Lamina prevertebralis","Vagina carotis"],"c":2,"e":"Lamina prevertebralis danner skede for a. subclavia og plexus brachialis."},{"id":"ax16-q18","t":"ax16.hf","q":"Hvad omslutter vagina carotis?","o":["Kun a. carotis communis","Carotiderne og n. vagus","Kun v. jugularis interna","Thyroidea"],"c":1,"e":"Vagina carotis omslutter carotiderne og n. vagus (kranienerve X)."},{"id":"ax16-q19","t":"ax16.pc","q":"Hvilke segmenter danner plexus cervicalis?","o":["C1-C4 (tilskud fra C5)","C5-T1","C1-T1","C3-C7"],"c":0,"e":"Plexus cervicalis dannes af rami ventrales C1-C4, med tilskud fra C5."},{"id":"ax16-q20","t":"ax16.pc","q":"Hvilke muskler innerverer ansa cervicalis?","o":["M. omohyoideus, sternohyoideus, sternothyroideus","M. digastricus, mylohyoideus","M. thyrohyoideus, geniohyoideus","Mm. scaleni"],"c":0,"e":"Ansa cervicalis innerverer m. omohyoideus, sternohyoideus og sternothyroideus; thyrohyoideus/geniohyoideus får tråde via n. hypoglossus."},{"id":"ax16-q21","t":"ax16.pc","q":"Hvordan forløber n. phrenicus forskelligt på højre og venstre side?","o":["Højre løber langs v. cava sup., venstre løber ventralt for arcus aortae","De forløber identisk","Kun venstre findes","Højre perforerer diaphragma ved apex, venstre ikke"],"c":0,"e":"Højre n. phrenicus løber langs v. brachiocephalica/v. cava superior; venstre løber ventralt for n. vagus og arcus aortae."},{"id":"ax16-q22","t":"ax16.pc","q":"Hvad kaldes stedet, hvor plexus cervicalis' kutane grene ses samlet?","o":["Punctum nervosum","Trigonum caroticum","Trigonum suboccipitale","Fossa supraclavicularis"],"c":0,"e":"Punctum nervosum ligger ved bagkanten af m. sternocleidomastoideus."},{"id":"ax17-q1","t":"ax17.tmj","q":"Hvilken ledtype er art. temporomandibularis?","o":["Ægte, delt, kombineret hængsel-glideled","Uægte syndesmose","Ægte enkelt kugleled","Symfyse"],"c":0,"e":"Kæbeleddet er et ægte (synovialt), delt, kombineret hængsel-glideled."},{"id":"ax17-q2","t":"ax17.tmj","q":"Hvorfor kan kæbeleddet luksere uden kapselbristning?","o":["Fordi den discocondylære kapsel er slap","Fordi den discotemporale kapsel er slap for- og bagtil","Fordi der ingen kapsel er","Fordi ligamenterne er meget stramme"],"c":1,"e":"Den discotemporale del af kapslen er slap for- og bagtil, så leddet kan luksere uden bristning."},{"id":"ax17-q3","t":"ax17.tmj","q":"Hvilket ligament begrænser bagudglidning, men ikke fremadglidning, af mandibula?","o":["Lig. sphenomandibulare","Lig. stylomandibulare","Lig. laterale","Lig. capitis mandibulae"],"c":2,"e":"Lig. laterale fungerer som et kollateralt ligament og begrænser bagudglidning."},{"id":"ax17-q4","t":"ax17.tmj","q":"Hvad kendetegner malebevægelsen i kæbeleddet?","o":["Symmetrisk glide- og vinkelbevægelse","Asymmetrisk bevægelse, hvor det ene ledhoved roterer og det andet glider frem","Ren rotation i begge led samtidig","Kun bevægelse i det discotemporale kammer"],"c":1,"e":"Ved malebevægelsen roterer det ene ledhoved i fossa mandibularis, mens det andet glider frem på tuberculum articulare."},{"id":"ax17-q5","t":"ax17.tm","q":"Hvilken nerve innerverer alle fire tyggemuskler?","o":["N. facialis","N. mandibularis (fra n. trigeminus)","N. maxillaris","N. glossopharyngeus"],"c":1,"e":"Tyggemusklerne innerveres af n. mandibularis, 3. gren af n. trigeminus."},{"id":"ax17-q6","t":"ax17.tm","q":"Hvilken tyggemuskel giver protrusion ved bilateral kontraktion?","o":["M. masseter","M. temporalis","M. pterygoideus lateralis","M. pterygoideus medialis"],"c":2,"e":"M. pterygoideus lateralis trækker caput mandibulae frem på tuberculum articulare ved bilateral kontraktion (protrusion)."},{"id":"ax17-q7","t":"ax17.tm","q":"Hvad er pterygoideerinterstitset?","o":["Spalten mellem de to mm. pterygoidei, passage for kar/nerver","Et hul i os sphenoidale","En del af kæbeleddets kapsel","Fossa pterygopalatinas loft"],"c":0,"e":"Pterygoideerinterstitset er spalten mellem mm. pterygoidei lateralis og medialis - en vigtig passage."},{"id":"ax17-q8","t":"ax17.tm","q":"Hvilke muskler lukker munden?","o":["M. temporalis, masseter, pterygoideus medialis","M. digastricus, mylohyoideus, geniohyoideus","M. pterygoideus lateralis alene","Platysma"],"c":0,"e":"Mundlukkerne er m. temporalis, m. masseter og m. pterygoideus medialis."},{"id":"ax17-q9","t":"ax17.fp","q":"Hvilke tre knogler danner fossa pterygopalatina?","o":["Maxilla, lamina perpendicularis ossis palatini, proc. pterygoideus","Mandibula, maxilla, os zygomaticum","Os sphenoidale, os frontale, os ethmoidale","Os temporale, os occipitale, maxilla"],"c":0,"e":"Fossa pterygopalatina dannes af maxilla, lamina perpendicularis ossis palatini og proc. pterygoideus."},{"id":"ax17-q10","t":"ax17.fp","q":"Hvilken struktur er fossa pterygopalatina knudepunkt for?","o":["A. maxillaris og n. maxillaris","A. facialis og n. facialis","A. carotis interna og n. vagus","A. ophthalmica alene"],"c":0,"e":"Fossa pterygopalatina er knudepunkt for a. maxillaris og n. maxillaris til orbita, mellemansigt, næsehule og gane."},{"id":"ax17-q11","t":"ax17.am","q":"Hvilken arterie er a. maxillaris en endegren af?","o":["A. carotis interna","A. carotis externa","A. subclavia","A. facialis"],"c":1,"e":"A. maxillaris er en af de to endegrene af a. carotis externa (den anden er a. temporalis superficialis)."},{"id":"ax17-q12","t":"ax17.am","q":"I hvilket stykke af a. maxillaris afgår a. alveolaris inferior?","o":["1. stykke (pars retromandibularis)","2. stykke (pars intermuscularis)","3. stykke (pars sphenopalatina)","Den afgår slet ikke fra a. maxillaris"],"c":0,"e":"A. alveolaris inferior afgår i 1. stykke sammen med a. auricularis profunda og a. meningea media."},{"id":"ax17-q13","t":"ax17.am","q":"Hvor krydser a. temporalis superficialis, og hvorfor er stedet klinisk relevant?","o":["Superficielt for arcus zygomaticus, foran øregangen - palpabel puls","Dybt i fossa infratemporalis","Gennem foramen ovale","Bag proc. mastoideus"],"c":0,"e":"A. temporalis superficialis krydser superficielt for arcus zygomaticus foran øregangen, hvor pulsen kan palperes."},{"id":"ax17-q14","t":"ax17.sk","q":"Hvilke tre dele har m. epicranius?","o":["Venter occipitalis, galea aponeurotica, venter frontalis","Pars orbitalis, palpebralis, lacrimalis","Venter anterior, posterior, intermedius","Pars superficialis, media, profunda"],"c":0,"e":"M. epicranius består af venter occipitalis, galea aponeurotica (mellem) og venter frontalis."},{"id":"ax17-q15","t":"ax17.sk","q":"Hvilken gren af n. trigeminus innerverer skalpen lige bag kæben, via gl. parotidea?","o":["N. supraorbitalis (V1)","R. zygomaticotemporalis (V2)","N. auriculotemporalis (V3)","N. supratrochlearis (V1)"],"c":2,"e":"N. auriculotemporalis (V3) innerverer skalpen bag kæben, via gl. parotidea."},{"id":"ax17-q16","t":"ax17.an","q":"Hvilken nerve innerverer samtlige ansigtsmuskler?","o":["N. trigeminus","N. facialis","N. glossopharyngeus","Plexus cervicalis"],"c":1,"e":"Alle ansigtets mimiske muskler innerveres af n. facialis (CN VII)."},{"id":"ax17-q17","t":"ax17.an","q":"Hvilken struktur presser kinden ind mod tænderne under tygning?","o":["M. orbicularis oris","M. buccinator","M. masseter","M. temporalis"],"c":1,"e":"M. buccinator presser kinden ind mod tænderne, så der ikke ophobes føde i vestibulum oris."},{"id":"ax17-q18","t":"ax17.an","q":"Hvilken stamme af n. facialis forsyner mm. orbicularis oris og platysma?","o":["Temporofacial stamme","Cervicofacial stamme","Begge stammer ligeligt","Ingen af dem - de innerveres af n. trigeminus"],"c":1,"e":"Den cervicofaciale stamme (rami marginalis mandibulae, colli) forsyner orbicularis oris og platysma."},{"id":"ax17-q19","t":"ax17.an","q":"Hvad fortsætter a. facialis som i den mediale øjenkrog?","o":["A. angularis","A. ophthalmica","A. infraorbitalis","A. dorsalis nasi"],"c":0,"e":"A. facialis fortsætter som a. angularis i den mediale øjenkrog, hvor pulsen også kan palperes."},{"id":"ax17-q20","t":"ax17.sp","q":"Hvilken type kirtel er glandula parotidea?","o":["Ren serøs","Ren mukøs","Overvejende seromukøs","Overvejende mukoserøs"],"c":0,"e":"Gl. parotidea er en ren serøs kirtel."},{"id":"ax17-q21","t":"ax17.sp","q":"Hvor munder ductus parotideus (Stenoni) ud?","o":["Caruncula sublingualis","Papilla parotidea ud for 2. molar i overmunden","Plica sublingualis","Papilla incisiva"],"c":1,"e":"Ductus parotideus perforerer m. buccinator og munder ud som papilla parotidea ud for 2. molar i overkæben."},{"id":"ax17-q22","t":"ax17.sp","q":"Hvilken nerve løber i krog med ductus submandibularis?","o":["N. hypoglossus","N. lingualis","N. facialis","N. glossopharyngeus"],"c":1,"e":"N. lingualis løber under ductus submandibularis, fra lateralt til medialt."},{"id":"ax17-q23","t":"ax17.sp","q":"Hvilken spytkirtel har ingen egen fascielogeafgrænsning?","o":["Glandula parotidea","Glandula submandibularis","Glandula sublingualis","Alle tre har en loge"],"c":2,"e":"Glandula sublingualis har ingen egen loge, i modsætning til parotidea og submandibularis."},{"id":"ax18-q1","t":"ax18.kn","q":"Hvor mange par kranienerver findes der?","o":["10","12","31","8"],"c":1,"e":"Der findes 12 par kranienerver, som udgår direkte fra hjernen/hjernestammen."},{"id":"ax18-q2","t":"ax18.kn","q":"Hvilken kranienerve er rent sensorisk og relateret til lugtesans?","o":["N. opticus (II)","N. olfactorius (I)","N. trigeminus (V)","N. facialis (VII)"],"c":1,"e":"N. olfactorius (I) er rent sensorisk og formidler lugtesansen."},{"id":"ax18-q3","t":"ax18.kn","q":"Hvilken kranienerve styrer bevægelse af m. sternocleidomastoideus og m. trapezius?","o":["N. accessorius (XI)","N. vagus (X)","N. hypoglossus (XII)","N. facialis (VII)"],"c":0,"e":"N. accessorius (XI) er motorisk til m. SCM og m. trapezius."},{"id":"ax18-q4","t":"ax18.lk","q":"Hvilken muskel erstatter m. orbicularis oris' rolle i kinden?","o":["M. buccinator","M. masseter","M. risorius","M. zygomaticus major"],"c":0,"e":"I kinden er m. orbicularis oris' lag udskiftet med m. buccinator."},{"id":"ax18-q5","t":"ax18.lk","q":"Hvad kendetegner prolabiet?","o":["Kraftig behåring","Nærmest ingen keratinisering, mukokutan grænsezone","Tykt hornlag som resten af huden","Ingen nerveforsyning"],"c":1,"e":"Prolabiet (det røde af læberne) har næsten ingen keratinisering og udgør en mukokutan grænsezone."},{"id":"ax18-q6","t":"ax18.mh","q":"Hvad adskiller cavitas oris propria fra vestibulum oris?","o":["Tandbuerne","Ganen alene","Tungen alene","Der er ingen forskel"],"c":0,"e":"Tandbuerne opdeler cavitas oris i cavitas oris propria (indenfor) og vestibulum oris (udenfor, mod læber/kinder)."},{"id":"ax18-q7","t":"ax18.mh","q":"Hvor munder ductus parotideus ud?","o":["I regio sublingualis","I vestibulum oris, ved 2. molar","I fossa tonsillaris","I cavitas oris propria centralt"],"c":1,"e":"Ductus parotideus munder ud i vestibulum oris ud for 2. molar i overkæben."},{"id":"ax18-q8","t":"ax18.ga","q":"Hvilke knogler danner palatum durum?","o":["Proc. palatinus maxillae + lamina horizontalis ossis palatini","Vomer + os ethmoidale","Mandibula + maxilla","Os sphenoidale alene"],"c":0,"e":"Palatum durum dannes af proc. palatinus maxillae og lamina horizontalis ossis palatini."},{"id":"ax18-q9","t":"ax18.ga","q":"Hvilken muskel strammer ganesejlet fra side til side?","o":["M. levator veli palatini","M. tensor veli palatini","M. uvulae","M. palatopharyngeus"],"c":1,"e":"M. tensor veli palatini ('den, der strækker') strammer ganesejlet fra side til side."},{"id":"ax18-q10","t":"ax18.ga","q":"Hvad ligger mellem arcus palatoglossus og arcus palatopharyngeus?","o":["Fossa tonsillaris (med tonsilla palatina)","Isthmus faucium alene","Uvula alene","Aponeurosis palatina"],"c":0,"e":"Fossa tonsillaris med tonsilla palatina ligger mellem de to ganebuer."},{"id":"ax18-q11","t":"ax18.tu","q":"Hvad opdeler sulcus terminalis dorsum linguae i?","o":["Pars presulcalis (2/3) og pars postsulcalis (1/3)","Radix og corpus","Apex og basis","Højre og venstre halvdel"],"c":0,"e":"Sulcus terminalis opdeler dorsum i pars presulcalis (forreste 2/3) og pars postsulcalis (bageste 1/3)."},{"id":"ax18-q12","t":"ax18.tu","q":"Hvilken papiltype ligger foran og parallelt med sulcus terminalis?","o":["Papillae filiformes","Papillae vallatae","Papillae fungiformes","Papillae foliatae"],"c":1,"e":"Papillae vallatae ligger foran og parallelt med sulcus terminalis, med voldgrav og talrige smagsløg."},{"id":"ax18-q13","t":"ax18.tm","q":"Hvilken tungemuskel giver protrusion?","o":["M. genioglossus","M. hyoglossus","M. styloglossus","M. palatoglossus"],"c":0,"e":"M. genioglossus giver protrusion af tungen."},{"id":"ax18-q14","t":"ax18.tm","q":"Hvilken muskel sænker tungen?","o":["M. styloglossus","M. hyoglossus","M. genioglossus","M. palatoglossus"],"c":1,"e":"M. hyoglossus sænker tungen; m. styloglossus trækker den bagud og opad."},{"id":"ax18-q15","t":"ax18.tn","q":"Hvilken tungemuskel innerveres IKKE af n. hypoglossus?","o":["M. genioglossus","M. hyoglossus","M. styloglossus","M. palatoglossus"],"c":3,"e":"M. palatoglossus innerveres af n. vagus, ikke n. hypoglossus, selvom det er en tungemuskel."},{"id":"ax18-q16","t":"ax18.tn","q":"Hvorfor devierer tungen mod den paralyserede side ved n. hypoglossus-læsion?","o":["Fordi den lammede m. genioglossus ikke længere modvirkes af den raske side","Fordi den raske m. genioglossus trækker den derhen","Tilfældigt fænomen uden forklaring","Fordi m. hyoglossus trækker den derhen"],"c":0,"e":"Den uafficerede modsidige m. genioglossus' uimodsagte virkning trækker tungen mod den lammede side."},{"id":"ax18-q17","t":"ax18.tn","q":"Hvilken nerve bærer smagstråde til tungens forreste 2/3?","o":["N. glossopharyngeus","N. lingualis (med chorda tympani fra n. facialis)","N. hypoglossus","N. vagus"],"c":1,"e":"Smagstrådene til forreste 2/3 løber med n. lingualis, tilført via chorda tympani fra n. facialis."},{"id":"ax18-q18","t":"ax18.tn","q":"Hvor løber n. glossopharyngeus i forhold til m. hyoglossus?","o":["Medialt for musklen","Lateralt for musklen","Gennem musklen","Den passerer ikke musklen"],"c":0,"e":"N. glossopharyngeus løber medialt for m. hyoglossus, modsat n. hypoglossus der løber lateralt."},{"id":"ax18-q19","t":"ax18.ta","q":"Hvor mange dentes permanentes har et fuldt voksent tandsæt?","o":["28","30","32","34"],"c":2,"e":"Et voksent tandsæt har 32 tænder (8 per kvadrant: 2 incisivi, 1 caninus, 2 premolares, 3 molares)."},{"id":"ax18-q20","t":"ax18.ta","q":"Hvilken nerve forsyner undertænderne?","o":["N. alveolaris inferior (fra n. mandibularis)","N. infraorbitalis","N. alveolaris superior posterior","N. palatinus major"],"c":0,"e":"N. alveolaris inferior fra n. mandibularis (V3) forsyner undertænderne via plexus dentalis inferior."},{"id":"ax19-q1","t":"ax19.tg","q":"Hvilke tre hovedgrene har n. trigeminus?","o":["Ophthalmicus, maxillaris, mandibularis","Frontalis, zygomaticus, buccalis","Nasociliaris, infraorbitalis, lingualis","Auriculotemporalis, lingualis, alveolaris"],"c":0,"e":"N. trigeminus deler sig i V1 (ophthalmicus), V2 (maxillaris) og V3 (mandibularis)."},{"id":"ax19-q2","t":"ax19.tg","q":"Hvilket foramen passerer n. maxillaris (V2) igennem?","o":["Foramen ovale","Foramen rotundum","Foramen spinosum","Fissura orbitalis superior alene"],"c":1,"e":"N. maxillaris passerer gennem foramen rotundum til fossa pterygopalatina."},{"id":"ax19-q3","t":"ax19.tg","q":"Hvilken gren af V3 er sensorisk til tungens forreste 2/3?","o":["N. auriculotemporalis","N. lingualis","N. alveolaris inferior","N. buccalis"],"c":1,"e":"N. lingualis er sensorisk til de forreste 2/3 af tungen og bærer smagstråde fra chorda tympani."},{"id":"ax19-q4","t":"ax19.tg","q":"Hvilken linje adskiller V3's hudområde fra de cervikale nervers?","o":["Isse-øre-hage-linjen","Linea nuchae superior","Linea temporalis superior","Sutura coronalis"],"c":0,"e":"Isse-øre-hage-linjen skiller n. trigeminus' innervationsområde fra plexus cervicalis'."},{"id":"ax19-q5","t":"ax19.ny","q":"Hvilke to hovedbestanddele har det ossøse skelet af nasus externus?","o":["Ossa nasales + processus frontales maxillae","Vomer + lamina perpendicularis","Concha nasalis inferior + vomer","Os ethmoidale alene"],"c":0,"e":"Ossa nasales og processus frontales maxillae (+corpus maxillae) danner apertura piriformis."},{"id":"ax19-q6","t":"ax19.ny","q":"Hvilken brusk ligger mellem lamina perpendicularis ossis ethmoidalis og vomer?","o":["Cartilago septi nasi","Cartilago alaris major","Cartilago nasi lateralis","Cartilagines alares minores"],"c":0,"e":"Cartilago septi nasi udgør den bruskede del af næseskillevæggen."},{"id":"ax19-q7","t":"ax19.cn","q":"Hvad adskiller vestibulum nasi fra cavitas nasi propria?","o":["Vestibulum er hudbeklædt, propria er slimhindebeklædt","Der er ingen forskel","Propria er hudbeklædt, vestibulum slimhinde","Vestibulum har conchae, propria har det ikke"],"c":0,"e":"Vestibulum nasi er hudbeklædt (mukokutan grænsezone), mens cavitas nasi propria er slimhindebeklædt."},{"id":"ax19-q8","t":"ax19.cn","q":"Hvilken concha hænger frit og er dannet af os ethmoidale?","o":["Concha nasalis inferior","Concha nasalis media","Begge conchae inferior og media","Ingen af dem"],"c":1,"e":"Concha nasalis media er dannet af os ethmoidale og hænger frit; concha inferior er en selvstændig knogle."},{"id":"ax19-q9","t":"ax19.cn","q":"Hvor udmunder sinus maxillaris?","o":["Meatus nasi superior","Meatus nasi medius (hiatus semilunaris)","Meatus nasi inferior","Recessus sphenoethmoidalis"],"c":1,"e":"Sinus maxillaris udmunder i meatus nasi medius via hiatus maxillaris/semilunaris."},{"id":"ax19-q10","t":"ax19.cn","q":"Hvad er 'Locus Kiesselbachi'?","o":["Et sted med hyppigt næseblod pga. arterie-anastomoser fortil i septum","Den bageste del af septum nasi","Et andet navn for sinus sphenoidalis","Åbningen af ductus nasolacrimalis"],"c":0,"e":"Locus Kiesselbachi er anastomosezonen mellem flere arterier fortil i septum, hyppigt sted for næseblod."},{"id":"ax19-q11","t":"ax19.si","q":"Hvilken bihule har tæt relation til dentes molares 1 og 2?","o":["Sinus frontalis","Sinus maxillaris","Sinus sphenoidalis","Sinus ethmoidalis"],"c":1,"e":"Sinus maxillaris' gulv har tæt relation til de øvre molarer 1 og 2."},{"id":"ax19-q12","t":"ax19.si","q":"Hvilken bihule har relation til hypofysen og n. opticus?","o":["Sinus frontalis","Sinus maxillaris","Sinus sphenoidalis","Sinus ethmoidalis"],"c":2,"e":"Sinus sphenoidalis ligger i corpus ossis sphenoidalis nær hypofysen, n. opticus og sinus cavernosus."},{"id":"ax19-q13","t":"ax19.ph","q":"Hvilke tre dele inddeles pharynx i?","o":["Nasopharynx, oropharynx, laryngopharynx","Rhinopharynx, mesopharynx, hypopharynx (kun 2 navne)","Naso-, oro- og laryngolarynx","Supra-, meso- og infrapharynx"],"c":0,"e":"Pharynx inddeles i pars nasalis (nasopharynx), pars oralis (oropharynx) og pars laryngea (laryngopharynx)."},{"id":"ax19-q14","t":"ax19.ph","q":"Hvor strækker pharynx sig fra og til?","o":["Basis cranii til cartilago cricoidea (C6)","Choanae til epiglottis","Palatum molle til oesophagus","Foramen magnum til sternum"],"c":0,"e":"Pharynx strækker sig fra basis cranii til cartilago cricoidea ud for C6."},{"id":"ax19-q15","t":"ax19.ph","q":"Hvad er torus tubarius?","o":["Fremspring dannet af cartilago tubae auditivae i nasopharynx' sidevæg","Et andet navn for tonsilla pharyngealis","Recessus piriformis' anden betegnelse","En del af oropharynx' forvæg"],"c":0,"e":"Torus tubarius er fremspringet dannet af tubabrusken omkring ostium pharyngeum tubae auditivae."},{"id":"ax19-q16","t":"ax19.ph","q":"Hvilke tonsiller indgår i Waldeyer's svælgring?","o":["Pharyngealis, palatina, lingualis","Palatina, submandibularis, sublingualis","Pharyngealis, parotidea, lingualis","Kun tonsilla palatina"],"c":0,"e":"Waldeyer's svælgring består af tonsilla pharyngealis, palatina og lingualis."},{"id":"ax19-q17","t":"ax19.sm","q":"Hvor insererer alle tre pharynx-konstriktorer?","o":["Raphe pharyngis","Tuberculum pharyngeum alene","Cartilago thyroidea","Basis cranii"],"c":0,"e":"Alle konstriktorerne insererer dorsalt i raphe pharyngis."},{"id":"ax19-q18","t":"ax19.sm","q":"Hvilken muskel hjælper til at åbne tuba auditiva ved synkning?","o":["M. stylopharyngeus","M. salpingopharyngeus","M. palatopharyngeus","M. constrictor pharyngis superior"],"c":1,"e":"M. salpingopharyngeus hjælper til åbningen af tuba auditiva - derfor trykudligner man ved at synke."},{"id":"ax19-q19","t":"ax19.sm","q":"Hvilken pharynxmuskel løfter også larynx?","o":["M. stylopharyngeus","M. constrictor pharyngis inferior","M. salpingopharyngeus","M. constrictor pharyngis medius"],"c":0,"e":"M. stylopharyngeus løfter både pharynx og larynx."},{"id":"ax19-q20","t":"ax19.pk","q":"Hvilken nerve forsyner oropharynx sensorisk?","o":["N. glossopharyngeus","N. vagus","Rr. pharyngei n. maxillaris","N. hypoglossus"],"c":0,"e":"N. glossopharyngeus forsyner oropharynx (dog ikke vallecula epiglottica)."},{"id":"ax19-q21","t":"ax19.pk","q":"Hvilken fase af synkeprocessen er voluntær?","o":["Den orale fase","Den pharyngeale fase","Den oesophageale fase","Ingen af faserne"],"c":0,"e":"Kun den orale fase er voluntær; de to øvrige faser er involuntære."},{"id":"ax19-q22","t":"ax19.pk","q":"Hvad lukker isthmus pharyngonasalis under synkning?","o":["Passavant's muskelvulst","M. stylopharyngeus alene","Epiglottis","Tonsilla pharyngealis"],"c":0,"e":"Passavant's muskelvulst lukker isthmus pharyngonasalis under den pharyngeale fase af synkningen."},{"id":"ax20-q1","t":"ax20.oy","q":"Hvilke to dele består auris externa af?","o":["Auricula og meatus acusticus externus","Cavitas tympanica og tuba auditiva","Cochlea og vestibulum","Malleus og incus"],"c":0,"e":"Auris externa består af øremuslingen (auricula) og den ydre øregang (meatus acusticus externus)."},{"id":"ax20-q2","t":"ax20.oy","q":"Hvor tyk er membrana tympanica?","o":["0,01 mm","0,1 mm","1 mm","5 mm"],"c":1,"e":"Trommehinden er kun ca. 0,1 mm tyk."},{"id":"ax20-q3","t":"ax20.oy","q":"Hvad hedder området mellem hammerfolderne på trommehinden?","o":["Pars tensa","Pars flaccida","Umbo","Stria mallearis"],"c":1,"e":"Pars flaccida ligger mellem forreste og bageste hammerfold; resten er pars tensa."},{"id":"ax20-q4","t":"ax20.om","q":"Hvilke tre dele består auris media af?","o":["Cavitas tympanica, antrum mastoideum, tuba auditiva","Auricula, meatus, cavitas tympanica","Cochlea, vestibulum, canales semicirculares","Malleus, incus, stapes"],"c":0,"e":"Mellemøret består af cavitas tympanica, antrum mastoideum + cellulae mastoideae, og tuba auditiva."},{"id":"ax20-q5","t":"ax20.om","q":"Hvilken struktur udgør cavitas tympanicas loft?","o":["Tegmen tympani","Promontorium","Fenestra vestibuli","Processus cochleariformis"],"c":0,"e":"Tegmen tympani (en knogleplade) udgør loftet og grænser til fossa cranii media."},{"id":"ax20-q6","t":"ax20.om","q":"Hvad er rækkefølgen af øreknoglerne fra trommehinden til det indre øre?","o":["Malleus - Incus - Stapes","Incus - Malleus - Stapes","Stapes - Incus - Malleus","Malleus - Stapes - Incus"],"c":0,"e":"MIS: Malleus - Incus - Stapes, fra membrana tympanica til fenestra vestibuli."},{"id":"ax20-q7","t":"ax20.om","q":"Hvilken muskel innerveres af n. facialis?","o":["M. tensor tympani","M. stapedius","Begge","Ingen af dem"],"c":1,"e":"M. stapedius innerveres af n. facialis; m. tensor tympani innerveres af n. mandibularis (V3)."},{"id":"ax20-q8","t":"ax20.nf","q":"Hvor mange stykker inddeles canalis facialis i?","o":["2","3","4","5"],"c":1,"e":"Canalis facialis inddeles i 3 stykker: anterolateralt, posterolateralt og kaudalt."},{"id":"ax20-q9","t":"ax20.nf","q":"Hvilken nerve dannes ved forening af n. petrosus major og n. petrosus profundus?","o":["N. canalis pterygoidei","Chorda tympani","N. petrosus minor","N. tympanicus"],"c":0,"e":"N. canalis pterygoidei dannes ved forening af n. petrosus major (parasympatisk) og n. petrosus profundus (sympatisk)."},{"id":"ax20-q10","t":"ax20.nf","q":"Chorda tympani bærer smagstråde fra hvilken del af tungen?","o":["Forreste 2/3","Bageste 1/3","Hele tungen","Kun tungespidsen"],"c":0,"e":"Chorda tympani (fra n. facialis) bærer smagstråde fra tungens forreste 2/3."},{"id":"ax20-q11","t":"ax20.nf","q":"Hvor synapser de parasympatiske fibre i n. petrosus minor?","o":["Ganglion pterygopalatinum","Ganglion oticum","Ganglion submandibulare","Ganglion geniculi"],"c":1,"e":"N. petrosus minor (fra n. glossopharyngeus via n. tympanicus) synapser i ganglion oticum, til forsyning af gl. parotidea."},{"id":"ax20-q12","t":"ax20.lb","q":"Hvilke seks brusk udgør larynx?","o":["Thyroidea, cricoidea, arytenoideae, corniculatae, cuneiformes, epiglottica","Thyroidea, hyoidea, cricoidea, arytenoideae, tracheales, epiglottica","Cricoidea, arytenoideae, corniculatae, tracheales, hyoidea, thyroidea","Kun thyroidea og cricoidea"],"c":0,"e":"De seks larynxbrusk er thyroidea, cricoidea, arytenoideae, corniculatae, cuneiformes og epiglottica."},{"id":"ax20-q13","t":"ax20.lb","q":"Hvilken struktur danner den øvre, frie rand af conus elasticus?","o":["Ligg. vocalia","Ligg. vestibularia","Lig. cricotracheale","Membrana thyrohyoidea"],"c":0,"e":"Conus elasticus' øvre, frie rand er forstærket og danner ligg. vocalia (stemmebåndene)."},{"id":"ax20-q14","t":"ax20.lb","q":"Hvilken bevægelse tillader art. cricothyroidea?","o":["Kippebevægelser omkring transversal akse","Rotation omkring vertikal akse","Glidebevægelser medialt/lateralt","Ingen bevægelse - det er en synostose"],"c":0,"e":"Art. cricothyroidea tillader små kippebevægelser (ca. 15°) omkring en transversal akse."},{"id":"ax20-q15","t":"ax20.lc","q":"Hvilke tre rum inddeler plicae vocales et vestibulares cavitas laryngis i?","o":["Vestibulum laryngis, ventriculus laryngis, cavitas infraglottica","Naso-, oro-, laryngopharynx","Epi-, meso-, hypotympanon","Aditus, isthmus, cavitas propria"],"c":0,"e":"Cavitas laryngis inddeles i vestibulum laryngis, ventriculus laryngis og cavitas infraglottica."},{"id":"ax20-q16","t":"ax20.lc","q":"Hvad indeholder plicae vestibulares, som holder stemmelæberne fugtige?","o":["Talrige kirtler og muskelfibre","Kun bindevæv","Brusk","Fedtvæv alene"],"c":0,"e":"Plicae vestibulares indeholder talrige kirtler og muskelfibre, der holder de ægte stemmelæber fugtige."},{"id":"ax20-q17","t":"ax20.lm","q":"Hvilken muskel er den eneste abduktor af stemmelæberne?","o":["M. cricothyroideus","M. cricoarytenoideus posterior","M. cricoarytenoideus lateralis","M. thyroarytenoideus"],"c":1,"e":"M. cricoarytenoideus posterior er den eneste muskel, der abducerer (spiler) stemmelæberne."},{"id":"ax20-q18","t":"ax20.lm","q":"Hvilken muskel forlænger ligg. vocalia ved at kippe cartilago cricoidea?","o":["M. cricothyroideus","M. thyroarytenoideus","M. aryepiglotticus","Mm. arytenoidei"],"c":0,"e":"M. cricothyroideus forlænger (strammer) stemmebåndene ved at kippe cricoidbrusken."},{"id":"ax20-q19","t":"ax20.lk","q":"Hvilken nerve innerverer alle larynxmuskler undtagen m. cricothyroideus?","o":["N. laryngeus superior","N. laryngeus recurrens","N. glossopharyngeus","N. accessorius"],"c":1,"e":"N. laryngeus recurrens innerverer motorisk alle larynxmuskler undtagen m. cricothyroideus (som får r. externus n. laryngei superioris)."},{"id":"ax20-q20","t":"ax20.lk","q":"Hvilken gren af n. laryngeus superior er rent sensorisk/parasympatisk?","o":["R. externus","R. internus","Begge er motoriske","Ingen af dem"],"c":1,"e":"R. internus forsyner larynx sensorisk og parasympatisk ned til de ægte stemmelæber - ikke motorisk."},{"id":"ax20-q21","t":"ax20.gt","q":"Hvor stammer en evt. lobus pyramidalis på gl. thyroidea fra?","o":["Rester fra kirtlens embryologiske vandring gennem foramen caecum linguae","En selvstændig kirtel uden relation til thyroidea","Altid tilstede hos alle mennesker","Dannes af gl. parathyroidea"],"c":0,"e":"Lobus pyramidalis er accessorisk thyroideavæv langs kirtlens nedvandringsvej fra foramen caecum linguae."},{"id":"ax20-q22","t":"ax20.gt","q":"Hvor mange gll. parathyroideae er der normalt, og hvad producerer de?","o":["4 stk., PTH","2 stk., thyroxin","6 stk., calcitonin","4 stk., insulin"],"c":0,"e":"4 gll. parathyroideae (2 øvre, 2 nedre) producerer PTH, vigtigt for calciumstofskiftet."},{"id":"ax21-q1","t":"ax21.sl","q":"Hvilke fire strukturer er gennemgående i spatium lateropharyngeum?","o":["A. carotis communis, v. jugularis interna, n. vagus, truncus sympathicus","A. carotis externa, v. jugularis externa, n. facialis, n. accessorius","A. subclavia, v. subclavia, plexus brachialis, n. phrenicus","A. maxillaris, v. maxillaris, n. mandibularis, n. lingualis"],"c":0,"e":"De fire gennemgående strukturer er a. carotis communis, v. jugularis interna, n. vagus, og bagved truncus sympathicus."},{"id":"ax21-q2","t":"ax21.sl","q":"Hvad udgør lateralvæggen i spatium lateropharyngeum?","o":["Gl. parotidea","Pharynx","Prævertebral muskulatur","Mm. pterygoidei"],"c":0,"e":"Lateralvæggen udgøres af gl. parotidea."},{"id":"ax21-q3","t":"ax21.hs","q":"Fra hvilket stykke af a. subclavia afgår a. vertebralis?","o":["1. stykke","2. stykke","3. stykke","Den afgår ikke fra a. subclavia"],"c":0,"e":"A. vertebralis, truncus thyrocervicalis og a. thoracica interna afgår alle fra 1. stykke."},{"id":"ax21-q4","t":"ax21.hs","q":"Hvor kan a. subclavia komprimeres mod knogle?","o":["3. stykke, mod costa I","1. stykke, mod sternum","2. stykke, mod clavicula","Den kan ikke komprimeres"],"c":0,"e":"3. stykke ligger frit i fossa supraclavicularis major og kan komprimeres mod costa I."},{"id":"ax21-q5","t":"ax21.hs","q":"Hvilken struktur krydser a. subclavia 1. stykke på højre side?","o":["N. vagus dxt. og n. phrenicus dxt.","Ductus thoracicus","N. accessorius","Kun v. subclavia"],"c":0,"e":"På højre side krydses 1. stykke af n. vagus dxt. (som afgiver n. laryngeus recurrens) og n. phrenicus dxt.; på venstre side af ductus thoracicus og n. phrenicus sin."},{"id":"ax21-q6","t":"ax21.hc","q":"Hvad forsyner a. carotis externa IKKE?","o":["Hjernen og øjet","Ansigtet","Gl. thyroidea","Tungen"],"c":0,"e":"A. carotis externa forsyner hverken hjernen, øjet eller panden - det er a. carotis internas område."},{"id":"ax21-q7","t":"ax21.hc","q":"Hvilke er a. carotis externas tre forreste grene?","o":["Thyroidea superior, lingualis, facialis","Pharyngea ascendens, occipitalis, auricularis posterior","Temporalis superficialis, maxillaris, facialis","Lingualis, facialis, occipitalis"],"c":0,"e":"De tre forreste grene er a. thyroidea superior, a. lingualis og a. facialis."},{"id":"ax21-q8","t":"ax21.hc","q":"Hvad er huskereglen for CN IX og XII i forhold til carotiderne?","o":["Hypoglossus henover, glossopharyngeus gennem","Glossopharyngeus henover, hypoglossus gennem","Begge løber henover","Begge løber gennem"],"c":0,"e":"N. hypoglossus løber henover (lateralt for) carotiderne; n. glossopharyngeus løber gennem/mellem dem."},{"id":"ax21-q9","t":"ax21.hc","q":"Hvilke kranienerver ligger sammen med a. carotis interna i sinus cavernosus?","o":["III, IV, V, VI","V, VII, VIII, IX","IX, X, XI, XII","I, II, III, IV"],"c":0,"e":"CN III, IV, V (dele) og VI ligger i sinus cavernosus sammen med a. carotis interna."},{"id":"ax21-q10","t":"ax21.kn","q":"Hvilken muskel innerveres motorisk af n. glossopharyngeus (IX)?","o":["M. stylopharyngeus","M. stylohyoideus","M. palatopharyngeus","M. cricothyroideus"],"c":0,"e":"N. glossopharyngeus innerverer kun m. stylopharyngeus motorisk."},{"id":"ax21-q11","t":"ax21.kn","q":"Hvilken nerve innerverer larynxmuskulaturen og pharynxkonstriktorerne?","o":["N. vagus (X)","N. glossopharyngeus (IX)","N. accessorius (XI)","N. hypoglossus (XII)"],"c":0,"e":"N. vagus innerverer motorisk larynxmuskulaturen og pharynxkonstriktorerne."},{"id":"ax21-q12","t":"ax21.kn","q":"Hvor afgår n. laryngeus recurrens dexter?","o":["Hvor n. vagus krydser a. subclavia","Hvor n. vagus krydser arcus aortae","Ved foramen jugulare","Ved os hyoideum"],"c":0,"e":"Højre n. laryngeus recurrens afgår, hvor n. vagus krydser a. subclavia; venstre hvor den krydser arcus aortae."},{"id":"ax21-q13","t":"ax21.kn","q":"Hvilke to rødder danner n. accessorius (XI), og hvad sker der ved foramen jugulare?","o":["Radix cranialis og spinalis; cranialis slår sig over på n. vagus som r. internus","Kun én rod fra medulla oblongata","Radix cranialis bliver til r. externus","De forbliver adskilte hele vejen"],"c":0,"e":"Radix cranialis (fra medulla) og radix spinalis (C1-C5/6) forenes; ved foramen jugulare slår cranialis sig over på n. vagus (r. internus), og spinalis fortsætter som r. externus/n. accessorius."},{"id":"ax21-q14","t":"ax21.kn","q":"Hvilken muskel innerveres IKKE af n. hypoglossus?","o":["M. genioglossus","M. hyoglossus","M. palatoglossus","M. styloglossus"],"c":2,"e":"M. palatoglossus innerveres af n. vagus, selvom det er en tungemuskel - resten innerveres af n. hypoglossus."},{"id":"ax21-q15","t":"ax21.ts","q":"Hvor mange store ganglier er halsdelen af truncus sympathicus fusioneret til?","o":["3","2","5","8"],"c":0,"e":"3 store ganglier: cervicale superius, medius og inferius (cervicothoracium/stellatum)."},{"id":"ax21-q16","t":"ax21.ts","q":"Hvilken struktur er en fortsættelse af ganglion cervicale superius og forsyner kranienerverne sympatisk?","o":["N. caroticus internus / plexus caroticus internus","Ramus communicans albus","N. laryngeus superior","N. petrosus major"],"c":0,"e":"N. caroticus internus fortsætter fra ganglion cervicale superius og danner plexus caroticus internus."},{"id":"ax21-q17","t":"ax21.ts","q":"Hvor findes ramus communicans albus?","o":["Kun ud for spinalnerve T1-L2","På alle spinalnerve-niveauer","Kun cervikalt","Kun sakralt"],"c":0,"e":"Ramus communicans albus (præganglionære fibre) findes kun T1-L2; griseus findes på alle niveauer."},{"id":"ax21-q18","t":"ax21.hv","q":"Hvor begynder og ender v. jugularis interna?","o":["Begynder i foramen jugulare, ender i v. brachiocephalica (med v. subclavia)","Begynder ved os hyoideum, ender i v. cava superior","Begynder i sinus cavernosus, ender i v. facialis","Begynder i orbita, ender i v. jugularis externa"],"c":0,"e":"V. jugularis interna begynder i foramen jugulare (fra sinus sigmoideus) og ender ved sammenløb med v. subclavia som danner v. brachiocephalica."},{"id":"ax21-q19","t":"ax21.hv","q":"Hvilke to vener danner v. retromandibularis?","o":["V. temporalis superficialis og v. maxillaris","V. facialis og v. lingualis","V. jugularis interna og externa","V. auricularis posterior og v. occipitalis"],"c":0,"e":"V. retromandibularis dannes af v. temporalis superficialis og v. maxillaris."},{"id":"ax21-q20","t":"ax21.hl","q":"Hvilken lymfeknude palperes typisk ved hævelse svarende til angulus mandibulae?","o":["Ln. jugulodigastricus","Ln. juguloomohyoideus","Lnn. submentales","Lnn. parotidei"],"c":0,"e":"Ln. jugulodigastricus er den største knude i den øvre dybe gruppe og palperes ved hævelse ud for angulus mandibulae."},{"id":"ax21-q21","t":"ax21.hl","q":"Hvor ender ductus thoracicus?","o":["V. brachiocephalica sinister","V. jugularis interna dexter","V. cava superior direkte","V. subclavia dexter"],"c":0,"e":"Ductus thoracicus ender i v. brachiocephalica sinister, i vinklen mellem vv. subclavia et jugularis interna."},{"id":"ax22-q1","t":"ax22.yo","q":"Hvad er funktionen af supercilium (øjenbrynet)?","o":["Hindrer sved og fugt i at komme ind i øjet","Holder cornea fugtig","Danner tårevæske","Beskytter mod UV-lys alene"],"c":0,"e":"Supercilium forløber parallelt med margo supraorbitalis og hindrer sved/fugt i at løbe ind i øjet."},{"id":"ax22-q2","t":"ax22.yo","q":"Hvor hæfter lig. palpebrale mediale?","o":["Crista lacrimalis anterior","Proc. frontalis ossis zygomatici","Crista lacrimalis posterior","Fossa sacci lacrimalis alene"],"c":0,"e":"Lig. palpebrale mediale hæfter på crista lacrimalis anterior, foran fossa sacci lacrimalis."},{"id":"ax22-q3","t":"ax22.yo","q":"Hvilken nerve innerverer m. lev
