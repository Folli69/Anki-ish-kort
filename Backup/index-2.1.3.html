:"ax14.th","k":"occ","img":"costa1","boxes":[[22.275,0.738,9.394,6.337],[66.429,0.738,13.516,6.337],[36.465,0.911,32.065,26.519],[49.98,0.911,12.881,6.163],[11.336,27.3,1.902,2.431],[26.437,30.165,11.653,6.163],[49.306,32.031,1.268,3.429],[65.834,33.594,7.65,2.778],[44.431,41.233,11.058,6.163],[59.612,41.233,7.65,6.207],[44.035,71.441,10.464,6.337],[13.278,23.047,4.479,3.646],[65.834,29.991,8.244,3.038],[16.885,52.3,8.244,6.207]],"target":8,"a":"Corpus costae","n":"Ribbenets skaft."},{"id":"ax14-o131","t":"ax14.th","k":"occ","img":"costa1","boxes":[[22.275,0.738,9.394,6.337],[66.429,0.738,13.516,6.337],[36.465,0.911,32.065,26.519],[49.98,0.911,12.881,6.163],[11.336,27.3,1.902,2.431],[26.437,30.165,11.653,6.163],[49.306,32.031,1.268,3.429],[65.834,33.594,7.65,2.778],[44.431,41.233,11.058,6.163],[59.612,41.233,7.65,6.207],[44.035,71.441,10.464,6.337],[13.278,23.047,4.479,3.646],[65.834,29.991,8.244,3.038],[16.885,52.3,8.244,6.207]],"target":9,"a":"Cartilago costalis","n":"Ribbensbrusk, forbinder costa med sternum."},{"id":"ax14-o132","t":"ax14.th","k":"occ","img":"costa1","boxes":[[22.275,0.738,9.394,6.337],[66.429,0.738,13.516,6.337],[36.465,0.911,32.065,26.519],[49.98,0.911,12.881,6.163],[11.336,27.3,1.902,2.431],[26.437,30.165,11.653,6.163],[49.306,32.031,1.268,3.429],[65.834,33.594,7.65,2.778],[44.431,41.233,11.058,6.163],[59.612,41.233,7.65,6.207],[44.035,71.441,10.464,6.337],[13.278,23.047,4.479,3.646],[65.834,29.991,8.244,3.038],[16.885,52.3,8.244,6.207]],"target":10,"a":"Sternum","n":"Brystbenet, hvortil ribbensbrusken hæfter."},{"id":"ax15-t1","t":"ax15.di","k":"text","q":"Hvad er diaphragma, og hvordan er den grundlæggende formet?","a":"Mellemgulvet: en kuppelformet muskel, der adskiller thorax fra abdomen. Har to kupler (højre og venstre) med et affladet midterparti.","img":"r_ax15_39-0"},{"id":"ax15-t2","t":"ax15.di","k":"text","q":"Hvordan er diaphragma inddelt i en perifer og en central del?","a":"**Perifer del:** kødet muskel med tre udspringshoveder. **Central del:** tendinøs insertionssene (centrum tendineum).","img":"r_ax15_39-0"},{"id":"ax15-t3","t":"ax15.di","k":"text","q":"Hvilke tre udspringshoveder (partes) har diaphragma?","a":"**Pars sternalis:** udspring bagsiden af proc. xiphoideus.\n**Pars costalis:** udspring ribbensbrusken, costa 7–12.\n**Pars lumbalis:** udspring med et højre og venstre 'ben' — crus dextrum fra corpora vertebrae L1–L3, crus sinistrum fra L1–L2.","img":"r_ax15_40-0"},{"id":"ax15-t4","t":"ax15.di","k":"text","q":"Hvad insererer diaphragmas muskelfibre i?","a":"Centrum tendineum, som har 3 alae (vinger): forreste, højre og venstre."},{"id":"ax15-t5","t":"ax15.di","k":"text","q":"Hvilke tre lig. arcuata hører til pars lumbalis, og hvad danner de?","a":"**Lig. arcuatum medianum:** hesteskoformet senebue i midtlinjen, forbinder de to crura på niveau med T12; danner sammen med corpus vertebrae hiatus aorticus.\n**Lig. arcuatum mediale:** forstærkning i fascien over m. psoas major, fra corpus vertebrae L1 til proc. transversus L1.\n**Lig. arcuatum laterale:** forstærkning i fascien over m. quadratus lumborum, fra proc. transversus L1 til spidsen af costa XII.","img":"r_ax15_40-0"},{"id":"ax15-t6","t":"ax15.di","k":"text","q":"Hvordan er centrum tendineum opbygget, og hvad grænser den op til?","a":"Central, fælles aponeurose, formet som et kløverblad med 3 vinger (alae). Sammenvokset med hjertesækken. Mod lungerne er den pleurabeklædt; mod abdomen peritoneumbeklædt (sammenvokset med leveren visse steder).","img":"r_ax15_42-2"},{"id":"ax15-t7","t":"ax15.di","k":"text","q":"Hvilke tre store huller findes i diaphragma, og hvor sidder de?","a":"**Foramen venae cavae:** rundt hul til højre for midtlinjen, i centrum tendineum, niveau T8.\n**Hiatus oesophagus:** ovalt hul til venstre for midtlinjen, begrænset af fibre fra crus dextrum (sphincterfunktion), niveau T10.\n**Hiatus aorticus:** nederste, bageste åbning, begrænset bagtil af T12 og fortil af lig. arcuatum medianum.","img":"r_ax15_43-0"},{"id":"ax15-t8","t":"ax15.di","k":"text","q":"Hvad er Larreys spalte og Bochdaleks trekant?","a":"**Larreys spalte:** mellem pars sternalis og pars costalis, på hver side af proc. xiphoideus; a. epigastrica superior løber igennem.\nBochdaleks trekant: mellem pars lumbalis, pars costalis og costa XII. Begge steder er svage punkter, hvor der kan opstå hernier.","img":"r_ax15_44-0"},{"id":"ax15-t9","t":"ax15.di","k":"text","q":"Diaphragmas innervation: hvilken nerve, og hvad innerverer den?","a":"N. phrenicus (sinister et dexter), fra C3–C5 ('keeps the diaphragm alive'). Innerverer diaphragma motorisk, og sensorisk 'de 3 P'er': perikardiet, pleura, peritoneum.\nSPOT: løber på forsiden af m. scalenus anterior.","img":"r_ax15_45-2"},{"id":"ax15-t10","t":"ax15.ve","k":"text","q":"Hvordan foregår normal vejrtrækning?","a":"**Indånding:** aktiv via diaphragma ('stempel i en cylinder').\n**Udånding:** passiv via elasticitet i lungevævet ved samtidig relaksation af diaphragma.","img":"r_ax15_47-2"},{"id":"ax15-t11","t":"ax15.ve","k":"text","q":"Hvilke muskler er accessoriske inspirationsmuskler?","a":"Intercostal muskulatur (afstivning af thorax), m. sternocleidomastoideus (fikseret nakke), mm. scaleni (fikseret nakke), mm. pectorales (fikseret arm), m. serratus anterior (fikseret arm), m. serratus posterior superior.","img":"r_ax15_47-2"},{"id":"ax15-t12","t":"ax15.ve","k":"text","q":"Hvilke muskler er accessoriske ekspirationsmuskler?","a":"Abdominalmuskulaturen, m. latissimus dorsi (fikseret arm, ved hostestød), m. serratus posterior inferior.","img":"r_ax15_47-2"},{"id":"ax15-t13","t":"ax15.ve","k":"text","q":"Hvor stor en andel af hvilerespirationens inspiration står diaphragma for?","a":"Ca. 2/3. Hvilerespiration er en kombination af abdominal og thorakal respiration.","img":"r_ax15_47-2"},{"id":"ax15-t14","t":"ax15.ve","k":"text","q":"Hvad sker der med diaphragma ved inspiration og ekspiration?","a":"**Inspiration:** de stejle fibre kontraheres, og kuplen descenderer.\n**Ekspiration:** diaphragma relakserer, hjulpet af elastisk rekyl fra abdominal viscera, thoraxvæg og lungevæv.","img":"r_ax15_47-2"},{"id":"ax15-t15","t":"ax15.ve","k":"text","q":"Hvad er hovedfunktionen af mm. intercostales externi og interni under vejrtrækning?","a":"De bidrager ved henholdsvis inspiration og ekspiration, men deres primære funktion er at afstive thoraxvæggen.","img":"r_ax15_47-2"},{"id":"ax15-t16","t":"ax15.bv","k":"text","q":"Hvordan er bugvæggen afgrænset?","a":"**Opadtil:** ribbenskurvaturen. **Siderne:** flankelinjen. **Nedadtil:** crista iliaca og lyskefuren. **Midtlinjen:** crista pubica og symfysen.","img":"r_ax15_49-0"},{"id":"ax15-t17","t":"ax15.bv","k":"text","q":"Hvilke 8 lag har bugvæggen?","a":"1) Hud, 2) subcutis, 3) m. obliquus externus abdominis, 4) m. obliquus internus abdominis, 5) m. transversus abdominis, 6) fascia transversalis, 7) ekstraperitonealt bindevæv, 8) peritoneum.\nVentralt, mediant er de tre muskellag erstattet af m. rectus abdominis og linea alba. Kar og nerver løber mellem lag 4 og 5.","img":"r_ax15_49-3"},{"id":"ax15-t18","t":"ax15.bv","k":"text","q":"Hvilke 6 muskler udgør bugvæggens muskulatur, og hvordan innerveres de?","a":"M. rectus abdominis, m. pyramidalis, m. obliquus externus abdominis, m. obliquus internus abdominis, m. transversus abdominis, m. quadratus lumborum.\nInnervation: rr. anteriores, nn. spinales T6–L2.","img":"r_ax15_50-2"},{"id":"ax15-t19","t":"ax15.bv","k":"text","q":"M. rectus abdominis: udspring, insertion?","a":"**Udspring:** crista pubica, symphysis pubica. **Insertion:** ribbensbruskene costa 5–7.\nAfbrydes af 3–4 intersectiones tendineae (korte mellemsener). Omsluttes af rectusskeden. Linea alba abdominis forbinder de to rectusmuskler.","img":"r_ax15_51-4"},{"id":"ax15-t20","t":"ax15.bv","k":"text","q":"M. pyramidalis: udspring, insertion, beliggenhed?","a":"**Udspring:** crista pubica. **Insertion:** linea alba. Ligger inden for rectusskeden.","img":"r_ax15_51-5"},{"id":"ax15-t21","t":"ax15.bv","k":"text","q":"M. obliquus externus abdominis: udspring, insertion?","a":"**Udspring:** lateralfladen af de 8 nederste ribben. **Insertion:** forreste halvdel af crista iliaca, insertionsaponeurose (fortsætter i rectusskedens forreste blad) og lig. inguinale via crus mediale et laterale.\nKaldes 'yderlommerne i en jakke'.","img":"r_ax15_52-3"},{"id":"ax15-t22","t":"ax15.bv","k":"text","q":"Hvad er lig. inguinale, og hvor spænder det?","a":"Den kaudale afslutning af m. obliquus externus' aponeurose. Spænder mellem spina iliaca anterior superior og tuberculum pubicum.","img":"r_ax15_76-0"},{"id":"ax15-t23","t":"ax15.bv","k":"text","q":"M. obliquus internus abdominis: udspring, insertion?","a":"**Udspring:** fascia thoracolumbalis, forreste halvdel af crista iliaca, laterale 2/3 af lig. inguinale, 3 nederste ribbensbruske.\n**Insertion:** insertionsaponeurosen deler sig Y-formet ud for m. rectus abdominis og fortsætter i rectusskedens forreste og bagerste blad.\nKaldes 'inderlommerne i en jakke'.","img":"r_ax15_53-3"},{"id":"ax15-t24","t":"ax15.bv","k":"text","q":"Hvad er falx inguinalis og m. cremaster?","a":"**Falx inguinalis:** m. obliquus internus abdominis smelter sammen med m. transversus abdominis og hæfter på crista pubica.\n**M. cremaster:** fibre fra m. obliquus internus' underste rand fortsætter omkring funiculus spermaticus.","img":"r_ax15_79-1"},{"id":"ax15-t25","t":"ax15.bv","k":"text","q":"M. transversus abdominis: udspring, insertion?","a":"**Udspring:** fascia thoracolumbalis (det dybe blad), nederste 6 ribbensbruske (inderside), crista iliaca (forreste 2/3), lig. inguinale (laterale 1/3).\n**Insertion:** rectusskeden (over linea arcuata: bageste blad; under: forreste blad) og falx inguinalis.\nKaldes 'vesten inden under jakken'.","img":"r_ax15_54-3"},{"id":"ax15-t26","t":"ax15.bv","k":"text","q":"M. quadratus lumborum: udspring, insertion, nerver?","a":"**Udspring:** crista iliaca. **Insertion:** costa 12, proc. transversi L1–L5 (med snipper).\nDanner lig. arcuatum laterale (fra proc. transversus L1 til costa XII) som udspring for diaphragmas pars lumbalis.\nInnerveres af n. subcostalis, n. iliohypogastricus og n. ilioinguinalis.","img":"r_ax15_61-6"},{"id":"ax15-t27","t":"ax15.bv","k":"text","q":"Hvad er rectusskeden, og hvordan dannes dens forreste og bagerste blad?","a":"Består af et ventralt og et dorsalt blad, dannet ved sammenvoksning af insertionsaponeuroserne for de tre laterale bugmuskler, og omgiver m. rectus abdominis.\nM. obliquus internus' aponeurose deler sig Y-formet: forreste blad foran, bagerste blad bag rectus. M. obliquus externus' aponeurose smelter med det forreste blad (danner det ventrale blad); m. transversus abdominis' aponeurose smelter med det bagerste blad (danner det dorsale blad).","img":"r_ax15_56-1"},{"id":"ax15-t28","t":"ax15.bv","k":"text","q":"Hvordan er rectusskeden opbygget over linea arcuata?","a":"**Forreste blad:** m. obliquus externus abdominis + m. obliquus internus abdominis. **Bagerste blad:** m. transversus abdominis + m. obliquus internus abdominis.\nForbindelse over midtlinjen: linea alba abdominis (fra proc. xiphoideus til symphysis pubica, indeholder anulus umbilicalis).","img":"r_ax15_59-3"},{"id":"ax15-t29","t":"ax15.bv","k":"text","q":"Hvad sker der med rectusskeden under linea arcuata, og hvad er linea arcuata?","a":"Under linea arcuata går alle tre aponeuroser til det forreste blad. Linea arcuata er en halvmåneformet kant ca. 4 cm kaudalt for navlen, hvor det dorsale blad af rectusskeden ender.","img":"r_ax15_59-2"},{"id":"ax15-t30","t":"ax15.bv","k":"text","q":"Hvad er fascia transversalis?","a":"Fascie, der beklæder den dybe flade af m. quadratus lumborum, m. transversus abdominis, rectusskeden og m. rectus abdominis. Tykkere kaudalt for rectusskeden. Ligger mod peritoneum. Fortsætter som fascia spermatica interna i funiculus spermaticus.","img":"r_ax15_62-2"},{"id":"ax15-t31","t":"ax15.bv","k":"text","q":"Hvilken funktion har de longitudinelle fibre i bugvæggen (m. rectus abdominis)?","a":"**Punctum fixum kranielt:** symfysen løftes, bækkenet drejes, lordosen mindskes.\n**Punctum fixum kaudalt:** ventralfleksion af columna.\n**Begge:** défense musculaire. De mest laterale fibre i mm. obliqui bidrager desuden til lateralfleksion.","img":"r_ax15_63-1"},{"id":"ax15-t32","t":"ax15.bv","k":"text","q":"Hvilken funktion har de obliquinale og de cirkulære fibre i bugvæggen?","a":"**Obliquinale fibre** (mm. obliqui externus et internus): rotation blandet med fleksion og lateralfleksion (som ved skrå mavebøjninger).\n**Cirkulære fibre** (primært m. transversus abdominis): sammensnørende virkning, som bl.a. giver stabilitet af columna.\nAlle muskler bidrager til Valsalva (støtte og uddrivning af bugindhold).","img":"r_ax15_63-1"},{"id":"ax15-t33","t":"ax15.bv","k":"text","q":"Hvilke funktioner har bugpressen ud over muskelbevægelse?","a":"Tilbageholdelse af intraabdominale organer (forhindrer hernier); assisterer venøst tilbageløb gennem v. cava inferior; afstivning og kompressionsfjedring ved Valsalvas manøvre (muliggør store løft); assisterer miktion, defækation, vomitus, forceret ekspiration, défense musculaire og fødsel."},{"id":"ax15-t34","t":"ax15.bv","k":"text","q":"Hvilke arterier forsyner bugvæggen segmentært og longitudinelt?","a":"**Segmentale:** aa. intercostales posteriores et lumbales, fra aorta thoracica/abdominalis, i det neurovaskulære plan.\n**Longitudinelle, ventrale:** a. epigastrica superior (fra a. thoracica interna) og a. epigastrica inferior (fra a. iliaca externa, under linea arcuata) — bemærk anastomosen mellem dem. Bidrag fra a. circumflexa iliaca profunda og a. epigastrica superficialis."},{"id":"ax15-t35","t":"ax15.bv","k":"text","q":"Hvordan forløber bugvæggens nerver fra 7. intercostalnerve og nedefter?","a":"Fra 7. intercostalnerve bevæger nerverne sig væk fra costae og ind mellem mm. transversus og obliquus internus abdominis. T10 rammer umbilicus."},{"id":"ax15-t36","t":"ax15.ci","k":"text","q":"Hvad er canalis inguinalis, og hvor ligger den?","a":"Også kaldet 'lyskekanalen' eller 'inguinalkanalen'. En 4 cm lang spalte i den antero-laterale bugvæg, liggende over den mediale del af lig. inguinale.","img":"r_ax15_70-0"},{"id":"ax15-t37","t":"ax15.ci","k":"text","q":"Hvorfor har mænd en canalis inguinalis, og hvad sker der efter nedvandringen?","a":"I slutningen af fosterlivet vandrer testes gennem lyskekanalen fra bughulen til scrotum, fordi spermatogenesen kræver lidt lavere temperatur.\nEfter nedvandringen er kanalen gennemgangsport for ductus deferens og tilhørende kar/nerver, samlet i funiculus spermaticus.","img":"r_ax15_70-1"},{"id":"ax15-t38","t":"ax15.ci","k":"text","q":"Hvordan er canalis inguinalis hos kvinder?","a":"Ovarierne bliver i bughulen. Kvinder har en canalis inguinalis til gennemgang for det runde livmoderbånd (lig. teres uteri); lyskekanalen er derfor noget mere snæver end hos manden.\nN. ilioinguinalis løber gennem loftet, og r. genitalis n. genitofemoralis gennem kanalen hos begge køn.","img":"r_ax15_72-1"},{"id":"ax15-t39","t":"ax15.ci","k":"text","q":"Hvilke fire lag trækkes med som funiculus spermaticus, og hvad hedder de superficielt til profundt?","a":"1) M. obliquus externus abd. aponeurose → fascia spermatica externa.\n2) M. obliquus internus abd. + m. transversus abd. → fascia cremasterica (m. cremaster).\n3) Fascia transversalis → fascia spermatica interna.\n4) Peritoneum → processus vaginalis peritonei (oblitereres normalt).","img":"r_ax15_73-3"},{"id":"ax15-t40","t":"ax15.ci","k":"text","q":"Hvordan beskrives canalis inguinalis til eksamen?","a":"Med en ydre åbning (medial) og en indre åbning (lateral), samt en forvæg, bagvæg, loft og gulv.","img":"r_ax15_69-10"},{"id":"ax15-t41","t":"ax15.ci","k":"text","q":"Anulus inguinalis superficialis (ydre åbning): opbygning?","a":"Aflang trekantet åbning i m. obliquus externus' aponeurose. Begrænses af crus mediale (hæfter på forfladen af os pubis) og crus laterale (drejer rundt og under kanalen, forbindes med lig. inguinale); fibrae intercrurales sammenholder de to ben.\nFascia spermatica externa fortsætter herfra omkring funiculus spermaticus. Dækkes bagfra af falx inguinalis (hindrer direkte brok).","img":"r_ax15_76-14"},{"id":"ax15-t42","t":"ax15.ci","k":"text","q":"Anulus inguinalis profundus (indre åbning): placering og afgrænsning?","a":"Placering: omtrent mellem symphysis pubica og SIAS.\nBegrænses af fascia transversalis (eksvagineres ind i kanalen som fascia spermatica interna; medialt forstærket som lig. interfoveolare). Kranielt: udspringshovederne fra m. obliquus internus og m. transversus abdominis. Kaudalt: lig. inguinale.","img":"r_ax15_77-2"},{"id":"ax15-t43","t":"ax15.ci","k":"text","q":"Gulvet i canalis inguinalis: hvilke strukturer?","a":"Lig. inguinale (lateralt) — en forstærkning af den rendeformede aponeurose fra m. obliquus externus, fra SIAS til tuberculum pubicum.\nMedialt afgår to fibersæt: lig. reflexum (til rectusskeden) og lig. lacunare (til pecten ossis pubis, løber posteriort).","img":"r_ax15_78-3"},{"id":"ax15-t44","t":"ax15.ci","k":"text","q":"Loftet i canalis inguinalis: hvilke strukturer?","a":"De bueformede m. obliquus internus og m. transversus abdominis, som danner fællesinsertionen falx inguinalis (medialt). Herfra afspaltes fascia cremasterica (m. cremaster).","img":"r_ax15_79-1"},{"id":"ax15-t45","t":"ax15.ci","k":"text","q":"Forvæggen i canalis inguinalis: hvilke strukturer?","a":"Aponeurosen af m. obliquus externus abdominis. Helt lateralt bidrager også m. obliquus internus abdominis (som udspringer fra de laterale 2/3 af lig. inguinale).","img":"r_ax15_80-2"},{"id":"ax15-t46","t":"ax15.ci","k":"text","q":"Bagvæggen i canalis inguinalis: medial og lateral zone?","a":"**Medialt (kraftig):** falx inguinalis (fælles insertion af m. obliquus internus og m. transversus abdominis, hæfter på crista pubica) + lig. reflexum.\n**Lateralt (svag):** fascia transversalis — under bugpressen lægger fascia transversalis og lig. interfoveolare sig mod bagvæggen og hindrer indirekte brok.","img":"r_ax15_81-0"},{"id":"ax15-t47","t":"ax15.ci","k":"text","q":"Hvad er kryptorkisme?","a":"Mal-descensus testis (retentio testis): delvis eller manglende nedvandring af testis."},{"id":"ax15-t48","t":"ax15.ci","k":"text","q":"Hvad øger risikoen for lyskebrok (hernia inguinalis)?","a":"Tyngdekraft, bugpres og den skrå vinkling af kanalen — 'bugvæggens svage steder'."},{"id":"ax15-t49","t":"ax15.ci","k":"text","q":"Hvad kendetegner hernia inguinalis indirecta?","a":"Medfødt: processus vaginalis er ikke aflukket. Erhvervet: brokken presser sig gennem den ellers lukkede processus vaginalis. Pulsen (a. epigastrica inferior) mærkes medialt for brokporten.","img":"r_ax15_84-2"},{"id":"ax15-t50","t":"ax15.ci","k":"text","q":"Hvad kendetegner hernia inguinalis directa?","a":"Altid erhvervet; går gennem falx inguinalis, som er blevet svag. Pulsen mærkes lateralt for brokporten.","img":"r_ax15_86-1"},{"id":"ax15-t51","t":"ax15.ci","k":"text","q":"Hvad er en femoral hernie?","a":"En brok gennem anulus femoralis, i den mediale del af lacuna vasorum.","img":"r_ax15_87-1"},{"id":"ax15-t52","t":"ax15.bb","k":"text","q":"Hvad er bækkenbunden, og hvilke to dele består den af?","a":"Samlebetegnelse for musklerne, der lukker bækkenet nedadtil. Består af **diaphragma pelvis** (profund) og **diaphragma urogenitale** (superficiel; pensum 5. semester).","img":"r_ax15_89-6"},{"id":"ax15-t53","t":"ax15.bb","k":"text","q":"Hvilke muskler udgør diaphragma pelvis, og hvad er dets innervation og funktion?","a":"M. levator ani (m. pubococcygeus + m. iliococcygeus) og m. coccygeus.\n**Innervation:** n. pudendus fra plexus sacralis.\n**Funktion:** holder på abdominal- og pelvisorganer; giver passage under vandladning, defækation og fødsel.","img":"r_ax15_89-7"},{"id":"ax15-t54","t":"ax15.bb","k":"text","q":"M. pubococcygeus: udspring og insertion?","a":"**Udspring:** bagsiden af os pubis. **Insertion:** centrum tendineum perinei, endetarmen (som m. puborectalis, en 'billig sphincter') og lig. anococcygeum."},{"id":"ax15-t55","t":"ax15.bb","k":"text","q":"M. iliococcygeus: udspring og insertion?","a":"**Udspring:** arcus tendineus musculi levatoris ani (senebue fra os pubis til spina ischiadica). **Insertion:** lig. anococcygeum og os coccygis."},{"id":"ax15-t56","t":"ax15.bb","k":"text","q":"Hvad er levatorspalten?","a":"Spalte i midtlinjen fortil mellem levatormusklerne; passage for urethra (hos kvinden også vagina). Her forstærkes bækkenbunden yderligere af diaphragma urogenitale."},{"id":"ax15-t57","t":"ax15.bb","k":"text","q":"Hvad er m. puborectalis?","a":"Den del af m. pubococcygeus, der går slyngeformet bag om rectum og medfører et lille knæk på denne, som fungerer som en 'billig sphincter'."},{"id":"ax15-t58","t":"ax15.bb","k":"text","q":"M. coccygeus: udspring, insertion og relation til lig. sacrospinale?","a":"Tynd, flad muskel, indvævet i lig. sacrospinale (ligger anteromedialt for det). Spænder mellem spina ischiadica og sidekanten af os sacrum."},{"id":"ax15-t59","t":"ax15.bb","k":"text","q":"Hvad er formålet med bækkenbunden samlet set?","a":"At holde abdominal- og bækkenviscera inde i kroppen, og at give passage under vandladning, defækation og fødsel."},{"id":"ax15-o60","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":0,"a":"Symphysis pubica","n":"Forreste sammenføjning af de to os pubis."},{"id":"ax15-o61","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":1,"a":"Levatorspalten","n":"Spalte i midtlinjen fortil mellem levatormusklerne; passage for urethra."},{"id":"ax15-o62","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":2,"a":"Urethra","n":"Løber gennem levatorspalten."},{"id":"ax15-o63","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":3,"a":"Vagina","n":"Løber gennem levatorspalten hos kvinden, sammen med urethra."},{"id":"ax15-o64","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":4,"a":"M. obturatorius internus","n":"Muskel lateralt for bækkenbunden, dækket af fascie."},{"id":"ax15-o65","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":5,"a":"Centrum tendineum (perinei)","n":"Senecentrum i perineum, hvor bl.a. m. pubococcygeus insererer."},{"id":"ax15-o66","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":6,"a":"Spina ischiadica","n":"Landemærke; udspring for m. coccygeus / lig. sacrospinale."},{"id":"ax15-o67","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":7,"a":"Promontorium","n":"Forreste, øverste kant af os sacrum."},{"id":"ax16-t1","t":"ax16.nk","k":"text","q":"Hvordan skal kraniet betragtes, og hvad beskytter det?","a":"Som én funktionel helhed, frem for selvstændige knogler. Yder ossøs beskyttelse af hjernen, de højere sanseorganer, og de øvre dele af luftvejene og fordøjelseskanalen.","img":"r_ax16_1-3"},{"id":"ax16-t2","t":"ax16.nk","k":"text","q":"Hvilken ledtype forbinder kraniets knogler, og hvad sker der med alderen?","a":"Uægte ledforbindelser (suturer eller synchondroser). I voksenalderen udviskes grænserne og forbener; ved fuld forbening kaldes grænserne synostoser.","img":"r_ax16_5-0"},{"id":"ax16-t3","t":"ax16.nk","k":"text","q":"Hvad omslutter hjernekassen, hvor hviler den, og hvilke 6 knogler danner den?","a":"Omslutter som en beskyttende kapsel hjernen og høre-ligevægtsorganet. Hviler på atlas (art. atlantooccipitalis) i forlængelse af columna vertebralis.\n**Uparrede:** os frontale, os occipitale, os sphenoidale, os ethmoidale. **Parrede:** os parietale, os temporale.\nOpdeles i theca cranii og basis cranii.","img":"r_ax16_8-0"},{"id":"ax16-t4","t":"ax16.nk","k":"text","q":"Os frontale (pandebenet): hvordan er den inddelt?","a":"Pars squamosa, pars orbitalis og pars nasalis.","img":"r_ax16_9-1"},{"id":"ax16-t5","t":"ax16.nk","k":"text","q":"Hvilke strukturer findes på os frontale ud over de tre hoveddele?","a":"Pars nasalis og pars orbitalis (den vandrette del mod øjenhulen), incisura/foramen supraorbitale (passage for n. og vasa supraorbitalia), incisura frontalis, apertura sinus frontalis og fossa glandulae lacrimalis (til tåre­kirtlen).","img":"r_ax16_9-0"},{"id":"ax16-t6","t":"ax16.nk","k":"text","q":"Os parietale (issebenet): hvad kendetegner den?","a":"Udgør det store og flade loft i kraniekassen.","img":"r_ax16_10-4"},{"id":"ax16-t7","t":"ax16.nk","k":"text","q":"Os occipitale (nakkebenet): hvad består den af?","a":"Pars basilaris (ventralt), partes laterales (lateralt) og squama occipitalis (dorsalt).","img":"r_ax16_11-0"},{"id":"ax16-t8","t":"ax16.nk","k":"text","q":"Hvilke fremspring og strukturer har os occipitale?","a":"Protuberantiae occipitales externa et interna, condyli occipitales, cristae occipitales externa et interna, lineae nuchales superior et inferior, samt foramen magnum.","img":"r_ax16_11-1"},{"id":"ax16-t9","t":"ax16.nk","k":"text","q":"Os temporale (tindingebenet): hvordan er den inddelt, og hvilke fremspring har den?","a":"**Inddeles i:** pars squamosa, pars petrosa, pars tympanica.\n**Fremspring:** proc. mastoideus, proc. styloideus.","img":"r_ax16_12-1"},{"id":"ax16-t10","t":"ax16.nk","k":"text","q":"Os sphenoidale (kilebenet): hvordan er den inddelt, og hvilke fremspring har den?","a":"**Inddeles i:** corpus, alae majores, alae minores.\n**Fremspring:** procc. pterygoidei, sinus sphenoidalis, fissura orbitalis superior.","img":"r_ax16_13-1"},{"id":"ax16-t11","t":"ax16.nk","k":"text","q":"Os ethmoidale (sibenet): hvad består den af?","a":"Crista galli, lamina perpendicularis, labyrinthus ethmoidalis (indeholder cellulae ethmoidales) og lamina cribrosa.","img":"r_ax16_14-1"},{"id":"ax16-t12","t":"ax16.nk","k":"text","q":"Theca cranii ('kraniekalotten' eller kalvariet): hvilke knogledele danner den?","a":"Pars squamosa ossis frontalis, os parietale, squama occipitalis, pars squamosa ossis temporalis og ala major ossis sphenoidalis.","img":"r_ax16_17-0"},{"id":"ax16-t13","t":"ax16.nk","k":"text","q":"Hvilke strukturer bærer theca cranii's indvendige flade?","a":"Sulcus sinus sagittalis superioris, crista frontalis, foveolae granulares.","img":"r_ax16_18-3"},{"id":"ax16-t14","t":"ax16.nk","k":"text","q":"Hvilke strukturer bærer theca cranii's udvendige flade?","a":"Frons (fortil), vertex (øverst), occiput (bagerst), tubera frontalia et parietalia, arcus superciliaris og margo supraorbitalis, glabella, lineae temporales superior et inferior, samt suturerne sagittalis, coronalis og lambdoidea.","img":"r_ax16_17-1"},{"id":"ax16-t15","t":"ax16.nk","k":"text","q":"Hvordan er hjernekassens knogler opbygget histologisk?","a":"Som flade knogler med 2 lag substantia compacta (laminae externa et interna) og mellemliggende substantia spongiosa (diploë), som indeholder rød knoglemarv.","img":"r_ax16_18-3"},{"id":"ax16-t16","t":"ax16.nk","k":"text","q":"Hvad er vv. diploicae og vv. emissariae?","a":"**Vv. diploicae:** ligger i diploë. **Vv. emissariae:** venenetværk på ydersiden af kraniet, som forbinder dette med hjernens venøse sinusser (der løber som en opspaltning af dura mater).","img":"r_ax16_18-4"},{"id":"ax16-t17","t":"ax16.nk","k":"text","q":"Hvilke 6 fontaneller findes hos et spædbarn, og hvornår lukker de?","a":"**Fonticulus anterior** ('den firkantede', størst, svarer til bregma): lukker efter 2 år.\n**Fonticulus posterior** ('den trekantede', svarer til lambda): lukker efter 2–3 måneder.\n**Fonticulus sphenoidalis** (anterolateralis, svarer til pterion): lukker efter 2–3 måneder.\n**Fonticulus mastoideus** (posterolateralis, over proc. mastoideus): lukker efter 1 år.","img":"r_ax16_32-2"},{"id":"ax16-t18","t":"ax16.nk","k":"text","q":"Hvad er fontanellernes funktion?","a":"Adaptation til fødselskanalen, og palpation af fonticuli (pulsation) bruges til lokalisation af hovedet under fødslen.","img":"r_ax16_32-3"},{"id":"ax16-t19","t":"ax16.bc","k":"text","q":"Hvordan inddeles kraniebunden overordnet?","a":"**Basis cranii externa:** forreste og bageste del. **Basis cranii interna:** fossa cranii anterior, media og posterior.","img":"r_ax16_21-0"},{"id":"ax16-t20","t":"ax16.bc","k":"text","q":"Hvilke strukturer fra os occipitale findes på basis cranii externa?","a":"Foramen magnum, condyli occipitales, crista og protuberantia occipitalis externa, tuberculum pharyngeum, canalis n. hypoglossi.","img":"r_ax16_21-0"},{"id":"ax16-t21","t":"ax16.bc","k":"text","q":"Hvilke strukturer fra os sphenoidale findes på basis cranii externa?","a":"Procc. pterygoidei (laminae medialis et lateralis, fossa pterygoidea og hamulus pterygoideus), foramen ovale, foramen spinosum.","img":"r_ax16_21-0"},{"id":"ax16-t22","t":"ax16.bc","k":"text","q":"Hvilke strukturer fra os temporale findes på basis cranii externa?","a":"Processus zygomaticus, fossa mandibularis, tuberculum articulare, procc. styloideus et mastoideus, foramen stylomastoideum, foramen jugulare, canalis caroticus.","img":"r_ax16_21-0"},{"id":"ax16-t23","t":"ax16.bc","k":"text","q":"Hvordan er basis cranii interna inddelt, og hvad dannes fossa cranii anterior af?","a":"Inddeles i fossa cranii anterior, media og posterior.\nFossa cranii anterior dannes af pars orbitalis ossis frontalis og alae minores ossis sphenoidalis.","img":"r_ax16_21-0"},{"id":"ax16-t24","t":"ax16.bc","k":"text","q":"Hvilke fremspring og strukturer findes i fossa cranii anterior?","a":"Crista galli og lamina cribrosa, canalis opticus og sulcus prechiasmaticus, proc. clinoideus anterior.","img":"r_ax16_21-0"},{"id":"ax16-t25","t":"ax16.bc","k":"text","q":"Hvilke fremspring og strukturer findes i fossa cranii media?","a":"Sella turcica (med fossa hypophysialis), dorsum sellae med proc. clinoideus posterior, fissura orbitalis superior, foramen rotundum, foramina ovale et spinosum, foramen lacerum (udfyldt af brusk), canalis caroticus med sulcus caroticus.","img":"r_ax16_21-0"},{"id":"ax16-t26","t":"ax16.bc","k":"text","q":"Hvilke fremspring og strukturer findes i fossa cranii posterior?","a":"Clivus (fra dorsum sellae til foramen magnum), foramen jugulare, porus og meatus acusticus internus.","img":"r_ax16_21-0"},{"id":"ax16-t27","t":"ax16.vk","k":"text","q":"Hvilke 10 knogler danner ansigtsskelettet (viscerokranium)?","a":"Os frontale (en del af denne), os nasale, maxilla, os lacrimale, os ethmoidale, os zygomaticum, concha nasalis inferior, vomer, os palatinum, mandibula. (Os hyoideum regnes undertiden med.)","img":"r_ax16_27-3"},{"id":"ax16-t28","t":"ax16.vk","k":"text","q":"Maxilla: hvilke dele har den, og hvad danner den sammen med nabo­knoglerne?","a":"Corpus maxillae (med sinus maxillaris), proc. zygomaticus, proc. frontalis, proc. palatinus, proc. alveolaris.\nDanner sammen med modsidige maxilla og ossa nasales apertura piriformis og spina nasalis anterior.","img":"r_ax16_28-1"},{"id":"ax16-t29","t":"ax16.vk","k":"text","q":"Hvilke kanaler og kanter findes på maxilla?","a":"Foramen infraorbitale → canalis infraorbitalis. Crista lacrimalis anterior → margo infraorbitale. Tuber maxillae med foramina alveolaria.","img":"r_ax16_28-1"},{"id":"ax16-t30","t":"ax16.vk","k":"text","q":"Os zygomaticum: hvilke processus har den?","a":"Proc. frontalis og proc. temporalis (danner arcus zygomaticus sammen med proc. zygomaticus ossis temporalis).","img":"r_ax16_29-1"},{"id":"ax16-t31","t":"ax16.vk","k":"text","q":"Os nasale, os palatinum, concha nasalis inferior og vomer: hvad kendetegner dem kort?","a":"**Os nasale:** danner den kranielle afgrænsning af apertura piriformis.\n**Os palatinum:** lamina horizontalis og laminae perpendiculares.\n**Concha nasalis inferior** og **vomer**: egne selvstændige knogler i næsehulen.","img":"r_ax16_29-1"},{"id":"ax16-t32","t":"ax16.vk","k":"text","q":"Mandibula: hvilke strukturer har corpus mandibulae?","a":"Protuberantia mentalis med tuberculi mentales og foramen mentale, spina mentalis, linea mylohyoidea (deler foveae sublingualis et submandibularis), arcus alveolaris med alveoli dentales.","img":"r_ax16_30-1"},{"id":"ax16-t33","t":"ax16.vk","k":"text","q":"Mandibula: hvilke strukturer har ramus mandibulae?","a":"Angulus mandibulae, tuberositas masseterica, foramen mandibulae → canalis mandibulae, lingula mandibulae, proc. coronoideus et condylaris (adskilt af incisura mandibulae), samt caput et collum mandibulae og fovea pterygoidea.","img":"r_ax16_30-2"},{"id":"ax16-t34","t":"ax16.vk","k":"text","q":"Os hyoideum (tungebenet): hvor ligger den, og hvad er dens funktion?","a":"Ligger mellem mandibula og strubehovedet, ophængt i proc. styloideus via lig. stylohyoideum. Tjener til fæste for muskler til mundhule, tunge, strubehoved, prætrachealregion, strubelåg og svælg.\nInddeles i corpus ossis hyoidei, cornua majora og cornua minora.","img":"r_ax16_31-3"},{"id":"ax16-t35","t":"ax16.hm","k":"text","q":"Hvordan er halsen afgrænset, og hvilke regioner inddeles den i?","a":"**Kranielt:** linea nuchalis superior – proc. mastoideus – ramus, angulus et basis mandibulae. **Kaudalt:** incisura jugularis – clavicula – linje fra acromion til proc. spinosus vertebrae prominentis (C7).\n**Regioner:** regio cervicalis anterior, regio sternocleidomastoidea, regio cervicalis lateralis, regio cervicalis posterior.","img":"r_ax16_34-3"},{"id":"ax16-t36","t":"ax16.hm","k":"text","q":"Hvordan inddeles halsens muskler overordnet i tre grupper?","a":"**De overfladiske halsmuskler** (2 stk.). **De dybe halsmuskler** (7 stk.): prævertebralmusklerne (4) + skalenermusklerne (3). **Tungebensmusklerne** (8 stk.): suprahyoide (4) + infrahyoide (4).","img":"r_ax16_35-0"},{"id":"ax16-t37","t":"ax16.hm","k":"text","q":"Platysma: udspring, insertion, funktion?","a":"**Udspring:** spredte fibre fra huden, subcutis og fascien over mm. pectoralis major et deltoideus. **Insertion:** basis mandibulae og videre til munden.\n**Funktion:** mundåbning, mimik (rædsel/overraskelse).","img":"r_ax16_36-2"},{"id":"ax16-t38","t":"ax16.hm","k":"text","q":"M. sternocleidomastoideus: udspring og insertion?","a":"**Udspring:** caput sternale fra forfladen af manubrium sterni, caput claviculare fra extremitas sternalis claviculae. **Insertion:** lateralt på proc. mastoideus og linea nuchalis superior (snoede fibre).","img":"r_ax16_37-0"},{"id":"ax16-t39","t":"ax16.hm","k":"text","q":"M. sternocleidomastoideus: funktion?","a":"Bilateral kontraktion: ventralflekterer hovedet. Unilateral kontraktion: lateralflekterer hovedet og roterer det til modsatte side. Desuden auxiliær inspirationsmuskel. Afgrænser fossae supraclaviculares major et minor.","img":"r_ax16_37-0"},{"id":"ax16-t40","t":"ax16.hm","k":"text","q":"Hvilke fire muskler udgør prævertebralgruppen?","a":"M. longus capitis, m. longus colli, m. rectus capitis anterior, m. rectus capitis lateralis.","img":"r_ax16_48-2"},{"id":"ax16-t41","t":"ax16.hm","k":"text","q":"M. longus capitis og m. longus colli: udspring og insertion?","a":"**M. longus capitis:** udspring tubercula anteriora proc. transversi C3–6, insertion pars basilaris ossis occipitalis.\n**M. longus colli:** har en obliquinal del (superior og inferior) og en vertikal del; udspring ventralsiden af corpus C3–T3, insertion ventrale del af C1–C6 (tuberculum anterius atlantis).","img":"r_ax16_48-2"},{"id":"ax16-t42","t":"ax16.hm","k":"text","q":"M. rectus capitis anterior og lateralis: udspring, insertion, samlet funktion?","a":"**Anterior:** udspring massa lateralis (atlas), insertion pars basilaris ossis occipitalis.\n**Lateralis:** udspring proc. transversus atlantis, insertion proc. jugularis (bag foramen jugulare).\n**Samlet funktion:** fleksion af halscolumna.","img":"r_ax16_49-3"},{"id":"ax16-t43","t":"ax16.hm","k":"text","q":"Hvilke tre muskler udgør skalenergruppen, og hvad er deres udspring/insertion?","a":"**M. scalenus anterior:** tubercula anteriora proc. transversi C3–6 → costa I, ventralt for sulcus a. subclaviae.\n**M. scalenus medius:** tubercula posteriora proc. transversi C1–7 → costa I, dorsalt for sulcus a. subclaviae.\n**M. scalenus posterior:** tubercula posteriora proc. transversi C4–6 → costa II, øverste flade.","img":"r_ax16_50-3"},{"id":"ax16-t44","t":"ax16.hm","k":"text","q":"Skalenerporten: hvad danner den, og hvad passerer/passerer ikke igennem?","a":"Dannes af m. scalenus anterior, m. scalenus medius og costa I.\n**Passerer:** plexus brachialis, n. phrenicus, a. subclavia. **Passerer ikke:** v. subclavia.","img":"r_ax16_51-3"},{"id":"ax16-t45","t":"ax16.hm","k":"text","q":"Hvad er skalenermuskulaturens samlede funktion?","a":"Fungerer som stabilisatorer for halscolumna ('bardunsæt'). Giver lateralfleksion og forceret inspiration."},{"id":"ax16-t46","t":"ax16.hy","k":"text","q":"Hvilke fire muskler udgør de suprahyoide tungebensmuskler?","a":"M. digastricus, m. stylohyoideus, m. mylohyoideus, m. geniohyoideus.","img":"r_ax16_39-4"},{"id":"ax16-t47","t":"ax16.hy","k":"text","q":"M. digastricus: opbygning, udspring, insertion og funktion?","a":"To dele: venter anterior et posterior. **Udspring:** medialsiden af proc. mastoideus. **Insertion:** via en mellemsene på cornu minus ossis hyoidei, til indersiden af corpus mandibulae (på hver side af spina mentalis).\n**Funktion** afhænger af punctum fixum: mandibula fikseret → løfter os hyoideum; os hyoideum fikseret → sænker mandibula (åbner munden).","img":"r_ax16_40-4"},{"id":"ax16-t48","t":"ax16.hy","k":"text","q":"M. stylohyoideus: forløb, og hvad perforerer den?","a":"Forløber mellem proc. styloideus og corpus/cornu minus ossis hyoidei. Perforeres af tendo m. digastrici.","img":"r_ax16_40-4"},{"id":"ax16-t49","t":"ax16.hy","k":"text","q":"M. mylohyoideus: udspring, insertion, funktion?","a":"Danner bunden i mundhulen (diaphragma oris). **Udspring:** linea mylohyoidea mandibulae. **Insertion:** median senestribe fra mandibula til corpus ossis hyoidei og forreste del af corpus ossis hyoidei. **Funktion:** presser tungen opad.","img":"r_ax16_41-4"},{"id":"ax16-t50","t":"ax16.hy","k":"text","q":"M. geniohyoideus: udspring, insertion, funktion?","a":"**Udspring:** spina mentalis. **Insertion:** corpus ossis hyoidei. **Funktion:** trækker os hyoideum frem, eller åbner munden.","img":"r_ax16_41-4"},{"id":"ax16-t51","t":"ax16.hy","k":"text","q":"Hvilke fire muskler udgør de infrahyoide tungebensmuskler, og hvad er deres samlede funktion?","a":"M. sternohyoideus og m. omohyoideus (superficielt), m. sternothyroideus og m. thyrohyoideus (profundt).\n**Funktion:** sænker os hyoideum og strubehovedet under respiration og synkning; kan trække os hyoideum frem under tale/sang; fikserer os hyoideum, så de suprahyoide muskler kan bevæge mandibula.","img":"r_ax16_42-3"},{"id":"ax16-t52","t":"ax16.hy","k":"text","q":"M. sternohyoideus og m. omohyoideus: udspring og insertion?","a":"**M. sternohyoideus:** bagfladen af manubrium sterni og clavicula → centralt på corpus ossis hyoidei.\n**M. omohyoideus** (venter superior et inferior): margo superior scapulae (tæt ved incisura scapulae) → lateralt på corpus ossis hyoidei; nedbundet af lamina media fasciae cervicalis til clavicula. Afgrænser opadtil trigonum caroticum sammen med m. SCM og venter posterior m. digastrici.","img":"r_ax16_43-3"},{"id":"ax16-t53","t":"ax16.hy","k":"text","q":"M. sternothyroideus og m. thyrohyoideus: udspring og insertion?","a":"**M. sternothyroideus:** inferiort og profundt for m. sternohyoideus, fra bagfladen af manubrium sterni og cartilago costalis I → linea obliqua på cartilago thyroidea.\n**M. thyrohyoideus:** fortsættelsen af m. sternothyroideus, fra linea obliqua på cartilago thyroidea → cornu majus og tilstødende corpus ossis hyoidei.","img":"r_ax16_44-3"},{"id":"ax16-t54","t":"ax16.hf","k":"text","q":"Hvilke fire fascielag/-skeder udgør halsens fascieforhold (transversalsnit C6)?","a":"Fascia cervicalis' lamina superficialis, lamina pretrachealis (media), lamina prevertebralis (profunda), samt vagina carotis.","img":"r_ax16_55-4"},{"id":"ax16-t55","t":"ax16.hf","k":"text","q":"Lamina superficialis: udbredelse og forhold til musklerne?","a":"Strækker sig i hele halsregionen. Spaltes omkring mm. sternocleidomastoideus et trapezius. Ligger profundt for platysma.","img":"r_ax16_55-4"},{"id":"ax16-t56","t":"ax16.hf","k":"text","q":"Lamina pretrachealis (media): udbredelse og funktion?","a":"Beklæder halsviscera og de infrahyoide muskler som en subdivision af fascien. Strækker sig fra os hyoideum til sternum, lateralt til mm. omohyoidei og posteriort omkring pharynx og oesophagus. Forstærket som linea alba colli, mediant ventralt på halsen.","img":"r_ax16_55-4"},{"id":"ax16-t57","t":"ax16.hf","k":"text","q":"Lamina prevertebralis (profunda): udbredelse og funktion?","a":"Dækker de dybe hals- og nakkemuskler (fra basis cranii til T3). Danner skede for a. subclavia og plexus brachialis.","img":"r_ax16_55-4"},{"id":"ax16-t58","t":"ax16.hf","k":"text","q":"Vagina carotis: hvordan dannes den, og hvad omslutter den?","a":"Dannes fra de tre andre fascielag. Omslutter carotiderne, plus n. vagus (kranienerve X).","img":"r_ax16_55-4"},{"id":"ax16-t59","t":"ax16.pc","k":"text","q":"Plexus cervicalis: hvilke rødder danner den, og hvad forsyner den?","a":"Rami ventrales C1–C4 (med tilskud fra C5).\n**Forsyning:** halsmuskulatur, diaphragma, samt kutant på forside og lateralt på halsen.","img":"r_ax16_57-0"},{"id":"ax16-t60","t":"ax16.pc","k":"text","q":"Hvordan inddeles plexus cervicalis' grene?","a":"**Motoriske grene:** ansa cervicalis, n. phrenicus.\n**Kutane grene:** n. occipitalis minor, n. auricularis magnus, n. transversus colli, nn. supraclaviculares.","img":"r_ax16_57-0"},{"id":"ax16-t61","t":"ax16.pc","k":"text","q":"Ansa cervicalis: opbygning og forløb?","a":"Dannes af en superior rod (C1) og en inferior rod (C2–C3). Den superiore rod inkorporeres i n. hypoglossus indtil den krydser a. carotis interna, hvorefter den descenderer og møder den inferiore rod på forsiden af v. jugularis interna. Danner en U-formet slynge.","img":"r_ax16_59-1"},{"id":"ax16-t62","t":"ax16.pc","k":"text","q":"Ansa cervicalis: hvilke muskler innerverer den?","a":"M. omohyoideus, m. sternohyoideus, m. sternothyroideus. Tråde til mm. thyrohyoideus og geniohyoideus følger i stedet n. hypoglossus."},{"id":"ax16-t63","t":"ax16.pc","k":"text","q":"Hvordan innerveres de prævertebrale muskler og skalenermusklerne?","a":"Direkte af små, ubenævnte grene fra de cervikale rami ventrales."},{"id":"ax16-t64","t":"ax16.pc","k":"text","q":"N. phrenicus: segment, innervation og huskeregel?","a":"**Segment:** C3, C4, C5 ('keeps the diaphragm alive'). **Motorisk:** diaphragma (over- og undersiden). **Sensorisk** ('de tre P'er'): pleura, pericardium, peritoneum.","img":"r_ax16_60-0"},{"id":"ax16-t65","t":"ax16.pc","k":"text","q":"N. phrenicus: forløb på halsen?","a":"På forfladen af m. scalenus anterior, dækket af m. omohyoideus, v. jugularis interna og m. sternocleidomastoideus. Videre gennem apertura thoracis superior mellem a. og v. subclavia.","img":"r_ax16_60-0"},{"id":"ax16-t66","t":"ax16.pc","k":"text","q":"N. phrenicus: hvordan forløber den forskelligt højre og venstre?","a":"**Højre:** langs v. brachiocephalica og v. cava superior, højre om hjertet, til foramen venae cavae.\n**Venstre:** mellem a. carotis communis og a. subclavia, ventralt for n. vagus og arcus aortae, venstre om hjertet, perforerer diaphragma ved apex cordis.","img":"r_ax16_60-3"},{"id":"ax16-t67","t":"ax16.pc","k":"text","q":"Hvor ses plexus cervicalis' kutane grene samlet, og hvad kaldes stedet?","a":"Ved bagkanten af m. sternocleidomastoideus — kaldet punctum nervosum."},{"id":"ax16-t68","t":"ax16.pc","k":"text","q":"Hvilke ascenderende kutane grene (C2–C3) afgiver plexus cervicalis?","a":"**N. occipitalis minor:** fra bagkanten af m. SCM, løber bag om det ydre øre, kutan innervation lateralt på baghovedet.\n**N. auricularis magnus:** snor sig om m. SCM, løber vertikalt, deler sig til det ydre øre og regio parotideomasseterica.\n**N. transversus colli:** løber om bagkanten af m. SCM, krydser ind foran, deler sig i en ascenderende og descenderende gren; kutan innervation fra basis mandibulae til incisura jugularis.","img":"r_ax16_61-0"},{"id":"ax16-t69","t":"ax16.pc","k":"text","q":"Hvilken descenderende kutan gren (C3–C4) afgiver plexus cervicalis, og hvad innerverer den?","a":"Nn. supraclaviculares, som løber i et medialt, intermediært og lateralt sæt under platysma. Innerverer kutant et lille stykke under clavicula og acromion.","img":"r_ax16_61-0"},{"id":"ax16-o70","t":"ax16.nk","k":"occ","img":"sphenoidale","boxes":[[46.452,68.33,6.185,2.531],[11.816,14.1,8.724,2.603],[2.995,61.678,8.757,3.109],[1.27,90.058,20.085,3.145],[8.008,18.294,5.013,3.181],[85.449,20.969,1.432,3.254],[14.225,21.945,2.604,1.591],[20.41,23.174,1.921,1.193],[10.482,23.861,3.711,2.386],[21.647,24.657,1.204,1.265],[86.133,27.223,2.702,1.88],[10.938,27.404,2.539,2.133],[28.613,27.91,2.018,2.205],[69.727,28.019,1.172,1.121],[64.909,28.959,2.148,2.965],[61.979,35.213,2.441,3.3 oxes":[[0.944,10.059,16.211,2.799],[8.105,80.078,11.784,2.799],[60.645,89.909,12.174,2.799],[42.253,67.155,15.104,2.832],[51.107,9.603,12.988,3.809],[20.28,34.049,3.646,1.53],[7.194,42.318,3.613,1.4],[55.143,46.549,1.79,1.204],[18.555,48.047,2.669,3.809],[83.789,52.474,6.217,7.878],[39.323,58.529,2.344,1.4],[63.737,59.082,3.288,1.53],[71.582,67.285,2.376,2.311],[20.15,70.345,2.897,4.329],[73.633,72.396,4.883,2.604],[77.409,74.479,1.921,1.139],[80.566,81.478,11.849,2.832],[28.841,95.117,42.35,4.232]],"target":1,"a":"Pars lateralis","n":"Lateral del af os occipitale, med condylus occipitalis."},{"id":"ax16-o85","t":"ax16.nk","k":"occ","img":"occipitale","boxes":[[0.944,10.059,16.211,2.799],[8.105,80.078,11.784,2.799],[60.645,89.909,12.174,2.799],[42.253,67.155,15.104,2.832],[51.107,9.603,12.988,3.809],[20.28,34.049,3.646,1.53],[7.194,42.318,3.613,1.4],[55.143,46.549,1.79,1.204],[18.555,48.047,2.669,3.809],[83.789,52.474,6.217,7.878],[39.323,58.529,2.344,1.4],[63.737,59.082,3.288,1.53],[71.582,67.285,2.376,2.311],[20.15,70.345,2.897,4.329],[73.633,72.396,4.883,2.604],[77.409,74.479,1.921,1.139],[80.566,81.478,11.849,2.832],[28.841,95.117,42.35,4.232]],"target":2,"a":"Pars basilaris","n":"Ventrale del af os occipitale, foran foramen magnum."},{"id":"ax16-o86","t":"ax16.nk","k":"occ","img":"occipitale","boxes":[[0.944,10.059,16.211,2.799],[8.105,80.078,11.784,2.799],[60.645,89.909,12.174,2.799],[42.253,67.155,15.104,2.832],[51.107,9.603,12.988,3.809],[20.28,34.049,3.646,1.53],[7.194,42.318,3.613,1.4],[55.143,46.549,1.79,1.204],[18.555,48.047,2.669,3.809],[83.789,52.474,6.217,7.878],[39.323,58.529,2.344,1.4],[63.737,59.082,3.288,1.53],[71.582,67.285,2.376,2.311],[20.15,70.345,2.897,4.329],[73.633,72.396,4.883,2.604],[77.409,74.479,1.921,1.139],[80.566,81.478,11.849,2.832],[28.841,95.117,42.35,4.232]],"target":3,"a":"Foramen magnum","n":"Det store hul, hvorigennem medulla oblongata passerer."},{"id":"ax17-t1","t":"ax17.tmj","k":"text","q":"Art. temporomandibularis: ledtype, ledhoved og ledskål?","a":"Ægte (synovialt), delt, kombineret hængsel-glideled.\n**Ledhoved:** caput mandibulae (fibrøs brusk) på proc. condylaris mandibulae.\n**Ledskål:** fossa mandibularis og tuberculum articulare (fibrøs brusk) på os temporale.","img":"r_ax17_6-1"},{"id":"ax17-t2","t":"ax17.tmj","k":"text","q":"Hvorfor har kæbeleddet fibrøs brusk i stedet for hyalin brusk?","a":"Fibrøs brusk tåler mere slid, før der ses degeneration — nødvendigt i kæbeleddet, hvor man kan tygge med stor kraft (op til 500 N belastning på caput mandibulae og fossa mandibularis).","img":"r_ax17_7-2"},{"id":"ax17-t3","t":"ax17.tmj","k":"text","q":"Hvordan opdeler discus articularis ledhulen, og hvad er dens funktion?","a":"Opdeler leddet i et discotemporalt og et discocondylært ledkammer. Discus er tilpasset ledfladerne og sidder tæt op af caput mandibulae, som den følger.\n**Funktion:** ledfladeadaptation (gør ledhoved og -skål mere kongruente, som menisci i knæet), nedsætter friktion og bidrager med smørelse (synovia).","img":"r_ax17_7-2"},{"id":"ax17-t4","t":"ax17.tmj","k":"text","q":"Hvordan er den fibrøse kapsel forskellig discotemporalt og discocondylært?","a":"**Discotemporalt:** slap for- og bagtil — leddet kan luksere uden kapselbristning.\n**Discocondylært:** meget stram.","img":"r_ax17_7-2"},{"id":"ax17-t5","t":"ax17.tmj","k":"text","q":"Hvilke ligamenter har art. temporomandibularis, og hvilken betydning har de for stabiliteten?","a":"**Lig. laterale** (fungerer som kollateralt ligament): begrænser bagudglidning, men ikke fremadglidning.\n**Lig. sphenomandibulare:** mellem spina ossis sphenoidalis (lige bag foramen spinosum) og lingula mandibulae.\n**Lig. stylomandibulare:** mellem proc. styloideus og indersiden af angulus mandibulae.\nDe to sidstnævnte har ingen betydning for stabiliteten — den sikres af de omkringliggende muskler (som i skulderleddet).","img":"r_ax17_8-2"},{"id":"ax17-t6","t":"ax17.tmj","k":"text","q":"Hvilke tre anatomiske bevægelser kan kæbeleddet lave?","a":"Vinkelbevægelser (op/ned), glidebevægelser (frem/tilbage), sidebevægelser (side til side). Udføres sjældent isoleret, men kombineres.","img":"r_ax17_9-0"},{"id":"ax17-t7","t":"ax17.tmj","k":"text","q":"Åbne-/lukkebevægelsen: hvor foregår glid og vinkelbevægelse, og hvor stort er udslaget?","a":"Symmetrisk bevægelse, en blanding af glide- og vinkelbevægelse. Glid foregår i det øvre kammer (fremad, nedad). Vinkelbevægelsen sker i det nedre kammer omkring en tværstillet akse gennem caput.\n30° ved højt gab; 2–4° ved normal tale (intet glid).","img":"r_ax17_9-0"},{"id":"ax17-t8","t":"ax17.tmj","k":"text","q":"Malebevægelsen: hvad sker der, og hvorfor er den nødvendig?","a":"Asymmetrisk bevægelse: det ene ledhoved forbliver i fossa mandibularis og roterer, mens det andet glider frem på tuberculum articulare. Nødvendig for at 'rive' fibrøs føde (fx kød) fra hinanden, ved at lade tandrækkerne glide forbi hinanden i stedet for at mødes direkte.","img":"r_ax17_9-0"},{"id":"ax17-t9","t":"ax17.tm","k":"text","q":"Hvilke fire tyggemuskler findes, og hvilken nerve innerverer dem?","a":"M. masseter, m. temporalis, m. pterygoideus lateralis, m. pterygoideus medialis. Innerveres af n. mandibularis fra n. trigeminus (1. branchiebue).","img":"r_ax17_11-2"},{"id":"ax17-t10","t":"ax17.tm","k":"text","q":"M. masseter: udspring, insertion, funktion?","a":"**Udspring:** pars superficialis fra forreste 2/3 af arcus zygomaticus, pars profunda fra bageste 1/3.\n**Insertion:** tuberositas masseterica og ramus mandibulae (mere superiort).\n**Funktion:** kraftig mundlukker.\nDeler fascie med gl. parotidea (fascia parotideomasseterica); ductus parotideus krydser musklen og er palpabel ved kontraktion.","img":"r_ax17_13-3"},{"id":"ax17-t11","t":"ax17.tm","k":"text","q":"M. temporalis: udspring, insertion, funktion?","a":"**Udspring:** fossa temporalis op til linea temporalis inferior, samt fascia temporalis.\n**Insertion:** proc. coronoideus og forkanten af ramus mandibulae.\n**Funktion:** kraftig mundlukker og retraktor — de vertikale, obliquinale og horisontale fiberdele fungerer optimalt som mundlukker.","img":"r_ax17_13-3"},{"id":"ax17-t12","t":"ax17.tm","k":"text","q":"M. pterygoideus lateralis: udspring, insertion, funktion?","a":"**Udspring:** caput superius fra crista og facies infratemporalis ossis sphenoidalis; caput inferius fra lamina lateralis proc. pterygoidei.\n**Insertion:** fovea pterygoidea (forfladen af collum mandibulae), capsula fibrosa og discus articularis.\n**Funktion:** bilateral kontraktion giver protrusion (trækker caput frem på tuberculum articulare); unilateral kontraktion giver rotation/sidebevægelse.","img":"r_ax17_18-1"},{"id":"ax17-t13","t":"ax17.tm","k":"text","q":"M. pterygoideus medialis: udspring, insertion, funktion?","a":"**Udspring:** caput profundus fra fossa pterygoidea, caput superficialis fra tuber maxillae.\n**Insertion:** indersiden af ramus mandibulae.\n**Funktion:** kraftig mundlukker; bidrager desuden til m. pterygoideus lateralis' funktioner.","img":"r_ax17_18-1"},{"id":"ax17-t14","t":"ax17.tm","k":"text","q":"Hvad er 'pterygoideermuren' og pterygoideerinterstitset?","a":"**Pterygoideermuren:** de to mm. pterygoidei danner tilsammen en mur mellem regio infratemporalis og spatium lateropharyngeum.\n**Pterygoideerinterstitset:** spalten mellem de to muskler — en vigtig passage for kar og nerver mellem spatium lateropharyngeum og regio infratemporalis.","img":"r_ax17_18-1"},{"id":"ax17-t15","t":"ax17.tm","k":"text","q":"Regio temporalis: hvad svarer den til, og hvordan er den afgrænset?","a":"Tindingeregionen, svarer til m. temporalis' udspring.\n**Afgrænsning:** opadtil/bagtil linea temporalis inferior, nedadtil arcus zygomaticus, fortil proc. frontalis ossis zygomatici.","img":"r_ax17_14-1"},{"id":"ax17-t16","t":"ax17.tm","k":"text","q":"Regio (fossa) infratemporalis: beliggenhed og afgrænsning?","a":"Medialt for ramus mandibulae og ventralt for pterygoideermuren.\n**Loft:** arcus zygomaticus til pars squamosa ossis temporalis + facies infratemporalis (ala major ossis sphenoidalis). **Gulv:** kommunikation med regio submandibularis. **Forvæg:** bagkanten af maxilla (tuber maxillae). **Medialvæg:** lamina lateralis proc. pterygoidei og fissura pterygomaxillaris. **Lateralvæg:** ramus mandibulae (indersiden). **Bagvæg/bund:** bagkanten af m. pterygoideus medialis.","img":"r_ax17_20-2"},{"id":"ax17-t17","t":"ax17.tm","k":"text","q":"Hvilke kommunikationer har regio infratemporalis til de omkringliggende rum?","a":"**Opadtil:** regio temporalis. **Medialt:** fossa pterygopalatina (gennem fissura pterygomaxillaris). **Bagtil medialt:** spatium lateropharyngeum (gennem pterygoideerinterstitset). **Bagtil lateralt:** regio retromandibularis. **Fortil:** orbita (gennem fissura orbitalis inferior) og regio buccalis. **Nedadtil:** regio submandibularis.","img":"r_ax17_20-5"},{"id":"ax17-t18","t":"ax17.tm","k":"text","q":"Hvilke muskler lukker og åbner munden?","a":"**Lukning:** m. temporalis, m. masseter, m. pterygoideus medialis.\n**Åbning:** m. digastricus, m. mylohyoideus, m. geniohyoideus, platysma, samt tyngdekraften.","img":"r_ax17_9-0"},{"id":"ax17-t19","t":"ax17.tm","k":"text","q":"Hvilke muskler giver protrusion og retraktion af kæben?","a":"**Protrusion:** m. pterygoideus lateralis (m. pterygoideus medialis kan hjælpe). **Retraktion:** m. temporalis (horisontale fibre), m. digastricus.","img":"r_ax17_13-3"},{"id":"ax17-t20","t":"ax17.tm","k":"text","q":"Hvordan foregår åbning af munden trinvist?","a":"1) M. pterygoideus lateralis giver protrusion af caput mandibulae til tuberculum articulare.\n2) Mm. mylohyoideus, digastricus og geniohyoideus giver vinkelbevægelsen (de infrahyoide muskler gør os hyoideum til punctum fixum).\n3) Ved lukning udspændes fibre især i m. temporalis, som sammen med m. pterygoideus medialis og m. masseter lukker munden.","img":"r_ax17_14-1"},{"id":"ax17-t21","t":"ax17.fp","k":"text","q":"Fossa pterygopalatina: hvilke knogler danner den, og hvor ligger den?","a":"Lille rum mellem maxilla, lamina perpendicularis ossis palatini og proc. pterygoideus.","img":"r_ax17_29-0"},{"id":"ax17-t22","t":"ax17.fp","k":"text","q":"Fossa pterygopalatina: lateralvæg og medialvæg?","a":"**Lateralvæg:** lamina lateralis proc. pterygoidei + tuber maxillae, med fissura pterygomaxillaris.\n**Medialvæg:** lamina perpendicularis ossis palatini, med foramen sphenopalatinum (ind til næsehulen).","img":"r_ax17_29-0"},{"id":"ax17-t23","t":"ax17.fp","k":"text","q":"Fossa pterygopalatina: bagvæg/loft og forvæg?","a":"**Bagvæg og loft (basis):** os sphenoidale, med foramen rotundum og canalis pterygoideus.\n**Forvæg:** maxillas bagflade, med fissura orbitalis inferior (leder ind til øjet).","img":"r_ax17_29-0"},{"id":"ax17-t24","t":"ax17.fp","k":"text","q":"Fossa pterygopalatina: hvad findes ved apex?","a":"Apex dannes nedad af alle tre knogler. Herfra går canalis palatinus major/minor til foramen palatinum majus/minus.","img":"r_ax17_29-0"},{"id":"ax17-t25","t":"ax17.fp","k":"text","q":"Hvorfor er fossa pterygopalatina et vigtigt knudepunkt?","a":"Den er knudepunkt for a. maxillaris og n. maxillaris, med forbindelser til orbita, mellemansigtet, næsehulen og ganen. Indeholder ganglion pterygopalatinum (parasympatisk til gl. lacrimalis, næse og gane).","img":"r_ax17_29-0"},{"id":"ax17-t26","t":"ax17.am","k":"text","q":"A. maxillaris: udspring og indledende forløb?","a":"Endegren fra a. carotis externa. Afgår ud for bagkanten af ramus mandibulae, lidt kaudalt for collum mandibulae (i gl. parotidea). Løber mellem lig. sphenomandibulare og ramus mandibulae ind i regio infratemporalis, passerer superficielt eller profundt for m. pterygoideus lateralis' nederste hoved, og går gennem fissura pterygomaxillaris til fossa pterygopalatina.","img":"r_ax17_31-8"},{"id":"ax17-t27","t":"ax17.am","k":"text","q":"A. maxillaris, 1. stykke (pars retromandibularis): hvilke grene?","a":"A. auricularis profunda og a. meningea media (gennem foramen spinosum), samt a. alveolaris inferior (gennem foramen mandibulae → canalis mandibulae → a. mentalis).","img":"r_ax17_31-8"},{"id":"ax17-t28","t":"ax17.am","k":"text","q":"A. maxillaris, 2. stykke (pars intermuscularis): hvilke grene?","a":"Aa. temporales profundae, a. buccalis, a. masseterica (og andre grene til tyggemusklerne).","img":"r_ax17_31-8"},{"id":"ax17-t29","t":"ax17.am","k":"text","q":"A. maxillaris, 3. stykke (pars sphenopalatina): hvilke grene?","a":"Aa. alveolares superiores posteriores (gennem foramina alveolaria). A. infraorbitalis (fissura orbitalis inferior → canalis infraorbitalis → foramen infraorbitale; afgiver undervejs aa. alveolares superiores anteriores). A. palatina descendens (canalis palatinus major → a. palatina major + aa. palatinae minores). A. sphenopalatina (gennem foramen sphenopalatinum → cavitas nasi).","img":"r_ax17_31-8"},{"id":"ax17-t30","t":"ax17.am","k":"text","q":"A. temporalis superficialis: udspring og forløb?","a":"Endegren af a. carotis externa. Afgår i gl. parotidea, krydser superficielt for arcus zygomaticus og foran den ydre øregang (palpabel puls).","img":"r_ax17_28-3"},{"id":"ax17-t31","t":"ax17.am","k":"text","q":"A. temporalis superficialis: hvilke grene afgiver den?","a":"Deler sig i ramus frontalis (langs hårgrænsen mod tuber frontale) og ramus parietalis (opad, bagud mod vertex cranii). Afgiver desuden a. temporalis media (til m. temporalis), a. transversa faciei, a. zygomaticoorbitalis, og grene til gl. parotidea."},{"id":"ax17-t32","t":"ax17.sk","k":"text","q":"Hvad forstås ved skalpen (regio epicranii), og hvordan er den afgrænset?","a":"Den behårede hovedhud og pandehuden med underliggende subcutis og galea aponeurotica (m. epicranius).\n**Afgrænsning:** squama frontalis (fra arcus superciliaris), ossa parietalia (kranielt for linea temporalis inferior), pars squamosa ossis occipitalis (kranielt for linea nuchalis superior).","img":"r_ax17_34-3"},{"id":"ax17-t33","t":"ax17.sk","k":"text","q":"M. epicranius: hvilke tre dele har den, og hvad er dens funktion?","a":"**Venter occipitalis:** lateralt fra lineae nuchales superiores. **Galea aponeurotica:** fibrøst bindevæv mellem de to ventre. **Venter frontalis:** i huden over øjenbrynet og m. orbicularis oculi.\n**Funktion:** løfter øjenbrynene og rynker panden.","img":"r_ax17_34-3"},{"id":"ax17-t34","t":"ax17.sk","k":"text","q":"Hvilke fem lag har regio epicranii (skalpen)?","a":"Hud (tyk, bundet til galea aponeurotica, tyndere i panden, mange capilli), underhud (mange retinacula cutis, rete arteriosum et venosum), m. epicranius + galea aponeurotica, subgalealt bindevæv (tillader forskydning og skalpering), perikraniet (svarer til periost) og selve theca cranii.","img":"r_ax17_35-0"},{"id":"ax17-t35","t":"ax17.sk","k":"text","q":"Skalpens sensoriske innervation fortil: hvilke nerver fra n. trigeminus?","a":"N. supraorbitalis (V1, gennem foramen supraorbitale), n. supratrochlearis (V1, medialt for denne), r. zygomaticotemporalis (V2, gennem os zygomaticum), n. auriculotemporalis (V3, bag kæben, via gl. parotidea).","img":"r_ax17_36-2"},{"id":"ax17-t36","t":"ax17.sk","k":"text","q":"Skalpens sensoriske innervation lateralt og bagtil: hvilke nerver?","a":"**Lateralt (under/bag øret), fra plexus cervicalis:** n. occipitalis minor (bag/langs m. SCM), n. auricularis magnus (dækker ikke helt skalpen).\n**Bagtil, fra rami dorsales nn. spinalium cervicales:** n. occipitalis major (ramus posterior C2, mellem mm. trapezius et SCM), n. occipitalis tertius (ramus posterior C3, mere kaudalt; bærer også motoriske fibre til m. semispinalis capitis).","img":"r_ax17_36-2"},{"id":"ax17-t37","t":"ax17.sk","k":"text","q":"Skalpens arterielle forsyning (rete arteriosum): hvilke arterier?","a":"**Fortil:** a. supraorbitalis (gennem foramen supraorbitale), a. supratrochlearis (medialt for denne).\n**Lateralt:** a. temporalis superficialis (r. frontalis et r. parietalis).\n**Bagtil:** a. occipitalis (følger n. occipitalis major).","img":"r_ax17_37-2"},{"id":"ax17-t38","t":"ax17.sk","k":"text","q":"Skalpens venøse drænage og lymfe?","a":"**Rete venosum:** i forbindelse via vv. emissariae med vv. diploicae og sinus durae matris.\n**Lymfe:** foran øret til lnn. preauriculares; bag øret til lnn. mastoidei et occipitales.","img":"r_ax17_37-2"},{"id":"ax17-t39","t":"ax17.an","k":"text","q":"Ansigtet: hvordan er det anatomisk afgrænset?","a":"Glabella – margo supraorbitalis, proc. frontalis ossis zygomatici, arcus zygomaticus – forkanten af m. SCM, angulus et basis mandibulae.","img":"r_ax17_33-2"},{"id":"ax17-t40","t":"ax17.an","k":"text","q":"Hvordan inddeles ansigtet klinisk i tre dele?","a":"**Overansigtet:** hårgrænsen – margines supraorbitales. **Mellemansigtet:** margines supraorbitales – proc. alveolaris maxillae. **Underansigtet:** proc. alveolaris maxillae – basis mandibulae.","img":"r_ax17_38-2"},{"id":"ax17-t41","t":"ax17.an","k":"text","q":"Hvad kendetegner ansigtets muskler generelt, og hvilken nerve innerverer dem alle?","a":"Anordnet omkring åbninger (øjne, næse, ører, mund) til kontrol af åbninger og mimik. De er hudmuskler (går fra knogle til hud og har derfor ingen antagonist). Innerveres alle af n. facialis (CN VII, 2. branchiebue).","img":"r_ax17_40-2"},{"id":"ax17-t42","t":"ax17.an","k":"text","q":"Hvilke er de vigtigste ansigtsmuskler?","a":"M. orbicularis oculi, m. orbicularis oris, m. buccinator, m. epicranius, platysma. Hertil talrige mindre muskler til det ydre øre, næsen, læberne og mundvigene.","img":"r_ax17_40-2"},{"id":"ax17-t43","t":"ax17.an","k":"text","q":"M. orbicularis oculi: hvilke tre dele har den, og hvad er dens funktion?","a":"**Pars orbitalis:** over- og underkanten af lig. palpebrale mediale, fletter sig lateralt ind i hinanden. **Pars palpebralis:** ligger i øjenlåget. **Pars lacrimalis:** passerer profundt for saccus lacrimalis, hæfter på crista lacrimalis posterior.\n**Funktion:** lukker øjet / kniber øjet sammen.","img":"r_ax17_41-2"},{"id":"ax17-t44","t":"ax17.an","k":"text","q":"M. orbicularis oris: forløb og funktion?","a":"Ringformet forløb, hvor fibrene er forbundet — nogle hæfter i huden, andre i mundens slimhinde.\n**Funktion:** lukker munden ('trutmund').","img":"r_ax17_42-3"},{"id":"ax17-t45","t":"ax17.an","k":"text","q":"M. buccinator: udspring, insertion, funktion?","a":"**Udspring:** lateralfladen af maxilla og mandibula, samt raphe pterygomandibularis (fra hamulus proc. pterygoidei til bagenden af linea mylohyoidea). **Insertion:** m. orbicularis oris (de centrale fibre krydser hinanden, de øvre/nedre gør ikke).\n**Funktion:** presser kinden ind mod tænderne, så der ikke ophobes føde i vestibulum oris.","img":"r_ax17_42-3"},{"id":"ax17-t46","t":"ax17.an","k":"text","q":"N. facialis (ekstrakranielt): forløb frem til delingen?","a":"Ud gennem foramen stylomastoideum, gennem regio retromandibularis, ventralt for venter posterior m. digastrici, buet forløb i gl. parotidea mod mandibula.","img":"r_ax17_43-2"},{"id":"ax17-t47","t":"ax17.an","k":"text","q":"N. facialis: hvilke to hovedstammer deler den sig i, og hvad innerverer de?","a":"Deler sig ud for midten af bagkanten af ramus mandibulae i:\n**Temporofacial stamme** (øverst): rami temporales, zygomatici (et buccales) — til mm. epicranius, orbicularis oculi, næse og overlæbe.\n**Cervicofacial stamme** (nederst): rami marginalis mandibulae, colli (et buccales) — til mm. orbicularis oris, platysma.","img":"r_ax17_43-2"},{"id":"ax17-t48","t":"ax17.an","k":"text","q":"N. facialis: hvad afgives lige efter foramen stylomastoideum, og hvad er huskereglen for grenene?","a":"N. auricularis posterior afgives, som innerverer venter occipitalis m. epicranii samt selvstændige grene til venter posterior m. digastrici og m. stylohyoideus.\nHuskeregel for de fem hovedgrene (temporalis, zygomaticus, buccalis, marginalis mandibulae, colli): 'To Zanzibar By Motor Car'.","img":"r_ax17_43-2"},{"id":"ax17-t49","t":"ax17.an","k":"text","q":"A. facialis: udspring og forløb?","a":"Fra a. carotis externa. Passerer den bagre pol af gl. submandibularis, bøjer omkring basis mandibulae (foran m. masseter — palpabel puls), videre forbi mundvinklen til næsens siderand (stærkt snoet), og fortsætter som a. angularis i den mediale øjenkrog (palpabel puls). Ligger superficielt for m. buccinator og profundt for ansigtsmusklerne.","img":"r_ax17_47-2"},{"id":"ax17-t50","t":"ax17.an","k":"text","q":"A. facialis: anastomoser og grene?","a":"Anastomoserer livligt med aa. temporalis superficialis, maxillaris og ophthalmica, samt med modsidige a. facialis over midtlinjen. Afgiver aa. labiales superior et inferior samt grene til næsen.","img":"r_ax17_47-2"},{"id":"ax17-t51","t":"ax17.an","k":"text","q":"V. facialis og ansigtets lymfedrænage?","a":"V. angularis fortsætter som v. facialis (liggende bag arterien, mindre snoet), som tømmer sig i v. retromandibularis. Kommunikerer med vv. supraorbitalis, ophthalmicae og faciei profunda.\n**Lymfe:** lnn. parotidei (herunder preauriculares), submandibulares, submentales.","img":"r_ax17_47-2"},{"id":"ax17-t52","t":"ax17.sp","k":"text","q":"Hvilke tre store spytkirtler findes, og hvad kendetegner de små spytkirtler?","a":"Glandula parotidea, glandula submandibularis, glandula sublingualis.\nDe små spytkirtler ligger i mundhulens slimhinde (læber, kinder, ganen, tungen) og benævnes efter lokalisation, fx glandula lingualis anterior.","img":"r_ax17_49-2"},{"id":"ax17-t53","t":"ax17.sp","k":"text","q":"Hvilke funktioner har spyttet?","a":"Smøring og beskyttelse af mundslimhinden mod udtørring, kemisk irritation og mikroorganismer; helingsfremmende; smidiggørelse af føde (tygning/synkning); opløsning af smagsstoffer og begyndende enzympåvirkning; rensning og beskyttelse af tænder; tale.","img":"r_ax17_49-2"},{"id":"ax17-t54","t":"ax17.sp","k":"text","q":"Glandula parotidea: type og konsistens?","a":"Ren serøs kirtel, fint lobuleret, blød konsistens. Ligger i regio parotideomasseterica.","img":"r_ax17_53-5"},{"id":"ax17-t55","t":"ax17.sp","k":"text","q":"Glandula parotidea: relationer (basis, apex, for- og bagflade)?","a":"**Basis:** opad, relation til øregangen og kæbeleddet. **Apex:** nedadtil, ud for angulus mandibulae. **Forflade:** relation til ramus mandibulae samt mm. masseter et pterygoideus medialis. **Bagflade:** m. SCM bagtil og venter posterior m. digastrici.","img":"r_ax17_53-5"},{"id":"ax17-t56","t":"ax17.sp","k":"text","q":"Hvilke strukturer i dybden adskiller gl. parotidea fra de store halskar?","a":"A. carotis externa og proc. styloideus (med muskler) adskiller kirtlen fra a. carotis interna, v. jugularis interna, nn. glossopharyngeus, vagus, hypoglossus og pharynxvæggen.","img":"r_ax17_53-6"},{"id":"ax17-t57","t":"ax17.sp","k":"text","q":"Parotidealogen: hvordan dannes den, og hvad er dens to blade?","a":"Fascia parotidea (fra lamina superficialis fasciae cervicalis) omslutter kirtlen.\n**Superficielt blad:** fortsætter over m. masseter som fascia masseterica (tilsammen fascia parotideomasseterica); hæfter til arcus zygomaticus.\n**Profundt blad:** dækker den profunde flade bag ramus mandibulae, forstærket med lig. stylomandibulare.","img":"r_ax17_54-0"},{"id":"ax17-t58","t":"ax17.sp","k":"text","q":"Hvilke strukturer er indvævet i selve gl. parotidea?","a":"Lnn. parotidei, n. facialis (forgrener sig her), v. retromandibularis (v. maxillaris + v. temporalis superficialis), a. carotis externa (deler sig ud for collum mandibulae), n. auriculotemporalis.","img":"r_ax17_54-0"},{"id":"ax17-t59","t":"ax17.sp","k":"text","q":"Ductus parotideus (Stenoni): mål og forløb?","a":"5 cm lang, 3–4 mm i diameter. Afgår fra kirtlens øverste hjørne, løber på m. masseter under en evt. gl. parotidea accessoria, drejer medialt og perforerer m. buccinator, og munder ud som papilla parotidea ud for 2. molar i overmunden.","img":"r_ax17_56-2"},{"id":"ax17-t60","t":"ax17.sp","k":"text","q":"Glandula submandibularis: type, konsistens og region?","a":"Overvejende serøs (seromukøs), groft lobuleret. Ligger i trigonum submandibulare (mellem venteres m. digastrici og basis mandibulae). Opdeles af m. mylohyoideus i en profund og en superficiel del.","img":"r_ax17_58-0"},{"id":"ax17-t61","t":"ax17.sp","k":"text","q":"Glandula submandibularis: laterale og mediale relationer?","a":"**Lateralt:** støder mod fovea submandibularis, m. pterygoideus medialis, a. et v. facialis, bagtil gl. parotidea.\n**Medialt:** mm. mylohyoideus et hyoglossus, venter posterior m. digastrici, n. lingualis, n. hypoglossus.","img":"r_ax17_58-4"},{"id":"ax17-t62","t":"ax17.sp","k":"text","q":"Submandibularislogen: opbygning og indhold?","a":"Dannet af en spaltning af lamina superficialis fasciae cervicalis i et superficielt og et profundt blad — løsere end gl. parotideas loge. Indeholder lnn. submandibulares.","img":"r_ax17_59-2"},{"id":"ax17-t63","t":"ax17.sp","k":"text","q":"Ductus submandibularis (Whartoni): forløb og relation til n. lingualis?","a":"Begynder ud for den superficielle dels dybe flade, bøjer omkring m. mylohyoideus og løber mellem denne og m. hyoglossus. Ligger i krog med n. lingualis (som løber under ductus, fra lateralt til medialt). Løber medialt for gl. sublingualis og munder ud i caruncula sublingualis.","img":"r_ax17_60-0"},{"id":"ax17-t64","t":"ax17.sp","k":"text","q":"Glandula sublingualis: type, konsistens og beliggenhed?","a":"Overvejende mukøs (mukoserøs), fint lobuleret. Ligger i regio sublingualis på m. mylohyoideus i mundhulens bund, hvor den danner fremhvælvingen plica sublingualis. Har ingen egen loge.","img":"r_ax17_62-3"},{"id":"ax17-t65","t":"ax17.sp","k":"text","q":"Glandula sublingualis: laterale og mediale relationer?","a":"**Lateralt:** corpus mandibulae over linea mylohyoidea (fovea sublingualis).\n**Medialt:** mm. geniohyoideus, genioglossus og ductus submandibularis.","img":"r_ax17_62-7"},{"id":"ax17-t66","t":"ax17.sp","k":"text","q":"Ducti sublinguales: antal og forløb?","a":"10–12 småkanaler udmunder hver med sin papil i plica sublingualis. Ductus sublingualis major (Bartholini) ligger medialt og udmunder sammen med ductus submandibularis i caruncula sublingualis.","img":"r_ax17_63-2"},{"id":"ax18-t1","t":"ax18.kn","k":"text","q":"Hvor mange kranienerver er der, og hvordan adskiller de sig grundlæggende fra spinalnerver?","a":"12 par (nervi craniales). De udgår direkte fra hjernen og hjernestammen — i modsætning til spinalnerver, som udspringer fra rygmarven. De har sensoriske, motoriske eller blandede funktioner og styrer især hovedets og halsens sanser og bevægelser.","img":"r_ax18_5-5"},{"id":"ax18-t2","t":"ax18.kn","k":"text","q":"Hvilke kranienerver er rent sensoriske, og hvilke er rent motoriske?","a":"**Rent sensoriske:** I (olfactorius, lugtesans), II (opticus, syn), VIII (vestibulocochlearis, hørelse/balance).\n**Rent motoriske:** III (oculomotorius), IV (trochlearis), VI (abducens) — alle til øjenbevægelser; XI (accessorius, m. SCM/trapezius); XII (hypoglossus, tungens bevægelser).","img":"r_ax18_5-5"},{"id":"ax18-t3","t":"ax18.kn","k":"text","q":"Hvilke kranienerver er blandede (sensorisk + motorisk), og hvad er deres hovedfunktion?","a":"**V (trigeminus):** ansigtssensibilitet, tyggemuskler. **VII (facialis):** ansigtsmimik, smag fra forreste 2/3 af tungen. **IX (glossopharyngeus):** smag fra bagerste 1/3 af tungen, synkning. **X (vagus):** parasympatisk styring af thorax/abdomen, tale.","img":"r_ax18_5-5"},{"id":"ax18-t4","t":"ax18.kn","k":"text","q":"Hvad er huskereglen for kranienervernes navne og deres fibertype?","a":"**Navne:** 'Oh Oh Oh To Touch And Feel Virgin Girls Vagina Ah Heaven' (Olfactorius, Opticus, Oculomotorius, Trochlearis, Trigeminus, Abducens, Facialis, Vestibulocochlearis, Glossopharyngeus, Vagus, Accessorius, Hypoglossus).\n**Fibertype:** 'Some Say Money Matter, But My Brother Says Big Boobs Matter More' (Sensorisk, Motorisk, Begge, skiftevis).","img":"r_ax18_5-5"},{"id":"ax18-t5","t":"ax18.lk","k":"text","q":"Hvilke synlige strukturer har læberne udadtil?","a":"Labia superius et inferius, commissura labiorum, anguli et rima oris, sulcus nasolabialis, sulcus mentolabialis, philtrum og tuberculum labii superioris, prolabium (det røde af læberne), samt frenula labii superioris et inferioris (indersiden).","img":"r_ax18_25-1"},{"id":"ax18-t6","t":"ax18.lk","k":"text","q":"Hvilke fire lag har læberne?","a":"1) Hud (tynd, fast bundet, sved-/talgkirtler, barbae). 2) M. orbicularis oris (hæfter i huden). 3) Submucosa (gll. labiales, mukoserøse). 4) Mucosa (uforhornet, flerlaget pladeepitel).","img":"r_ax18_26-4"},{"id":"ax18-t7","t":"ax18.lk","k":"text","q":"Hvad kendetegner prolabiet?","a":"Nærmest ingen keratinisering. Hår og svedkirtler mangler, men der findes fedtkirtler. Mange nerveender og kar. Udgør en mukokutan grænsezone.","img":"r_ax18_26-4"},{"id":"ax18-t8","t":"ax18.lk","k":"text","q":"Hvordan adskiller kindens lagopbygning sig fra læbens?","a":"Svarer til læben, dog er m. orbicularis oris udskiftet med m. buccinator. Submucosa indeholder gll. buccales og gll. molares (de sidste ligger på m. buccinators yderside). Corpus adiposum buccae (fedtlegeme) ligger mellem ramus mandibulae og m. buccinator.","img":"r_ax18_27-2"},{"id":"ax18-t9","t":"ax18.lk","k":"text","q":"Læbernes og kindens arterielle forsyning?","a":"**Læber:** aa. labiales superior et inferior fra a. facialis. **Kinder:** a. buccalis fra a. maxillaris.","img":"r_ax18_27-2"},{"id":"ax18-t10","t":"ax18.lk","k":"text","q":"Læbernes og kindens nerveforsyning?","a":"**Overlæbe:** rami labiales superiores (fra n. infraorbitalis). **Underlæbe:** rami labiales inferiores (fra n. mentalis). **Mundvinkel og kind:** n. buccalis (fra forreste gren af n. mandibularis)."},{"id":"ax18-t11","t":"ax18.lk","k":"text","q":"Læbernes og kindens venedrænage og lymfe?","a":"**Vener:** vv. labiales superior et inferior samt v. buccalis (kinden drænerer desuden via v. profunda faciei til plexus pterygoideus). **Lymfe:** overlæbe til lnn. submandibulares, underlæbe til lnn. submentales."},{"id":"ax18-t12","t":"ax18.mh","k":"text","q":"Hvordan opdeler tandbuerne cavitas oris?","a":"I cavitas oris propria og vestibulum oris.","img":"r_ax18_28-2"},{"id":"ax18-t13","t":"ax18.mh","k":"text","q":"Vestibulum oris: hvad er det, og hvad er dets funktion?","a":"Det 'hesteskoformede spalterum' mellem tænder og læber (sulci alveololabiales superior et inferior) samt mellem tænder og kinder (sulci alveolobuccales superior et inferior).\n**Funktion:** holder maden inde mod tyggefladen.","img":"r_ax18_28-2"},{"id":"ax18-t14","t":"ax18.mh","k":"text","q":"Hvad findes i vestibulum oris, og hvad er spatium retrodentale?","a":"Ductus parotideus (Stenoni) munder ud ved 2. molar. Spatium retrodentale er rummet bag 3. molar til forkanten af ramus mandibulae."},{"id":"ax18-t15","t":"ax18.mh","k":"text","q":"Cavitas oris propria: afgrænsning og indhold?","a":"Ligger inden for tandbuen. **Gulv:** regio sublingualis. **Loft:** ganen. Stopper ved den forreste ganebue og den bløde gane, og kommunikerer under denne (isthmus faucium) med oropharynx. Ved lukket mund er hele rummet udfyldt af tungen.","img":"r_ax18_29-5"},{"id":"ax18-t16","t":"ax18.mh","k":"text","q":"Hvad er fauces?","a":"De 2×2 ganebuer med tilhørende tonsilleje og mandler."},{"id":"ax18-t17","t":"ax18.mh","k":"text","q":"Regio sublingualis: form og afgrænsning?","a":"Uparret, halvmåneformet region under tungen. **For-/sidevæg:** den nedre tandbue. **Bagvæg:** radix linguae + m. mylohyoideus. **Gulv:** m. mylohyoideus (diaphragma oris). Indeholder frenulum linguae, caruncula sublingualis og plica sublingualis.","img":"r_ax18_29-5"},{"id":"ax18-t18","t":"ax18.ga","k":"text","q":"Hvad er palatum, og hvilke to dele opdeles den i?","a":"'Hvælvingen' — grænsen mellem næse- og mundhule. Opdeles i palatum durum (den hårde gane) og palatum molle (den bløde gane).","img":"r_ax18_31-3"},{"id":"ax18-t19","t":"ax18.ga","k":"text","q":"Palatum durum: hvilke knogler danner den?","a":"Proc. palatinus maxillae og lamina horizontalis os
