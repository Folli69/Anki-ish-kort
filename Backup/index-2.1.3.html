sis palatini, med spina nasalis posterior.","img":"r_ax18_31-3"},{"id":"ax18-t20","t":"ax18.ga","k":"text","q":"Hvilke strukturer findes på palatum durum?","a":"Foramen incisivum (→ canalis incisivus, ender på hver side af septum nasi), sutura palatina mediana ('os incisivum'), foramen palatinum majus, foramina palatina minores, spina nasalis posterior. Slimhinden bærer raphe palati, papilla incisiva og plicae palatinae transversae.","img":"r_ax18_32-3"},{"id":"ax18-t21","t":"ax18.ga","k":"text","q":"Palatum molle: hvad består den af, og hvad kaldes den også?","a":"Kaldes også ganesejlet (velum palatini). Består af aponeurosis palatina (fibrøs plade hæftet til bagsiden af os palatinum, hvor alle ganesejlets muskler insererer) og muskulatur.","img":"r_ax18_33-2"},{"id":"ax18-t22","t":"ax18.ga","k":"text","q":"Hvordan er palatum molle forbundet til pharynx, og hvad ligger mellem de to buer?","a":"Palatum molle er vokset sammen med pharynx i siderne og indeholder to buer: arcus palatoglossus (forrest) og arcus palatopharyngeus (bagest). Mellem dem ligger fossa tonsillaris (med tonsilla palatina). Strukturerne kaldes samlet fauces.","img":"r_ax18_33-2"},{"id":"ax18-t23","t":"ax18.ga","k":"text","q":"Hvilke fem muskler udgør ganemuskulaturen?","a":"M. tensor veli palatini, m. levator veli palatini, m. uvulae, m. palatoglossus, m. palatopharyngeus. (Når musklerne er slimhindebeklædt, kaldes de arcus — fx arcus palatoglossus = m. palatoglossus + slimhinde.)","img":"r_ax18_35-1"},{"id":"ax18-t24","t":"ax18.ga","k":"text","q":"M. tensor veli palatini: udspring, forløb, insertion, funktion?","a":"**Udspring:** pars membranacea tubae auditivae, lamina lateralis cartilaginis tubae auditivae, roden af lamina medialis proc. pterygoidei. **Forløb:** nedad, fremad, retvinklet krog om hamulus pterygoideus. **Insertion:** aponeurosis palatina.\n**Funktion:** strammer ganesejlet fra side til side.","img":"r_ax18_36-1"},{"id":"ax18-t25","t":"ax18.ga","k":"text","q":"M. levator veli palatini: udspring, forløb, insertion, funktion?","a":"**Udspring:** undersiden af pars petrosa (foran canalis caroticus). **Forløb:** nedad, fremad, medialt (langs tuba auditiva). **Insertion:** aponeurosis palatina (mediant, V-formet).\n**Funktion:** løfter ganesejlet.","img":"r_ax18_36-2"},{"id":"ax18-t26","t":"ax18.ga","k":"text","q":"M. uvulae: udspring og funktion?","a":"Udspringer fra hver side af spina nasalis posterior og fletter sig ind i den modsidige. Hjælper m. levator veli palatini med at aflukke isthmus pharyngonasalis.","img":"r_ax18_38-1"},{"id":"ax18-t27","t":"ax18.ga","k":"text","q":"M. palatoglossus og m. palatopharyngeus: forløb og funktion?","a":"**M. palatoglossus** (danner den forreste ganebue): fra forreste del af aponeurosis palatina, fremad-nedad-lateralt, insererer i tungesubstansen og dorsum linguae foran fossa tonsillaris. Hiver tungen og palatum molle mod hinanden — lukker isthmus faucium.\n**M. palatopharyngeus** (danner den bageste ganebue): fra den pharyngeale del af aponeurosis palatina, posterolateralt til svælgvæggen, ender på cartilago thyroidea. Modtager m. salpingopharyngeus.","img":"r_ax18_38-1"},{"id":"ax18-t28","t":"ax18.ga","k":"text","q":"Ganens arterielle forsyning?","a":"A. palatina descendens (fra a. maxillaris) → a. palatina major (gennem foramen palatinum majus, anastomoserer med a. sphenopalatina i canalis incisivus) + aa. palatinae minores (gennem foramina palatina minores til den bløde gane).","img":"r_ax18_40-1"},{"id":"ax18-t29","t":"ax18.ga","k":"text","q":"Ganens nerveforsyning?","a":"Nn. palatini fra n. maxillaris (V2): forreste gren n. palatinus major, midterste/bageste grene nn. palatini minores. N. nasopalatinus forsyner området omkring foramen incisivum.","img":"r_ax18_40-2"},{"id":"ax18-t30","t":"ax18.tu","k":"text","q":"Tungen (lingua s. glossa): hvilke to dele har den, og hvad er tungens fæstepunkter?","a":"**Radix linguae:** fra mandibulas bagflade til os hyoideum. **Corpus linguae:** fra radix til apex — bevægelig.\n**Fæstet til:** mandibula, os hyoideum, procc. styloidei, palatum molle, slimhinden i mundens bund, pharynx, epiglottis.","img":"r_ax18_43-3"},{"id":"ax18-t31","t":"ax18.tu","k":"text","q":"Dorsum linguae: hvad opdeler sulcus terminalis, og hvad hedder de to dele?","a":"Sulcus terminalis (V-formet, med foramen caecum linguae) opdeler dorsum linguae i pars presulcalis (forreste 2/3, vender mod ganen) og pars postsulcalis (bageste 1/3, vender mod pharynx, med tonsilla lingualis i folliculi linguales — lymfoidt væv).","img":"r_ax18_44-1"},{"id":"ax18-t32","t":"ax18.tu","k":"text","q":"Tungens underside: hvilke strukturer?","a":"Glat, uden papiller. Plica fimbriata og frenulum linguae ('tungebåndet').","img":"r_ax18_44-2"},{"id":"ax18-t33","t":"ax18.tu","k":"text","q":"Hvilke fire slags papiller har tungen?","a":"**Papillae vallatae:** foran og parallelt med sulcus terminalis, kort/cylindrisk med voldgrav, talrige smagsløg og serøse kirtler.\n**Papillae filiformes:** stort antal på hele tungeryggen, mekanisk betydning.\n**Papillae fungiformes:** typisk ved siderandene, paddehatteformet, enkelte smagsløg.\n**Papillae foliatae:** i folderne foran forreste ganebue, talrige smagsløg.","img":"r_ax18_45-0"},{"id":"ax18-t34","t":"ax18.tm","k":"text","q":"Hvilke fire ydre tungemuskler findes, og hvad kendetegner dem?","a":"M. genioglossus, m. hyoglossus, m. styloglossus, m. palatoglossus. Udspringer uden for tungen og er parrede (to af hver). Funktion: ændrer tungens lejring/position.","img":"r_ax18_46-3"},{"id":"ax18-t35","t":"ax18.tm","k":"text","q":"Hvilke indre tungemuskler findes, og hvad er deres funktion?","a":"M. transversus linguae, m. verticalis linguae, mm. longitudinalis superior et inferior. Udspringer og insererer i selve tungesubstansen. Funktion: ændrer tungens form.\nSeptum linguae opdeler tungen i medianplanet; aponeurosis linguae tjener til muskelhæfte.","img":"r_ax18_46-3"},{"id":"ax18-t36","t":"ax18.tm","k":"text","q":"M. genioglossus: udspring, insertion, funktion?","a":"**Udspring:** spina mentalis. **Insertion:** aponeurosis linguae og hele tungesubstansen.\n**Funktion:** protrusion af tungen; ved unilateral kontraktion ses protrusion mod modsatte side. Forhindrer tungen i at falde bagud og obstruere respirationen.","img":"r_ax18_47-2"},{"id":"ax18-t37","t":"ax18.tm","k":"text","q":"M. hyoglossus og m. styloglossus: udspring, insertion, funktion?","a":"**M. hyoglossus:** udspring cornu majus ossis hyoidei, insertion tungens siderand, funktion sænker tungen.\n**M. styloglossus:** udspring proc. styloideus og lig. stylohyoideum, insertion tungens siderand, funktion trækker tungen bagud og opad.","img":"r_ax18_47-6"},{"id":"ax18-t38","t":"ax18.tm","k":"text","q":"Tungens arterielle forsyning?","a":"A. lingualis fra a. carotis externa, over os hyoideum, medialt for m. hyoglossus. Afgiver a. dorsalis linguae og a. sublingualis, ender som a. profunda linguae mod apex.","img":"r_ax18_50-2"},{"id":"ax18-t39","t":"ax18.tm","k":"text","q":"Tungens venedrænage og lymfe?","a":"**Vener:** v. profunda linguae (lateralt for arterien) → v. lingualis (lateralt for m. hyoglossus).\n**Lymfe:** apex til lnn. submentales (eller juguloomohyoidei); presulcalt til lnn. submandibulares/cervicales profundi/jugulodigastrici; postsulcalt til lnn. cervicales profundi/jugulodigastrici/juguloomohyoidei.","img":"r_ax18_50-2"},{"id":"ax18-t40","t":"ax18.tn","k":"text","q":"N. hypoglossus: type, forløb og innervation?","a":"Motorisk. Fra canalis n. hypoglossi, lateralt for carotiderne, profundt for mm. digastricus et stylohyoideus, lateralt for m. hyoglossus, mellem mm. hyoglossus et mylohyoideus, til lateralfladen af m. genioglossus.\nInnerverer alle tungemusklerne UNDTAGEN m. palatoglossus (som får n. vagus). Bærer desuden C1-fibre til m. geniohyoideus og m. thyrohyoideus.","img":"r_ax18_51-2"},{"id":"ax18-t41","t":"ax18.tn","k":"text","q":"Hvad ses klinisk ved læsion af n. hypoglossus, og hvorfor?","a":"Tungen devierer mod den paralyserede side, pga. den uafficerede modsidige m. genioglossus' virkning.","img":"r_ax18_51-4"},{"id":"ax18-t42","t":"ax18.tn","k":"text","q":"N. lingualis: hvor stammer den fra, og hvad bærer den?","a":"En stor gren af n. mandibularis (V3), kommer ud gennem foramen ovale. Bærer sensoriske tråde samt smagstråde og præganglionære parasympatiske tråde til de forreste 2/3 af tungen (fra n. facialis via chorda tympani).","img":"r_ax18_53-4"},{"id":"ax18-t43","t":"ax18.tn","k":"text","q":"N. lingualis: forløb?","a":"Gennem pterygoideerinterstitset til regio infratemporalis, descenderer på m. pterygoideus medialis, løber lige bag roden af 3. molar (under slimhinden), mellem øverste del af mm. hyoglossus et mylohyoideus, i krog med ductus submandibularis, og breder sig i tungesubstansen. Afgiver n. sublingualis.","img":"r_ax18_53-4"},{"id":"ax18-t44","t":"ax18.tn","k":"text","q":"N. lingualis: innervationsområde?","a":"Sensorisk presulcalt og af mundbunden. Smagstråde (fra n. facialis via chorda tympani). Postganglionære tråde til små kirtler og gll. sublingualis et submandibularis.","img":"r_ax18_53-3"},{"id":"ax18-t45","t":"ax18.tn","k":"text","q":"N. glossopharyngeus: innervationsområde og forløb i forhold til n. hypoglossus?","a":"Sensoriske tråde, smagstråde samt postganglionære parasympatiske tråde til kirtler i den bagerste 1/3 af tungen. Løber gennem carotiderne og MEDIALT for m. hyoglossus (modsat n. hypoglossus, som løber lateralt for den).","img":"r_ax18_54-1"},{"id":"ax18-t46","t":"ax18.ta","k":"text","q":"Hvilke dele består en tand af?","a":"Corona dentis (kronen, spids/mejselformet eller med cuspides), cervix dentis (forbinder krone og rod), radix dentis (forankret i alveolen, 1-3 rødder), cavitas dentis (indeholder pulpa dentis). Vævene er emalje, dentin og cement. Gingiva (tandkødet) beklæder arcus alveolaris.","img":"r_ax18_57-2"},{"id":"ax18-t47","t":"ax18.ta","k":"text","q":"Hvor mange dentes permanentes har et voksent tandsæt, og hvilke typer?","a":"32 tænder: 2 dentes incisivi (fortænder, skærekant, 1 rod), 1 dens caninus (hjørnetand, kegleformet, 1 cuspis, 1 rod), 2 dentes premolares (tyggeflade, 2 cuspides, 2 rødder), 3 dentes molares (store kroner, 3-5 cuspides, 2-3 rødder) — per kvadrant.","img":"r_ax18_58-2"},{"id":"ax18-t48","t":"ax18.ta","k":"text","q":"Tændernes nerveforsyning?","a":"**Overtænder:** nn. alveolares superiores anterior, medius et posterior (plexus dentalis superior) — anterior/medius fra n. infraorbitalis, posterior direkte fra n. maxillaris.\n**Undertænder:** n. alveolaris inferior (plexus dentalis inferior), fra n. mandibularis.","img":"r_ax18_58-3"},{"id":"ax18-t49","t":"ax18.ta","k":"text","q":"Tændernes arterielle forsyning?","a":"Arterierne ledsager nerverne og stammer fra a. maxillaris.","img":"r_ax18_58-6"},{"id":"ax18-o50","t":"ax18.lk","k":"occ","img":"laeber1","boxes":[[14.141,82.618,36.953,6.953],[63.047,84.56,22.811,5.624],[42.424,3.374,40.488,19.836],[10.522,14.11,23.822,9.1],[23.148,20.859,62.71,46.728],[77.441,63.804,13.215,6.851]],"target":0,"a":"Labium inferius","n":"Underlæben."},{"id":"ax18-o51","t":"ax18.lk","k":"occ","img":"laeber1","boxes":[[14.141,82.618,36.953,6.953],[63.047,84.56,22.811,5.624],[42.424,3.374,40.488,19.836],[10.522,14.11,23.822,9.1],[23.148,20.859,62.71,46.728],[77.441,63.804,13.215,6.851]],"target":1,"a":"Rima oris","n":"Mundspalten mellem over- og underlæbe."},{"id":"ax18-o52","t":"ax18.tm","k":"occ","img":"tungemusk1","boxes":[[23.199,3.201,25.653,7.506],[72.288,35.651,23.436,7.506],[4.117,91.611,25.337,7.506],[50.198,92.274,21.378,7.506],[72.526,10.596,4.83,3.753],[29.612,18.212,6.255,3.753],[13.302,18.433,4.513,6.512],[71.655,21.634,7.205,8.278],[25.732,24.945,3.642,4.857],[38.638,33.002,6.492,8.057],[51.306,40.618,5.938,4.746],[2.692,41.391,7.047,7.616],[5.701,46.358,4.038,8.72],[10.451,47.682,3.8,4.305],[60.174,48.124,3.959,4.415],[41.964,49.669,5.226,4.525],[28.108,59.603,9.66,4.525],[41.33,69.316,6.492,9.603],[3.721,72.848,2.059,3.642],[83.61,91.943,10.847,6.181]],"target":0,"a":"M. palatoglossus","n":"Danner den forreste ganebue; hiver tungen og palatum molle mod hinanden."},{"id":"ax18-o53","t":"ax18.tm","k":"occ","img":"tungemusk1","boxes":[[23.199,3.201,25.653,7.506],[72.288,35.651,23.436,7.506],[4.117,91.611,25.337,7.506],[50.198,92.274,21.378,7.506],[72.526,10.596,4.83,3.753],[29.612,18.212,6.255,3.753],[13.302,18.433,4.513,6.512],[71.655,21.634,7.205,8.278],[25.732,24.945,3.642,4.857],[38.638,33.002,6.492,8.057],[51.306,40.618,5.938,4.746],[2.692,41.391,7.047,7.616],[5.701,46.358,4.038,8.72],[10.451,47.682,3.8,4.305],[60.174,48.124,3.959,4.415],[41.964,49.669,5.226,4.525],[28.108,59.603,9.66,4.525],[41.33,69.316,6.492,9.603],[3.721,72.848,2.059,3.642],[83.61,91.943,10.847,6.181]],"target":1,"a":"M. styloglossus","n":"Trækker tungen bagud og opad."},{"id":"ax18-o54","t":"ax18.tm","k":"occ","img":"tungemusk1","boxes":[[23.199,3.201,25.653,7.506],[72.288,35.651,23.436,7.506],[4.117,91.611,25.337,7.506],[50.198,92.274,21.378,7.506],[72.526,10.596,4.83,3.753],[29.612,18.212,6.255,3.753],[13.302,18.433,4.513,6.512],[71.655,21.634,7.205,8.278],[25.732,24.945,3.642,4.857],[38.638,33.002,6.492,8.057],[51.306,40.618,5.938,4.746],[2.692,41.391,7.047,7.616],[5.701,46.358,4.038,8.72],[10.451,47.682,3.8,4.305],[60.174,48.124,3.959,4.415],[41.964,49.669,5.226,4.525],[28.108,59.603,9.66,4.525],[41.33,69.316,6.492,9.603],[3.721,72.848,2.059,3.642],[83.61,91.943,10.847,6.181]],"target":2,"a":"M. genioglossus","n":"Giver protrusion af tungen; forhindrer tungen i at falde bagud."},{"id":"ax18-o55","t":"ax18.tm","k":"occ","img":"tungemusk1","boxes":[[23.199,3.201,25.653,7.506],[72.288,35.651,23.436,7.506],[4.117,91.611,25.337,7.506],[50.198,92.274,21.378,7.506],[72.526,10.596,4.83,3.753],[29.612,18.212,6.255,3.753],[13.302,18.433,4.513,6.512],[71.655,21.634,7.205,8.278],[25.732,24.945,3.642,4.857],[38.638,33.002,6.492,8.057],[51.306,40.618,5.938,4.746],[2.692,41.391,7.047,7.616],[5.701,46.358,4.038,8.72],[10.451,47.682,3.8,4.305],[60.174,48.124,3.959,4.415],[41.964,49.669,5.226,4.525],[28.108,59.603,9.66,4.525],[41.33,69.316,6.492,9.603],[3.721,72.848,2.059,3.642],[83.61,91.943,10.847,6.181]],"target":3,"a":"M. hyoglossus","n":"Sænker tungen."},{"id":"ax19-t1","t":"ax19.tg","k":"text","q":"N. trigeminus ('trillingenerven', V): overordnet funktion?","a":"Sensorisk til ansigtet. Motorisk til tyggemusklerne samt 'de 2 T'er' (m. tensor veli palatini og m. tensor tympani), plus m. digastricus' venter anterior og m. mylohyoideus.","img":"r_ax19_7-2"},{"id":"ax19-t2","t":"ax19.tg","k":"text","q":"N. trigeminus: hvilke tre grene har den, og hvor udspringer den?","a":"N. ophthalmicus (V1, pande og næse), n. maxillaris (V2, overkæbe), n. mandibularis (V3, underkæbe).\nUdspringer lateralt på pons med radix sensoria (portio major) og radix motoria (portio minor). Ganglion trigeminale (semilunare) ligger på pars petrosa, hvorfra de tre grene afgår.","img":"r_ax19_7-2"},{"id":"ax19-t3","t":"ax19.tg","k":"text","q":"Hvilke tre foramina er udgangene for n. trigeminus' tre hovedgrene?","a":"Foramen supraorbitale (V1), foramen infraorbitale (V2), foramen mentale (V3).","img":"r_ax19_7-5"},{"id":"ax19-t4","t":"ax19.tg","k":"text","q":"N. ophthalmicus (V1): forløb og grene?","a":"Løber gennem fissura orbitalis superior. Deler sig i n. nasociliaris (afgiver nn. ethmoidales anterior et posterior til næsen/sinus ethmoidalis, samt nn. ciliares longi et breves til øjet; ender som n. infratrochlearis), n. frontalis (forsyner panden op til vertex, som nn. supraorbitalis og supratrochlearis) og n. lacrimalis (modtager parasympatiske fibre til gl. lacrimalis).","img":"r_ax19_8-0"},{"id":"ax19-t5","t":"ax19.tg","k":"text","q":"N. ophthalmicus (V1): sensorisk innervationsområde?","a":"Fra midt på ala nasi og den mediale øjenkrog, til den laterale øjenkrog (inkl. hele cornea), og videre bueformet langs linea temporalis inferior til vertex cranii.","img":"r_ax19_10-0"},{"id":"ax19-t6","t":"ax19.tg","k":"text","q":"N. maxillaris (V2): forløb og innervationsområde?","a":"Løber gennem foramen rotundum → fossa pterygopalatina → fissura orbitalis inferior, fortsætter som n. infraorbitalis → foramen infraorbitale.\nForsyner huden svarende til maxilla og os zygomaticum (mellemansigtet), overmund, gane, næse og svælg. Bærer ganglion pterygopalatinum (parasympatisk).","img":"r_ax19_11-2"},{"id":"ax19-t7","t":"ax19.tg","k":"text","q":"N. maxillaris (V2): hvilke grene afgiver den?","a":"N. zygomaticus (via os zygomaticum → rami zygomaticotemporalis et -facialis), nn. alveolares superiores posteriores (via foramina alveolaria) et anteriores (fra n. infraorbitalis), n. infraorbitalis, n. nasopalatinus, nn. palatini, r. pharyngeus, samt rr./nn. nasales posteriores superiores et inferiores og orbitale grene til orbita og sinus sphenoidalis.","img":"r_ax19_11-7"},{"id":"ax19-t8","t":"ax19.tg","k":"text","q":"N. maxillaris (V2): sensorisk innervationsområde?","a":"Fra mundvig/spalte, buet til midten af arcus zygomaticus, op til linea temporalis inferior (den forreste tindingeregion).","img":"r_ax19_12-0"},{"id":"ax19-t9","t":"ax19.tg","k":"text","q":"N. mandibularis (V3): forløb og deling?","a":"Forløber gennem foramen ovale. Indeholder hele radix motoria. Deler sig i en forreste stamme (overvejende motorisk, innerverer tyggemusklerne + de 2 T'er, men afgiver også den sensoriske n. buccalis højt oppe) og en bageste stamme (overvejende sensorisk, bærer ganglion).","img":"r_ax19_13-0"},{"id":"ax19-t10","t":"ax19.tg","k":"text","q":"N. mandibularis (V3): hvilke tre store grene afgiver den bageste stamme?","a":"**N. auriculotemporalis:** sensorisk foran øret, bærer postsynaptiske parasympatiske tråde fra CN IX via ganglion oticum.\n**N. lingualis:** sensorisk på tungens forreste 2/3, bærer smags- og parasympatiske tråde fra chorda tympani og ganglion submandibulare.\n**N. alveolaris inferior:** sensorisk til undermund, tænder, gingiva og hage; motorisk til venter anterior m. digastrici og m. mylohyoideus (via r. mylohyoideus, afgivet før foramen mandibulae).","img":"r_ax19_13-0"},{"id":"ax19-t11","t":"ax19.tg","k":"text","q":"N. mandibularis (V3): sensorisk innervationsområde?","a":"Følger 'isse-øre-hage-linjen': den midterste del af tindingeregionen samt tilstødende del af øremuslingen. Denne linje skiller n. trigeminus' innervationsområde fra de cervikale spinalnervers.","img":"r_ax19_14-0"},{"id":"ax19-t12","t":"ax19.ny","k":"text","q":"Hvordan opdeles næsen overordnet?","a":"I nasus externus (den ydre næse) og cavitas nasi (næsehulen).","img":"r_ax19_17-4"},{"id":"ax19-t13","t":"ax19.ny","k":"text","q":"Nasus externus: hvilke synlige strukturer har den, og hvilke knogler danner det ossøse skelet?","a":"**Synlige strukturer:** radix nasi, dorsum nasi, apex nasi, alae nasi, nares.\n**Ossøst skelet:** ossa nasales og processus frontales maxillae + corpus maxillae, som danner apertura piriformis og spina nasalis anterior.","img":"r_ax19_18-3"},{"id":"ax19-t14","t":"ax19.ny","k":"text","q":"Nasus externus: hvilke fire bruskstykker udgør det cartilaginøse skelet?","a":"**Cartilago septi nasi:** mellem lamina perpendicularis ossis ethmoidalis og vomer.\n**Cartilago nasi lateralis** (parret): svarer ca. til dorsum nasi.\n**Cartilago alaris major** (parret): forlængelse af foregående, støtter næsefløjene (dækker ikke hele alae nasi — her er fibroadipøst væv).\n**Cartilagines alares minores:** små, usammenhængende bruskplader i fibroadipøst væv.","img":"r_ax19_19-2"},{"id":"ax19-t15","t":"ax19.ny","k":"text","q":"Nasus externus: arterielle forsyning?","a":"A. dorsalis nasi (fra a. ophthalmica, fra a. carotis interna), a. angularis (fra a. facialis), r. nasalis externus a. ethmoidalis anterioris (fra a. ophthalmica). A. infraorbitalis anastomoserer med disse.","img":"r_ax19_20-2"},{"id":"ax19-t16","t":"ax19.ny","k":"text","q":"Nasus externus: venøs og lymfatisk drænage?","a":"**Vener:** vv. ophthalmicae et facialis. **Lymfe:** lnn. submandibulares.","img":"r_ax19_20-6"},{"id":"ax19-t17","t":"ax19.ny","k":"text","q":"Nasus externus: sensorisk og motorisk innervation?","a":"**Sensorisk:** øverste halvdel n. infratrochlearis (fra n. nasociliaris); nederste halvdel r. nasalis externus n. ethmoidalis anterioris (fra n. nasociliaris); lateralt n. infraorbitalis.\n**Motorisk:** n. facialis.","img":"r_ax19_21-3"},{"id":"ax19-t18","t":"ax19.cn","k":"text","q":"Cavitas nasi: hvilke to dele opdeles den i?","a":"**Vestibulum nasi:** hudbeklædt, fra kanten af nares til limen nasi (ca. 1,5 cm ind), med fedtkirtler og vibrissae (terminalhår) — en mukokutan grænsezone.\n**Cavitas nasi propria:** slimhindebeklædt, fra limen nasi til choanae, opdelt af septum nasi i to halvdele; beskrives med septum, loft, gulv og lateralvæg.","img":"r_ax19_22-2"},{"id":"ax19-t19","t":"ax19.cn","k":"text","q":"Septum nasi: hvilke to dele består den af?","a":"Forreste 1/3: cartilago septi nasi. Bageste 2/3: lamina perpendicularis ossis ethmoidalis og vomer.","img":"r_ax19_23-0"},{"id":"ax19-t20","t":"ax19.cn","k":"text","q":"Cavitas nasi propria: loft?","a":"Konkav rende: cartilagines → os nasale → os frontale → lamina cribrosa ossis ethmoidalis → corpus ossis sphenoidalis. Regio olfactoria er loftet, hvor fila olfactoria passerer.","img":"r_ax19_23-0"},{"id":"ax19-t21","t":"ax19.cn","k":"text","q":"Cavitas nasi propria: gulv?","a":"Proc. palatinus maxillae → lamina horizontalis ossis palatini → palatum molle. To åbninger samles med de modsidige i canalis incisivus, som er passage mellem næse og gane.","img":"r_ax19_23-0"},{"id":"ax19-t22","t":"ax19.cn","k":"text","q":"Hvad er regio olfactoria, og hvad hedder resten af cavitas nasi propria?","a":"Regio olfactoria er loftet i cavitas nasi propria (lamina cribrosa, septum nasi, concha nasalis superior) med særlig innervation fra n. olfactorius (I): fila olfactoria → bulbus olfactorius → tractus olfactorius → hjernen.\nAlt andet end regio olfactoria kaldes regio respiratoria.","img":"r_ax19_24-1"},{"id":"ax19-t23","t":"ax19.cn","k":"text","q":"Hvilke tre muslingeben (conchae) findes på lateralvæggen, og hvordan er de tilhæftet?","a":"**Concha nasalis inferior:** selvstændig knogle, tilhæftet proc. frontalis maxillae og lamina perpendicularis ossis palatini.\n**Concha nasalis media:** dannet af os ethmoidale, hænger frit, tilhæftet bagtil på lamina perpendicularis ossis palatini; agger nasi er dens forreste, frie kant.\n**Concha nasalis superior:** dannet af os ethmoidale, den mindste.","img":"r_ax19_24-1"},{"id":"ax19-t24","t":"ax19.cn","k":"text","q":"Hvad er choanae, og hvilke knogler danner dem?","a":"'De indre næsebor'. Dannet af vomer (septum), procc. pterygoidei (lateralvægge og loft) og lamina horizontalis ossis palatini (gulv).","img":"r_ax19_24-1"},{"id":"ax19-t25","t":"ax19.cn","k":"text","q":"Hvilke strukturer findes på cavitas nasis lateralvæg ud over conchae?","a":"Foramen sphenopalatinum (→ fossa pterygopalatina), proc. uncinatus ossis ethmoidalis, bulla ethmoidalis (en stor cellula ethmoidalis), hiatus semilunaris (mellem proc. uncinatus og bulla — udmunding for sinus frontalis og maxillaris), hiatus maxillaris (i hiatus semilunaris — udmunding for sinus maxillaris), samt udmundingen af ductus nasolacrimalis (under concha nasalis inferior).","img":"r_ax19_27-8"},{"id":"ax19-t26","t":"ax19.cn","k":"text","q":"Hvilke tre gange (meatus) findes under conchae, samt hvad er meatus nasopharyngeus?","a":"Meatus nasi superior, medius et inferior (under hver sin concha). Meatus nasopharyngeus ligger bag de tre conchae. Recessus sphenoethmoidalis (med apertura sinus sphenoidalis) ligger bagtil-øverst.","img":"r_ax19_27-8"},{"id":"ax19-t27","t":"ax19.cn","k":"text","q":"Cavitas nasi: arterielle forsyning af de bageste 2/3?","a":"A. maxillaris → a. sphenopalatina (gennem foramen sphenopalatinum), som afgiver septale og laterale grene. Anastomoserer fortil med a. palatina major (via canalis incisivus) og med a. labialis superior — Locus Kiesselbachi (hyppigt sted for næseblod).","img":"r_ax19_30-1"},{"id":"ax19-t28","t":"ax19.cn","k":"text","q":"Cavitas nasi: arterielle forsyning af den forreste 1/3?","a":"A. ophthalmica → aa. ethmoidales anterior et posterior, fra orbita gennem foramina ethmoidalia til fossa cranii anterior, videre gennem lamina cribrosa til cavitas nasi propria. Danner også septale og laterale grene. A. ethmoidalis anterior passerer desuden gennem foramen nasale til den ydre næse.","img":"r_ax19_30-1"},{"id":"ax19-t29","t":"ax19.cn","k":"text","q":"Cavitas nasi: nerveforsyning af de bageste 2/3 (regio respiratoria)?","a":"Fra n. maxillaris: n. nasopalatinus (gennem foramen sphenopalatinum, septalt mod canalis incisivus — forsyner septum og ganen ved os incisivum), n. nasalis posterior superior (rr. nasales posteriores superiores til lateralvæggen), n. palatinus major (rr./nn. nasales posteriores inferiores til lateralvæggen).","img":"r_ax19_31-0"},{"id":"ax19-t30","t":"ax19.cn","k":"text","q":"Cavitas nasi: nerveforsyning af den forreste 1/3?","a":"Fra n. nasociliaris (n. ophthalmicus): n. ethmoidalis anterior, som afgiver rr. nasales interni mediales et laterales samt r. nasalis externus til apex nasi. NB: n. ethmoidalis posterior forsyner IKKE cavitas nasi, men de posteriore cellulae ethmoidales og sinus sphenoidalis.","img":"r_ax19_31-0"},{"id":"ax19-t31","t":"ax19.si","k":"text","q":"Sinus paranasales: hvad er de, og hvor mange grupper findes?","a":"Pneumatiserede (luftfyldte) hulrum med forbindelse til næsehulen, beklædt med næsens slimhinde. Fire grupper: sinus maxillaris, sinus frontalis, sinus sphenoidalis, sinus ethmoidalis (cellulae ethmoidales).","img":"r_ax19_32-0"},{"id":"ax19-t32","t":"ax19.si","k":"text","q":"Sinus maxillaris: afgrænsning?","a":"**Medialt:** corpus maxillae, os palatinum, concha nasalis inferior. **Forvæg:** gennemløbes af kanaler fra canalis infraorbitalis. **Bagvæg:** adskilt fra fossa pterygopalatina og regio infratemporalis. **Loft:** adskilt af et tyndt knoglelag fra orbita ('blow-out'-fraktur). **Gulv:** tæt relation til dentes molares 1 og 2.","img":"r_ax19_32-1"},{"id":"ax19-t33","t":"ax19.si","k":"text","q":"Sinus frontalis og sinus sphenoidalis: beliggenhed?","a":"**Sinus frontalis:** lige over margo supraorbitalis og radix nasi, kileformet.\n**Sinus sphenoidalis:** i centrum af corpus ossis sphenoidalis, med relation til hypofysen, n. opticus og sinus cavernosus.","img":"r_ax19_32-4"},{"id":"ax19-t34","t":"ax19.si","k":"text","q":"Sinus ethmoidalis: opbygning?","a":"Består af talrige cellulae ethmoidales (del af labyrinthus ethmoidalis), inddelt i forreste, midterste og bageste cellulae ethmoidales.","img":"r_ax19_32-4"},{"id":"ax19-t35","t":"ax19.si","k":"text","q":"Hvor munder sinus maxillaris og sinus sphenoidalis ud?","a":"**Sinus maxillaris:** i meatus nasi medius, via hiatus maxillaris og semilunaris (ofte med ekstra accessorisk åbning).\n**Sinus sphenoidalis:** i recessus sphenoethmoidalis, via apertura sinus sphenoidalis.","img":"r_ax19_34-2"},{"id":"ax19-t36","t":"ax19.si","k":"text","q":"Hvor munder sinus frontalis og cellulae ethmoidales ud?","a":"**Sinus frontalis:** i meatus nasi medius — enten via egen gang i pars nasalis ossis frontalis (til øvre del af hiatus semilunaris) eller via fælles gang med de forreste cellulae ethmoidales (infundibulum ethmoidale).\n**Forreste cellulae ethmoidales:** meatus nasi medius (via bulla ethmoidalis → hiatus semilunaris). **Bageste cellulae ethmoidales:** meatus nasi superior.","img":"r_ax19_34-2"},{"id":"ax19-t37","t":"ax19.ph","k":"text","q":"Pharynx (svælget): funktion og udstrækning?","a":"Både respirationsvej (næsehule–larynx) og fordøjelseskanal (mundhule–oesophagus). Strækker sig fra basis cranii til cartilago cricoidea (C6). Slimhindebeklædt, tragtformet, fibromuskulært rør.","img":"r_ax19_36-4"},{"id":"ax19-t38","t":"ax19.ph","k":"text","q":"Pharynx: hvilke tre dele inddeles den i?","a":"Pars nasalis pharyngis (nasopharynx/rhinopharynx), pars oralis pharyngis (oropharynx/mesopharynx), pars laryngea pharyngis (laryngopharynx/hypopharynx).","img":"r_ax19_36-4"},{"id":"ax19-t39","t":"ax19.ph","k":"text","q":"Pharynx: hvordan er den afgrænset på basis cranii?","a":"**Ventralt:** choanae. **Lateralt:** lamina medialis proc. pterygoidei. **Dorsalt:** tuberculum pharyngeum på pars basilaris ossis occipitalis.","img":"r_ax19_37-2"},{"id":"ax19-t40","t":"ax19.ph","k":"text","q":"Nasopharynx: udstrækning og loft?","a":"Fra choanae til palatum molle. Loftet ('fornix pharyngis') dannes af corpus ossis sphenoidalis, vomer og pars basilaris ossis occipitalis → tuberculum pharyngeum, og bærer tonsilla pharyngealis.","img":"r_ax19_38-3"},{"id":"ax19-t41","t":"ax19.ph","k":"text","q":"Nasopharynx: bagvæg, forvæg/indgang, sidevæg og gulv?","a":"**Bagvæg:** atlas og dens axis. **Forvæg/indgang:** choanae. **Sidevæg:** muskulær (m. constrictor pharyngis superior med strukturer i). **Gulv:** palatum molle og isthmus pharyngonasalis.","img":"r_ax19_38-5"},{"id":"ax19-t42","t":"ax19.ph","k":"text","q":"Nasopharynx' sidevæg: hvilke strukturer?","a":"Ostium pharyngeum tubae auditivae (tuba auditiva, et par cm bag concha nasalis inferior), torus tubarius (cartilago tubae auditivae), plica salpingopalatina (ikke muskeldannet), plica salpingopharyngea (dannet af m. salpingopharyngeus), torus levatorius (dannet af m. levator veli palatini), recessus pharyngeus (Rosenmülleri).","img":"r_ax19_39-2"},{"id":"ax19-t43","t":"ax19.ph","k":"text","q":"Tuba auditiva (det Eustachiske rør): forbindelse og opbygning?","a":"Forbinder mellemøret med svælget. Løber nedad, fremad, medialt. Forreste 2/3 cartilaginøs (pars cartilaginea), bageste 1/3 ossøs (pars ossea). Isthmus tubae auditivae er det snævreste sted (overgang knogle/brusk). Har to ostier: ostium tympanicum og ostium pharyngeum tubae auditivae.","img":"r_ax19_41-0"},{"id":"ax19-t44","t":"ax19.ph","k":"text","q":"Tuba auditiva: hvordan holdes lumen udspilet?","a":"Pars cartilaginea har cartilago tubae auditivae med laminae medialis et lateralis, forbundet af lamina membranacea (tværsnit formet som et komma). Mm. tensor veli palatini og salpingopharyngeus har fibre, der hæfter i lamina membranacea og bidrager til at udspile lumen.","img":"r_ax19_41-0"},{"id":"ax19-t45","t":"ax19.ph","k":"text","q":"Oropharynx: udstrækning og bagvæg?","a":"Fra palatum molle til epiglottis. **Bagvæg:** corpora af C2–C3, mm. longi colli et capitis.","img":"r_ax19_42-5"},{"id":"ax19-t46","t":"ax19.ph","k":"text","q":"Oropharynx: forvæg og sidevæg?","a":"**Forvæg** (opadtil isthmus faucium, nedadtil pars postsulcalis dorsi linguae og epiglottis, med vallecula epiglottica og plicae glossoepiglotticae). **Sidevæg:** mm. constrictores pharyngis superior et medius, arcus palatoglossus et palatopharyngeus + fossa tonsillaris.","img":"r_ax19_42-5"},{"id":"ax19-t47","t":"ax19.ph","k":"text","q":"Tonsilla palatina: beliggenhed og relationer?","a":"Ligger i fossa tonsillaris. Relationer til aa. carotides interna, externa og/eller facialis, samt CN IX, X, XI, XII og truncus sympathicus. Forsynes bl.a. af a. carotis externa, a. palatina ascendens, a. pharyngea ascendens, aa. palatinae minores m.fl.","img":"r_ax19_43-0"},{"id":"ax19-t48","t":"ax19.ph","k":"text","q":"Hvad er Waldeyer's svælgring?","a":"Tonsilla pharyngealis (polypperne), tonsilla palatina (mandlerne) og tonsilla lingualis (postsulcalt på tungen).","img":"r_ax19_43-1"},{"id":"ax19-t49","t":"ax19.ph","k":"text","q":"Laryngopharynx: udstrækning og forvæg?","a":"Fra epiglottis til cartilago cricoidea. **Forvæg:** aditus laryngis, recessus piriformis (dannet af larynx), cartilagines arytenoideae et cricoidea.","img":"r_ax19_44-4"},{"id":"ax19-t50","t":"ax19.ph","k":"text","q":"Laryngopharynx: bagvæg og sidevægge, samt de gennemgående rum?","a":"**Bagvæg:** corpora C3–C6 og mm. longus capitis et colli. **Sidevægge:** mm. constrictores pharyngis medius et inferior.\nSpatium retropharyngeum (bagtil) og spatium lateropharyngeum (lateralt) gælder for hele pharynx.","img":"r_ax19_44-4"},{"id":"ax19-t51","t":"ax19.sm","k":"text","q":"Svælgets muskler: hvordan inddeles de overordnet?","a":"I cirkulære fibre (konstriktorerne, 3 stk.) og longitudinelle fibre (levatorerne, 3 stk.).","img":"r_ax19_45-3"},{"id":"ax19-t52","t":"ax19.sm","k":"text","q":"Hvilke tre pharynx-konstriktorer findes, og hvordan er de arrangeret?","a":"M. constrictor pharyngis superior, medius, inferior. Udspringer alle ventralt og insererer dorsalt i raphe pharyngis (som hæfter på tuberculum pharyngeum). De rager ind over hinanden nedefra og op, som tre kræmmerhuse i hinanden.","img":"r_ax19_45-3"},{"id":"ax19-t53","t":"ax19.sm","k":"text","q":"Hvad er fascia pharyngobasilaris?","a":"Ligger mellem basis cranii og m. constrictor pharyngis superior; afstiver nasopharynx under respirationen. Mm. levator og tensor veli palatini samt tuba auditiva passerer gennem denne fascie mod ganen.","img":"r_ax19_45-3"},{"id":"ax19-t54","t":"ax19.sm","k":"text","q":"M. constrictor pharyngis superior: udspring og insertion?","a":"**Udspring:** lamina medialis proc. pterygoidei, raphe pterygomandibularis, bageste del af linea mylohyoidea, tungens siderand. **Insertion:** raphe pharyngis og tuberculum pharyngeum.","img":"r_ax19_48-4"},{"id":"ax19-t55","t":"ax19.sm","k":"text","q":"M. constrictor pharyngis medius og inferior: udspring og insertion?","a":"**Medius:** udspring cornu majus et minus ossis hyoidei samt lig. stylohyoideum; insertion raphe pharyngis.\n**Inferior:** udspring linea obliqua (på cartilago thyroidea) og cartilago cricoidea; insertion raphe pharyngis.","img":"r_ax19_49-4"},{"id":"ax19-t56","t":"ax19.sm","k":"text","q":"Hvilke tre pharynx-levatorer findes?","a":"M. stylopharyngeus, m. palatopharyngeus, m. salpingopharyngeus.","img":"r_ax19_50-1"},{"id":"ax19-t57","t":"ax19.sm","k":"text","q":"M. stylopharyngeus og m. salpingopharyngeus: udspring og insertion?","a":"**M. stylopharyngeus:** udspring proc. styloideus, breder sig ud sammen med m. palatopharyngeus og insererer på bagkanten af cartilago thyroidea. N. glossopharyngeus løber sammen med musklen mellem øvre og mellemste konstriktor til tungen.\n**M. salpingopharyngeus:** udspring lamina medialis cartilaginis tubae auditivae, insertion i den laterale pharynxvæg.","img":"r_ax19_50-2"},{"id":"ax19-t58","t":"ax19.sm","k":"text","q":"Pharynx-konstriktorernes funktion?","a":"Bruges ved synkning; kan konstriktere (indsnævre) pharynx, så bolus (fødebollen) presses ned gennem svælget. Er tværstribede — i modsætning til stort set resten af mave-tarm-kanalen.","img":"r_ax19_46-3"},{"id":"ax19-t59","t":"ax19.sm","k":"text","q":"Pharynx-levatorernes funktion?","a":"Løfter generelt pharynx og medvirker i synkeprocessen. M. stylopharyngeus løfter desuden larynx. M. salpingopharyngeus hjælper til åbning af tuba auditiva (derfor trykudligner man ved synkning). M. palatopharyngeus løfter pharynx superiort/anteriort/medialt og afstiver palatum molle.","img":"r_ax19_46-3"},{"id":"ax19-t60","t":"ax19.pk","k":"text","q":"Pharynx: arterielle forsyning?","a":"A. pharyngea ascendens (fra a. carotis externa), a. thyroidea superior (fra a. carotis externa), a. palatina ascendens (fra a. facialis).","img":"r_ax19_54-1"},{"id":"ax19-t61","t":"ax19.pk","k":"text","q":"Pharynx: venøs drænage?","a":"Plexus pharyngeus."},{"id":"ax19-t62","t":"ax19.pk","k":"text","q":"Pharynx: nerveforsyning fordelt på de tre dele?","a":"**Nasopharynx:** rr. pharyngei n. maxillaris. **Oropharynx:** n. glossopharyngeus (dog ikke vallecula epiglottica). **Laryngopharynx:** r. internus n. laryngei superioris (fra n. vagus), som passerer ved overkanten af nedre konstriktor. Plexus pharyngeus samler disse med sympatiske fibre.","img":"r_ax19_54-3"},{"id":"ax19-t63","t":"ax19.pk","k":"text","q":"Synkeprocessen: den orale fase?","a":"Voluntær. Starter når tygningen er slut. Tungen løftes (primært mm. mylohyoideus et styloglossus), og fødebollen glider bagud mod et lukket isthmus faucium.","img":"r_ax19_52-2"},{"id":"ax19-t64","t":"ax19.pk","k":"text","q":"Synkeprocessen: den pharyngeale fase?","a":"Involuntær. Isthmus faucium åbnes, svælget trækkes op omkring fødebollen, isthmus pharyngonasalis lukkes (Passavant's muskelvulst), aditus laryngis lukkes pga. de suprahyoide muskler, og føden passerer i to strømme gennem recessus piriformis.","img":"r_ax19_52-2"},{"id":"ax19-t65","t":"ax19.pk","k":"text","q":"Synkeprocessen: den oesophageale fase?","a":"Involuntær. Peristaltiske kontraktioner i oesophagus fører føden videre.","img":"r_ax19_52-2"},{"id":"ax19-o66","t":"ax19.ny","k":"occ","img":"nasusext","boxes":[[42.424,3.374,40.488,19.836],[10.522,14.11,23.822,9.1],[23.148,20.859,62.71,46.728],[77.441,63.804,13.215,6.851],[14.141,82.618,36.953,6.953],[63.047,84.56,22.811,5.624]],"target":0,"a":"Dorsum nasi","n":"Næseryggen."},{"id":"ax19-o67","t":"ax19.ny","k":"occ","img":"nasusext","boxes":[[42.424,3.374,40.488,19.836],[10.522,14.11,23.822,9.1],[23.148,20.859,62.71,46.728],[77.441,63.804,13.215,6.851],[14.141,82.618,36.953,6.953],[63.047,84.56,22.811,5.624]],"target":1,"a":"Apex nasi","n":"Næsespidsen."},{"id":"ax19-o68","t":"ax19.si","k":"occ","img":"ethmoidceller","boxes":[[53.678,6.836,26.693,2.344],[67.285,14.421,24.251,2.311],[80.501,22.038,17.871,5.241],[38.542,17.09,2.669,1.66],[34.18,21.061,1.009,2.214],[57.682,22.656,1.953,1.139],[29.883,25.781,1.465,1.79],[26.53,26.139,1.53,2.018],[37.793,27.474,6.836,7.227],[50.098,50.651,1.107,2.441],[59.017,52.474,10.905,5.599],[38.021,54.98,4.818,2.962],[37.923,59.245,13.965,10.124],[43.294,69.206,3.971,1.986],[58.822,77.311,4.883,2.799],[66.309,78.418,1.595,2.083],[64.03,78.776,0.977,1.335],[28.743,94.01,42.35,4.264]],"target":0,"a":"Cellulae ethmoidales anteriores","n":"Forreste gruppe af cellulae ethmoidales; udmunder i meatus nasi medius."},{"id":"ax19-o69","t":"ax19.si","k":"occ","img":"ethmoidceller","boxes":[[53.678,6.836,26.693,2.344],[67.285,14.421,24.251,2.311],[80.501,22.038,17.871,5.241],[38.542,17.09,2.669,1.66],[34.18,21.061,1.009,2.214],[57.682,22.656,1.953,1.139],[29.883,25.781,1.465,1.79],[26.53,26.139,1.53,2.018],[37.793,27.474,6.836,7.227],[50.098,50.651,1.107,2.441],[59.017,52.474,10.905,5.599],[38.021,54.98,4.818,2.962],[37.923,59.245,13.965,10.124],[43.294,69.206,3.971,1.986],[58.822,77.311,4.883,2.799],[66.309,78.418,1.595,2.083],[64.03,78.776,0.977,1.335],[28.743,94.01,42.35,4.264]],"target":1,"a":"Cellulae ethmoidales mediae","n":"Midterste gruppe af cellulae ethmoidales."},{"id":"ax19-o70","t":"ax19.si","k":"occ","img":"ethmoidceller","boxes":[[53.678,6.836,26.693,2.344],[67.285,14.421,24.251,2.311],[80.501,22.038,17.871,5.241],[38.542,17.09,2.669,1.66],[34.18,21.061,1.009,2.214],[57.682,22.656,1.953,1.139],[29.883,25.781,1.465,1.79],[26.53,26.139,1.53,2.018],[37.793,27.474,6.836,7.227],[50.098,50.651,1.107,2.441],[59.017,52.474,10.905,5.599],[38.021,54.98,4.818,2.962],[37.923,59.245,13.965,10.124],[43.294,69.206,3.971,1.986],[58.822,77.311,4.883,2.799],[66.309,78.418,1.595,2.083],[64.03,78.776,0.977,1.335],[28.743,94.01,42.35,4.264]],"target":2,"a":"Cellulae ethmoidales posteriores","n":"Bageste gruppe af cellulae ethmoidales; udmunder i meatus nasi superior."},{"id":"ax20-t1","t":"ax20.oy","k":"text","q":"Hvordan inddeles øret overordnet?","a":"I tre dele: auris externa (det ydre øre), auris media (mellemøret), auris interna (det indre øre).","img":"r_ax20_6-2"},{"id":"ax20-t2","t":"ax20.oy","k":"text","q":"Auris externa: hvilke to dele består den af?","a":"Øremuslingen (auricula) og den ydre øregang (meatus acusticus externus).","img":"r_ax20_7-2"},{"id":"ax20-t3","t":"ax20.oy","k":"text","q":"Auricula (øremuslingen): opbygning og vigtigste strukturer?","a":"Hud omkring en plade af elastisk brusk. Nedadtil består lobulus auricularis af fedtvæv. Tragus dækker indgangen til øregangen.\nStrukturer: helix og antihelix, tuberculum auriculare (Darwini), tragus og antitragus, concha, porus acusticus externus.","img":"r_ax20_7-2"},{"id":"ax20-t4","t":"ax20.oy","k":"text","q":"Meatus acusticus externus: opbygning og form?","a":"Laterale 2/3 er brusk, mediale 1/3 er knogle. S-formet forløb: frem og op, derefter bagud og op, derefter frem og ned.\nIndeholder gll. ceruminosae, som danner cerumen (ørevoks).","img":"r_ax20_7-2"},{"id":"ax20-t5","t":"ax20.oy","k":"text","q":"Membrana tympanica (trommehinden): opbygning?","a":"Epitelbeklædt, fibrøs hinde, kun 0,1 mm tyk. Vender skråt, så lateralfladen vender nedad og fremad. Medialt er den vokset sammen med manubrium mallei (danner stria mallearis). Det centrale parti er trukket ind (umbo). Lysreflexen ses altid antero-inferiort for umbo.","img":"r_ax20_8-2"},{"id":"ax20-t6","t":"ax20.oy","k":"text","q":"Membrana tympanica: hvordan er den fæstnet, og hvad er pars flaccida/tensa?","a":"Fæstnet til pars tympanica ossis temporalis via sulcus tympanicus. En afbrydelse heraf superiort giver forreste og bageste hammerfold (hvor membranen fæstner til proc. lateralis mallei). Mellem hammerfolderne ligger pars flaccida; alt andet er pars tensa.","img":"r_ax20_8-3"},{"id":"ax20-t7","t":"ax20.oy","k":"text","q":"Auris externa: arterielle forsyning?","a":"A. auricularis posterior (direkte fra a. carotis externa), a. temporalis superficialis (endegren af a. carotis externa), a. auricularis profunda (fra a. maxillaris, til meatus externus og trommehinden).","img":"r_ax20_9-0"},{"id":"ax20-t8","t":"ax20.oy","k":"text","q":"Auris externa: venøs og lymfatisk drænage?","a":"Venerne følger arterierne. Lymfen drænerer til lnn. parotidei (herunder preauriculares) og lnn. mastoidei."},{"id":"ax20-t9","t":"ax20.oy","k":"text","q":"Auris externa: nerveforsyning?","a":"N. occipitalis minor (fra plexus cervicalis, bagsiden af øret), n. auriculotemporalis (fra n. mandibularis V3, øregang og trommehindens laterale flade), n. auricularis magnus (fra plexus cervicalis), r. auricularis n. vagi (resterende øregang), n. auricularis posterior (fra n. facialis, concha)."},{"id":"ax20-t10","t":"ax20.om","k":"text","q":"Auris media (mellemøret): hvilke tre dele består den af?","a":"Cavitas tympanica (trommehulen) med indhold, antrum mastoideum + cellulae mastoideae, tuba auditiva (det Eustachiske rør).","img":"r_ax20_11-2"},{"id":"ax20-t11","t":"ax20.om","k":"text","q":"Cavitas tympanica: beliggenhed, form og kommunikationer?","a":"Slimhindebeklædt, luftfyldt rum i pars petrosa ossis temporalis. Form som en bikonkav linse (frontalt), men beskrives som en 'terning' med loft, gulv, medial-, lateral-, for- og bagvæg. Opdeles i epitympanon, mesotympanon og hypotympanon.\nKommunikerer med pharynx via tuba auditiva og med antrum mastoideum via aditus ad antrum.","img":"r_ax20_12-2"},{"id":"ax20-t12","t":"ax20.om","k":"text","q":"Cavitas tympanica: loft og gulv?","a":"**Loft (paries tegmentalis):** tegmen tympani (knogleplade) — grænser til fossa cranii media; dækker anteriort m. tensor tympani, posteriort antrum mastoideum.\n**Gulv (paries jugularis):** tynd knogleplade mod fossa jugularis og bulbus superior v. jugularis internae; lille åbning for n. tympanicus.","img":"r_ax20_15-1"},{"id":"ax20-t13","t":"ax20.om","k":"text","q":"Cavitas tympanica: medialvæg (paries labyrinthicus)?","a":"Promontorium (fremkaldt af cochlea), plexus tympanicus, fenestra vestibuli (ovalis, til vestibulum/scala vestibuli), fenestra cochleae (rotunda, til scala tympani, lukket af membrana tympanica secundaria), processus cochleariformis, prominentia canalis facialis, prominentia canalis semicircularis lateralis.","img":"r_ax20_16-5"},{"id":"ax20-t14","t":"ax20.om","k":"text","q":"Cavitas tympanica: lateralvæg og forvæg?","a":"**Lateralvæg (pars membranaceus):** membrana tympanica, chorda tympani.\n**Forvæg (paries caroticus):** lav (pga. tegmen tympani descenderer); nedadtil bagvæggen af canalis caroticus og a. carotis interna; opadtil canalis musculotubarius, opdelt af septum canalis musculotubarii i semicanalis m. tensoris tympani og semicanalis tubae auditivae. Ostium tympanicum tubae auditivae fører til den sidste.","img":"r_ax20_18-4"},{"id":"ax20-t15","t":"ax20.om","k":"text","q":"Cavitas tympanica: bagvæg (paries mastoideus)?","a":"Ligger foran antrum og cellulae mastoideae. N. facialis løber i canalis facialis her. Opadtil findes aditus ad antrum (fra epitympanon til antrum mastoideum). Eminentia pyramidalis' top perforeres af m. stapedius. Åbningen til chorda tympani (canaliculus posterior) findes også her.","img":"r_ax20_19-1"},{"id":"ax20-t16","t":"ax20.om","k":"text","q":"Antrum mastoideum og cellulae mastoideae: beliggenhed?","a":"Pneumatiseret fra trommehulen. Antrum ligger bag cavitas tympanica og fører videre til cellulae mastoideae. Indgangen kaldes aditus ad antrum. Taget er stadig tegmen tympani. Antrum ligger lavere end indgangen.","img":"r_ax20_22-2"},{"id":"ax20-t17","t":"ax20.om","k":"text","q":"Ossicula auditus (øreknoglerne): hvilke tre er der, og hvad er huskereglen for deres forbindelser?","a":"Malleus (hammeren), incus (ambolten), stapes (stigbøjlen) — MIS.\nForbindelseskæden: membrana tympanica → cavitas tympanica → fenestra vestibuli.","img":"r_ax20_23-0"},{"id":"ax20-t18","t":"ax20.om","k":"text","q":"Malleus: opbygning?","a":"Caput mallei med ledfacet til incus. Manubrium mallei med processus lateralis et anterior. Caput er fæstnet via ligamenter til epitympanon. Manubrium er sammenvokset med membrana tympanica (danner stria mallearis). Proc. lateralis danner prominentia mallearis.","img":"r_ax20_23-3"},{"id":"ax20-t19","t":"ax20.om","k":"text","q":"Incus og stapes: opbygning?","a":"**Incus:** corpus incudis (fæstnet i epitympanon), crus longum (parallelt med manubrium mallei, artikulerer med caput stapedis).\n**Stapes:** caput stapedis, crura anterius et posterius, basis stapedis (vender medialt og fæstner mod randen af fenestra vestibuli).","img":"r_ax20_23-4"},{"id":"ax20-t20","t":"ax20.om","k":"text","q":"Øreknoglernes muskler: hvilke to, og hvad er deres udspring/insertion/innervation?","a":"**M. tensor tympani:** udspring væggene i semicanalis m. tensoris tympani, insertion manubrium mallei, innervation n. tensor tympani (fra n. mandibularis V3).\n**M. stapedius:** udspring inde i eminentia pyramidalis, insertion caput stapedis, innervation n. stapedius (fra n. facialis).","img":"r_ax20_24-1"},{"id":"ax20-t21","t":"ax20.om","k":"text","q":"Øreknoglemusklernes fælles funktion?","a":"Dæmpning af amplifikationsmekanismen i øret: m. tensor tympani udspænder membrana tympanica, og m. stapedius trækker basis stapedis væk fra fenestra vestibuli — begge mindsker transmissionen af kraftige lydbølger."},{"id":"ax20-t22","t":"ax20.nf","k":"text","q":"N. facialis (CN VII): hvad innerverer den motorisk og med parasympatiske tråde?","a":"**Motorisk:** de mimiske ansigtsmuskler, platysma, m. stylohyoideus, venter posterior m. digastrici, venter occipitalis m. epicranii, m. stapedius.\n**Parasympatisk:** gl. lacrimalis, gl. submandibularis, gl. sublingualis, samt næsens, ganens og mundens kirtler.\n**Smag:** forreste 2/3 af tungen (papillae fungiformes et foliatae) via chorda tympani.","img":"r_ax20_28-1"},{"id":"ax20-t23","t":"ax20.nf","k":"text","q":"N. facialis: udspring og de to rødder?","a":"Udspringer med to rødder — n. facialis (motorisk) og n. intermedius (sensoriske + parasympatiske fibre) — på overkanten af medulla oblongata, mellem CN VI (medialt) og CN VIII (lateralt). Løber ind i meatus acusticus internus sammen med n. intermedius og n. vestibulocochlearis.","img":"r_ax20_29-2"},{"id":"ax20-t24","t":"ax20.nf","k":"text","q":"N. facialis: hvordan er canalis facialis inddelt i tre stykker?","a":"**1. stykke:** anterolateralt (til medialt for proc. cochleariformis); nerven danner ganglion geniculi (somata for afferente fibre) og drejer 130° (geniculum n. facialis).\n**2. stykke:** posterolateralt, danner prominentia canalis facialis.\n**3. stykke:** kaudalt, i bagvæggen af cavitas tympanica; forlader kraniet gennem foramen stylomastoideum.","img":"r_ax20_29-2"},{"id":"ax20-t25","t":"ax20.nf","k":"text","q":"N. petrosus major: udspring og forløb?","a":"Afgår fra n. facialis i overgangen mellem 1. og 2. stykke. Indeholder præganglionære parasympatiske fibre. Kommer ud i fossa cranii media gennem hiatus canalis nervi petrosi majoris, fortsætter medialt mod foramen lacerum, og forenes med n. petrosus profundus (sympatisk, fra plexus caroticus internus) til n. canalis pterygoidei.","img":"r_ax20_31-2"},{"id":"ax20-t26","t":"ax20.nf","k":"text","q":"N. canalis pterygoidei: forløb og endestation?","a":"Løber gennem canalis pterygoideus ind i fossa pterygopalatina, hvor de parasympatiske fibre synapser i ganglion pterygopalatinum. Trådene fortsætter til gl. lacrimalis, næse og gane.","img":"r_ax20_31-2"},{"id":"ax20-t27","t":"ax20.nf","k":"text","q":"Chorda tympani: afgang og indhold?","a":"Afgår fra 3. stykke af n. facialis, lige efter n. stapedius. Indeholder smagstråde fra tungen og parasympatiske fibre.","img":"r_ax20_33-2"},{"id":"ax20-t28","t":"ax20.nf","k":"text","q":"Chorda tympani: forløb?","a":"Løber ind i den bageste del af cavitas tympanica (gennem canaliculus posterior), passerer forbi lateralvæggen i overkanten af membrana tympanica (mellem manubrium mallei og crus longum incudis), forlader cavum cranii gennem fissura petrotympanica (medialt for kæbeleddet), og løber fremad i spatium lateropharyngeum til n. lingualis.","img":"r_ax20_33-2"},{"id":"ax20-t29","t":"ax20.nf","k":"text","q":"Chorda tympani: hvad forsyner de parasympatiske tråde?","a":"De præganglionære tråde fortsætter til ganglion submandibulare, hvorfra gll. submandibularis et sublingualis samt kirtler i læber, mundbund, tunge og kinder forsynes parasympatisk, og smagstråde til pars presulcalis af tungen.","img":"r_ax20_33-2"},{"id":"ax20-t30","t":"ax20.nf","k":"text","q":"N. tympanicus: udspring og forløb?","a":"Kommer fra n. glossopharyngeus (IX). Indeholder sensoriske og parasympatiske tråde. Passerer ind i cavitas tympanica gennem gulvet (canaliculus tympanicus), lige efter n. glossopharyngeus har passeret foramen jugulare. Danner plexus tympanicus med nn. caroticotympanici (sympatiske, fra plexus caroticus internus).","img":"r_ax20_35-2"},{"id":"ax20-t31","t":"ax20.nf","k":"text","q":"N. petrosus minor: forløb og endestation?","a":"Forlader cavitas tympanica som n. petrosus minor, lateralt for n. petrosus major på pars petrosa. Løber medialt og frem mod enten foramen ovale eller fissura sphenopetrosa, og ender i ganglion oticum (synapse for de parasympatiske fibre). Herfra forsynes gl. parotidea parasympatisk via n. auriculotemporalis.","img":"r_ax20_35-2"},{"id":"ax20-t32","t":"ax20.lb","k":"text","q":"Larynx: funktion og beliggenhed?","a":"Respirationsvej, tonegenerator og sphincter — forbindelse mellem svælget og luftrøret. Ligger ventralt på halsen, ventralt for laryngopharynx, svarende til C4-C6 (fra underkanten af C3). Mobil under synkning. Danner 'Adamsæblet'.","img":"r_ax20_42-0"},{"id":"ax20-t33","t":"ax20.lb","k":"text","q":"Larynx: hvad dækker den udefra og ind?","a":"Hud (+ underhud og platysma), lamina superficialis fasciae cervicalis, lamina media/pretrachealis fasciae cervicalis, de infrahyoide muskler, og gl. thyroidea (dækker den inferiore del).","img":"r_ax20_42-0"},{"id":"ax20-t34","t":"ax20.lb","k":"text","q":"Larynx: hvilke seks brusk er den opbygget af?","a":"Cartilago thyroidea, cartilago cricoidea, cartilagines arytenoideae, cartilagines corniculatae, cartilagines cuneiformes, cartilago epiglottica. Larynx er opbygget af brusk som sikring mod sammenklapning — hyalin brusk, samt elastisk brusk (inkl. proc. vocalis).","img":"r_ax20_43-2"},{"id":"ax20-t35","t":"ax20.lb","k":"text","q":"Cartilago thyroidea: opbygning?","a":"2 laminae, prominentia laryngea, incisurae thyroideae superius et inferius, cornua superius et inferius (det nedre horn artikulerer med cartilago cricoidea). Bagfladen er beklædt med pharynxslimhinde og danner recessus piriformis. På linea obliqua hæfter m. sternothyroideus, m. thyrohyoideus og m. constrictor pharyngis inferior.","img":"r_ax20_44-2"},{"id":"ax20-t36","t":"ax20.lb","k":"text","q":"Cartilago epiglottica: beliggenhed, ligamenter og slimhindefolder?","a":"Ligger bag tungeroden og os hyoideum, foran aditus laryngis. Løber fra cartilago thyroidea bagud/opad. To ligamenter: lig. thyroepiglotticum og lig. hyoepiglotticum.\nSlimhinden slår sig over på radix linguae og danner vallecula epiglottica, plica glossoepiglottica mediana og plicae glossoepiglotticae laterales.","img":"r_ax20_45-0"},{"id":"ax20-t37","t":"ax20.lb","k":"text","q":"Cartilago cricoidea: opbygning?","a":"Lamina (bagtil, med 2 sæt ledfacetter til cartilagines thyroidea et arytenoideae), arcus (fortil, med lig. cricotracheale til trachea).","img":"r_ax20_46-1"},{"id":"ax20-t38","t":"ax20.lb","k":"text","q":"Cartilagines arytenoideae, corniculatae og cuneiformes?","a":"**Arytenoideae:** basis med ledfacet til cartilago cricoidea, proc. vocalis (ventromedialt), proc. muscularis (lateralt).\n**Corniculata** og **cuneiforme:** små, elastiske bruskstykker i plica aryepiglottica.","img":"r_ax20_46-1"},{"id":"ax20-t39","t":"ax20.lb","k":"text","q":"Hvilke tre ekstrinsiske ligamenter/membraner har larynx?","a":"Membrana thyrohyoidea (mellem cartilago thyroidea og os hyoideum), ligg. hyo- et thyroepiglottica (mellem os hyoideum/cartilago thyroidea og cartilago epiglottica), lig. cricotracheale (mellem cartilago cricoidea og 1. cartilago trachealis).","img":"r_ax20_48-0"},{"id":"ax20-t40","t":"ax20.lb","k":"text","q":"Membrana thyrohyoidea: opbygning og forstærkninger?","a":"Fibroelastisk membran fra overkanten af cartilago thyroidea (lamina og cornu superius) til underkanten af os hyoideum (corpus og cornu majus). Forstærkninger: lig. thyrohyoideum medianum og lig. thyrohyoideum laterale (indeholder cartilago triticea). Perforeres af r. internus n. laryngei superioris og a. laryngea superior.","img":"r_ax20_48-3"},{"id":"ax20-t41","t":"ax20.lb","k":"text","q":"Conus elasticus: udstrækning og hvad danner den?","a":"Strækker sig mellem overkanten af cartilago cricoidea og hæfter i midtlinjen på indersiden af cartilago thyroidea og på procc. vocales. Den øvre, frie rand er forstærket og danner ligg. vocalia (slimhindebeklædt: plicae vocales/stemmelæberne), forstærket fortil som lig. cricothyroideum medianum.","img":"r_ax20_50-3"},{"id":"ax20-t42","t":"ax20.lb","k":"text","q":"Membrana quadrangularis: udstrækning og hvad danner den?","a":"Spænder fra cartilago epiglottica (og indsiden af cartilago thyroidea) til cartilagines arytenoideae (fra proc. vocalis til cartilago corniculata). Danner opadtil (slimhindebeklædt) plica aryepiglottica (begrænser aditus laryngis lateralt), og nedadtil i sin frie rand ligg. vestibularia (slimhindebeklædt: plicae vestibulares, 'de falske stemmelæber').","img":"r_ax20_50-2"},{"id":"ax20-t43","t":"ax20.lb","k":"text","q":"Hvad hedder spalterne mellem hhv. plicae vestibulares og plicae vocales?","a":"Rima vestibuli (mellem plicae vestibulares) og rima glottidis (mellem plicae vocales).","img":"r_ax20_51-2"},{"id":"ax20-t44","t":"ax20.lb","k":"text","q":"Art. cricothyroidea: klassifikation og bevægelse?","a":"Lille ægte led mellem cartilago cricoidea og cornu inferius cartilaginis thyroideae. Små kippebevægelser (ca. 15°) omkring en transversal akse.","img":"r_ax20_52-1"},{"id":"ax20-t45","t":"ax20.lb","k":"text","q":"Art. cricoarytenoidea: klassifikation og bevægelse?","a":"Lille ægte led mellem overkanten af cartilago cricoidea og basis cartilaginis arytenoideae. Rotationsbevægelser omkring en vertikal akse, samt glidebevægelser medialt eller lateralt.","img":"r_ax20_52-1"},{"id":"ax20-t46","t":"ax20.lc","k":"text","q":"Cavitas laryngis: hvilke tre rum inddeles den i, og hvad er indgangen?","a":"Vestibulum laryngis (cavitas supraglottica), ventriculus laryngis, cavitas infraglottica — inddelt af plicae vocales et vestibulares. Indgangen fra pharynx er aditus laryngis.","img":"r_ax20_53-2"},{"id":"ax20-t47","t":"ax20.lc","k":"text","q":"Aditus laryngis: stilling og afgrænsning?","a":"Står nogenlunde i frontalplanet, dog rettet lidt opad. Begrænses af epiglottis (opadtil) og plicae aryepiglotticae (til siderne), samt incisura interarytenoidea. Indeholder tuberculum cuneiforme og tuberculum corniculatum.","img":"r_ax20_54-1"},{"id":"ax20-t48","t":"ax20.lc","k":"text","q":"Hvordan lukkes aditus laryngis ved synkning?","a":"De suprahyoide muskler og pharynxlevatorerne kontraheres → os hyoideum eleveres → membrana thyrohyoidea hiver cartilago thyroidea op → lig. hyoepiglotticum 'afslappes' → epiglottis sænkes ned over aditus og lukker.","img":"r_ax20_54-1"},{"id":"ax20-t49","t":"ax20.lc","k":"text","q":"Vestibulum laryngis: udstrækning og vægge?","a":"Fra aditus laryngis til rima vestibuli. **Forvæg:** epiglottis og lig. thyroepiglotticum (med tuberculum epiglotticum ved epiglottis' tilhæftede spids). **Sidevæg:** membrana quadrangularis. **Bagvæg:** incisura interarytenoidea og cartilagines arytenoideae. Lumen kan indsnævres af m. aryepiglotticus.","img":"r_ax20_55-2"},{"id":"ax20-t50","t":"ax20.lc","k":"text","q":"Ventriculus laryngis: beliggenhed og indhold?","a":"Mellem rima vestibuli og rima glottidis, skyder sig op lateralt for plicae vestibulares som sacculus laryngis. Plicae vestibulares (dannet af ligg. vestibularia) indeholder talrige kirtler og muskelfibre, som holder stemmelæberne fugtige.","img":"r_ax20_56-0"},{"id":"ax20-t51","t":"ax20.lc","k":"text","q":"Plicae vocales og rima glottidis: opbygning?","a":"Plicae vocales er dannet af ligg. vocalia og indeholder m. vocalis (del af m. thyroarytenoideus). Rima glottidis inddeles i pars intermembranacea og pars intercartilaginea.","img":"r_ax20_56-2"},{"id":"ax20-t52","t":"ax20.lc","k":"text","q":"Cavitas infraglottica: beliggenhed og form?","a":"Mellem rima glottidis og underkanten af cartilago cricoidea. Kuppelformet, sammentrykt fra side til side — bliver cirkulær ved overgangen til trachea.","img":"r_ax20_56-2"},{"id":"ax20-t53","t":"ax20.lc","k":"text","q":"Larynx' slimhinde: hvordan ser den ud generelt, og hvad er undtagelsen?","a":"Blegrød og kirtelbærende — undtagen over plicae vocales, hvor slimhinden er tynd og uden kirtler (tæt bundet til ligg. vocalia)."},{"id":"ax20-t54","t":"ax20.lm","k":"text","q":"Larynxmusklerne: hvordan inddeles de overordnet?","a":"**Intrinsiske** (6 stk.): styrer rima glottidis — m. cricothyroideus, m. cricoarytenoideus posterior, m. cricoarytenoideus lateralis, mm. arytenoidei, m. thyroarytenoideus (+ m. vocalis), m. aryepiglotticus.\n**Ekstrinsiske:** bevæger hele larynx — supra- og infrahyoide muskler samt m. palatopharyngeus, m. stylopharyngeus, m. constrictor pharyngis inferior.","img":"r_ax20_59-2"},{"id":"ax20-t55","t":"ax20.lm","k":"text","q":"M. cricothyroideus: udspring, insertion, funktion?","a":"**Udspring:** forfladen af arcus cartilaginis cricoideae, løber obliquinalt kranialt og dorsalt. **Insertion:** underkanten af cartilago thyroidea og cornu inferius cartilaginis thyroideae.\n**Funktion:** forlænger ligg. vocalia ved at kippe cartilago cricoidea.","img":"r_ax20_60-2"},{"id":"ax20-t56","t":"ax20.lm","k":"text","q":"M. cricoarytenoideus posterior: udspring, insertion, funktion?","a":"**Udspring:** mediant på bagsiden af lamina cartilaginis cricoideae. **Insertion:** proc. muscularis cartilaginis arytenoideae.\n**Funktion:** drejer proc. muscularis bagud og medialt — abduktion af ligg. vocalia (spænder også disse). Eneste abduktor af stemmelæberne!","img":"r_ax20_60-2"},{"id":"ax20-t57","t":"ax20.lm","k":"text","q":"M. cricoarytenoideus lateralis og mm. arytenoidei: udspring, insertion, funktion?","a":"**M. cricoarytenoideus lateralis:** udspring overkanten af arcus cartilaginis cricoideae, insertion fortil på proc. muscularis, funktion adducerer ligg. vocalia.\n**Mm. arytenoidei** (transversus + obliquus): udspring mellem bagfladerne af cartilagines arytenoideae, insertion i den modsidige cartilago arytenoidea, funktion adducerer pars intercartilaginea.","img":"r_ax20_61-0"},{"id":"ax20-t58","t":"ax20.lm","k":"text","q":"M. thyroarytenoideus og m. aryepiglotticus: udspring, insertion, funktion?","a":"**M. thyroarytenoideus:** udspring vinklen mellem de to laminae på cartilago thyroidea, insertion proc. muscularis + tilstødende del (den mediale del kaldes m. vocalis). Funktion: trækker cartilagines arytenoidae fremad og regulerer tensionen i stemmelæberne.\n**M. aryepiglotticus:** udstrækning svarer til membrana quadrangularis. Funktion: sphincter for vestibulum laryngis.","img":"r_ax20_62-1"},{"id":"ax20-t59","t":"ax20.lk","k":"text","q":"Larynx: arteriel forsyning?","a":"**A. laryngea superior:** fra a. thyroidea superior (a. carotis externa), løber mellem mm. constrictores pharyngis medius et inferior, gennem membrana thyrohyoidea.\n**A. laryngea inferior:** fra a. thyroidea inferior (truncus thyrocervicalis), løber under nedre kant af m. constrictor pharyngis inferior.\nArterierne forsyner hhv. over og under rima glottidis.","img":"r_ax20_64-1"},{"id":"ax20-t60","t":"ax20.lk","k":"text","q":"Larynx: lymfedrænage?","a":"Over de ægte stemmelæber: lnn. cervicales profundi. Under de ægte stemmelæber: samme, samt de tracheale lymfeknuder."},{"id":"ax20-t61","t":"ax20.lk","k":"text","q":"N. laryngeus superior: deling og forsyning?","a":"**R. externus:** fortsætter lateralt på nedre konstriktor, langs linea obliqua, ender i og forsyner m. cricothyroideus (motorisk).\n**R. internus:** perforerer membrana thyrohyoidea, danner plica nervi laryngei superioris i recessus piriformis, forsyner larynx ned til de ægte stemmelæber sensorisk og parasympatisk (IKKE motorisk).","img":"r_ax20_65-1"},{"id":"ax20-t62","t":"ax20.lk","k":"text","q":"N. laryngeus recurrens: forløb og forsyning?","a":"Fra n. vagus. Passerer under arcus aortae (venstre) eller a. subclavia dxt./truncus brachiocephalicus (højre), ascenderer mellem trachea og oesophagus, løber ind i larynx bag cartilago cricoideas lamina, dækket af nedre konstriktor.\nForsyner sensorisk under de ægte stemmelæber, og motorisk ALLE larynxmuskler undtagen m. cricothyroideus.","img":"r_ax20_66-1"},{"id":"ax20-t63","t":"ax20.lk","k":"text","q":"Trachea (pars cervicalis): udstrækning og relationer?","a":"Fortsætter fra cavitas infraglottica. Starter ved underkanten af cartilago cricoidea (C6), ender ved apertura thoracis superior. Forbundet til cricoidbrusken ved lig. cricotracheale. Forsiden dækkes af gl. thyroidea (isthmus).","img":"r_ax20_67-0"},{"id":"ax20-t64","t":"ax20.lk","k":"text","q":"Trachea: opbygning og naboforhold?","a":"Opbygget af cartilagines tracheales med mellemliggende ligg. anularia. Dækket af de infrahyoide muskler og laminae superficialis et pretrachealis fasciae cervicalis. Oesophagus ligger dorsalt (med n. laryngeus recurrens imellem). Lateralt: gl. thyroidea (lobi) og spatium lateropharyngeum."},{"id":"ax20-t65","t":"ax20.gt","k":"text","q":"Glandula thyroidea: størrelse, konsistens og opbygning?","a":"20-25 g, ca. 2×3×6 cm. Rødbrun, blød, fint lobuleret. Består af lobi dxt. et sin., isthmus glandulae thyroideae, og evt. en lobus pyramidalis (accessorisk thyroideavæv fra kirtlens embryologiske vandring gennem foramen caecum linguae). Hesteskoformet på tværsnit.","img":"r_ax20_69-0"},{"id":"ax20-t66","t":"ax20.gt","k":"text","q":"Glandula thyroidea: relationer?","a":"Lateralt for trachea og larynx. Isthmus dækker ventralt trachea (ring 2-4), 2-3 cm over incisura jugularis. V. jugularis anterior løber ventralt for kirtlen. Sidelapperne har relation til r. externus n. laryngei superioris.\nProfundt: larynx, trachea, pharynx, oesophagus, n. laryngeus recurrens; a. carotis communis ligger lateralt i en fure på kirtlen.","img":"r_ax20_70-2"},{"id":"ax20-t67","t":"ax20.gt","k":"text","q":"Glandula thyroidea: hvordan er den dækket og fikseret?","a":"**Dækket af:** hud, platysma, laminae superficialis et media/pretrachealis fasciae cervicalis, de infrahyoide muskler, og lateralt m. SCM.\n**Fiksation:** visceralfascie (afspaltet fra den pretracheale fascie) og en egen capsula fibrosa. Kar og gll. parathyroideae ligger mellem disse to fascielag.","img":"r_ax20_70-2"},{"id":"ax20-t68","t":"ax20.gt","k":"text","q":"Glandula thyroidea: arteriel forsyning?","a":"**A. thyroidea superior** (fra a. carotis externa): bue nedad mod øvre pol; deler sig i forreste gren (medialt til isthmus) og bageste gren (anastomose bagtil); afgiver også gren til m. SCM og a. laryngea superior.\n**A. thyroidea inferior** (fra truncus thyrocervicalis): bøjer medialt bag kar-nervestrengen; deler sig i øvre grene (anastomose) og nedre grene (nederste pol). Kan suppleres af en a. thyroidea ima.","img":"r_ax20_71-2"},{"id":"ax20-t69","t":"ax20.gt","k":"text","q":"Glandula thyroidea: venøs, lymfatisk og nervøs forsyning?","a":"**Vener:** v. thyroidea superior → v. jugularis interna eller v. facialis; v. thyroidea media → v. jugularis interna; v. thyroidea inferior → v. brachiocephalica.\n**Lymfe:** lnn. cervicales profundi.\n**Nerver:** vasomotoriske fibre fra truncus sympathicus.","img":"r_ax20_72-1"},{"id":"ax20-t70","t":"ax20.gt","k":"text","q":"Glandulae parathyroideae: antal, størrelse og hormonfunktion?","a":"4 stykker, halv- til helt ærtstore, tilsammen kun 0,10-0,30 g. Gullige pga. fedtvæv. 2 øvre og 2 nedre. Danner PTH (parathyroideahormon), vigtigt for calciumstofskiftet.","img":"r_ax20_73-0"},{"id":"ax20-t71","t":"ax20.gt","k":"text","q":"Glandulae parathyroideae: relationer, kar og nerver?","a":"Ligger på bagsiden af lobi glandulae thyroideae. De superiore ligger langs anastomosen mellem aa. thyroideae superior et inferior; de inferiore ligger langs a. thyroidea inferior. Kar og nerver: samme strukturer som gl. thyroidea.","img":"r_ax20_73-3"},{"id":"ax20-o72","t":"ax20.lb","k":"occ","img":"larynxbrusk","boxes":[[1.941,0.65,17.384,8.078],[70.717,0.0,18.987,8.171],[0.0,13.928,15.696,8.728],[70.717,12.256,23.629,4.828],[71.73,22.284,23.291,8.821],[3.966,26.37,15.865,8.078],[3.46,31.012,31.224,21.17],[5.738,3 a":"Cricoid cartilage — posterior lamina","n":"Ringbruskens bageste, brede plade."},{"id":"ax20-o87","t":"ax20.lb","k":"occ","img":"larynxbrusk","boxes":[[1.941,0.65,17.384,8.078],[70.717,0.0,18.987,8.171],[0.0,13.928,15.696,8.728],[70.717,12.256,23.629,4.828],[71.73,22.284,23.291,8.821],[3.966,26.37,15.865,8.078],[3.46,31.012,31.224,21.17],[5.738,38.069,13.333,4.921],[71.477,36.676,27.004,4.921],[72.321,45.218,27.679,4.921],[73.586,53.946,25.907,4.828],[4.557,54.41,20.759,8.821],[75.105,64.253,20.844,4.828],[3.544,65.645,27.426,4.828],[75.949,73.538,22.616,8.728],[9.03,74.28,22.363,4.178],[3.544,83.101,30.97,4.828],[55.781,7.521,8.017,8.449],[48.354,66.574,6.329,5.292]],"target":15,"a":"Conus elasticus","n":"Elastisk membran fra cricoidea op til stemmebåndene."},{"id":"ax20-o88","t":"ax20.lb","k":"occ","img":"larynxbrusk","boxes":[[1.941,0.65,17.384,8.078],[70.717,0.0,18.987,8.171],[0.0,13.928,15.696,8.728],[70.717,12.256,23.629,4.828],[71.73,22.284,23.291,8.821],[3.966,26.37,15.865,8.078],[3.46,31.012,31.224,21.17],[5.738,38.069,13.333,4.921],[71.477,36.676,27.004,4.921],[72.321,45.218,27.679,4.921],[73.586,53.946,25.907,4.828],[4.557,54.41,20.759,8.821],[75.105,64.253,20.844,4.828],[3.544,65.645,27.426,4.828],[75.949,73.538,22.616,8.728],[9.03,74.28,22.363,4.178],[3.544,83.101,30.97,4.828],[55.781,7.521,8.017,8.449],[48.354,66.574,6.329,5.292]],"target":16,"a":"Cricoid cartilage — arch","n":"Ringbruskens forreste, smalle bue."},{"id":"ax21-t1","t":"ax21.sl","k":"text","q":"Hvad er spatium lateropharyngeum, og hvad løber heri?","a":"Rummet hvor halsens kar-nervestreng løber, fra basis cranii externa til apertura thoracis superior, i en fælles bindevævsskede (vagina carotica).","img":"r_ax21_5-0"},{"id":"ax21-t2","t":"ax21.sl","k":"text","q":"Hvilke fire strukturer er gennemgående i spatium lateropharyngeum?","a":"A. carotis communis (→ a. carotis interna + a. carotis externa), v. jugularis interna, n. vagus, og (bagved) truncus sympathicus.","img":"r_ax21_5-0"},{"id":"ax21-t3","t":"ax21.sl","k":"text","q":"Spatium lateropharyngeum: afgrænsning på loftet, forvæg og bagvæg?","a":"**Loft:** basis cranii externa.\n**Forvæg:** linje fra bagkanten og roden af lamina medialis proc. pterygoidei, som tangerer foramen ovale (svarende til pterygoideermuren).\n**Bagvæg:** en transversel linje bag canalis n. hypoglossi.","img":"r_ax21_5-0"},{"id":"ax21-t4","t":"ax21.sl","k":"text","q":"Spatium lateropharyngeum: medial- og lateralvæg?","a":"**Medialvæg:** svælget + prævertebral muskulatur. **Lateralvæg:** gl. parotidea.","img":"r_ax21_5-0"},{"id":"ax21-t5","t":"ax21.sl","k":"text","q":"Hvordan er spatium lateropharyngeum formet kranielt og kaudalt for basis mandibulae?","a":"**Kranielt (firkantet):** medialvæg pharynx, bagvæg prævertebralmuskler + lamina prevertebralis, forvæg mm. pterygoidei, lateralvæg gl. parotidea.\n**Kaudalt (trekantet):** medialvæg halsviscera (pharynx, oesophagus, larynx, trachea), bagvæg prævertebralmuskler + lamina prevertebralis (igen), anterolateralvæg mm. SCM et omohyoideus + laminae superficialis et pretrachealis fasciae cervicalis.","img":"r_ax21_5-0"},{"id":"ax21-t6","t":"ax21.hs","k":"text","q":"Hvordan afgår hovedets og halsens arterier fra arcus aortae?","a":"**Venstre side:** separat afgang af a. carotis communis og a. subclavia.\n**Højre side:** truncus brachiocephalicus afgiver a. subclavia og a. carotis communis dxt.\nBegge aa. subclaviae har samme forløb efter art. sternoclavicularis; begge aa. carotides communes har samme forløb efter apertura thoracis superior.","img":"r_ax21_12-2"},{"id":"ax21-t7","t":"ax21.hs","k":"text","q":"A. subclavia: start og slut?","a":"**Start:** a. subclavia dxt. fra truncus brachiocephalicus; a. subclavia sin. fra arcus aortae.\n**Slut:** bliver til a. axillaris ved lateralkanten af costa I."},{"id":"ax21-t8","t":"ax21.hs","k":"text","q":"A. subclavia, 1. stykke: beliggenhed og relationer?","a":"Medialt for m. scalenus anterior. Hviler på cupula pleurae. Dækkes af mm. SCM et sternohyoideus samt v. subclavia (anteriort/inferiort).\n**Højre:** krydses af n. vagus dxt. (afgiver n. laryngeus recurrens) og n. phrenicus dxt.\n**Venstre:** krydses af ductus thoracicus og n. phrenicus sin.","img":"r_ax21_13-0"},{"id":"ax21-t9","t":"ax21.hs","k":"text","q":"A. subclavia, 2. og 3. stykke: beliggenhed?","a":"**2. stykke:** bag m. scalenus anterior, sammen med trunci fra plexus brachialis; v. subclavia løber foran, adskilt af m. scalenus anterior.\n**3. stykke:** lateralt for m. scalenus anterior, hviler på costa I; truncus inferior ligger lige bagved, v. subclavia foran. Ligger fri af m. SCM i fossa supraclavicularis major og kan komprimeres mod costa I.","img":"r_ax21_15-0"},{"id":"ax21-t10","t":"ax21.hs","k":"text","q":"A. subclavia: hvilke fire grene afgiver den, og fra hvilket stykke?","a":"A. vertebralis (1. stykke), truncus thyrocervicalis (1. stykke), a. thoracica interna (1. stykke), truncus costocervicalis (2. stykke)."},{"id":"ax21-t11","t":"ax21.hs","k":"text","q":"A. vertebralis: forløb og grene?","a":"Fra bagsiden af a. subclavia til foramen transversarium på C6 (oftest), gennem foramina transversaria op til atlas, bagom massa lateralis og gennem membrana atlantooccipitalis posterior. Ender med modsidige og danner a. basilaris.\n**Afgiver:** rami spinales (segmentært), a. cerebelli inferior posterior, aa. spinales posteriores (2 stk., longitudinelt), a. spinalis anterior (longitudinelt).","img":"r_ax21_17-1"},{"id":"ax21-t12","t":"ax21.hs","k":"text","q":"Truncus thyrocervicalis: hvilke tre grene afgiver den?","a":"**A. suprascapularis:** lateralt langs clavicula, over lig. transversum scapulae superius, til fossae supra- et infraspinatus.\n**A. transversa cervicis:** lateralt, kranielt for suprascapularis, deler sig ved m. trapezius i superficielle og profunde grene.\n**A. thyroidea inferior:** opad foran a. vertebralis, bøjer ud for C6 medialt bag kar-nervestrengen til bagfladen af gl. thyroidea.","img":"r_ax21_19-9"},{"id":"ax21-t13","t":"ax21.hs","k":"text","q":"A. thoracica interna og truncus costocervicalis: forløb?","a":"**A. thoracica interna:** fra undersiden af a. subclavia, bag costa I, parasternalt på thoraxvæggen, ventralt for m. transversus thoracis; afgiver a. pericardiacophrenica, fortsætter (ud for IC6) i a. epigastrica superior + a. musculophrenica; gennem Larreys spalte til bagsiden af m. rectus abdominis; afgiver aa. intercostales anteriores undervejs.\n**Truncus costocervicalis:** fra bagsiden af a. subclavia (2. stykke), over cupula pleurae til collum costae I; deler sig i a. intercostalis suprema (til IC 1-2) og a. cervicalis profunda (anastomoserer med a. occipitalis).","img":"r_ax21_20-1"},{"id":"ax21-t14","t":"ax21.hc","k":"text","q":"A. carotis communis: deling og relationer?","a":"Deler sig typisk ved overkanten af cartilago thyroidea i a. carotis interna og a. carotis externa. Højre/venstre er indbyrdes adskilt af trachea og oesophagus (larynx, pharynx, skjoldbrusken). Bagtil ligger tubercula anteriora proc. transversi, prævertebralmuskulatur, truncus sympathicus og n. vagus. Superficielt dækkes den af infrahyoide muskler og m. SCM.","img":"r_ax21_21-1"},{"id":"ax21-t15","t":"ax21.hc","k":"text","q":"A. carotis externa: hvad forsyner den (og hvad forsyner den IKKE)?","a":"Øvre del af halsen, gl. thyroidea/parathyroideae, øvre larynx, tunge + gl. sublingualis, ansigt + gl. submandibularis, regio occipitalis, svælg, regio temporalis, øre, underkæbe inkl. tænder, dura mater, overkæbe + tænder, gane, næsehulens bageste 2/3.\n**IKKE:** hjernen, øjet og panden."},{"id":"ax21-t16","t":"ax21.hc","k":"text","q":"A. carotis externa: forløb og deling for enden?","a":"Løber profundt for ramus mandibulae efter udspring fra bifurkaturen. Deler sig ved collum mandibulae i a. temporalis superficialis og a. maxillaris. Ligger først anteromedialt for a. carotis interna, ender anterolateralt for denne.\nHuskeregel for grenene: 'TLF På Ottende Afdeling Til Max'.","img":"r_ax21_23-1"},{"id":"ax21-t17","t":"ax21.hc","k":"text","q":"A. carotis externa: hvilke tre forreste grene afgiver den?","a":"A. thyroidea superior, a. lingualis, a. facialis."},{"id":"ax21-t18","t":"ax21.hc","k":"text","q":"A. carotis externa: hvilke tre bageste grene afgiver den?","a":"A. pharyngea ascendens, a. occipitalis, a. auricularis posterior."},{"id":"ax21-t19","t":"ax21.hc","k":"text","q":"A. thyroidea superior og a. lingualis: forløb?","a":"**A. thyroidea superior:** løber stejlt nedad, deler sig i rr. anterior et posterior; afgiver a. laryngea superior + grene til mm. SCM et cricothyroideus.\n**A. lingualis:** afgår ud for os hyoideum, medialt for m. hyoglossus; afgiver a. dorsalis linguae og a. sublingualis, fortsætter som a. profunda linguae.","img":"r_ax21_24-1"},{"id":"ax21-t20","t":"ax21.hc","k":"text","q":"A. facialis: forløb og grene?","a":"Opad, fremad i S-formet slynge mod svælget, forbi gl. submandibularis, i krog med basis mandibulae, op ved forkanten af m. masseter mod øjenkrogen. Afgiver a. palatina ascendens (mod ganen) og aa. labiales superior et inferior. Ender som a. angularis.","img":"r_ax21_24-1"},{"id":"ax21-t21","t":"ax21.hc","k":"text","q":"A. pharyngea ascendens: forløb og grene?","a":"Første bageste gren (udspringer dog mest medialt). Ascenderer på pharynxvæggen, medialt for stylomusklerne, a. carotis interna og proc. styloideus. Ender ved basis cranii med a. meningea posterior (gennem foramen jugulare, til dura mater) og a. tympanica inferior (til cavitas tympanica). Forsyner desuden CN IX, X, XII og truncus sympathicus.","img":"r_ax21_25-2"},{"id":"ax21-t22","t":"ax21.hc","k":"text","q":"A. occipitalis og a. auricularis posterior: forløb?","a":"**A. occipitalis:** bagud langs venter posterior m. digastrici, medialt for proc. mastoideus, perforerer nakkemuskulaturen, bliver subkutan mellem mm. trapezius et SCM, følger n. occipitalis major til vertex. Har en dyb descenderende gren, som anastomoserer med a. cervicalis profunda.\n**A. auricularis posterior:** afgår lige kranielt for mm. stylohyoideus et digastricus, skråt bagud/opad mod bagsiden af det ydre øre.","img":"r_ax21_26-5"},{"id":"ax21-t23","t":"ax21.hc","k":"text","q":"A. carotis interna: forsyningsområde og forløb på halsen?","a":"Forsyner forreste del af hjernen, øjet, forreste 1/3 af næsen og øverste del af ansigtet. Ligger først dorsolateralt, dernæst dorsomedialt for a. carotis externa. Ascenderer langs svælgvæggen mod canalis caroticus, foran tubercula anteriora C2-C4 og prævertebralmuskulatur. Passerer profundt for n. hypoglossus, venter posterior m. digastrici, proc. styloideus + stylomusklerne, og gl. parotidea.","img":"r_ax21_33-0"},{"id":"ax21-t24","t":"ax21.hc","k":"text","q":"Hvilke strukturer adskiller a. carotis interna fra a. carotis externa, og hvad er huskereglen for CN IX/XII?","a":"Proc. styloideus, m. styloglossus, m. stylopharyngeus, n. glossopharyngeus, rr. pharyngei n. vagi.\nHuskeregel: n. hypoglossus løber HENOVER carotiderne; n. glossopharyngeus løber GENNEM (mellem) carotiderne."},{"id":"ax21-t25","t":"ax21.hc","k":"text","q":"A. carotis interna: det intrakranielle forløb?","a":"Gennem canalis caroticus (ventralt og medialt), ventralt på foramen lacerum under ganglion trigeminale, ind i sinus cavernosus (sammen med CN III, IV, V og VI), ascenderer på corpus ossis sphenoidalis til medialt for proc. clinoideus anterior, bøjer bagud og danner et U (carotissifonen).","img":"r_ax21_34-4"},{"id":"ax21-t26","t":"ax21.hc","k":"text","q":"Hvad afgives i carotissifonen, og hvordan ender a. carotis interna?","a":"A. ophthalmica afgives gennem canalis opticus til orbita. A. carotis interna ender som aa. cerebri anterior et media samt bidrager til circulus Willisii."},{"id":"ax21-t27","t":"ax21.hc","k":"text","q":"Hvad er sinus cavernosus?","a":"Et parret, venøst blodfyldt hulrum — 'en uregelmæssig kavitet gennemtrukket af trabekler'.","img":"r_ax21_35-2"},{"id":"ax21-t28","t":"ax21.kn","k":"text","q":"N. glossopharyngeus (IX): funktioner?","a":"**Sensorisk:** smagstråde fra bageste 1/3 af tungen; sensoriske tråde fra bageste 1/3 af tungen, gane, ganebuer, oropharynx og trommehule; specielle sensoriske tråde fra sinus caroticus og glomus caroticum.\n**Motorisk:** m. stylopharyngeus.\n**Sekretorisk/parasympatisk:** gl. parotidea.\n**Branchiebue:** 3.","img":"r_ax21_41-2"},{"id":"ax21-t29","t":"ax21.kn","k":"text","q":"N. glossopharyngeus: forløb?","a":"Gennem foramen jugulare (fortil, med X og XI), i spatium lateropharyngeum (med ganglia superius et inferius for de afferente somata). Løber i en bue fremad, foran n. vagus, gennem carotiderne, følger m. stylopharyngeus gennem svælgvæggen (mellem øverste og midterste konstriktor), medialt for m. hyoglossus, og ender i tungesubstansen. Afgiver n. tympanicus, r. sinus carotici og rr. pharyngei.","img":"r_ax21_42-1"},{"id":"ax21-t30","t":"ax21.kn","k":"text","q":"N. vagus (X): funktioner?","a":"**Sensorisk:** ydre øregang, larynx, laryngopharynx; smagstråde fra laryngopharynx (+ vallecula epiglottica); grene til hjerte, lunger, mave-tarmkanal.\n**Motorisk:** m. levator veli palatini, pharynxkonstriktorerne (+ mm. palatoglossus, palatopharyngeus, salpingopharyngeus), larynxmuskulaturen; grene til hjerte, lunger, mave-tarmkanal.\n**Branchiebue:** 4.-6.","img":"r_ax21_44-1"},{"id":"ax21-t31","t":"ax21.kn","k":"text","q":"N. vagus: forløb og ganglier?","a":"Gennem foramen jugulare (fortil, med IX og XI), ind i spatium lateropharyngeum. Ganglion superius (jugulare): somata for afferenter fra ydre øre og dura + afgang af r. auricularis. Ganglion inferius (nodosum): somata for de (talrige) viscerale afferenter.","img":"r_ax21_45-0"},{"id":"ax21-t32","t":"ax21.kn","k":"text","q":"N. vagus: forløb på halsen (højre vs. venstre)?","a":"Descenderer i furen mellem v. jugularis interna og a. carotis interna/communis.\n**Højre:** posteriort for v. jugularis interna, krydser 1. stykke af a. subclavia, ned bag v. brachiocephalica og v. cava superior.\n**Venstr
