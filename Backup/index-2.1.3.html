 kunne, da det er her discusprolaps hyppigst rammer."},{"id":"ax13-o71","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":8,"a":"S1","n":"Dermatom S1 — sammen med L5 det vigtigste at kunne, da det er her discusprolaps hyppigst rammer."},{"id":"ax14-t1","t":"ax14.cv","k":"text","q":"Hvad er columna vertebralis, og hvilke funktioner har den?","a":"En bevægelig søjle fra hoved til hale, en del af det axiale skelet, forbundet til ekstremiteterne via skulderbæltet og bækkenringen.\n**Funktion:** beskytter rygmarven, giver strukturel støtte for hoved, skulderbælte, thorax og ekstremiteter, og knoglemarven i hvirvellegemerne indgår i det hæmatopoetiske (bloddannende) væv.","img":"r_ax14_6-2"},{"id":"ax14-t2","t":"ax14.cv","k":"text","q":"Hvor mange hvirvler har columna vertebralis, og hvordan fordeler de sig?","a":"7 vertebrae cervicales, 12 thoracicae, 5 lumbales, 5 sacrales (→ os sacrum), 3–5 coccygeae (→ os coccygis). 23 stk. i de præsacrale.","img":"r_ax14_7-2"},{"id":"ax14-t3","t":"ax14.cv","k":"text","q":"Hvilke fire dele (partes) inddeles columna i?","a":"Pars cervicalis, pars thoracica, pars lumbalis og pars pelvina.","img":"r_ax14_7-9"},{"id":"ax14-t4","t":"ax14.cv","k":"text","q":"Hvordan er columnas krumninger i frontal- og sagittalplanet?","a":"**Frontalplanet:** lige og symmetrisk (klinik: skoliose — skævvridning sideværts, typisk unge kvinder).\n**Sagittalplanet:** S-formet med halslordose, brystkyfose, lændelordose og bækkenkyfose (samt promontoriet).","img":"r_ax14_8-2"},{"id":"ax14-t5","t":"ax14.cv","k":"text","q":"Hvad skyldes brystkyfosen og lændelordosen anatomisk?","a":"Brystkyfosen skyldes kileformede vertebrae. Lændelordosen skyldes kileformede disci. Konsekvensen er, at lordoserne er mere bevægelige og manipulérbare end kyfoserne.","img":"r_ax14_8-7"},{"id":"ax14-t6","t":"ax14.cv","k":"text","q":"Hvilke elementer består en typisk vertebra af?","a":"**Corpus vertebrae** (kort cylinder, med ambitus eminens som øverste/nederste rand), **arcus vertebrae** med pediculus ('lille fod') og lamina ('firkantet plade'), samt processus articularis superior/inferior (ledtap), processus transversus (tværtap) og processus spinosus (torntap).","img":"r_ax14_11-1"},{"id":"ax14-t7","t":"ax14.cv","k":"text","q":"Hvad er foramen vertebrale, og hvad danner det?","a":"Hullet afgrænset af corpus og arcus vertebrae. Foramina vertebralia danner tilsammen canalis vertebralis."},{"id":"ax14-t8","t":"ax14.cv","k":"text","q":"Hvordan adskiller cervikale, thorakale og lumbale corpora sig?","a":"**Cervikalt:** rektangulær med uncus corporis. **Thorakalt:** hjerteformet, med fovea costalis superior/inferior. **Lumbalt:** nyreformet.","img":"r_ax14_11-2"},{"id":"ax14-t9","t":"ax14.cv","k":"text","q":"Hvordan adskiller processus articularis (ledtap) sig mellem cervikal, thorakal og lumbal?","a":"**Cervikalt:** mellem frontal- og transversalplan, cylinderform med skråt afskårne endeflader; superior bagud+opad, inferior fremad+nedad.\n**Thorakalt:** frontalplanet; superior bagud+lateralt, inferior fremad+medialt.\n**Lumbalt:** sagittalplanet; superior medialt/opad/bagud, inferior (L5) frontalt stillet.","img":"r_ax14_11-3"},{"id":"ax14-t10","t":"ax14.cv","k":"text","q":"Hvordan adskiller processus transversus sig mellem cervikal, thorakal og lumbal?","a":"**Cervikalt:** korte, lateralt-fremad, med tuberculum anterius et posterius, foramen transversarium, sulcus n. spinalis og ribbensrudimenter.\n**Thorakalt:** lateralt-bagud, 'kølleformet' støtte til ribbenene.\n**Lumbalt:** lateralt, med ribbensrudimenter ('proc. costalis').","img":"r_ax14_16-6"},{"id":"ax14-t11","t":"ax14.cv","k":"text","q":"Hvordan adskiller processus spinosus og foramen vertebrale sig mellem cervikal, thorakal og lumbal?","a":"**Proc. spinosus:** cervikalt nedad-bagud og bifid; thorakalt nedadhældende (taglagt) og tresidet prismatisk; lumbalt tykke, sammenklemte, bagud.\n**Foramen vertebrale:** cervikalt stort og trekantet; thorakalt mindre og rundt; lumbalt lidt større og trekantet.","img":"r_ax14_16-7"},{"id":"ax14-t12","t":"ax14.cv","k":"text","q":"Hvad er foramen intervertebrale, og hvad begrænser det?","a":"Passage for kar og nerver til og fra canalis vertebralis.\n**Fortil:** discus intervertebralis + corpus vertebrae (nederste del). **Bagtil:** art. zygapophysialis (facetled) + lig. flavums lateralkant. **Opad/nedadtil:** pediculus."},{"id":"ax14-t13","t":"ax14.cv","k":"text","q":"Os sacrum: hvordan er den dannet, og hvilke strukturer har den?","a":"Pyramideformet knogle dannet ved fusion af 5 ryghvirvler. Ala ossis sacri, canalis sacralis (fortsættelse af canalis vertebralis), hiatus sacralis, foramina sacralia anteriora et posteriora, crista sacralis mediana (svarer til proc. spinosi) og lateralis (svarer til proc. transversus), samt facies auricularis (SI-led).","img":"r_ax14_18-2"},{"id":"ax14-t14","t":"ax14.cv","k":"text","q":"Os coccygis: hvordan er den dannet?","a":"Dannet af fusion af som regel 4 rudimentære (indskrumpede) hvirvler.","img":"r_ax14_19-4"},{"id":"ax14-t15","t":"ax14.ao","k":"text","q":"Hvordan adskiller atlas (C1) og axis (C2) sig fra de andre cervikale vertebrae, og hvad er atlas' funktion?","a":"De adskiller sig strukturelt fra de øvrige halshvirvler. Atlas bærer hovedet, forbinder det med det axiale skelet, og danner en ledkombination med 3 frihedsgrader (fleksion-ekstension, lateralfleksion-lateralekstension, rotation). Atlas mangler et corpus; i stedet rager axis' dens (tap) op i atlas og danner led med denne.","img":"r_ax14_20-2"},{"id":"ax14-t16","t":"ax14.ao","k":"text","q":"Atlas (C1, ringhvirvel): hvilke strukturer har den?","a":"Intet corpus. **Arcus anterior** med tuberculum anterius (ledfacet på bagfladen, artikulerer med dens axis). **Arcus posterior** med tuberculum posterius (rudimentær torntap). **Massa lateralis**: massiv knoglestruktur, hvorover hovedets vægt overføres til columna; bærer facies articularis superior (mod os occipitale), facies articularis inferior (mod axis) og sulcus a. vertebralis."},{"id":"ax14-t17","t":"ax14.ao","k":"text","q":"Axis (C2, taphvirvel): hvilke strukturer har den?","a":"**Dens axis** ('tand'): corpus skyder sig op fra sin øverste flade, med facies articularis anterior (mod atlas) og posterior (mod lig. transversum atlantis). Desuden facies articularis superior, processus transversus (underudviklet) med foramen transversarium, og processus spinosus (veludviklet og bifid).","img":"r_ax14_23-1"},{"id":"ax14-t18","t":"ax14.ao","k":"text","q":"Os occipitale: hvordan er den inddelt, og hvilke strukturer har den?","a":"Inddeles i pars basilaris, pars lateralis og squama occipitalis.\nStrukturer: foramen magnum (indeholder medulla oblongata), condyli occipitales (artikulerer med atlas), crista occipitalis externa → protuberantia occipitalis externa, samt lineae nuchales superior et inferior.","img":"r_ax14_27-2"},{"id":"ax14-t19","t":"ax14.cl","k":"text","q":"Hvilke tre led findes mellem hvirvellegemerne og hvirvelbuerne, og hvilke to findes i nakken?","a":"**Mellem corpus vertebrae:** discus intervertebralis (symfyse, sekundær synchondrose).\n**Mellem hvirvelbuerne (via proc. articularis):** art. zygapophysialis (facetled) og syndesmoser.\n**Nakkens led:** art. atlantooccipitalis ('øvre nakkeled') og art. atlantoaxialis ('nedre nakkeled').","img":"r_ax14_28-2"},{"id":"ax14-t20","t":"ax14.cl","k":"text","q":"Discus intervertebralis: klassifikation og opbygning?","a":"Uægte led, symfyse (sekundær synkondrose).\n**Anulus fibrosus:** ca. 50 koncentriske lameller af fibrøst væv (skiftevis venstre-/højresnoet).\n**Nucleus pulposus:** blød gelatinøs masse (osmotisk tryk udvider anulus fibrosus).\n**Hyalin endeplade:** binder discus til corpora af vertebrae og sørger for ernæring.","img":"r_ax14_29-0"},{"id":"ax14-t21","t":"ax14.cl","k":"text","q":"Hvor er anulus fibrosus og nucleus pulposus vaskulariserede?","a":"Begge er avaskulære; anulus fibrosus er kun forsynet med nerver og kar i periferien.","img":"r_ax14_29-5"},{"id":"ax14-t22","t":"ax14.cl","k":"text","q":"Lig. longitudinale anterius og posterius: forløb?","a":"**Lig. longitudinale anterius:** fra tuberculum anterius atlantis til os sacrum, på forsiden af corpus — A-formet.\n**Lig. longitudinale posterius:** fra os occipitale/foramen magnum til os coccygis, på bagsiden af corpus inde i canalis vertebralis — omvendt A-formet. Den øverste del (axis→os occipitale) kaldes membrana tectoria.","img":"r_ax14_29-7"},{"id":"ax14-t23","t":"ax14.cl","k":"text","q":"Art. zygapophysialis (facetled): beliggenhed og klassifikation?","a":"Mellem processus articularis på to tilstødende vertebrae. Ægte, kombinerede glideled.","img":"r_ax14_32-3"},{"id":"ax14-t24","t":"ax14.cl","k":"text","q":"Hvordan er art. zygapophysialis forskellig cervikalt, thorakalt og lumbalt?","a":"**Cervikalt:** stor afstand mellem ledtappene, øvre ledflade vendt opad-bagud; størst bevægelighed; lateralfleksion tvinger samtidig rotation til samme side.\n**Thorakalt:** lille afstand, frontalt stillede, stramme ligamenter (øvre ledflade bagud); begrænser al bevægelse — det mest stabile afsnit.\n**Lumbalt:** sagittalt stillede, øvre ledflade vendt medialt; en vis bevægelighed ved normalstilling/fleksion; ved ekstension låses leddet (rotationslåsning).","img":"r_ax14_32-0"},{"id":"ax14-t25","t":"ax14.cl","k":"text","q":"Hvilke akser bevæger art. zygapophysialis omkring, og hvilke afsnit bidrager mest til columnas bevægelighed?","a":"Lateralfleksion (sagittale akser), fleksion-ekstension (transverselle akser), rotation (vertikal akse). Columna cervicalis og columna lumbalis bidrager mest til columnas samlede bevægelighed.","img":"r_ax14_33-0"},{"id":"ax14-t26","t":"ax14.cl","k":"text","q":"Hvilke fire syndesmoser findes i columna, og hvor sidder de?","a":"**Lig. flavum:** mellem tilstødende lamina arcus vertebrae (elastin), afflader og lukker canalis vertebralis bagtil.\n**Lig. intertransversaria:** mellem tilstødende proc. transversi.\n**Lig. interspinalia:** mellem randene af proc. spinosi.\n**Lig. supraspinalia:** stærke, smalle bånd mellem spidserne af proc. spinosi; fortsætter i nakken som lig. nuchae.","img":"r_ax14_34-1"},{"id":"ax14-t27","t":"ax14.cl","k":"text","q":"Lig. nuchae: forløb og funktion?","a":"Fladt trekantet bånd fra vertebra prominens (C7) til protuberantia occipitalis externa (via crista occipitalis externa), med binding til tuberculum posterius atlantis undervejs. Nakkens erstatning for lig. supraspinale; fungerer som septum for nakkemuskulaturen.","img":"r_ax14_34-8"},{"id":"ax14-t28","t":"ax14.cl","k":"text","q":"Art. atlantooccipitalis ('øvre nakkeled'): beliggenhed, klassifikation og bevægelser?","a":"Mellem condyli occipitales og facies articulares superiores atlantis. Ægte, kombineret ellipsoidled.\nNikkebevægelser om en transversal akse (i niveau med ydre øregang); side-/vuggebevægelser om en sagittal akse.\nForstærkes af membrana atlantooccipitalis anterior og posterior (a. vertebralis og n. suboccipitalis perforerer den posteriore).","img":"r_ax14_37-2"},{"id":"ax14-t29","t":"ax14.cl","k":"text","q":"Art. atlantoaxialis ('nedre nakkeled'): klassifikation og inddeling?","a":"Ægte, kombineret tapled og glideled. Inddeles i et **mediant tapled** (mellem atlas og dens axis) og **to laterale glideled** (mellem atlas' nedre ledfacetter og axis' overside).","img":"r_ax14_38-6"},{"id":"ax14-t30","t":"ax14.cl","k":"text","q":"Art. atlantoaxialis (tapleddet): beliggenhed, klassifikation, ligamenter og bevægelse?","a":"Mellem dens axis og fovea dentis. Ægte, enkelt drejeled — kun rotationsbevægelse.\n**Lig. transversum atlantis** (+ strøg op og ned): bag dens axis, forhindrer bagudglidning. **Lig. cruciforme atlantis:** krydsformet forstærkning. **Lig. alaria:** fra tappens sideflader til condyli occipitales, begrænser rotationen. **Lig. apicis dentis:** fra tappens spids til forkanten af foramen magnum.","img":"r_ax14_39-0"},{"id":"ax14-t31","t":"ax14.cl","k":"text","q":"Unco-vertebralleddet: hvor findes det, og hvad er dets klinik?","a":"Selvstændigt led, kun ved de cervikale vertebrae; begrænser sideforskydning mellem halshvirvlerne.\nKlinik: uncus danner den forreste begrænsning af foramen intervertebrale, så slidgigt her kan indsnævre rummet og trykke på plexus brachialis.","img":"r_ax14_41-1"},{"id":"ax14-t32","t":"ax14.cl","k":"text","q":"Hvilke akser bevæger nakkeleddene omkring (fleksion-ekstension, lateralfleksion, rotation)?","a":"**Fleksion-ekstension (nikken):** transversel akse gennem ydre øregang.\n**Lateralfleksion (vuggen):** sagittal akse gennem glabella.\n**Rotation (rysten):** vertikal akse gennem dens axis.","img":"r_ax14_42-3"},{"id":"ax14-t33","t":"ax14.cl","k":"text","q":"Hvor ligger nakkeleddets tyngdepunkt hos voksne og hos spædbørn, og hvad er konsekvensen?","a":"Hos voksne ligger det foran det øvre nakkeleds transverselle akse, så hovedet falder forover i søvn i siddende stilling. Hos spædbørn ligger det bagved (pga. ufuldstændigt udviklet ansigtsskelet), så hovedet har tendens til at falde bagover.","img":"r_ax14_43-3"},{"id":"ax14-t34","t":"ax14.cv","k":"text","q":"Hvordan forsynes hvirvelsøjlen arterielt, og hvilke arterier bidrager segmentært?","a":"Segmentære grene fra de store arterier langs rygsøjlen, til antero-laterale flader af vertebrae og gennem foramina intervertebralia til canalis vertebralis (knoglevæv, rygmarv, hinder). Arteriegrenene anastomoserer i et longitudinelt netværk.\nSegmentært fra: a. vertebralis, aa. cervicales ascendens et profunda, aa. intercostales posteriores, aa. lumbales.","img":"r_ax14_44-2"},{"id":"ax14-t35","t":"ax14.cv","k":"text","q":"Hvilke arterier forsyner medulla spinalis longitudinelt?","a":"A. spinalis anterior og aa. spinales posteriores, som udgår fra a. vertebralis.","img":"r_ax14_45-5"},{"id":"ax14-t36","t":"ax14.cv","k":"text","q":"Hvordan er hvirvelsøjlens venøse drænage opbygget?","a":"Plexer i hele rygsøjlens længde: **plexus venosus externus** (rygsøjlens udvendige flader) og **plexus venosus internus** (epiduralrummet i canalis vertebralis). Modtager vv. basivertebrales fra corpus vertebrae og vv. spinales fra rygmarven.","img":"r_ax14_47-2"},{"id":"ax14-t37","t":"ax14.cv","k":"text","q":"Hvilke nerver forsyner hvirvelsøjlen selv?","a":"Ramus meningeus fra spinalnerverne, som afgår i foramen intervertebrale og løber tilbage til canalis vertebralis for at forsyne dura, ligamenter, periost og kar.","img":"r_ax14_48-2"},{"id":"ax14-t38","t":"ax14.sn","k":"text","q":"Hvordan dannes en spinalnerve, og hvor mange segmenter er der?","a":"En ventral rod (motorisk) og en dorsal rod (sensorisk, med spinalganglion) fra ét spinalsegment løber sammen i foramen intervertebrale. 31 segmenter: 8 cervicale, 12 thoracale, 5 lumbale, 5 sacrale, 1 coccygealt.","img":"r_ax14_50-1"},{"id":"ax14-t39","t":"ax14.sn","k":"text","q":"Hvordan deler spinalnerven sig, og hvad forsyner grenene?","a":"**Ramus dorsalis:** til de dybe ryg- og nakkemuskler og huden over ryg og nakke.\n**Ramus ventralis:** indgår i ekstremitetsplekserne, ellers som nn. intercostales.","img":"r_ax14_52-2"},{"id":"ax14-t40","t":"ax14.sn","k":"text","q":"Hvordan deler ramus dorsalis sig yderligere, og hvad er reglen for kutan innervation?","a":"I ramus medialis og ramus lateralis. Over T7 er den mediale gren kutan; under T7 er den laterale gren kutan."},{"id":"ax14-t41","t":"ax14.sn","k":"text","q":"Hvilke plexus dannes af ramus ventralis fra de forskellige segmenter?","a":"C1–C5 → plexus cervicalis. C5–T1 → plexus brachialis. T2–L1 afgiver hver en (stor) r. cutaneus lateralis og en (lille) r. cutaneus anterior. T12–S4 → plexus lumbosacralis. S5–Co1 → plexus coccygeus."},{"id":"ax14-t42","t":"ax14.sn","k":"text","q":"Hvordan er spinalnerverne forbundet til truncus sympathicus?","a":"Spinalnerve T1–L2 afgiver ramus communicans albus til truncus sympathicus (og synapser her). ALLE spinalnerver modtager omvendt en ramus communicans griseus fra truncus sympathicus, som går videre gennem spinalnerven (kan også ascendere/descendere i truncus sympathicus).","img":"r_ax14_53-0"},{"id":"ax14-t43","t":"ax14.sn","k":"text","q":"Hvordan forløber nn. intercostales 1–6?","a":"Udelukkende i interkostalrummet i sulcus costalis. Afgiver r. cutaneus lateralis og ender som r. cutaneus anterior. 2. og 3. interkostalnerve anastomoserer desuden lateralt til innervation af armhulen (nn. intercostobrachiales)."},{"id":"ax14-t44","t":"ax14.sn","k":"text","q":"Hvordan forløber nn. intercostales 7–11, og hvad innerverer T10?","a":"De løber frem i interkostalrummene til ribbenskurvaturen og fortsætter herefter i bugmuskulaturen, som de innerverer sammen med huden over den. T10 innerverer området omkring navlen (umbilicus)."},{"id":"ax14-t45","t":"ax14.sn","k":"text","q":"N. subcostalis: forløb?","a":"Løber som nn. intercostales, men under 12. ribben, og forløber herefter i bugmuskulaturen."},{"id":"ax14-t46","t":"ax14.sn","k":"text","q":"N. suboccipitalis (C1): funktion og innervation?","a":"Rent motorisk. Innerverer m. semispinalis capitis og de suboccipitale muskler.","img":"r_ax14_57-0"},{"id":"ax14-t47","t":"ax14.sn","k":"text","q":"N. occipitalis major (C2) og n. occipitalis tertius (C3): funktion?","a":"**N. occipitalis major:** innerverer rygmusklerne segmentært; stor sensorisk del, innerverer det meste af baghovedet.\n**N. occipitalis tertius:** som major, men mindre; innerverer et mindre område nederst på baghovedet/øverst i nakken."},{"id":"ax14-t48","t":"ax14.sn","k":"text","q":"Hvordan er rami posteriores' kutane innervation fordelt fra C4 til S-niveau?","a":"C4–C8: helt almindelige dorsale grene (C7–C8 rent muskulære; C4–C6 innerverer også hud, dog kun den mediale gren pga. scapula). T1–T7: kutane grene fra rami mediales. T8–T12: kutane grene fra rami laterales. L1–L3: de laterale er kutane (nn. clunium superiores). L4–L5: rent motoriske. S1–S3: de laterale er kutane (nn. clunium medii).","img":"r_ax14_57-0"},{"id":"ax14-t49","t":"ax14.ca","k":"text","q":"Hvordan er canalis vertebralis afgrænset, og hvor strækker den sig?","a":"Afgrænses af vertebrae (corpus og discus fortil, arcus bagtil og til siderne). Strækker sig fra foramen magnum til hiatus sacralis. Alle foramina vertebralia danner tilsammen kanalen; til siderne er der forbindelse via foramina intervertebralia.","img":"r_ax14_63-0"},{"id":"ax14-t50","t":"ax14.ca","k":"text","q":"Hvad indeholder canalis vertebralis, udefra og ind?","a":"Ligg. flava + lig. longitudinale posterius → spatium epidurale (fedt + plexus venosus vertebralis internus) → 3 hjernehinder (dura, arachnoidea, pia mater) → subarachnoidalrummet (cerebrospinalvæske) → medulla spinalis.","img":"r_ax14_64-2"},{"id":"ax14-t51","t":"ax14.ca","k":"text","q":"Hvor ender medulla spinalis, og hvad hedder strukturerne herfra?","a":"Medulla ender i L1–L2-niveau som conus medullaris, hvorfra L2–S5 + Co fortsætter som cauda equina."},{"id":"ax14-t52","t":"ax14.ca","k":"text","q":"Hvor er discusprolaps hyppigst, og hvad er førstevalg i behandlingen?","a":"Hyppigst i lumbalregionen (discus L4 og L5). Førstevalg er konservativ behandling (genoptræning og smertestillende).","img":"r_ax14_31-3"},{"id":"ax14-t53","t":"ax14.ca","k":"text","q":"Hvorfor foretages lumbalpunktur typisk over eller under L4?","a":"Fordi man her er sikker på, at medulla spinalis er sluttet, og der kun er cauda equina tilbage. Nervefibrene i cauda equina rykkes til side af nålen i stedet for at blive beskadiget."},{"id":"ax14-t54","t":"ax14.ca","k":"text","q":"Hvad er cauda equina syndrom, og hvordan skal det behandles?","a":"Afklemning af de lumbosacrale nervefilamenter (fx ved rygtraume), som giver urinretention, slap analtonus og neurologiske udfald i 'ridebuksområdet'. Skal opereres akut (inden 24 timer), da der ellers ses irreversibel skade."},{"id":"ax14-t55","t":"ax14.ca","k":"text","q":"Hvad kendetegner discusprolaps klinisk?","a":"Skyldes en svaghed i anulus fibrosus (oftest bagtil), hvor nucleus pulposus trænger igennem og kan trykke på nerveroden. Intens smerte i lænderyggen, der forplanter sig ned i balde, lår og evt. foden, ofte med brændende fornemmelse/følelsesløshed. Forværres ved hoste og brug af bugpressen. Lammelser ses kun sjældent.","img":"r_ax14_31-3"},{"id":"ax14-t56","t":"ax14.rm","k":"text","q":"Hvordan inddeles ryg- og nakkemusklerne overordnet?","a":"**Overfladiske rygmuskler** (innervationsmæssigt og funktionelt hørende til overekstremiteten): m. trapezius, m. latissimus dorsi, mm. rhomboidei, m. levator scapulae, mm. serrati posteriores.\n**Dybe rygmuskler:** m. erector spinae, mm. transversospinales, mm. interspinales, mm. intertransversarii, mm. suboccipitales, m. splenius.","img":"r_ax14_67-4"},{"id":"ax14-t57","t":"ax14.rm","k":"text","q":"Hvordan innerveres de dybe rygmuskler, og hvad er deres afgrænsning?","a":"Segmentært via rami dorsales nn. spinalium.\n**Afgrænsning:** kranielt basis cranii, kaudalt crista iliacae og os coccygis, lateralt kanten af m. trapezius og midtaxillærlinjen."},{"id":"ax14-t58","t":"ax14.rm","k":"text","q":"Hvilke fire kontraktionsmønstre har de dybe rygmuskler ved forskellige bevægelser?","a":"Rotation; excentrisk kontralateral kontraktion ved lateralfleksion; excentrisk kontraktion ved fleksion; koncentrisk kontraktion ved ekstension."},{"id":"ax14-t59","t":"ax14.rm","k":"text","q":"Hvad er fascia thoracolumbalis, og hvordan er den opbygget?","a":"Fælles fascie for de dybe rygmuskler (bruges også af andre muskler til udspring). Består af et ventralt og et dorsalt blad, mellem hvilke de dybe rygmuskler ligger.","img":"r_ax14_68-1"},{"id":"ax14-t60","t":"ax14.rm","k":"text","q":"Fascia thoracolumbalis: forløb af det ventrale og det dorsale blad?","a":"**Ventrale blad:** fra crista iliaca til costa 12; medialt til proc. transversi, lateralt til det dorsale blad.\n**Dorsale blad:** fra crista iliaca til fascia nuchae; medialt til proc. spinosi og crista sacralis mediana, lateralt til det ventrale blad (nedadtil) og anguli costarum (opadtil)."},{"id":"ax14-t61","t":"ax14.rm","k":"text","q":"Mm. serrati posteriores: udspring, insertion og funktion?","a":"**M. serratus posterior superior:** udspring proc. spinosi C7–T2/3; insertion anguli costarum II–V; accessorisk inspirationsmuskel.\n**M. serratus posterior inferior:** udspring proc. spinosi T10–L2/3; insertion anguli costarum VIII–XII; accessorisk ekspirationsmuskel.","img":"r_ax14_71-2"},{"id":"ax14-t62","t":"ax14.rm","k":"text","q":"M. erector spinae: fælles udspring og funktion?","a":"**Udspring:** fascia thoracolumbalis, os sacrum, proc. spinosi af de nederste lændehvirvler og crista iliaca.\n**Funktion:** holder kroppen oprejst, ekstension af ryggen."},{"id":"ax14-t63","t":"ax14.rm","k":"text","q":"M. erector spinae: hvilke tre dele består den af, fra medialt til lateralt?","a":"**M. spinalis** (medialt): insererer på proc. spinosi.\n**M. longissimus** (mellemst): thoracis til proc. transversi/costae, cervicis til proc. transversi, capitis til bagkanten af proc. mastoideus.\n**M. iliocostalis** (mest lateralt): lumborum og thoracis til anguli costarum, cervicis til proc. transversi.","img":"r_ax14_73-0"},{"id":"ax14-t64","t":"ax14.rm","k":"text","q":"Mm. transversospinales: hvor ligger de, og hvordan inddeles de?","a":"Profundt for m. erector spinae. Spænder mellem en proc. transversus og en ovenliggende proc. spinosus.\nInddeles efter antal hvirvler, der springes over: **mm. rotatores** (mest profunde, 0–1 hvirvel), **mm. multifidi** (mellemste lag, 2–3 hvirvler), **m. semispinalis** (mest superficielt, 4+ hvirvler)."},{"id":"ax14-t65","t":"ax14.rm","k":"text","q":"Hvor udspringer mm. multifidi, og hvor er de kraftigst udviklet?","a":"Fra os sacrum, fascia thoracolumbalis og proc. transversi, til proc. spinosi. Kraftigst i lænden."},{"id":"ax14-t66","t":"ax14.rm","k":"text","q":"M. semispinalis capitis: hvor hæfter den, og hvor ligger den i forhold til de andre nakkemuskler?","a":"Hæfter mellem lineae nuchales superior et inferior, medialt for m. splenius capitis, profundt for m. trapezius, men superficielt for de suboccipitale muskler."},{"id":"ax14-t67","t":"ax14.rm","k":"text","q":"Mm. interspinales og mm. intertransversarii: beliggenhed?","a":"**Mm. interspinales:** mellem proc. spinosi. **Mm. intertransversarii:** mellem proc. transversi."},{"id":"ax14-t68","t":"ax14.rm","k":"text","q":"Hvilke fire mm. suboccipitales findes, og hvad er deres udspring/insertion?","a":"**M. rectus capitis posterior major:** proc. spinosus C2 → under linea nuchalis inferior.\n**M. rectus capitis posterior minor:** tuberculum posterius atlantis → medialt for major.\n**M. obliquus capitis superior:** proc. transversus atlantis → lateralt for major.\n**M. obliquus capitis inferior:** proc. spinosus C2 → proc. transversus atlantis.","img":"r_ax14_78-0"},{"id":"ax14-t69","t":"ax14.rm","k":"text","q":"Hvad er trigonum suboccipitale, og hvad ligger heri?","a":"Afgrænset af m. rectus capitis posterior major og de to mm. obliqui capitis; superficielt m. semispinalis capitis, profundt membrana atlantooccipitalis posterior og arcus posterior atlantis. Indeholder a. vertebralis og n. suboccipitalis.","img":"r_ax14_79-4"},{"id":"ax14-t70","t":"ax14.rm","k":"text","q":"M. splenius: udspring, insertion og spotteteknik?","a":"Flad, overfladisk muskel lige profundt for m. trapezius.\n**Udspring:** nederste halvdel af lig. nuchae og proc. spinosi C7–T6.\n**Insertion:** m. splenius cervicis til proc. transversi C1–C3; m. splenius capitis til proc. mastoideus og laterale del af linea nuchae superior.\n**Spot:** ligger lateralt for m. semispinalis capitis.","img":"r_ax14_80-3"},{"id":"ax14-t71","t":"ax14.rm","k":"text","q":"Hvilke muskler er vigtigst for hhv. cervikal- og lændelordosen, og hvad gør mm. suboccipitales?","a":"M. semispinalis er kraftig i halsregionen og udfylder cervikallordosen. M. multifidus er kraftig i lænderegionen og udfylder lændelordosen. Mm. suboccipitales har stort indhold af muskeltene og registrerer hovedets stilling og bevægelser. Mm. rotatores har mekanoreceptorisk funktion + let rotation."},{"id":"ax14-t72","t":"ax14.rm","k":"text","q":"Hvilke muskler flekterer columna i stående hhv. rygliggende stilling?","a":"**Stående:** m. erector spinae (excentrisk kontraktion) + de dorsale ligamenter.\n**Rygliggende:** m. rectus abdominis og m. psoas major som fleksorer, mens m. iliacus og m. rectus femoris fikserer bækkenet.\nFleksion + rotation samtidig (fx højre albue mod venstre knæ): mm. obliqui abdominis."},{"id":"ax14-t73","t":"ax14.rm","k":"text","q":"Hvilke muskler ekstenderer og lateralflekterer columna?","a":"**Ekstension (bugliggende):** m. erector spinae (koncentrisk).\n**Lateralfleksion (stående):** ensidig excentrisk kontraktion af de mest stejlt forløbende mm. obliqui abdominis + dyb rygmuskulatur + m. quadratus lumborum, alle i modsatte side."},{"id":"ax14-t74","t":"ax14.rm","k":"text","q":"Hvordan forsynes ryggen kar- og nervemæssigt?","a":"**Arterier:** aa. intercostales posteriores et lumbales (segmentære grene fra aorta). **Vener:** vv. intercostales posteriores et lumbales, med kommunikation til plexus vertebralis externus.\n**Nerver:** ramus dorsalis, som deles i ramus medialis (mellem rygmuskulaturens to mediale søjler) og ramus lateralis (mellem de to laterale søjler).","img":"r_ax14_85-0"},{"id":"ax14-t75","t":"ax14.rm","k":"text","q":"Hvordan er ryggens lymfedrænage inddelt?","a":"**Øverste, laterale kvadrant:** subscapular gruppe i axillen. **Nederste, laterale kvadrant:** øvre, laterale superficielle gruppe i lysken."},{"id":"ax14-t76","t":"ax14.th","k":"text","q":"Hvad er thoraxskelettets funktion og opbygning?","a":"**Funktion:** beskytter vitale organer, danner nødvendigt tryk ved respiration.\n**Opbygning:** pars thoracis af columna vertebralis, sternum og costae.","img":"r_ax14_88-4"},{"id":"ax14-t77","t":"ax14.th","k":"text","q":"Sternum: hvilke tre dele har den, og hvad kendetegner hver?","a":"Kaldes 'dolken'. **Manubrium sterni** ('håndtag'): incisura clavicularis, incisura jugularis, incisura costalis 1. **Corpus sterni:** incisurae costales. **Processus xiphoideus.**\nAngulus sterni (primær synchondrose) forbinder manubrium og corpus.","img":"r_ax14_91-4"},{"id":"ax14-t78","t":"ax14.th","k":"text","q":"Costae: hvor mange par er der, og hvordan hæfter de til sternum?","a":"12 par. 1.–7. par er hæftet direkte til sternum. 8.–10. par er hæftet til det ovenliggende ribben. 11.–12. par ender frit.","img":"r_ax14_92-3"},{"id":"ax14-t79","t":"ax14.th","k":"text","q":"Hvilke strukturer har en costa, fra caput til corpus?","a":"**Caput costae** med facies articularis capitis costae (artikulerer med to vertebrae og mellemliggende discus). **Collum costae.** **Tuberculum costae** (ledfacet mod proc. transversus). **Corpus costae** med sulcus costae og angulus costae."},{"id":"ax14-t80","t":"ax14.th","k":"text","q":"Ribbensleddene (art. costovertebrales og art. costotransversaria): klassifikation og ledflader?","a":"Ægte, kombinerede drejeled. Mellem caput costae og fovea costales superior/inferior på vertebrae, og mellem tuberculum costae og fovea costalis på proc. transversus. Forstærket af et intraartikulært ligament til discus intervertebralis, lig. costotransversarium og lig. costotransversarium superius.","img":"r_ax14_94-1"},{"id":"ax14-t81","t":"ax14.th","k":"text","q":"Hvilke led findes mellem sternum og costae og mellem costae indbyrdes?","a":"Artt. sternocostales og artt. interchondrales — ægte led."},{"id":"ax14-t82","t":"ax14.th","k":"text","q":"Costa 1: hvad er specielt ved den?","a":"Skjult under clavicula, bred i forhold til længden. Danner den nedre begrænsning af skalenerporten, med tuberculum m. scaleni anterior og sulcus a. subclaviae.","img":"r_ax14_95-4"},{"id":"ax14-t83","t":"ax14.th","k":"text","q":"Hvordan er ribbensmusklerne organiseret i tre lag?","a":"**1. lag, mm. intercostales externi:** skråt nedad-fremad ('yderlommerne i en frakke'); begynder bagtil ved tuberculum costae, slutter fortil i membrana intercostalis externa.\n**2. lag, mm. intercostales interni:** skråt nedad-bagud ('inderlommerne'); når frem til sternum, slutter bagtil i membrana intercostalis interna.\n**3. lag, mm. intercostales intimi:** samme fiberretning som interni; fra indre læbe af sulcus costae til overkanten af underliggende ribben.","img":"r_ax14_96-2"},{"id":"ax14-t84","t":"ax14.th","k":"text","q":"Hvad er det neurovaskulære plan i ribbensmellemrummet?","a":"Planet mellem mm. intercostales interni og intimi (sulcus costae), hvor de interkostale nerver og kar (VAN) forløber."},{"id":"ax14-t85","t":"ax14.th","k":"text","q":"M. transversus thoracis: beliggenhed, udspring, insertion?","a":"Variabel muskel på indersiden af den forreste brystvæg nedadtil.\n**Udspring:** bagerste flade af sternum. **Insertion:** costa 2–6 på grænsen mellem brusk og knogle.\nVasa thoracica interna løber i mellemrummet mellem musklen og ribbensbruskene.","img":"r_ax14_97-0"},{"id":"ax14-t86","t":"ax14.th","k":"text","q":"Mm. subcostales og mm. levatores costarum: beliggenhed og forløb?","a":"**Mm. subcostales:** dorsalt og profundt, springer et costa over før insertion (svarer til en m. intercostalis intimus).\n**Mm. levatores costarum:** profundt for den dybe rygmuskulatur, fra proc. transversi til costae (svarer til en m. intercostalis externus)."},{"id":"ax14-t87","t":"ax14.th","k":"text","q":"Hvad sker der ved inspiration og ekspiration i thorax?","a":"**Inspiration:** ribbene hæves, sternum bevæges fremad og opad. **Ekspiration:** ribbene sænkes, sternum bevæges tilbage.\nThorakal respiration: især costae I–IV løftes. Abdominal respiration: diaphragma.","img":"r_ax14_101-2"},{"id":"ax14-t88","t":"ax14.th","k":"text","q":"N. intercostalis: udspring og grene?","a":"Fra r. ventralis, nn. spinales T1–T12. Afgiver ramus cutaneus lateralis og ramus cutaneus anterior.","img":"r_ax14_102-0"},{"id":"ax14-t89","t":"ax14.th","k":"text","q":"Hvad er specielt ved T1–T3 blandt de interkostale nerver?","a":"**T1:** ascenderende gren til plexus brachialis, descenderende gren som normal n. intercostalis.\n**T2 + T3:** særligt store, innerverer også et kutant område i axillen (nn. intercostobrachiales)."},{"id":"ax14-t90","t":"ax14.th","k":"text","q":"Hvilke rr. cutanei fra intercostalnerverne kaldes mammarii, og hvordan forløber nn. intercostales 7–11 og 12?","a":"T2–T4: rr. cutanei anteriores = rr. mammarii mediales. T4–T6: rr. cutanei laterales = rr. mammarii laterales.\nT7–T11: begynder i interkostalrummene, ender i og innerverer bugvæggen (T10 innerverer umbilicus-området).\nT12 (n. subcostalis): kort forløb i sulcus costae, løber under lig. arcuatum laterale til m. quadratus lumborum (adskilles fra n. iliohypogastricus)."},{"id":"ax14-t91","t":"ax14.th","k":"text","q":"Aa. intercostales posteriores: afgang og grene?","a":"Segmentært fra aorta thoracica (de to øverste fra a. intercostalis suprema, en gren af a. subclavia).\n**R. dorsalis:** forsyner rygmuskulaturen. **R. spinalis:** forsyner rygmarv og hinder.","img":"r_ax14_104-2"},{"id":"ax14-t92","t":"ax14.th","k":"text","q":"A. thoracica interna: afgang, forløb og grene?","a":"**Afgang:** a. subclavia. **Forløb:** descenderer langs forvæggen indenfor thorax, foran m. transversus thoracis, ved lateralkanten af sternum.\n**Grene:** aa. intercostales anteriores (til 5 øverste ribben), a. pericardiacophrenica og a. musculophrenica (til diaphragma/pericardiet). **Ender som:** a. epigastrica superior.","img":"r_ax14_104-11"},{"id":"ax14-t93","t":"ax14.th","k":"text","q":"Hvordan drænerer vv. intercostales posteriores og v. thoracica interna?","a":"Vv. intercostales posteriores tømmer sig i v. azygos-systemet. V. thoracica interna tømmer sig i v. brachiocephalica."},{"id":"ax14-t94","t":"ax14.ma","k":"text","q":"Hvad er mamma anatomisk, og hvordan er den hos manden?","a":"Bilateralt kirtelorgan i subcutis forrest på thorax (costa 3–6). Hos manden: lille kirtel med lille papilla mammaria; klinisk relevant ved gynækomasti.","img":"r_ax14_106-3"},{"id":"ax14-t95","t":"ax14.ma","k":"text","q":"Hvad er mammas funktion hos kvinden?","a":"Stor kirtel fra pubertet til klimakteriet. Producerer modermælk efter graviditet."},{"id":"ax14-t96","t":"ax14.ma","k":"text","q":"Hvordan er mamma opbygget?","a":"Corpus mammae ('brystet'), papilla mammae (brystvorte, inkl. glatmuskulatur), areola mammae (pigmenteret område), gll. areolares (Montgomery's kirtler), sulcus intermammarius (mellem mammae) og inframammarius (fure under), samt processus axillaris (strækker sig op i axillen).","img":"r_ax14_106-3"},{"id":"ax14-t97","t":"ax14.ma","k":"text","q":"Hvilke muskler ligger mamma an mod?","a":"M. pectoralis major (+ muskelfascie), m. serratus anterior og m. obliquus externus abdominis.","img":"r_ax14_106-3"},{"id":"ax14-t98","t":"ax14.ma","k":"text","q":"Hvorfor er mammae frit forskydelige, og hvad er processus axillaris?","a":"Corpus mammae afgrænses fra m. pectoralis major af en bundfascie og løst bindevæv. Retinacula cutis trænger som septae gennem kirtlen og forbindes med bundfascien.\nProcessus axillaris gennembryder fascia axillaris og strækker sig et variabelt stykke op i fossa axillaris.","img":"r_ax14_107-4"},{"id":"ax14-t99","t":"ax14.ma","k":"text","q":"Hvordan er glandula mammaria (mælkekirtlen) opbygget?","a":"Kirtellegemet er indlejret i fedt- og bindevæv (mængden varierer med graviditet/laktation), konisk formet med apex ud for papilla mammae. Indeholder 15–20 lobi radiært fordelt, hvis lobuli udmunder i en fælles ductus lactiferus, som ud for papillen udvides i en sinus lactiferus (mælkereservoir).","img":"r_ax14_107-4"},{"id":"ax14-t100","t":"ax14.ma","k":"text","q":"Hvilken arteriel forsyning har mamma?","a":"A. thoracica interna (rr. perforantes), a. thoracica lateralis, a. thoracoacromialis (rr. pectorales), aa. intercostales posteriores (rr. perforantes).","img":"r_ax14_108-0"},{"id":"ax14-t101","t":"ax14.ma","k":"text","q":"Hvordan drænerer mammas vener, og hvad er den kliniske betydning?","a":"Superficielle og dybe vener, som bl.a. tømmes i vv. thoracicae internae og vv. intercostales. Vv. intercostales posteriores drænerer til det klapløse v. azygos-system, som også står i forbindelse med columna — det forklarer, hvorfor metastaser fra brysttumorer hyppigt ses i columna."},{"id":"ax14-t102","t":"ax14.ma","k":"text","q":"Hvordan er mammas nerveforsyning?","a":"Kutan innervation fra intercostalnerverne, opdelt i mediale (T2–T4, rr. mammarii mediales) og laterale grene (T4–T6, rr. mammarii laterales)."},{"id":"ax14-t103","t":"ax14.ma","k":"text","q":"Hvilke lymfeknuder drænerer mammae, og hvor stor en andel går til hver?","a":"**Laterale del:** lnn. axillares, pektoral gruppe (75 % af drænagen). **Mediale del:** lnn. parasternales (perforerer m. pectoralis major). **Superiore del:** lnn. axillares, apikal gruppe. **Inferiore del:** peritoneale, parietale lymfekar (perforerer rectusskeden).","img":"r_ax14_109-2"},{"id":"ax14-t104","t":"ax14.ma","k":"text","q":"Hvad er en sentinel node, og hvorfor er den klinisk vigtig?","a":"Den første lymfeknude, der modtager lymfen fra en bestemt region. Bruges klinisk ved brystcancer og malignt melanom: der injiceres blåfarve og et radioaktivt stof for at finde den. Hvis der er metastaser til sentinel node, skal alle lymfeknuder i axillen fjernes (axilrømning).","img":"r_ax14_109-2"},{"id":"ax14-o105","t":"ax14.cv","k":"occ","img":"vertform","boxes":[[58.583,24.112,24.152,6.684],[57.685,40.102,36.028,6.853],[49.9,71.658,31.986,5.922],[2.246,70.643,39.671,6.768],[59.331,62.437,30.639,6.091],[39.421,79.357,27.046,6.684],[3.593,41.54,27.246,5.922],[2.994,21.658,24.501,5.838],[2.994,87.733,26.946,5.922]],"target":0,"a":"Corpus vertebrae","n":"Kort cylinder; h
