n":"Fremspring på os hamatum."},{"id":"ax6-o126","t":"ax6.hk","k":"occ","img":"hand","boxes":[[68.087,2.047,11.42,3.46],[57.159,6.676,11.971,3.411],[80.435,7.846,4.551,2.924],[51.304,14.961,6.812,5.75],[89.855,32.651,4.986,2.973],[82.29,13.158,9.536,8.626],[82.0,27.339,3.942,2.875],[81.014,33.236,4.609,2.729],[80.609,37.914,3.478,2.778],[57.043,47.271,3.913,2.924],[58.29,53.899,4.58,2.68],[61.043,59.064,3.42,2.778],[82.435,63.402,10.551,2.729],[57.739,63.791,7.826,5.214],[5.101,52.144,11.449,3.168],[8.754,60.331,6.377,3.119]],"target":14,"a":"Ossa metacarpales","n":"Fem rørknogler, nummereret I–V radialt → ulnart."},{"id":"ax6-o127","t":"ax6.hk","k":"occ","img":"hand","boxes":[[68.087,2.047,11.42,3.46],[57.159,6.676,11.971,3.411],[80.435,7.846,4.551,2.924],[51.304,14.961,6.812,5.75],[89.855,32.651,4.986,2.973],[82.29,13.158,9.536,8.626],[82.0,27.339,3.942,2.875],[81.014,33.236,4.609,2.729],[80.609,37.914,3.478,2.778],[57.043,47.271,3.913,2.924],[58.29,53.899,4.58,2.68],[61.043,59.064,3.42,2.778],[82.435,63.402,10.551,2.729],[57.739,63.791,7.826,5.214],[5.101,52.144,11.449,3.168],[8.754,60.331,6.377,3.119]],"target":15,"a":"Ossa carpi","n":"Håndroden: otte knogler i en proksimal og en distal række."},{"id":"ax6-n128","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":1,"a":"Os scaphoideum","n":"Proksimal række, radialt. Bådformet, særlig arteriegren.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax6-n129","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":2,"a":"Os lunatum","n":"Proksimal række. Måneformet, centrum for ligamenter.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax6-n130","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":3,"a":"Os triquetrum","n":"Proksimal række. Trekantet, bærer os pisiforme.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax6-n131","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":4,"a":"Os pisiforme","n":"Proksimal række, palmart. Ærtformet, fikspunkt for sener og ligamenter.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax6-n132","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":5,"a":"Os trapezium","n":"Distal række, radialt. Saddelformet ledfacet til pollex.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax6-n133","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":6,"a":"Os trapezoideum","n":"Distal række. Solid basis for 2. metacarpal.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax6-n134","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":7,"a":"Os capitatum","n":"Distal række. Størst, omdrejningspunkt.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax6-n135","t":"ax6.hk","k":"num","img":"carp","bone":"Håndroden (carpus)","nr":8,"a":"Os hamatum","n":"Distal række, ulnart. Har hamulus ossis hamati.","ask":"Hvilken carpalknogle er nr. {nr}?","alt":"Håndroden med otte nummererede knogler"},{"id":"ax7-t1","t":"ax7.hl","k":"text","q":"Hvilke tre led udgør håndleddet, og hvilke bevægeudslag har det?","a":"**Art. radiocarpalis** (det egentlige håndled), **artt. intercarpales** (herunder art. mediocarpalis) og **artt. carpometacarpales (CMC, 'rodled')**. De danner funktionelt én enhed.\nPalmarfleksion–dorsifleksion: 80–0–80°. Ulnarfleksion–radialfleksion: 60–0–20°.","img":"r_ax7_13-2"},{"id":"ax7-t2","t":"ax7.hl","k":"text","q":"Art. radiocarpalis: beliggenhed og klassifikation?","a":"Mellem underarmsknoglerne og den proksimale række af håndrodsknogler.\nÆgte, sammensat **ellipsoidled**.","img":"r_ax7_13-2"},{"id":"ax7-t3","t":"ax7.hl","k":"text","q":"Art. radiocarpalis: hvad udgør ledhoved og ledskål?","a":"**Ledhoved:** os scaphoideum, os lunatum og os triquetrum (ikke pisiforme) + de interossøse ligamenter imellem dem.\n**Ledskål:** facies articularis carpalis radii + discus articularis (triangularis).","img":"r_ax7_13-2"},{"id":"ax7-t4","t":"ax7.hl","k":"text","q":"Art. radiocarpalis: hvordan er ledkapslen?","a":"Hæfter tæt ved bruskrandene og forstærkes af palmare og dorsale ligamenter samt kollaterale ligamenter.","img":"r_ax7_13-2"},{"id":"ax7-t5","t":"ax7.hl","k":"text","q":"Hvilke ligamenter ligger palmart på håndleddet?","a":"**Lig. radiocarpale palmare:** proc. styloideus radii → os lunatum + capitatum (klinik: Colles' fraktur).\n**Lig. ulnocarpale palmare:** distalt, palmart på ulna → os lunatum + capitatum.\n**Lig. pisohamatum** og **lig. pisometacarpale**.","img":"r_ax7_15-0"},{"id":"ax7-t6","t":"ax7.hl","k":"text","q":"Hvilke kollaterale ligamenter har håndleddet?","a":"**Lig. collaterale carpi radiale:** proc. styloideus radii → os scaphoideum.\n**Lig. collaterale carpi ulnare:** proc. styloideus ulnae → deler sig i to fasikler, én til os triquetrum og én til os pisiforme + fleksorretinaklet.","img":"r_ax7_15-0"},{"id":"ax7-t7","t":"ax7.hl","k":"text","q":"Hvad hedder det dorsale ligament på håndleddet, og hvilke strøg har det?","a":"**Lig. radiocarpale dorsale:**\nRadio-triquetrale strøg (proc. styloideus radii → os triquetrum + lunatum)\nScaphoideo-triquetrale strøg (transverselt)\nScaphoideo-capitale strøg (skråt)","img":"r_ax7_16-2"},{"id":"ax7-t8","t":"ax7.hl","k":"text","q":"Hvordan kan håndens ligamenter beskrives samlet?","a":"Palmart danner de **to V-former** fra radius og ulna til den proksimale og den distale række. Dorsalt danner de en **Z-form** med strøg primært fra radius og os scaphoideum i ulnar retning.\nAlle carpaler har desuden interne ligamenter, der sikrer stabilitet.","img":"r_ax7_17-2"},{"id":"ax7-t9","t":"ax7.hl","k":"text","q":"Lig. carpi radiatum, lig. pisohamatum og lig. pisometacarpale: hvor kommer de fra?","a":"**Lig. carpi radiatum:** udstråling fra os capitatum.\n**Lig. pisohamatum:** fortsættelse af m. flexor carpi ulnaris.\n**Lig. pisometacarpale:** fortsættelse af ovenstående til metacarpal IV og V.","img":"r_ax7_15-0"},{"id":"ax7-t10","t":"ax7.hl","k":"text","q":"Artt. intercarpales: beliggenhed, ledtype og funktion?","a":"Små glideled mellem alle håndrodsknoglerne. Ægte, sammensatte glideled med ligg. intercarpalia interossea.\nFunktion: 'forlænger' håndleddets bevægelser og bidrager til palmar- og dorsalfleksion.","img":"r_ax7_13-2"},{"id":"ax7-t11","t":"ax7.hl","k":"text","q":"Art. mediocarpalis: hvad er ledhoved og ledskål?","a":"Ligger mellem den proksimale og den distale række (betragtes som ét led).\n**Os capitatum** rager ind i den proksimale række og er ledhoved; den proksimale række (uden pisiforme) er ledskål. Der er uenighed om klassifikationen (ægte, sammensat glideled).","img":"r_ax7_13-2"},{"id":"ax7-t12","t":"ax7.hl","k":"text","q":"Artt. carpometacarpales (CMC, rodled): beliggenhed, type og bevægelse?","a":"Mellem den distale carpalrække og de fire ulnare metacarpaler. Ægte, enkle glideled (små og stramme).\nBasis af metacarpalerne er bundet sammen af ligg. metacarpalia interossea; 4. og 5. metacarpal er løsere bundet. Stort set ingen bevægelse, kun lette glidebevægelser.","img":"r_ax7_13-2"},{"id":"ax7-t13","t":"ax7.hl","k":"text","q":"Hvilke muskler virker på håndleddet, og hvilke bevægelser giver de?","a":"M. flexor carpi ulnaris, m. flexor carpi radialis, m. extensor carpi ulnaris og mm. extensores carpi radialis longus et brevis.\n2 fleksorer = **fleksion** (80°). 3 ekstensorer = **ekstension** (80°).\nDen ulnare ekstensor + fleksor = **adduktion** (ulnarfleksion, 60°). De radiale = **abduktion** (radialfleksion, 20°).","img":"r_ax7_43-2"},{"id":"ax7-t14","t":"ax7.fl","k":"text","q":"Hvad hedder fingrenes led, og hvilken ledtype er de?","a":"**MCP** (artt. metacarpophalangeales): grundled, indskrænket kugleled.\n**PIP** (art. interphalangealis proximalis): mellemled, hængselled.\n**DIP** (art. interphalangealis distalis): yderled, hængselled.","img":"r_ax7_25-2"},{"id":"ax7-t15","t":"ax7.fl","k":"text","q":"MCP-led: beliggenhed og ledtype?","a":"Mellem metacarpal og phalanx proximalis 2–5. Ægte, enkle, **indskrænkede kugleled**: virker som kugleled ved strakt led og som hængselled ved bøjet finger.","img":"r_ax7_27-0"},{"id":"ax7-t16","t":"ax7.fl","k":"text","q":"MCP-led: ledhoved, ledskål og kapsel?","a":"**Ledhoved:** caput af metacarpalet (halvkugleformet). **Ledskål:** basis af phalanx proximalis (tværoval, mindre end caput, derfor større bevægelighed).\nKapslen er slap og forstærkes af kollaterale og palmare ligamenter.","img":"r_ax7_27-0"},{"id":"ax7-t17","t":"ax7.fl","k":"text","q":"Hvilke ligamenter forstærker MCP-leddet?","a":"**Ligg. collateralia:** kraftigt bånd på hver side.\n**Ligg. palmaria (volarplader):** tykke fibrokartilaginøse plader palmart med furer til fleksorsenerne.\n**Lig. metacarpale transversum profundum:** fæstner ligg. palmaria til hinanden.","img":"r_ax7_27-0"},{"id":"ax7-t18","t":"ax7.fl","k":"text","q":"Hvorfor kaldes MCP-leddet et indskrænket kugleled?","a":"Ligg. collateralia forløber dorsalt i forhold til ledaksen. De er løse ved ekstension og strammes ved fleksion, så abduktion/adduktion og rotation hæmmes. Bevægeligheden er dynamisk.","img":"r_ax7_27-0"},{"id":"ax7-t19","t":"ax7.fl","k":"text","q":"MCP-led: hvilke bevægelser og udslag?","a":"Fleksion–ekstension: 90–0–45°. Adduktion–abduktion og rotation (nærmere cirkumduktion).","img":"r_ax7_27-0"},{"id":"ax7-t20","t":"ax7.fl","k":"text","q":"PIP- og DIP-led: type, ledhoved, ledskål og kapsel?","a":"Ægte, enkle **hængselled**.\n**Ledhoved:** caput af phalanx (trisseformet med føringsfure). **Ledskål:** basis af phalanx (tværoval med føringskam).\nKapslen er slap med stærke kollaterale ligamenter; det stærke lig. palmaria (volarplade) forhindrer dorsalfleksion.","img":"r_ax7_30-0"},{"id":"ax7-t21","t":"ax7.fl","k":"text","q":"PIP og DIP: udslag og muskler ved fleksion og ekstension?","a":"Fleksion: 0–100° (PIP) og 0–80° (DIP); samlet ca. 180°. PIP: m. flexor digitorum superficialis **og** profundus. DIP: **kun** m. flexor digitorum profundus.\nEkstension (0°): musklerne der hæfter i ekstensoraponeurosen: m. extensor digitorum, mm. interossei og mm. lumbricales.","img":"r_ax7_30-0"},{"id":"ax7-t22","t":"ax7.fl","k":"text","q":"Hvilke led har tommelfingeren, og hvad er ledtyperne?","a":"**CMC pollicis** (rodled): saddelled. **MCP pollicis** (grundled): hængselled. **IP pollicis** (yderled): hængselled.\nAlle bevægelser er ca. 90° proneret (brug neglelejet som reference).","img":"r_ax7_32-2"},{"id":"ax7-t23","t":"ax7.fl","k":"text","q":"Art. carpometacarpale pollicis: beliggenhed, type og stabilitet?","a":"Mellem os trapezium og basis af metacarpal I. Ægte, enkelt **saddelled** (saddelformede, modsat krummede, ufuldstændigt kongruente ledflader).\nSlap kapsel og lille ossøs stabilitet giver dårlig stabilitet, men meget stor bevægelighed.","img":"r_ax7_34-0"},{"id":"ax7-t24","t":"ax7.fl","k":"text","q":"Hvilket ligament stabiliserer tommelens CMC-led?","a":"**Lig. intermetacarpale (IMC)** mellem basis af 1. og 2. metacarpal (også kaldet lig. metacarpale interosseum). Fiksationsfunktion for abduktion/adduktion og slyngefunktion ved abduktion → cirkumduktion.","img":"r_ax7_32-2"},{"id":"ax7-t25","t":"ax7.fl","k":"text","q":"Art. carpometacarpale pollicis: bevægeudslag?","a":"Fleksion–ekstension: 20–0–20° (vinkelret på neglelejet).\nAbduktion/adduktion: 60–0° (i neglens plan).\nOpposition.","img":"r_ax7_34-0"},{"id":"ax7-t26","t":"ax7.fl","k":"text","q":"Hvad er opposition?","a":"**Abduktion + fleksion + medialrotation** af tommelen (mod digitus minimus).","img":"r_ax7_35-2"},{"id":"ax7-t27","t":"ax7.fl","k":"text","q":"MCP pollicis og IP pollicis: type, kapsel og udslag?","a":"Ægte, enkle hængselled med slap kapsel, kollaterale forstærkninger og palmar forstærkning (volarplade).\nLig. palmare ved MCP pollicis indeholder **to sesamknogler** (én ulnar og én radial), der fungerer som muskeltilhæftninger.\nMCP: fleksion–ekstension 50–0°. IP: 80–0–20°.","img":"r_ax7_32-2"},{"id":"ax7-t28","t":"ax7.gr","k":"text","q":"Hvad kendetegner håndens hvilestilling?","a":"Let dorsiflekteret håndled, fingrene samlet, alle led moderat flekteret og tommelen i opposition. Der er tiltagende fleksion og rotation ulnart.","img":"r_ax7_39-6"},{"id":"ax7-t29","t":"ax7.gr","k":"text","q":"Hvad kendetegner kraftgreb?","a":"Alle led flekteres omkring genstanden; fingrene når ca. ¾ rundt. Tommelen presser genstanden mod fingrene (opposition).\nDiagonalgreb: neutralt håndled (ketsjer). Tværgreb: 20° radialfleksion (øl). Længdegreb: 60° ulnarfleksion (spyd).","img":"r_ax7_39-6"},{"id":"ax7-t30","t":"ax7.gr","k":"text","q":"Hvad kendetegner præcisionsgreb?","a":"Også kaldet pincetgreb. Grundleddene (MCP) er flekterede, mellem- og yderled (PIP og DIP) mere eller mindre ekstenderede. Tommelen er i opposition mod 2. eller 3. finger.\nHåndleddet er ikke involveret, kun håndens egne muskler.","img":"r_ax7_39-6"},{"id":"ax7-t31","t":"ax7.gr","k":"text","q":"Hvad er nøglegrebet?","a":"En blanding af kraft- og præcisionsgreb. Alle led er flekterede, og tommelfingerbalden er i opposition og presser genstanden mod den radiale rand af en ulnar finger.","img":"r_ax7_40-2"},{"id":"ax7-t32","t":"ax7.gr","k":"text","q":"Hvad er funktionsstilling?","a":"Fleksion af grundleddene og ekstension af mellem- og yderled, uden involvering af tommelen.","img":"r_ax7_39-6"},{"id":"ax7-t33","t":"ax7.uf","k":"text","q":"Hvordan er underarmens muskler inddelt i loger, og hvad innerverer dem?","a":"Tre loger, hver med sit udspringshoved, omgivet af fascia antebrachii:\n**Fleksorloge:** n. medianus (flest) og n. ulnaris.\n**Ekstensorloge** (overfladisk og dyb): n. radialis.\n**Radiale ekstensorloge:** n. radialis.\nAdskilt af radius, ulna, membrana interossea og septa intermuscularia.","img":"r_ax7_44-0"},{"id":"ax7-t34","t":"ax7.uf","k":"text","q":"Hvor udspringer underarmens tre loger?","a":"**Fleksorlogen:** epicondylus medialis (caput commune flexorum, CCF).\n**Ekstensorlogen:** epicondylus lateralis (caput commune extensorum, CCE).\n**Radiallogen:** humerus, epicondylus lateralis, septum intermusculare laterale og ligamenter.","img":"r_ax7_44-0"},{"id":"ax7-t35","t":"ax7.uf","k":"text","q":"Hvor mange muskler har underarmen, og hvordan fordeler de sig?","a":"**20:** 8 i den forreste fleksorgruppe og 12 i den bagerste ekstensorgruppe.","img":"r_ax7_47-0"},{"id":"ax7-t36","t":"ax7.uf","k":"text","q":"Hvordan inddeles fleksorlogen i lag?","a":"'Den klassiske diamant' 4-1-2-1:\n**1. lag:** m. pronator teres, m. flexor carpi radialis, m. palmaris longus, m. flexor carpi ulnaris.\n**2. lag:** m. flexor digitorum superficialis.\n**3. lag:** m. flexor digitorum profundus, m. flexor pollicis longus.\n**4. lag:** m. pronator quadratus.","img":"r_ax7_46-0"},{"id":"ax7-t37","t":"ax7.uf","k":"text","q":"Hvilken nerve innerverer fleksorlogen?","a":"**N. medianus**, undtagen m. flexor carpi ulnaris og den ulnare del af m. flexor digitorum profundus, som innerveres af **n. ulnaris**.\nLag 1 og 2 har fælles udspring fra epicondylus medialis via CCF.","img":"r_ax7_47-0"},{"id":"ax7-t38","t":"ax7.uf","k":"text","q":"Hvad er retinaculum flexorum?","a":"Et bindevævsbånd, der nedbinder fleksorsenerne til hånden.","img":"r_ax7_47-0"},{"id":"ax7-t39","t":"ax7.uf","k":"text","q":"M. pronator teres: udspring, insertion, funktion?","a":"**Udspring:** caput humerale (epicondylus medialis via CCF) og caput ulnare (proc. coronoideus).\n**Insertion:** radius' lateralflade.\n**Funktion:** pronation (radioulnarled) og fleksion (albueled).\nN. medianus løber mellem de to hoveder.","img":"r_ax7_49-6"},{"id":"ax7-t40","t":"ax7.uf","k":"text","q":"M. flexor carpi radialis: udspring, insertion, funktion?","a":"**Udspring:** epicondylus medialis via CCF. **Insertion:** basis af metacarpal II–III.\n**Funktion:** art. radiocarpalis: fleksion og abduktion (radialdeviation); art. cubiti: fleksion og pronation.","img":"r_ax7_49-10"},{"id":"ax7-t41","t":"ax7.uf","k":"text","q":"M. palmaris longus: udspring, insertion, funktion?","a":"**Udspring:** epicondylus medialis via CCF. **Insertion:** aponeurosis palmaris (vifteformet).\n**Funktion:** opspænder aponeurosen. Variabel: findes ikke hos alle (ca. 50 %).","img":"r_ax7_49-10"},{"id":"ax7-t42","t":"ax7.uf","k":"text","q":"M. flexor carpi ulnaris: udspring, insertion, funktion, nerve?","a":"**Udspring:** epicondylus medialis via CCF + olecranon (skaber en senebue) + 2/3 proksimale margo posterior ulnae.\n**Insertion:** basis af metacarpal V via os pisiforme og os hamatum.\n**Funktion:** palmar fleksion og adduktion (ulnardeviation).\n**Nerve:** n. ulnaris, som løber under senebuen.","img":"r_ax7_49-10"},{"id":"ax7-t43","t":"ax7.uf","k":"text","q":"M. flexor digitorum superficialis: udspring, insertion, funktion?","a":"**Udspring:** epicondylus medialis via CCF, proc. coronoideus og radius' forflade (senebro).\n**Insertion:** siderne af phalanx media II–V. Senen deler sig i to snipper ud for mellemleddet og danner chiasma tendinum.\n**Funktion:** palmarfleksion samt fleksion i MCP og PIP. **Nerve:** n. medianus.","img":"r_ax7_51-0"},{"id":"ax7-t44","t":"ax7.uf","k":"text","q":"M. flexor digitorum profundus: udspring, insertion, funktion, nerve?","a":"**Udspring:** øverste 2/3 af ulnas forflade + membrana interossea.\n**Insertion:** basis af phalanx distalis II–V (går under chiasma tendinum).\n**Funktion:** fleksion af alle passerede led (knytnæve).\n**Nerve:** radiale del n. medianus, ulnare del n. ulnaris.","img":"r_ax7_52-0"},{"id":"ax7-t45","t":"ax7.uf","k":"text","q":"Hvorfor kan yderleddene ikke flekteres helt selvstændigt?","a":"M. flexor digitorum profundus opfattes som én muskel med fire sener, som desuden er forbundet med bindevæv og senestrenge. Pegefingeren kan dog som regel flekteres selvstændigt (modsat m. flexor digitorum superficialis).","img":"r_ax7_52-0"},{"id":"ax7-t46","t":"ax7.uf","k":"text","q":"M. flexor pollicis longus: udspring, insertion, funktion, nerve?","a":"**Udspring:** forfladen af midten af radius + membrana interossea.\n**Insertion:** basis af phalanx distalis 1.\n**Funktion:** fleksion af tommelfingeren. **Nerve:** n. medianus.\nSenen passerer fleksorretinaklet mest radialt.","img":"r_ax7_52-0"},{"id":"ax7-t47","t":"ax7.uf","k":"text","q":"M. pronator quadratus: udspring, insertion, funktion, nerve?","a":"**Udspring:** distale ¼ af ulnas forflade. **Insertion:** distale ¼ af radius' forflade.\n**Funktion:** pronation og sammenbinding af radius og ulna. **Nerve:** n. medianus.","img":"r_ax7_53-2"},{"id":"ax7-t48","t":"ax7.uf","k":"text","q":"Hvad er chiasma tendinum, og hvordan er senerne arrangeret?","a":"De superficielle fleksorsener (m. flexor digitorum superficialis) spaltes ud for mellemleddet. Snipperne inserer på mellemstykket og nedbindes af vincula longa et brevia.\nDe profunde fleksorsener passerer gennem chiasmaet for at inserere på yderstykket.","img":"r_ax7_55-1"},{"id":"ax7-t49","t":"ax7.ue","k":"text","q":"Hvordan inddeles underarmens 12 ekstensorer?","a":"**Radiale ekstensorer (3):** m. brachioradialis, m. extensor carpi radialis longus og brevis.\n**Overfladiske (4):** m. extensor carpi ulnaris, m. anconeus, m. extensor digitorum, m. extensor digiti minimi.\n**Dybe (5):** m. supinator, m. abductor pollicis longus, m. extensor pollicis brevis og longus, m. extensor indicis.","img":"r_ax7_64-6"},{"id":"ax7-t50","t":"ax7.ue","k":"text","q":"Hvor udspringer ekstensorerne, og hvad innerverer dem?","a":"Fælles udspring fra epicondylus lateralis via CCE.\nAlle innerveres af **n. radialis**: m. brachioradialis og m. extensor carpi radialis longus direkte, resten via r. profundus n. radialis.","img":"r_ax7_64-6"},{"id":"ax7-t51","t":"ax7.ue","k":"text","q":"Hvad er retinaculum extensorum?","a":"En ca. 2 cm bred forstærkning af fascia antebrachii, der nedbinder senerne til håndleddet (radius → caput ulnae + os triquetrum). Den danner **6 osteofibrøse kulisser** (nummereret radialt → ulnart), hvor senerne løber svøbt i vagina synovialis.","img":"r_ax7_62-4"},{"id":"ax7-t52","t":"ax7.ue","k":"text","q":"Hvilke sener løber i de 6 kulisser (radialt → ulnart)?","a":"**1:** m. abductor pollicis longus + m. extensor pollicis brevis\n**2:** m. extensor carpi radialis longus + brevis\n**3:** m. extensor pollicis longus (skråkulissen)\n**4:** m. extensor digitorum + m. extensor indicis\n**5:** m. extensor digiti minimi\n**6:** m. extensor carpi ulnaris","img":"r_ax7_62-4"},{"id":"ax7-t53","t":"ax7.ue","k":"text","q":"M. brachioradialis: udspring, insertion, funktion?","a":"**Udspring:** distale 1/3 af margo lateralis humeri + septum intermusculare laterale.\n**Insertion:** proc. styloideus radii.\n**Funktion:** fleksion i albuen (kantstilling). Afgrænser fossa cubitalis lateralt. Nerve: n. radialis direkte.","img":"r_ax7_63-12"},{"id":"ax7-t54","t":"ax7.ue","k":"text","q":"M. extensor carpi radialis longus: udspring, insertion, funktion?","a":"**Udspring:** crista supracondylaris + epicondylus lateralis. **Insertion:** basis af metacarpal II.\n**Funktion:** art. radiocarpalis: abduktion og dorsalfleksion; art. cubiti: fleksion. Løber i 2. kulisse.","img":"r_ax7_63-12"},{"id":"ax7-t55","t":"ax7.ue","k":"text","q":"M. extensor carpi radialis brevis: udspring, insertion, funktion?","a":"**Udspring:** epicondylus lateralis via CCE, lig. collaterale radii og lig. annulare radii.\n**Insertion:** basis af metacarpal III.\n**Funktion:** abduktion og dorsalfleksion i art. radiocarpalis. Løber i 2. kulisse.","img":"r_ax7_63-12"},{"id":"ax7-t56","t":"ax7.ue","k":"text","q":"M. extensor carpi ulnaris: udspring, insertion, funktion?","a":"**Udspring:** epicondylus lateralis via CCE, lig. collaterale radii og ulnas bagkant (proksimalt).\n**Insertion:** basis af metacarpal V.\n**Funktion:** adduktion og dorsalfleksion. Løber i 6. kulisse.","img":"r_ax7_64-6"},{"id":"ax7-t57","t":"ax7.ue","k":"text","q":"M. anconeus: udspring, insertion, funktion?","a":"**Udspring:** epicondylus lateralis (bagsiden). **Insertion:** ulnas bagflade proksimalt.\n**Funktion:** ekstension i art. cubiti. Samme innervation (n. radialis) og virkning som m. triceps brachii; kaldes også triceps' 4. hoved.","img":"r_ax7_64-6"},{"id":"ax7-t58","t":"ax7.ue","k":"text","q":"M. extensor digitorum: udspring, insertion, funktion?","a":"**Udspring:** epicondylus lateralis via CCE. **Insertion:** grund-, mellem- og yderstykke II–V via ekstensoraponeurosen (senerne er forbundet via connexus intertendinei).\n**Funktion:** ekstension af alle passerede led. Løber i 4. kulisse.","img":"r_ax7_64-6"},{"id":"ax7-t59","t":"ax7.ue","k":"text","q":"M. extensor digiti minimi: udspring, insertion, funktion?","a":"**Udspring:** epicondylus lateralis via CCE. **Insertion:** ekstensoraponeurosen på lillefingeren.\n**Funktion:** ekstension af lillefingeren ('dobbeltforsyning'). Løber i 5. kulisse.","img":"r_ax7_64-6"},{"id":"ax7-t60","t":"ax7.ue","k":"text","q":"M. extensor pollicis longus: udspring, insertion, funktion?","a":"**Udspring:** ulnas bagflade + tilstødende membrana interossea (distalt for m. abductor pollicis longus).\n**Insertion:** basis af phalanx distalis I. **Funktion:** ekstension.\nLøber i 3. kulisse (skråkulissen), tabatieren.","img":"r_ax7_68-2"},{"id":"ax7-t61","t":"ax7.ue","k":"text","q":"M. extensor indicis: udspring, insertion, funktion?","a":"**Udspring:** ulnas bagflade distalt + tilstødende membrana interossea. **Insertion:** ekstensoraponeurosen. **Funktion:** ekstension (pegefinger). Løber i 4. kulisse.","img":"r_ax7_68-2"},{"id":"ax7-t62","t":"ax7.ue","k":"text","q":"M. supinator: udspring, insertion, funktion?","a":"**Udspring:** epicondylus lateralis via CCE, lig. collaterale radii og proksimale ulna.\n**Insertion:** radius (proksimale 1/3, lateralflade og forside). **Funktion:** supination.","img":"r_ax7_68-2"},{"id":"ax7-t63","t":"ax7.ue","k":"text","q":"Hvad er Frohses kanal?","a":"R. profundus n. radialis passerer under en senebue i m. supinator (Frohses kanal/arkade) og hedder efter passagen **n. interosseus posterior**.","img":"r_ax7_69-3"},{"id":"ax7-t64","t":"ax7.ue","k":"text","q":"M. abductor pollicis longus: udspring, insertion, funktion?","a":"**Udspring:** membrana interossea + tilstødende ulna og radius. **Insertion:** basis af metacarpal I (radial side).\n**Funktion:** abduktion af tommelens rodled (CMC). Løber i 1. kulisse (tabatieren).","img":"r_ax7_68-2"},{"id":"ax7-t65","t":"ax7.ue","k":"text","q":"M. extensor pollicis brevis: udspring, insertion, funktion?","a":"**Udspring:** radius + tilstødende membrana interossea, distalt for m. abductor pollicis longus.\n**Insertion:** basis af phalanx proximalis I. **Funktion:** ekstension i tommelens grundled (MCP). Løber i 1. kulisse.","img":"r_ax7_68-2"},{"id":"ax7-t66","t":"ax7.ue","k":"text","q":"Hvordan inserer ekstensoraponeurosen?","a":"Tre insertioner: (1) basis af grundstykket via en central snip; ud for midten af grundstykket deles senen i tre snipper: (2) basis af mellemstykket aksialt og (3) basis af yderstykket via kollateraler (tillader samtidig fleksion af PIP og ekstension af DIP).","img":"r_ax7_67-1"},{"id":"ax7-t67","t":"ax7.ue","k":"text","q":"Hvilke muskler inserer i ekstensoraponeurosen, og hvad er specielt ved mm. interossei og lumbricales?","a":"M. extensor digitorum, m. extensor indicis og m. extensor digiti minimi, samt mm. interossei og lumbricales.\nInterossei og lumbricales forløber palmart for MCP-aksen og dorsalt for PIP- og DIP-akserne, så de som de eneste kan **flektere MCP og ekstendere PIP og DIP**.","img":"r_ax7_67-1"},{"id":"ax7-t68","t":"ax7.ue","k":"text","q":"Hvad skal man huske, hvis man bliver bedt om underarmens bagerste muskelgruppe?","a":"Spørg, om den radiale ekstensorloge er med eller ej. Bogen beskriver ekstensorlogen og den radiale ekstensorloge samlet som 'underarmens bagerste muskelgruppe'.","img":"r_ax7_64-6"},{"id":"ax7-t69","t":"ax7.sc","k":"text","q":"Hvad er en bursa, og hvilke bursae har hånden?","a":"Bursa = slimsæk fyldt med synovialvæske. **Bursa manus** er opdelt i **bursa radialis** (senen fra m. flexor pollicis longus) og **bursa ulnaris** (både de profunde og superficielle fleksorer). Der er desuden en bursa til tendo m. flexoris carpi radialis i et dybere plan.","img":"r_ax7_56-0"},{"id":"ax7-t70","t":"ax7.sc","k":"text","q":"Hvad er en seneskede (vagina tendinis)?","a":"En forlænget bursa + fibrøs membran omkring: vagina synovialis (synovialmembran) + vagina fibrosa.\nPå fingrene fortsætter senerne i vagina synovialis, dækket af fibrøse seneskeder.","img":"r_ax7_56-0"},{"id":"ax7-t71","t":"ax7.sc","k":"text","q":"Hvilke forstærkninger findes i vagina fibrosa?","a":"**Annulare** (ringformede): stærke.\n**Cruciforme** (korsformede): svagere, sidder ud for leddene.","img":"r_ax7_56-0"},{"id":"ax7-t72","t":"ax7.sc","k":"text","q":"Hvordan er canalis carpi afgrænset?","a":"Adgang fra underarm til hånd. **Opadtil:** retinaculum flexorum (tværgående, stærkt ligament fra os pisiforme + hamatum til os scaphoideum + trapezium). **Nedadtil:** sulcus carpi dannet af carpalknoglerne.","img":"r_ax7_58-3"},{"id":"ax7-t73","t":"ax7.sc","k":"text","q":"Hvilke strukturer løber igennem canalis carpi?","a":"De lange fleksorsener: m. flexor digitorum superficialis, m. flexor digitorum profundus og m. flexor pollicis longus (mest radialt), samt **n. medianus**.\nM. flexor carpi radialis løber for sig selv i en egen kanal.","img":"r_ax7_58-3"},{"id":"ax7-t74","t":"ax7.pm","k":"text","q":"Hvordan afgrænses hånden (manus), og hvordan inddeles muskulaturen?","a":"**Proksimalt:** et transversalt plan ca. en fingersbredde over spidsen af proc. styloideus radii (svarende til radiocarpalleddet). **Distalt:** fingerspidserne.\nMuskulaturen er delt i fire grupper: **thenar**, **hypothenar**, **vola manus** (den centrale loge) og **spatia interossea**.","img":"r_ax7_80-17"},{"id":"ax7-t75","t":"ax7.pm","k":"text","q":"Hvilken disposition bruges til regionær gennemgang af palma manus?","a":"1) Afgrænsning, form og overflade. 2) Hud. 3) Underhud. 4) Aponeurosis palmaris. 5) Subfascielle muskelloger og bindevævsspatier (beskrives enkeltvis).","img":"r_ax7_80-17"},{"id":"ax7-t76","t":"ax7.pm","k":"text","q":"Hvad kendetegner palma manus' hud og underhud?","a":"Huden er tyk og fast bundet, med to longitudinelle og to transverselle furer. Kutan innervation: n. medianus og n. ulnaris. Ingen talgkirtler, mange svedkirtler.\nSubcutis: retinacula cutis underopdeler fedtet i små kamre og binder huden til underlaget. Indeholder m. palmaris brevis.","img":"r_ax7_76-9"},{"id":"ax7-t77","t":"ax7.pm","k":"text","q":"Hvordan afgrænses palma manus, og hvad er vola manus?","a":"Fra håndleddet til plicae natatoriae, radialt til tommelens grundled. **Vola manus** ('hulhånden') er en trekantet central udhuling, der peger proksimalt, begrænset radialt af thenar og ulnart af hypothenar. Distalt ses tre fremhvælvinger svarende til ruderne i aponeurosis palmaris.","img":"r_ax7_80-17"},{"id":"ax7-t78","t":"ax7.pm","k":"text","q":"Hvad er aponeurosis palmaris?","a":"Vola manus' fascie: en trekantet seneplade med spidsen proksimalt. Hæfter til fleksorretinaklet og fortsætter i m. palmaris longus.\nLongitudinelle strøg mod 2.–5. finger: **overfladiske** fibre fortaber sig i huden, **dybe** fibre hæfter med sagittale septae på metacarpalerne, ligg. palmaria og basis af phalanx proximalis og danner 'tunneller' for fleksorsenerne.\nOpspændes ved ekstension i MCP, så huden bliver uforskydelig.","img":"r_ax7_77-2"},{"id":"ax7-t79","t":"ax7.pm","k":"text","q":"Hvad indeholder 'ruderne' i aponeurosis palmaris?","a":"To nn. digitales palmares proprii, der omgiver én a. digitalis palmaris communis.\nRudernes distale del er lig. metacarpale transversum superficiale (også ligg. natatoria).","img":"r_ax7_77-2"},{"id":"ax7-t80","t":"ax7.pm","k":"text","q":"Hvilke muskler hører til thenar, hypothenar, den centrale gruppe og de interossøse rum?","a":"**Thenar:** m. abductor pollicis brevis, m. flexor pollicis brevis, m. opponens pollicis, m. adductor pollicis.\n**Hypothenar:** m. abductor digiti minimi, m. flexor digiti minimi brevis, m. opponens digiti minimi, m. palmaris brevis (i subcutis).\n**Central:** mm. lumbricales. **Interossøse:** mm. interossei palmares og dorsales.","img":"r_ax7_86-0"},{"id":"ax7-t81","t":"ax7.pm","k":"text","q":"Hvordan er håndens muskler innerveret (huskeregel)?","a":"**Alt n. ulnaris undtagen '½ LOAF' (n. medianus):** radiale halvdel af **L**umbricales, **O**pponens pollicis, **A**bductor pollicis brevis, **F**lexor pollicis brevis.\nM. adductor pollicis innerveres af n. ulnaris.","img":"r_ax7_80-17"},{"id":"ax7-t82","t":"ax7.pm","k":"text","q":"Hvordan er thenar opbygget i lag?","a":"**1. lag:** m. abductor pollicis brevis + m. flexor pollicis brevis. **2. lag:** m. opponens pollicis. **3. lag:** m. adductor pollicis.\nNerve til de radiale: r. muscularis n. medianus (recurrent over tendo m. flexor pollicis longus).","img":"r_ax7_86-0"},{"id":"ax7-t83","t":"ax7.pm","k":"text","q":"M. adductor pollicis: udspring, insertion, funktion?","a":"**Udspring:** caput transversum fra metacarpal III; caput obliquum fra carpaler + ligamenter i sulcus carpi.\n**Insertion:** basis ulnart på phalanx proximalis 1 via sesamknogle.\n**Funktion:** adduktion. 3. lag. Nerve: n. ulnaris.","img":"r_ax7_86-0"},{"id":"ax7-t84","t":"ax7.pm","k":"text","q":"M. abductor pollicis brevis og m. flexor pollicis brevis: udspring, insertion, funktion?","a":"Begge udspringer fra retinaculum flexorum + radielle carpaler og inserer radialt på basis af phalanx proximalis 1 via sesamknogle.\n**APB:** abduktion af pollex. **FPB:** fleksion (CMC og MCP). Begge i 1. lag, n. medianus.","img":"r_ax7_86-0"},{"id":"ax7-t85","t":"ax7.pm","k":"text","q":"M. opponens pollicis: udspring, insertion, funktion?","a":"**Udspring:** retinaculum flexorum + radielle carpaler. **Insertion:** radiale kant af corpus metacarpale 1.\n**Funktion:** opposition. 2. lag. Nerve: n. medianus.","img":"r_ax7_86-0"},{"id":"ax7-t86","t":"ax7.pm","k":"text","q":"Hypothenar: hvordan er det opbygget, og hvilken nerve?","a":"To lag. 1. lag: m. abductor digiti minimi + m. flexor digiti minimi brevis. 2. lag: m. opponens digiti minimi.\nM. palmaris brevis ligger i subcutis. Nerve: **r. profundus n. ulnaris** (adskiller abduktoren og fleksoren).","img":"r_ax7_86-0"},{"id":"ax7-t87","t":"ax7.pm","k":"text","q":"M. palmaris brevis: udspring, insertion, funktion?","a":"**Udspring:** aponeurosis palmaris' ulnare kant. **Insertion:** huden på den ulnare håndkant.\n**Funktion:** rynker huden ('forbedrer greb'). Ligger i subcutis.","img":"r_ax7_86-0"},{"id":"ax7-t88","t":"ax7.pm","k":"text","q":"M. abductor digiti minimi, m. flexor digiti minimi brevis, m. opponens digiti minimi: udspring, insertion, funktion?","a":"Alle udspringer fra retinaculum flexorum + ulnare carpus.\n**Abductor:** basis ulnart på phalanx proximalis 5; abduktion og fleksion.\n**Flexor brevis:** insertion sammen med abduktoren; fleksion.\n**Opponens:** ulnare kant af corpus metacarpale 5; rotation (art. carpometacarpalis).","img":"r_ax7_86-0"},{"id":"ax7-t89","t":"ax7.pm","k":"text","q":"Mm. lumbricales: udspring, insertion, funktion, nerve?","a":"Fire små ormeformede muskler.\n**Udspring:** fra tendo m. flexor digitorum profundus (2 radiale semipennate, 2 ulnare pennate).\n**Insertion:** radiale kant af ekstensoraponeurosen på de 4 ulnare fingre.\n**Funktion:** fleksion i MCP og ekstension i PIP og DIP; proprioceptiv funktion (højt indhold af muskelspoler, stillingssans).\n**Nerve:** 2 radiale n. medianus, 2 ulnare n. ulnaris.","img":"r_ax7_85-0"},{"id":"ax7-t90","t":"ax7.pm","k":"text","q":"Mm. interossei palmares: udspring, insertion, funktion?","a":"3 stk. **Udspring:** semipennat fra 2., 4. og 5. metacarpal. **Insertion:** basis af phalanx proximalis 2, 4 og 5 + ekstensoraponeurosen (divergent i forhold til langaksen gennem 3. finger).\n**Funktion:** samler fingrene. Nerve: n. ulnaris.","img":"r_ax7_83-2"},{"id":"ax7-t91","t":"ax7.pm","k":"text","q":"Mm. interossei dorsales: udspring, insertion, funktion?","a":"4 stk. **Udspring:** pennat mellem to tilstødende metacarpaler. **Insertion:** basis af phalanx proximalis + ekstensoraponeurosen (konvergent i forhold til langaksen gennem 3. finger).\n**Funktion:** spreder fingrene. Nerve: n. ulnaris.\nHuskeregel: de dorsale driver fingrene væk, de palmare parkerer dem.","img":"r_ax7_84-11"},{"id":"ax7-t92","t":"ax7.pm","k":"text","q":"Hvad er interossei og lumbricales' fælles funktion i præcisionsgreb?","a":"Insertionssenerne passerer palmart for grundleddene, så de giver MCP-fleksion og PIP-/DIP-ekstension (præcisionsgreb).","img":"r_ax7_85-0"},{"id":"ax7-t93","t":"ax7.pm","k":"text","q":"Hvordan deles den centrale loge (spatium palmare centrale)?","a":"Senerne til m. flexor digitorum superficialis og profundus med mm. lumbricales todeler vola manus-logen:\n**Prætendinøst:** arcus palmaris superficialis og grene, n. medianus, r. superficialis n. ulnaris.\n**Retrotendinøst:** arcus palmaris profundus og grene, r. profundus n. ulnaris.","img":"r_ax7_80-17"},{"id":"ax7-t94","t":"ax7.pm","k":"text","q":"Hvad er spatia interossea?","a":"Rummet mellem metacarpalerne, hvor mm. interossei palmares et dorsales ligger. Over dem ligger et fascieblad, der distalt fortykkes til lig. metacarpale transversum profundum (det ligament, der forbinder volarpladerne).","img":"r_ax7_80-17"},{"id":"ax7-t95","t":"ax7.kl","k":"text","q":"Hvad er Colles' fraktur, og hvordan opstår den?","a":"Ved fald på udstrakt hånd kan lig. radiocarpale palmare fremtvinge en avulsionsfraktur af den distale radius: ligamentet holder, og knoglen giver efter.","img":"r_ax7_15-0"},{"id":"ax7-t96","t":"ax7.kl","k":"text","q":"Hvad er en ruptur af tommelens UCL, og hvorfor er den vigtig?","a":"Ruptur af lig. collaterale ulnare ved MCP pollicis. Ses ved faldtraumer, hvor tommelfingeren hyperabduceres (skiløbere).\nMå ikke overses, da det ubehandlet kan give manglende nøglegrebsfunktion. Ligamentet kan ikke selv hele (operationsindikation). Testes på flekteret tommelfinger.","img":"r_ax7_37-2"},{"id":"ax7-t97","t":"ax7.kl","k":"text","q":"Hvad er karpaltunnelsyndrom?","a":"Hyppig kontraktion af fleksorerne irriterer senerne i canalis carpi, så de svulmer op og trykker på n. medianus. Højere prævalens ved diabetes og/eller overvægt.\nSymptomer: paræstesier, smerter, sensibilitetsudfald og til sidst pareser, især i thenar. Værst om natten.\nBehandling: dekompression ved snit gennem fleksorretinaklet, ulnart for at undgå den motoriske gren til thenar.","img":"r_ax7_60-2"},{"id":"ax7-t98","t":"ax7.kl","k":"text","q":"Hvad er Dupuytrens kontraktur?","a":"Skrumpning af aponeurosis palmaris' longitudinelle strøg, oftest til IV. og V. finger. Grundleddet holdes flekteret. Kan afhjælpes ved kirurgisk løsning af aponeurosen fra dens tilhæftninger.","img":"r_ax7_78-4"},{"id":"ax7-o99","t":"ax7.fl","k":"occ","img":"a7thumb","boxes":[[2.196,90.775,7.686,6.273],[19.451,91.021,7.647,6.027],[37.059,91.021,7.49,6.273],[55.137,91.39,5.647,6.15],[72.745,91.513,8.196,7.134],[88.98,91.759,7.961,7.134]],"target":0,"a":"Abduktion","n":"Tommelens abduktion (i neglens plan): 60–0°."},{"id":"ax7-o100","t":"ax7.fl","k":"occ","img":"a7thumb","boxes":[[2.196,90.775,7.686,6.273],[19.451,91.021,7.647,6.027],[37.059,91.021,7.49,6.273],[55.137,91.39,5.647,6.15],[72.745,91.513,8.196,7.134],[88.98,91.759,7.961,7.134]],"target":1,"a":"Adduktion","n":"Tommelens adduktion (i neglens plan)."},{"id":"ax7-o101","t":"ax7.fl","k":"occ","img":"a7thumb","boxes":[[2.196,90.775,7.686,6.273],[19.451,91.021,7.647,6.027],[37.059,91.021,7.49,6.273],[55.137,91.39,5.647,6.15],[72.745,91.513,8.196,7.134],[88.98,91.759,7.961,7.134]],"target":2,"a":"Ekstension","n":"Vinkelret på neglelejet: fleksion–ekstension 20–0–20° i CMC."},{"id":"ax7-o102
