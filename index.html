t":"Røntgenbillede af hånden med nummererede strukturer"},{"id":"ax7-n135","t":"ax7.fl","k":"num","img":"xray","bone":"Hånden (røntgen)","nr":8,"a":"Art. CMC III","n":"Carpometacarpalled ved metacarpal III (glideled).","ask":"Hvad er markeret med nr. {nr}?","alt":"Røntgenbillede af hånden med nummererede strukturer"},{"id":"ax7-n136","t":"ax7.fl","k":"num","img":"xray","bone":"Hånden (røntgen)","nr":9,"a":"Art. MCP V","n":"Grundled på lillefingeren (indskrænket kugleled).","ask":"Hvad er markeret med nr. {nr}?","alt":"Røntgenbillede af hånden med nummererede strukturer"},{"id":"ax7-n137","t":"ax7.fl","k":"num","img":"xray","bone":"Hånden (røntgen)","nr":10,"a":"Art. PIP","n":"Mellemled (hængselled) på lillefingeren.","ask":"Hvad er markeret med nr. {nr}?","alt":"Røntgenbillede af hånden med nummererede strukturer"},{"id":"ax7-n138","t":"ax7.fl","k":"num","img":"xray","bone":"Hånden (røntgen)","nr":11,"a":"Art. DIP","n":"Yderled (hængselled) på lillefingeren.","ask":"Hvad er markeret med nr. {nr}?","alt":"Røntgenbillede af hånden med nummererede strukturer"},{"id":"ax8-t1","t":"ax8.kg","k":"text","q":"Hvad er forskellen på arterier og vener?","a":"**Arterier** fører blod væk fra hjertet og bringer ilt og næringsstoffer til vævene.\n**Vener** fører blod til hjertet: afiltet, CO2-rigt blod til hjerte-lungekredsløbet. De optager desuden næringsstoffer fra mave-tarmkanalen.","img":"r_ax8_8-6"},{"id":"ax8-t2","t":"ax8.kg","k":"text","q":"Hvilke tre opgaver har lymfesystemet?","a":"Dræner vævsvæske og tømmer sig i venerne ved halsroden. Indeholder lymfeknuder.\n1) Opsamle overflødig væske og føre den tilbage til blodkarsystemet. 2) Detektere vira, bakterier o.l. og præsentere dem for lymfocytter i lymfeknuderne. 3) Transportere fedtmolekyler fra GI-kanalen til blodbanen.","img":"r_ax8_8-6"},{"id":"ax8-t3","t":"ax8.kg","k":"text","q":"Hvad skal man kunne sige om et kar til eksamen?","a":"Navn; hvor karret starter og slutter (hvornår navnet skifter); forløb og relationer til nerver, muskler m.m.; hvilke grene der afgives, hvor og hvordan de forløber; hvilke områder og strukturer karret forsyner.","img":"r_ax8_8-6"},{"id":"ax8-t4","t":"ax8.kg","k":"text","q":"Hvor udspringer OE's arterier fra?","a":"Fra arcus aorta → truncus brachiocephalicus (kun på højre side) → **a. subclavia**, som forsyner hele overekstremiteten. Husk at angive sin. eller dex. ved a./v. subclavia.","img":"r_ax8_8-6"},{"id":"ax8-t5","t":"ax8.kg","k":"text","q":"Hvilke arterier findes fra costa 1 til fingerpulpa, og hvad forsyner de?","a":"**A. axillaris:** axillen og skulderen. **A. brachialis:** overarmen. **Aa. radialis et ulnaris:** underarmen. **Arci palmaris superficialis et profundus:** hånden.","img":"r_ax8_8-6"},{"id":"ax8-t6","t":"ax8.kg","k":"text","q":"Hvornår hedder OE's hovedarterie hvad?","a":"A. subclavia → (ved lateral kant af costa 1) **a. axillaris** → (ved underkanten af m. teres major) **a. brachialis** → (i fossa cubitalis) **a. radialis** og **a. ulnaris**.\nOE kar starter fra a. axillaris; a. subclavia er ikke en del af 'OE kar'.","img":"r_ax8_8-6"},{"id":"ax8-t7","t":"ax8.kg","k":"text","q":"Hvordan er skalenerporten afgrænset, og hvad løber igennem den?","a":"Mellem m. scalenus anterior og m. scalenus medius; bunden er sulcus a. subclaviae på costa 1.\nGennem porten løber **plexus brachialis** og **a. subclavia**. **V. subclavia** løber foran skalenerporten (foran m. scalenus anterior).","img":"r_ax8_12-2"},{"id":"ax8-t8","t":"ax8.kg","k":"text","q":"Skalenermusklerne: udspring og insertion?","a":"**Anterior:** tuberculum anterius på proc. transversus C3–C6 → costa 1 foran sulcus a. subclaviae.\n**Medius:** tuberculum posterius på proc. transversus C1–C7 → costa 1 bagved sulcus a. subclaviae.\n**Posterior:** tuberculum posterius C3–C4 → costa 2.","img":"r_ax8_12-2"},{"id":"ax8-t9","t":"ax8.kg","k":"text","q":"A. subclavia: hvordan forløber den?","a":"Bag art. sternoclavicularis, lateralt gennem skalenerporten hvilende på costa 1 (sulcus a. subclaviae). Fra lateral kant af costa 1 skifter den navn til a. axillaris og løber ned i fossa axillaris i en fælles bindevævsskede med plexus brachialis.","img":"r_ax8_8-6"},{"id":"ax8-t10","t":"ax8.kg","k":"text","q":"Hvilke fire grene afgår fra a. subclavia (mediale del)?","a":"1) **A. vertebralis**. 2) **Truncus thyrocervicalis** (afgiver først a. suprascapularis til m. supra- og infraspinatus). 3) **A. thoracica interna**. 4) **Truncus costocervicalis**.\nGrenene afgår medialt for m. scalenus anterior.","img":"r_ax8_13-2"},{"id":"ax8-t11","t":"ax8.fa","k":"text","q":"Hvad er fossa axillaris?","a":"Et bindevævsrum i armhulen med form som en tresidet pyramide (med apex og basis), som indeholder kar-nervebundtet til OE.","img":"r_ax8_14-2"},{"id":"ax8-t12","t":"ax8.fa","k":"text","q":"Fossa axillaris: hvad udgør apex og basis?","a":"**Apex:** costa 1, angulus superior scapulae og clavicula ('canalis cervico-axillaris'): passage for a. et v. axillaris og plexus brachialis.\n**Basis:** fascia axillaris (mellem m. pectoralis major og m. latissimus dorsi).","img":"r_ax8_14-2"},{"id":"ax8-t13","t":"ax8.fa","k":"text","q":"Fossa axillaris: hvad udgør forvæg og bagvæg?","a":"**Forvæg:** superficielt m. pectoralis major (forreste axilfold); profundt m. subclavius – fascia clavipectoralis – m. pectoralis minor – lig. suspensorium.\n**Bagvæg:** kranielt m. subscapularis; kaudalt mm. latissimus dorsi og teres major (bagerste axilfold); lateralt caput longum af m. triceps brachii.","img":"r_ax8_14-2"},{"id":"ax8-t14","t":"ax8.fa","k":"text","q":"Fossa axillaris: hvad udgør medialvæg og lateralvæg?","a":"**Medialvæg:** de øverste 6 costae, mm. intercostales og m. serratus anterior.\n**Lateralvæg:** findes strengt taget ikke; her ligger humerus.","img":"r_ax8_14-2"},{"id":"ax8-t15","t":"ax8.fa","k":"text","q":"Hvad er fascia axillaris?","a":"Axillens bundfascie; ligger lige under huden i armhulen og løftes op af lig. suspensorium axillae.","img":"r_ax8_14-3"},{"id":"ax8-t16","t":"ax8.fa","k":"text","q":"Hvad afgrænser de tre intersticer?","a":"**Mediale trekantede:** m. teres minor, m. teres major, m. subscapularis, caput longum m. tricipitis.\n**Firkantede (laterale):** caput longum m. tricipitis, m. teres major, m. teres minor, humerus (collum chirurgicum).\n**Nedre (laterale) trekantede:** caput longum m. tricipitis, m. teres major, proksimale humerus.","img":"r_ax8_16-2"},{"id":"ax8-t17","t":"ax8.fa","k":"text","q":"Hvad løber igennem de tre intersticer?","a":"**Mediale trekantede:** a. circumflexa scapulae.\n**Firkantede:** a. circumflexa humeri posterior + n. axillaris.\n**Nedre trekantede:** a. profunda brachii + n. radialis.","img":"r_ax8_16-2"},{"id":"ax8-t18","t":"ax8.fa","k":"text","q":"Hvordan kan man huske intersticerne?","a":"Ved at lave deres form med fingrene.","img":"r_ax8_16-2"},{"id":"ax8-t19","t":"ax8.aa","k":"text","q":"A. axillaris: start, slut og forløb?","a":"**Start:** lateral kant af costa 1 (apex af fossa axillaris). **Slut:** underkanten af m. teres major (bageste axilfold).\nLøber gennem fossa axillaris omkranset af plexus brachialis (medialt, lateralt og posteriort, ikke anteriort, hvor v. axillaris ses) i en fælles bindevævsskede, og posteriort for m. coracobrachialis.","img":"r_ax8_25-6"},{"id":"ax8-t20","t":"ax8.aa","k":"text","q":"Hvordan inddeles a. axillaris, og hvilke grene har den?","a":"Tre stykker i forhold til m. pectoralis minor (før, under, efter):\n**1. stykke:** a. thoracica superior (ikke pensum).\n**2. stykke:** a. thoracoacromialis + a. thoracica lateralis.\n**3. stykke:** a. subscapularis, a. circumflexa humeri anterior + posterior.","img":"r_ax8_25-6"},{"id":"ax8-t21","t":"ax8.aa","k":"text","q":"Hvilken huskeregel bruges til a. axillaris' seks grene?","a":"T-T-T-S-C-C: thoracica superior, thoracoacromialis, thoracica lateralis, subscapularis, circumflexa humeri (anterior og posterior).\n'She Tastes Like Sweet Apple Pie.'","img":"r_ax8_25-6"},{"id":"ax8-t22","t":"ax8.aa","k":"text","q":"A. thoracoacromialis og a. thoracica lateralis: udspring og forsyning?","a":"**A. thoracoacromialis:** udspringer ved overkanten af m. pectoralis minor; grene til acromion (+ hud), m. deltoideus, clavicula og mm. pectorales.\n**A. thoracica lateralis:** udspringer bag og løber langs lateralkanten af m. pectoralis minor; forsyner m. serratus anterior, mm. pectorales og mammae.","img":"r_ax8_25-6"},{"id":"ax8-t23","t":"ax8.aa","k":"text","q":"A. thoracica superior: udspring og forsyning?","a":"Udspringer under m. subclavius og forsyner mm. pectorales og thoraxvæggen. Ikke pensum.","img":"r_ax8_25-6"},{"id":"ax8-t24","t":"ax8.aa","k":"text","q":"A. subscapularis: forløb og grene?","a":"Udspringer fra underkanten af m. subscapularis (som den forsyner) og løber langs margo lateralis. Deler sig i:\n**A. circumflexa scapulae:** gennem det mediale trekantede interstice → fossa infraspinata.\n**A. thoracodorsalis:** fortsætter mod angulus inferior (med n. thoracodorsalis) og ender i m. latissimus dorsi.","img":"r_ax8_25-6"},{"id":"ax8-t25","t":"ax8.aa","k":"text","q":"Aa. circumflexae humeri posterior og anterior: forløb og forsyning?","a":"Afgives ved collum chirurgicum. **Posterior** løber gennem det firkantede interstice; **anterior** løber anteriort for collum chirurgicum.\nForsyner humerus, art. humeri og musklerne omkring.","img":"r_ax8_25-6"},{"id":"ax8-t26","t":"ax8.aa","k":"text","q":"A. brachialis: start, forløb og slut?","a":"**Start:** underkanten af m. teres major. **Forløb:** sulcus bicipitalis medialis i tæt relation til n. medianus (som krydser fra lateralt til medialt foran arterien), n. ulnaris (medialt) og vv. brachiales.\n**Slut:** fossa cubitalis, profundt for aponeurosis m. bicipitis brachii, hvor den deler sig i a. radialis og a. ulnaris proksimalt for m. pronator teres.","img":"r_ax8_27-3"},{"id":"ax8-t27","t":"ax8.aa","k":"text","q":"A. brachialis: hvilke grene afgiver den?","a":"**A. profunda brachii** (helt proksimalt): gennem det nedre trekantede interstice sammen med n. radialis til bagsiden af overarmen; forsyner m. triceps brachii.\n**Rete articulare cubiti:** anastomoserende netværk på bagsiden af art. cubiti (fra a. brachialis + a. profunda brachii); lokal temperaturregulering.\nDeler sig i a. radialis og a. ulnaris.","img":"r_ax8_27-3"},{"id":"ax8-t28","t":"ax8.aa","k":"text","q":"Hvorfor er variationer af a. brachialis klinisk vigtige?","a":"Variationer er hyppige (10–15 %), fx høj deling af a. radialis eller a. ulnaris. Det giver større risiko for lædering af en arterie ved venepunktur og blodtryksmåling; palper altid for pulsation, før der stikkes.","img":"r_ax8_27-3"},{"id":"ax8-t29","t":"ax8.fc","k":"text","q":"Hvad er fossa cubitalis, og hvordan er den afgrænset?","a":"En V-formet grube (bindevævsrum), hvor 'benene' fortsætter i sulcus bicipitalis medialis og lateralis.\n**Superficielt:** fascia antebrachii. **Gulv:** m. brachialis (proksimalt/medialt) og m. supinator (distalt/lateralt). **Lateralt:** m. brachioradialis. **Medialt:** m. pronator teres.","img":"r_ax8_29-2"},{"id":"ax8-t30","t":"ax8.fc","k":"text","q":"Hvad indeholder fossa cubitalis?","a":"N. medianus; r. profundus n. radialis (gennem Frohses kanal i m. supinator); r. superficialis n. radialis; a. brachialis (→ a. radialis og a. ulnaris); v. mediana cubiti (superficielt); tendo + aponeurosis m. bicipitis brachii.","img":"r_ax8_29-2"},{"id":"ax8-t31","t":"ax8.ar","k":"text","q":"A. ulnaris: start og forløb?","a":"Største gren fra a. brachialis; forsyner den ulnare side af underarmen. Start: deling i fossa cubitalis, profundt for CCF-musklerne.\nLøber profundt for muskler med udspring fra CCF, under senebroen fra m. flexor digitorum superficialis, ovenpå m. flexor digitorum profundus og under m. flexor carpi ulnaris med n. ulnaris. Ender radialt for senen til m. flexor carpi ulnaris.","img":"r_ax8_33-2"},{"id":"ax8-t32","t":"ax8.ar","k":"text","q":"A. ulnaris: slut og grene?","a":"**Slut:** træder ind i hånden superficielt for fleksorretinaklet gennem Guyons kanal og fortsætter som arcus palmaris superficialis.\n**Grene:** a. interossea communis (→ anterior + posterior), r. palmaris profundus, grene til rete articulare cubiti og rete carpale dorsale.","img":"r_ax8_33-2"},{"id":"ax8-t33","t":"ax8.ar","k":"text","q":"A. interossea anterior og posterior: forløb?","a":"**Anterior:** løber på forfladen af membrana interossea mellem m. flexor pollicis longus og m. flexor digitorum profundus; perforerer membranen ved overkanten af m. pronator quadratus og ender i rete carpale dorsale.\n**Posterior:** perforerer membranen proksimalt ved underkanten af m. supinator, ligger mellem de superficielle og profunde ekstensorer og ender i rete carpale dorsale.","img":"r_ax8_33-2"},{"id":"ax8-t34","t":"ax8.ar","k":"text","q":"R. palmaris profundus (a. ulnaris): forløb?","a":"Afgives lige før overgangen til arcus palmaris superficialis, perforerer hypothenar, går retrotendinøst og forenes med arcus palmaris profundus.","img":"r_ax8_33-2"},{"id":"ax8-t35","t":"ax8.ar","k":"text","q":"A. radialis: start og forløb i underarmen?","a":"Mindste gren af a. brachialis; forsyner den radiale side af underarmen. Start i fossa cubitalis, superficielt for m. supinator.\nDækkes af m. brachioradialis i næsten hele forløbet og løber på m. pronator teres, m. flexor digitorum superficialis, m. flexor pollicis longus og m. pronator quadratus. Distalt ligger den lateralt for tendo m. flexoris carpi radialis (tydelig puls).","img":"r_ax8_36-6"},{"id":"ax8-t36","t":"ax8.ar","k":"text","q":"A. radialis: distale forløb til hånden?","a":"Ved proc. styloideus radii snor den sig om tommelens CMC-led, krydser senerne i kulisse 1, ligger i bunden af tabatieren (puls) under tendo m. extensoris pollicis longi, går til palma manus mellem de to hoveder af m. interosseus dorsalis I og ender palmart i arcus palmaris profundus.","img":"r_ax8_36-6"},{"id":"ax8-t37","t":"ax8.ar","k":"text","q":"A. radialis: hvilke grene afgives?","a":"Inden arcus palmaris profundus: **a. princeps pollicis** (tommelens palmarside) og **a. radialis indicis** (pegefingerens radialside).\nDesuden **r. palmaris superficialis**, som afgives inden a. radialis forlader palmarsiden og anastomoserer med arcus palmaris superficialis.","img":"r_ax8_36-6"},{"id":"ax8-t38","t":"ax8.ar","k":"text","q":"Arcus palmaris superficialis: forløb og afgivelser?","a":"Fortsættelse af a. ulnaris; starter distalt, radialt for os pisiforme. Ligger prætendinøst i vola manus mellem aponeurosis palmaris og fleksorsenerne. Distal konveks bue mod thenar; anastomoserer med r. palmaris superficialis a. radialis.\nAfgiver **3 aa. digitales palmares communes** → aa. digitales palmares propriae (2 pr. finger, plexus i fingerpulpa). Den laterale a. digitalis propria på 5. finger afgår direkte fra buen.","img":"r_ax8_40-0"},{"id":"ax8-t39","t":"ax8.ar","k":"text","q":"Arcus palmaris profundus: forløb, afgivelser og modtagelser?","a":"Fortsættelse af a. radialis; starter efter passagen af de to hoveder af m. interosseus dorsalis I, går gennem de to hoveder af m. adductor pollicis og ligger retrotendinøst (under fleksorsener og lumbricales, over metacarpalia og mm. interossei palmares), ca. 1 cm proksimalt for arcus superficialis. Anastomoserer med r. palmaris profundus a. ulnaris.\nAfgiver **aa. metacarpales palmares**; modtager rr. perforantes fra aa. metacarpales dorsales.","img":"r_ax8_42-2"},{"id":"ax8-t40","t":"ax8.ar","k":"text","q":"Rete carpale dorsale: tilskud og afgivelser?","a":"Anastomoserende arterielt netværk. Tilskud fra a. ulnaris, a. radialis og a. interossea anterior + posterior.\nDanner aa. metacarpales dorsales (ovenpå mm. interossei dorsales), aa. digitales dorsales (når kun lige distalt for grundleddet) og rr. perforantes, som anastomoserer med arcus palmaris profundus.","img":"r_ax8_42-2"},{"id":"ax8-t41","t":"ax8.ve","k":"text","q":"Hvordan er OE's vener inddelt, og hvor tømmer de sig?","a":"Superficielle og profunde vener. Alle tømmer sig i **v. axillaris → v. subclavia → v. brachiocephalica → v. cava superior**.","img":"r_ax8_44-0"},{"id":"ax8-t42","t":"ax8.ve","k":"text","q":"Hvad er vv. comitantes, og hvad er forskellen på profunde og superficielle vener?","a":"Profunde vener følger arterierne (**vv. comitantes**), 2 pr. arterie til en vis størrelse på overarmen; pulsen fra arterien overføres til venerne.\nSuperficielle vener har eget navn og er ikke parrede. Venerne kommunikerer via vv. perforantes; kombinationen giver optimal termoregulering.","img":"r_ax8_44-0"},{"id":"ax8-t43","t":"ax8.ve","k":"text","q":"Hvad er rete venosum dorsale manus?","a":"Et venenet på håndryggen, der modtager fingervenerne. Det dræneres af **v. cephalica** (radialt), **v. basilica** (ulnart) og **v. mediana antebrachii** (ventralt).","img":"r_ax8_45-2"},{"id":"ax8-t44","t":"ax8.ve","k":"text","q":"V. cephalica: forløb?","a":"Udgår fra den radiale del af rete venosum dorsale. Underarm: langs den radiale side. Regio cubiti: afgiver v. mediana cubiti. Overarm: sulcus bicipitalis lateralis. Skulder: perforerer trigonum clavipectorale mellem m. deltoideus og m. pectoralis major og ender i v. axillaris.","img":"r_ax8_46-1"},{"id":"ax8-t45","t":"ax8.ve","k":"text","q":"V. basilica: forløb?","a":"Udgår fra den ulnare del af rete venosum dorsale. Underarm: langs den ulnare side. Regio cubiti: modtager v. mediana cubiti. Overarm: sulcus bicipitalis medialis; perforerer fascia brachii midt på armen og tømmer i v. brachialis.","img":"r_ax8_46-1"},{"id":"ax8-t46","t":"ax8.ve","k":"text","q":"V. mediana antebrachii og v. mediana cubiti?","a":"**V. mediana antebrachii:** lille vene fra det overfladiske venenet i håndfladen; ascenderer på underarmens forside og tømmes typisk i v. mediana cubiti.\n**V. mediana cubiti:** variabel forbindelse mellem v. cephalica og v. basilica; anastomoserer med dybe vener i fossa cubitalis.","img":"r_ax8_45-2"},{"id":"ax8-t47","t":"ax8.ly","k":"text","q":"Hvordan er armens lymfekar inddelt?","a":"**Superficielle:** starter som grovmasket netværk dorsalt eller finmasket palmart; løber uden stop til lnn. axillares tæt sammen med v. cephalica og v. basilica.\n**Profunde:** følger de store arterier og ender i lnn. axillares, evt. med stop i lnn. cubitales.","img":"r_ax8_49-0"},{"id":"ax8-t48","t":"ax8.ly","k":"text","q":"Hvordan inddeles axillens lymfeknuder (nodi lymphatici axillares)?","a":"**Fremskudte:** laterale (armen langs v. basilica), pectorale (kropsvæg og mammae), subscapulære (bagsiden af thorax og skulderregion).\n**Dybe:** centrale (basis af fossa axillaris; dræner de 3 fremskudte → apikale) og apikale (apex; dræner armen langs v. cephalica og øverste del af mammae og modtager fra resten).","img":"r_ax8_50-0"},{"id":"ax8-t49","t":"ax8.ly","k":"text","q":"Hvor ender lymfen fra axillens knuder?","a":"De efferente kar fortsætter i truncus subclavius → **ductus thoracicus** ved overgangen til v. subclavia sin., eller **ductus lymphaticus dxt.** ved overgangen til v. subclavia dxt.","img":"r_ax8_50-0"},{"id":"ax8-t50","t":"ax8.ly","k":"text","q":"Hvilket drænageområde har ductus lymphaticus dxt. og ductus thoracicus?","a":"Lymfe fra højre øvre del ender i ductus lymphaticus dxt. Den venstre del (den største) ender i ductus thoracicus.","img":"r_ax8_51-2"},{"id":"ax8-t51","t":"ax8.ly","k":"text","q":"Hvordan adskiller man arterier, vener og nerver ved præparation?","a":"**Arterier:** tykvæggede og hule, nogle gange svagt rødlige.\n**Vener:** tyndvæggede og hule, nogle gange svagt blålige; man finder ofte koagelrester.\n**Nerver:** ikke hule, man kan ane nervefibrene; let gullige.\nFarven kan kun nogle gange bruges til at skelne.","img":"r_ax8_5-1"},{"id":"ax8-o52","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":0,"a":"N. musculocutaneus","n":"Forreste (fleksor-)loge; motorisk til overarmens fleksorer."},{"id":"ax8-o53","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":1,"a":"N. medianus","n":"Følger a. brachialis i sulcus bicipitalis medialis."},{"id":"ax8-o54","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":2,"a":"V. cephalica","n":"Ligger i sulcus bicipitalis lateralis, superficielt."},{"id":"ax8-o55","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":3,"a":"V. basilica","n":"Ligger i sulcus bicipitalis medialis, superficielt til den perforerer fascia brachii."},{"id":"ax8-o56","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":4,"a":"Fascia brachii","n":"Omslutter overarmens muskler og opdeler dem i loger."},{"id":"ax8-o57","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":5,"a":"N. ulnaris","n":"Medialt, senere gennem septum intermusculare brachii mediale."},{"id":"ax8-o58","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":6,"a":"Septum intermusculare mediale","n":"Adskiller fleksorloge og ekstensorloge medialt."},{"id":"ax8-o59","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":7,"a":"N. radialis","n":"Ekstensorlogen; snor sig om humerus i sulcus nervi radii."},{"id":"ax8-o60","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":8,"a":"Flexorlogen","n":"Forreste loge: biceps, coracobrachialis, brachialis; n. musculocutaneus."},{"id":"ax8-o61","t":"ax8.fc","k":"occ","img":"a8arm","boxes":[[69.079,10.587,16.184,3.085],[72.632,22.626,10.088,3.025],[9.693,25.529,9.518,3.509],[78.64,49.546,7.895,3.025],[8.816,50.151,10.789,3.085],[80.746,73.624,7.544,3.025],[74.079,82.214,25.439,3.509],[21.491,85.178,7.851,3.085],[41.886,1.633,9.825,3.569],[41.886,94.676,11.886,3.569],[61.974,28.373,33.246,20.327],[0.0,40.835,32.588,8.59],[1.184,65.033,33.377,15.366]],"target":9,"a":"Extensorlogen","n":"Bageste loge: triceps brachii; n. radialis."},{"id":"ax8-n62","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":1,"a":"A. subclavia","n":"Ikke en del af 'OE kar'; skifter navn til a. axillaris ved lateral kant af costa 1.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n63","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":2,"a":"A. axillaris","n":"Fra lateral kant af costa 1 til underkanten af m. teres major.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n64","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":3,"a":"A. brachialis","n":"Fra underkanten af m. teres major til fossa cubitalis.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n65","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":4,"a":"A. radialis","n":"Den radiale (laterale) gren af a. brachialis.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n66","t":"ax8.kg","k":"num","img":"art","bone":"OE's arterier","nr":5,"a":"A. ulnaris","n":"Den ulnare (mediale) gren af a. brachialis; største gren.","ask":"Hvad hedder karret ved nr. {nr}?","alt":"Overekstremitetens arterier med numre 1–5"},{"id":"ax8-n67","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":1,"a":"A. radialis","n":"Fortsætter i arcus palmaris profundus.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n68","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":2,"a":"A. ulnaris","n":"Fortsætter i arcus palmaris superficialis.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n69","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":3,"a":"A. digitalis palmaris communis","n":"Afgives fra arcus palmaris superficialis (3 stk.).","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n70","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":4,"a":"A. digitalis palmaris propria","n":"Løber langs fingrenes kanter, 2 pr. finger.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n71","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":5,"a":"A. princeps pollicis","n":"Afgives fra a. radialis; forsyner tommelens palmarside.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax8-n72","t":"ax8.ar","k":"num","img":"angio","bone":"Håndens arterier (angiogram)","nr":6,"a":"Arcus palmaris profundus","n":"Fortsættelse af a. radialis; retrotendinøs.","ask":"Hvad er markeret med nr. {nr}?","alt":"Angiografi af hånden med nummererede arterier"},{"id":"ax9-t1","t":"ax9.ms","k":"text","q":"Hvor starter og slutter medulla spinalis, og hvad er de to fortykkelser?","a":"Start: foramen magnum. Slut: mellem L1 og L2.\n**Intumescentia cervicalis** (plexus brachialis) og **intumescentia lumbosacralis** (plexus lumbosacralis). Nederst ses conus medullaris og filum terminale.","img":"r_ax9_9-3"},{"id":"ax9-t2","t":"ax9.ms","k":"text","q":"Hvor mange spinalnerver og segmenter er der?","a":"**31 spinalnerver** fordelt på **5 segmenter** (cervicale, thorakale, lumbale, sakrale, coccygeale).","img":"r_ax9_8-2"},{"id":"ax9-t3","t":"ax9.ms","k":"text","q":"Hvordan opstår en spinalnerve?","a":"Af en **ventral motorisk rod** og en **dorsal sensorisk rod** (radix) fra rygmarvssegmenterne. Rødderne løber sammen i foramen intervertebrale og bliver til én spinalnerve. Der er et ganglion spinale på den dorsale rod.","img":"r_ax9_8-2"},{"id":"ax9-t4","t":"ax9.ms","k":"text","q":"Hvordan deler en spinalnerve sig, og hvad forsyner grenene?","a":"Spinalnerver er ganske korte og deler sig i **ramus ventralis** og **ramus dorsalis**.\nEkstremitetsplexerne dannes af rami ventrales. Rami dorsales innerverer den dybe rygmuskulatur og huden bagpå ryggen.","img":"r_ax9_8-2"},{"id":"ax9-t5","t":"ax9.ms","k":"text","q":"Hvorfor er der 8 cervicale spinalnerver, men kun 7 cervicale vertebrae?","a":"C1 udspringer **over** første cervicale hvirvel. De første 7 spinalnerver udgår over den tilhørende hvirvel (C7 over vertebra C7), C8 under vertebra C7. Fra T1 udgår spinalnerverne under den tilhørende hvirvel.","img":"r_ax9_8-2"},{"id":"ax9-t6","t":"ax9.ms","k":"text","q":"Hvad skal man kunne sige, når man beskriver en nerve?","a":"Evt. hvilke spinalsegmenter den kommer fra; navn og om den er motorisk, sensorisk eller blandet; forløb og relationer; om den afgiver rami; innervationsområde (kutant eller muskelinnervation).","img":"r_ax9_8-2"},{"id":"ax9-t7","t":"ax9.pb","k":"text","q":"Hvad løber gennem skalenerporten til OE?","a":"**Plexus brachialis, a. subclavia og n. phrenicus.** Ikke v. subclavia (den løber foran).\nN. dorsalis scapulae og n. thoracicus longus perforerer m. scalenus medius.","img":"r_ax9_14-2"},{"id":"ax9-t8","t":"ax9.pb","k":"text","q":"Hvilke segmenter danner plexus brachialis?","a":"Rami ventrales fra **C5–C8 og T1** (med tilskud fra C4 og T2). Plexus = 'fletværk'.","img":"r_ax9_19-2"},{"id":"ax9-t9","t":"ax9.pb","k":"text","q":"Hvilke tre trunci har plexus brachialis, og hvad består de af?","a":"Trunci dannes i skalenerporten:\n**Truncus superior:** C5 + C6\n**Truncus medius:** C7\n**Truncus inferior:** C8 + T1","img":"r_ax9_36-2"},{"id":"ax9-t10","t":"ax9.pb","k":"text","q":"Hvordan dannes de tre fasciculi?","a":"Trunci deler sig i en anterior og en posterior gren, og de danner tre fasciculi i fossa axillaris:\n**Fasciculus lateralis:** anteriore grene fra truncus superior + medius.\n**Fasciculus medialis:** anterior gren fra truncus inferior.\n**Fasciculus posterior:** posteriore grene fra alle trunci.","img":"r_ax9_36-2"},{"id":"ax9-t11","t":"ax9.pb","k":"text","q":"Hvilke sider af armen forsynes af de tre fasciculi?","a":"Fleksorsiden forsynes af fasciculus lateralis og medialis. Ekstensorsiden forsynes af fasciculus posterior.","img":"r_ax9_36-2"},{"id":"ax9-t12","t":"ax9.pb","k":"text","q":"Hvad er den supra- og infraclaviculære del af plexus brachialis?","a":"Clavicula deler plexet. **Supraclaviculært:** foramina intervertebralia → rr. ventrales → trunci (i skalenerporten) → anteriore og posteriore grene. **Infraclaviculært:** fasciculi og de store blandede nerver.","img":"r_ax9_19-2"},{"id":"ax9-t13","t":"ax9.pb","k":"text","q":"Hvilke nerver udgår fra hver fasciculus?","a":"**Fasciculus lateralis:** n. musculocutaneus + radix lateralis n. mediani.\n**Fasciculus medialis:** n. ulnaris + radix medialis n. mediani.\n**Fasciculus posterior:** n. axillaris + n. radialis.","img":"r_ax9_36-2"},{"id":"ax9-t14","t":"ax9.pb","k":"text","q":"Hvilken huskeregel gælder for de fem blandede nerver?","a":"**M**in **A**xil **M**ed **R**ødt **U**dslæt: n. musculocutaneus, n. axillaris, n. medianus, n. radialis, n. ulnaris.\n(N. medianus danner plexets 'M' mellem fasciculus lateralis og medialis.)","img":"r_ax9_36-2"},{"id":"ax9-t15","t":"ax9.pb","k":"text","q":"Hvordan inddeles plexus brachialis' nerver?","a":"**Supraclaviculære (motoriske):** n. dorsalis scapulae, n. thoracicus longus, n. subclavius, n. suprascapularis.\n**Infraclaviculære, motoriske:** n. pectoralis medialis og lateralis, nn. subscapulares, n. thoracodorsalis.\n**Infraclaviculære, sensoriske:** n. cutaneus brachii medialis, n. cutaneus antebrachii medialis.\n**Blandede:** n. musculocutaneus, n. axillaris, n. medianus, n. radialis, n. ulnaris.","img":"r_ax9_19-2"},{"id":"ax9-t16","t":"ax9.pb","k":"text","q":"Hvilke rygmarvssegmenter har de supraclaviculære nerver?","a":"N. dorsalis scapulae: C4–C5. N. thoracicus longus: C5–C7. N. subclavius: C5–C6. N. suprascapularis: C5–C6.","img":"r_ax9_19-2"},{"id":"ax9-t17","t":"ax9.pb","k":"text","q":"Hvilke segmenter har de infraclaviculære motoriske og sensoriske nerver?","a":"N. pectoralis medialis: C8–T1. N. pectoralis lateralis: C5–C7. Nn. subscapulares: C5–C6. N. thoracodorsalis: C6–C8.\nN. cutaneus brachii medialis: T1. N. cutaneus antebrachii medialis: C8–T1.","img":"r_ax9_19-2"},{"id":"ax9-t18","t":"ax9.pb","k":"text","q":"Hvilke segmenter har de fem blandede nerver?","a":"N. musculocutaneus: C5–C7. N. medianus: C6–T1. N. ulnaris: C7–T1. N. axillaris: C5–C6. N. radialis: C5–T1.","img":"r_ax9_19-2"},{"id":"ax9-t19","t":"ax9.pb","k":"text","q":"Hvad skal man fokusere på ved eksamensspørgsmålene 'OE nerver' og 'Plexus brachialis'?","a":"**OE nerver:** kun de blandede nerver.\n**Plexus brachialis:** alt andet, men med mindre fokus på de blandede nerver.","img":"r_ax9_19-2"},{"id":"ax9-t20","t":"ax9.sn","k":"text","q":"N. dorsalis scapulae: forløb og innervation?","a":"Afgår i foramen intervertebrale fra r. ventralis C5, perforerer m. scalenus medius, løber på forfladen af m. levator scapulae og langs medialkanten af scapula.\nInnerverer **mm. rhomboidei og m. levator scapulae**.","img":"r_ax9_23-0"},{"id":"ax9-t21","t":"ax9.sn","k":"text","q":"N. thoracicus longus: forløb og innervation?","a":"Afgår fra rr. ventrales C5–C7, perforerer m. scalenus medius og løber nedad på lateralfladen af m. serratus anterior sammen med a. thoracica lateralis.\nInnerverer **m. serratus anterior**.","img":"r_ax9_23-0"},{"id":"ax9-t22","t":"ax9.sn","k":"text","q":"N. subclavius: udspring og innervation?","a":"Afgår fra truncus superior (C5–C6), løber fremad mod m. subclavius og innerverer den.","img":"r_ax9_24-0"},{"id":"ax9-t23","t":"ax9.sn","k":"text","q":"N. suprascapularis: forløb og innervation?","a":"Afgår fra truncus superior (C5–C6). Mod scapulas overkant, under lig. transversum scapulae superius (incisura scapulae), lateralt om spina scapulae til fossa infraspinata.\nInnerverer **m. supraspinatus og m. infraspinatus**.","img":"r_ax9_25-0"},{"id":"ax9-t24","t":"ax9.sn","k":"text","q":"N. pectoralis medialis og lateralis: afgang og innervation?","a":"**Medialis:** fasciculus medialis (C8–T1); perforerer m. pectoralis minor.\n**Lateralis:** fasciculus lateralis (C5–C7); fremkommer superiort og medialt for m. pectoralis minor.\nBegge innerverer mm. pectorales major et minor.","img":"r_ax9_28-3"},{"id":"ax9-t25","t":"ax9.sn","k":"text","q":"Nn. subscapulares og n. thoracodorsalis: afgang og innervation?","a":"Begge fra fasciculus posterior.\n**Nn. subscapulares (C5–C6):** løber nedad på forsiden af m. subscapularis; innerverer m. subscapularis + m. teres major.\n**N. thoracodorsalis (C6–C8):** krydser scapulas lateralkant og følger a. thoracodorsalis; innerverer m. latissimus dorsi.","img":"r_ax9_29-2"},{"id":"ax9-t26","t":"ax9.sn","k":"text","q":"N. cutaneus brachii medialis: afgang og innervationsområde?","a":"Fasciculus medialis (T1). Løber distalt bagved, herefter medialt for a. axillaris; anastomoserer med nn. intercostobrachiales; perforerer fascia axillaris og brachii.\nInnerverer **overarmens medialside**.","img":"r_ax9_51-1"},{"id":"ax9-t27","t":"ax9.sn","k":"text","q":"N. cutaneus antebrachii medialis: afgang og innervationsområde?","a":"Fasciculus medialis (C8–T1). Distalt langs a. axillaris og a. brachialis, perforerer fascia brachii sammen med v. basilica og følger den; deler sig ved art. cubiti i en anterior og en ulnar gren.\nInnerverer **underarmens medialside**.","img":"r_ax9_51-1"},{"id":"ax9-t28","t":"ax9.sn","k":"text","q":"Hvad er nn. intercostobrachiales?","a":"Nerver fra to nn. intercostales (T2 og T3), der innerverer axillen og den mediale, proksimale del af brachium og anastomoserer med n. cutaneus brachii medialis.","img":"r_ax9_51-1"},{"id":"ax9-t29","t":"ax9.mu","k":"text","q":"N. musculocutaneus: innervation og segmenter?","a":"C5–C7, fra fasciculus lateralis. **Motorisk:** overarmens fleksorer. **Kutant:** underarmen lateralt.","img":"r_ax9_39-8"},{"id":"ax9-t30","t":"ax9.mu","k":"text","q":"N. musculocutaneus: forløb?","a":"Perforerer m. coracobrachialis, løber distalt mellem m. biceps brachii og m. brachialis, perforerer fascia brachii ud for bicepssenens insertion og ender som **n. cutaneus antebrachii lateralis**, som fortsætter på fascia antebrachii sammen med v. cephalica.","img":"r_ax9_39-8"},{"id":"ax9-t31","t":"ax9.mu","k":"text","q":"N. axillaris: innervation og segmenter?","a":"C5–C6, fra fasciculus posterior. **Motorisk:** m. deltoideus og m. teres minor. **Kutant:** overarmens øvre laterale del (n. cutaneus brachii lateralis superior).","img":"r_ax9_40-0"},{"id":"ax9-t32","t":"ax9.mu","k":"text","q":"N. axillaris: forløb?","a":"Passerer gennem det firkantede interstice i axillens bagvæg sammen med a. circumflexa humeri posterior, snor sig om collum chirurgicum og afgiver motoriske grene til m. deltoideus.\nN. cutaneus brachii lateralis superior løber superficielt ved bagkanten af m. deltoideus.","img":"r_ax9_40-0"},{"id":"ax9-t33","t":"ax9.me","k":"text","q":"N. medianus: innervation og segmenter?","a":"C6–T1, fra fasciculus lateralis + medialis.\n**Motorisk:** alle underarmens fleksorer undtagen m. flexor carpi ulnaris og den ulnare del af m. flexor digitorum profundus; thenar (undtagen m. adductor pollicis); de radiale 2 lumbricaler.\n**Kutant:** 3½ radiale fingre og radiale palma.","img":"r_ax9_43-0"},{"id":"ax9-t34","t":"ax9.me","k":"text","q":"N. medianus: forløb i overarm og underarm?","a":"Følger a. brachialis i sulcus bicipitalis medialis og krydser fra lateralt til medialt for arterien. Passerer til fossa cubitalis profundt for aponeurosis m. bicipitis brachii, mellem m. pronator teres' to hoveder og under senebuen for m. flexor digitorum superficialis; distalt på underarmen profundt for m. flexor digitorum superficialis.","img":"r_ax9_43-0"},{"id":"ax9-t35","t":"ax9.me","k":"text","q":"N. medianus: forløb i hånden og endegrene?","a":"Passerer canalis carpi lige under fleksorretinaklet. Ud for retinaklets distale kant nås endegrenene: **nn. digitales palmares communes** (3 stk.), der deler sig i **nn. digitales palmares proprii** (7 stk. til de 3½ radiale fingre).","img":"r_ax9_44-1"},{"id":"ax9-t36","t":"ax9.me","k":"text","q":"Hvilke grene afgiver n. medianus?","a":"**N. interosseus anterior:** proksimalt på underarmen; løber på membrana interossea og innerverer m. flexor digitorum profundus (radiale del), m. flexor pollicis longus og m. pronator quadratus.\n**R. palmaris:** proksimalt for retinaklet; huden i hulhånden.\n**R. muscularis:** distalt for retinaklet, recurrent ind i thenar; innerverer FPB, APB og opponens + de to radiale lumbricaler.","img":"r_ax9_44-1"},{"id":"ax9-t37","t":"ax9.ul","k":"text","q":"N. ulnaris: innervation og segmenter?","a":"C7–T1, fra fasciculus medialis.\n**Motorisk:** m. flexor carpi ulnaris, ulnare del af m. flexor digitorum profundus, størstedelen af håndens muskler (minus ½ LOAF).\n**Kutant:** ulnare 1½ finger palmart og ulnare 2½ finger dorsalt.","img":"r_ax9_45-3"},{"id":"ax9-t38","t":"ax9.ul","k":"text","q":"N. ulnaris: forløb?","a":"Sulcus bicipitalis medialis, medialt for a. brachialis; perforerer septum intermusculare brachii mediale til overarmens bagerste muskelgruppe; passerer til underarmen via **sulcus nervi ulnaris** bag epicondylus medialis (albuestød); under senebuen af m. flexor carpi ulnaris; mellem m. flexor carpi ulnaris og m. flexor digitorum profundus; superficielt for fleksorretinaklet (**Guyons kanal**) med a. ulnaris.","img":"r_ax9_45-3"},{"id":"ax9-t39","t":"ax9.ul","k":"text","q":"N. ulnaris: endegrene?","a":"**R. superficialis** (næsten rent sensorisk; innerverer m. palmaris brevis motorisk): n. digitalis palmaris communis IV + proprius V til de 1½ ulnare fingre.\n**R. profundus** (rent motorisk): perforerer hypothenar; innerverer hypothenars muskler, mm. interossei, mm. lumbricales III og IV og m. adductor pollicis.","img":"r_ax9_46-4"},{"id":"ax9-t40","t":"ax9.ul","k":"text","q":"N. ulnaris: hvilke kutane grene afgives?","a":"**R. dorsalis:** afgives midt på underarmen og trækker dorsalt mod håndryggen; nn. digitales dorsales til de 2½ ulnare fingre.\n**R. palmaris:** afgives distalt på underarmen, perforerer fascia antebrachii og innerverer den ulnare del af håndfladen.","img":"r_ax9_46-4"},{"id":"ax9-t41","t":"ax9.ra","k":"text","q":"N. radialis: innervation og segmenter?","a":"C5–T1, fra fasciculus posterior. **Motorisk:** over- og underarmens ekstensorer. **Kutant:** huden over ekstensorsiderne (dorsalt).","img":"r_ax9_48-3"},{"id":"ax9-t42","t":"ax9.ra","k":"text","q":"N. radialis: forløb i overarmen?","a":"Passerer det nedre trekantede interstice (med a. profunda brachii) fra fossa axillaris til ekstensorlogen, snor sig om humerus' bagside i sulcus nervi radii og perforerer septum intermusculare brachii laterale i distale 1/3 for at træde ventralt til sulcus bicipitalis lateralis. Ud for m. brachioradialis deler den sig i **r. superficialis** og **r. profundus**.","img":"r_ax9_48-3"},{"id":"ax9-t43","t":"ax9.ra","k":"text","q":"R. superficialis n. radialis: forløb og område?","a":"Fortsætter descenderende mod hånden, profundt for m. brachioradialis; passerer i distale 1/3 under og dorsalt for brachioradialis' sene, følger v. cephalica til håndryggen.\nForsyner sensorisk **radiale håndryg og proksimale del af 2½ radiale fingre** (nn. digitales dorsales).","img":"r_ax9_47-3"},{"id":"ax9-t44","t":"ax9.ra","k":"text","q":"R. profundus n. radialis: forløb og område?","a":"Rent motorisk til underarmens ekstensorer. Dorsalt i fossa cubitalis, perforerer m. supinator (Frohses kanal/arkade), fortsætter mellem det superficielle og profunde ekstensorlag og ender som n. interosseus posterior.","img":"r_ax9_47-3"},{"id":"ax9-t45","t":"ax9.ra","k":"text","q":"Hvilke kutane grene afgiver n. radialis midt på overarmens bagside?","a":"N. cutaneus brachii posterior, n. cutaneus brachii lateralis inferior og n. cutaneus antebrachii posterior.","img":"r_ax9_47-3"},{"id":"ax9-t46","t":"ax9.ki","k":"text","q":"Hvilke muskler repræsenterer segmentær funktion (C5–C8)?","a":"**C5:** abduktion i skulderleddet (m. deltoideus, n. axillaris). **C6:** fleksion i albue (m. biceps brachii, n. musculocutaneus). **C7:** ekstension i albue (m. triceps brachii, n. radialis). **C8:** fleksion i yderled på de 4 ulnare fingre (m. flexor digitorum profundus; n. medianus og n. ulnaris).\nRelevant ved mistanke om diskusprolaps.","img":"r_ax9_55-0"},{"id":"ax9-t47","t":"ax9.ki","k":"text","q":"Hvordan testes de fem blandede nerver motorisk?","a":"**N. axillaris:** m. deltoideus → abduktion i skulderleddet.\n**N. musculocutaneus:** overarmens fleksorer → fleksion i albue.\n**N. radialis:** underarmens ekstensorer → dorsalfleksion i håndled.\n**N. medianus:** m. opponens pollicis → opposition af tommelen.\n**N. ulnaris:** mm. interossei → spredning og samling af de ulnare fingre.","img":"r_ax9_55-0"},{"id":"ax9-t48","t":"ax9.ki","k":"text","q":"Hvordan testes n. medianus, n. ulnaris og n. radialis sensorisk (distalt for retinaklerne)?","a":"**N. medianus:** palmarsiden af den distale pegefinger. **N. ulnaris:** lillefingeren. **N. radialis:** den radiale del af håndryggen.","img":"r_ax9_51-1"},{"id":"ax9-t49","t":"ax9.ki","k":"text","q":"Hvad er Duchenne-Erbs parese og Klumpke-parese?","a":"**Duchenne-Erb:** plexus brachialis-neuropati, ofte truncus superior (C5–C6); lammelse af armen opstået under fødslen.\n**Klumpke:** ofte truncus inferior (C8–T1), n. ulnaris.","img":"r_ax9_60-4"},{"id":"ax9-t50","t":"ax9.ki","k":"text","q":"Hvilke håndstillinger ses ved læsion af n. radialis, n. ulnaris og n. medianus?","a":"**N. radialis:** drophånd. **N. ulnaris:** klohånd. **N. medianus:** 'hand of benediction' (sværgehånd).","img":"r_ax9_60-5"},{"id":"ax9-t51","t":"ax9.ki","k":"text","q":"Hvilken rækkefølge bruges ved plexus brachialis-spot?","a":"Find n. musculocutaneus, hvor den perforerer m. coracobrachialis → følg den tilbage til fasciculus lateralis → find radix lateralis n. mediani → n. medianus og følg radix medialis tilbage til fasciculus medialis → find n. ulnaris.\nHold om nn. musculocutaneus, medianus og ulnaris og led efter n. axillaris (i det firkantede interstice) → følg den tilbage og find n. radialis.\nBonus: n. cutaneus antebrachii medialis (ligner n. ulnaris), n. thoracicus longus, n. thoracodorsalis, nn. subscapulares, n. suprascapularis.","img":"r_ax9_19-3"},{"id":"ax9-t52","t":"ax9.ki","k":"text","q":"Hvordan kan man opsummere de blandede nerver og deres grene?","a":"**N. musculocutaneus:** overarmens fleksorer; n. cutaneus antebrachii lateralis.\n**N. medianus:** n. interosseus anterior, r. muscularis (thenar + lumbrical I–II), r. palmaris, nn. digitales palmares.\n**N. ulnaris:** r. dorsalis, r. palmaris, r. superficialis, r. profundus.\n**N. axillaris:** deltoideus + teres minor; n. cutaneus brachii lateralis superior.\n**N. radialis:** ekstensorer; kutane grene; r. superficialis og r. profundus (→ n. interosseus posterior).","img":"r_ax9_51-1"},{"id":"ax9-o53","t":"ax9.ki","k":"occ","img":"a9post","boxes":[[18.982,1.05,11.676,9.543],[52.598,1.187,17.286,3.425],[48.9 ,[27.0,15.185,27.556,6.42],[11.667,28.148,18.111,7.531],[63.889,69.259,32.111,6.42],[43.778,76.296,27.222,6.296],[33.556,84.815,13.556,6.296],[0.0,91.852,15.0,6.296],[18.222,93.704,17.778,6.296]],"target":4,"a":"Fasciculus medialis (Medial cord)","n":"Anterior gren fra truncus inferior."},{"id":"ax9-o86","t":"ax9.pb","k":"occ","img":"a9plex","boxes":[[0.0,7.901,42.333,6.42],[27.0,15.185,27.556,6.42],[11.667,28.148,18.111,7.531],[63.889,69.259,32.111,6.42],[43.778,76.296,27.222,6.296],[33.556,84.815,13.556,6.296],[0.0,91.852,15.0,6.296],[18.222,93.704,17.778,6.296]],"target":5,"a":"N. ulnaris (Ulnar)","n":"Fra fasciculus medialis."},{"id":"ax9-o87","t":"ax9.pb","k":"occ","img":"a9plex","boxes":[[0.0,7.901,42.333,6.42],[27.0,15.185,27.556,6.42],[11.667,28.148,18.111,7.531],[63.889,69.259,32.111,6.42],[43.778,76.296,27.222,6.296],[33.556,84.815,13.556,6.296],[0.0,91.852,15.0,6.296],[18.222,93.704,17.778,6.296]],"target":6,"a":"N. radialis (Radial)","n":"Fra fasciculus posterior."},{"id":"ax9-o88","t":"ax9.pb","k":"occ","img":"a9plex","boxes":[[0.0,7.901,42.333,6.42],[27.0,15.185,27.556,6.42],[11.667,28.148,18.111,7.531],[63.889,69.259,32.111,6.42],[43.778,76.296,27.222,6.296],[33.556,84.815,13.556,6.296],[0.0,91.852,15.0,6.296],[18.222,93.704,17.778,6.296]],"target":7,"a":"N. medianus (Median)","n":"Fra radix lateralis og radix medialis."},{"id":"ax10-t1","t":"ax10.bk","k":"text","q":"Hvad udgør ossa membri inferioris, og hvilke knogler hører til benets skelet?","a":"Hofteben, lårben, knæskal, underbensknoglerne (skinneben og lægben) og fodens knogler (fodrod, mellemfod, tæer).","img":"r_ax10_6-2"},{"id":"ax10-t2","t":"ax10.bk","k":"text","q":"Hvad betyder membrum inferius, cingulum membri inferioris og pelvis?","a":"**Membrum inferius:** benet. **Cingulum membri inferioris:** bækkenringen. **Pelvis:** bækkenet.","img":"r_ax10_6-2"},{"id":"ax10-t3","t":"ax10.bk","k":"text","q":"Hvilke knogler og led udgør bækkenringen (cingulum membri inferioris)?","a":"**Knogler:** 2 x os coxae (hofteben) + 1 x os sacrum (korsbenet).\n**Led:** ventralt forbundet ved symphysis pubica (sekundær synchondrose); bagest adskilt af korsbenet, hvor de to artt. sacroiliacae (SI-leddene) ses.","img":"r_ax10_6-2"},{"id":"ax10-t4","t":"ax10.bk","k":"text","q":"Hvad kendetegner bækkenringen sammenlignet med skulderbæltet?","a":"Den svarer til skulderbæltet, men er langt mere stabil end mobil. Den forbinder benet med det axiale skelet, og beskytter viscera og fødselsvejen som ekstra funktioner.","img":"r_ax10_7-5"},{"id":"ax10-t5","t":"ax10.bk","k":"text","q":"Hvordan adskiller det typiske biologisk kvindelige og mandlige bækken sig?","a":"**Biologisk kvinde:** kort, bredt og mobilt. **Biologisk mand:** højt, smalt og stabilt.\nBækkenet inddeles desuden i det store og det lille bækken, adskilt af linea terminalis.","img":"r_ax10_7-5"},{"id":"ax10-t6","t":"ax10.bk","k":"text","q":"Hvordan er os coxae (hoftebenet) opbygget hos barn og voksen?","a":"Hos barnet er det dannet ved en Y-formet primær synchondrose mellem tre adskilte knogler ved hofteskålen: os ilium (øverste, størst), os ischii (bagerste, nedre, kraftigst) og os pubis (nederste, forreste).\nHos voksne er synchondrosen forbenet til en synostose.","img":"r_ax10_7-2"},{"id":"ax10-t7","t":"ax10.bk","k":"text","q":"Hvordan er os ilium opdelt, og hvad hedder de vigtigste kanter og flader?","a":"Opdeles i **ala** og **corpus ossis ilii**. Corpus danner de superiore 2/5 af acetabulum.\nKanter: crista iliaca, spina iliaca anterior sup./inf., spina iliaca posterior sup./inf. (+ tuberculum iliacum), linea arcuata (indgår i linea terminalis).\nFlader: fossa iliaca, facies sacropelvina, facies auricularis (SI-led) + tuberositas iliaca, facies glutealis med lineae gluteales anterior, posterior et inferior.","img":"r_ax10_7-2"},{"id":"ax10-t8","t":"ax10.bk","k":"text","q":"Hvad udspringer fra spina iliaca anterior superior (SIAS) og spina iliaca anterior inferior (SIAI)?","a":"**Fra SIAS:** lig. inguinale, m. tensor fasciae latae, m. sartorius.\n**Fra SIAI:** m. rectus femoris, lig. iliofemorale (fra kapslen til art. coxae).","img":"r_ax10_11-6"},{"id":"ax10-t9","t":"ax10.bk","k":"text","q":"Hvad udspringer fra spina iliaca posterior superior (SIPS)?","a":"Lig. sacrotuberale (samt siden af os sacrum og os coccygis).","img":"r_ax10_11-7"},{"id":"ax10-t10","t":"ax10.bk","k":"text","q":"Hvordan er os ischii opdelt, og hvad kendetegner tuber ischiadicum?","a":"Opdeles i **corpus** og **ramus ossis ischii**. Corpus danner de dorsale 2/5 af acetabulum.\nTuber ischiadicum ('siddeknuden') er en længdeoval knude nederst på corpus og udspring for m. quadratus femoris, m. gemellus inferior, m. semimembranosus, m. semitendinosus og m. biceps femoris.","img":"r_ax10_13-0"},{"id":"ax10-t11","t":"ax10.bk","k":"text","q":"Hvad kendetegner spina ischiadica, og hvad adskiller den?","a":"Spina ischiadica adskiller incisura ischiadica major og minor. Ramus ossis ischii skyder sig fremad og danner halvdelen af 'de forenede rami'.","img":"r_ax10_13-0"},{"id":"ax10-t12","t":"ax10.bk","k":"text","q":"Hvordan er os pubis opdelt, og hvad danner ramus superior af acetabulum?","a":"Opdeles i **corpus** (danner symphysis pubica, med tuberculum pubicum og crista pubica) og **ramus superior** og **ramus inferior**.\nRamus superior har eminentia iliopubica (iliopectineus) og pecten ossis pubis (den skarpe overkant, indgår i linea terminalis) og danner de ventrale 1/5 af acetabulum.\nRamus inferior skyder sig bagud og danner halvdelen af 'de forenede rami'.","img":"r_ax10_16-10"},{"id":"ax10-t13","t":"ax10.bk","k":"text","q":"Hvad er 'de forenede rami'?","a":"Ramus inferior ossis pubis + ramus ossis ischii tilsammen.","img":"r_ax10_16-10"},{"id":"ax10-t14","t":"ax10.bk","k":"text","q":"Hvordan er acetabulum bygget op?","a":"Halvkugleformet ledskål der artikulerer med femur. Kanten (limbus) rager op som et halvtag og mangler nedadtil (incisura acetabuli). Bunden (fossa acetabuli) er ru og tynd, mens den resterende del (facies lunata) er tykvægget og glat.\nLig. transversum acetabuli omdanner incisura acetabuli til foramen acetabulare.","img":"r_ax10_7-2"},{"id":"ax10-t15","t":"ax10.bk","k":"text","q":"Hvilke tre knogler mødes i acetabulum, og hvor meget bidrager hver?","a":"Os ilium (superiore 2/5), os ischii (dorsale 2/5) og os pubis (ventrale 1/5). De mødes i en Y-formet synostose (forbenet synchondrose).","img":"r_ax10_19-0"},{"id":"ax10-t16","t":"ax10.bk","k":"text","q":"Hvad er foramen obturatum, og hvad passerer igennem det?","a":"Et ovalt hul under acetabulum, næsten lukket af membrana obturatoria (canalis obturatorius). Passage for n. obturatorius og vasa obturatoria.","img":"r_ax10_19-0"},{"id":"ax10-t17","t":"ax10.bl","k":"text","q":"Symphysis pubica: beliggenhed, klassifikation og opbygning?","a":"**Beliggenhed:** mellem de to os pubis. **Klassifikation:** symfyse (uægte led, sekundær synkondrose).\n**Opbygning:** discus interpubicus, en tyk skive af fibrocartilago, som ud mod de tilstødende knogler går over i en tynd plade hyalin brusk.","img":"r_ax10_22-5"},{"id":"ax10-t18","t":"ax10.bl","k":"text","q":"Hvilke ligamenter forstærker symphysis pubica?","a":"**Lig. pubicum superius:** forstærker leddet på oversiden.\n**Lig. arcuatum pubis:** forstærker leddet på undersiden (svarer til lig. pubicum inferius).","img":"r_ax10_22-5"},{"id":"ax10-t19","t":"ax10.bl","k":"text","q":"Art. sacroiliaca (SI-leddet): beliggenhed, klassifikation og ledflader?","a":"**Beliggenhed:** mellem os sacrum og os ilium. **Klassifikation:** ægte led, glideled.\n**Ledflader:** facies auricularis ossis ilii et sacri, sagittalt orienterede.","img":"r_ax10_23-0"},{"id":"ax10-t20","t":"ax10.bl","k":"text","q":"Hvilke ligamenter forstærker SI-leddets kapsel?","a":"En stram kapsel forstærket af lig. sacroiliaca ventralia, lig. sacroiliaca interossei og lig. sacroiliaca posteriora.","img":"r_ax10_23-0"},{"id":"ax10-t21","t":"ax10.bl","k":"text","q":"Hvilke ekstraartikulære ligamenter hører til SI-leddet, og hvad danner de?","a":"**Lig. iliolumbale:** fra crista iliaca til tværtappene på L4 og L5.\n**Lig. sacrotuberale** og **lig. sacrospinale** (sammenvokset med m. coccygeus) danner tilsammen foramen ischiadicus majus et minus.","img":"r_ax10_23-0"},{"id":"ax10-t22","t":"ax10.bl","k":"text","q":"Hvor går lig. sacrotuberale, lig. sacrospinale og lig. iliolumbale?","a":"**Lig. sacrotuberale:** fra spina iliaca posterior superior + sacrum + coccyx til tuber ischiadicum.\n**Lig. sacrospinale:** fra nedre sacrum + coccyx til spina ischiadica.\n**Lig. iliolumbale:** fra crista iliaca til processus transversus L4–L5.","img":"r_ax10_25-1"},{"id":"ax10-t23","t":"ax10.bl","k":"text","q":"Hvordan opdeler lig. sacrospinale og lig. sacrotuberale incisurae ischiadicae?","a":"De opdeler incisurae i **foramen ischiadicus majus** og **foramen ischiadicus minus**.","img":"r_ax10_25-1"},{"id":"ax10-t24","t":"ax10.fe","k":"text","q":"Hvad kendetegner os femoris (femur) overordnet?","a":"En rørknogle (extremitas proximalis/distalis + corpus). Kroppens længste, største og stærkeste knogle. Har en skrå længdeakse, som varierer mellem mænd og kvinder."},{"id":"ax10-t25","t":"ax10.fe","k":"text","q":"Hvilke strukturer findes på extremitas proximalis femoris?","a":"Caput femoris med fovea capitis, collum femoris, trochanter major med fossa trochanterica, trochanter minor, samt crista intertrochanterica (posterior) og linea intertrochanterica (anterior)."},{"id":"ax10-t26","t":"ax10.fe","k":"text","q":"Hvad findes på corpus femoris' bagflade?","a":"Linea pectinea (følges distalt langs trochanter minor) og linea aspera med labium mediale og labium laterale samt tuberositas glutea (proksimalt for labium laterale)."},{"id":"ax10-t27","t":"ax10.fe","k":"text","q":"Hvad kendetegner extremitas distalis femoris?","a":"**Bagflade:** facies poplitea, condylus medialis (mest prominerende) og condylus lateralis, fossa intercondylaris (afgrænset proksimalt af linea intercondylaris), epicondylus lateralis + medialis med tuberculum adductorium.\n**Forflade:** facies patellaris."},{"id":"ax10-t28","t":"ax10.fe","k":"text","q":"Hvad kendetegner vinklingen af collum femoris?","a":"Collum femoris danner en vinkel med corpus femoris (collum-corpus-vinklen), som har betydning for kraftoverførslen fra bækken til femur; afvigelser giver coxa valga eller coxa vara.","img":"r_ax10_31-2"},{"id":"ax10-t29","t":"ax10.hl","k":"text","q":"Art. coxae (hofteleddet): beliggenhed og klassifikation?","a":"Mellem caput femoris og acetabulum. Ægte, enkelt kugleled.","img":"r_ax10_33-1"},{"id":"ax10-t30","t":"ax10.hl","k":"text","q":"Hvordan er ledhovedet (caput femoris) opbygget?","a":"Udgør 2/3 af en kugleflade med en fordybning. Ledbrusken mangler svarende til fovea capitis, hvor lig. capitis femoris tilhæfter.","img":"r_ax10_33-1"},{"id":"ax10-t31","t":"ax10.hl","k":"text","q":"Hvordan er ledskålen (acetabulum) opbygget i hofteleddet?","a":"Halvkuglestor. **Limbus acetabuli:** kanten. **Labrum acetabuli:** ledlæben. **Facies lunata:** den bruskbeklædte del. **Fossa acetabuli:** uden brusk (centralt), med fedtlegeme (pulvinar acetabuli). **Incisura acetabuli:** nedadtil, med lig. transversum acetabuli.","img":"r_ax10_33-1"},{"id":"ax10-t32","t":"ax10.hl","k":"text","q":"Hvorfor er hofteleddet mere stabilt end skulderleddet?","a":"Fordi hofteleddets ledskål (acetabulum) er dybere og større i forhold til ledhovedet end skulderleddets.","img":"r_ax10_33-1"},{"id":"ax10-t33","t":"ax10.hl","k":"text","q":"Hvordan er hofteleddets kapsel fæstnet, og hvad er zona orbicularis?","a":"Kapslen hæfter fortil langs linea intertrochanterica og på bagsiden kun halvt ud på collum, hvor der dannes store omslagsfolder i synovialismembranen.\nZona orbicularis er cirkulære strøg, profundt beliggende i kapslen, som hindrer luksation af caput.","img":"r_ax10_34-3"},{"id":"ax10-t34","t":"ax10.hl","k":"text","q":"Hvilke tre ligamenter forstærker hofteleddets kapsel, og hvordan forløber de?","a":"**Lig. iliofemorale:** udspringer under spina iliaca anterior inferior, hæfter på midterste 2/3 af linea intertrochanterica.\n**Lig. ischiofemorale:** udspringer fra os ischii posteriort/inferiort for acetabulum, hæfter øverst på linea intertrochanterica.\n**Lig. pubofemorale:** udspringer fra eminentia iliopubica, ramus superior og membrana obturatoria, hæfter på trochanter minor.","img":"r_ax10_33-1"},{"id":"ax10-t35","t":"ax10.hl","k":"text","q":"Hvad er den vigtigste pointe med hofteleddets kapselligamenter?","a":"De sikrer stabilitet: ved fuld ekstension reduceres de tre frihedsgrader til én (fleksion–ekstension), hvilket sikrer stabilitet i afsætningsfasen ved gang og løb.","img":"r_ax10_34-1"},{"id":"ax10-t36","t":"ax10.hl","k":"text","q":"Hvilke intraartikulære strukturer har hofteleddet?","a":"Labrum acetabulare (ledlæbe, hæftet til limbus acetabuli, griber om caput femoris for stabilitet), pulvinar acetabuli (fedtlegeme, støddæmper) og lig. capitis femoris (intraartikulært ledbånd fra fovea capitis til lig. transversum acetabuli).","img":"r_ax10_33-1"},{"id":"ax10-t37","t":"ax10.hl","k":"text","q":"Hvilken rolle spiller lig. capitis femoris?","a":"Vigtig for karforsyningen til caput femoris under knoglevækst. Man er i tvivl om den præcise rolle, men den menes at have en nutritiv funktion in utero og/eller inden epifyseskiverne lukker, samt evt. en mekanoceptisk funktion.","img":"r_ax10_33-1"},{"id":"ax10-t38","t":"ax10.hl","k":"text","q":"Hvilke ekstraartikulære bursae findes ved hofteleddet?","a":"Bursa iliopectinea og bursa trochanterica superficialis (subkutant ud for trochanter major).","img":"r_ax10_33-1"},{"id":"ax10-t39","t":"ax10.hl","k":"text","q":"Hvilke bevægelser og bevægeudslag har hofteleddet?","a":"**Fleksion/ekstension** (0–120° og 0–30°), transversal akse; fleksion begrænses af bløddele, ekstension af lig. iliofemorale.\n**Abduktion/adduktion** (0–45° og 0–30°), sagittal akse; begrænses af lig. pubofemorale og iliofemorale.\n**Indadrotation/udadrotation** (0–60° og 0–40°), vertikal akse; begrænses af lig. ischiofemorale, hoftens små udadrotatorer og lig. pubofemorale.","img":"r_ax10_38-0"},{"id":"ax10-t40","t":"ax10.hl","k":"text","q":"Hvad er lig. inguinale, og hvad fører det til?","a":"Løber fra spina iliaca anterior superior til tuberculum pubicum. Mellem ligamentet og os coxae dannes en indgang for kar, nerver og muskel, som fører ind til trigonum femorale.","img":"r_ax10_40-4"},{"id":"ax10-t41","t":"ax10.hm","k":"text","q":"Hvordan inddeles hoftens 11 muskler?","a":"**Lændemusklen:** m. iliopsoas (m. iliacus + m. psoas major).\n**Sædemusklerne (4):** m. gluteus maximus, medius, minimus, m. tensor fasciae latae.\n**Hofteleddets små udadrotatorer (6):** m. piriformis, m. gemellus superior et inferior, m. obturatorius internus, m. quadratus femoris, m. obturatorius externus.","img":"r_ax10_48-3"},{"id":"ax10-t42","t":"ax10.hm","k":"text","q":"M. iliopsoas: udspring, insertion, funktion og innervation?","a":"**Består af** m. iliacus (udspring: fossa iliaca) og m. psoas major (udspring: vertebrae T12–L5, delt i et ventralt udspring fra corpus vertebralis og et dorsalt fra proc. transversus, med plexus lumbalis imellem).\n**Insertion:** trochanter minor, under lig. inguinale.\n**Funktion:** fleksion i hofteleddet.\n**Innervation:** m. psoas major af grene fra plexus lumbalis, m. iliacus af n. femoralis.","img":"r_ax10_44-2"},{"id":"ax10-t43","t":"ax10.hm","k":"text","q":"Hvad er lacuna musculorum og lacuna vasorum?","a":"Lig. inguinale sender strøg i dybden (arcus iliopectineus), der opdeler kanalen under ligamentet i en lateral del, **lacuna musculorum** (m. iliopsoas, n. femoralis og n. cutaneus femoris lateralis helt lateralt), og en medial del, **lacuna vasorum** (a. og v. femoralis, r. femoralis n. genitofemoralis, samt m. pectineus helt medialt).","img":"r_ax10_45-2"},{"id":"ax10-t44","t":"ax10.hm","k":"text","q":"Hvordan er sædemusklerne organiseret i lag, og hvilken nerve har hvert lag?","a":"**1. lag:** m. gluteus maximus (n. gluteus inf.) + m. tensor fasciae latae (n. gluteus sup.).\n**2. lag:** m. gluteus medius (n. gluteus sup.).\n**3. lag:** m. gluteus minimus (n. gluteus sup.).","img":"r_ax10_43-2"},{"id":"ax10-t45","t":"ax10.hm","k":"text","q":"M. gluteus maximus: udspring, insertion, funktion og innervation?","a":"**Udspring:** os coxae bag linea glutea posterior, bagsiden af os sacrum og os coccygis, lig. sacrotuberale.\n**Insertion:** distal del på tuberositas glutealis, proksimal del fortsætter i tractus iliotibialis.\n**Funktion:** kraftig ekstensor i hofteleddet; udadroterer og abducerer (proksimale del), adducerer (distale del).\n**Nerve:** n. gluteus inferior.","img":"r_ax10_48-4"},{"id":"ax10-t46","t":"ax10.hm","k":"text","q":"Hvad er tractus iliotibialis?","a":"En forstærkning af fascia latae på lateralsiden af låret, der hæfter på condylus lateralis tibiae.","img":"r_ax10_49-3"},{"id":"ax10-t47","t":"ax10.hm","k":"text","q":"M. tensor fasciae latae: udspring, insertion, funktion og innervation?","a":"**Udspring:** spina iliaca anterior superior. **Insertion:** i fascia latae distalt for trochanter major, fortsætter i tractus iliotibialis.\n**Funktion:** stabiliserer bækkenet, fleksor/abduktor/indadrotator i hoften, ekstensor i knæleddet.\n**Nerve:** n. gluteus superior.","img":"r_ax10_43-2"},{"id":"ax10-t48","t":"ax10.hm","k":"text","q":"M. gluteus medius: udspring, insertion, funktion og innervation?","a":"**Udspring:** mellem linea glutea anterior og posterior. **Insertion:** trochanter major.\n**Funktion:** abduktor (indad-/udadrotator); kontrollerer den adduktion, som bækkenkipningen fremkalder i standfasen.\n**Nerve:** n. gluteus superior.","img":"r_ax10_50-0"},{"id":"ax10-t49","t":"ax10.hm","k":"text","q":"Hvad sker der, hvis m. gluteus medius svigter under gang ('hip drop')?","a":"Bækkenkipningen fremkalder normalt en let adduktion i standbenets side. Uden m. gluteus medius' kontraherende modvirkning bliver denne adduktion overdrevet, og bækkenet falder ('hip drop') i stedet for at holdes lige.","img":"r_ax10_50-0"},{"id":"ax10-t50","t":"ax10.hm","k":"text","q":"M. gluteus minimus: udspring, insertion, funktion og innervation?","a":"**Udspring:** mellem linea glutea inferior og anterior. **Insertion:** trochanter major (forkant).\n**Funktion:** som m. gluteus medius (abduktion, indadrotation, stabiliserer adduktionen i standfasen).\n**Nerve:** n. gluteus superior.","img":"r_ax10_51-0"},{"id":"ax10-t51","t":"ax10.hm","k":"text","q":"Hvilke muskler udgør hofteleddets små udadrotatorer, og hvad er deres fælles funktion og innervation?","a":"M. piriformis, m. gemellus superior, m. gemellus inferior, m. obturatorius internus, m. quadratus femoris og m. obturatorius externus.\n**Funktion:** udadrotation i hoften. **Innervation:** motoriske grene direkte fra plexus sacralis, dog m. obturatorius externus af n. obturatorius fra plexus lumbalis.","img":"r_ax10_54-0"},{"id":"ax10-t52","t":"ax10.hm","k":"text","q":"M. piriformis: udspring, insertion og forløb?","a":"**Udspring:** forfladen af os sacrum, lateralt for foramina sacralia anteriora. **Insertion:** trochanter major (øverst).\nLøber bagud og lateralt gennem foramen ischiadicum majus og opdeler det i foramen suprapiriforme og foramen infrapiriforme.","img":"r_ax10_54-4"},{"id":"ax10-t53","t":"ax10.hm","k":"text","q":"M. obturatorius internus: udspring, insertion og forløb?","a":"**Udspring:** bagsiden/medialfladen af membrana obturatoria og den omgivende knogleramme. **Insertion:** trochanter major (mediale kant).\nPasserer gennem foramen ischiadicum minus, bøjer og krydser bagsiden af hofteleddet før insertion.","img":"r_ax10_55-7"},{"id":"ax10-t54","t":"ax10.hm","k":"text","q":"Mm. gemelli, m. quadratus femoris og m. obturatorius externus: udspring og insertion?","a":"**Mm. gemelli** ('tvillingerne'): udspring fra os ischii på hver side af senen fra m. obturatorius internus; insertion trochanter major (medialfladen), sammen med m. obturatorius internus.\n**M. quadratus femoris:** udspring tuber ischiadicum (lateralflade); insertion crista intertrochanterica.\n**M. obturatorius externus:** udspring membrana obturatoria (udvendig flade); insertion fossa trochanterica.","img":"r_ax10_56-0"},{"id":"ax10-t55","t":"ax10.hm","k":"text","q":"Hvordan adskiller m. obturatorius internus og externus sig i forløb og insertion?","a":"M. obturatorius internus løber posteriort for os ischii og insererer på trochanter major. M. obturatorius externus løber anteriort for os ischii og insererer i fossa trochanterica.","img":"r_ax10_55-7"},{"id":"ax10-t56","t":"ax10.hm","k":"text","q":"Hvilke muskler giver hhv. indadrotation og udadrotation i hofteleddet?","a":"**Indadrotation:** m. gluteus medius (forreste del), m. gluteus minimus, m. tensor fasciae latae.\n**Udadrotation:** m. gluteus medius, m. gluteus maximus, hofteleddets små udadrotatorer.","img":"r_ax10_43-2"},{"id":"ax10-t57","t":"ax10.hm","k":"text","q":"Hvilke muskler giver hhv. fleksion og ekstension i hofteleddet?","a":"**Fleksion:** m. iliopsoas, m. rectus femoris, m. tensor fasciae latae, m. sartorius.\n**Ekstension:** m. gluteus maximus.","img":"r_ax10_43-2"},{"id":"ax10-t58","t":"ax10.hm","k":"text","q":"Hvilke muskler giver hhv. abduktion og adduktion i hofteleddet?","a":"**Abduktion:** m. tensor fasciae latae, m. gluteus medius (vigtigst), m. gluteus minimus, m. gluteus maximus (proksimale del).\n**Adduktion:** m. gluteus maximus (distale del), adduktorlogens muskler.","img":"r_ax10_43-2"},{"id":"ax10-t59","t":"ax10.lm","k":"text","q":"Hvordan er lårets muskler inddelt i loger?","a":"Omgivet af fascia lata (som fortsætter distalt som fascia cruris). Tre muskelloger adskilt af septum intermusculare, der udspringer ved linea aspera: **forreste loge** (2 muskler, ekstensorgruppen, n. femoralis), **mediale loge** (5 muskler, adduktorerne, n. obturatorius) og **bagerste loge** (3 muskler, n. ischiadicus). Fascien er stærkest lateralt, hvor tractus iliotibialis findes.","img":"r_ax10_61-11"},{"id":"ax10-t60","t":"ax10.lm","k":"text","q":"Hvilke muskler hører til lårets forreste loge, og hvilken nerve har de?","a":"M. sartorius og m. quadriceps femoris. Nerve: n. femoralis.","img":"r_ax10_61-11"},{"id":"ax10-t61","t":"ax10.lm","k":"text","q":"M. sartorius: udspring, insertion, funktion?","a":"**Udspring:** spina iliaca anterior superior. **Insertion:** pes anserinus (øverst) på tibias medialflade.\n**Funktion:** hofteled: fleksion og abduktion; knæled: fleksion. Biartikulær.","img":"r_ax10_63-4"},{"id":"ax10-t62","t":"ax10.lm","k":"text","q":"Hvad er pes anserinus, og hvilke sener kan palperes i knæhasen?","a":"'Gåsefoden': fælles insertion for m. sartorius, m. gracilis og m. semitendinosus (i den rækkefølge, øverst til nederst) på tibias mediale, proksimale del.\nSener der kan palperes i knæhasen: lateralt tendo m. bicipitis femoris; medialt tendines m. semitendinosus et m. gracilis.","img":"r_ax10_64-0"},{"id":"ax10-t63","t":"ax10.lm","k":"text","q":"M. quadriceps femoris: hvilke fire hoveder har den, og hvor udspringer de?","a":"M. rectus femoris (spina iliaca anterior inferior, biartikulær), m. vastus medialis (linea aspera, labium mediale), m. vastus lateralis (linea aspera, labium laterale), m. vastus intermedius (forfladen af femur).","img":"r_ax10_65-0"},{"id":"ax10-t64","t":"ax10.lm","k":"text","q":"M. quadriceps femoris: insertion og funktion?","a":"**Insertion:** fælles insertionssene på tuberositas tibiae via lig. patellae, med patella indlejret i senen (patella er en sesamknogle, som forlænger kraftarmen). M. vastus medialis hjælper med fibre på patellas mediale side med at holde patella på plads.\n**Funktion:** knæledsekstensor (m. rectus femoris tillige hofteledsfleksor).","img":"r_ax10_65-0"},{"id":"ax10-t65","t":"ax10.lm","k":"text","q":"Hvilke muskler hører til lårets mediale loge (adduktorerne), og hvilken nerve har de?","a":"M. pectineus, m. adductor longus, m. adductor brevis, m. adductor magnus, m. gracilis. Nerve: n. obturatorius (m. pectineus modtager desuden grene fra n. femoralis, og m. adductor magnus fra n. ischiadicus).","img":"r_ax10_67-2"},{"id":"ax10-t66","t":"ax10.lm","k":"text","q":"Hvilke tre lag har adduktorgruppen, og hvordan er udspringet beskrevet?","a":"**1. lag:** m. pectineus, m. adductor longus, m. gracilis. **2. lag:** m. adductor brevis. **3. lag:** m. adductor magnus.\nUdspringet danner en hestesko fra ramus superior ossis pubis mod tuber ischiadicum.","img":"r_ax10_70-2"},{"id":"ax10-t67","t":"ax10.lm","k":"text","q":"Hvad er adduktorgruppens funktion?","a":"Adduktion i hofteleddet, samt stabilisering ved at presse caput ind i acetabulum.","img":"r_ax10_60-3"},{"id":"ax10-t68","t":"ax10.lm","k":"text","q":"Hvor insererer adduktormusklerne (langs linea aspera)?","a":"Fra linea pectinea til tuberculum adductorium. M. pectineus: linea pectinea. M. adductor longus: labium mediale lineae asperae. M. gracilis: pes anserinus (midterste sene). M. adductor brevis: linea aspera mellem longus og magnus. M. adductor magnus: labium mediale lineae asperae og tuberculum adductorium (via senestrop).","img":"r_ax10_69-1"},{"id":"ax10-t69","t":"ax10.lm","k":"text","q":"M. adductor magnus: hvad er hiatus adductorius, og hvad passerer der?","a":"Insertionen langs linea aspera er hullet af osteofibrøse åbninger til kar. Det nederste og største hul, hiatus adductorius, er passage for vasa femoralis til fossa poplitea.","img":"r_ax10_71-5"},{"id":"ax10-t70","t":"ax10.lm","k":"text","q":"Hvad er membrana vastoadductoria?","a":"Et stramt fascieblad fra mm. adductores magnus et longus til m. vastus medialis, som danner loft i canalis adductorius.","img":"r_ax10_72-2"},{"id":"ax10-t71","t":"ax10.lm","k":"text","q":"Hvordan er canalis adductorius afgrænset, og hvad indeholder den?","a":"Distale fortsættelse af trigonum femorale. **Afgrænsning:** bagtil proksimalt m. adductor longus, distalt m. adductor magnus; fortil m. vastus medialis; medialt m. sartorius og membrana vastoadductoria.\n**Indhold:** v. femoralis, a. femoralis, n. saphenus (perforerer kanalen).","img":"r_ax10_72-2"},{"id":"ax10-t72","t":"ax10.lm","k":"text","q":"Hvilke muskler hører til lårets bagerste loge, og hvilken nerve har de?","a":"M. biceps femoris, m. semitendinosus, m. semimembranosus. Nerve: n. ischiadicus (primært n. tibialis).","img":"r_ax10_74-2"},{"id":"ax10-t73","t":"ax10.lm","k":"text","q":"Hvordan er lårets bagerste loge opbygget i lag, og hvad er dens funktion?","a":"**Superficielt:** m. semitendinosus, caput longum m. bicipitis femoris. **Profundt:** m. semimembranosus, caput breve m. bicipitis femoris.\n**Funktion:** fleksion af knæled, samt ekstension af hofteled.\nAlle muskler er biartikulære (undtagen caput breve m. bicipitis femoris), og næsten alle udspringer fra tuber ischiadicum.","img":"r_ax10_60-3"},{"id":"ax10-t74","t":"ax10.lm","k":"text","q":"M. biceps femoris: udspring og insertion?","a":"**Caput longum:** tuber ischiadicum. **Caput breve:** labium laterale lineae asperae.\n**Insertion:** caput fibulae, med forening af de to hoveder nederst på låret.","img":"r_ax10_75-0"},{"id":"ax10-t75","t":"ax10.lm","k":"text","q":"M. semitendinosus og m. semimembranosus: udspring og insertion?","a":"**M. semitendinosus:** udspring tuber ischiadicum (sammen med caput longum m. bicipitis); insertion pes anserinus (bagerste sene af de tre).\n**M. semimembranosus:** udspring tuber ischiadicum; insertion deler sig i tre ben: horisontalt til condylus medialis tibiae, vertikalt til den bageste knæledskapsel via fascien af m. popliteus, og et tilbageløbende ben til lig. popliteum obliquum.","img":"r_ax10_76-0"},{"id":"ax10-t76","t":"ax10.lm","k":"text","q":"Hvad er trigonum femorale, og hvordan er det afgrænset?","a":"Et trekantet bindevævsspatium proksimalt på lårets forside. **Kranielt:** lig. inguinale. **Lateralt-kaudalt:** mediale kant af m. sartorius. **Medialt:** mediale kant af m. adductor longus. **Bund:** m. iliopsoas, m. pectineus, m. adductor longus, dækket af en dyb fascie. **Loft:** fascia lata.","img":"r_ax10_39-1"},{"id":"ax10-t77","t":"ax10.lm","k":"text","q":"Hvad indeholder trigonum femorale?","a":"V. femoralis, a. femoralis, n. femoralis + r. femoralis n. genitofemoralis, samt dybe inguinale lymfeknuder.","img":"r_ax10_68-1"},{"id":"ax10-o78","t":"ax10.bk","k":"occ","img":"coxae1","boxes":[[69.24,36.579,14.322,2.879],[69.24,55.808,20.755,14.226],[3.802,85.847,14.837,2.879],[41.081,44.705,14.18,3.709],[43.539,72.499,20.326,6.345],[38.937,0.317,2.802,1.537],[67.439,6.369,2.802,2.684],[42.739,17.057,2.887,2.099],[51.144,17.106,0.858,1.635],[40.109,18.058,2.716,2.147],[63.636,39.361,0.886,1.122],[13.522,40.703,2.201,1.635],[41.509,48.536,1.258,1.245],[46.484,48.853,18.411,3.66],[31.818,57.735,1.344,2.635],[74.242,70.913,8.262,3.831],[76.158,73.914,5.232,3.001],[80.76,84.358,3.602,1.928],[21.698,85.798,2.173,3.709],[80.417,86.994,1.658,1.025],[60.892,89.751,2.573,2.123],[24.471,91.532,21.498,7.882]],"target":0,"a":"Os ilium","n":"Øverste og største del af os coxae; danner de superiore 2/5 af acetabulum."},{"id":"ax10-o79","t":"ax10.bk","k":"occ","img":"coxae1","boxes":[[69.24,36.579,14.322,2.879],[69.24,55.808,20.755,14.226],[3.802,85.847,14.837,2.879],[41.081,44.705,14.18,3.709],[43.539,72.499,20.326,6.345],[38.937,0.317,2.802,1.537],[67.439,6.369,2.802,2.684],[42.739,17.057,2.887,2.099],[51.144,17.106,0.858,1.635],[40.109,18.058,2.716,2.147],[63.636,39.361,0.886,1.122],[13.522,40.703,2.201,1.635],[41.509,48.536,1.258,1.245],[46.484,48.853,18.411,3.66],[31.818,57.735,1.344,2.635],[74.242,70.913,8.262,3.831],[76.158,73.914,5.232,3.001],[80.76,84.358,3.602,1.928],[21.698,85.798,2.173,3.709],[80.417,86.994,1.658,1.025],[60.892,89.751,2.573,2.123],[24.471,91.532,21.498,7.882]],"target":1,"a":"Os pubis","n":"Nederste, forreste del af os coxae; ramus superior danner de ventrale 1/5 af acetabulum."},{"id":"ax10-o80","t":"ax10.bk","k":"occ","img":"coxae1","boxes":[[69.24,36.579,14.322,2.879],[69.24,55.808,20.755,14.226],[3.802,85.847,14.837,2.879],[41.081,44.705,14.18,3.709],[43.539,72.499,20.326,6.345],[38.937,0.317,2.802,1.537],[67.439,6.369,2.802,2.684],[42.739,17.057,2.887,2.099],[51.144,17.106,0.858,1.635],[40.109,18.058,2.716,2.147],[63.636,39.361,0.886,1.122],[13.522,40.703,2.201,1.635],[41.509,48.536,1.258,1.245],[46.484,48.853,18.411,3.66],[31.818,57.735,1.344,2.635],[74.242,70.913,8.262,3.831],[76.158,73.914,5.232,3.001],[80.76,84.358,3.602,1.928],[21.698,85.798,2.173,3.709],[80.417,86.994,1.658,1.025],[60.892,89.751,2.573,2.123],[24.471,91.532,21.498,7.882]],"target":2,"a":"Os ischii","n":"Bagerste, nedre del af os coxae, kraftigst; danner de dorsale 2/5 af acetabulum."},{"id":"ax10-o81","t":"ax10.bk","k":"occ","img":"coxae1","boxes":[[69.24,36.579,14.322,2.879],[69.24,55.808,20.755,14.226],[3.802,85.847,14.837,2.879],[41.081,44.705,14.18,3.709],[43.539,72.499,20.326,6.345],[38.937,0.317,2.802,1.537],[67.439,6.369,2.802,2.684],[42.739,17.057,2.887,2.099],[51.144,17.106,0.858,1.635],[40.109,18.058,2.716,2.147],[63.636,39.361,0.886,1.122],[13.522,40.703,2.201,1.635],[41.509,48.536,1.258,1.245],[46.484,48.853,18.411,3.66],[31.818,57.735,1.344,2.635],[74.242,70.913,8.262,3.831],[76.158,73.914,5.232,3.001],[80.76,84.358,3.602,1.928],[21.698,85.798,2.173,3.709],[80.417,86.994,1.658,1.025],[60.892,89.751,2.573,2.123],[24.471,91.532,21.498,7.882]],"target":3,"a":"Corpus ossis ilii","n":"Den del af os ilium, der danner de superiore 2/5 af acetabulum."},{"id":"ax10-o82","t":"ax10.bk","k":"occ","img":"coxae1","boxes":[[69.24,36.579,14.322,2.879],[69.24,55.808,20.755,14.226],[3.802,85.847,14.837,2.879],[41.081,44.705,14.18,3.709],[43.539,72.499,20.326,6.345],[38.937,0.317,2.802,1.537],[67.439,6.369,2.802,2.684],[42.739,17.057,2.887,2.099],[51.144,17.106,0.858,1.635],[40.109,18.058,2.716,2.147],[63.636,39.361,0.886,1.122],[13.522,40.703,2.201,1.635],[41.509,48.536,1.258,1.245],[46.484,48.853,18.411,3.66],[31.818,57.735,1.344,2.635],[74.242,70.913,8.262,3.831],[76.158,73.914,5.232,3.001],[80.76,84.358,3.602,1.928],[21.698,85.798,2.173,3.709],[80.417,86.994,1.658,1.025],[60.892,89.751,2.573,2.123],[24.471,91.532,21.498,7.882]],"target":4,"a":"Foramen obturatum","n":"Ovalt hul under acetabulum, næsten lukket af membrana obturatoria; passage for n. obturatorius og vasa obturatoria."},{"id":"ax10-o83","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":0,"a":"Tuberculum iliacum","n":"Fremspring på crista iliaca."},{"id":"ax10-o84","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":1,"a":"Spina iliaca posterior superior (SIPS)","n":"Udspring for lig. sacrotuberale."},{"id":"ax10-o85","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":2,"a":"Spina iliaca posterior inferior","n":"Nedre del af den bageste spina-gruppe på os ilium."},{"id":"ax10-o86","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":3,"a":"Spina iliaca anterior superior (SIAS)","n":"Udspring for lig. inguinale, m. tensor fasciae latae, m. sar
