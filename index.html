torius."},{"id":"ax10-o87","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":4,"a":"Spina iliaca anterior inferior (SIAI)","n":"Udspring for m. rectus femoris og lig. iliofemorale."},{"id":"ax10-o88","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":5,"a":"Acetabulum","n":"Ledskålen, der artikulerer med caput femoris."},{"id":"ax10-o89","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":6,"a":"Spina ischiadica","n":"Adskiller incisura ischiadica major og minor."},{"id":"ax10-o90","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":7,"a":"Crista pubica","n":"Kam på corpus ossis pubis, del af symphysis pubica-området."},{"id":"ax10-o91","t":"ax10.bk","k":"occ","img":"ilium2","boxes":[[41.667,12.796,16.574,2.216],[0.216,42.245,15.093,3.908],[8.519,49.216,15.0,3.908],[79.815,45.83,14.198,3.859],[78.148,55.166,14.074,3.859],[78.889,62.933,9.691,1.817],[7.099,65.696,13.364,2.191],[78.519,79.836,10.802,2.166],[63.426,81.454,25.185,4.207]],"target":8,"a":"Tuberculum pubicum","n":"Fremspring på os pubis; hæfter lig. inguinale."},{"id":"ax11-t1","t":"ax11.tr","k":"text","q":"Hvordan er trigonum femorale afgrænset?","a":"Trekantet bindevævsspatium på lårets forside. **Kranielt:** lig. inguinale. **Lateralt-kaudalt:** m. sartorius. **Medialt:** m. adductor longus. **Profundt:** mm. iliacus, pectineus et adductor longus. **Superficielt:** fascia lata.","img":"r_ax11_8-4"},{"id":"ax11-t2","t":"ax11.tr","k":"text","q":"Hvordan deles trigonum femorale proksimalt, og hvad indeholder de to dele?","a":"Fasciestrøg fra m. iliopsoas (arcus iliopectineus) deler det i **lacuna musculorum** (lateralt: m. iliopsoas, n. femoralis) og **lacuna vasorum** (medialt: vasa femoralis, r. femoralis n. genitofemoralis).","img":"r_ax11_8-4"},{"id":"ax11-t3","t":"ax11.tr","k":"text","q":"Hvordan fortsætter trigonum femorale distalt, og hvad indeholder canalis adductorius?","a":"Som canalis adductorius, der starter ved trigonums apex og afgrænses af m. vastus medialis, membrana vastoadductoria og mm. adductores longus et magnus, og slutter ved hiatus adductorius.\nIndhold: v. femoralis, a. femoralis, n. saphenus (perforerer kanalen).","img":"r_ax11_9-0"},{"id":"ax11-t4","t":"ax11.kn","k":"text","q":"Hvad kendetegner patella, og hvad er dens funktion?","a":"Kort, trekantet knogle (en stor sesamknogle) med apex (nede) og basis (oppe), indlejret i tendo m. quadricipitis femoris. Bagfladen har en oval ledflade (facies articularis) med føringskam.\n**Funktion:** øger momentarmen for m. quadriceps femoris, og beskytter knæleddets forside.","img":"r_ax11_12-3"},{"id":"ax11-t5","t":"ax11.kn","k":"text","q":"Hvilke strukturer findes på tibias extremitas proximalis?","a":"To condyli med facies articularis superior, eminentia intercondylaris, areae intercondylares anterior et posterior, tuberculum anterolaterale (Gerdy), tuberositas tibiae og facies articularis fibulae.","img":"r_ax11_13-1"},{"id":"ax11-t6","t":"ax11.kn","k":"text","q":"Hvilke strukturer findes på tibias corpus og extremitas distalis?","a":"**Corpus:** tre kanter/flader, membrana interossea, linea m. solei.\n**Extremitas distalis:** malleolus medialis med facies articularis malleoli medialis, facies articularis inferior, incisura fibularis.","img":"r_ax11_13-2"},{"id":"ax11-t7","t":"ax11.kn","k":"text","q":"Hvilke strukturer findes på fibula?","a":"**Extremitas proximalis:** apex, caput og collum fibulae. **Corpus:** trekantet, med membrana interossea. **Extremitas distalis:** malleolus lateralis (mere distal end den mediale) med facies articularis malleoli lateralis.","img":"r_ax11_14-3"},{"id":"ax11-t8","t":"ax11.kf","k":"text","q":"Art. genus (knæleddet): beliggenhed og klassifikation?","a":"Mellem femur, patella og tibia. Ægte, sammensat hængselled med fleksionsrotation."},{"id":"ax11-t9","t":"ax11.kf","k":"text","q":"Hvordan inddeles art. genus, og hvorfor?","a":"**Pars femoropatellaris, pars femorotibialis medialis og pars femorotibialis lateralis.**\nInddelingen skyldes anlægget af leddet med tre selvstændige ledhuler, som tidligt i fosterlivet vokser sammen."},{"id":"ax11-t10","t":"ax11.kf","k":"text","q":"Hvilke bevægelser og bevægeudslag har art. genus?","a":"Fleksion (0–135°) og ekstension (0–5°), samt fleksionsrotation (15–25° i hver retning). Normalstillingen har en lateral vinkel på 175°; afvigelser giver genu valgum/varum.","img":"r_ax11_34-2"},{"id":"ax11-t11","t":"ax11.kf","k":"text","q":"Hvorfor er knæleddet særligt mekanisk belastet?","a":"Det er kroppens største led og udsat for størst mekanisk belastning, dels grundet legemsmassen, dels fordi det befinder sig mellem kroppens to længste knogler."},{"id":"ax11-t12","t":"ax11.kf","k":"text","q":"Pars femoropatellaris: beliggenhed, type, ledhoved og ledskål?","a":"**Beliggenhed:** mellem femur og patella. **Type:** glideled.\n**Ledhoved:** facies patellaris femoris (condylus medialis et lateralis femoris), trisseformet med føringsfure.\n**Ledskål:** bagfladen af patella, med føringskam.","img":"r_ax11_18-0"},{"id":"ax11-t13","t":"ax11.kf","k":"text","q":"Hvordan bevæger patella sig i pars femoropatellaris, og hvad beskytter mod lateral luksation?","a":"Patella ligger som en sesamknogle i m. quadriceps' insertionssene og forøger musklens kraftarm. Knoglerne ligger fast op ad hinanden ved flekteret knæ, løsere ved ekstension, hvilket gør patella forskydelig.\nMod truende lateral luksation (pga. m. quadriceps' skrå trækretning) beskytter: den prominerende condylus lateralis femoris, m. vastus medialis obliquus, og mediale patellofemorale ligament (MPFL) + retinaculum patellae mediale.","img":"r_ax11_18-1"},{"id":"ax11-t14","t":"ax11.kf","k":"text","q":"Pars femorotibialis (med. + lat.): ledhoved og ledskål?","a":"**Ledhoved:** condylus medialis et lateralis femoris, adskilt af fossa intercondylaris; tværstillet valse med tiltagende krumning posteriort (spiraliserende form, muliggør fleksionsrotation).\n**Ledskål:** facies articularis superior tibiae (retroponeret, retroverteret) med eminentia intercondylaris, som artikulerer med fossa intercondylaris.","img":"r_ax11_21-2"},{"id":"ax11-t15","t":"ax11.kf","k":"text","q":"Hvad er meniscus medialis et lateralis, og hvad er deres funktion?","a":"Fibrocartilaginøse strukturer med trekantede tværsnit i pars femorotibialis. Fungerer som et 'elastisk eftergiveligt randpolster', der tilpasser sig femurkondylernes form og tryk og dermed fordeler trykket over et stort overfladeareal (støddæmpning og ledfladetilpasning).","img":"r_ax11_22-0"},{"id":"ax11-t16","t":"ax11.kf","k":"text","q":"Hvordan er menisci opbygget, og hvor er de vaskulariserede?","a":"Opbygget af fibrocartilago, undtagen de tilhæftede ender, som består af kollagene fibre. De perifere partier er forsynet med kar og nerver, mens de centrale dele er avaskulære.","img":"r_ax11_23-4"},{"id":"ax11-t17","t":"ax11.kf","k":"text","q":"Hvorfor er den mediale menisk hyppigere ramt af læsioner end den laterale?","a":"Den mediale menisk er mere fikseret og derved mindre mobil, pga.: øget afstand mellem den anteriore og posteriore forankring på areae intercondylares, kraftig binding til lig. collaterale tibiale, og direkte forbindelse til ledkapslen hele vejen rundt (den laterale er ikke forbundet posterolateralt).","img":"r_ax11_24-3"},{"id":"ax11-t18","t":"ax11.kf","k":"text","q":"Hvilke ligamenter har tilhæftning til menisci?","a":"Lig. coronarium mediale et laterale (binder meniscus medialis anteromedialt til tibia), lig. transversum genus (binder meniskerne sammen fortil) og lig. meniscofemorale posterius (meniscus lateralis bagtil, opad medialt til condylus femoris medialis).","img":"r_ax11_23-4"},{"id":"ax11-t19","t":"ax11.kl_lig","k":"text","q":"Hvilke fire ligamenter styrer art. genus, og hvordan inddeles de?","a":"**2 intraartikulære** (kun delvist synovialbeklædt): lig. cruciatum anterius (ACL) og lig. cruciatum posterius (PCL).\n**2 ekstraartikulære:** lig. collaterale tibiale/mediale og lig. collaterale fibulare/laterale.","img":"r_ax11_25-1"},{"id":"ax11-t20","t":"ax11.kl_lig","k":"text","q":"Lig. cruciatum anterius (ACL): forløb og funktion?","a":"Fra area intercondylaris anterior, skråt bagud lateralt, til medialsiden af den laterale femurkondyl i fossa intercondylaris.\n**Begrænser:** fremadglidning (og indadrotation) af tibia.","img":"r_ax11_26-2"},{"id":"ax11-t21","t":"ax11.kl_lig","k":"text","q":"Lig. cruciatum posterius (PCL): forløb og funktion?","a":"Fra area intercondylaris posterior + meniscus lateralis, skråt fremad medialt, til lateralsiden af den mediale femurkondyl i fossa intercondylaris.\n**Begrænser:** bagudglidning af tibia.","img":"r_ax11_26-2"},{"id":"ax11-t22","t":"ax11.kl_lig","k":"text","q":"Hvad er huskereglen for korsbåndene, og hvad hedder klinikken ved skade på dem?","a":"Huskeregel: **LAMP** — Anterior til indersiden af Lateral condyl, Posterior til indersiden af Mediale condyl.\nBeskadigelser giver 'skuffeløshed/-symptom', da femur og tibia kan forskydes anteriort/posteriort. Forreste korsbånd (ACL) beskadiges hyppigst.","img":"r_ax11_26-2"},{"id":"ax11-t23","t":"ax11.kl_lig","k":"text","q":"Hvilke andre intraartikulære strukturer har knæleddet ud over ligg. cruciata og menisci?","a":"**Tendo m. popliteus:** løber synovialisbeklædt gennem leddet, stabiliseret af lig. popliteofibulare.\n**Plica synovialis infrapatellaris:** repræsenterer den forreste del af det oprindelige septum mellem de to femorotibialled; fæstnet forkanten af fossa intercondylaris, bagfladen af patella og area intercondylaris anterior.\n**Corpus adiposum infrapatellare:** kileformet fedtpude mellem lig. patellae og forreste ledflader, suges ind i leddet under fleksion.","img":"r_ax11_27-1"},{"id":"ax11-t24","t":"ax11.kl_lig","k":"text","q":"Hvordan forholder synovialmembranen sig til meniskerne og korsbåndene?","a":"Synovialmembranen beklæder alle ikke-bruskbeklædte dele af knoglerne (meniskerne er IKKE dækket). Den fortsætter forbi det forreste korsbånd og beklæder korsbåndene på siderne, men ikke bagpå; den afbrydes ved menisci."},{"id":"ax11-t25","t":"ax11.kl_lig","k":"text","q":"Lig. collaterale tibiale (mediale): info, udspring og hæftning?","a":"Bredt, fladt bånd, som ikke nemt kan palperes.\n**Fra:** epicondylus medialis femoris. **Til:** overfladiske strøg antero-medialt på tibia, 4–5 cm fra leddet (modtager m. semimembranosus' sene); profunde strøg til kapsel + meniscus medialis.","img":"r_ax11_30-0"},{"id":"ax11-t26","t":"ax11.kl_lig","k":"text","q":"Lig. collaterale fibulare (laterale): info, udspring og hæftning?","a":"Strengformet bånd, som let kan palperes.\n**Fra:** epicondylus lateralis femoris. **Til:** caput fibulae.","img":"r_ax11_30-2"},{"id":"ax11-t27","t":"ax11.kl_lig","k":"text","q":"Hvilke forstærkninger findes i kapslen fortil (ud over kollateralligamenterne)?","a":"**Lig. patellae** og **ligg. coronaria** (mediale et laterale): profunde forstærkninger fortil, fra antero-mediale og antero-laterale kant af tibia til underkanten af menisci (mediale kraftigst udviklet).\n**Accessoriske strækapparat:** dele af tendo m. quadricipitis femoris sender længdegående fibre forbi patella og lig. patellae for at hæfte direkte på tibia.","img":"r_ax11_31-0"},{"id":"ax11-t28","t":"ax11.kl_lig","k":"text","q":"Hvad er retinaculum patellae mediale et laterale samt ligg. patellofemoralia?","a":"**Retinaculum patellae mediale et laterale:** tværgående fibre fra patellas siderande til condyli femoris; tøjler patella ind til leddet, især det mediale hindrer lateral luksation.\n**Lig. patellofemorale mediale et laterale:** fra epicondylus til siden af patella; det mediale hindrer luksation af patella.","img":"r_ax11_32-1"},{"id":"ax11-t29","t":"ax11.kl_lig","k":"text","q":"Hvilke forstærkninger findes på bagsiden af knæleddets kapsel?","a":"**Lig. popliteum obliquum** (recurrent udstråling af semimembranosus-senen).\n**Lig. popliteum arcuatum:** fra den laterale condyl, bueformet hen over tendo m. popliteus til apex fibulae.\n**Lig. popliteofibulare:** fra caput fibulae til tendo m. popliteus for at fæstne senen.","img":"r_ax11_32-3"},{"id":"ax11-t30","t":"ax11.kl_lig","k":"text","q":"Hvordan låses og aflåses knæleddet?","a":"Ved (hyper)ekstension (op til 5°) rammer condylus medialis femoris en lille kam på forreste del af tibias mediale ledflade, hvorved femur indadroterer og knæet låses — en energibesparende, stabil position hvor m. quadriceps kan afslappes. M. popliteus (med sit skrå forløb) 'låser knæet op' igen ved at udadrotere femur en smule."},{"id":"ax11-t31","t":"ax11.kf","k":"text","q":"Hvad er Q-vinklen i knæet?","a":"Vinklen mellem en linje fra patella til spina iliaca anterior superior og en linje fra patella til lig. patellae — udtryk for trækretningen for m. quadriceps femoris.\nGennemsnitligt 18° hos kvinder, 13° hos mænd (skyldes bredere bækken og kortere femur hos kvinder). Større Q-vinkel giver genu valgum, mindre giver genu varum.","img":"r_ax11_37-3"},{"id":"ax11-t32","t":"ax11.kf","k":"text","q":"Hvilke bursae er knyttet til knæleddet?","a":"**Oftest intrasynoviale:** bursa/recessus suprapatellaris (fikseres af fibre fra m. articularis genus), samt bursae under mm. semimembranosus, gastrocnemius, popliteus og pes anserinus.\n**Ekstrasynoviale:** bursa subcutanea prepatellaris, bursae subcutaneae infrapatellaris et tuberositas tibiae, bursa infrapatellaris profunda.","img":"r_ax11_39-0"},{"id":"ax11-t33","t":"ax11.kf","k":"text","q":"Hvad er en Baker's cyste?","a":"En væskeansamling i knæet, der kan danne en cyste ud fra bursa m. semimembranosi og/eller bursa subtendinea m. gastrocnemii medialis.","img":"r_ax11_39-0"},{"id":"ax11-t34","t":"ax11.kf","k":"text","q":"Hvordan er fossa poplitea afgrænset, og hvad indeholder den?","a":"Rhombeformet bindevævsrum. **Afgrænsning:** opadtil lateralt m. biceps femoris; opadtil medialt m. semitendinosus + m. semimembranosus; nedadtil medialt caput mediale m. gastrocnemii; nedadtil lateralt caput laterale m. gastrocnemii + m. plantaris.\n**Indhold:** n. ischiadicus' endegrene (n. peroneus communis, n. tibialis) og vasa poplitea med deres grene.","img":"r_ax11_41-1"},{"id":"ax11-t35","t":"ax11.kkl","k":"text","q":"Hvad er Jumper's knee, og hvordan undersøges det?","a":"Springerknæ. Undersøges ved 'anslag af patella'.","img":"r_ax11_40-2"},{"id":"ax11-t36","t":"ax11.kkl","k":"text","q":"Hvordan opstår fibersprængninger i hasemusklerne, og hvad beskytter de mod?","a":"Ved co-kontraktion af hasemusklerne mod m. quadriceps femoris for at bremse det fremadsvingende ben (fx et spark) og beskytte det forreste korsbånd — eller ved et foroverfaldet underben, hvor m. quadriceps holder knæet stabilt, men belaster det forreste korsbånd.","img":"r_ax11_40-2"},{"id":"ax11-t37","t":"ax11.kkl","k":"text","q":"Ledforbindelsen mellem tibia og fibula: hvordan inddeles den?","a":"**Syndesmosis tibiofibularis** (distalt) og **art. tibiofibularis** (proksimalt)."},{"id":"ax11-t38","t":"ax11.kkl","k":"text","q":"Syndesmosis tibiofibularis: klassifikation og opbygning?","a":"Uægte led, syndesmose. Udgøres af membrana interossea (distal-lateral fiberretning) og ligg. tibiofibularia (ant. + interosseum + post.), som holder de distale ender sammen.","img":"r_ax11_43-2"},{"id":"ax11-t39","t":"ax11.kkl","k":"text","q":"Art. tibiofibularis (proksimalt): klassifikation, ledflader og bevægelse?","a":"Ægte, enkelt glideled mellem den mediale del af caput fibulae og en flad, cirkulær ledfacet på condylus lateralis tibiae.\nGrundet membrana interosseas fiberretning (distalt-lateralt) skubbes fibula væk fra tibia ved dorsifleksion af ankelleddet, hvorved membranens fibre udspændes og trækker fibula proksimalt (forskydningen er palperbar).","img":"r_ax11_43-2"},{"id":"ax11-t40","t":"ax11.ue_","k":"text","q":"Hvordan er underbenets 12 muskler inddelt i loger, og hvilken nerve har hver?","a":"**Ekstensorlogen (4):** n. peroneus profundus. **Peroneerlogen (2):** n. peroneus superficialis. **Fleksorlogen (6):** n. tibialis, opdelt i en superficiel gruppe (2) og en profund gruppe (4).","img":"r_ax11_51-0"},{"id":"ax11-t41","t":"ax11.ue_","k":"text","q":"Hvilke muskler udgør ekstensorlogen?","a":"M. tibialis anterior (mest medial og størst), m. extensor hallucis longus, m. extensor digitorum longus, m. peroneus (fibularis) tertius. Nerve: n. peroneus profundus.","img":"r_ax11_53-2"},{"id":"ax11-t42","t":"ax11.ue_","k":"text","q":"M. tibialis anterior: udspring, insertion, funktion?","a":"**Udspring:** tibias lateralflade, tilstødende membrana interossea, fascia cruris.\n**Insertion:** os cuneiforme mediale og basis ossis metatarsalis I.\n**Funktion:** dorsifleksion, inversion (supination); støddæmpning under gang.","img":"r_ax11_54-1"},{"id":"ax11-t43","t":"ax11.ue_","k":"text","q":"M. extensor hallucis longus: udspring, insertion, funktion?","a":"**Udspring:** membrana interossea (fibula). **Insertion:** phalanx distalis I.\n**Funktion:** ekstension af storetåen, dorsifleksion. Løber i 2. kulisse i ekstensorretinaklet.","img":"r_ax11_54-1"},{"id":"ax11-t44","t":"ax11.ue_","k":"text","q":"M. extensor digitorum longus og m. peroneus tertius: udspring, insertion, funktion?","a":"**M. extensor digitorum longus:** udspring condylus lateralis tibiae, fibula, membrana interossea; insertion i ekstensoraponeurosen II–V; funktion ekstension af de 4 laterale tæer, dorsifleksion, eversion (pronation).\n**M. peroneus tertius:** lille, variabel muskel, i fortsættelse af m. extensor digitorum longus; insertion basis ossis metatarsalis V; funktion dorsifleksion, eversion. Begge i 4. kulisse.","img":"r_ax11_55-1"},{"id":"ax11-t45","t":"ax11.ue_","k":"text","q":"Hvad hedder ekstensorretinaklerne, og hvad kendetegner retinaculum extensorum inferius?","a":"**Retinaculum extensorum superius:** fortykkelse af fascia cruris proksimalt for ankelleddet; kun m. tibialis anterior har seneskede under dette.\n**Retinaculum extensorum inferius:** Y-formet som remmene i en sandal, udspring ved sinus tarsi; her taler man om 'kulisserne'.","img":"r_ax11_56-0"},{"id":"ax11-t46","t":"ax11.ue_","k":"text","q":"Hvilke fire kulisser findes i retinaculum extensorum, og hvad er huskereglen?","a":"Fra medialt til lateralt: **1.** m. tibialis anterior, **2.** m. extensor hallucis longus, **3.** kar og nerver, **4.** m. extensor digitorum longus (+ m. peroneus tertius).\nHuskeregel (medial→lateral): **TIB – HAL – VAN – DIG.**","img":"r_ax11_57-0"},{"id":"ax11-t47","t":"ax11.pe","k":"text","q":"Hvilke muskler udgør peroneerlogen (fibularlogen), og hvilken nerve har de?","a":"M. peroneus longus (s. m. fibularis longus) og m. peroneus brevis (s. m. fibularis brevis). Nerve: n. peroneus superficialis (s. n. fibularis superficialis).","img":"r_ax11_60-2"},{"id":"ax11-t48","t":"ax11.pe","k":"text","q":"M. peroneus longus: udspring, insertion, forløb og funktion?","a":"**Udspring:** caput fibulae, proksimale lateralflade fibula, fascia cruris. **Insertion:** tuberositas ossis metatarsalis I.\n**Forløb:** efter trochlea peronealis krydses under lateralkanten af os cuboideum, profundt for lig. plantare longum, til insertion plantart på basis af 1. metatars.\n**Funktion:** plantarfleksion, eversion; stabiliserer fodens tværbue.","img":"r_ax11_61-4"},{"id":"ax11-t49","t":"ax11.pe","k":"text","q":"M. peroneus brevis: udspring, insertion, funktion og spotteteknik?","a":"**Udspring:** distale lateralflade fibula, septa intermuscularia. **Insertion:** tuberositas ossis metatarsalis V.\n**Funktion:** plantarfleksion, eversion.\n**Spot:** 'gemmer' sig profundt for senen til m. peroneus longus distalt; dens sene ligger mest anteriort i forhold til m. peroneus longus' sene.","img":"r_ax11_62-0"},{"id":"ax11-t50","t":"ax11.pe","k":"text","q":"Hvordan er peroneerretinaklerne opbygget?","a":"**Retinaculum musculorum peronaeorum superius:** fra bagsiden af laterale malleol til lateralflade af calcaneus, med én fælles kulisse.\n**Retinaculum musculorum peronaeorum inferius:** 8-talsformet slynge med 2 kulisser — m. peroneus longus bagerst, m. peroneus brevis forrest.","img":"r_ax11_63-2"},{"id":"ax11-t51","t":"ax11.fl","k":"text","q":"Hvordan er fleksorlogen opdelt, og hvilke muskler hører til hver del?","a":"**Profunde loge:** m. flexor hallucis longus, m. tibialis posterior, m. flexor digitorum longus, m. popliteus.\n**Superficielle loge:** m. triceps surae (= m. soleus + m. gastrocnemius), m. plantaris.\nNerve: n. tibialis.","img":"r_ax11_65-4"},{"id":"ax11-t52","t":"ax11.fl","k":"text","q":"M. gastrocnemius og m. soleus (m. triceps surae): udspring og insertion?","a":"**M. gastrocnemius:** caput mediale bagved tuberculum adductorium/facies poplitea; caput laterale over epicondylus lateralis/facies poplitea.\n**M. soleus** ('flyndermusklen', flad): udspring linea m. solei + senebue (tibia–fibula) + fibulas bagflade.\n**Fælles insertion:** via Achillessenen til tuber calcanei.","img":"r_ax11_66-3"},{"id":"ax11-t53","t":"ax11.fl","k":"text","q":"M. triceps surae: funktion?","a":"Plantarfleksion og inversion. M. gastrocnemius bidrager desuden til fleksion af knæleddet — ved knæledsfleksion forkortes gastrocnemius, og kraftudviklingen falder drastisk.","img":"r_ax11_66-4"},{"id":"ax11-t54","t":"ax11.fl","k":"text","q":"M. plantaris: udspring, insertion og spotteteknik?","a":"**Udspring:** over epicondylus lateralis femoris. **Insertion:** tuber calcanei (variabelt).\n**Spot:** forløber mellem m. gastrocnemius og m. soleus — pas på ikke at forveksle den med en nerve.","img":"r_ax11_66-4"},{"id":"ax11-t55","t":"ax11.fl","k":"text","q":"M. popliteus: udspring, insertion, funktion?","a":"**Udspring:** lateralflade, epicondylus lateralis femoris (synovialisbeklædt gennem knæleddet, profundt for lig. collaterale fibulare og lig. popliteum arcuatum, stabiliseret af lig. popliteofibulare).\n**Insertion:** bagfladen af tibia, proksimalt for linea m. solei.\n**Funktion:** indadrotation af crus / udadrotation af femur — kan låse knæet op fra overstrakt position.","img":"r_ax11_67-8"},{"id":"ax11-t56","t":"ax11.fl","k":"text","q":"M. flexor hallucis longus: udspring, forløb, insertion, funktion?","a":"**Udspring:** fibulas bagflade. **Forløb:** distalt gennem 4. kulisse, trækker en fure i proc. posterior tali, passerer under sustentaculum tali, krydser under senen til m. flexor digitorum longus plantart.\n**Insertion:** basis, phalanx distalis I.\n**Funktion:** plantarfleksion, inversion, fleksion af storetåen, stabilisering af art. subtalaris.","img":"r_ax11_68-8"},{"id":"ax11-t57","t":"ax11.fl","k":"text","q":"M. tibialis posterior: udspring, forløb, insertion, funktion?","a":"**Udspring:** membrana interossea, tilstødende dele af tibia og fibula. **Forløb:** bred fure på bagfladen af malleolus medialis gennem 1. kulisse.\n**Insertion:** tuberositas ossis navicularis, ossa cuneiformia.\n**Funktion:** plantarfleksion, inversion.","img":"r_ax11_69-1"},{"id":"ax11-t58","t":"ax11.fl","k":"text","q":"M. flexor digitorum longus: udspring, forløb, insertion, funktion?","a":"**Udspring:** tibias bagflade (distalt for linea m. solei). **Forløb:** distalt gennem 2. kulisse, under 1. lag af plantas muskulatur (modtager insertion fra m. quadratus plantae, sener deles i 4, mm. lumbricales udspringer herfra), passerer chiasma tendinum distalt.\n**Insertion:** basis, phalanx distalis II–V.\n**Funktion:** plantarfleksion, inversion, fleksion af de 4 laterale tæer.","img":"r_ax11_70-8"},{"id":"ax11-t59","t":"ax11.fl","k":"text","q":"Hvilke fire kulisser findes i retinaculum musculorum flexorum, og hvad er huskereglen?","a":"**1.** m. tibialis posterior, **2.** m. flexor digitorum longus, **3.** kar og nerver, **4.** m. flexor hallucis longus.\nHuskeregel: **TIB – DIG – VAN – HAL** (omvendt af ekstensorlogen, hvor HAL og DIG har byttet plads).","img":"r_ax11_71-2"},{"id":"ax11-t60","t":"ax11.fl","k":"text","q":"Hvordan krydser fleksorsenerne på crus og i planta pedis?","a":"M. tibialis posterior og m. flexor digitorum longus krydser bag på tibia (**chiasma cruris**). M. flexor hallucis longus og m. flexor digitorum longus krydser i planta pedis (**chiasma plantare**).","img":"r_ax11_72-2"},{"id":"ax11-t61","t":"ax11.fl","k":"text","q":"Hvordan ligger ekstensor-, peroneer- og fleksorsenerne indbyrdes på crus?","a":"**Ekstensorerne** ligger som de kommer ud til insertionerne: tibialis anterior – extensor hallucis longus – extensor digitorum longus.\n**Peroneerne** ligger så m. peroneus longus kan krydse under m. peroneus brevis (longus ligger dorsalt/plantart).\n**Fleksorerne** ligger omvendt på crus i forhold til deres insertioner, hvilket giver krydsningerne (chiasma cruris og plantare).","img":"r_ax11_72-4"},{"id":"ax11-t62","t":"ax11.ga","k":"text","q":"Hvordan er gangcyklussen bygget op?","a":"To skridt, hvor hvert ben gennemgår en **standfase** (benet som støtte, ca. 60 % af tiden; hæl i jorden til storetå af jorden) og en **svingfase** (benet i bevægelse, ca. 40 %). Faserne overlapper, så begge ben er i kontakt med jorden samtidig i en periode.","img":"r_ax11_74-0"},{"id":"ax11-t63","t":"ax11.ga","k":"text","q":"Hvad sker der i standfasens støddæmpningsfase, og hvilke muskler/led er involveret?","a":"Excentrisk kontraktion i: ankelled (m. tibialis anterior et posterior), knæled (m. quadriceps femoris), hofteled (m. gluteus medius, kontrol af adduktionen). Høje hæle påvirker denne mekanik.","img":"r_ax11_74-3"},{"id":"ax11-t64","t":"ax11.ga","k":"text","q":"Hvad kendetegner kontaktfasen under gang?","a":"'Fodrandsrulning' langs den laterale fodrand. Indadrotation af standbenet og udadrotation af svingbenet i hoften (m. gluteus minimus) medfører skridtforlængelse og sikrer, at foden peger lige frem.","img":"r_ax11_75-2"},{"id":"ax11-t65","t":"ax11.ga","k":"text","q":"Hvilke strukturer gør benet stift og stabilt under afsæt?","a":"Art. coxae via båndskruen (de 3 ekstraartikulære kapselforstærkninger), art. talocruralis via fodledsgaflen, art. subtalaris via m. flexor hallucis longus' kontraktion, aponeurosis plantaris' opspænding, samt 1. stråles stabilisering via m. abductor hallucis, m. adductor hallucis og m. peroneus longus. Selve afsættet er aktiv plantarfleksion via m. triceps surae.","img":"r_ax11_75-2"},{"id":"ax11-t66","t":"ax11.ga","k":"text","q":"Hvordan foregår svingfasen?","a":"Enten passiv fremadføring af benet via hoftens båndskrue, eller aktiv fremadføring via m. iliopsoas."},{"id":"ax11-t67","t":"ax11.ga","k":"text","q":"Hvordan adskiller løb sig fra gang?","a":"Ved løb er standfasen kortere end svingfasen, så begge fødder til tider er i luften samtidig, mens kun ét ben ad gangen er i standfasen. Hoftefleksionen øges ved foroverbøjet overkrop, hvorved m. gluteus maximus strækkes og opnår et større ekstensionsmoment. Svingfasen gøres mere aktiv via m. iliopsoas og m. rectus femoris."},{"id":"ax11-o68","t":"ax11.kl_lig","k":"occ","img":"kneelig","boxes":[[2.24,2.125,36.166,13.993],[63.373,2.125,36.166,13.993],[22.596,80.806,21.08,12.747],[52.503,80.806,21.08,12.747]],"target":0,"a":"Lig. collaterale tibiale (mediale)","n":"Bredt, fladt bånd fra epicondylus medialis femoris; kan ikke nemt palperes."},{"id":"ax11-o69","t":"ax11.kl_lig","k":"occ","img":"kneelig","boxes":[[2.24,2.125,36.166,13.993],[63.373,2.125,36.166,13.993],[22.596,80.806,21.08,12.747],[52.503,80.806,21.08,12.747]],"target":1,"a":"Lig. collaterale fibulare (laterale)","n":"Strengformet bånd fra epicondylus lateralis femoris til caput fibulae; kan let palperes."},{"id":"ax11-o70","t":"ax11.kl_lig","k":"occ","img":"kneelig","boxes":[[2.24,2.125,36.166,13.993],[63.373,2.125,36.166,13.993],[22.596,80.806,21.08,12.747],[52.503,80.806,21.08,12.747]],"target":2,"a":"Meniscus medialis","n":"Mere fikseret og derfor hyppigere ramt af læsioner end den laterale."},{"id":"ax11-o71","t":"ax11.kl_lig","k":"occ","img":"kneelig","boxes":[[2.24,2.125,36.166,13.993],[63.373,2.125,36.166,13.993],[22.596,80.806,21.08,12.747],[52.503,80.806,21.08,12.747]],"target":3,"a":"Meniscus lateralis","n":"Mere mobil end den mediale menisk, bl.a. fordi den ikke er forbundet til kapslen posterolateralt."},{"id":"ax12-t1","t":"ax12.fk","k":"text","q":"Hvordan opdeles foden?","a":"**Tarsus** (fodroden), **metatarsus** (mellemfoden) og **digiti pedis** (tæerne).","img":"r_ax12_9-2"},{"id":"ax12-t2","t":"ax12.fk","k":"text","q":"Hvor mange knogler har tarsus, og hvordan er de fordelt?","a":"7 stk., inddelt i en proksimal (2 knogler: talus, calcaneus) og en distal række (5 knogler: os naviculare, ossa cuneiformia mediale/intermedium/laterale, os cuboideum).","img":"r_ax12_10-4"},{"id":"ax12-t3","t":"ax12.fk","k":"text","q":"Talus: hvad kendetegner den, og hvilke dele har den?","a":"'Rullebenet' — en overgangsknogle og styretap uden nogen muskeltilhæftning.\nCaput tali (med facies articularis navicularis), collum tali, corpus tali og trochlea tali (med proc. lateralis).","img":"r_ax12_11-1"},{"id":"ax12-t4","t":"ax12.fk","k":"text","q":"Hvad kendetegner trochlea tali?","a":"Et 160 grader stort udsnit af en trisse omkring en transversal akse. Sidefladerne artikulerer med malleolerne: den mediale sideflade er kommaformet, den laterale skyder sig ud i processus lateralis tali.","img":"r_ax12_11-1"},{"id":"ax12-t5","t":"ax12.fk","k":"text","q":"Hvilke strukturer findes på talus' underside?","a":"Proc. posterior tali (med tuberculum mediale et laterale) med sulcus tendinis m. flexoris hallucis longi, og sulcus tali, som opdeler ledfacetterne til calcaneus i facies articularis calcanea posterior, media og anterior.","img":"r_ax12_11-6"},{"id":"ax12-t6","t":"ax12.fk","k":"text","q":"Calcaneus: hvad kendetegner den, og hvad viser oversiden?","a":"Vægtoverførende og den største knogle i foden. Oversiden deles af sulcus calcanei i facies articularis talaris posterior, media og anterior.","img":"r_ax12_13-4"},{"id":"ax12-t7","t":"ax12.fk","k":"text","q":"Hvad er sustentaculum tali, og hvad løber under den?","a":"En 'hylde' beliggende medialt på calcaneus, som understøtter talus, og hvorunder m. flexor hallucis longus løber.","img":"r_ax12_13-4"},{"id":"ax12-t8","t":"ax12.fk","k":"text","q":"Hvad er tuber calcanei, og hvad hæfter der?","a":"Calcaneus' bagerste fremspring med processus medialis et lateralis (plantart); tilhæftning for Achillessenen.","img":"r_ax12_13-4"},{"id":"ax12-t9","t":"ax12.fk","k":"text","q":"Hvad er sinus tarsi og trochlea peronealis (fibularis)?","a":"**Sinus tarsi:** kanalen dannet af sulcus calcanei + sulcus tali.\n**Trochlea peronealis:** fremspring på calcaneus' laterale flade.","img":"r_ax12_16-6"},{"id":"ax12-t10","t":"ax12.fk","k":"text","q":"Hvilke tre knogler udgør tarsus' distale række, og hvad kendetegner dem?","a":"**Os naviculare** ('bådbenet'): proksimal konkav og distal konveks ledflade, med tuberositas ossis navicularis.\n**Ossa cuneiformia mediale, intermedium et laterale** ('kilebenene'): kileformede, hvor intermedium er nøglestenen i fodens tværbue.\n**Os cuboideum** ('terningebenet'): kasseformet, med sulcus peronealis på den plantare flade, hvori m. peroneus longus løber.","img":"r_ax12_17-6"},{"id":"ax12-t11","t":"ax12.fk","k":"text","q":"Hvordan er ossa metatarsalia I–V opbygget, og hvad er særligt ved I og V?","a":"Små rørknogler som håndens, dog længere og slankere, med basis – corpus – caput; siderne artikulerer med hinanden.\n**Os metatarsale I:** tuberositas ossis metatarsalis I (plantart), insertion for m. peroneus longus, + sesamknogler.\n**Os metatarsale II–IV:** kileformede baser, kongruente med ossa cuneiformia og cuboideum.\n**Os metatarsale V:** tuberositas ossis metatarsalis V (lateralt), insertion for m. peroneus brevis.","img":"r_ax12_18-0"},{"id":"ax12-t12","t":"ax12.fk","k":"text","q":"Hvordan er tæernes knogler (ossa digitorum pedis) opbygget?","a":"Hver tå har normalt tre rørknogler (phalanx proximalis = grundstykke, phalanx media = mellemstykke, phalanx distalis = yderstykke), hver med basis – corpus – caput.\n**Hallux (storetåen)** har kun to phalanges (proximalis + distalis) samt to sesamknogler plantart for metatarsophalangealleddet.","img":"r_ax12_19-2"},{"id":"ax12-t13","t":"ax12.fm","k":"text","q":"Hvilke muskler udgør fodens muskulatur samlet, og hvordan fordeler de sig?","a":"**Fodryggens muskulatur (1–2):** m. extensor digitorum brevis (+ m. extensor hallucis brevis).\n**Fodsålens muskulatur (10):** storetåens loge (3), centrale loge (3), lilletåens loge (3), spatia interossea (2 muskelgrupper).","img":"r_ax12_23-2"},{"id":"ax12-t14","t":"ax12.fm","k":"text","q":"M. extensor digitorum brevis: udspring, insertion, funktion og innervation?","a":"**Udspring:** lateralt på dorsalfladen af calcaneus. **Insertion:** lateralsiden af tendo m. extensoris digitorum longi til 2.–4. tå (ingen til lilletåen). M. extensor hallucis brevis har selvstændig insertion på basis af phalanx proximalis I.\n**Funktion:** ekstension af tæerne. **Nerve:** n. peroneus profundus.","img":"r_ax12_23-2"},{"id":"ax12-t15","t":"ax12.fm","k":"text","q":"Hvad ses klinisk ved atrofi af m. extensor digitorum brevis?","a":"Musklen danner normalt en konveks muskelbug lateralt på dorsum pedis, som under perifer neuropati (fx ved diabetes) vil atrofiere, da den ligger distalt.","img":"r_ax12_23-2"},{"id":"ax12-t16","t":"ax12.fm","k":"text","q":"Hvordan er fodens ekstensoraponeurose opbygget?","a":"Sener fra ekstensormusklerne, der ender på phalanges, samles i ekstensoraponeurosen — meget sammenlignelig med håndens. En central snip hæfter på phalanx media, mens to laterale snipper hæfter på phalanx distalis.","img":"r_ax12_23-2"},{"id":"ax12-t17","t":"ax12.pp","k":"text","q":"Hvad indgår i dispositionen for planta pedis til eksamen?","a":"Afgrænsning; hud; subcutis; aponeurosis plantaris; lagdeling, muskulatur og sener; kar; nerver."},{"id":"ax12-t18","t":"ax12.pp","k":"text","q":"Hvordan er planta pedis afgrænset, og hvilke fortykkede områder findes?","a":"Bagtil af hælens sidekontur, medialt og lateralt af fodens sidekonturer og plicae natatoriae (svømmehuden mellem tæerne).\nFortykkede områder: hælbalden, den laterale fodrand og de forreste fodbalde (storetåballen, lilletåballen).","img":"r_ax12_26-2"},{"id":"ax12-t19","t":"ax12.pp","k":"text","q":"Hvad kendetegner huden og subcutis i planta pedis?","a":"**Hud:** tyk, især over fodballerne, stramt nedbundet; svedkirtler, ingen talgkirtler eller hår.\n**Subcutis:** 'kamret fedtvæv' (isolering og støddæmpning), gennemvævet af retinacula cutis, stramt nedbundet."},{"id":"ax12-t20","t":"ax12.pp","k":"text","q":"Hvad er aponeurosis plantaris (fascia plantaris)?","a":"Et trekantet senespejl med stærke longitudinelle fibre, som afgrænser den centrale loge superficielt samt storetå- og lilletåballen med marginale septae.\n**Udspring:** tuber calcanei (proc. medialis et lateralis).","img":"r_ax12_28-1"},{"id":"ax12-t21","t":"ax12.pp","k":"text","q":"Hvordan insererer aponeurosis plantaris, og hvad ses distalt?","a":"**Overfladisk:** hæftning i subcutis, sammenbundet af lig. metatarsale transversum superficiale.\n**Profundt:** til grundstykket via ligg. plantaria som 2 septae.\nDistalt ses ruder mellem strøgene til hver tå med 1 a. metatarsalis plantaris og 2 nn. digitales plantares proprii.","img":"r_ax12_28-1"},{"id":"ax12-t22","t":"ax12.pp","k":"text","q":"Hvad er funktionen af aponeurosis plantaris?","a":"Beskytter fodsålens bløddele og sikrer fodens trekantkonstruktion. Hæftningen på tæernes grundstykker sikrer, at aponeurosen opspændes, når tæerne krænges dorsalt under gang og løb."},{"id":"ax12-t23","t":"ax12.pp","k":"text","q":"Hvordan breder aponeurosis plantaris sig ud fortil?","a":"Den deler sig i 5 snipper, én til hver tå. Snipperne deler sig igen i superficielle fibre (ender i læderhuden, bundet af lig. metatarsale transversum superficiale) og profunde fibre (deler sig i 2 septae pr. tå og insererer på grundstykkerne via ligg. plantaria).","img":"r_ax12_29-2"},{"id":"ax12-t24","t":"ax12.pp","k":"text","q":"Hvilke fem lag/strukturer indeholder planta pedis samlet?","a":"Hud, subcutis, aponeurosis plantaris, spatium plantare (4 muskellag), samt knogler og ligamenter."},{"id":"ax12-t25","t":"ax12.lag","k":"text","q":"Hvordan er fodsålens muskulatur organiseret — i lag eller loger?","a":"I **lag** (fire), i modsætning til underbenet som opdeles i loger."},{"id":"ax12-t26","t":"ax12.lag","k":"text","q":"Hvilke muskler udgør 1. lag, 'Abduktorerne'?","a":"M. abductor hallucis, m. flexor digitorum brevis, m. abductor digiti minimi. Alle udspringer fra tuber calcanei.","img":"r_ax12_31-3"},{"id":"ax12-t27","t":"ax12.lag","k":"text","q":"M. abductor hallucis og m. flexor digitorum brevis: insertion og funktion?","a":"**M. abductor hallucis:** insertion via det mediale sesamben på basis af phalanx proximalis I; funktion abduktion og kontrol af storetåen under afsæt (sammen med m. adductor hallucis).\n**M. flexor digitorum brevis:** insertion med to snipper på hver af de mediale phalanx II–V (chiasma tendinum); funktion fleksion."},{"id":"ax12-t28","t":"ax12.lag","k":"text","q":"M. abductor digiti minimi: insertion og funktion?","a":"**Insertion:** lateralsiden af basis på lilletåens proksimale phalanx. **Funktion:** abduktion, fleksion."},{"id":"ax12-t29","t":"ax12.lag","k":"text","q":"Hvad indeholder 2. lag, 'De lange fleksorsener og tilhørende muskler'?","a":"Senerne fra m. flexor hallucis longus og m. flexor digitorum longus, samt m. quadratus plantae og mm. lumbricales (4 stk.).","img":"r_ax12_32-0"},{"id":"ax12-t30","t":"ax12.lag","k":"text","q":"M. quadratus plantae: udspring, insertion, funktion?","a":"**Udspring:** processus lateralis og medialis tuberis calcanei. **Insertion:** laterale rand af tendo m. flexoris digitorum longi. **Funktion:** støtter m. flexor digitorum longus."},{"id":"ax12-t31","t":"ax12.lag","k":"text","q":"Mm. lumbricales (fod): udspring, insertion, funktion?","a":"**Udspring:** medialsiden af m. flexor digitorum longus' insertionssener. **Insertion:** medialsiden af basis på phalanx proximalis II–V. **Funktion:** proprioception, ligesom på hånden."},{"id":"ax12-t32","t":"ax12.lag","k":"text","q":"Hvilke muskler udgør 3. lag, 'Korte fleksorer'?","a":"M. flexor hallucis brevis, m. adductor hallucis, m. flexor digiti minimi brevis (+ m. opponens digiti minimi, sammenvokset med denne).","img":"r_ax12_33-3"},{"id":"ax12-t33","t":"ax12.lag","k":"text","q":"M. flexor hallucis brevis: udspring, insertion, funktion?","a":"**Udspring:** ossa cuneiformia og lig. plantare longum. **Insertion:** via begge sesamben på basis af phalanx proximalis I. **Funktion:** fleksion."},{"id":"ax12-t34","t":"ax12.lag","k":"text","q":"M. adductor hallucis: udspring, insertion, funktion?","a":"**Udspring:** caput obliquum fra senen fra m. peroneus longus; caput transversum fra lig. metatarsale transversum profundum (og ligg. plantaria). **Insertion:** via det laterale sesamben på basis af phalanx proximalis I. **Funktion:** adduktion, kontrol af storetåen under afsæt (sammen med m. abductor hallucis)."},{"id":"ax12-t35","t":"ax12.lag","k":"text","q":"M. flexor digiti minimi brevis: udspring, insertion, funktion?","a":"**Udspring:** basis på 5. metatarsalknogle. **Insertion:** lateralsiden af basis på lilletåens proksimale phalanx. **Funktion:** fleksion."},{"id":"ax12-t36","t":"ax12.lag","k":"text","q":"Hvad indeholder 4. lag, 'Sener og ligamenter'?","a":"Senerne fra m. tibialis posterior (insertion os naviculare og cuneiformia) og m. peroneus longus (insertion tuberositas ossis metatarsalis I), samt ligamenterne lig. plantare longum, lig. plantare breve og lig. calcaneonaviculare plantare.","img":"r_ax12_34-2"},{"id":"ax12-t37","t":"ax12.lag","k":"text","q":"Mm. interossei plantares: antal, udspring, insertion, funktion?","a":"3 stk. **Udspring:** ossa metatarsalia 3–5, medialt (semipennate). **Insertion:** basis phalanx proximalis 3–5, divergerende ift. fodens længdeakse. **Funktion:** adducerende (mod 2. tå).","img":"r_ax12_36-0"},{"id":"ax12-t38","t":"ax12.lag","k":"text","q":"Mm. interossei dorsales (fod): antal, udspring, insertion, funktion?","a":"4 stk. **Udspring:** ossa metatarsalia 1–5 (pennate). **Insertion:** basis phalanx proximalis 2–4, konvergerende ift. fodens længdeakse. **Funktion:** abducerende (væk fra 2. tå).\nSom på hånden: 'dorsale driver tæerne væk, plantare parkerer dem'.","img":"r_ax12_36-0"},{"id":"ax12-t39","t":"ax12.lag","k":"text","q":"Hvad er fodens længdeakse i forhold til interosseus-funktionen?","a":"Går gennem 2. tå — modsat hånden, hvor aksen går gennem 3. finger."},{"id":"ax12-t40","t":"ax12.lag","k":"text","q":"Hvilket ligament stabiliserer lig. plantare longum, og hvad løber under det?","a":"Tendo m. peronei/fibularis longi underløber lig. plantare longum. Lig. plantare breve ligger profundt for lig. plantare longum mellem calcaneus og os cuboideum."},{"id":"ax12-t41","t":"ax12.kn_","k":"text","q":"A. plantaris medialis: udspring og forløb?","a":"Fra a. tibialis posterior; den mindste endegren. Deler sig i **r. plantaris superficialis** (passerer henover 2. lag, forsyner mediale fodrand) og **r. plantaris profundus** (under 2. lag og under caput obliquum m. adductoris hallucis, ender i arcus plantaris).","img":"r_ax12_38-2"},{"id":"ax12-t42","t":"ax12.kn_","k":"text","q":"A. plantaris lateralis: udspring og forløb?","a":"Fra a. tibialis posterior; den største endegren. Løber under 1. lag medialt fra, videre mellem 1. og 2. lag langs m. abductor digiti minimi og over m. quadratus plantae, hvor den deler sig i r. plantaris superficialis (lille gren til laterale fodrand) og r. plantaris profundus (under 2.–3. lag, ender som arcus plantaris).","img":"r_ax12_38-2"},{"id":"ax12-t43","t":"ax12.kn_","k":"text","q":"Hvad afgiver arcus plantaris, og hvad ender heri?","a":"Afgiver aa. metatarsales plantares, som forløber distalt mellem metatarsalerne oven på mm. interossei plantares, og ved tæernes baser deler sig i aa. digitales plantares propriae (langs tæernes siderand, forsyner tilstødende rande af to tæer).","img":"r_ax12_39-1"},{"id":"ax12-t44","t":"ax12.kn_","k":"text","q":"N. plantaris lateralis: homolog, forløb og grene?","a":"Homolog med håndens n. ulnaris. Følger a. plantaris lateralis (under 1. lag, mellem 1. og 2. lag, over m. quadratus plantae) og deler sig i **r. superficialis** (kutan innervation af 1½ tå lateralt) og **r. profundus** (motoriske grene til resten: alle interossøse, mm. lumbricales II–IV, m. adductor hallucis og alle lilletåens muskler).","img":"r_ax12_40-5"},{"id":"ax12-t45","t":"ax12.kn_","k":"text","q":"N. plantaris medialis: homolog, forløb og innervation?","a":"Homolog med håndens n. medianus. Følger a. plantaris medialis mellem m. abductor hallucis og m. flexor hallucis brevis.\nAfgiver n. digitalis plantaris proprius (kutant til storetåen medialt) og nn. digitales plantares communes (kutant til II, III og halvdelen af IV medialt).\nInnerverer motorisk: m. abductor hallucis, m. flexor hallucis brevis, m. flexor digitorum brevis og m. lumbricalis I.","img":"r_ax12_40-5"},{"id":"ax12-t46","t":"ax12.kn_","k":"text","q":"Hvor deler n. tibialis sig i sine to endegrene?","a":"Bag den mediale malleol, under retinaculum flexorum, i n. plantaris medialis og n. plantaris lateralis."},{"id":"ax12-t47","t":"ax12.fl","k":"text","q":"Hvilke fire led hører til fodleddet samlet?","a":"**1. Art. talocruralis** ('øvre ankelled'). **2. Art. subtalaris** ('nedre ankelled'). **3. Artt. intertarseae.** **4. Artt. tarsometatarsales**."},{"id":"ax12-t48","t":"ax12.fl","k":"text","q":"Hvordan anskues øvre og nedre ankelled funktionelt, og hvilke bevægelser giver de?","a":"Kan tilsammen anskues som ét led med 2 frihedsgrader, da ingen sener hæfter på talus (alle underbenets muskler er derfor biartikulære med virkning på begge led).\n1) Plantar-/dorsifleksion 60–0–20°. 2) Inversion/eversion 35–0–15°. 3+4) små glidebevægelser."},{"id":"ax12-t49","t":"ax12.fl","k":"text","q":"Art. talocruralis: beliggenhed, klassifikation, ledhoved og ledskål?","a":"**Beliggenhed:** mellem talus, tibia og fibula. **Klassifikation:** ægte, sammensat hængselled.\n**Ledhoved:** trochlea tali (trisse med føringsfure, bredest fortil).\n**Ledskål:** 'gaffelformet' med tre ledflader — tibia: facies articularis inferior (med føringskam) og lateralflade af malleolus medialis; fibula: medialflade af malleolus lateralis.","img":"r_ax12_49-3"},{"id":"ax12-t50","t":"ax12.fl","k":"text","q":"Hvordan er ledkapslen i art. talocruralis, og hvad er konsekvensen?","a":"Tynd og slap fortil og bagtil, men stærk og stram på siderne. Fortil hæfter den ca. ¾ cm op ad tibia til collum tali; bagtil tæt ved bruskrandene. Konsekvens: ansamlinger i leddet viser sig på forsiden.","img":"r_ax12_48-0"},{"id":"ax12-t51","t":"ax12.fl","k":"text","q":"Hvilke ekstraartikulære strukturer stabiliserer art. talocruralis, og hvad kaldes de samlet?","a":"Membrana interossea og lig. tibiofibulare anterius, posterius et interosseus — samlet **syndesmosis tibiofibularis**. Ved dorsifleksion udspændes fodledsgaflen og syndesmosen over det brede stykke af trochlea tali, hvilket giver høj stabilitet.","img":"r_ax12_51-3"},{"id":"ax12-t52","t":"ax12.fl","k":"text","q":"Hvilke ligamenter danner lig. deltoideum, og hvilket ligament forstuves hyppigst?","a":"**Lig. deltoideum** (vifteformet fra malleolus medialis, 4 dele): pars tibionavicularis, pars tibiotalaris anterior, pars tibiotalaris posterior, pars tibiocalcanea.\nLateralt: lig. talofibulare anterius (hyppigst forstuvede ligament i kroppen, kun ca. 20 kg trækstyrke), lig. talofibulare posterius og lig. calcaneofibulare.","img":"r_ax12_52-0"},{"id":"ax12-t53","t":"ax12.fl","k":"text","q":"Hvordan opstår en typisk 'vriklet' ankel (forstuvning)?","a":"Ved et plantarfleksion-inversions-traume beskadiges lig. talofibulare anterius, som har lav trækstyrke (ca. 20 kg).","img":"r_ax12_51-3"},{"id":"ax12-t54","t":"ax12.fl","k":"text","q":"Art. subtalaris ('nedre ankelled'): beliggenhed og klassifikation?","a":"Leddene mellem talus, calcaneus og os naviculare. Ægte, kombineret drejeled med to adskilte ledhuler: art. talocalcanea (bagest) og art. talocalcaneonavicularis (forrest), adskilt af sinus tarsi.","img":"r_ax12_54-0"},{"id":"ax12-t55","t":"ax12.fl","k":"text","q":"Art. talocalcanea: beliggenhed, ledhoved og ledskål?","a":"Bagved sinus tarsi mellem calcaneus og talus. Ledhoved: facies articularis talaris posterior (på calcaneus). Ledskål: facies articularis calcanea posterior (på talus), plan-konkav, hovedretning fremad-nedad.","img":"r_ax12_54-0"},{"id":"ax12-t56","t":"ax12.fl","k":"text","q":"Art. talocalcaneonavicularis: beliggenhed, ledhoved og ledskål?","a":"Foran sinus tarsi, mellem talus, calcaneus og os naviculare. Ledhoved: caput tali + facies articularis calcanea anterior et media (konvekse). Ledskål: os naviculares konkave bagflade + facies articularis talaris media et anterior (overfladen af sustentaculum tali), samt lig. calcaneonaviculare plantare.","img":"r_ax12_55-1"},{"id":"ax12-t57","t":"ax12.fl","k":"text","q":"Hvilke ekstraartikulære strukturer har art. talocalcaneonavicularis?","a":"Lig. talocalcaneum interosseum (i sinus tarsi mellem talus og calcaneus) og lig. bifurcatum (Y-formet, fra calcaneus til cuboideum og naviculare)."},{"id":"ax12-t58","t":"ax12.fl","k":"text","q":"Hvad er akserne for art. talocruralis og art. subtalaris?","a":"**Talocruralis:** transversal akse gennem malleolspidserne.\n**Subtalaris:** skråt bagud-nedad-lateralt, fra medialt collum tali gennem sinus tarsi til lateralt calcaneus ud for lig. calcaneofibulares tilhæftning.","img":"r_ax12_58-3"},{"id":"ax12-t59","t":"ax12.fl","k":"text","q":"Artt. intertarseae: beliggenhed, klassifikation og hvad er 'Chopart's led'?","a":"Beliggenhed: de øvrige indbyrdes led mellem fodrodsknoglerne. Klassifikation: ægte, sammensatte glideled med stramme dorsale, plantare og interossøse ligamenter.\n**Art. tarsi transversa ('Chopart's led'):** tværgående forbindelse mellem talus + calcaneus (bagtil) og os naviculare + os cuboideum (fortil) — svarer til art. mediocarpalis på hånden. Hyppig ledlinje for delvis amputation af foden.","img":"r_ax12_59-2"},{"id":"ax12-t60","t":"ax12.fl","k":"text","q":"Artt. tarsometatarsales ('Lisfrancs led'): beliggenhed, klassifikation og bevægelighed?","a":"Mellem fodrodsknoglerne og metatarsalerne. Ægte, sammensatte glideled med stramme kapsler. Endnu en hyppig amputationslinje. Viser mest bevægelighed for 1., 4. og 5. tå, så metatarsalerne og foden kan formes efter ujævnt terræn.","img":"r_ax12_51-0"},{"id":"ax12-t61","t":"ax12.fl","k":"text","q":"Hvordan inddeles tæernes led, og hvad kaldes de forkortet?","a":"**Artt. metatarsophalangeales** (grundleddet, MTP), **artt. interphalangeales proximales pedis** (mellemled, PIP), **artt. interphalangeales distales pedis** (yderled, DIP) — svarer i form og struktur til fingrenes led, blot med 1. stråle (storetåen) inkluderet.","img":"r_ax12_62-2"},{"id":"ax12-t62","t":"ax12.fl","k":"text","q":"Hvad adskiller ligamentbenævnelserne i tæernes led fra fingrenes, og hvad er særligt ved lig. metatarsale transversum profundum?","a":"Ligamenterne omdøbes (fx ligg. palmaria → ligg. plantaria). Lig. metatarsale transversum profundum er komplet (i modsætning til hånden), da der også er forbindelse mellem 1. og 2. tå. Der findes sesamknogler omkring storetåens grundled.","img":"r_ax12_62-3"},{"id":"ax12-t63","t":"ax12.fl","k":"text","q":"Lig. plantare longum og lig. plantare breve: forløb?","a":"**Lig. plantare longum:** udspringer fortil på calcaneus, hæfter distalt på tuberositas ossis cuboidei og de foranliggende knogler; tendo m. peronei/fibularis longi går profundt for det.\n**Lig. plantare breve:** flere små ligamenter, ligger profundt for lig. plantare longum mellem calcaneus og os cuboideum.","img":"r_ax12_63-2"},{"id":"ax12-t64","t":"ax12.fb","k":"text","q":"Hvilke tre buer har foden, og hvad er deres samlede funktion?","a":"Indre længdebue (mediale), ydre længdebue (laterale) og tværbuen. De sikrer vægtoverføring fra kroppen til foden.","img":"r_ax12_64-1"},{"id":"ax12-t65","t":"ax12.fb","k":"text","q":"Hvordan er fodens vægtbæring muligt trods knoglernes lave vægt?","a":"Fodens knogler er arrangeret i en trekantskonstruktion, som fordeler kropsvægten ud i hele foden. Fodens knogler vejer kun ca. 100 g, men kan bære 4–5 gange hele kropsvægten. Aponeurosis plantaris er særligt vigtig for støddæmpningen.","img":"r_ax12_69-1"},{"id":"ax12-t66","t":"ax12.fb","k":"text","q":"Den indre længdebue (mediale): knogler og stabilisering?","a":"**Knogler:** calcaneus, talus, os naviculare, ossa cuneiformia, ossa metatarsalia I–III.\n**Egenskab:** dynamisk/eftergivelig (spændes op ved plantarfleksion af tæerne).\n**Stabiliseres af:** aponeurosis plantaris, m. flexor hallucis longus, m. tibialis posterior.","img":"r_ax12_64-8"},{"id":"ax12-t67","t":"ax12.fb","k":"text","q":"Den ydre længdebue (laterale): knogler og stabilisering?","a":"**Knogler:** calcaneus, os cuboideum, ossa metatarsalia IV og V.\n**Egenskab:** statisk/ikke eftergivelig.\n**Stabiliseres af:** lig. plantare longum et breve, m. peroneus longus.","img":"r_ax12_64-5"},{"id":"ax12-t68","t":"ax12.fb","k":"text","q":"Tværbuen: knogler og stabilisering?","a":"**Knogler:** ossa cuneiformia, basis af metatarsale II og III.\n**Stabiliseres af:** m. adductor hallucis, m. peroneus longus.","img":"r_ax12_64-8"},{"id":"ax12-t69","t":"ax12.fb","k":"text","q":"Hvordan fordeles vægten mellem den tibiale og fibulare fodrand?","a":"Den tibiale fodrand er løftet fra underlaget, mens den fibulare beholder kontakten og bliver vægtoverførende. Den tibiale rand er fri til at glide fremad under belastning, hvorved foden deformeres elastisk, og belastningerne dæmpes.","img":"r_ax12_70-2"},{"id":"ax12-t70","t":"ax12.fb","k":"text","q":"Hvad karakteriserer en energimæssigt hensigtsmæssig, stående stilling?","a":"Lodlinjen for kroppens tyngdepunkt falder foran knæleddet (som derved aflåses) og foran ankelleddets transversale akse, så m. soleus må udvikle tonus for at forhindre et fald forover. Jo længere fremme projektionen falder, jo større tonus kræves i m. soleus; en tonusnedsættelse kan indlede et skridt.","img":"r_ax12_71-2"},{"id":"ax12-o71","t":"ax12.fk","k":"occ","img":"cuneicub","boxes":[[12.96,1.26,56.058,3.088],[83.665,27.41,14.587,3.088],[1.748,43.163,9.644,3.403],[89.994,43.415,8.921,3.403],[49.247,49.086,29.415,3.529],[42.375,68.431,38.638,18.904],[1.748,88.532,9.644,3.403],[89.632,88.784,8.921,3.34],[49.247,95.463,34.418,3.592]],"target":0,"a":"Ossa cuneiformia mediale, intermedium et laterale","n":"'Kilebenene' medialt i fodroden; intermedium er nøglestenen i fodens tværbue."},{"id":"ax12-o72","t":"ax12.fk","k":"occ","img":"cuneicub","boxes":[[12.96,1.26,56.058,3.088],[83.665,27.41,14.587,3.088],[1.748,43.163,9.644,3.403],[89.994,43.415,8.921,3.403],[49.247,49.086,29.415,3.529],[42.375,68.431,38.638,18.904],[1.748,88.532,9.644,3.403],[89.632,88.784,8.921,3.34],[49.247,95.463,34.418,3.592]],"target":1,"a":"Os cuboideum","n":"'Terningebenet'; har sulcus peronealis på den plantare flade."},{"id":"ax13-t1","t":"ax13.pl","k":"text","q":"Hvor kommer underekstremitetens nerver fra, og hvilke rødder indgår?","a":"Fra plexus lumbosacralis, som består af rr. ventrales/anteriores T12–S4.","img":"r_ax13_5-1"},{"id":"ax13-t2","t":"ax13.pl","k":"text","q":"Hvilke to plexuser består plexus lumbosacralis af, og hvad forbinder dem?","a":"**Plexus lumbalis** (T12–L4) og **plexus sacralis** (L4–S4) (samt plexus coccygeus, S4–Co1, som ikke er pensum). De kædes sammen af **truncus lumbosacralis**, en stor gren, der afgår fra L4–L5.","img":"r_ax13_5-1"},{"id":"ax13-t3","t":"ax13.pl","k":"text","q":"Plexus lumbalis: hvilke rødder, og hvor er det lejret?","a":"Rami anteriores af T12, L1, L2, L3, L4 (og L5). Plekset er indlejret mellem m. psoas majors ventrale og dorsale udspring.","img":"r_ax13_7-2"},{"id":"ax13-t4","t":"ax13.pl","k":"text","q":"Hvilke to muskler innerveres direkte fra plexus lumbalis, og hvilke seks nerver afgives?","a":"**Direkte innervation:** m. quadratus lumborum og m. psoas major.\n**Nerver:** n. iliohypogastricus (T12–L1), n. ilioinguinalis (L1), n. genitofemoralis (L1–L2), n. cutaneus femoris lateralis (L2–L3), n. femoralis (L2–L4), n. obturatorius (L2–L4). Truncus lumbosacralis (L4–L5) afgives til plexus sacralis.","img":"r_ax13_8-1"},{"id":"ax13-t5","t":"ax13.pl","k":"text","q":"Plexus sacralis: hvilke rødder, og hvordan er det placeret?","a":"Rami anteriores via foramina sacralia anteriora fra L4, L5, S1, S2, S3, S4 (S5 og Co danner plexus coccygeus).\nEn flad, tyk, trekantet nerveplade lejret hen over m. piriformis, dækket af dennes fascie. Modtager truncus lumbosacralis fra L4–L5 hen over linea terminalis.","img":"r_ax13_7-2"},{"id":"ax13-t6","t":"ax13.pl","k":"text","q":"Hvordan stråler plexus sacralis, og hvilke seks nerver afgiver det?","a":"Med trekantens apex distalt-lateralt mod foramen infrapiriforme og suprapiriforme.\nNerver: n. gluteus superior (L4–S1), n. gluteus inferior (L5–S2), n. cutaneus femoris posterior (S1–S3), n. pudendus (S2–S4), n. ischiadicus (L4–S3, med n. tibialis og n. peroneus communis).","img":"r_ax13_7-2"},{"id":"ax13-t7","t":"ax13.pl","k":"text","q":"Hvad innerverer plexus sacralis samlet?","a":"Hoftens udadrotatorer, sædemusklerne, lårets fleksorer, alle muskler distalt for knæet, samt lår, underben og fod sensorisk.","img":"r_ax13_5-1"},{"id":"ax13-t8","t":"ax13.lu","k":"text","q":"N. iliohypogastricus: segment, forløb og innervation?","a":"**Segment:** T12–L1. **Forløb:** bag m. psoas major, hen over m. quadratus lumborum, perforerer m. transversus abdominis ved crista iliaca, derefter m. obliquus internus (ved SIAS).\n**R. cutaneus lateralis:** perforerer superficielle muskler, innerverer huden lateralt over sædemusklerne. **R. cutaneus anterior:** perforerer m. obliquus externus over annulus inguinalis superficialis, innerverer hypogastriet.\n**Sensorisk:** øverste laterale del af ballen og hypogastriet. **Motorisk:** de tre abdominalmuskler (nederste/laterale del).","img":"r_ax13_9-0"},{"id":"ax13-t9","t":"ax13.lu","k":"text","q":"N. ilioinguinalis: segment, forløb og innervation?","a":"**Segment:** L1. Følger n. iliohypogastricus kaudalt (pas på forveksling). Perforerer m. transversus abdominis og m. obliquus internus, løber gennem loftet i canalis inguinalis, og ender som rr. scrotales/labiales anteriores gennem annulus inguinalis superficialis.\n**Motorisk:** m. transversus abdominis + m. obliquus internus. **Kutant:** øverste inderlår, genitalia externa.","img":"r_ax13_11-5"},{"id":"ax13-t10","t":"ax13.lu","k":"text","q":"N. genitofemoralis: segment, forløb og grene?","a":"**Segment:** L1–L2. Perforerer m. psoas major (SPOT — den eneste nerve, der løber på forfladen af psoas major) og descenderer på forsiden, hvor den deler sig i:\n**R. genitalis:** gennem annulus inguinalis profundus, via inguinalkanalen, innerverer m. cremaster og scrotum/labium majus.\n**R. femoralis:** gennem lacuna vasorum, lateralt for a. femoralis, innerverer proksimale trigonum femorale kutant.","img":"r_ax13_12-4"},{"id":"ax13-t11","t":"ax13.lu","k":"text","q":"N. cutaneus femoris lateralis: segment, forløb og innervation?","a":"**Segment:** L2–L3. Bag m. psoas major, hen over m. iliacus mod SIAS, perforerer lig. inguinale medialt for SIAS, perforerer fascia lata med en forreste og bageste gren.\n**Kutant:** lateralsiden af låret.","img":"r_ax13_17-5"},{"id":"ax13-t12","t":"ax13.lu","k":"text","q":"N. femoralis: segment, forløb og deling?","a":"**Segment:** L2–L4. Bag m. psoas major, i furen mellem m. psoas major og m. iliacus, under lig. inguinale i lacuna musculorum. Deler sig i trigonum femorale som 'en vifte eller blomsterbuket' i motoriske og sensoriske grene (rr. cutanei femoris anteriores, og n. saphenus).","img":"r_ax13_19-4"},{"id":"ax13-t13","t":"ax13.lu","k":"text","q":"N. femoralis: hvad innerverer den motorisk og sensorisk?","a":"**Motorisk:** lårets ekstensorloge (m. quadriceps femoris), m. iliacus, m. pectineus, m. sartorius.\n**Kutant:** lårets forside (rr. cutanei femoris anteriores) og underbenets medialside (via n. saphenus).","img":"r_ax13_19-4"},{"id":"ax13-t14","t":"ax13.lu","k":"text","q":"N. obturatorius: segment, forløb og deling?","a":"**Segment:** L2–L4. Den eneste nerve placeret medialt for m. psoas major. Krydser linea terminalis ned i det lille bækken, træder ud gennem canalis obturatorius, og deler sig ved overkanten af m. adductor brevis i **r. anterior** (bag m. pectineus og m. adductor longus, foran m. adductor brevis) og **r. posterior** (perforerer og innerverer m. obturatorius externus, mellem m. adductor brevis og magnus).","img":"r_ax13_23-4"},{"id":"ax13-t15","t":"ax13.lu","k":"text","q":"N. obturatorius: motorisk og kutan innervation?","a":"**R. anterior:** motorisk til mm. adductores longus et brevis, gracilis, pectineus (somme tider); kutan gren til lårets mediale side.\n**R. posterior:** motorisk til m. obturatorius externus og del af m. adductor magnus.","img":"r_ax13_23-6"},{"id":"ax13-t16","t":"ax13.tf","k":"text","q":"Hvordan er trigonum femorale afgrænset (rep)?","a":"Kranielt lig. inguinale, lateralt-kaudalt m. sartorius, medialt m. adductor longus, profundt mm. iliacus, pectineus et adductor longus, superficielt fascia lata.","img":"r_ax13_14-2"},{"id":"ax13-t17","t":"ax13.tf","k":"text","q":"Hvordan deles trigonum femorale, og hvad fortsætter det som?","a":"Deles proksimalt af arcus iliopectineus i lacuna musculorum (lateralt: m. iliopsoas, n. femoralis) og lacuna vasorum (medialt: vasa femoralis, r. femoralis n. genitofemoralis). Fortsætter distalt som canalis adductorius (fra trigonums apex til hiatus adductorius), med v. femoralis, a. femoralis og n. saphenus (perforerer).","img":"r_ax13_14-2"},{"id":"ax13-t18","t":"ax13.tf","k":"text","q":"N. saphenus: forløb og innervation?","a":"'Fortsættelsen' af n. femoralis. Krydser fra lateralt til medialt hen over vasa femoralia i trigonum femorale, følger dem i canalis adductorius, forlader kanalen ved at perforere membrana vastoadductoria (SPOT), løber mellem senerne til m. sartorius og m. gracilis, følger v. saphena magna og løber foran malleolus medialis for at innervere fodens medialkant.\n**Kutant:** mediale del af underbenet (rr. cutanei cruris mediales) og forreste knæledsregion (r. infrapatellaris).","img":"r_ax13_14-2"},{"id":"ax13-t19","t":"ax13.sa","k":"text","q":"Hvad passerer gennem foramen suprapiriforme?","a":"N. gluteus superior og a. glutea superior.","img":"r_ax13_30-0"},{"id":"ax13-t20","t":"ax13.sa","k":"text","q":"Hvad passerer gennem foramen infrapiriforme, og hvad er huskereglen?","a":"Lateralt til medialt: n. ischiadicus, n. cutaneus femoris posterior, n. gluteus inferior, a. glutea inferior, a. pudenda interna, n. pudendus.\nHuskeregel: **'Iskold Clitoris Gør Glans Penis Panisk'**.","img":"r_ax13_30-0"},{"id":"ax13-t21","t":"ax13.sa","k":"text","q":"N. gluteus superior: segment, forløb og innervation?","a":"**Segment:** L4–S1. Via foramen suprapiriforme, mellem m. gluteus medius (2. lag) og m. gluteus minimus (3. lag), for at ende i og innervere m. tensor fasciae latae. Ledsages af a. glutea superior.\n**Motorisk:** m. gluteus medius et minimus, m. tensor fasciae latae.","img":"r_ax13_31-2"},{"id":"ax13-t22","t":"ax13.sa","k":"text","q":"N. gluteus inferior: segment, forløb og innervation?","a":"**Segment:** L5–S2. Via foramen infrapiriforme, dorsalt forløb til m. gluteus maximus, i følgeskab med a. glutea inferior.\n**Motorisk:** m. gluteus maximus.","img":"r_ax13_32-1"},{"id":"ax13-t23","t":"ax13.sa","k":"text","q":"N. cutaneus femoris posterior: segment, forløb og grene?","a":"**Segment:** S1–S3. Via foramen infrapiriforme, descenderer under m. gluteus maximus, superficielt for hasemusklerne, perforerer fascia lata på bagsiden af låret.\n**Nn. clunium inferiores:** recurrente grene under m. gluteus maximus til huden nederst i sæderegionen.\n**Rr. perineales:** bueformet fremad til perineum.\n**Kutant:** bagsiden af låret og sæderegionen.","img":"r_ax13_33-0"},{"id":"ax13-t24","t":"ax13.sa","k":"text","q":"N. pudendus: segment, forløb og huskeregel?","a":"**Segment:** S2–S4. Via foramen infrapiriforme, krog med lig. sacrospinale, via foramen ischiadicum minus ('canalis pudendalis'), til fossa ischioanalis.\n**Huskeregel:** 'S2, S3, S4, keeps the shit off the floor'.","img":"r_ax13_36-2"},{"id":"ax13-t25","t":"ax13.sa","k":"text","q":"N. pudendus: endegrene og innervation?","a":"Rr. musculares, nn. rectales inferiores (m. sphincter ani externus), nn. perineales, n. dorsalis penis/clitoridis.\n**Motorisk:** bækkengulv og sphinctere. **Kutant:** perineum og genitalia externa.","img":"r_ax13_36-3"},{"id":"ax13-t26","t":"ax13.is","k":"text","q":"N. ischiadicus: segment, forløb og deling?","a":"**Segment:** L4–S3. Via foramen infrapiriforme, hviler på m. quadratus femoris, krydser profundt for hasemusklernes udspring fra tuber ischiadicum. Ved øverste spids af fossa poplitea deles den i **n. tibialis** (anterior fleksorkomponent, homolog n. medianus/ulnaris) og **n. peroneus communis** (posterior ekstensorkomponent, homolog n. radialis).","img":"r_ax13_38-2"},{"id":"ax13-t27","t":"ax13.is","k":"text","q":"N. ischiadicus: samlet innervation?","a":"**Motorisk:** lårets fleksorloge, m. adductor magnus, samtlige muskler på underben og fod.\n**Kutant:** størstedelen af underben og fod (minus n. saphenus' område).","img":"r_ax13_38-2"},{"id":"ax13-t28","t":"ax13.is","k":"text","q":"N. tibialis: forløb gennem fossa poplitea og crus?","a":"Gennem fossa poplitea superficielt for vasa poplitea, mellem m. gastrocnemius' to hoveder, profundt for m. soleus' senebue, mellem de profunde og superficielle fleksorer (samme placering som a. tibialis posterior), hvilende på m. tibialis posterior, medialt for Achillessenen, gennem 3. kulisse i fleksorretinaklet.","img":"r_ax13_39-4"},{"id":"ax13-t29","t":"ax13.is","k":"text","q":"N. tibialis: grene og innervation?","a":"Afgiver rr. calcanei mediales og n. cutaneus surae medialis, og ender som nn. plantares medialis et lateralis.\n**Motorisk:** lårets fleksorloge, m. adductor magnus, underbenets fleksorloge, planta pedis.\n**Kutant:** medial bagside af underbenet, planta (homolog med n. medianus og n. ulnaris).","img":"r_ax13_39-6"},{"id":"ax13-t30","t":"ax13.is","k":"text","q":"N. cutaneus surae medialis og n. suralis: forløb?","a":"**N. cutaneus surae medialis** (fra n. tibialis): afgives i fossa poplitea, følges proksimalt med v. saphena parva, forenes distalt med n. cutaneus surae lateralis (fra n. peroneus communis) via en r. communicans til at danne **n. suralis**.\nN. suralis afgiver rr. calcanei laterales (laterale hælregion) og n. cutaneus dorsalis lateralis pedis (laterale fodrand til lilletåens laterale rand).","img":"r_ax13_42-1"},{"id":"ax13-t31","t":"ax13.is","k":"text","q":"N. peroneus communis: forløb og deling?","a":"Lateralt i fossa poplitea langs tendo m. bicipitis femoris, snor sig om collum fibulae, træder ind i peroneerlogen og deler sig i **n. peroneus profundus** og **n. peroneus superficialis**. Afgiver desuden n. cutaneus surae lateralis i fossa poplitea.","img":"r_ax13_44-3"},{"id":"ax13-t32","t":"ax13.is","k":"text","q":"N. peroneus communis: samlet innervation?","a":"**Motorisk:** ekstensorlogen (via n. peroneus profundus), peroneerlogen (via n. peroneus superficialis).\n**Kutant:** lateral og forside af underbenet.","img":"r_ax13_44-3"},{"id":"ax13-t33","t":"ax13.is","k":"text","q":"N. peroneus superficialis: forløb og innervationsområde?","a":"Descenderer i peroneerlogen, profundt for m. peroneus longus, innerverer begge mm. peronei. Perforerer fascien distalt på crus, stråler medialt hen over fodryggen og deler sig i n. cutaneus medialis dorsalis pedis (mediale rand af storetåen samt mellemrummet 2.–3. tå) og n. cutaneus intermedius dorsalis pedis (mellemrummene 3.–4. og 4.–5. tå).","img":"r_ax13_45-5"},{"id":"ax13-t34","t":"ax13.is","k":"text","q":"N. peroneus profundus: forløb og innervationsområde?","a":"Perforerer septum intermusculare til ekstensorlogen, descenderer med a. tibialis anterior, innerverer gruppen motorisk, passerer 3. kulisse under ekstensorretinaklet, innerverer m. extensor digitorum brevis motorisk.\n**Kutant:** tårandene mellem 1. og 2. tå.","img":"r_ax13_45-8"},{"id":"ax13-t35","t":"ax13.is","k":"text","q":"Hvilke muskler innerverer n. plantaris medialis og lateralis?","a":"**N. plantaris medialis:** m. abductor hallucis, m. flexor hallucis brevis, m. flexor digitorum brevis, m. lumbricalis I.\n**N. plantaris lateralis:** resten af fodens muskler (alle interossøse, mm. lumbricales II–IV, m. adductor hallucis, alle lilletåens muskler).","img":"r_ax13_40-5"},{"id":"ax13-t36","t":"ax13.kl","k":"text","q":"Hvad er en pudendusblokade?","a":"Bedøvelse af n. pudendus (fx via lig. sacrospinale) til smertelindring under fødsel."},{"id":"ax13-t37","t":"ax13.kl","k":"text","q":"Hvad er Lasègues test (strakt benløfts test), og hvad viser den?","a":"Patienten ligger ned med strakt knæ, og lægen løfter benet. Positiv, hvis smerter stråler distalt for knæet, før benet er eleveret over 60°. Positiv ved affektion af L5 og S1 nerverod (discusprolaps); sensitivitet ca. 80 %, specificitet ca. 40 %.","img":"r_ax13_49-2"},{"id":"ax13-t38","t":"ax13.kl","k":"text","q":"Hvilke discusniveauer rammes hyppigst af prolaps, og hvorfor er det klinisk relevant?","a":"L4 og L5 er hyppigst udsatte for discusprolaps, og dermatomerne svarende til L5 og S1 er derfor vigtigst at kunne, da det er dem, prolaps hyppigst rammer."},{"id":"ax13-t39","t":"ax13.kl","k":"text","q":"Hvad er ischias?","a":"Smerter svarende til lænd, sæde og udstråling på bagsiden af låret (og evt. videre) — opstår ofte ved at discusprolaps rammer n. ischiadicus, men kan også opstå uden prolaps ved andet tryk på nerven."},{"id":"ax13-t40","t":"ax13.kl","k":"text","q":"Hvad er dropfod, og hvad kan forårsage det?","a":"Manglende evne til at løfte forfoden (dorsiflektere), enten pga. diskusprolaps over L5/S1 eller skade på n. peroneus (fibularis) communis.","img":"r_ax13_53-1"},{"id":"ax13-t41","t":"ax13.kl","k":"text","q":"Hvilke muskler bruges til at teste den segmentære funktion for L2–S2?","a":"**L2–L3:** m. quadriceps femoris. **L4:** m. tibialis anterior. **L5:** m. extensor hallucis longus. **S1:** mm. peronei. **S1–S2:** m. triceps surae."},{"id":"ax13-t42","t":"ax13.ka","k":"text","q":"Hvordan hedder underekstremitetens hovedarterie fra lysken til tåpulpa?","a":"Aorta abdominalis → a. iliaca communis → a. iliaca externa → a. femoralis → a. poplitea → a. tibialis anterior, a. peronea, a. tibialis posterior → a. dorsalis pedis, aa. plantares medialis et lateralis.","img":"r_ax13_54-2"},{"id":"ax13-t43","t":"ax13.ka","k":"text","q":"A. femoralis: start og forløb?","a":"Starter ved lig. inguinale (lacuna vasorum), løber gennem trigonum femorale og canalis adductorius til hiatus adductorius.","img":"r_ax13_55-2"},{"id":"ax13-t44","t":"ax13.ka","k":"text","q":"Hvilke superficielle grene afgiver a. femoralis?","a":"A. epigastrica superficialis (opad mod umbilicus, forsyner m. obliquus externus abdominis), a. circumflexa ilium superficialis (parallelt med lig. inguinale) og aa. pudendae externae (medialt som rami scrotales/labiales anteriores).","img":"r_ax13_55-2"},{"id":"ax13-t45","t":"ax13.ka","k":"text","q":"A. profunda femoris: udspring og forløb?","a":"Afgives posterolateralt af a. femoralis, løber bagud-lateralt-nedad på forfladen af mm. iliopsoas et pectineus, mellem mm. adductores longus et brevis, på m. adductor magnus, og ender som den sidste a. perforans.","img":"r_ax13_56-0"},{"id":"ax13-t46","t":"ax13.ka","k":"text","q":"Hvilke grene afgiver a. profunda femoris?","a":"**Aa. perforantes** (gennem de hullede insertioner af m. adductor magnus, forsyner hasemusklerne), **a. circumflexa femoris lateralis** (lateralt på m. iliopsoas, under m. rectus femoris) og **a. circumflexa femoris medialis** (mellem mm. iliopsoas et pectineus).","img":"r_ax13_56-0"},{"id":"ax13-t47","t":"ax13.ka","k":"text","q":"A. poplitea: forløb og hvad afgiver den?","a":"Begynder ved hiatus adductorius, løber distalt og lidt lateralt i fossa poplitea, mellem m. gastrocnemius' to hoveder til underkanten af m. popliteus og under arcus tendineus m. solei.\nAfgiver grene til rete articulare genus (bl.a. a. media genus til korsbåndene). Ledsages af v. poplitea (dorsolateralt) og n. tibialis.","img":"r_ax13_57-2"},{"id":"ax13-t48","t":"ax13.ka","k":"text","q":"Hvilke tre grene deler a. poplitea sig i?","a":"A. tibialis anterior, a. tibialis posterior og a. peronea (= a. fibularis) — én til hver muskelloge."},{"id":"ax13-t49","t":"ax13.ka","k":"text","q":"A. tibialis anterior: forløb og endegren?","a":"Den mindste gren af a. poplitea. Passerer over membrana interossea mellem m. tibialis posteriors V-formede udspringssnipper, løber i ekstensorlogen mellem m. tibialis anterior og m. extensor digitorum longus, afgiver grene til rete malleolare, passerer under ekstensorretinaklet i 3. kulisse, og fortsætter som **a. dorsalis pedis**.","img":"r_ax13_58-2"},{"id":"ax13-t50","t":"ax13.ka","k":"text","q":"A. dorsalis pedis: endegrene?","a":"Ender som a. metatarsea dorsalis I og en r. plantaris profundus til arcus plantaris (mellem hovederne af m. interosseus dorsalis I). Afgiver desuden a. arcuata, som afgiver de resterende aa. metatarseae dorsales.","img":"r_ax13_58-2"},{"id":"ax13-t51","t":"ax13.ka","k":"text","q":"A. tibialis posterior: forløb og deling?","a":"Den største endegren af a. poplitea. Ligger i en opsplitning af det profunde blad af fascia cruris, på m. tibialis posterior, i furen mellem m. flexor digitorum longus og m. flexor hallucis longus, dækket af m. triceps surae. Svinger medialt for Achillessenen og om malleolus medialis, passerer fleksorretinaklets 3. kulisse, og deler sig profundt for m. abductor hallucis i a. plantaris medialis og a. plantaris lateralis.","img":"r_ax13_59-2"},{"id":"ax13-t52","t":"ax13.ka","k":"text","q":"A. peronea (fibularis): udspring og forløb?","a":"Afgives proksimalt fra a. tibialis posterior. Løber tæt op ad fibula, dækket af m. flexor hallucis longus, til malleolus lateralis og lateralt på calcaneus. Forsyner peroneerlogen og huden med perforerende grene."},{"id":"ax13-t53","t":"ax13.ka","k":"text","q":"Aa. plantares medialis et lateralis og deres anastomoser?","a":"**A. plantaris medialis:** deler sig i r. superficialis (mediale fodrand) og r. profundus (forbinder til arcus plantaris).\n**A. plantaris lateralis:** løber mellem 1. og 2. lag, svinger mellem 3. og 4. lag som arcus plantaris; afgiver aa. metatarsales plantares (→ aa. digitales plantares propriae) og rami perforantes til dorsum pedis.","img":"r_ax13_60-2"},{"id":"ax13-t54","t":"ax13.ve","k":"text","q":"Hvordan er underekstremitetens vener opdelt?","a":"**Profunde vener:** forløber dobbelt (eller flere) som vv. comitantes og navngives som arterierne; proksimalt for fossa poplitea findes en enkel vene med samme navn som arterien.\n**Superficielle vener:** v. saphena magna og v. saphena parva, med karakteristiske forløb, kommunikerer med de dybe via vv. perforantes.","img":"r_ax13_61-2"},{"id":"ax13-t55","t":"ax13.ve","k":"text","q":"Hvordan drænerer fodens venenet?","a":"Rete venosum plantare pedis (tætmasket) drænerer langs fodrande og plicae natatoriae til dorsum pedis. Rete venosum dorsale pedis (grovmasket) dræneres af v. saphena magna og v. saphena parva. Profundt findes vv. tibiales posteriores, der følger a. tibialis posterior.","img":"r_ax13_62-1"},{"id":"ax13-t56","t":"ax13.ve","k":"text","q":"V. saphena magna: forløb og udmunding?","a":"Starter ved den mediale fodrand, løber foran malleolus medialis, ascenderer langs margo medialis tibiae, bag condyli mediales tibiae et femoris, obliquinalt ventralt-lateralt til forsiden af femur, og tømmer sig i v. femoralis via hiatus saphenus i fascia lata.\nModtager v. epigastrica superficialis, v. circumflexa ilium superficialis og vv. pudendae externae (= stella venosa).","img":"r_ax13_63-1"},{"id":"ax13-t57","t":"ax13.ve","k":"text","q":"Hvad er v. arcuata cruris posterior og v. saphena accessoria?","a":"**V. arcuata cruris posterior** ('arkadevenen'): drænerer den mediale malleol.\n**V. saphena accessoria:** anterolateral anastomose på låret.","img":"r_ax13_63-2"},{"id":"ax13-t58","t":"ax13.ve","k":"text","q":"V. saphena parva: forløb og udmunding?","a":"Begynder langs den laterale fodrand, løber bag malleolus lateralis, mellem m. gastrocnemius' to hoveder, perforerer fascia cruris i fossa poplitea og munder i v. poplitea.","img":"r_ax13_64-1"},{"id":"ax13-t59","t":"ax13.ve","k":"text","q":"V. poplitea og v. femoralis: dannelse og beliggenhed?","a":"**V. poplitea:** dannes af vv. tibiales (anterior og posterior); ligger dorsolateralt for a. poplitea.\n**V. femoralis:** forløber som arterien; ligger medialt i trigonum femorale.","img":"r_ax13_64-1"},{"id":"ax13-t60","t":"ax13.ve","k":"text","q":"Hvordan inddeles benets lymfedrænage?","a":"**Superficielle lymfekar:** det mediale sæt følger v. saphena magna og ender i lnn. inguinales superficiales (inferiore gruppe); det laterale sæt følger v. saphena parva og ender i lnn. popliteales.\n**Profunde lymfekar:** følger arterierne og deres ledsagevener; lnn. popliteales → lnn. inguinales profundi.","img":"r_ax13_65-2"},{"id":"ax13-t61","t":"ax13.ve","k":"text","q":"Hvordan er lyskens overfladiske lymfeknuder (nodi lymphatici inguinales superficiales) inddelt?","a":"Ligger i trigonum femorale. **Superiort sæt** langs lig. inguinale: et lateralt sæt (lateral kropsvæg, lateralt lår, glutealregion) og et medialt sæt (abdomen, genitalia, regio analis, lår, glutealregion). **Inferiort sæt:** langs v. saphena magna.","img":"r_ax13_66-2"},{"id":"ax13-t62","t":"ax13.ve","k":"text","q":"Hvad modtager nodi lymphatici inguinales profundi?","a":"De ligger medialt for v. femoralis og modtager de dybe lymfekar fra underekstremiteten.","img":"r_ax13_66-3"},{"id":"ax13-o63","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":0,"a":"T11","n":"Dermatom T11, øverst på låret."},{"id":"ax13-o64","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":1,"a":"T12","n":"Dermatom T12."},{"id":"ax13-o65","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":2,"a":"L1","n":"Dermatom L1."},{"id":"ax13-o66","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":3,"a":"S2","n":"Dermatom S2 (bagsiden/øverst medialt, afviger fra den fortløbende lumbale rækkefølge)."},{"id":"ax13-o67","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":4,"a":"L2","n":"Dermatom L2."},{"id":"ax13-o68","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":5,"a":"L3","n":"Dermatom L3."},{"id":"ax13-o69","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":6,"a":"L4","n":"Dermatom L4."},{"id":"ax13-o70","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.4
