58,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":7,"a":"L5","n":"Dermatom L5 — sammen med S1 det vigtigste at kunne, da det er her discusprolaps hyppigst rammer."},{"id":"ax13-o71","t":"ax13.kl","k":"occ","img":"dermatom","boxes":[[15.217,4.754,9.684,2.494],[15.217,9.214,10.408,2.435],[19.433,13.674,5.468,2.465],[18.841,18.633,6.785,2.494],[19.433,23.944,6.192,2.435],[19.433,31.133,6.192,2.494],[19.433,61.062,6.456,2.494],[19.433,80.458,6.258,2.465],[18.841,88.175,6.061,2.494],[0.0,90.434,12.648,2.171]],"target":8,"a":"S1","n":"Dermatom S1 — sammen med L5 det vigtigste at kunne, da det er her discusprolaps hyppigst rammer."},{"id":"ax14-t1","t":"ax14.cv","k":"text","q":"Hvad er columna vertebralis, og hvilke funktioner har den?","a":"En bevægelig søjle fra hoved til hale, en del af det axiale skelet, forbundet til ekstremiteterne via skulderbæltet og bækkenringen.\n**Funktion:** beskytter rygmarven, giver strukturel støtte for hoved, skulderbælte, thorax og ekstremiteter, og knoglemarven i hvirvellegemerne indgår i det hæmatopoetiske (bloddannende) væv.","img":"r_ax14_6-2"},{"id":"ax14-t2","t":"ax14.cv","k":"text","q":"Hvor mange hvirvler har columna vertebralis, og hvordan fordeler de sig?","a":"7 vertebrae cervicales, 12 thoracicae, 5 lumbales, 5 sacrales (→ os sacrum), 3–5 coccygeae (→ os coccygis). 23 stk. i de præsacrale.","img":"r_ax14_7-2"},{"id":"ax14-t3","t":"ax14.cv","k":"text","q":"Hvilke fire dele (partes) inddeles columna i?","a":"Pars cervicalis, pars thoracica, pars lumbalis og pars pelvina.","img":"r_ax14_7-9"},{"id":"ax14-t4","t":"ax14.cv","k":"text","q":"Hvordan er columnas krumninger i frontal- og sagittalplanet?","a":"**Frontalplanet:** lige og symmetrisk (klinik: skoliose — skævvridning sideværts, typisk unge kvinder).\n**Sagittalplanet:** S-formet med halslordose, brystkyfose, lændelordose og bækkenkyfose (samt promontoriet).","img":"r_ax14_8-2"},{"id":"ax14-t5","t":"ax14.cv","k":"text","q":"Hvad skyldes brystkyfosen og lændelordosen anatomisk?","a":"Brystkyfosen skyldes kileformede vertebrae. Lændelordosen skyldes kileformede disci. Konsekvensen er, at lordoserne er mere bevægelige og manipulérbare end kyfoserne.","img":"r_ax14_8-7"},{"id":"ax14-t6","t":"ax14.cv","k":"text","q":"Hvilke elementer består en typisk vertebra af?","a":"**Corpus vertebrae** (kort cylinder, med ambitus eminens som øverste/nederste rand), **arcus vertebrae** med pediculus ('lille fod') og lamina ('firkantet plade'), samt processus articularis superior/inferior (ledtap), processus transversus (tværtap) og processus spinosus (torntap).","img":"r_ax14_11-1"},{"id":"ax14-t7","t":"ax14.cv","k":"text","q":"Hvad er foramen vertebrale, og hvad danner det?","a":"Hullet afgrænset af corpus og arcus vertebrae. Foramina vertebralia danner tilsammen canalis vertebralis."},{"id":"ax14-t8","t":"ax14.cv","k":"text","q":"Hvordan adskiller cervikale, thorakale og lumbale corpora sig?","a":"**Cervikalt:** rektangulær med uncus corporis. **Thorakalt:** hjerteformet, med fovea costalis superior/inferior. **Lumbalt:** nyreformet.","img":"r_ax14_11-2"},{"id":"ax14-t9","t":"ax14.cv","k":"text","q":"Hvordan adskiller processus articularis (ledtap) sig mellem cervikal, thorakal og lumbal?","a":"**Cervikalt:** mellem frontal- og transversalplan, cylinderform med skråt afskårne endeflader; superior bagud+opad, inferior fremad+nedad.\n**Thorakalt:** frontalplanet; superior bagud+lateralt, inferior fremad+medialt.\n**Lumbalt:** sagittalplanet; superior medialt/opad/bagud, inferior (L5) frontalt stillet.","img":"r_ax14_11-3"},{"id":"ax14-t10","t":"ax14.cv","k":"text","q":"Hvordan adskiller processus transversus sig mellem cervikal, thorakal og lumbal?","a":"**Cervikalt:** korte, lateralt-fremad, med tuberculum anterius et posterius, foramen transversarium, sulcus n. spinalis og ribbensrudimenter.\n**Thorakalt:** lateralt-bagud, 'kølleformet' støtte til ribbenene.\n**Lumbalt:** lateralt, med ribbensrudimenter ('proc. costalis').","img":"r_ax14_16-6"},{"id":"ax14-t11","t":"ax14.cv","k":"text","q":"Hvordan adskiller processus spinosus og foramen vertebrale sig mellem cervikal, thorakal og lumbal?","a":"**Proc. spinosus:** cervikalt nedad-bagud og bifid; thorakalt nedadhældende (taglagt) og tresidet prismatisk; lumbalt tykke, sammenklemte, bagud.\n**Foramen vertebrale:** cervikalt stort og trekantet; thorakalt mindre og rundt; lumbalt lidt større og trekantet.","img":"r_ax14_16-7"},{"id":"ax14-t12","t":"ax14.cv","k":"text","q":"Hvad er foramen intervertebrale, og hvad begrænser det?","a":"Passage for kar og nerver til og fra canalis vertebralis.\n**Fortil:** discus intervertebralis + corpus vertebrae (nederste del). **Bagtil:** art. zygapophysialis (facetled) + lig. flavums lateralkant. **Opad/nedadtil:** pediculus."},{"id":"ax14-t13","t":"ax14.cv","k":"text","q":"Os sacrum: hvordan er den dannet, og hvilke strukturer har den?","a":"Pyramideformet knogle dannet ved fusion af 5 ryghvirvler. Ala ossis sacri, canalis sacralis (fortsættelse af canalis vertebralis), hiatus sacralis, foramina sacralia anteriora et posteriora, crista sacralis mediana (svarer til proc. spinosi) og lateralis (svarer til proc. transversus), samt facies auricularis (SI-led).","img":"r_ax14_18-2"},{"id":"ax14-t14","t":"ax14.cv","k":"text","q":"Os coccygis: hvordan er den dannet?","a":"Dannet af fusion af som regel 4 rudimentære (indskrumpede) hvirvler.","img":"r_ax14_19-4"},{"id":"ax14-t15","t":"ax14.ao","k":"text","q":"Hvordan adskiller atlas (C1) og axis (C2) sig fra de andre cervikale vertebrae, og hvad er atlas' funktion?","a":"De adskiller sig strukturelt fra de øvrige halshvirvler. Atlas bærer hovedet, forbinder det med det axiale skelet, og danner en ledkombination med 3 frihedsgrader (fleksion-ekstension, lateralfleksion-lateralekstension, rotation). Atlas mangler et corpus; i stedet rager axis' dens (tap) op i atlas og danner led med denne.","img":"r_ax14_20-2"},{"id":"ax14-t16","t":"ax14.ao","k":"text","q":"Atlas (C1, ringhvirvel): hvilke strukturer har den?","a":"Intet corpus. **Arcus anterior** med tuberculum anterius (ledfacet på bagfladen, artikulerer med dens axis). **Arcus posterior** med tuberculum posterius (rudimentær torntap). **Massa lateralis**: massiv knoglestruktur, hvorover hovedets vægt overføres til columna; bærer facies articularis superior (mod os occipitale), facies articularis inferior (mod axis) og sulcus a. vertebralis."},{"id":"ax14-t17","t":"ax14.ao","k":"text","q":"Axis (C2, taphvirvel): hvilke strukturer har den?","a":"**Dens axis** ('tand'): corpus skyder sig op fra sin øverste flade, med facies articularis anterior (mod atlas) og posterior (mod lig. transversum atlantis). Desuden facies articularis superior, processus transversus (underudviklet) med foramen transversarium, og processus spinosus (veludviklet og bifid).","img":"r_ax14_23-1"},{"id":"ax14-t18","t":"ax14.ao","k":"text","q":"Os occipitale: hvordan er den inddelt, og hvilke strukturer har den?","a":"Inddeles i pars basilaris, pars lateralis og squama occipitalis.\nStrukturer: foramen magnum (indeholder medulla oblongata), condyli occipitales (artikulerer med atlas), crista occipitalis externa → protuberantia occipitalis externa, samt lineae nuchales superior et inferior.","img":"r_ax14_27-2"},{"id":"ax14-t19","t":"ax14.cl","k":"text","q":"Hvilke tre led findes mellem hvirvellegemerne og hvirvelbuerne, og hvilke to findes i nakken?","a":"**Mellem corpus vertebrae:** discus intervertebralis (symfyse, sekundær synchondrose).\n**Mellem hvirvelbuerne (via proc. articularis):** art. zygapophysialis (facetled) og syndesmoser.\n**Nakkens led:** art. atlantooccipitalis ('øvre nakkeled') og art. atlantoaxialis ('nedre nakkeled').","img":"r_ax14_28-2"},{"id":"ax14-t20","t":"ax14.cl","k":"text","q":"Discus intervertebralis: klassifikation og opbygning?","a":"Uægte led, symfyse (sekundær synkondrose).\n**Anulus fibrosus:** ca. 50 koncentriske lameller af fibrøst væv (skiftevis venstre-/højresnoet).\n**Nucleus pulposus:** blød gelatinøs masse (osmotisk tryk udvider anulus fibrosus).\n**Hyalin endeplade:** binder discus til corpora af vertebrae og sørger for ernæring.","img":"r_ax14_29-0"},{"id":"ax14-t21","t":"ax14.cl","k":"text","q":"Hvor er anulus fibrosus og nucleus pulposus vaskulariserede?","a":"Begge er avaskulære; anulus fibrosus er kun forsynet med nerver og kar i periferien.","img":"r_ax14_29-5"},{"id":"ax14-t22","t":"ax14.cl","k":"text","q":"Lig. longitudinale anterius og posterius: forløb?","a":"**Lig. longitudinale anterius:** fra tuberculum anterius atlantis til os sacrum, på forsiden af corpus — A-formet.\n**Lig. longitudinale posterius:** fra os occipitale/foramen magnum til os coccygis, på bagsiden af corpus inde i canalis vertebralis — omvendt A-formet. Den øverste del (axis→os occipitale) kaldes membrana tectoria.","img":"r_ax14_29-7"},{"id":"ax14-t23","t":"ax14.cl","k":"text","q":"Art. zygapophysialis (facetled): beliggenhed og klassifikation?","a":"Mellem processus articularis på to tilstødende vertebrae. Ægte, kombinerede glideled.","img":"r_ax14_32-3"},{"id":"ax14-t24","t":"ax14.cl","k":"text","q":"Hvordan er art. zygapophysialis forskellig cervikalt, thorakalt og lumbalt?","a":"**Cervikalt:** stor afstand mellem ledtappene, øvre ledflade vendt opad-bagud; størst bevægelighed; lateralfleksion tvinger samtidig rotation til samme side.\n**Thorakalt:** lille afstand, frontalt stillede, stramme ligamenter (øvre ledflade bagud); begrænser al bevægelse — det mest stabile afsnit.\n**Lumbalt:** sagittalt stillede, øvre ledflade vendt medialt; en vis bevægelighed ved normalstilling/fleksion; ved ekstension låses leddet (rotationslåsning).","img":"r_ax14_32-0"},{"id":"ax14-t25","t":"ax14.cl","k":"text","q":"Hvilke akser bevæger art. zygapophysialis omkring, og hvilke afsnit bidrager mest til columnas bevægelighed?","a":"Lateralfleksion (sagittale akser), fleksion-ekstension (transverselle akser), rotation (vertikal akse). Columna cervicalis og columna lumbalis bidrager mest til columnas samlede bevægelighed.","img":"r_ax14_33-0"},{"id":"ax14-t26","t":"ax14.cl","k":"text","q":"Hvilke fire syndesmoser findes i columna, og hvor sidder de?","a":"**Lig. flavum:** mellem tilstødende lamina arcus vertebrae (elastin), afflader og lukker canalis vertebralis bagtil.\n**Lig. intertransversaria:** mellem tilstødende proc. transversi.\n**Lig. interspinalia:** mellem randene af proc. spinosi.\n**Lig. supraspinalia:** stærke, smalle bånd mellem spidserne af proc. spinosi; fortsætter i nakken som lig. nuchae.","img":"r_ax14_34-1"},{"id":"ax14-t27","t":"ax14.cl","k":"text","q":"Lig. nuchae: forløb og funktion?","a":"Fladt trekantet bånd fra vertebra prominens (C7) til protuberantia occipitalis externa (via crista occipitalis externa), med binding til tuberculum posterius atlantis undervejs. Nakkens erstatning for lig. supraspinale; fungerer som septum for nakkemuskulaturen.","img":"r_ax14_34-8"},{"id":"ax14-t28","t":"ax14.cl","k":"text","q":"Art. atlantooccipitalis ('øvre nakkeled'): beliggenhed, klassifikation og bevægelser?","a":"Mellem condyli occipitales og facies articulares superiores atlantis. Ægte, kombineret ellipsoidled.\nNikkebevægelser om en transversal akse (i niveau med ydre øregang); side-/vuggebevægelser om en sagittal akse.\nForstærkes af membrana atlantooccipitalis anterior og posterior (a. vertebralis og n. suboccipitalis perforerer den posteriore).","img":"r_ax14_37-2"},{"id":"ax14-t29","t":"ax14.cl","k":"text","q":"Art. atlantoaxialis ('nedre nakkeled'): klassifikation og inddeling?","a":"Ægte, kombineret tapled og glideled. Inddeles i et **mediant tapled** (mellem atlas og dens axis) og **to laterale glideled** (mellem atlas' nedre ledfacetter og axis' overside).","img":"r_ax14_38-6"},{"id":"ax14-t30","t":"ax14.cl","k":"text","q":"Art. atlantoaxialis (tapleddet): beliggenhed, klassifikation, ligamenter og bevægelse?","a":"Mellem dens axis og fovea dentis. Ægte, enkelt drejeled — kun rotationsbevægelse.\n**Lig. transversum atlantis** (+ strøg op og ned): bag dens axis, forhindrer bagudglidning. **Lig. cruciforme atlantis:** krydsformet forstærkning. **Lig. alaria:** fra tappens sideflader til condyli occipitales, begrænser rotationen. **Lig. apicis dentis:** fra tappens spids til forkanten af foramen magnum.","img":"r_ax14_39-0"},{"id":"ax14-t31","t":"ax14.cl","k":"text","q":"Unco-vertebralleddet: hvor findes det, og hvad er dets klinik?","a":"Selvstændigt led, kun ved de cervikale vertebrae; begrænser sideforskydning mellem halshvirvlerne.\nKlinik: uncus danner den forreste begrænsning af foramen intervertebrale, så slidgigt her kan indsnævre rummet og trykke på plexus brachialis.","img":"r_ax14_41-1"},{"id":"ax14-t32","t":"ax14.cl","k":"text","q":"Hvilke akser bevæger nakkeleddene omkring (fleksion-ekstension, lateralfleksion, rotation)?","a":"**Fleksion-ekstension (nikken):** transversel akse gennem ydre øregang.\n**Lateralfleksion (vuggen):** sagittal akse gennem glabella.\n**Rotation (rysten):** vertikal akse gennem dens axis.","img":"r_ax14_42-3"},{"id":"ax14-t33","t":"ax14.cl","k":"text","q":"Hvor ligger nakkeleddets tyngdepunkt hos voksne og hos spædbørn, og hvad er konsekvensen?","a":"Hos voksne ligger det foran det øvre nakkeleds transverselle akse, så hovedet falder forover i søvn i siddende stilling. Hos spædbørn ligger det bagved (pga. ufuldstændigt udviklet ansigtsskelet), så hovedet har tendens til at falde bagover.","img":"r_ax14_43-3"},{"id":"ax14-t34","t":"ax14.cv","k":"text","q":"Hvordan forsynes hvirvelsøjlen arterielt, og hvilke arterier bidrager segmentært?","a":"Segmentære grene fra de store arterier langs rygsøjlen, til antero-laterale flader af vertebrae og gennem foramina intervertebralia til canalis vertebralis (knoglevæv, rygmarv, hinder). Arteriegrenene anastomoserer i et longitudinelt netværk.\nSegmentært fra: a. vertebralis, aa. cervicales ascendens et profunda, aa. intercostales posteriores, aa. lumbales.","img":"r_ax14_44-2"},{"id":"ax14-t35","t":"ax14.cv","k":"text","q":"Hvilke arterier forsyner medulla spinalis longitudinelt?","a":"A. spinalis anterior og aa. spinales posteriores, som udgår fra a. vertebralis.","img":"r_ax14_45-5"},{"id":"ax14-t36","t":"ax14.cv","k":"text","q":"Hvordan er hvirvelsøjlens venøse drænage opbygget?","a":"Plexer i hele rygsøjlens længde: **plexus venosus externus** (rygsøjlens udvendige flader) og **plexus venosus internus** (epiduralrummet i canalis vertebralis). Modtager vv. basivertebrales fra corpus vertebrae og vv. spinales fra rygmarven.","img":"r_ax14_47-2"},{"id":"ax14-t37","t":"ax14.cv","k":"text","q":"Hvilke nerver forsyner hvirvelsøjlen selv?","a":"Ramus meningeus fra spinalnerverne, som afgår i foramen intervertebrale og løber tilbage til canalis vertebralis for at forsyne dura, ligamenter, periost og kar.","img":"r_ax14_48-2"},{"id":"ax14-t38","t":"ax14.sn","k":"text","q":"Hvordan dannes en spinalnerve, og hvor mange segmenter er der?","a":"En ventral rod (motorisk) og en dorsal rod (sensorisk, med spinalganglion) fra ét spinalsegment løber sammen i foramen intervertebrale. 31 segmenter: 8 cervicale, 12 thoracale, 5 lumbale, 5 sacrale, 1 coccygealt.","img":"r_ax14_50-1"},{"id":"ax14-t39","t":"ax14.sn","k":"text","q":"Hvordan deler spinalnerven sig, og hvad forsyner grenene?","a":"**Ramus dorsalis:** til de dybe ryg- og nakkemuskler og huden over ryg og nakke.\n**Ramus ventralis:** indgår i ekstremitetsplekserne, ellers som nn. intercostales.","img":"r_ax14_52-2"},{"id":"ax14-t40","t":"ax14.sn","k":"text","q":"Hvordan deler ramus dorsalis sig yderligere, og hvad er reglen for kutan innervation?","a":"I ramus medialis og ramus lateralis. Over T7 er den mediale gren kutan; under T7 er den laterale gren kutan."},{"id":"ax14-t41","t":"ax14.sn","k":"text","q":"Hvilke plexus dannes af ramus ventralis fra de forskellige segmenter?","a":"C1–C5 → plexus cervicalis. C5–T1 → plexus brachialis. T2–L1 afgiver hver en (stor) r. cutaneus lateralis og en (lille) r. cutaneus anterior. T12–S4 → plexus lumbosacralis. S5–Co1 → plexus coccygeus."},{"id":"ax14-t42","t":"ax14.sn","k":"text","q":"Hvordan er spinalnerverne forbundet til truncus sympathicus?","a":"Spinalnerve T1–L2 afgiver ramus communicans albus til truncus sympathicus (og synapser her). ALLE spinalnerver modtager omvendt en ramus communicans griseus fra truncus sympathicus, som går videre gennem spinalnerven (kan også ascendere/descendere i truncus sympathicus).","img":"r_ax14_53-0"},{"id":"ax14-t43","t":"ax14.sn","k":"text","q":"Hvordan forløber nn. intercostales 1–6?","a":"Udelukkende i interkostalrummet i sulcus costalis. Afgiver r. cutaneus lateralis og ender som r. cutaneus anterior. 2. og 3. interkostalnerve anastomoserer desuden lateralt til innervation af armhulen (nn. intercostobrachiales)."},{"id":"ax14-t44","t":"ax14.sn","k":"text","q":"Hvordan forløber nn. intercostales 7–11, og hvad innerverer T10?","a":"De løber frem i interkostalrummene til ribbenskurvaturen og fortsætter herefter i bugmuskulaturen, som de innerverer sammen med huden over den. T10 innerverer området omkring navlen (umbilicus)."},{"id":"ax14-t45","t":"ax14.sn","k":"text","q":"N. subcostalis: forløb?","a":"Løber som nn. intercostales, men under 12. ribben, og forløber herefter i bugmuskulaturen."},{"id":"ax14-t46","t":"ax14.sn","k":"text","q":"N. suboccipitalis (C1): funktion og innervation?","a":"Rent motorisk. Innerverer m. semispinalis capitis og de suboccipitale muskler.","img":"r_ax14_57-0"},{"id":"ax14-t47","t":"ax14.sn","k":"text","q":"N. occipitalis major (C2) og n. occipitalis tertius (C3): funktion?","a":"**N. occipitalis major:** innerverer rygmusklerne segmentært; stor sensorisk del, innerverer det meste af baghovedet.\n**N. occipitalis tertius:** som major, men mindre; innerverer et mindre område nederst på baghovedet/øverst i nakken."},{"id":"ax14-t48","t":"ax14.sn","k":"text","q":"Hvordan er rami posteriores' kutane innervation fordelt fra C4 til S-niveau?","a":"C4–C8: helt almindelige dorsale grene (C7–C8 rent muskulære; C4–C6 innerverer også hud, dog kun den mediale gren pga. scapula). T1–T7: kutane grene fra rami mediales. T8–T12: kutane grene fra rami laterales. L1–L3: de laterale er kutane (nn. clunium superiores). L4–L5: rent motoriske. S1–S3: de laterale er kutane (nn. clunium medii).","img":"r_ax14_57-0"},{"id":"ax14-t49","t":"ax14.ca","k":"text","q":"Hvordan er canalis vertebralis afgrænset, og hvor strækker den sig?","a":"Afgrænses af vertebrae (corpus og discus fortil, arcus bagtil og til siderne). Strækker sig fra foramen magnum til hiatus sacralis. Alle foramina vertebralia danner tilsammen kanalen; til siderne er der forbindelse via foramina intervertebralia.","img":"r_ax14_63-0"},{"id":"ax14-t50","t":"ax14.ca","k":"text","q":"Hvad indeholder canalis vertebralis, udefra og ind?","a":"Ligg. flava + lig. longitudinale posterius → spatium epidurale (fedt + plexus venosus vertebralis internus) → 3 hjernehinder (dura, arachnoidea, pia mater) → subarachnoidalrummet (cerebrospinalvæske) → medulla spinalis.","img":"r_ax14_64-2"},{"id":"ax14-t51","t":"ax14.ca","k":"text","q":"Hvor ender medulla spinalis, og hvad hedder strukturerne herfra?","a":"Medulla ender i L1–L2-niveau som conus medullaris, hvorfra L2–S5 + Co fortsætter som cauda equina."},{"id":"ax14-t52","t":"ax14.ca","k":"text","q":"Hvor er discusprolaps hyppigst, og hvad er førstevalg i behandlingen?","a":"Hyppigst i lumbalregionen (discus L4 og L5). Førstevalg er konservativ behandling (genoptræning og smertestillende).","img":"r_ax14_31-3"},{"id":"ax14-t53","t":"ax14.ca","k":"text","q":"Hvorfor foretages lumbalpunktur typisk over eller under L4?","a":"Fordi man her er sikker på, at medulla spinalis er sluttet, og der kun er cauda equina tilbage. Nervefibrene i cauda equina rykkes til side af nålen i stedet for at blive beskadiget."},{"id":"ax14-t54","t":"ax14.ca","k":"text","q":"Hvad er cauda equina syndrom, og hvordan skal det behandles?","a":"Afklemning af de lumbosacrale nervefilamenter (fx ved rygtraume), som giver urinretention, slap analtonus og neurologiske udfald i 'ridebuksområdet'. Skal opereres akut (inden 24 timer), da der ellers ses irreversibel skade."},{"id":"ax14-t55","t":"ax14.ca","k":"text","q":"Hvad kendetegner discusprolaps klinisk?","a":"Skyldes en svaghed i anulus fibrosus (oftest bagtil), hvor nucleus pulposus trænger igennem og kan trykke på nerveroden. Intens smerte i lænderyggen, der forplanter sig ned i balde, lår og evt. foden, ofte med brændende fornemmelse/følelsesløshed. Forværres ved hoste og brug af bugpressen. Lammelser ses kun sjældent.","img":"r_ax14_31-3"},{"id":"ax14-t56","t":"ax14.rm","k":"text","q":"Hvordan inddeles ryg- og nakkemusklerne overordnet?","a":"**Overfladiske rygmuskler** (innervationsmæssigt og funktionelt hørende til overekstremiteten): m. trapezius, m. latissimus dorsi, mm. rhomboidei, m. levator scapulae, mm. serrati posteriores.\n**Dybe rygmuskler:** m. erector spinae, mm. transversospinales, mm. interspinales, mm. intertransversarii, mm. suboccipitales, m. splenius.","img":"r_ax14_67-4"},{"id":"ax14-t57","t":"ax14.rm","k":"text","q":"Hvordan innerveres de dybe rygmuskler, og hvad er deres afgrænsning?","a":"Segmentært via rami dorsales nn. spinalium.\n**Afgrænsning:** kranielt basis cranii, kaudalt crista iliacae og os coccygis, lateralt kanten af m. trapezius og midtaxillærlinjen."},{"id":"ax14-t58","t":"ax14.rm","k":"text","q":"Hvilke fire kontraktionsmønstre har de dybe rygmuskler ved forskellige bevægelser?","a":"Rotation; excentrisk kontralateral kontraktion ved lateralfleksion; excentrisk kontraktion ved fleksion; koncentrisk kontraktion ved ekstension."},{"id":"ax14-t59","t":"ax14.rm","k":"text","q":"Hvad er fascia thoracolumbalis, og hvordan er den opbygget?","a":"Fælles fascie for de dybe rygmuskler (bruges også af andre muskler til udspring). Består af et ventralt og et dorsalt blad, mellem hvilke de dybe rygmuskler ligger.","img":"r_ax14_68-1"},{"id":"ax14-t60","t":"ax14.rm","k":"text","q":"Fascia thoracolumbalis: forløb af det ventrale og det dorsale blad?","a":"**Ventrale blad:** fra crista iliaca til costa 12; medialt til proc. transversi, lateralt til det dorsale blad.\n**Dorsale blad:** fra crista iliaca til fascia nuchae; medialt til proc. spinosi og crista sacralis mediana, lateralt til det ventrale blad (nedadtil) og anguli costarum (opadtil)."},{"id":"ax14-t61","t":"ax14.rm","k":"text","q":"Mm. serrati posteriores: udspring, insertion og funktion?","a":"**M. serratus posterior superior:** udspring proc. spinosi C7–T2/3; insertion anguli costarum II–V; accessorisk inspirationsmuskel.\n**M. serratus posterior inferior:** udspring proc. spinosi T10–L2/3; insertion anguli costarum VIII–XII; accessorisk ekspirationsmuskel.","img":"r_ax14_71-2"},{"id":"ax14-t62","t":"ax14.rm","k":"text","q":"M. erector spinae: fælles udspring og funktion?","a":"**Udspring:** fascia thoracolumbalis, os sacrum, proc. spinosi af de nederste lændehvirvler og crista iliaca.\n**Funktion:** holder kroppen oprejst, ekstension af ryggen."},{"id":"ax14-t63","t":"ax14.rm","k":"text","q":"M. erector spinae: hvilke tre dele består den af, fra medialt til lateralt?","a":"**M. spinalis** (medialt): insererer på proc. spinosi.\n**M. longissimus** (mellemst): thoracis til proc. transversi/costae, cervicis til proc. transversi, capitis til bagkanten af proc. mastoideus.\n**M. iliocostalis** (mest lateralt): lumborum og thoracis til anguli costarum, cervicis til proc. transversi.","img":"r_ax14_73-0"},{"id":"ax14-t64","t":"ax14.rm","k":"text","q":"Mm. transversospinales: hvor ligger de, og hvordan inddeles de?","a":"Profundt for m. erector spinae. Spænder mellem en proc. transversus og en ovenliggende proc. spinosus.\nInddeles efter antal hvirvler, der springes over: **mm. rotatores** (mest profunde, 0–1 hvirvel), **mm. multifidi** (mellemste lag, 2–3 hvirvler), **m. semispinalis** (mest superficielt, 4+ hvirvler)."},{"id":"ax14-t65","t":"ax14.rm","k":"text","q":"Hvor udspringer mm. multifidi, og hvor er de kraftigst udviklet?","a":"Fra os sacrum, fascia thoracolumbalis og proc. transversi, til proc. spinosi. Kraftigst i lænden."},{"id":"ax14-t66","t":"ax14.rm","k":"text","q":"M. semispinalis capitis: hvor hæfter den, og hvor ligger den i forhold til de andre nakkemuskler?","a":"Hæfter mellem lineae nuchales superior et inferior, medialt for m. splenius capitis, profundt for m. trapezius, men superficielt for de suboccipitale muskler."},{"id":"ax14-t67","t":"ax14.rm","k":"text","q":"Mm. interspinales og mm. intertransversarii: beliggenhed?","a":"**Mm. interspinales:** mellem proc. spinosi. **Mm. intertransversarii:** mellem proc. transversi."},{"id":"ax14-t68","t":"ax14.rm","k":"text","q":"Hvilke fire mm. suboccipitales findes, og hvad er deres udspring/insertion?","a":"**M. rectus capitis posterior major:** proc. spinosus C2 → under linea nuchalis inferior.\n**M. rectus capitis posterior minor:** tuberculum posterius atlantis → medialt for major.\n**M. obliquus capitis superior:** proc. transversus atlantis → lateralt for major.\n**M. obliquus capitis inferior:** proc. spinosus C2 → proc. transversus atlantis.","img":"r_ax14_78-0"},{"id":"ax14-t69","t":"ax14.rm","k":"text","q":"Hvad er trigonum suboccipitale, og hvad ligger heri?","a":"Afgrænset af m. rectus capitis posterior major og de to mm. obliqui capitis; superficielt m. semispinalis capitis, profundt membrana atlantooccipitalis posterior og arcus posterior atlantis. Indeholder a. vertebralis og n. suboccipitalis.","img":"r_ax14_79-4"},{"id":"ax14-t70","t":"ax14.rm","k":"text","q":"M. splenius: udspring, insertion og spotteteknik?","a":"Flad, overfladisk muskel lige profundt for m. trapezius.\n**Udspring:** nederste halvdel af lig. nuchae og proc. spinosi C7–T6.\n**Insertion:** m. splenius cervicis til proc. transversi C1–C3; m. splenius capitis til proc. mastoideus og laterale del af linea nuchae superior.\n**Spot:** ligger lateralt for m. semispinalis capitis.","img":"r_ax14_80-3"},{"id":"ax14-t71","t":"ax14.rm","k":"text","q":"Hvilke muskler er vigtigst for hhv. cervikal- og lændelordosen, og hvad gør mm. suboccipitales?","a":"M. semispinalis er kraftig i halsregionen og udfylder cervikallordosen. M. multifidus er kraftig i lænderegionen og udfylder lændelordosen. Mm. suboccipitales har stort indhold af muskeltene og registrerer hovedets stilling og bevægelser. Mm. rotatores har mekanoreceptorisk funktion + let rotation."},{"id":"ax14-t72","t":"ax14.rm","k":"text","q":"Hvilke muskler flekterer columna i stående hhv. rygliggende stilling?","a":"**Stående:** m. erector spinae (excentrisk kontraktion) + de dorsale ligamenter.\n**Rygliggende:** m. rectus abdominis og m. psoas major som fleksorer, mens m. iliacus og m. rectus femoris fikserer bækkenet.\nFleksion + rotation samtidig (fx højre albue mod venstre knæ): mm. obliqui abdominis."},{"id":"ax14-t73","t":"ax14.rm","k":"text","q":"Hvilke muskler ekstenderer og lateralflekterer columna?","a":"**Ekstension (bugliggende):** m. erector spinae (koncentrisk).\n**Lateralfleksion (stående):** ensidig excentrisk kontraktion af de mest stejlt forløbende mm. obliqui abdominis + dyb rygmuskulatur + m. quadratus lumborum, alle i modsatte side."},{"id":"ax14-t74","t":"ax14.rm","k":"text","q":"Hvordan forsynes ryggen kar- og nervemæssigt?","a":"**Arterier:** aa. intercostales posteriores et lumbales (segmentære grene fra aorta). **Vener:** vv. intercostales posteriores et lumbales, med kommunikation til plexus vertebralis externus.\n**Nerver:** ramus dorsalis, som deles i ramus medialis (mellem rygmuskulaturens to mediale søjler) og ramus lateralis (mellem de to laterale søjler).","img":"r_ax14_85-0"},{"id":"ax14-t75","t":"ax14.rm","k":"text","q":"Hvordan er ryggens lymfedrænage inddelt?","a":"**Øverste, laterale kvadrant:** subscapular gruppe i axillen. **Nederste, laterale kvadrant:** øvre, laterale superficielle gruppe i lysken."},{"id":"ax14-t76","t":"ax14.th","k":"text","q":"Hvad er thoraxskelettets funktion og opbygning?","a":"**Funktion:** beskytter vitale organer, danner nødvendigt tryk ved respiration.\n**Opbygning:** pars thoracis af columna vertebralis, sternum og costae.","img":"r_ax14_88-4"},{"id":"ax14-t77","t":"ax14.th","k":"text","q":"Sternum: hvilke tre dele har den, og hvad kendetegner hver?","a":"Kaldes 'dolken'. **Manubrium sterni** ('håndtag'): incisura clavicularis, incisura jugularis, incisura costalis 1. **Corpus sterni:** incisurae costales. **Processus xiphoideus.**\nAngulus sterni (primær synchondrose) forbinder manubrium og corpus.","img":"r_ax14_91-4"},{"id":"ax14-t78","t":"ax14.th","k":"text","q":"Costae: hvor mange par er der, og hvordan hæfter de til sternum?","a":"12 par. 1.–7. par er hæftet direkte til sternum. 8.–10. par er hæftet til det ovenliggende ribben. 11.–12. par ender frit.","img":"r_ax14_92-3"},{"id":"ax14-t79","t":"ax14.th","k":"text","q":"Hvilke strukturer har en costa, fra caput til corpus?","a":"**Caput costae** med facies articularis capitis costae (artikulerer med to vertebrae og mellemliggende discus). **Collum costae.** **Tuberculum costae** (ledfacet mod proc. transversus). **Corpus costae** med sulcus costae og angulus costae."},{"id":"ax14-t80","t":"ax14.th","k":"text","q":"Ribbensleddene (art. costovertebrales og art. costotransversaria): klassifikation og ledflader?","a":"Ægte, kombinerede drejeled. Mellem caput costae og fovea costales superior/inferior på vertebrae, og mellem tuberculum costae og fovea costalis på proc. transversus. Forstærket af et intraartikulært ligament til discus intervertebralis, lig. costotransversarium og lig. costotransversarium superius.","img":"r_ax14_94-1"},{"id":"ax14-t81","t":"ax14.th","k":"text","q":"Hvilke led findes mellem sternum og costae og mellem costae indbyrdes?","a":"Artt. sternocostales og artt. interchondrales — ægte led."},{"id":"ax14-t82","t":"ax14.th","k":"text","q":"Costa 1: hvad er specielt ved den?","a":"Skjult under clavicula, bred i forhold til længden. Danner den nedre begrænsning af skalenerporten, med tuberculum m. scaleni anterior og sulcus a. subclaviae.","img":"r_ax14_95-4"},{"id":"ax14-t83","t":"ax14.th","k":"text","q":"Hvordan er ribbensmusklerne organiseret i tre lag?","a":"**1. lag, mm. intercostales externi:** skråt nedad-fremad ('yderlommerne i en frakke'); begynder bagtil ved tuberculum costae, slutter fortil i membrana intercostalis externa.\n**2. lag, mm. intercostales interni:** skråt nedad-bagud ('inderlommerne'); når frem til sternum, slutter bagtil i membrana intercostalis interna.\n**3. lag, mm. intercostales intimi:** samme fiberretning som interni; fra indre læbe af sulcus costae til overkanten af underliggende ribben.","img":"r_ax14_96-2"},{"id":"ax14-t84","t":"ax14.th","k":"text","q":"Hvad er det neurovaskulære plan i ribbensmellemrummet?","a":"Planet mellem mm. intercostales interni og intimi (sulcus costae), hvor de interkostale nerver og kar (VAN) forløber."},{"id":"ax14-t85","t":"ax14.th","k":"text","q":"M. transversus thoracis: beliggenhed, udspring, insertion?","a":"Variabel muskel på indersiden af den forreste brystvæg nedadtil.\n**Udspring:** bagerste flade af sternum. **Insertion:** costa 2–6 på grænsen mellem brusk og knogle.\nVasa thoracica interna løber i mellemrummet mellem musklen og ribbensbruskene.","img":"r_ax14_97-0"},{"id":"ax14-t86","t":"ax14.th","k":"text","q":"Mm. subcostales og mm. levatores costarum: beliggenhed og forløb?","a":"**Mm. subcostales:** dorsalt og profundt, springer et costa over før insertion (svarer til en m. intercostalis intimus).\n**Mm. levatores costarum:** profundt for den dybe rygmuskulatur, fra proc. transversi til costae (svarer til en m. intercostalis externus)."},{"id":"ax14-t87","t":"ax14.th","k":"text","q":"Hvad sker der ved inspiration og ekspiration i thorax?","a":"**Inspiration:** ribbene hæves, sternum bevæges fremad og opad. **Ekspiration:** ribbene sænkes, sternum bevæges tilbage.\nThorakal respiration: især costae I–IV løftes. Abdominal respiration: diaphragma.","img":"r_ax14_101-2"},{"id":"ax14-t88","t":"ax14.th","k":"text","q":"N. intercostalis: udspring og grene?","a":"Fra r. ventralis, nn. spinales T1–T12. Afgiver ramus cutaneus lateralis og ramus cutaneus anterior.","img":"r_ax14_102-0"},{"id":"ax14-t89","t":"ax14.th","k":"text","q":"Hvad er specielt ved T1–T3 blandt de interkostale nerver?","a":"**T1:** ascenderende gren til plexus brachialis, descenderende gren som normal n. intercostalis.\n**T2 + T3:** særligt store, innerverer også et kutant område i axillen (nn. intercostobrachiales)."},{"id":"ax14-t90","t":"ax14.th","k":"text","q":"Hvilke rr. cutanei fra intercostalnerverne kaldes mammarii, og hvordan forløber nn. intercostales 7–11 og 12?","a":"T2–T4: rr. cutanei anteriores = rr. mammarii mediales. T4–T6: rr. cutanei laterales = rr. mammarii laterales.\nT7–T11: begynder i interkostalrummene, ender i og innerverer bugvæggen (T10 innerverer umbilicus-området).\nT12 (n. subcostalis): kort forløb i sulcus costae, løber under lig. arcuatum laterale til m. quadratus lumborum (adskilles fra n. iliohypogastricus)."},{"id":"ax14-t91","t":"ax14.th","k":"text","q":"Aa. intercostales posteriores: afgang og grene?","a":"Segmentært fra aorta thoracica (de to øverste fra a. intercostalis suprema, en gren af a. subclavia).\n**R. dorsalis:** forsyner rygmuskulaturen. **R. spinalis:** forsyner rygmarv og hinder.","img":"r_ax14_104-2"},{"id":"ax14-t92","t":"ax14.th","k":"text","q":"A. thoracica interna: afgang, forløb og grene?","a":"**Afgang:** a. subclavia. **Forløb:** descenderer langs forvæggen indenfor thorax, foran m. transversus thoracis, ved lateralkanten af sternum.\n**Grene:** aa. intercostales anteriores (til 5 øverste ribben), a. pericardiacophrenica og a. musculophrenica (til diaphragma/pericardiet). **Ender som:** a. epigastrica superior.","img":"r_ax14_104-11"},{"id":"ax14-t93","t":"ax14.th","k":"text","q":"Hvordan drænerer vv. intercostales posteriores og v. thoracica interna?","a":"Vv. intercostales posteriores tømmer sig i v. azygos-systemet. V. thoracica interna tømmer sig i v. brachiocephalica."},{"id":"ax14-t94","t":"ax14.ma","k":"text","q":"Hvad er mamma anatomisk, og hvordan er den hos manden?","a":"Bilateralt kirtelorgan i subcutis forrest på thorax (costa 3–6). Hos manden: lille kirtel med lille papilla mammaria; klinisk relevant ved gynækomasti.","img":"r_ax14_106-3"},{"id":"ax14-t95","t":"ax14.ma","k":"text","q":"Hvad er mammas funktion hos kvinden?","a":"Stor kirtel fra pubertet til klimakteriet. Producerer modermælk efter graviditet."},{"id":"ax14-t96","t":"ax14.ma","k":"text","q":"Hvordan er mamma opbygget?","a":"Corpus mammae ('brystet'), papilla mammae (brystvorte, inkl. glatmuskulatur), areola mammae (pigmenteret område), gll. areolares (Montgomery's kirtler), sulcus intermammarius (mellem mammae) og inframammarius (fure under), samt processus axillaris (strækker sig op i axillen).","img":"r_ax14_106-3"},{"id":"ax14-t97","t":"ax14.ma","k":"text","q":"Hvilke muskler ligger mamma an mod?","a":"M. pectoralis major (+ muskelfascie), m. serratus anterior og m. obliquus externus abdominis.","img":"r_ax14_106-3"},{"id":"ax14-t98","t":"ax14.ma","k":"text","q":"Hvorfor er mammae frit forskydelige, og hvad er processus axillaris?","a":"Corpus mammae afgrænses fra m. pectoralis major af en bundfascie og løst bindevæv. Retinacula cutis trænger som septae gennem kirtlen og forbindes med bundfascien.\nProcessus axillaris gennembryder fascia axillaris og strækker sig et variabelt stykke op i fossa axillaris.","img":"r_ax14_107-4"},{"id":"ax14-t99","t":"ax14.ma","k":"text","q":"Hvordan er glandula mammaria (mælkekirtlen) opbygget?","a":"Kirtellegemet er indlejret i fedt- og bindevæv (mængden varierer med graviditet/laktation), konisk formet med apex ud for papilla mammae. Indeholder 15–20 lobi radiært fordelt, hvis lobuli udmunder i en fælles ductus lactiferus, som ud for papillen udvides i en sinus lactiferus (mælkereservoir).","img":"r_ax14_107-4"},{"id":"ax14-t100","t":"ax14.ma","k":"text","q":"Hvilken arteriel forsyning har mamma?","a":"A. thoracica interna (rr. perforantes), a. thoracica lateralis, a. thoracoacromialis (rr. pectorales), aa. intercostales posteriores (rr. perforantes).","img":"r_ax14_108-0"},{"id":"ax14-t101","t":"ax14.ma","k":"text","q":"Hvordan drænerer mammas vener, og hvad er den kliniske betydning?","a":"Superficielle og dybe vener, som bl.a. tømmes i vv. thoracicae internae og vv. intercostales. Vv. intercostales posteriores drænerer til det klapløse v. azygos-system, som også står i forbindelse med columna — det forklarer, hvorfor metastaser fra brysttumorer hyppigt ses i columna."},{"id":"ax14-t102","t":"ax14.ma","k":"text","q":"Hvordan er mammas nerveforsyning?","a":"Kutan innervation fra intercostalnerverne, opdelt i mediale (T2–T4, rr. mammarii mediales) og laterale grene (T4–T6, rr. mammarii laterales)."},{"id":"ax14-t103","t":"ax14.ma","k":"text","q":"Hvilke lymfeknuder drænerer mammae, og hvor stor en andel går til hver?","a":"**Laterale del:** lnn. axillares, pektoral gruppe (75 % af drænagen). **Mediale del:** lnn. parasternales (perforerer m. pectoralis major). **Superiore del:** lnn. axillares, apikal gruppe. **Inferiore del:** peritoneale, parietale lymfekar (perforerer rectusskeden).","img":"r_ax14_109-2"},{"id":"ax14-t104","t":"ax14.ma","k":"text","q":"Hvad er en sentinel node, og hvorfor er den klinisk vigtig?","a":"Den første lymfeknude, der modtager lymfen fra en bestemt region. Bruges klinisk ved brystcancer og malignt melanom: der injiceres blåfarve og et radioaktivt stof for at finde den. Hvis der er metastaser til sentinel node, skal alle lymfeknuder i axillen fjernes (axilrømning).","img":"r_ax14_109-2"},{"id":"ax14-o105","t":"ax14.cv","k":"occ","img":"vertform","boxes":[[58.583,24.112,24.152,6.684],[57.685,40.102,36.028,6.853],[49.9,71.658,31.986,5.922],[2.246,70.643,39.671,6.768],[59.331,62.437,30.639,6.091],[39.421,79.357,27.046,6.684] k":"text","q":"Hvordan er diaphragma inddelt i en perifer og en central del?","a":"**Perifer del:** kødet muskel med tre udspringshoveder. **Central del:** tendinøs insertionssene (centrum tendineum).","img":"r_ax15_39-0"},{"id":"ax15-t3","t":"ax15.di","k":"text","q":"Hvilke tre udspringshoveder (partes) har diaphragma?","a":"**Pars sternalis:** udspring bagsiden af proc. xiphoideus.\n**Pars costalis:** udspring ribbensbrusken, costa 7–12.\n**Pars lumbalis:** udspring med et højre og venstre 'ben' — crus dextrum fra corpora vertebrae L1–L3, crus sinistrum fra L1–L2.","img":"r_ax15_40-0"},{"id":"ax15-t4","t":"ax15.di","k":"text","q":"Hvad insererer diaphragmas muskelfibre i?","a":"Centrum tendineum, som har 3 alae (vinger): forreste, højre og venstre."},{"id":"ax15-t5","t":"ax15.di","k":"text","q":"Hvilke tre lig. arcuata hører til pars lumbalis, og hvad danner de?","a":"**Lig. arcuatum medianum:** hesteskoformet senebue i midtlinjen, forbinder de to crura på niveau med T12; danner sammen med corpus vertebrae hiatus aorticus.\n**Lig. arcuatum mediale:** forstærkning i fascien over m. psoas major, fra corpus vertebrae L1 til proc. transversus L1.\n**Lig. arcuatum laterale:** forstærkning i fascien over m. quadratus lumborum, fra proc. transversus L1 til spidsen af costa XII.","img":"r_ax15_40-0"},{"id":"ax15-t6","t":"ax15.di","k":"text","q":"Hvordan er centrum tendineum opbygget, og hvad grænser den op til?","a":"Central, fælles aponeurose, formet som et kløverblad med 3 vinger (alae). Sammenvokset med hjertesækken. Mod lungerne er den pleurabeklædt; mod abdomen peritoneumbeklædt (sammenvokset med leveren visse steder).","img":"r_ax15_42-2"},{"id":"ax15-t7","t":"ax15.di","k":"text","q":"Hvilke tre store huller findes i diaphragma, og hvor sidder de?","a":"**Foramen venae cavae:** rundt hul til højre for midtlinjen, i centrum tendineum, niveau T8.\n**Hiatus oesophagus:** ovalt hul til venstre for midtlinjen, begrænset af fibre fra crus dextrum (sphincterfunktion), niveau T10.\n**Hiatus aorticus:** nederste, bageste åbning, begrænset bagtil af T12 og fortil af lig. arcuatum medianum.","img":"r_ax15_43-0"},{"id":"ax15-t8","t":"ax15.di","k":"text","q":"Hvad er Larreys spalte og Bochdaleks trekant?","a":"**Larreys spalte:** mellem pars sternalis og pars costalis, på hver side af proc. xiphoideus; a. epigastrica superior løber igennem.\nBochdaleks trekant: mellem pars lumbalis, pars costalis og costa XII. Begge steder er svage punkter, hvor der kan opstå hernier.","img":"r_ax15_44-0"},{"id":"ax15-t9","t":"ax15.di","k":"text","q":"Diaphragmas innervation: hvilken nerve, og hvad innerverer den?","a":"N. phrenicus (sinister et dexter), fra C3–C5 ('keeps the diaphragm alive'). Innerverer diaphragma motorisk, og sensorisk 'de 3 P'er': perikardiet, pleura, peritoneum.\nSPOT: løber på forsiden af m. scalenus anterior.","img":"r_ax15_45-2"},{"id":"ax15-t10","t":"ax15.ve","k":"text","q":"Hvordan foregår normal vejrtrækning?","a":"**Indånding:** aktiv via diaphragma ('stempel i en cylinder').\n**Udånding:** passiv via elasticitet i lungevævet ved samtidig relaksation af diaphragma.","img":"r_ax15_47-2"},{"id":"ax15-t11","t":"ax15.ve","k":"text","q":"Hvilke muskler er accessoriske inspirationsmuskler?","a":"Intercostal muskulatur (afstivning af thorax), m. sternocleidomastoideus (fikseret nakke), mm. scaleni (fikseret nakke), mm. pectorales (fikseret arm), m. serratus anterior (fikseret arm), m. serratus posterior superior.","img":"r_ax15_47-2"},{"id":"ax15-t12","t":"ax15.ve","k":"text","q":"Hvilke muskler er accessoriske ekspirationsmuskler?","a":"Abdominalmuskulaturen, m. latissimus dorsi (fikseret arm, ved hostestød), m. serratus posterior inferior.","img":"r_ax15_47-2"},{"id":"ax15-t13","t":"ax15.ve","k":"text","q":"Hvor stor en andel af hvilerespirationens inspiration står diaphragma for?","a":"Ca. 2/3. Hvilerespiration er en kombination af abdominal og thorakal respiration.","img":"r_ax15_47-2"},{"id":"ax15-t14","t":"ax15.ve","k":"text","q":"Hvad sker der med diaphragma ved inspiration og ekspiration?","a":"**Inspiration:** de stejle fibre kontraheres, og kuplen descenderer.\n**Ekspiration:** diaphragma relakserer, hjulpet af elastisk rekyl fra abdominal viscera, thoraxvæg og lungevæv.","img":"r_ax15_47-2"},{"id":"ax15-t15","t":"ax15.ve","k":"text","q":"Hvad er hovedfunktionen af mm. intercostales externi og interni under vejrtrækning?","a":"De bidrager ved henholdsvis inspiration og ekspiration, men deres primære funktion er at afstive thoraxvæggen.","img":"r_ax15_47-2"},{"id":"ax15-t16","t":"ax15.bv","k":"text","q":"Hvordan er bugvæggen afgrænset?","a":"**Opadtil:** ribbenskurvaturen. **Siderne:** flankelinjen. **Nedadtil:** crista iliaca og lyskefuren. **Midtlinjen:** crista pubica og symfysen.","img":"r_ax15_49-0"},{"id":"ax15-t17","t":"ax15.bv","k":"text","q":"Hvilke 8 lag har bugvæggen?","a":"1) Hud, 2) subcutis, 3) m. obliquus externus abdominis, 4) m. obliquus internus abdominis, 5) m. transversus abdominis, 6) fascia transversalis, 7) ekstraperitonealt bindevæv, 8) peritoneum.\nVentralt, mediant er de tre muskellag erstattet af m. rectus abdominis og linea alba. Kar og nerver løber mellem lag 4 og 5.","img":"r_ax15_49-3"},{"id":"ax15-t18","t":"ax15.bv","k":"text","q":"Hvilke 6 muskler udgør bugvæggens muskulatur, og hvordan innerveres de?","a":"M. rectus abdominis, m. pyramidalis, m. obliquus externus abdominis, m. obliquus internus abdominis, m. transversus abdominis, m. quadratus lumborum.\nInnervation: rr. anteriores, nn. spinales T6–L2.","img":"r_ax15_50-2"},{"id":"ax15-t19","t":"ax15.bv","k":"text","q":"M. rectus abdominis: udspring, insertion?","a":"**Udspring:** crista pubica, symphysis pubica. **Insertion:** ribbensbruskene costa 5–7.\nAfbrydes af 3–4 intersectiones tendineae (korte mellemsener). Omsluttes af rectusskeden. Linea alba abdominis forbinder de to rectusmuskler.","img":"r_ax15_51-4"},{"id":"ax15-t20","t":"ax15.bv","k":"text","q":"M. pyramidalis: udspring, insertion, beliggenhed?","a":"**Udspring:** crista pubica. **Insertion:** linea alba. Ligger inden for rectusskeden.","img":"r_ax15_51-5"},{"id":"ax15-t21","t":"ax15.bv","k":"text","q":"M. obliquus externus abdominis: udspring, insertion?","a":"**Udspring:** lateralfladen af de 8 nederste ribben. **Insertion:** forreste halvdel af crista iliaca, insertionsaponeurose (fortsætter i rectusskedens forreste blad) og lig. inguinale via crus mediale et laterale.\nKaldes 'yderlommerne i en jakke'.","img":"r_ax15_52-3"},{"id":"ax15-t22","t":"ax15.bv","k":"text","q":"Hvad er lig. inguinale, og hvor spænder det?","a":"Den kaudale afslutning af m. obliquus externus' aponeurose. Spænder mellem spina iliaca anterior superior og tuberculum pubicum.","img":"r_ax15_76-0"},{"id":"ax15-t23","t":"ax15.bv","k":"text","q":"M. obliquus internus abdominis: udspring, insertion?","a":"**Udspring:** fascia thoracolumbalis, forreste halvdel af crista iliaca, laterale 2/3 af lig. inguinale, 3 nederste ribbensbruske.\n**Insertion:** insertionsaponeurosen deler sig Y-formet ud for m. rectus abdominis og fortsætter i rectusskedens forreste og bagerste blad.\nKaldes 'inderlommerne i en jakke'.","img":"r_ax15_53-3"},{"id":"ax15-t24","t":"ax15.bv","k":"text","q":"Hvad er falx inguinalis og m. cremaster?","a":"**Falx inguinalis:** m. obliquus internus abdominis smelter sammen med m. transversus abdominis og hæfter på crista pubica.\n**M. cremaster:** fibre fra m. obliquus internus' underste rand fortsætter omkring funiculus spermaticus.","img":"r_ax15_79-1"},{"id":"ax15-t25","t":"ax15.bv","k":"text","q":"M. transversus abdominis: udspring, insertion?","a":"**Udspring:** fascia thoracolumbalis (det dybe blad), nederste 6 ribbensbruske (inderside), crista iliaca (forreste 2/3), lig. inguinale (laterale 1/3).\n**Insertion:** rectusskeden (over linea arcuata: bageste blad; under: forreste blad) og falx inguinalis.\nKaldes 'vesten inden under jakken'.","img":"r_ax15_54-3"},{"id":"ax15-t26","t":"ax15.bv","k":"text","q":"M. quadratus lumborum: udspring, insertion, nerver?","a":"**Udspring:** crista iliaca. **Insertion:** costa 12, proc. transversi L1–L5 (med snipper).\nDanner lig. arcuatum laterale (fra proc. transversus L1 til costa XII) som udspring for diaphragmas pars lumbalis.\nInnerveres af n. subcostalis, n. iliohypogastricus og n. ilioinguinalis.","img":"r_ax15_61-6"},{"id":"ax15-t27","t":"ax15.bv","k":"text","q":"Hvad er rectusskeden, og hvordan dannes dens forreste og bagerste blad?","a":"Består af et ventralt og et dorsalt blad, dannet ved sammenvoksning af insertionsaponeuroserne for de tre laterale bugmuskler, og omgiver m. rectus abdominis.\nM. obliquus internus' aponeurose deler sig Y-formet: forreste blad foran, bagerste blad bag rectus. M. obliquus externus' aponeurose smelter med det forreste blad (danner det ventrale blad); m. transversus abdominis' aponeurose smelter med det bagerste blad (danner det dorsale blad).","img":"r_ax15_56-1"},{"id":"ax15-t28","t":"ax15.bv","k":"text","q":"Hvordan er rectusskeden opbygget over linea arcuata?","a":"**Forreste blad:** m. obliquus externus abdominis + m. obliquus internus abdominis. **Bagerste blad:** m. transversus abdominis + m. obliquus internus abdominis.\nForbindelse over midtlinjen: linea alba abdominis (fra proc. xiphoideus til symphysis pubica, indeholder anulus umbilicalis).","img":"r_ax15_59-3"},{"id":"ax15-t29","t":"ax15.bv","k":"text","q":"Hvad sker der med rectusskeden under linea arcuata, og hvad er linea arcuata?","a":"Under linea arcuata går alle tre aponeuroser til det forreste blad. Linea arcuata er en halvmåneformet kant ca. 4 cm kaudalt for navlen, hvor det dorsale blad af rectusskeden ender.","img":"r_ax15_59-2"},{"id":"ax15-t30","t":"ax15.bv","k":"text","q":"Hvad er fascia transversalis?","a":"Fascie, der beklæder den dybe flade af m. quadratus lumborum, m. transversus abdominis, rectusskeden og m. rectus abdominis. Tykkere kaudalt for rectusskeden. Ligger mod peritoneum. Fortsætter som fascia spermatica interna i funiculus spermaticus.","img":"r_ax15_62-2"},{"id":"ax15-t31","t":"ax15.bv","k":"text","q":"Hvilken funktion har de longitudinelle fibre i bugvæggen (m. rectus abdominis)?","a":"**Punctum fixum kranielt:** symfysen løftes, bækkenet drejes, lordosen mindskes.\n**Punctum fixum kaudalt:** ventralfleksion af columna.\n**Begge:** défense musculaire. De mest laterale fibre i mm. obliqui bidrager desuden til lateralfleksion.","img":"r_ax15_63-1"},{"id":"ax15-t32","t":"ax15.bv","k":"text","q":"Hvilken funktion har de obliquinale og de cirkulære fibre i bugvæggen?","a":"**Obliquinale fibre** (mm. obliqui externus et internus): rotation blandet med fleksion og lateralfleksion (som ved skrå mavebøjninger).\n**Cirkulære fibre** (primært m. transversus abdominis): sammensnørende virkning, som bl.a. giver stabilitet af columna.\nAlle muskler bidrager til Valsalva (støtte og uddrivning af bugindhold).","img":"r_ax15_63-1"},{"id":"ax15-t33","t":"ax15.bv","k":"text","q":"Hvilke funktioner har bugpressen ud over muskelbevægelse?","a":"Tilbageholdelse af intraabdominale organer (forhindrer hernier); assisterer venøst tilbageløb gennem v. cava inferior; afstivning og kompressionsfjedring ved Valsalvas manøvre (muliggør store løft); assisterer miktion, defækation, vomitus, forceret ekspiration, défense musculaire og fødsel."},{"id":"ax15-t34","t":"ax15.bv","k":"text","q":"Hvilke arterier forsyner bugvæggen segmentært og longitudinelt?","a":"**Segmentale:** aa. intercostales posteriores et lumbales, fra aorta thoracica/abdominalis, i det neurovaskulære plan.\n**Longitudinelle, ventrale:** a. epigastrica superior (fra a. thoracica interna) og a. epigastrica inferior (fra a. iliaca externa, under linea arcuata) — bemærk anastomosen mellem dem. Bidrag fra a. circumflexa iliaca profunda og a. epigastrica superficialis."},{"id":"ax15-t35","t":"ax15.bv","k":"text","q":"Hvordan forløber bugvæggens nerver fra 7. intercostalnerve og nedefter?","a":"Fra 7. intercostalnerve bevæger nerverne sig væk fra costae og ind mellem mm. transversus og obliquus internus abdominis. T10 rammer umbilicus."},{"id":"ax15-t36","t":"ax15.ci","k":"text","q":"Hvad er canalis inguinalis, og hvor ligger den?","a":"Også kaldet 'lyskekanalen' eller 'inguinalkanalen'. En 4 cm lang spalte i den antero-laterale bugvæg, liggende over den mediale del af lig. inguinale.","img":"r_ax15_70-0"},{"id":"ax15-t37","t":"ax15.ci","k":"text","q":"Hvorfor har mænd en canalis inguinalis, og hvad sker der efter nedvandringen?","a":"I slutningen af fosterlivet vandrer testes gennem lyskekanalen fra bughulen til scrotum, fordi spermatogenesen kræver lidt lavere temperatur.\nEfter nedvandringen er kanalen gennemgangsport for ductus deferens og tilhørende kar/nerver, samlet i funiculus spermaticus.","img":"r_ax15_70-1"},{"id":"ax15-t38","t":"ax15.ci","k":"text","q":"Hvordan er canalis inguinalis hos kvinder?","a":"Ovarierne bliver i bughulen. Kvinder har en canalis inguinalis til gennemgang for det runde livmoderbånd (lig. teres uteri); lyskekanalen er derfor noget mere snæver end hos manden.\nN. ilioinguinalis løber gennem loftet, og r. genitalis n. genitofemoralis gennem kanalen hos begge køn.","img":"r_ax15_72-1"},{"id":"ax15-t39","t":"ax15.ci","k":"text","q":"Hvilke fire lag trækkes med som funiculus spermaticus, og hvad hedder de superficielt til profundt?","a":"1) M. obliquus externus abd. aponeurose → fascia spermatica externa.\n2) M. obliquus internus abd. + m. transversus abd. → fascia cremasterica (m. cremaster).\n3) Fascia transversalis → fascia spermatica interna.\n4) Peritoneum → processus vaginalis peritonei (oblitereres normalt).","img":"r_ax15_73-3"},{"id":"ax15-t40","t":"ax15.ci","k":"text","q":"Hvordan beskrives canalis inguinalis til eksamen?","a":"Med en ydre åbning (medial) og en indre åbning (lateral), samt en forvæg, bagvæg, loft og gulv.","img":"r_ax15_69-10"},{"id":"ax15-t41","t":"ax15.ci","k":"text","q":"Anulus inguinalis superficialis (ydre åbning): opbygning?","a":"Aflang trekantet åbning i m. obliquus externus' aponeurose. Begrænses af crus mediale (hæfter på forfladen af os pubis) og crus laterale (drejer rundt og under kanalen, forbindes med lig. inguinale); fibrae intercrurales sammenholder de to ben.\nFascia spermatica externa fortsætter herfra omkring funiculus spermaticus. Dækkes bagfra af falx inguinalis (hindrer direkte brok).","img":"r_ax15_76-14"},{"id":"ax15-t42","t":"ax15.ci","k":"text","q":"Anulus inguinalis profundus (indre åbning): placering og afgrænsning?","a":"Placering: omtrent mellem symphysis pubica og SIAS.\nBegrænses af fascia transversalis (eksvagineres ind i kanalen som fascia spermatica interna; medialt forstærket som lig. interfoveolare). Kranielt: udspringshovederne fra m. obliquus internus og m. transversus abdominis. Kaudalt: lig. inguinale.","img":"r_ax15_77-2"},{"id":"ax15-t43","t":"ax15.ci","k":"text","q":"Gulvet i canalis inguinalis: hvilke strukturer?","a":"Lig. inguinale (lateralt) — en forstærkning af den rendeformede aponeurose fra m. obliquus externus, fra SIAS til tuberculum pubicum.\nMedialt afgår to fibersæt: lig. reflexum (til rectusskeden) og lig. lacunare (til pecten ossis pubis, løber posteriort).","img":"r_ax15_78-3"},{"id":"ax15-t44","t":"ax15.ci","k":"text","q":"Loftet i canalis inguinalis: hvilke strukturer?","a":"De bueformede m. obliquus internus og m. transversus abdominis, som danner fællesinsertionen falx inguinalis (medialt). Herfra afspaltes fascia cremasterica (m. cremaster).","img":"r_ax15_79-1"},{"id":"ax15-t45","t":"ax15.ci","k":"text","q":"Forvæggen i canalis inguinalis: hvilke strukturer?","a":"Aponeurosen af m. obliquus externus abdominis. Helt lateralt bidrager også m. obliquus internus abdominis (som udspringer fra de laterale 2/3 af lig. inguinale).","img":"r_ax15_80-2"},{"id":"ax15-t46","t":"ax15.ci","k":"text","q":"Bagvæggen i canalis inguinalis: medial og lateral zone?","a":"**Medialt (kraftig):** falx inguinalis (fælles insertion af m. obliquus internus og m. transversus abdominis, hæfter på crista pubica) + lig. reflexum.\n**Lateralt (svag):** fascia transversalis — under bugpressen lægger fascia transversalis og lig. interfoveolare sig mod bagvæggen og hindrer indirekte brok.","img":"r_ax15_81-0"},{"id":"ax15-t47","t":"ax15.ci","k":"text","q":"Hvad er kryptorkisme?","a":"Mal-descensus testis (retentio testis): delvis eller manglende nedvandring af testis."},{"id":"ax15-t48","t":"ax15.ci","k":"text","q":"Hvad øger risikoen for lyskebrok (hernia inguinalis)?","a":"Tyngdekraft, bugpres og den skrå vinkling af kanalen — 'bugvæggens svage steder'."},{"id":"ax15-t49","t":"ax15.ci","k":"text","q":"Hvad kendetegner hernia inguinalis indirecta?","a":"Medfødt: processus vaginalis er ikke aflukket. Erhvervet: brokken presser sig gennem den ellers lukkede processus vaginalis. Pulsen (a. epigastrica inferior) mærkes medialt for brokporten.","img":"r_ax15_84-2"},{"id":"ax15-t50","t":"ax15.ci","k":"text","q":"Hvad kendetegner hernia inguinalis directa?","a":"Altid erhvervet; går gennem falx inguinalis, som er blevet svag. Pulsen mærkes lateralt for brokporten.","img":"r_ax15_86-1"},{"id":"ax15-t51","t":"ax15.ci","k":"text","q":"Hvad er en femoral hernie?","a":"En brok gennem anulus femoralis, i den mediale del af lacuna vasorum.","img":"r_ax15_87-1"},{"id":"ax15-t52","t":"ax15.bb","k":"text","q":"Hvad er bækkenbunden, og hvilke to dele består den af?","a":"Samlebetegnelse for musklerne, der lukker bækkenet nedadtil. Består af **diaphragma pelvis** (profund) og **diaphragma urogenitale** (superficiel; pensum 5. semester).","img":"r_ax15_89-6"},{"id":"ax15-t53","t":"ax15.bb","k":"text","q":"Hvilke muskler udgør diaphragma pelvis, og hvad er dets innervation og funktion?","a":"M. levator ani (m. pubococcygeus + m. iliococcygeus) og m. coccygeus.\n**Innervation:** n. pudendus fra plexus sacralis.\n**Funktion:** holder på abdominal- og pelvisorganer; giver passage under vandladning, defækation og fødsel.","img":"r_ax15_89-7"},{"id":"ax15-t54","t":"ax15.bb","k":"text","q":"M. pubococcygeus: udspring og insertion?","a":"**Udspring:** bagsiden af os pubis. **Insertion:** centrum tendineum perinei, endetarmen (som m. puborectalis, en 'billig sphincter') og lig. anococcygeum."},{"id":"ax15-t55","t":"ax15.bb","k":"text","q":"M. iliococcygeus: udspring og insertion?","a":"**Udspring:** arcus tendineus musculi levatoris ani (senebue fra os pubis til spina ischiadica). **Insertion:** lig. anococcygeum og os coccygis."},{"id":"ax15-t56","t":"ax15.bb","k":"text","q":"Hvad er levatorspalten?","a":"Spalte i midtlinjen fortil mellem levatormusklerne; passage for urethra (hos kvinden også vagina). Her forstærkes bækkenbunden yderligere af diaphragma urogenitale."},{"id":"ax15-t57","t":"ax15.bb","k":"text","q":"Hvad er m. puborectalis?","a":"Den del af m. pubococcygeus, der går slyngeformet bag om rectum og medfører et lille knæk på denne, som fungerer som en 'billig sphincter'."},{"id":"ax15-t58","t":"ax15.bb","k":"text","q":"M. coccygeus: udspring, insertion og relation til lig. sacrospinale?","a":"Tynd, flad muskel, indvævet i lig. sacrospinale (ligger anteromedialt for det). Spænder mellem spina ischiadica og sidekanten af os sacrum."},{"id":"ax15-t59","t":"ax15.bb","k":"text","q":"Hvad er formålet med bækkenbunden samlet set?","a":"At holde abdominal- og bækkenviscera inde i kroppen, og at give passage under vandladning, defækation og fødsel."},{"id":"ax15-o60","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":0,"a":"Symphysis pubica","n":"Forreste sammenføjning af de to os pubis."},{"id":"ax15-o61","t":"ax1 .554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":4,"a":"M. obturatorius internus","n":"Muskel lateralt for bækkenbunden, dækket af fascie."},{"id":"ax15-o65","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":5,"a":"Centrum tendineum (perinei)","n":"Senecentrum i perineum, hvor bl.a. m. pubococcygeus insererer."},{"id":"ax15-o66","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":6,"a":"Spina ischiadica","n":"Landemærke; udspring for m. coccygeus / lig. sacrospinale."},{"id":"ax15-o67","t":"ax15.bb","k":"occ","img":"bekken1","boxes":[[49.719,0.89,14.526,3.039],[64.158,5.617,11.667,3.929],[40.439,6.783,6.158,3.069],[32.386,15.5,5.544,3.898],[79.947,25.138,20.053,3.039],[82.667,34.223,16.281,3.069],[85.561,43.892,13.228,3.929],[43.193,95.641,12.263,3.867],[73.474,12.922,20.737,7.858],[56.842,15.101,5.491,6.047],[21.544,21.854,26.386,12.554],[77.526,36.188,3.596,9.208],[0.561,40.731,57.07,54.543],[53.404,47.759,18.86,18.416]],"target":7,"a":"Promontorium","n":"Forreste, øverste kant af os sacrum."}],"mcq":[{"id":"q1","t":"ax5.led","q":"Hvad kendetegner et ægte led?","o":["Bindevævsforbindelse mellem to knogler med små forskydninger","Ledhule med synovialvæske og ledkapsel","Kun brusk mellem knoglerne","Altid seks frihedsgrader"],"c":1,"e":"Ægte led (synovialled) har ledhule, synovialvæske, ledkapsel og store bevægeudslag. De andre svar beskriver uægte led."},{"id":"q2","t":"ax5.led","q":"Hvor mange frihedsgrader har ægte led?","o":["1–3","3–5","Altid 6","Ingen"],"c":0,"e":"Ægte led har 1–3 frihedsgrader. Syndesmoser har 3–5, men aldrig 6."},{"id":"q3","t":"ax5.led","q":"Hvilket af følgende er en sekundær synchondrose?","o":["Epifyseskive","Ribbensbrusk","Discus intervertebralis","Membrana interossea antebrachii"],"c":2,"e":"Discus intervertebralis og symphysis pubica er sekundære synchondroser. Epifyseskiver og ribbensbrusk er primære, og membrana interossea er en syndesmose."},{"id":"q4","t":"ax5.led","q":"Hvad er ledforbindelsen mellem radius og ulna (membrana interossea)?","o":["Primær synchondrose","Sekundær synchondrose","Syndesmose","Ægte hængselled"],"c":2,"e":"Membrana interossea er en syndesmose – simpelt bindevæv mellem knoglerne."},{"id":"q5","t":"ax5.led","q":"Hvilken ledtype har kun én frihedsgrad?","o":["Kugleled","Saddelled","Ellipsoid-led","Hængselled"],"c":3,"e":"Hængselled (albue, knæ, fingerled) og drejeled har 1 frihedsgrad. Kugleled har 3, saddel- og ellipsoid-led har 2."},{"id":"q6","t":"ax5.led","q":"Hvad er et kombineret led?","o":["Et led med to knogler","Et led med flere end to knogler i samme ledhule","To adskilte ledhuler mellem de samme knogler","Et led uden ledkapsel"],"c":2,"e":"Enkelt = to knogler. Sammensat = flere end to knogler i samme ledhule. Kombineret = to adskilte ledhuler mellem de samme knogler."},{"id":"q7","t":"ax5.led","q":"Hvilken bevægelse foregår i frontalplanet omkring en sagittal akse?","o":["Fleksion–ekstension","Abduktion–adduktion","Indad–udadrotation","Supination–pronation"],"c":1,"e":"Abduktion–adduktion sker i frontalplanet omkring en sagittal akse. Fleksion–ekstension sker i sagittalplanet omkring en transversal akse."},{"id":"q8","t":"ax5.led","q":"Hvad er forskellen på discus og meniscus articularis?","o":["Discus er kileformet, meniscus er ringformet","Discus er fæstnet langs hele kapselranden; meniscus er kileformet og ikke fæstnet hele vejen","Kun meniscus består af fibrøs brusk","Discus findes kun i hofteleddet"],"c":1,"e":"Begge er fibrøs brusk. Discus er fæstnet til ledkapslen langs hele randen; meniscus er kileformet og ikke fæstnet langs hele randen."},{"id":"q9","t":"ax5.led","q":"Hvad betyder opponensbevægelsen?","o":["At strække tommelfingeren","At modstille sig – bruges ved præcisionsgrebet","At dreje underarmen","At føre armen i en keglebevægelse"],"c":1,"e":"Opponens = at modstille sig (tommelen mod fingrene). Keglebevægelsen hedder cirkumduktion."},{"id":"q10","t":"ax5.sb","q":"Hvilke led indgår i skulderbæltet?","o":["Art. sternoclavicularis og art. acromioclavicularis (samt art. scapulothoracalis)","Art. humeri og art. cubiti","Art. humeri og art. acromioclavicularis","Art. sternoclavicularis og art. humeri"],"c":0,"e":"Skulderbæltet er IKKE det samme som skulderleddet. Art. humeri (det egentlige skulderled) indgår ikke i ringen."},{"id":"q11","t":"ax5.sb","q":"Hvilken vinkel danner scapula med frontalplanet?","o":["10°","30°","40°","90°"],"c":2,"e":"Scapula danner 40° med frontalplanet; clavicula 30° i modsat retning."},{"id":"q12","t":"ax5.sb","q":"Hvordan klassificeres art. sternoclavicularis?","o":["Ægte, enkelt, delt glideled (funktionelt kugleled)","Ægte, sammensat hængselled","Ægte, kombineret drejeled","Uægte led (syndesmose)"],"c":0,"e":"Leddet er et delt glideled, men fungerer som et kugleled med cirkumduktion omkring en dobbeltkegle."},{"id":"q13","t":"ax5.sb","q":"Hvilken struktur deler ledhulen i art. sternoclavicularis i to?","o":["Labrum articulare","Discus articularis (tyk)","Lig. costoclaviculare","M. subclavius"],"c":1,"e":"Discus articularis er tyk og opdeler ledhulen i to."},{"id":"q14","t":"ax5.sb","q":"Hvor ligger skæringspunktet for akserne i dobbeltkeglen i art. sternoclavicularis?","o":["Ved lig. costoclaviculare","Ved processus coracoideus","Ved acromion","Ved lig. interclaviculare"],"c":0,"e":"Skæringspunktet for akserne ligger ved lig. costoclaviculare."},{"id":"q15","t":"ax5.sb","q":"Hvilket ligament ligger medialt i lig. coracoclaviculare?","o":["Lig. trapezoideum","Lig. conoideum","Lig. acromioclaviculare","Lig. coracoacromiale"],"c":1,"e":"Lig. coracoclaviculare består af lig. conoideum (medialt) og lig. trapezoideum (lateralt)."},{"id":"q16","t":"ax5.sb","q":"Hvad kaldes m. subclavius i forhold til art. sternoclavicularis?","o":["Discus","Dynamisk ligament","Labrum","Bursa"],"c":1,"e":"M. subclavius er et dynamisk ligament, der trækker medialt og nedad."},{"id":"q17","t":"ax5.sb","q":"Hvorfor er art. scapulothoracalis ikke et ægte led?","o":["Den har ingen bevægelighed","Bevægelserne sker i en bindevævsspalte mellem m. serratus anterior og thoraxvæg","Den har to ledhuler","Den er en syndesmose mellem clavicula og sternum"],"c":1,"e":"Der er hverken ledhule eller ledkapsel: knogle – muskel – bindevæv – knogle."},{"id":"q18","t":"ax5.sb","q":"Hvor stor en andel af abduktionen står scapula for (over 30° i frontalplanet)?","o":["Ca. 1/10","Ca. 1/3","Ca. 1/2","Hele abduktionen"],"c":1,"e":"Scapula bidrager med 1/3 af abduktionen."},{"id":"q19","t":"ax5.sb","q":"Hvad er funktionen af art. acromioclavicularis?","o":["Kun små forskydninger – forlænger bevægelserne fra art. sternoclavicularis","Stor bevægelighed i alle planer","Den låser clavicula fast til scapula","Den bærer kropsvægten ved hængen i armene"],"c":0,"e":"AC-leddet tillader små forskydninger/medbevægelser."},{"id":"q20","t":"ax5.hu","q":"Hvordan klassificeres art. humeri?","o":["Ægte, enkelt kugleled","Ægte, sammensat hængselled","Uægte led","Ægte, kombineret drejeled"],"c":0,"e":"Art. humeri er et ægte, enkelt kugleled mellem scapula og humerus."},{"id":"q21","t":"ax5.hu","q":"Hvor stor en del af caput humeri artikulerer med cavitas glenoidalis?","o":["Ca. 1/3","Ca. 1/2","Ca. 2/3","Hele caput"],"c":0,"e":"Cavitas glenoidalis artikulerer kun med ca. 1/3 af caput humeri – derfor stor mobilitet og lav stabilitet."},{"id":"q22","t":"ax5.hu","q":"Hvilken struktur forstørrer cavitas glenoidalis?","o":["Labrum glenoidale","Lig. coracoacromiale","Recessus axillaris","Bursa subacromialis"],"c":0,"e":"Labrum glenoidale forstørrer ledskålen, så mere af caput humeri dækkes."},{"id":"q23","t":"ax5.hu","q":"Hvad er en betingelse for skulderleddets store bevægelighed i kapslen?","o":["En stram kapsel","En meget løs kapsel med recessus axillaris nedadtil","En discus articularis","Manglende synovialmembran"],"c":1,"e":"Kapslen er meget løs, og den store omslagsfold nedadtil (recessus axillaris) er betingelsen for den store bevægelighed."},{"id":"q24","t":"ax5.hu","q":"Hvilke ligamenter kaldes 'abe-ligamenterne'?","o":["Ligg. glenohumeralia","Lig. coracohumerale","Lig. coracoclaviculare","Lig. transversum scapulae"],"c":0,"e":"Ligg. glenohumeralia (superius, medius, inferius) kan bære kropsvægten ved hængen i armene."},{"id":"q25","t":"ax5.hu","q":"Hvilket ligament er 'indkøbspose-ligamentet' og begrænser udadrotation?","o":["Lig. coracohumerale","Lig. coracoacromiale","Lig. acromioclaviculare","Lig. conoideum"],"c":0,"e":"Lig. coracohumerale løber fra processus coracoideus til tuberculum majus og aflaster m. supraspinatus."},{"id":"q26","t":"ax5.hu","q":"Hvilken sene løber intraartikulært i skulderleddet?","o":["Caput longum af m. biceps brachii","Caput breve af m. biceps brachii","Senen fra m. supraspinatus","Senen fra m. deltoideus"],"c":0,"e":"Caput longum af m. biceps brachii løber intraartikulært, dækket af vagina synovialis intertubercularis."},{"id":"q27","t":"ax5.hu","q":"Hvilken muskel hører IKKE til rotatormanchetten?","o":["M. supraspinatus","M. infraspinatus","M. teres minor","M. teres major"],"c":3,"e":"Rotatormanchetten består af m. subscapularis, m. supraspinatus, m. infraspinatus og m. teres minor."},{"id":"q28","t":"ax5.hu","q":"Hvilken bursa kommunikerer med bursa subacromialis?","o":["Bursa subdeltoidea","Bursa subtendinea m. subscapularis","Bursa subcutanea olecrani","Bursa subtendinea tricipitis brachii"],"c":0,"e":"Bursa subdeltoidea kommunikerer med bursa subacromialis."},{"id":"q29","t":"ax5.hu","q":"Omkring hvilken akse foregår fleksion–ekstension i art. humeri?","o":["Sagittal","Transversal","Vertikal","Ingen – leddet har kun rotation"],"c":1,"e":"Transversal akse: fleksion/ekstension. Sagittal akse: abduktion/adduktion. Vertikal akse: rotation."},{"id":"q30","t":"ax5.hu","q":"Hvad er bevægeomfanget for ekstension i art. humeri?","o":["0–180°","0–90°","0–75°","0–60°"],"c":3,"e":"Ekstension 0–60°. Fleksion 0–180°, adduktion 0–75°, indadrotation 0–90°, udadrotation 0–70°."},{"id":"q31","t":"ax5.hu","q":"Hvad sker der med humerus ved abduktion over 90° i scapulas plan?","o":["Indadrotation","Udadrotation, så lig. glenohumeralia afspændes","Ingen rotation","Maksimal ekstension"],"c":1,"e":"Humerus udadroteres, så ligg. glenohumeralia afspændes, og tuberculum majus får plads under acromion."},{"id":"q32","t":"ax5.hu","q":"Hvad sker der med humerus ved fleksion til 180°?","o":["Udadrotation","Indadrotation, så epicondylus medialis vendes fremad","Adduktion","Supination"],"c":1,"e":"Ved fleksion til 180° sker en indadrotation, så epicondylus medialis vendes fremad."},{"id":"q33","t":"ax5.hu","q":"Hvilke fire strukturer stabiliserer art. humeri?","o":["Rotatormanchet, labrum glenoidale, bicepssenen og ligamenterne","Discus, meniscus, labrum og kapsel","Bursae, discus, fedtpude og labrum","Kun m. deltoideus"],"c":0,"e":"Stabiliteten ligger udelukkende i muskler og ligamenter – de fire hovedstrukturer er rotatormanchet, labrum, bicepssene og ligamenter."},{"id":"q34","t":"ax5.kn","q":"Hvilken struktur på radius er insertion for m. biceps brachii?","o":["Tuberositas radii","Tuberculum dorsale","Processus styloideus radii","Incisura ulnaris"],"c":0,"e":"Tuberositas radii = insertion for m. biceps brachii."},{"id":"q35","t":"ax5.kn","q":"Hvilken muskel hæfter på tuberositas ulnae?","o":["M. brachialis","M. biceps brachii","M. triceps brachii","M. pronator teres"],"c":0,"e":"Tuberositas ulnae er insertion for m. brachialis."},{"id":"q36","t":"ax5.kn","q":"Hvad fungerer tuberculum dorsale radii (Listers tuberkel) som?","o":["Trisse for tendo m. extensor pollicis longus","Ledskål for caput ulnae","Ledhoved mod håndroden","Insertion for m. brachialis"],"c":0,"e":"Tuberculum dorsale er en trisse for tendo m. extensor pollicis longus."},{"id":"q37","t":"ax5.kn","q":"Hvilke to strukturer danner incisura trochlearis?","o":["Olecranon og processus coronoideus","Caput ulnae og processus styloideus","Caput radii og collum radii","Olecranon og tuberositas ulnae"],"c":0,"e":"Incisura trochlearis dannes af olecranon og processus coronoideus og griber om trochlea humeri."},{"id":"q38","t":"ax5.kn","q":"Hvilken struktur på ulna er ledskål for caput radii?","o":["Incisura radialis","Incisura trochlearis","Olecranon","Processus styloideus"],"c":0,"e":"Incisura radialis ulnae er ledskålen for caput radii (art. radioulnaris proximalis)."},{"id":"q39","t":"ax5.cu","q":"Hvordan klassificeres art. cubiti som helhed?","o":["Ægte, sammensat led (hængselled med indbygget drejeled)","Ægte, enkelt kugleled","Ægte, enkelt hængselled","Syndesmose"],"c":0,"e":"Art. cubiti er et ægte, sammensat led: hængselled med indbygget drejeled."},{"id":"q40","t":"ax5.cu","q":"Hvilke delled indgår i art. cubiti?","o":["Humeroulnaris, humeroradialis og radioulnaris proximalis","Humeroulnaris, humeroradialis og radioulnaris distalis","Glenohumeralis, humeroulnaris og humeroradialis","Sternoclavicularis, humeroulnaris og humeroradialis"],"c":0,"e":"Art. radioulnaris distalis ligger ved håndleddet og hører ikke til albueleddet."},{"id":"q41","t":"ax5.cu","q":"Hvad er ledhovedet i art. humeroulnaris?","o":["Trochlea humeri","Capitulum humeri","Caput radii","Caput ulnae"],"c":0,"e":"Trochlea humeri (trisseformet) er ledhoved; incisura trochlearis ulnae er ledskål."},{"id":"q42","t":"ax5.cu","q":"Hvorfor kaldes art. humeroradialis et 'indskrænket' kugleled?","o":["Fordi radius er tæt bundet til ulna","Fordi den mangler ledkapsel","Fordi den kun har én knogle","Fordi den ligger uden for kapslen"],"c":0,"e":"Radius er tæt bundet til ulna, så der er ingen kugleledsfunktion – leddet faciliterer kun rotation og fleksion/ekstension."},{"id":"q43","t":"ax5.cu","q":"Hvad danner en osteofibrøs ring sammen med incisura radialis ulnae?","o":["Lig. anulare radii","Lig. collaterale ulnare","Membrana interossea","Discus articularis"],"c":0,"e":"Lig. anulare radii er let tragtformet og omslutter caput/collum radii."},{"id":"q44","t":"ax5.cu","q":"Hvad er stopstrukturen for ekstension i albueleddet?","o":["Ossøs og ligamentøs (fossa olecrani)","Muskuløs (bløddelsstop)","Kun ledkapslen","Discus articularis"],"c":0,"e":"Fleksion stoppes af bløddele (muskuløst), ekstension af knogle og ligamenter."},{"id":"q45","t":"ax5.cu","q":"Hvorfor hæfter lig. collaterale radiale i lig. anulare og ikke direkte på radius?","o":["For ikke at indskrænke supination og pronation","For at forhindre ekstension","Fordi radius mangler periost","For at stabilisere art. humeri"],"c":0,"e":"Hvis det hæftede på radius, ville det begrænse rotationen af radius."},{"id":"q46","t":"ax5.cu","q":"Hvilke muskler er kapselstrammere i albueleddet?","o":["M. triceps brachii og m. brachialis","M. biceps brachii og m. brachioradialis","M. pronator teres og m. supinator","M. anconeus og m. pronator quadratus"],"c":0,"e":"De forhindrer, at kapslen klemmes."},{"id":"q47","t":"ax5.cu","q":"Hvilken fossa udfylder subsynovialt fedt ved ekstension?","o":["Fossa coronoidea","Fossa olecrani","Fossa radialis","Fossa infraspinata"],"c":0,"e":"Fedtpuden udfylder fossa olecrani ved fleksion og fossa coronoidea ved ekstension."},{"id":"q48","t":"ax5.cu","q":"Hvilken muskel fleksionerer især ved supination?","o":["M. biceps brachii","M. pronator teres","M. triceps brachii","M. anconeus"],"c":0,"e":"M. biceps brachii er især aktiv ved supination; m. pronator teres ved pronation."},{"id":"q49","t":"ax5.cu","q":"Hvad er den typiske cubitalvinkel?","o":["150°","170°","190°","120°"],"c":1,"e":"Typisk 170°. Cubital varus > 170°, cubital valgus < 170°."},{"id":"q50","t":"ax5.cu","q":"Cubital valgus er en cubitalvinkel på...","o":["Mindre end 170°","Præcis 170°","Mere end 170°","Mere end 190°"],"c":0,"e":"Valgus < 170°, varus > 170°."},{"id":"q51","t":"ax5.cu","q":"Hvilken bursa er involveret i 'students elbow'?","o":["Bursa subcutanea olecrani","Bursa subacromialis","Bursa subdeltoidea","Bursa subtendinea m. subscapularis"],"c":0,"e":"Students elbow er bursitis i bursa subcutanea olecrani."},{"id":"q52","t":"ax5.ru","q":"Hvordan går aksen for supination–pronation?","o":["Fra caput radii til caput ulnae og ned gennem 5. finger","Fra olecranon til tommelfingeren","Fra epicondylus medialis til 2. finger","Tværs gennem humerus"],"c":0,"e":"Aksen løber fra caput radii til caput ulnae og ned gennem 5. finger."},{"id":"q53","t":"ax5.ru","q":"Hvilke muskler pronerer underarmen?","o":["M. pronator teres og m. pronator quadratus","M. supinator og m. biceps brachii","M. triceps brachii og m. anconeus","M. brachialis og m. brachioradialis"],"c":0,"e":"Pronation: m. pronator teres og m. pronator quadratus. Supination: m. supinator og m. biceps brachii."},{"id":"q54","t":"ax5.ru","q":"Hvilken muskel kan både supinere og pronere til kantstilling?","o":["M. brachioradialis","M. supinator","M. pronator quadratus","M. brachialis"],"c":0,"e":"M. brachioradialis bringer underarmen i kantstilling."},{"id":"q55","t":"ax5.ru","q":"Hvordan er fiberretningen i membrana interossea antebrachii?","o":["Fra radius skråt distalt-ulnart","Fra ulna skråt distalt-radialt","Kun tværgående","Kun langsgående"],"c":0,"e":"Fibrene løber fra radius skråt distalt-ulnart; proksimalt findes også radiale fibre (chorda obliqua)."},{"id":"q56","t":"ax5.ru","q":"Hvilken form har discus articularis i art. radioulnaris distalis?","o":["Trekantet","Kileformet","Ringformet","Rund"],"c":0,"e":"Den trekantede discus binder processus styloideus ulnae til incisura ulnaris radii."},{"id":"q57","t":"ax5.ru","q":"Hvad er bevægeomfanget for supination–pronation?","o":["80–0–80°","150–0°","40–0–40°","180–0–180°"],"c":0,"e":"Supination–pronation: 80–0–80°."},{"id":"q58","t":"ax5.kl","q":"Scapulae alatae skyldes skade på hvilken nerve?","o":["N. thoracicus longus","N. axillaris","N. radialis","N. medianus"],"c":0,"e":"N. thoracicus longus innerverer m. serratus anterior, som holder scapula ind mod thorax."},{"id":"q59","t":"ax5.kl","q":"Hvad sker der ved subluxatio caput radii (nursemaid's elbow)?","o":["Caput radii lukserer nedadtil og klemmes i lig. anulare radii","Olecranon brækker","Humerus lukserer fremad","Lig. collaterale ulnare rives over"],"c":0,"e":"Ses hos børn under 5 år ved træk i ekstenderet og proneret arm. Behandling: reponering af radius."},{"id":"q60","t":"ax5.kl","q":"Hvilket ligament er meget stærkt og relevant ved Colles-fraktur?","o":["Lig. radiocarpale palmare","Lig. anulare radii","Lig. collaterale ulnare","Lig. coracohumerale"],"c":0,"e":"Lig. radiocarpale palmare er stærkere end knoglevævet i radius: ved et fald holder båndet, mens radius overrives proksimalt for tilhæftningen."},{"id":"ax6-q1","t":"ax6.ml","q":"Hvad er punctum fixum?","o":["Punktet, der bevæger sig, som regel insertionen","Punktet, der som regel ikke bevæger sig, som regel udspringet","Midten af muskelbugen","Senens overgang til knoglehinden"],"c":1,"e":"Punctum fixum er som regel udspringet og bevæger sig ikke. Punctum mobile er som regel insertionen."},{"id":"ax6-q2","t":"ax6.ml","q":"En muskel arbejder under forlængelse. Hvilken kontraktionstype er det?","o":["Koncentrisk","Excentrisk","Isometrisk","Tonisk"],"c":1,"e":"Excentrisk: musklen arbejder under forlængelse. Koncentrisk: forkortes. Isometrisk: arbejder uden bevægelse."},{"id":"ax6-q3","t":"ax6.ml","q":"Hvilken muskeltype har fibre på kun den ene side af senebladet?","o":["Fusiform","Semipennat","Bipennat","Multipennat"],"c":1,"e":"Semipennat er grundformen. Pennat (bipennat) er to semipennate enheder, og multipennat er flere."},{"id":"ax6-q4","t":"ax6.ml","q":"M. brachioradialis er navngivet efter…","o":["Tilhæftning","Form","Antal hoveder","Størrelse"],"c":0,"e":"Tilhæftning: m. brachioradialis og m. coracobrachialis. Form: m. piriformis. Antal hoveder: m. biceps brachii."},{"id":"ax6-q5","t":"ax6.sm","q":"Hvilken gruppe hører m. subclavius til?","o":["Dorsal gruppe","Ventral gruppe","Lateral gruppe","Rotatormanchetten"],"c":1,"e":"De ventrale skuldermuskler er m. pectoralis major og minor, m. serratus anterior og m. subclavius."},{"id":"ax6-q6","t":"ax6.sm","q":"Hvilke muskler hører IKKE til rotatormanchetten?","o":["M. supraspinatus og m. infraspinatus","M. teres minor og m. subscapularis","M. deltoideus og m. teres major","M. infraspinatus og m. teres minor"],"c":2,"e":"Rotatormanchetten er supraspinatus, infraspinatus, teres minor og subscapularis."},{"id":"ax6-q7","t":"ax6.sm","q":"Hvilke to muskler innerveres af n. axillaris?","o":["M. deltoideus og m. teres minor","M. deltoideus og m. teres major","M. supraspinatus og m. infraspinatus","M. subscapularis og m. teres major"],"c":0,"e":"N. axillaris innerverer m. deltoideus og m. teres minor. Nn. subscapulares innerverer subscapularis og teres major."},{"id":"ax6-q8","t":"ax6.sm","q":"Hvilke muskler danner den bagerste axilfold?","o":["M. pectoralis major og minor","M. latissimus dorsi og m. teres major","M. deltoideus og m. teres minor","M. serratus anterior og m. subscapularis"],"c":1,"e":"M. latissimus dorsi og m. teres major danner den bagerste axilfold. M. pectoralis major danner den forreste."},{"id":"ax6-q9","t":"ax6.ry","q":"Hvilken nerve innerverer m. trapezius?","o":["N. dorsalis scapulae","N. thoracodorsalis","N. accessorius (XI)","N. supra
