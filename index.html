scapularis"],"c":2,"e":"M. trapezius: n. accessorius. Mm. rhomboidei og levator scapulae: n. dorsalis scapulae. M. latissimus dorsi: n. thoracodorsalis."},{"id":"ax6-q10","t":"ax6.ry","q":"Hvilken del af m. trapezius giver adduktion af scapula?","o":["Pars descendens","Pars horisontalis","Pars ascendens","Alle tre lige meget"],"c":1,"e":"Pars descendens: elevation + udadrotation. Pars horisontalis: adduktion. Pars ascendens: depression + udadrotation."},{"id":"ax6-q11","t":"ax6.ry","q":"Hvor hæfter m. latissimus dorsi på humerus?","o":["Tuberculum majus","Crista tuberculi minoris","Tuberositas deltoidea","Crista tuberculi majoris"],"c":1,"e":"M. latissimus dorsi og m. teres major hæfter på crista tuberculi minoris."},{"id":"ax6-q12","t":"ax6.ry","q":"Hvad er funktionen af m. levator scapulae?","o":["Elevation af scapula","Abduktion af scapula","Udadrotation af scapula","Depression af scapula"],"c":0,"e":"Elevation (sammen med m. trapezius) og indadrotation af scapula samt sidebøjning af columna. Nerve: n. dorsalis scapulae."},{"id":"ax6-q13","t":"ax6.ry","q":"Hvorfor kan m. latissimus dorsi fungere som accessorisk eksspirationsmuskel?","o":["Den udspringer fra costae 1–3","På grund af musklens forløb","Den er innerveret af n. phrenicus","Den hæfter på sternum"],"c":1,"e":"Pga. forløbet kan den hjælpe ved fx hostestød."},{"id":"ax6-q14","t":"ax6.br","q":"Hvilken nerve innerverer m. serratus anterior?","o":["N. thoracodorsalis","N. dorsalis scapulae","N. thoracicus longus","N. subclavius"],"c":2,"e":"Skade på n. thoracicus longus giver scapula alata (englevinger)."},{"id":"ax6-q15","t":"ax6.br","q":"Hvor udspringer m. pectoralis minor, og hvor hæfter den?","o":["Costa 3–5 til proc. coracoideus","Costa 1 til clavicula","Sternum til crista tuberculi majoris","Costa 1–8 til margo medialis scapulae"],"c":0,"e":"M. pectoralis minor: costa 3–5 til proc. coracoideus. Den trækker scapula fremad og nedad."},{"id":"ax6-q16","t":"ax6.br","q":"Hvilken rolle har m. subclavius for art. sternoclavicularis?","o":["Dynamisk ligament","Kapselstrammer","Fiksator af humerus","Synergist for pectoralis major"],"c":0,"e":"M. subclavius fikserer clavicula og fungerer som dynamisk ligament for art. sternoclavicularis."},{"id":"ax6-q17","t":"ax6.br","q":"Hvilken funktion har m. pectoralis major IKKE?","o":["Fleksion af humerus","Adduktion af humerus","Indadrotation af humerus","Udadrotation af humerus"],"c":3,"e":"M. pectoralis major: fleksion, adduktion og indadrotation af humerus."},{"id":"ax6-q18","t":"ax6.la","q":"Hvilken del af m. deltoideus giver abduktion?","o":["Pars anterior","Pars media","Pars posterior","Ingen, det gør kun supraspinatus"],"c":1,"e":"Pars media: abduktion (synergi med m. supraspinatus). Pars anterior: fleksion, indadrotation, adduktion. Pars posterior: ekstension, udadrotation, adduktion."},{"id":"ax6-q19","t":"ax6.la","q":"Hvad hedder spalten mellem m. deltoideus og m. pectoralis major?","o":["Trigonum clavipectorale","Subacromialrummet","Foramen quadrilaterum","Fossa infraclavicularis"],"c":0,"e":"Trigonum clavipectorale: her løber v. cephalica, og proc. coracoideus kan palperes i dybden."},{"id":"ax6-q20","t":"ax6.rm","q":"Hvilken rotatormanchetmuskel hæfter på tuberculum minus?","o":["M. supraspinatus","M. infraspinatus","M. teres minor","M. subscapularis"],"c":3,"e":"M. subscapularis er den eneste, der hæfter på tuberculum minus. De øvrige hæfter på tuberculum majus."},{"id":"ax6-q21","t":"ax6.rm","q":"Hvilken nerve innerverer både m. supraspinatus og m. infraspinatus?","o":["N. axillaris","N. suprascapularis","Nn. subscapulares","N. radialis"],"c":1,"e":"N. suprascapularis innerverer supraspinatus og infraspinatus."},{"id":"ax6-q22","t":"ax6.rm","q":"Hvilken rotatormanchetmuskel initierer abduktion?","o":["M. supraspinatus","M. infraspinatus","M. teres minor","M. subscapularis"],"c":0,"e":"M. supraspinatus initierer abduktionen. Ved parese ses besvær med abduktion og positiv droparm-test."},{"id":"ax6-q23","t":"ax6.rm","q":"Hvilken bevægelse laver m. infraspinatus?","o":["Indadrotation","Udadrotation","Adduktion","Fleksion"],"c":1,"e":"Udadrotation af art. humeri (samt stabilitet). Indadrotation laves af m. subscapularis."},{"id":"ax6-q24","t":"ax6.ov","q":"Hvilken nerve innerverer alle tre muskler i overarmens forreste loge?","o":["N. radialis","N. medianus","N. musculocutaneus","N. ulnaris"],"c":2,"e":"Forreste fleksorloge (biceps, coracobrachialis, brachialis): n. musculocutaneus. Bagerste ekstensorloge (triceps): n. radialis."},{"id":"ax6-q25","t":"ax6.ov","q":"Hvor hæfter m. brachialis?","o":["Tuberositas radii","Tuberositas ulnae og ledkapslen","Olecranon","Epicondylus medialis"],"c":1,"e":"Tuberositas ulnae (på proc. coronoideus) og ledkapslen i art. cubiti (kapselstrammer). Funktion: fleksion af albuen."},{"id":"ax6-q26","t":"ax6.ov","q":"Hvor løber caput longum af m. biceps brachii?","o":["Uden for ledkapslen på forsiden af humerus","Inde i art. humeri, beklædt af synovialis","Bag om collum chirurgicum","Gennem foramen quadrilaterum"],"c":1,"e":"Caput longum løber inde i art. humeri (vagina synovialis intertubercularis) og forlader leddet gennem sulcus intertubercularis."},{"id":"ax6-q27","t":"ax6.ov","q":"Hvilken funktion har m. biceps brachii i radioulnarleddet?","o":["Pronation","Supination","Ekstension","Adduktion"],"c":1,"e":"Albueled: fleksion. Radioulnarled: supination. Skulderled: let fleksion + stabilitet."},{"id":"ax6-q28","t":"ax6.ov","q":"Hvor udspringer caput longum af m. triceps brachii?","o":["Tuberculum supraglenoidale","Tuberculum infraglenoidale","Proc. coracoideus","Bag på humerus, distalt for sulcus n. radialis"],"c":1,"e":"Caput longum: tuberculum infraglenoidale. Caput laterale og mediale udspringer på humerus, hhv. proksimalt og distalt for sulcus n. radialis."},{"id":"ax6-q29","t":"ax6.ov","q":"Hvilken muskel perforeres af n. musculocutaneus?","o":["M. biceps brachii","M. brachialis","M. coracobrachialis","M. triceps brachii"],"c":2,"e":"M. coracobrachialis perforeres af n. musculocutaneus (spot)."},{"id":"ax6-q30","t":"ax6.hk","q":"Hvilken knogle har en saddelformet ledfacet til pollex?","o":["Os scaphoideum","Os trapezium","Os capitatum","Os hamatum"],"c":1,"e":"Os trapezium danner saddelled med os metacarpale 1."},{"id":"ax6-q31","t":"ax6.hk","q":"Hvilken carpalknogle er størst og omdrejningspunkt?","o":["Os capitatum","Os lunatum","Os hamatum","Os trapezoideum"],"c":0,"e":"Os capitatum er størst og omdrejningspunkt. Den prominerer ind i den proksimale række."},{"id":"ax6-q32","t":"ax6.hk","q":"Hvilken carpalknogle bærer hamulus?","o":["Os pisiforme","Os triquetrum","Os hamatum","Os trapezium"],"c":2,"e":"Os hamatum har hamulus ossis hamati."},{"id":"ax6-q33","t":"ax6.hk","q":"Hvilken carpalknogle hører til den proksimale række?","o":["Os trapezoideum","Os lunatum","Os capitatum","Os hamatum"],"c":1,"e":"Proksimal række: scaphoideum, lunatum, triquetrum, pisiforme. Distal række: trapezium, trapezoideum, capitatum, hamatum."},{"id":"ax6-q34","t":"ax6.hk","q":"Hvilken finger mangler phalanx media?","o":["Index","Digitus medius","Pollex","Digitus minimus"],"c":2,"e":"Pollex har ikke et mellemstykke, men kraftigere grund- og yderstykke."},{"id":"ax6-q35","t":"ax6.hk","q":"Hvordan er os metacarpale 1 orienteret?","o":["Udadroteret 70 grader","Indadroteret 70 grader og forskudt palmart","Parallel med de andre","Forskudt dorsalt"],"c":1,"e":"Os metacarpale 1 er kortere og tykkere, indadroteret 70 grader og forskudt palmart."},{"id":"ax6-q36","t":"ax6.kl","q":"Hvorfor er en proksimal fraktur af os scaphoideum problematisk?","o":["Knoglen mangler periost helt","Blodforsyningen kommer distalt fra og kan afbrydes, så knoglen ikke heler","Nervus medianus klemmes altid","Lig. anulare rives over"],"c":1,"e":"Kun den distale del er velforsynet. Proksimal fraktur kan give pseudoartrose og iskæmi med risiko for håndledsarthrose."},{"id":"ax6-q37","t":"ax6.kl","q":"En patient over 50 har haft et mildt skuldertraume og kan ikke abducere armen, og droparm-testen er positiv. Hvad mistænker du?","o":["Ruptur af m. supraspinatus","Lammelse af n. thoracicus longus","Fraktur af os scaphoideum","Skade på m. biceps' ulnare sene"],"c":0,"e":"M. supraspinatus er den rotatormanchetmuskel, der oftest rumperer, og risikoen stiger med alderen."},{"id":"ax7-q1","t":"ax7.hl","q":"Hvilken ledtype er art. radiocarpalis?","o":["Ægte, enkelt kugleled","Ægte, sammensat ellipsoidled","Ægte, enkelt saddelled","Uægte led"],"c":1,"e":"Art. radiocarpalis er et ægte, sammensat ellipsoidled ('det egentlige håndled')."},{"id":"ax7-q2","t":"ax7.hl","q":"Hvilke knogler udgør ledhovedet i art. radiocarpalis?","o":["Scaphoideum, lunatum og triquetrum","Scaphoideum, lunatum og pisiforme","Capitatum, hamatum og triquetrum","Trapezium, trapezoideum og capitatum"],"c":0,"e":"Scaphoideum, lunatum og triquetrum (ikke pisiforme) + de interossøse ligamenter."},{"id":"ax7-q3","t":"ax7.hl","q":"Hvilke ligamenter er involveret i Colles' fraktur?","o":["Lig. radiocarpale palmare","Lig. collaterale carpi ulnare","Lig. pisohamatum","Lig. carpi radiatum"],"c":0,"e":"Lig. radiocarpale palmare kan fremtvinge en avulsionsfraktur af distale radius ved fald på udstrakt hånd."},{"id":"ax7-q4","t":"ax7.hl","q":"Hvad udgør ledhoved i art. mediocarpalis?","o":["Os scaphoideum","Os capitatum","Os hamatum","Os lunatum"],"c":1,"e":"Os capitatum rager ind i den proksimale række og fungerer som ledhoved."},{"id":"ax7-q5","t":"ax7.hl","q":"Hvilke bevægeudslag har håndleddet for ulnar- og radialfleksion?","o":["20–0–60°","60–0–20° (ulnar–radial)","80–0–80°","45–0–45°"],"c":1,"e":"Ulnarfleksion–radialfleksion: 60–0–20°. Palmar- og dorsalfleksion: 80–0–80°."},{"id":"ax7-q6","t":"ax7.fl","q":"Hvilken ledtype er MCP-leddet (fingrenes grundled)?","o":["Hængselled","Indskrænket kugleled","Saddelled","Glideled"],"c":1,"e":"Ægte, enkelt, indskrænket kugleled. PIP og DIP er hængselled."},{"id":"ax7-q7","t":"ax7.fl","q":"Hvorfor er MCP-leddets sidebevægelser indskrænket ved fleksion?","o":["Kapslen er stram ved fleksion","Ligg. collateralia forløber dorsalt for aksen og strammes ved fleksion","Volarpladerne blokerer leddet","Sesamknoglerne låser leddet"],"c":1,"e":"Ligg. collateralia er løse ved ekstension og strammes ved fleksion."},{"id":"ax7-q8","t":"ax7.fl","q":"Hvilken muskel flekterer DIP-leddet?","o":["M. flexor digitorum superficialis","M. flexor digitorum profundus","Mm. lumbricales","M. extensor digitorum"],"c":1,"e":"DIP flekteres kun af m. flexor digitorum profundus. PIP flekteres af både superficialis og profundus."},{"id":"ax7-q9","t":"ax7.fl","q":"Hvilken ledtype er tommelens CMC-led?","o":["Hængselled","Kugleled","Saddelled","Glideled"],"c":2,"e":"Ægte, enkelt saddelled mellem os trapezium og basis af metacarpal I."},{"id":"ax7-q10","t":"ax7.fl","q":"Hvilken bevægelse består af abduktion, fleksion og medialrotation af tommelen?","o":["Reposition","Opposition","Cirkumduktion","Adduktion"],"c":1,"e":"Opposition = abduktion + fleksion + medialrotation (mod digitus minimus)."},{"id":"ax7-q11","t":"ax7.gr","q":"Hvilket greb er kendetegnet ved MCP-fleksion og PIP-/DIP-ekstension, uden håndledsinvolvering?","o":["Kraftgreb","Præcisionsgreb","Længdegreb","Nøglegreb"],"c":1,"e":"Præcisionsgreb (pincetgreb). Håndleddet er ikke involveret, kun håndens egne muskler."},{"id":"ax7-q12","t":"ax7.uf","q":"Hvilken muskel i fleksorlogen innerveres af n. ulnaris?","o":["M. pronator teres","M. flexor carpi radialis","M. flexor carpi ulnaris","M. flexor pollicis longus"],"c":2,"e":"M. flexor carpi ulnaris (og den ulnare del af FDP). Resten innerveres af n. medianus."},{"id":"ax7-q13","t":"ax7.uf","q":"Hvilke muskler udgør 3. lag af fleksorlogen?","o":["M. flexor digitorum superficialis","M. flexor digitorum profundus og m. flexor pollicis longus","M. pronator quadratus","M. palmaris longus og m. flexor carpi ulnaris"],"c":1,"e":"1. lag: 4 muskler. 2. lag: FDS. 3. lag: FDP + FPL. 4. lag: pronator quadratus."},{"id":"ax7-q14","t":"ax7.uf","q":"Hvad går igennem chiasma tendinum?","o":["Senerne fra FDS","Senerne fra FDP","Senerne fra m. palmaris longus","N. medianus"],"c":1,"e":"FDS' sener spaltes, og FDP's sener passerer imellem snipperne for at inserere på yderstykket."},{"id":"ax7-q15","t":"ax7.uf","q":"Hvad løber mellem de to hoveder af m. pronator teres?","o":["N. ulnaris","N. medianus","N. radialis","A. radialis"],"c":1,"e":"N. medianus passerer mellem caput humerale og caput ulnare."},{"id":"ax7-q16","t":"ax7.ue","q":"Hvilken kulisse indeholder m. extensor pollicis longus?","o":["1. kulisse","2. kulisse","3. kulisse (skråkulissen)","4. kulisse"],"c":2,"e":"3. kulisse: m. extensor pollicis longus. 1: APL + EPB. 2: ECRL + ECRB. 4: ED + extensor indicis. 5: EDM. 6: ECU."},{"id":"ax7-q17","t":"ax7.ue","q":"Hvilken kulisse indeholder m. extensor carpi ulnaris?","o":["3. kulisse","4. kulisse","5. kulisse","6. kulisse"],"c":3,"e":"6. kulisse. 5. kulisse er m. extensor digiti minimi."},{"id":"ax7-q18","t":"ax7.ue","q":"Hvilken nerve innerverer alle underarmens ekstensorer?","o":["N. medianus","N. ulnaris","N. radialis","N. musculocutaneus"],"c":2,"e":"N. radialis: direkte til brachioradialis og ECRL, resten via r. profundus."},{"id":"ax7-q19","t":"ax7.ue","q":"Hvad hedder r. profundus n. radialis efter passagen gennem m. supinator?","o":["N. interosseus anterior","N. interosseus posterior","N. cutaneus antebrachii posterior","N. digitalis dorsalis"],"c":1,"e":"Den passerer Frohses kanal og hedder derefter n. interosseus posterior."},{"id":"ax7-q20","t":"ax7.ue","q":"Hvilke muskler kan som de eneste flektere MCP og samtidig ekstendere PIP og DIP?","o":["M. extensor digitorum","Mm. interossei og lumbricales","M. flexor digitorum superficialis","M. extensor indicis"],"c":1,"e":"Deres sener går palmart for MCP-aksen og dorsalt for PIP-/DIP-akserne via ekstensoraponeurosen."},{"id":"ax7-q21","t":"ax7.sc","q":"Hvilken sene løber mest radialt i canalis carpi?","o":["M. flexor digitorum superficialis","M. flexor digitorum profundus","M. flexor pollicis longus","M. flexor carpi radialis"],"c":2,"e":"M. flexor pollicis longus. M. flexor carpi radialis løber i sin egen kanal."},{"id":"ax7-q22","t":"ax7.sc","q":"Hvilken bursa indeholder både de profunde og de superficielle fleksorer?","o":["Bursa radialis","Bursa ulnaris","Bursa subacromialis","Bursa subtendinea"],"c":1,"e":"Bursa ulnaris. Bursa radialis indeholder senen fra m. flexor pollicis longus."},{"id":"ax7-q23","t":"ax7.pm","q":"Hvilken af følgende muskler innerveres af n. medianus?","o":["M. adductor pollicis","M. opponens pollicis","M. abductor digiti minimi","Mm. interossei dorsales"],"c":1,"e":"½ LOAF: radiale lumbricales, opponens pollicis, abductor pollicis brevis, flexor pollicis brevis."},{"id":"ax7-q24","t":"ax7.pm","q":"Hvilken muskel adducerer tommelen?","o":["M. adductor pollicis","M. opponens pollicis","M. abductor pollicis brevis","M. flexor pollicis brevis"],"c":0,"e":"M. adductor pollicis (3. lag), innerveret af n. ulnaris."},{"id":"ax7-q25","t":"ax7.pm","q":"Hvor mange mm. interossei dorsales og palmares er der?","o":["4 dorsale og 3 palmare","3 dorsale og 4 palmare","4 dorsale og 4 palmare","3 dorsale og 3 palmare"],"c":0,"e":"4 dorsale (spreder) og 3 palmare (samler)."},{"id":"ax7-q26","t":"ax7.pm","q":"Hvor udspringer mm. lumbricales?","o":["Fra metacarpalerne","Fra tendo m. flexor digitorum profundus","Fra retinaculum flexorum","Fra aponeurosis palmaris"],"c":1,"e":"De udspringer fra senerne af m. flexor digitorum profundus og inserer i ekstensoraponeurosen."},{"id":"ax7-q27","t":"ax7.pm","q":"Hvilken lokalisation har m. palmaris brevis?","o":["I subcutis over hypothenar","Under aponeurosis palmaris i 2. lag","Mellem metacarpalerne","Under fleksorretinaklet"],"c":0,"e":"M. palmaris brevis ligger i subcutis over hypothenar og rynker huden."},{"id":"ax7-q28","t":"ax7.kl","q":"Hvor skal snittet ligge ved dekompression af karpaltunnelsyndrom?","o":["Radialt for fleksorretinaklet","Ulnart for fleksorretinaklet","Dorsalt på håndleddet","Distalt i hulhånden"],"c":1,"e":"Ulnart, for at undgå den motoriske gren til thenar, som afgår radialt fra n. medianus."},{"id":"ax7-q29","t":"ax7.kl","q":"En skiløber falder og hyperabducerer tommelen. Hvilken struktur er sandsynligvis revet over?","o":["Lig. collaterale ulnare ved MCP pollicis","Lig. radiocarpale palmare","Sene fra m. extensor pollicis longus","Lig. metacarpale transversum profundum"],"c":0,"e":"Ruptur af tommelens UCL. Ubehandlet kan den give manglende nøglegrebsfunktion."},{"id":"ax8-q1","t":"ax8.kg","q":"Hvilken arterie starter OE's kar (dvs. hedder først a. axillaris)?","o":["A. subclavia ved costa 1's laterale kant","A. brachialis","A. thoracica interna","Truncus brachiocephalicus"],"c":0,"e":"A. subclavia skifter navn til a. axillaris ved lateral kant af costa 1."},{"id":"ax8-q2","t":"ax8.kg","q":"Hvad løber foran skalenerporten?","o":["A. subclavia","Plexus brachialis","V. subclavia","N. phrenicus"],"c":2,"e":"V. subclavia løber foran m. scalenus anterior; a. subclavia og plexus brachialis løber gennem porten."},{"id":"ax8-q3","t":"ax8.kg","q":"Hvilken af følgende er IKKE en gren fra a. subclavias mediale del?","o":["A. vertebralis","A. thoracica interna","Truncus costocervicalis","A. thoracica lateralis"],"c":3,"e":"A. thoracica lateralis afgår fra a. axillaris. A. subclavias grene: vertebralis, thyrocervicalis, thoracica interna og costocervicalis."},{"id":"ax8-q4","t":"ax8.fa","q":"Hvilke strukturer løber gennem det firkantede interstice?","o":["A. circumflexa scapulae","A. circumflexa humeri posterior + n. axillaris","A. profunda brachii + n. radialis","A. thoracodorsalis + n. thoracodorsalis"],"c":1,"e":"Mediale trekantede: a. circumflexa scapulae. Firkantede: a. circumflexa humeri posterior + n. axillaris. Nedre trekantede: a. profunda brachii + n. radialis."},{"id":"ax8-q5","t":"ax8.fa","q":"Hvad løber gennem det nedre trekantede interstice?","o":["N. axillaris","N. radialis + a. profunda brachii","A. circumflexa scapulae","N. ulnaris"],"c":1,"e":"N. radialis og a. profunda brachii."},{"id":"ax8-q6","t":"ax8.fa","q":"Hvilken muskel afgrænser IKKE det mediale trekantede interstice?","o":["M. teres minor","M. teres major","M. subscapularis","M. deltoideus"],"c":3,"e":"Afgrænses af teres minor, teres major, subscapularis og caput longum af triceps."},{"id":"ax8-q7","t":"ax8.fa","q":"Hvad udgør fossa axillaris' bagvæg kranielt?","o":["M. subscapularis","M. pectoralis minor","M. serratus anterior","M. latissimus dorsi"],"c":0,"e":"Kranielt m. subscapularis; kaudalt m. latissimus dorsi + m. teres major."},{"id":"ax8-q8","t":"ax8.aa","q":"Hvilken af følgende er en gren af a. axillaris' 3. stykke?","o":["A. thoracoacromialis","A. subscapularis","A. thoracica lateralis","A. thoracica superior"],"c":1,"e":"3. stykke: a. subscapularis og aa. circumflexae humeri. 2. stykke: thoracoacromialis + thoracica lateralis."},{"id":"ax8-q9","t":"ax8.aa","q":"Hvilken arterie går gennem det mediale trekantede interstice?","o":["A. circumflexa scapulae","A. circumflexa humeri posterior","A. thoracodorsalis","A. profunda brachii"],"c":0,"e":"A. circumflexa scapulae (fra a. subscapularis) går til fossa infraspinata."},{"id":"ax8-q10","t":"ax8.aa","q":"Hvilken arterie ender i m. latissimus dorsi?","o":["A. circumflexa scapulae","A. thoracodorsalis","A. thoracica lateralis","A. thoracoacromialis"],"c":1,"e":"A. thoracodorsalis følger n. thoracodorsalis mod angulus inferior."},{"id":"ax8-q11","t":"ax8.aa","q":"Hvor deler a. brachialis sig i a. radialis og a. ulnaris?","o":["I fossa axillaris","I fossa cubitalis, proksimalt for m. pronator teres","Ved håndleddet","Ved caput humeri"],"c":1,"e":"I fossa cubitalis profundt for aponeurosis m. bicipitis brachii, proksimalt for m. pronator teres."},{"id":"ax8-q12","t":"ax8.aa","q":"Hvilken arterie afgives helt proksimalt fra a. brachialis og løber gennem nedre trekantede interstice?","o":["A. profunda brachii","A. circumflexa humeri posterior","A. thoracodorsalis","A. subscapularis"],"c":0,"e":"A. profunda brachii løber sammen med n. radialis til bagsiden af overarmen."},{"id":"ax8-q13","t":"ax8.fc","q":"Hvad afgrænser fossa cubitalis lateralt og medialt?","o":["M. brachioradialis lateralt og m. pronator teres medialt","M. biceps lateralt og m. triceps medialt","M. supinator lateralt og m. brachialis medialt","M. pronator teres lateralt og m. brachioradialis medialt"],"c":0,"e":"Lateralt m. brachioradialis, medialt m. pronator teres."},{"id":"ax8-q14","t":"ax8.fc","q":"Hvilken struktur ligger superficielt i fossa cubitalis?","o":["N. medianus","V. mediana cubiti","R. profundus n. radialis","A. brachialis"],"c":1,"e":"V. mediana cubiti ligger superficielt."},{"id":"ax8-q15","t":"ax8.ar","q":"Hvorigennem træder a. ulnaris ind i hånden?","o":["Canalis carpi","Guyons kanal, superficielt for fleksorretinaklet","Tabatieren","Frohses kanal"],"c":1,"e":"A. ulnaris løber gennem Guyons kanal og fortsætter som arcus palmaris superficialis."},{"id":"ax8-q16","t":"ax8.ar","q":"Hvor ligger arcus palmaris profundus i forhold til fleksorsenerne?","o":["Prætendinøst (foran senerne)","Retrotendinøst (bag senerne)","Superficielt for aponeurosis palmaris","I subcutis"],"c":1,"e":"Arcus profundus ligger retrotendinøst. Arcus superficialis ligger prætendinøst."},{"id":"ax8-q17","t":"ax8.ar","q":"Hvilken arterie fortsætter i arcus palmaris profundus?","o":["A. ulnaris","A. radialis","A. interossea anterior","A. princeps pollicis"],"c":1,"e":"Arcus profundus er fortsættelsen af a. radialis; arcus superficialis er fortsættelsen af a. ulnaris."},{"id":"ax8-q18","t":"ax8.ar","q":"Hvor krydser a. radialis senerne i kulisse 1 og ligger i bunden af tabatieren?","o":["Ved proc. styloideus radii, hvor den snor sig om tommelens CMC-led","Ved olecranon","Ved caput ulnae","Ved pisiforme"],"c":0,"e":"Her kan pulsen mærkes."},{"id":"ax8-q19","t":"ax8.ar","q":"Hvilken arterie afgives fra a. radialis inden arcus palmaris profundus?","o":["A. princeps pollicis","A. interossea posterior","A. digitalis dorsalis","A. thoracodorsalis"],"c":0,"e":"A. princeps pollicis og a. radialis indicis."},{"id":"ax8-q20","t":"ax8.ve","q":"Hvor ender v. cephalica?","o":["I v. brachialis","I v. axillaris efter at have perforeret trigonum clavipectorale","I v. basilica","I v. jugularis interna"],"c":1,"e":"V. cephalica perforerer trigonum clavipectorale og ender i v. axillaris."},{"id":"ax8-q21","t":"ax8.ve","q":"Hvad kendetegner vv. comitantes?","o":["De er superficielle og upar","De følger arterierne og er 2 pr. arterie","De løber kun på håndryggen","De tømmer sig direkte i v. cava superior"],"c":1,"e":"Profunde vener følger arterierne, 2 pr. arterie til en vis størrelse."},{"id":"ax8-q22","t":"ax8.ve","q":"Hvilken vene løber i sulcus bicipitalis medialis og tømmer i v. brachialis?","o":["V. cephalica","V. basilica","V. mediana cubiti","V. mediana antebrachii"],"c":1,"e":"V. basilica perforerer fascia brachii midt på armen og tømmer i v. brachialis."},{"id":"ax8-q23","t":"ax8.ly","q":"Hvilke lymfeknuder modtager fra de tre fremskudte grupper og ligger ved basis af fossa axillaris?","o":["Apikale","Centrale","Laterale","Pectorale"],"c":1,"e":"De centrale knuder dræner de fremskudte (laterale, pectorale, subscapulære) og videre til de apikale."},{"id":"ax8-q24","t":"ax8.ly","q":"Hvor ender lymfen fra venstre arm?","o":["Ductus lymphaticus dxt.","Ductus thoracicus","V. cava inferior","V. azygos"],"c":1,"e":"Venstre side (den største) dræner til ductus thoracicus, højre øvre del til ductus lymphaticus dxt."},{"id":"ax9-q1","t":"ax9.ms","q":"Hvor slutter medulla spinalis?","o":["Ved foramen magnum","Mellem L1 og L2","Ved S2","Ved coccyx"],"c":1,"e":"Medulla spinalis slutter mellem L1 og L2 (conus medullaris)."},{"id":"ax9-q2","t":"ax9.ms","q":"Hvorfor findes der 8 cervicale spinalnerver, men 7 cervicale vertebrae?","o":["C1 udspringer over første cervicale hvirvel","C8 udspringer under vertebra C8","Der er en ekstra hvirvel","T1 tælles med til halsen"],"c":0,"e":"C1 udgår over første cervicale hvirvel, og C8 udgår under C7."},{"id":"ax9-q3","t":"ax9.ms","q":"Hvad forsyner ramus dorsalis af en spinalnerve?","o":["Ekstremitetsplexerne","Den dybe rygmuskulatur og huden bagpå ryggen","Bugvæggen","Tarmen"],"c":1,"e":"Ekstremitetsplexerne dannes af rami ventrales."},{"id":"ax9-q4","t":"ax9.pb","q":"Hvilke segmenter danner truncus superior?","o":["C4 + C5","C5 + C6","C7","C8 + T1"],"c":1,"e":"Truncus superior: C5 + C6. Truncus medius: C7. Truncus inferior: C8 + T1."},{"id":"ax9-q5","t":"ax9.pb","q":"Hvilke grene danner fasciculus lateralis?","o":["Anteriore grene fra truncus superior + medius","Posteriore grene fra alle trunci","Anterior gren fra truncus inferior","Posteriore grene fra truncus superior"],"c":0,"e":"Lateralis: anteriore grene fra superior + medius. Medialis: anterior gren fra inferior. Posterior: posteriore grene fra alle."},{"id":"ax9-q6","t":"ax9.pb","q":"Hvilken nerve udgår fra fasciculus posterior?","o":["N. musculocutaneus","N. ulnaris","N. radialis","N. medianus"],"c":2,"e":"Fasciculus posterior: n. axillaris og n. radialis."},{"id":"ax9-q7","t":"ax9.pb","q":"Hvilke nerver danner n. medianus?","o":["Radix lateralis fra fasciculus lateralis og radix medialis fra fasciculus medialis","Kun fasciculus posterior","Kun fasciculus medialis","Truncus superior alene"],"c":0,"e":"N. medianus har to rødder, en lateral og en medial."},{"id":"ax9-q8","t":"ax9.pb","q":"Hvad løber IKKE gennem skalenerporten?","o":["Plexus brachialis","A. subclavia","N. phrenicus","V. subclavia"],"c":3,"e":"V. subclavia løber foran m. scalenus anterior."},{"id":"ax9-q9","t":"ax9.sn","q":"Hvilken nerve innerverer m. rhomboideus og m. levator scapulae?","o":["N. thoracodorsalis","N. dorsalis scapulae","N. suprascapularis","N. subclavius"],"c":1,"e":"N. dorsalis scapulae (C4–C5) perforerer m. scalenus medius."},{"id":"ax9-q10","t":"ax9.sn","q":"Hvilken nerve løber under lig. transversum scapulae superius?","o":["N. suprascapularis","N. axillaris","N. thoracodorsalis","N. dorsalis scapulae"],"c":0,"e":"N. suprascapularis går under lig. transversum scapulae superius og innerverer supra- og infraspinatus."},{"id":"ax9-q11","t":"ax9.sn","q":"Hvilken nerve innerverer m. latissimus dorsi?","o":["N. subscapularis","N. thoracodorsalis","N. thoracicus longus","N. pectoralis lateralis"],"c":1,"e":"N. thoracodorsalis (C6–C8), som følger a. thoracodorsalis."},{"id":"ax9-q12","t":"ax9.sn","q":"Hvilken nerve perforerer m. pectoralis minor?","o":["N. pectoralis medialis","N. pectoralis lateralis","N. thoracicus longus","N. subclavius"],"c":0,"e":"N. pectoralis medialis perforerer m. pectoralis minor; lateralis fremkommer superiort og medialt for den."},{"id":"ax9-q13","t":"ax9.mu","q":"Hvilken muskel perforeres af n. musculocutaneus?","o":["M. biceps brachii","M. brachialis","M. coracobrachialis","M. deltoideus"],"c":2,"e":"N. musculocutaneus perforerer m. coracobrachialis."},{"id":"ax9-q14","t":"ax9.mu","q":"Hvad hedder n. musculocutaneus' kutane endegren?","o":["N. cutaneus brachii medialis","N. cutaneus antebrachii lateralis","N. cutaneus antebrachii posterior","N. cutaneus brachii lateralis inferior"],"c":1,"e":"N. cutaneus antebrachii lateralis følger v. cephalica."},{"id":"ax9-q15","t":"ax9.mu","q":"Hvilken nerve snor sig om collum chirurgicum?","o":["N. radialis","N. axillaris","N. ulnaris","N. medianus"],"c":1,"e":"N. axillaris går gennem det firkantede interstice og snor sig om collum chirurgicum."},{"id":"ax9-q16","t":"ax9.me","q":"Hvilken gren af n. medianus innerverer thenar og de to radiale lumbricaler?","o":["N. interosseus anterior","R. palmaris","R. muscularis","N. digitalis palmaris communis"],"c":2,"e":"R. muscularis afgår distalt for retinaklet og løber recurrent ind i thenar."},{"id":"ax9-q17","t":"ax9.me","q":"Hvilke muskler innerverer n. interosseus anterior?","o":["M. flexor digitorum profundus (radiale del), m. flexor pollicis longus og m. pronator quadratus","M. extensor digitorum og m. supinator","M. flexor carpi ulnaris og m. pronator teres","Mm. interossei"],"c":0,"e":"N. interosseus anterior er gren af n. medianus til 3. og 4. lag i fleksorlogen."},{"id":"ax9-q18","t":"ax9.me","q":"Hvilket kutant område forsynes af n. medianus?","o":["3½ radiale fingre og radiale palma","1½ ulnare finger og ulnare palma","Håndryggen radialt","Kun tommelfingeren"],"c":0,"e":"Medianus: 3½ radiale fingre palmart og radiale palma."},{"id":"ax9-q19","t":"ax9.me","q":"Hvilken muskel i thenar innerveres IKKE af n. medianus?","o":["M. opponens pollicis","M. abductor pollicis brevis","M. adductor pollicis","M. flexor pollicis brevis"],"c":2,"e":"M. adductor pollicis innerveres af n. ulnaris."},{"id":"ax9-q20","t":"ax9.ul","q":"Hvor passerer n. ulnaris til underarmen (albuestød)?","o":["Sulcus nervi radii","Sulcus nervi ulnaris bag epicondylus medialis","Foran epicondylus lateralis","Gennem canalis carpi"],"c":1,"e":"Bag epicondylus medialis i sulcus nervi ulnaris."},{"id":"ax9-q21","t":"ax9.ul","q":"Hvilken gren af n. ulnaris er rent motorisk?","o":["R. superficialis","R. dorsalis","R. profundus","R. palmaris"],"c":2,"e":"R. profundus: hypothenar, interossei, lumbricales III + IV og m. adductor pollicis."},{"id":"ax9-q22","t":"ax9.ul","q":"Hvor passerer n. ulnaris fleksorretinaklet?","o":["Gennem canalis carpi","Superficielt for retinaklet i Guyons kanal","Dybt for retinaklet","Gennem tabatieren"],"c":1,"e":"Guyons kanal, sammen med a. ulnaris."},{"id":"ax9-q23","t":"ax9.ul","q":"Hvilket kutant område forsynes af n. ulnaris dorsalt?","o":["2½ ulnare fingre","3½ radiale fingre","Kun lillefingeren","Hele håndryggen"],"c":0,"e":"Dorsalt de 2½ ulnare fingre (r. dorsalis), palmart de 1½ ulnare fingre."},{"id":"ax9-q24","t":"ax9.ra","q":"Hvor passerer n. radialis fra fossa axillaris til ekstensorlogen?","o":["Det mediale trekantede interstice","Det firkantede interstice","Det nedre trekantede interstice","Skalenerporten"],"c":2,"e":"Det nedre trekantede interstice, sammen med a. profunda brachii."},{"id":"ax9-q25","t":"ax9.ra","q":"Hvad hedder r. profundus n. radialis efter Frohses kanal?","o":["N. interosseus anterior","N. interosseus posterior","N. cutaneus antebrachii posterior","N. digitalis dorsalis"],"c":1,"e":"Efter passagen af m. supinator hedder den n. interosseus posterior."},{"id":"ax9-q26","t":"ax9.ra","q":"Hvilken gren af n. radialis er rent motorisk til underarmens ekstensorer?","o":["R. superficialis","R. profundus","N. cutaneus brachii posterior","N. cutaneus antebrachii posterior"],"c":1,"e":"R. profundus. R. superficialis er sensorisk til den radiale håndryg og 2½ radiale fingre."},{"id":"ax9-q27","t":"ax9.ki","q":"Hvilket segment repræsenterer ekstension i albuen (m. triceps brachii)?","o":["C5","C6","C7","C8"],"c":2,"e":"C5 abduktion i skulder, C6 albuefleksion (biceps), C7 albueekstension (triceps), C8 fleksion i yderled på de ulnare fingre."},{"id":"ax9-q28","t":"ax9.ki","q":"Hvilken nervelæsion giver drophånd?","o":["N. medianus","N. ulnaris","N. radialis","N. axillaris"],"c":2,"e":"N. radialis: drophånd. N. ulnaris: klohånd. N. medianus: sværgehånd."},{"id":"ax9-q29","t":"ax9.ki","q":"Hvilken læsion giver Duchenne-Erbs parese?","o":["Truncus superior (C5–C6)","Truncus inferior (C8–T1)","Fasciculus posterior","N. ulnaris"],"c":0,"e":"Duchenne-Erb: ofte truncus superior. Klumpke: ofte truncus inferior."},{"id":"ax9-q30","t":"ax9.ki","q":"Hvordan testes n. medianus motorisk?","o":["Abduktion i skulder","Opposition af tommelen (m. opponens pollicis)","Dorsalfleksion i håndled","Spredning af fingrene"],"c":1,"e":"N. medianus: m. opponens pollicis. Spredning af fingrene: n. ulnaris (interossei)."},{"id":"ax10-q1","t":"ax10.bk","q":"Hvilke tre knogler danner os coxae hos barnet, forbundet ved en Y-formet primær synchondrose?","o":["Os ilium, os ischii, os pubis","Os ilium, os sacrum, os pubis","Femur, os ilium, os ischii","Os pubis, os sacrum, os coccygis"],"c":0,"e":"Os ilium (øverst), os ischii (bagerst, nedre) og os pubis (nederst, forrest) mødes ved acetabulum."},{"id":"ax10-q2","t":"ax10.bk","q":"Hvor stor en andel af acetabulum danner os ilium?","o":["Superiore 2/5","Dorsale 2/5","Ventrale 1/5","Halvdelen"],"c":0,"e":"Os ilium danner de superiore 2/5, os ischii de dorsale 2/5 og os pubis de ventrale 1/5."},{"id":"ax10-q3","t":"ax10.bk","q":"Hvad udspringer fra spina iliaca anterior inferior (SIAI)?","o":["M. sartorius","M. rectus femoris og lig. iliofemorale","Lig. inguinale","M. tensor fasciae latae"],"c":1,"e":"Fra SIAI udspringer m. rectus femoris og lig. iliofemorale. Fra SIAS udspringer lig. inguinale, m. tensor fasciae latae og m. sartorius."},{"id":"ax10-q4","t":"ax10.bk","q":"Hvad omdanner lig. transversum acetabuli incisura acetabuli til?","o":["Foramen obturatum","Foramen acetabulare","Fossa acetabuli","Facies lunata"],"c":1,"e":"Lig. transversum acetabuli omdanner incisura acetabuli til foramen acetabulare."},{"id":"ax10-q5","t":"ax10.bl","q":"Hvilken klassifikation har symphysis pubica?","o":["Ægte glideled","Syndesmose","Symfyse (uægte led, sekundær synkondrose)","Synostose"],"c":2,"e":"Symphysis pubica er en symfyse: et uægte led, sekundær synkondrose, med discus interpubicus."},{"id":"ax10-q6","t":"ax10.bl","q":"Hvilke to ligamenter opdeler incisurae ischiadicae i foramen ischiadicus majus og minus?","o":["Lig. sacrospinale og lig. sacrotuberale","Lig. iliolumbale og lig. inguinale","Lig. sacroiliaca ventralia og posteriora","Lig. pubicum superius og arcuatum"],"c":0,"e":"Lig. sacrospinale og lig. sacrotuberale opdeler incisura ischiadica i foramen majus og minus."},{"id":"ax10-q7","t":"ax10.fe","q":"Hvor på femur findes linea aspera?","o":["På corpus femoris' bagflade","På collum femoris","På extremitas proximalis' forflade","På facies patellaris"],"c":0,"e":"Linea aspera med labium mediale og laterale findes på corpus femoris' bagflade."},{"id":"ax10-q8","t":"ax10.hl","q":"Hvilket ligament begrænser primært ekstension i hofteleddet?","o":["Lig. pubofemorale","Lig. ischiofemorale","Lig. iliofemorale","Lig. capitis femoris"],"c":2,"e":"Lig. iliofemorale begrænser ekstension. Sammen med de øvrige kapselligamenter reduceres frihedsgraderne fra 3 til 1 ved fuld ekstension."},{"id":"ax10-q9","t":"ax10.hl","q":"Hvilken struktur hæfter i fovea capitis femoris?","o":["Labrum acetabulare","Lig. capitis femoris","Lig. iliofemorale","Zona orbicularis"],"c":1,"e":"Lig. capitis femoris går fra fovea capitis til lig. transversum acetabuli og er vigtig for karforsyningen under vækst."},{"id":"ax10-q10","t":"ax10.hl","q":"Hvorfor er hofteleddet mere stabilt end skulderleddet?","o":["Ledkapslen er tyndere","Acetabulum er dybere og større ift. ledhovedet","Der er flere muskler omkring det","Ledbrusken er tykkere"],"c":1,"e":"Den dybere, større ledskål (acetabulum) giver hofteleddet markant mere stabilitet end skulderleddets flade cavitas glenoidalis."},{"id":"ax10-q11","t":"ax10.hm","q":"Hvilken nerve innerverer m. gluteus medius og minimus samt m. tensor fasciae latae?","o":["N. gluteus inferior","N. gluteus superior","N. obturatorius","N. ischiadicus"],"c":1,"e":"N. gluteus superior innerverer 2. og 3. lag (medius, minimus) samt m. tensor fasciae latae i 1. lag."},{"id":"ax10-q12","t":"ax10.hm","q":"Hvad sker der ved svigt af m. gluteus medius under gang?","o":["Hoften hyperekstenderer","'Hip drop' - bækkenet falder mod svingbenssiden","Knæet låser sig","Foden drop-fodes"],"c":1,"e":"Uden m. gluteus medius' kontrol bliver adduktionen fra bækkenkipningen overdrevet, og man ser et 'hip drop'."},{"id":"ax10-q13","t":"ax10.hm","q":"Hvilken muskel er den eneste af hofteleddets små udadrotatorer, der innerveres fra plexus lumbalis?","o":["M. piriformis","M. quadratus femoris","M. obturatorius externus","M. obturatorius internus"],"c":2,"e":"M. obturatorius externus innerveres af n. obturatorius fra plexus lumbalis; de øvrige får direkte grene fra plexus sacralis."},{"id":"ax10-q14","t":"ax10.hm","q":"Hvad opdeler m. piriformis foramen ischiadicum majus i?","o":["Lacuna musculorum og vasorum","Foramen suprapiriforme og infrapiriforme","Canalis obturatorius og adductorius","Trigonum femorale og canalis adductorius"],"c":1,"e":"M. piriformis løber gennem foramen ischiadicum majus og deler det i foramen suprapiriforme og infrapiriforme."},{"id":"ax10-q15","t":"ax10.lm","q":"Hvilken nerve innerverer lårets forreste loge?","o":["N. femoralis","N. obturatorius","N. ischiadicus","N. tibialis"],"c":0,"e":"Forreste loge (m. sartorius, m. quadriceps femoris): n. femoralis."},{"id":"ax10-q16","t":"ax10.lm","q":"Hvilken muskel indgår IKKE i pes anserinus?","o":["M. sartorius","M. gracilis","M. semitendinosus","M. semimembranosus"],"c":3,"e":"Pes anserinus dannes af sartorius, gracilis og semitendinosus. Semimembranosus insererer selvstændigt med tre ben."},{"id":"ax10-q17","t":"ax10.lm","q":"Hvad er patellas funktion som sesamknogle?","o":["Den beskytter kun leddet","Den forlænger m. quadriceps' kraftarm","Den stabiliserer menisken","Den er en del af tractus iliotibialis"],"c":1,"e":"Som sesamknogle forlænger patella momentarmen/kraftarmen for m. quadriceps femoris."},{"id":"ax10-q18","t":"ax10.lm","q":"Hvilken struktur passerer gennem hiatus adductorius?","o":["N. femoralis","Vasa femoralia til fossa poplitea","N. obturatorius","Tractus iliotibialis"],"c":1,"e":"Hiatus adductorius er den nederste, største åbning i m. adductor magnus' insertion og fører vasa femoralia til fossa poplitea."},{"id":"ax10-q19","t":"ax10.lm","q":"Hvilken nerve innerverer adduktorgruppen på låret?","o":["N. femoralis","N. obturatorius","N. ischiadicus","N. gluteus inferior"],"c":1,"e":"N. obturatorius innerverer adduktorgruppen (m. pectineus får desuden grene fra n. femoralis, og m. adductor magnus fra n. ischiadicus)."},{"id":"ax10-q20","t":"ax10.lm","q":"Hvilke muskler afgrænser trigonum femorale medialt og lateralt?","o":["Medialt m. adductor longus, lateralt m. sartorius","Medialt m. sartorius, lateralt m. gracilis","Medialt m. pectineus, lateralt m. iliopsoas","Medialt m. gracilis, lateralt m. adductor longus"],"c":0,"e":"Kranielt lig. inguinale, lateralt-kaudalt m. sartorius, medialt m. adductor longus."},{"id":"ax10-q21","t":"ax10.lm","q":"Hvilken nerve perforerer canalis adductorius?","o":["N. femoralis","N. saphenus","N. obturatorius","N. ischiadicus"],"c":1,"e":"N. saphenus (gren af n. femoralis) perforerer canalis adductorius sammen med vasa femoralia."},{"id":"ax11-q1","t":"ax11.tr","q":"Hvad afgrænser trigonum femorale medialt?","o":["M. sartorius","M. adductor longus","Lig. inguinale","M. iliopsoas"],"c":1,"e":"Medialt afgrænses trigonum femorale af m. adductor longus; lateralt-kaudalt af m. sartorius; kranielt af lig. inguinale."},{"id":"ax11-q2","t":"ax11.kn","q":"Hvad er patella anatomisk set?","o":["En sesamknogle","En del af tibias epifyse","Et ledbånd","En del af femurs condyl"],"c":0,"e":"Patella er en stor sesamknogle indlejret i m. quadriceps' insertionssene, som forøger dens kraftarm."},{"id":"ax11-q3","t":"ax11.kn","q":"Hvilken struktur på tibia hedder tuberculum anterolaterale?","o":["Tuberculum Gerdy","Eminentia intercondylaris","Malleolus medialis","Linea m. solei"],"c":0,"e":"Tuberculum anterolaterale (Gerdy) findes proksimalt på tibia."},{"id":"ax11-q4","t":"ax11.kf","q":"Hvorfor inddeles art. genus i tre dele (pars femoropatellaris, -tibialis med. og lat.)?","o":["Fordi der er tre separate knogler","Fordi leddet anlægges som tre selvstændige ledhuler, der vokser sammen","Fordi der er tre ligamenter","Fordi der er tre bevægeakser"],"c":1,"e":"De tre dele stammer fra tre selvstændige ledhuler tidligt i fosterlivet, som vokser sammen."},{"id":"ax11-q5","t":"ax11.kf","q":"Hvilken menisk er hyppigst udsat for læsioner, og hvorfor?","o":["Den laterale, fordi den er mest mobil","Den mediale, fordi den er mere fikseret og mindre mobil","Den laterale, fordi den er størst","Den mediale, fordi den er avaskulær"],"c":1,"e":"Den mediale menisk er mere fikseret bl.a. pga. kraftig binding til lig. collaterale tibiale og direkte forbindelse til ledkapslen hele vejen rundt."},{"id":"ax11-q6","t":"ax11.kf","q":"Hvad forøger m. quadriceps femoris' kraftarm ved insertion på tibia?","o":["Menisken","Patella som sesamknogle","Lig. cruciatum anterius","Plica synovialis"],"c":1,"e":"Patella fungerer som en sesamknogle, der forøger momentarmen for m. quadriceps femoris."},{"id":"ax11-q7","t":"ax11.kl_lig","q":"Hvilket korsbånd begrænser fremadglidning af tibia?","o":["Lig. cruciatum posterius (PCL)","Lig. cruciatum anterius (ACL)","Lig. collaterale tibiale","Lig. collaterale fibulare"],"c":1,"e":"ACL begrænser fremadglidning (og indadrotation) af tibia; PCL begrænser bagudglidning."},{"id":"ax11-q8","t":"ax11.kl_lig","q":"Hvad betyder huskereglen LAMP for korsbåndene?","o":["Anterior til lateral condyl, posterior til medial condyl","Anterior til medial condyl, posterior til lateral condyl","Alle ligamenter mangler posteriort","Ligamenterne krydser aldrig"],"c":0,"e":"LAMP: Anterior-Lateral, Posterior-Medial — ACL fæstner til indersiden af den laterale condyl, PCL til indersiden af den mediale."},{"id":"ax11-q9","t":"ax11.kl_lig","q":"Hvilken struktur dækker synovialmembranen IKKE?","o":["Ligg. cruciata","Menisci","Corpus adiposum infrapatellare","Fossa intercondylaris"],"c":1,"e":"Synovialmembranen afbrydes ved menisci; den beklæder derimod korsbåndene på siderne."},{"id":"ax11-q10","t":"ax11.kl_lig","q":"Hvilket ligament kan let palperes, fordi det er strengformet?","o":["Lig. collaterale tibiale","Lig. collaterale fibulare","Lig. popliteum obliquum","Lig. patellofemorale mediale"],"c":1,"e":"Lig. collaterale fibulare (laterale) er strengformet og let at palpere, i modsætning til det brede, flade tibiale kollateralligament."},{"id":"ax11-q11","t":"ax11.kkl","q":"Hvilken klassifikation har syndesmosis tibiofibularis?","o":["Ægte glideled","Symfyse","Uægte led, syndesmose","Synostose"],"c":2,"e":"Syndesmosis tibiofibularis er et uægte led (syndesmose), udgjort af membrana interossea og ligg. tibiofibularia."},{"id":"ax11-q12","t":"ax11.kkl","q":"Hvad sker der med fibula ved dorsifleksion af ankelleddet?","o":["Den skubbes distalt","Den skubbes væk fra tibia og trækkes proksimalt","Den roterer indad","Intet, den er fikseret"],"c":1,"e":"Grundet membrana interosseas distal-laterale fiberretning skubbes fibula væk fra tibia og trækkes proksimalt ved dorsifleksion."},{"id":"ax11-q13","t":"ax11.ue_","q":"Hvilken nerve innerverer hele ekstensorlogen?","o":["N. tibialis","N. peroneus superficialis","N. peroneus profundus","N. femoralis"],"c":2,"e":"Ekstensorlogens fire muskler innerveres af n. peroneus (fibularis) profundus."},{"id":"ax11-q14","t":"ax11.ue_","q":"Hvilken muskel løber i ekstensorretinaklets 1. kulisse?","o":["M. extensor hallucis longus","M. tibialis anterior","M. extensor digitorum longus","M. peroneus tertius"],"c":1,"e":"Huskeregel TIB-HAL-VAN-DIG: 1. kulisse er m. tibialis anterior."},{"id":"ax11-q15","t":"ax11.pe","q":"Hvilken nerve innerverer peroneerlogen?","o":["N. peroneus profundus","N. peroneus superficialis","N. tibialis","N. suralis"],"c":1,"e":"Peroneerlogen (m. peroneus longus et brevis) innerveres af n. peroneus superficialis."},{"id":"ax11-q16","t":"ax11.pe","q":"Hvor insererer m. peroneus longus?","o":["Tuberositas ossis metatarsalis I","Tuberositas ossis metatarsalis V","Basis phalanx distalis I","Tuber calcanei"],"c":0,"e":"M. peroneus longus insererer på tuberositas ossis metatarsalis I, efter at have krydset under foden."},{"id":"ax11-q17","t":"ax11.fl","q":"Hvilken muskel regnes med til fleksorlogens profunde gruppe, men flekterer også knæet ved at udadrotere femur?","o":["M. tibialis posterior","M. popliteus","M. flexor hallucis longus","M. soleus"],"c":1,"e":"M. popliteus indadroterer crus / udadroterer femur og kan låse knæet op."},{"id":"ax11-q18","t":"ax11.fl","q":"Hvad er chiasma cruris?","o":["Krydsningen mellem m. tibialis posterior og m. flexor digitorum longus bag på tibia","Krydsningen mellem de to hoveder af m. gastrocnemius","Krydsningen af peroneus-senerne","Krydsningen i planta pedis"],"c":0,"e":"M. tibialis posterior og m. flexor digitorum longus krydser bag på tibia i chiasma cruris; krydsningen i foden hedder chiasma plantare."},{"id":"ax11-q19","t":"ax11.fl","q":"Hvilken kulisse i fleksorretinaklet indeholder m. flexor hallucis longus?","o":["1. kulisse","2. kulisse","3. kulisse","4. kulisse"],"c":3,"e":"Huskeregel TIB-DIG-VAN-HAL: 4. kulisse er m. flexor hallucis longus."},{"id":"ax11-q20","t":"ax11.ga","q":"Hvor stor en del af gangcyklussen udgør standfasen omtrent?","o":["40 %","50 %","60 %","80 %"],"c":2,"e":"Standfasen udgør ca. 60 % af tiden, svingfasen ca. 40 %."},{"id":"ax11-q21","t":"ax11.ga","q":"Hvilken muskel giver den aktive plantarfleksion ved afsæt under gang?","o":["M. tibialis anterior","M. triceps surae","M. quadriceps femoris","M. iliopsoas"],"c":1,"e":"Afsættet er aktiv plantarfleksion via m. triceps surae."},{"id":"ax12-q1","t":"ax12.fk","q":"Hvor mange knogler har tarsus, og hvordan fordeler de sig?","o":["7, i en proksimal (2) og distal (5) række","8, i to rækker af 4","7, alle i én række","5, i en proksimal (3) og distal (2) række"],"c":0,"e":"7 knogler: proksimalt talus og calcaneus (2), distalt naviculare, tre cuneiforme og cuboideum (5)."},{"id":"ax12-q2","t":"ax12.fk","q":"Hvilken fodrodsknogle har ingen muskeltilhæftning?","o":["Calcaneus","Talus","Os cuboideum","Os naviculare"],"c":1,"e":"Talus har ingen muskeltilhæftning — kun ledflader og ligamenttilhæftninger."},{"id":"ax12-q3","t":"ax12.fk","q":"Hvad er sustentaculum tali?","o":["En ledflade på talus","En 'hylde' på calcaneus, der understøtter talus","Et ligament mellem naviculare og cuboideum","En kanal i os cuboideum"],"c":1,"e":"Sustentaculum tali er en fremspringende hylde medialt på calcaneus, som understøtter talus; m. flexor hallucis longus løber under den."},{"id":"ax12-q4","t":"ax12.fk","q":"Hvor mange phalanges har hallux (storetåen)?","o":["Tre","To","Fire","Én"],"c":1,"e":"Hallux har kun proximalis og distalis, i modsætning til de øvrige tæer der har tre phalanges."},{"id":"ax12-q5","t":"ax12.fm","q":"Hvilken nerve innerverer m. extensor digitorum brevis?","o":["N. peroneus profundus","N. plantaris lateralis","N. plantaris medialis","N. tibialis"],"c":0,"e":"N. peroneus profundus innerverer m. extensor digitorum brevis (og hallucis brevis)."},{"id":"ax12-q6","t":"ax12.pp","q":"Hvor udspringer aponeurosis plantaris fra?","o":["Tuber calcanei","Basis af metatarsalerne","Sustentaculum tali","Malleolus medialis"],"c":0,"e":"Aponeurosis plantaris udspringer fra tuber calcanei (proc. medialis et lateralis)."},{"id":"ax12-q7","t":"ax12.lag","q":"Hvilke muskler udgør fodsålens 1. lag?","o":["M. abductor hallucis, m. flexor digitorum brevis, m. abductor digiti minimi","M. quadratus plantae og mm. lumbricales","M. flexor hallucis brevis og m. adductor hallucis","Mm. interossei plantares et dorsales"],"c":0,"e":"1. lag, 'Abduktorerne': abductor hallucis, flexor digitorum brevis, abductor digiti minimi — alle fra tuber calcanei."},{"id":"ax12-q8","t":"ax12.lag","q":"Hvor udspringer m. quadratus plantae, og hvad er dens funktion?","o":["Fra tuber calcanei; støtter m. flexor digitorum longus","Fra ossa cuneiformia; fleksion af storetå","Fra metatarsal 5; abduktion af lilletå","Fra lig. plantare longum; adduktion"],"c":0,"e":"M. quadratus plantae udspringer fra processus lateralis og medialis tuberis calcanei og støtter m. flexor digitorum longus."},{"id":"ax12-q9","t":"ax12.lag","q":"Hvilken retning spreder mm. interossei dorsales i foden tæerne, sammenlignet med interossei plantares?","o":["Dorsales spreder, plantares samler — som på hånden","Dorsales samler, plantares spreder","Begge spreder","Begge samler"],"c":0,"e":"Som på hånden: de dorsale driver tæerne væk (abduktion), de plantare parkerer dem (adduktion) mod 2. tå."},{"id":"ax12-q10","t":"ax12.lag","q":"Fodens længdeakse for interossei-funktionen går gennem hvilken tå?","o":["1. tå","2. tå","3. tå","5. tå"],"c":1,"e":"I modsætning til hånden (3. finger) går fodens længdeakse gennem 2. tå."},{"id":"ax12-q11","t":"ax12.kn_","q":"Hvilken nerve på foden er homolog med håndens n. ulnaris?","o":["N. plantaris medialis","N. plantaris lateralis","N. peroneus profundus","N. suralis"],"c":1,"e":"N. plantaris lateralis er homolog med n. ulnaris og innerverer størstedelen af fodens egne muskler."},{"id":"ax12-q12","t":"ax12.kn_","q":"Hvilken arterie fortsætter som arcus plantaris?","o":["R. profundus fra a. plantaris lateralis (og medialis)","A. dorsalis pedis alene","A. tibialis anterior direkte","A. peronea"],"c":0,"e":"Arcus plantaris dannes af de dybe grene fra a. plantaris lateralis (og modtager bidrag fra medialis)."},{"id":"ax12-q13","t":"ax12.fl","q":"Hvilken klassifikation har art. talocruralis?","o":["Ægte, enkelt kugleled","Ægte, sammensat hængselled","Uægte led, syndesmose","Ægte glideled"],"c":1,"e":"Art. talocruralis er et ægte, sammensat hængselled mellem talus, tibia og fibula."},{"id":"ax12-q14","t":"ax12.fl","q":"Hvilket ligament forstuves hyppigst ved et 'vriklet' traume?","o":["Lig. deltoideum","Lig. talofibulare anterius","Lig. calcaneofibulare","Lig. bifurcatum"],"c":1,"e":"Lig. talofibulare anterius har kun ca. 20 kg trækstyrke og forstuves hyppigst ved plantarfleksion-inversions-traumer."},{"id":"ax12-q15","t":"ax12.fl","q":"Hvilke to ledhuler udgør art. subtalaris?","o":["Art. talocalcanea og art. talocalcaneonavicularis","Art. talocruralis og art. tarsi transversa","Art. tarsometatarsalis og art. talocalcanea","Chopart's og Lisfrancs led"],"c":0,"e":"Art. subtalaris består af art. talocalcanea (bagest) og art. talocalcaneonavicularis (forrest), adskilt af sinus tarsi."},{"id":"ax12-q16","t":"ax12.fl","q":"Hvad kaldes art. tarsi transversa i daglig tale, og hvad svarer den til på hånden?","o":["Lisfrancs led; svarer til CMC-leddene","Chopart's led; svarer til art. mediocarpalis","Chopart's led; svarer til art. radiocarpalis","Lisfrancs led; svarer til art. mediocarpalis"],"c":1,"e":"Art. tarsi transversa kaldes Chopart's led og svarer funktionelt til art. mediocarpalis."},{"id":"ax12-q17","t":"ax12.fl","q":"Hvad kaldes leddet mellem fodrodsknoglerne og metatarsalerne i daglig tale?","o":["Chopart's led","Lisfrancs led","Syndesmosis tibiofibularis","Art. subtalaris"],"c":1,"e":"Artt. tarsometatarsales kaldes Lisfrancs led/linje og er en hyppig amputationslinje."},{"id":"ax12-q18","t":"ax12.fb","q":"Hvilke knogler indgår i den indre (mediale) længdebue?","o":["Calcaneus, talus, naviculare, cuneiformia, metatarsale I-III","Calcaneus, cuboideum, metatarsale IV-V","Cuneiformia og basis af metatarsale II-III","Kun calcaneus og talus"],"c":0,"e":"Den mediale længdebue omfatter calcaneus, talus, os naviculare, ossa cuneiformia og metatarsale I-III."},{"id":"ax12-q19","t":"ax12.fb","q":"Hvad stabiliserer den ydre (laterale) længdebue?","o":["Aponeurosis plantaris og m. tibialis posterior","Lig. plantare longum et breve samt m. peroneus longus","M. adductor hallucis alene","Lig. deltoideum"],"c":1,"e":"Den laterale bue er statisk og stabiliseres af lig. plantare longum et breve samt m. peroneus longus."},{"id":"ax12-q20","t":"ax12.fb","q":"Hvorfor kan fodens knogler (ca. 100 g) bære 4-5 gange kropsvægten?","o":["Fordi de er meget tætte","Fordi de er arrangeret i en trekantskonstruktion der fordeler vægten","Fordi calcaneus alene bærer det hele","Fordi der ikke er nogen led i foden"],"c":1,"e":"Trekantskonstruktionen af fodens buer fordeler kropsvægten ud over hele foden."},{"id":"ax13-q1","t":"ax13.pl","q":"Hvilke segmenter danner plexus lumbalis og plexus sacralis?","o":["Lumbalis T12-L4, sacralis L4-S4","Lumbalis L1-L5, sacralis S1-S5","Lumbalis T12-L2, sacralis L3-S4","Lumbalis L2-S1, sacralis S1-S5"],"c":0,"e":"Plexus lumbalis: T12-L4. Plexus sacralis: L4-S4. De kædes sammen af truncus lumbosacralis (L4-L5)."},{"id":"ax13-q2","t":"ax13.pl","q":"Hvilke to muskler innerveres direkte fra plexus lumbalis (ikke via en navngiven perifer nerve)?","o":["M. quadratus lumborum og m. psoas major","M. iliacus og m. sartorius","M. piriformis og m. obturatorius internus","M. gluteus medius og minimus"],"c":0,"e":"Plekset indlejres mellem m. psoas majors udspring og innerverer direkte m. quadratus lumborum og m. psoas major."},{"id":"ax13-q3","t":"ax13.lu","q":"Hvilken nerve er den eneste, der løber på forfladen af m. psoas major?","o":["N. femoralis","N. genitofemoralis","N. obturatorius","N. cutaneus femoris lateralis"],"c":1,"e":"N. genitofemoralis perforerer og descenderer på forfladen af m. psoas major - god spotteknik."},{"id":"ax13-q4","t":"ax13.lu","q":"Hvilken nerve er den eneste placeret medialt for m. psoas major?","o":["N. femoralis","N. genitofemoralis","N. obturatorius","N. iliohypogastricus"],"c":2,"e":"N. obturatorius er den eneste gren placeret medialt for m. psoas major."},{"id":"ax13-q5","t":"ax13.lu","q":"Hvilket segment har n. femoralis?","o":["L1-L2","L2-L4","L2-L3","L4-S1"],"c":1,"e":"N. femoralis har segment L2-L4."},{"id":"ax13-q6","t":"ax13.lu","q":"Hvad innerverer n. obturatorius' r. anterior motorisk?","o":["Mm. adductores longus et brevis, gracilis, pectineus","M. quadriceps femoris","M. obturatorius externus","Hasemusklerne"],"c":0,"e":"R. anterior innerverer de overfladiske adduktorer; r. posterior innerverer m. obturatorius externus og del af m. adductor magnus."},{"id":"ax13-q7","t":"ax13.tf","q":"Hvor perforerer n. saphenus canalis adductorius (SPOT)?","o":["Gennem membrana vastoadductoria","Gennem hiatus adductorius","Gennem lacuna vasorum","Gennem foramen ischiadicum"],"c":0,"e":"N. saphenus forlader canalis adductorius ved at perforere membrana vastoadductoria."},{"id":"ax13-q8","t":"ax13.sa","q":"Hvad passerer gennem foramen suprapiriforme?","o":["N. ischiadicus","N. gluteus superior og a. glutea superior","N. pudendus","N. cutaneus femoris posterior"],"c":1,"e":"Foramen suprapiriforme: n. gluteus superior + a. glutea superior. Resten passerer infrapiriforme."},{"id":"ax13-q9","t":"ax13.sa","q":"Hvilken nerve innerverer m. gluteus maximus?","o":["N. gluteus superior","N. gluteus inferior","N. ischiadicus direkte","N. pudendus"],"c":1,"e":"N. gluteus inferior (L5-S2) innerverer udelukkende m. gluteus maximus."},{"id":"ax13-q10","t":"ax13.sa","q":"Hvad står huskereglen 'S2, S3, S4' for?","o":["N. ischiadicus' segmenter","N. pudendus' segmenter (keeps the shit off the floor)","Plexus sacralis' øvre grænse","N. gluteus inferiors segmenter"],"c":1,"e":"N. pudendus (S2-S4) innerverer bækkengulv og sphinctere - 'keeps the shit off the floor'."},{"id":"ax13-q11","t":"ax13.is","q":"Hvor deler n. ischiadicus sig i n. tibialis og n. peroneus communis?","o":["Ved foramen infrapiriforme","Ved øverste spids af fossa poplitea","Ved collum fibulae","Ved malleolus medialis"],"c":1,"e":"Delingen sker typisk ved den proksimale spids af fossa poplitea (kan dog variere - høj vs. lav deling)."},{"id":"ax13-q12","t":"ax13.is","q":"Hvilken nerve er homolog med n. radialis?","o":["N. tibialis","N. peroneus communis","N. plantaris medialis","N. saphenus"],"c":1,"e":"N. peroneus communis (posterior ekstensorkomponent) er homolog med n. radialis; n. tibialis er homolog med n. medianus/ulnaris."},{"id":"ax13-q13","t":"ax13.is","q":"Hvor snor n. peroneus communis sig om, på vej ind i peroneerlogen?","o":["Collum fibulae","Malleolus lateralis","Caput tali","Tuber calcanei"],"c":0,"e":"N. peroneus communis snor sig om collum fibulae, hvilket gør den udsat for tryklæsion her."},{"id":"ax13-q14","t":"ax13.is","q":"Hvilken nerve innerverer m. extensor digitorum brevis motorisk?","o":["N. peroneus superficialis","N. peroneus profundus","N. plantaris lateralis","N. suralis"],"c":1,"e":"N. peroneus profundus passerer 3. kulisse og innerverer bl.a. m. extensor digitorum brevis."},{"id":"ax13-q15","t":"ax13.kl","q":"Hvad tester Lasègues test, og hvad angiver et positivt resultat?","o":["Styrke i m. quadriceps; svaghed","Strakt benløft; smerte distalt for knæet før 60° løft tyder på L5/S1-affektion","Ankelrefleks; nedsat refleks","Hoftefleksion; nedsat bevægelse"],"c":1,"e":"Lasègues test er positiv, når smerter stråler distalt for knæet, før benet er løftet over 60°, og peger på L5/S1-affektion."},{"id":"ax13-q16","t":"ax13.kl","q":"Hvilken muskel testes for segment L5?","o":["M. quadriceps femoris","M. tibialis anterior","M. extensor hallucis longus","Mm. peronei"],"c":2,"e":"L5 testes med m. extensor hallucis longus. L4: tibialis anterior. S1: peronei."},{"id":"ax13-q17","t":"ax13.ka","q":"Hvilken arterie fortsætter a. poplitea som efter hiatus adductorius?","o":["A. femoralis","A. poplitea er selv fortsættelsen af a. femoralis efter hiatus adductorius","A. iliaca externa","A. profunda femoris"],"c":1,"e":"A. femoralis fortsætter som a. poplitea efter hiatus adductorius."},{"id":"ax13-q18","t":"ax13.ka","q":"Hvilke tre grene deler a. poplitea sig i?","o":["A. tibialis anterior, a. tibialis posterior, a. peronea","A. dorsalis pedis, a. plantaris medialis, a. plantaris lateralis","A. femoralis, a. profunda femoris, a. circumflexa","A. tibialis anterior, a. dorsalis pedis, a. arcuata"],"c":0,"e":"A. poplitea deler sig i tre grene, én til hver muskelloge i underbenet."},{"id":"ax13-q19","t":"ax13.ka","q":"Hvad bliver a. tibialis anterior til distalt, efter den passerer ekstensorretinaklet?","o":["A. dorsalis pedis","A. plantaris lateralis","A. peronea","A. arcuata alene"],"c":0,"e":"A. tibialis anterior fortsætter som a. dorsalis pedis efter 3. kulisse i ekstensorretinaklet."},{"id":"ax13-q20","t":"ax13.ve","q":"Hvor tømmer v. saphena magna sig?","o":["I v. poplitea","I v. femoralis via hiatus saphenus","I v. tibialis posterior","I v. saphena parva"],"c":1,"e":"V. saphena magna tømmer sig i v. femoralis via hiatus saphenus i fascia lata."},{"id":"ax13-q21","t":"ax13.ve","q":"Hvor munder v. saphena parva ud?","o":["I v. femoralis","I v. poplitea","I v. saphena magna ved knæet","I v. tibialis anterior"],"c":1,"e":"V. saphena parva perforerer fascia cruris i fossa poplitea og munder i v. poplitea."},{"id":"ax14-q1","t":"ax14.cv","q":"Hvor mange vertebrae er der i de præsacrale segmenter?","o":["19","23","24","29"],"c":1,"e":"7 cervicale + 12 thoracale + 5 lumbale = 24... men de præsacrale tælles til 23, da man ofte medregner overgangen; her følger vi underviserens angivelse på 23 stk."},{"id":"ax14-q2","t":"ax14.cv","q":"Hvad skyldes lændelordosen anatomisk?","o":["Kileformede vertebrae","Kileformede disci","Facetleddenes orientering","Lig. flavums elasticitet"],"c":1,"e":"Lændelordosen skyldes kileformede disci intervertebrales; brystkyfosen skyldes kileformede vertebrae."},{"id":"ax14-q3","t":"ax14.cv","q":"Hvilken del af en vertebra kaldes 'den lille fod'?","o":["Lamina","Pediculus","Processus transversus","Ambitus eminens"],"c":1,"e":"Pediculus ('lille fod') er afgangen af arcus vertebrae fra corpus' bagflade."},{"id":"ax14-q4","t":"ax14.cv","q":"Hvordan er corpus formet på en thorakal vertebra?","o":["Rektangulær med uncus corporis","Hjerteform med fovea costalis","Nyreform","Rund og flad"],"c":1,"e":"Thorakale corpora er hjerteformede med fovea costalis superior/inferior til ribbensleddene."},{"id":"ax14-q5","t":"ax14.ao","q":"Hvilken struktur mangler atlas (C1), som de øvrige vertebrae har?","o":["Processus spinosus","Corpus","Foramen transversarium","Massa lateralis"],"c":1,"e":"Atlas mangler et corpus; i stedet rager axis' dens op og danner led med atlas."},{"id":"ax14-q6","t":"ax14.ao","q":"Hvad hedder axis' opadstigende taplignende struktur?","o":["Massa lateralis","Dens axis","Tuberculum posterius","Arcus anterior"],"c":1,"e":"Dens axis ('tanden') skyder sig op fra corpus og danner led med atlas' arcus anterior og lig. transversum atlantis."},{"id":"ax14-q7","t":"ax14.ao","q":"Hvilke tre dele inddeles os occipitale i?","o":["Pars basilaris, pars lateralis, squama occipitalis","Pars petrosa, pars squamosa, pars mastoidea","Pars anterior, media, posterior","Corpus, arcus, processus"],"c":0,"e":"Os occipitale inddeles i pars basilaris, pars lateralis og squama occipitalis."},{"id":"ax14-q8","t":"ax14.cl","q":"Hvilken klassifikation har discus intervertebralis?","o":["Ægte glideled","Symfyse (sekundær synkondrose)","Syndesmose","Ægte drejeled"],"c":1,"e":"Discus intervertebralis er et uægte led, en symfyse (sekundær synkondrose)."},{"id":"ax14-q9","t":"ax14.cl","q":"Hvilket ligament danner et omvendt A på bagsiden af corpora inde i canalis vertebralis?","o":["Lig. longitudinale anterius","Lig. longitudinale posterius","Lig. flavum","Lig. nuchae"],"c":1,"e":"Lig. longitudinale posterius er omvendt A-formet på bagsiden af corpus, inde i kanalen."},{"id":"ax14-q10","t":"ax14.cl","q":"Hvilket afsnit af columna har facetled, der 'låser' ved ekstension?","o":["Cervikalt","Thorakalt","Lumbalt","Ingen af delene"],"c":2,"e":"Lumbalt presses proc. articularis inferior fast i den underliggende superiore facet ved ekstension (rotationslåsning)."},{"id":"ax14-q11","t":"ax14.cl","q":"Hvad forhindrer lig. transversum atlantis?","o":["Fremadglidning af dens axis","Bagudglidning af dens axis","Rotation i atlantoaxialleddet","Lateralfleksion af hovedet"],"c":1,"e":"Lig. transversum atlantis ligger bag dens axis og forhindrer, at tappen glider bagud."},{"id":"ax14-q12","t":"ax14.cl","q":"Hvilken struktur giver klinisk risiko for at trykke på plexus brachialis ved slidgigt?","o":["Uncus corporis (unco-vertebralleddet)","Lig. flavum","Facetleddet","Lig. nuchae"],"c":0,"e":"Uncus danner den forreste begrænsning af foramen intervertebrale; slidgigt her kan indsnævre rummet og trykke på plexus brachialis."},{"id":"ax14-q13","t":"ax14.sn","q":"Hvor mange spinalnervesegmenter er der i alt?","o":["28","31","33","24"],"c":1,"e":"31 segmenter: 8 cervicale, 12 thoracale, 5 lumbale, 5 sacrale, 1 coccygealt."},{"id":"ax14-q14","t":"ax14.sn","q":"Hvad gælder for den kutane innervation fra ramus dorsalis over og under T7?","o":["Over T7 kutan medial gren, under T7 kutan lateral gren","Over T7 kutan lateral gren, under T7 kutan medial gren","Altid den mediale gren","Altid den laterale gren"],"c":0,"e":"Over T7 er den mediale gren kutan, under T7 er den laterale gren kutan."},{"id":"ax14-q15","t":"ax14.sn","q":"Hvilken struktur modtager ALLE spinalnerver fra truncus sympathicus?","o":["Ramus communicans albus","Ramus communicans griseus","Ramus meningeus","Ramus dorsalis"],"c":1,"e":"Alle spinalnerver modtager en ramus communicans griseus; kun T1-L2 afgiver ramus communicans albus."},{"id":"ax14-q16","t":"ax14.ca","q":"Hvor ender medulla spinalis normalt?","o":["L1-L2 niveau","L4-L5 niveau","S1 niveau","T12 niveau"],"c":0,"e":"Medulla ender i L1-L2-niveau som conus medullaris, hvorfra cauda equina fortsætter."},{"id":"ax14-q17","t":"ax14.ca","q":"Hvorfor lægges en lumbalpunktur typisk over eller under L4?","o":["Fordi rygmarven ikke når hertil, kun cauda equina","Fordi discus er tyndest her","For at undgå plexus lumbalis","Fordi der er mest cerebrospinalvæske her"],"c":0,"e":"Under/over L4 er man sikker på kun at møde cauda equina, ikke selve medulla spinalis."},{"id":"ax14-q18","t":"ax14.ca","q":"Hvor hurtigt skal et cauda equina syndrom opereres?","o":["Inden for 24 timer","Inden for en uge","Inden for en måned","Der er ingen tidsgrænse"],"c":0,"e":"Cauda equina syndrom skal opereres akut, inden 24 timer, for at undgå irreversibel skade."},{"id":"ax14-q19","t":"ax14.rm","q":"Hvilken muskelgruppe hører ikke til de dybe rygmuskler?","o":["M. erector spinae","Mm. transversospinales","M. trapezius","Mm. suboccipitales"],"c":2,"e":"M. trapezius hører til de overfladiske rygmuskler (funktionelt knyttet til overekstremiteten)."},{"id":"ax14-q20","t":"ax14.rm","q":"Hvilken del af m. erector spinae ligger mest lateralt?","o":["M. spinalis","M. longissimus","M. iliocostalis","M. semispinalis"],"c":2,"e":"Fra medialt til lateralt: m. spinalis, m. longissimus, m. iliocostalis."},{"id":"ax14-q21","t":"ax14.rm","q":"Hvor mange hvirvler overspringer mm. multifidi?","o":["0-1","2-3","4 eller flere","Alle"],"c":1,"e":"Mm. rotatores overspringer 0-1, mm. multifidi 2-3, m. semispinalis 4 eller flere."},{"id":"ax14-q22","t":"ax14.rm","q":"Hvilken muskel ligger lateralt for m. semispinalis capitis?","o":["M. splenius","M. trapezius","M. rectus capitis posterior major","M. levator scapulae"],"c":0,"e":"M. splenius (capitis) ligger lateralt for m. semispinalis capitis - god spotteknik."},{"id":"ax14-q23","t":"ax14.th","q":"Hvilke costae hæfter direkte til sternum?","o":["1-7","1-10","8-12","Alle 12"],"c":0,"e":"Costa 1-7 hæfter direkte til sternum, 8-10 til det ovenliggende ribben, 11-12 ender frit."},{"id":"ax14-q24","t":"ax14.th","q":"Hvilket lag af ribbensmusklerne løber skråt nedad-fremad ('yderlommerne')?","o":["Mm. intercostales externi","Mm. intercostales interni","Mm. intercostales intimi","M. transversus thoracis"],"c":0,"e":"Mm. intercostales externi løber skråt nedad-fremad, som yderlommerne i en frakke."},{"id":"ax14-q25","t":"ax14.th","q":"Hvilken nerve innerverer huden omkring umbilicus?","o":["T7","T10","T12","L1"],"c":1,"e":"T10 innerverer området omkring navlen."},{"id":"ax14-q26","t":"ax14.th","q":"Hvad bliver a. thoracica interna til efter den passerer intercostalrum 6?","o":["A. epigastrica superior","A. epigastrica inferior","A. musculophrenica","A. pericardiacophrenica"],"c":0,"e":"A. thoracica interna fortsætter som a. epigastrica superior."},{"id":"ax14-q27","t":"ax14.ma","q":"Hvilken lymfeknudegruppe modtager størstedelen (75%) af mammas lymfe?","o":["Lnn. parasternales","Lnn. axillares, pektoral gruppe","Lnn. axillares, apikal gruppe","Peritoneale lymfekar"],"c":1,"e":"Den laterale del af mamma drænerer primært (75%) til lnn. axillares, pektoral gruppe."},{"id":"ax14-q28","t":"ax14.ma","q":"Hvorfor ses metastaser fra brystkræft hyppigt i columna?","o":["Direkte lymfespredning til hvirvlerne","Vv. intercostales posteriores drænerer til det klapløse v. azygos-system, forbundet med columna","Arteriel spredning via a. thoracica interna","Nervespredning langs n. intercostalis"],"c":1,"e":"Det klapløse v. azygos-system forbinder mammas vendrænage med columnas venesystem."},{"id":"ax14-q29","t":"ax14.ma","q":"Hvad er formålet med sentinel node-teknikken?","o":["At finde den første lymfeknude, der modtager lymfe fra en region, for at vurdere spredning","At måle blodgennemstrømning i mamma","At lokalisere selve tumoren","At teste nerveinnervation"],"c":0,"e":"Sentinel node er den første lymfeknude fra regionen; findes den metastase, skal hele axillen tømmes."},{"id":"ax15-q1","t":"ax15.di","q":"Hvilke tre partes har diaphragma?","o":["Sternalis, costalis, lumbalis","Anterior, posterior, lateralis","Superior, media, inferior","Ventralis, dorsalis, medialis"],"c":0,"e":"Pars sternalis, pars costalis og pars lumbalis er diaphragmas tre udspringshoveder."},{"id":"ax15-q2","t":"ax15.di","q":"Hvad danner lig. arcuatum medianum sammen med corpus vertebrae?","o":["Hiatus oesophagus","Hiatus aorticus","Foramen venae cavae","Larreys spalte"],"c":1,"e":"Lig. arcuatum medianum forbinder de to crura og danner sammen med corpus vertebrae hiatus aorticus."},{"id":"ax15-q3","t":"ax15.di","q":"I hvilket niveau ligger hiatus oesophagus?","o":["T8","T10","T12","L1"],"c":1,"e":"Hiatus oesophagus ligger på niveau T10, til venstre for midtlinjen."},{"id":"ax15-q4","t":"ax15.di","q":"Hvilken nerve innerverer diaphragma motorisk?","o":["N. vagus","N. phrenicus","N. intercostalis","N. splanchnicus"],"c":1,"e":"N. phrenicus (C3-C5) innerverer diaphragma motorisk og PPP (perikardiet, pleura, peritoneum) sensorisk."},{"id":"ax15-q5","t":"ax15.di","q":"Hvor løber n. phrenicus i forhold til m. scalenus anterior?","o":["Bagved","På forsiden","Gennem musklen","Lateralt for"],"c":1,"e":"N. phrenicus løber på forsiden af m. scalenus anterior - en klassisk spotteknik."},{"id":"ax15-q6","t":"ax15.ve","q":"Hvor stor en andel af hvilerespirationens inspiration står diaphragma for?","o":["1/3","1/2","2/3","Hele"],"c":2,"e":"Diaphragma står for ca. 2/3 af inspirationen ved hvilerespiration."},{"id":"ax15-q7","t":"ax15.ve","q":"Hvad er hovedfunktionen af mm. intercostales under vejrtrækning?","o":["Løfte ribbenene aktivt","Afstive thoraxvæggen","Trække sternum bagud","Kontrahere diaphragma"],"c":1,"e":"Selvom de bidrager til hhv. inspiration og ekspiration, er deres primære funktion at afstive thoraxvæggen."},{"id":"ax15-q8","t":"ax15.bv","q":"Hvilke 6 muskler udgør bugvæggens muskulatur?","o":["Rectus abd., pyramidalis, obliquus ext., obliquus int., transversus abd., quadratus lumborum","Rectus abd., psoas major, iliacus, sartorius, pectineus, gracilis","Obliquus ext., obliquus int., transversus abd., diaphragma, erector spinae, multifidus","Rectus abd., pyramidalis, iliopsoas, quadratus lumborum, serratus ant., latissimus dorsi"],"c":0,"e":"De 6 muskler er rectus abdominis, pyramidalis, obliquus externus, obliquus internus, transversus abdominis og quadratus lumborum."},{"id":"ax15-q9","t":"ax15.bv","q":"Hvor mange lag har bugvæggen?","o":["6","7","8","9"],"c":2,"e":"8 lag: hud, subcutis, obliquus ext., obliquus int., transversus abd., fascia transversalis, ekstraperitonealt bindevæv, peritoneum."},{"id":"ax15-q10","t":"ax15.bv","q":"Hvad kaldes m. obliquus internus abdominis populært, og hvorfor?","o":["'Yderlommerne i en jakke', pga. retningen udad","'Inderlommerne i en jakke', pga. retningen modsat obliquus externus","'Vesten', pga. cirkulær retning","'Bæltet', pga. horisontal retning"],"c":1,"e":"M. obliquus internus kaldes inderlommerne, modsat m. obliquus externus (yderlommerne)."},{"id":"ax15-q11","t":"ax15.bv","q":"Hvordan er rectusskeden opbygget UNDER linea arcuata?","o":["Alle tre aponeuroser går til det forreste blad","Alle tre aponeuroser går til det bagerste blad","Kun obliquus internus deler sig stadig","Rectusskeden findes ikke her"],"c":0,"e":"Under linea arcuata går alting til det forreste blad; det dorsale blad ophører her."},{"id":"ax15-q12","t":"ax15.bv","q":"Hvilken arterie anastomoserer med a. epigastrica superior?","o":["A. epigastrica inferior","A. iliaca externa","A. femoralis","A. thoracica lateralis"],"c":0,"e":"Aa. epigastricae superior og inferior anastomoserer og sikrer kollateral forsyning af bugvæggen."},{"id":"ax15-q13","t":"ax15.bv","q":"Hvilken muskel danner lig. arcuatum laterale som udspring for diaphragma?","o":["M. rectus abdominis","M. quadratus lumborum","M. psoas major","M. transversus abdominis"],"c":1,"e":"Fascien over m. quadratus lumborum danner lig. arcuatum laterale, udspring for diaphragmas pars lumbalis."},{"id":"ax15-q14","t":"ax15.ci","q":"Hvorfor vandrer testes ned gennem canalis inguinalis?","o":["For at undgå tryk fra bughulen","Fordi spermatogenesen kræver lavere temperatur","For at forkorte ductus deferens","Tilfældig embryologisk placering"],"c":1,"e":"Sædcelleproduktionen kræver en lidt lavere temperatur end i bughulen."},{"id":"ax15-q15","t":"ax15.ci","q":"Hvad passerer gennem canalis inguinalis hos kvinder?","o":["Ovarierne","Lig. teres uteri","Uterus selv","Ductus deferens"],"c":1,"e":"Hos kvinder passerer det runde livmoderbånd (lig. teres uteri) gennem den smallere kanal; ovarierne bliver i bughulen."},{"id":"ax15-q16","t":"ax15.ci","q":"Hvilket lag af funiculus spermaticus kommer fra fascia transversalis?","o":["Fascia spermatica externa","Fascia cremasterica","Fascia spermatica interna","Peritoneum"],"c":2,"e":"Fascia transversalis fortsætter som fascia spermatica interna (det inderste lag)."},{"id":"ax15-q17","t":"ax15.ci","q":"Hvor ligger anulus inguinalis profundus?","o":["Mellem symphysis pubica og SIAS","Ved tuberculum pubicum alene","Lateralt for spina iliaca posterior","I midtlinjen ved navlen"],"c":0,"e":"Anulus inguinalis profundus ligger omtrent midt mellem symphysis pubica og SIAS."},{"id":"ax15-q18","t":"ax15.ci","q":"Hvilken struktur danner bagvæggens kraftige, mediale zone i canalis inguinalis?","o":["Fascia transversalis","Falx inguinalis","Lig. lacunare","M. cremaster"],"c":1,"e":"Falx inguinalis (medialt) er kraftig; fascia transversalis (lateralt) er den svage zone."},{"id":"ax15-q19","t":"ax15.ci","q":"Hvor mærkes pulsen ved en indirekte lyskebrok?","o":["Medialt for brokporten (a. epigastrica inf.)","Lateralt for brokporten","Der er ingen palpabel puls","Kranielt for brokporten"],"c":0,"e":"Ved indirekte hernie mærkes pulsen fra a. epigastrica inferior medialt for brokporten; ved direkte hernie lateralt."},{"id":"ax15-q20","t":"ax15.ci","q":"Hvad er kryptorkisme?","o":["Betændelse i testis","Manglende/delvis nedvandring af testis","Torsion af testis","Hydrocele"],"c":1,"e":"Kryptorkisme (mal-descensus testis) er manglende eller delvis nedvandring af testis."},{"id":"ax15-q21","t":"ax15.bb","q":"Hvilke to dele består bækkenbunden af?","o":["Diaphragma pelvis og diaphragma urogenitale","M. levator ani og m. piriformis","Diaphragma pelvis og m. obturatorius internus","Fascia pelvis og fascia perinei"],"c":0,"e":"Bækkenbunden = diaphragma pelvis (profund) + diaphragma urogenitale (superficiel, 5. sem.)."},{"id":"ax15-q22","t":"ax15.bb","q":"Hvilken nerve innerverer diaphragma pelvis?","o":["N. obturatorius","N. pudendus","N. ischiadicus","N. femoralis"],"c":1,"e":"N. pudendus fra plexus sacralis innerverer diaphragma pelvis."},{"id":"ax15-q23","t":"ax15.bb","q":"Hvad hedder den del af m. pubococcygeus, der fungerer som en 'billig sphincter' om rectum?","o":["M. puborectalis","M. iliococcygeus","M. coccygeus","M. sphincter ani externus"],"c":0,"e":"M. puborectalis er den slyngeformede del af m. pubococcygeus bag om rectum."},{"id":"ax15-q24","t":"ax15.bb","q":"Hvad er levatorspalten passage for?","o":["Kun urethra","Urethra (og hos kvinden vagina)","Kun rectum","N. pudendus"],"c":1,"e":"Levatorspalten er en fortil midtlinjespalte for urethra, og hos kvinden også vagina."}]};
