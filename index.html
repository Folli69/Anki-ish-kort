  '<header class="prog"><h1>Anatomi: kort og quiz</h1>'+
  '<p class="lede">Kort og quiz bygget på underviserens slides. Vælg en eller flere pakker. Vælger du flere, bliver kortene blandet på tværs.</p>'+
  (total?'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+kn+'"><i style="width:'+(kn/total*100)+'%"></i></div>'+
  '<p>Du har markeret '+kn+' af '+total+' kort som kendt i de valgte pakker.</p>':'')+'</header>'+
  '<h2>Pakker</h2><div class="decks" role="group" aria-label="Pakker">'+decks+'</div>'+
  (S.decks.size?'<h2>Emner</h2>'+groups:'')+
  '<h2>Indstillinger</h2>'+
  '<p class="lab" id="l1" style="margin-top:0">Billedkort: hvilke labels er skjult?</p>'+
  '<div class="seg" role="group" aria-labelledby="l1"><button data-a="occ" data-v="all" aria-pressed="'+(prefs.occ==='all')+'">Alle labels</button><button data-a="occ" data-v="one" aria-pressed="'+(prefs.occ==='one')+'">Kun ét label</button></div>'+
  '<p class="hint">'+(prefs.occ==='all'?'Alle labels er dækket til, og det orange felt er det, du skal gætte. Det er den svære udgave.':'Kun det orange felt er skjult, og de øvrige labels hjælper dig med at placere dig.')+'</p>'+
  '<label class="chk"><input type="checkbox" data-a="hideKnown"'+(prefs.hideKnown?' checked':'')+'> Skjul kort, jeg har markeret som kendt</label>'+
  '<p class="lab" id="l2">Antal spørgsmål i quizzen og i blandet runde (pr. type)</p>'+
  '<div class="seg" role="group" aria-labelledby="l2">'+qn+'</div>'+
  (S.msg?'<p class="msg" role="alert">'+esc(S.msg)+'</p>':'')+
  '<div class="modes">'+
  '<button class="mode" data-a="startCards" data-v="all"><span><strong>Flashcards</strong><span class="d">Tekst- og billedkort. Vis svaret, bedøm dig selv, og kort du misser kommer tilbage.</span></span><span class="n">'+nAll+'<small>kort</small></span></button>'+
  '<button class="mode" data-a="startCards" data-v="img"><span><strong>Billedkort</strong><span class="d">Kun figurer: skjulte labels og nummererede figurer, der skal navngives.</span></span><span class="n">'+nImg+'<small>kort</small></span></button>'+
  '<button class="mode" data-a="startQuiz"><span><strong>Quiz</strong><span class="d">Multiple choice med forklaring på hvert svar.</span></span><span class="n">'+nQ+'<small>spørgsmål</small></span></button>'+
  '<button class="mode" data-a="startMix"><span><strong>Bland</strong><span class="d">Flashcards, billedkort og quizspørgsmål i én runde: først et kort, så et spørgsmål, og så videre.</span></span><span class="n">'+nMix+'<small>i runden</small></span></button>'+
  '</div>'+
  '<div class="foot"><p>Alt indhold stammer fra underviserens slides og noter. Dit fremskridt gemmes kun i denne browser.</p>'+
  '<button class="linkbtn" data-a="reset">'+(S.resetArmed?'Tryk igen for at nulstille alt fremskridt':'Nulstil fremskridt')+'</button></div>'+
  '</div>';
}

/* ---------- billeder ---------- */
var M=null;
function curSt(){return S.view==='mix'?M:C;}
function zoomOn(){var s=curSt();return !!(s&&s.zoom);}
function figOpen(c){var im=IMG[c.img];return '<div class="media'+(zoomOn()?' zoom':'')+'"><div class="fig" style="--ar:'+im.ar+'"><img src="'+im.src+'" alt="'+esc(figAlt(c))+'">';}
function figAlt(c){
  if(c.k==='text')return 'Referencebillede';
  if(c.k==='occ')return 'Anatomisk figur med tildækkede labels';
  if(c.k==='num')return c.alt||(c.bone+' med nummererede pile');
  return 'Albueleddet med tre farvede bokse';
}
function occMedia(c,revealed){
  var h=figOpen(c);
  c.boxes.forEach(function(b,i){
    var isT=i===c.target;
    if(!isT&&prefs.occ==='one')return;
    h+='<span class="m'+(isT?' t'+(revealed?' rev':''):'')+'" style="left:'+b[0]+'%;top:'+b[1]+'%;width:'+b[2]+'%;height:'+b[3]+'%"></span>';
  });
  return h+'</div></div>';
}
function plainMedia(c){return figOpen(c)+'</div></div>';}

/* ---------- flashcards ---------- */
function startCards(kind){
  var p=pool(kind);
  if(!p.length){S.msg=!S.decks.size?'Vælg mindst én pakke.':!T.some(function(t){return on(t.k);})?'Vælg mindst ét emne.':'Ingen kort at vise. Slå "Skjul kendte kort" fra, eller nulstil fremskridt.';render();return;}
  S.msg='';
  C={kind:kind,queue:shuffle(p).map(function(c){return c.id;}),total:p.length,done:0,tries:0,missed:new Set(),revealed:false,zoom:false};
  S.view='cards';render();
}
function cardParts(c,st,lab){
  var isImg=c.k!=='text',fig=!!c.img,prompt='',media='',ans='';
  if(c.k==='text'){prompt=esc(c.q);if(fig)media=plainMedia(c);}
  else if(c.k==='occ'){prompt='Hvad står der i det orange felt?';media=occMedia(c,st.revealed);}
  else if(c.k==='num'){prompt=c.ask?esc(c.ask.replace('{nr}',c.nr)):esc(c.bone)+': hvad peger pil nr. '+c.nr+' på?';media=plainMedia(c);}
  else{prompt='Hvilket delled er markeret med den <span class="sw" style="background:'+COLOURS[c.colour]+'"></span><strong>'+esc(c.colour)+'</strong> boks?';media=plainMedia(c);}
  if(st.revealed){
    ans='<div class="answer" tabindex="-1" id="ans">'+(isImg?'<div class="ans-hd">'+esc(c.a)+'</div>'+(c.n?'<div class="ans-note">'+fmt(c.n)+'</div>':''):'<div class="ans-main">'+fmt(c.a)+'</div>')+'</div>';
  }
  var actions=st.revealed?
    '<div class="actions"><button class="btn again" data-a="grade" data-v="again">Igen<small>om lidt</small></button><button class="btn" data-a="grade" data-v="hard">Næsten<small>senere</small></button><button class="btn good" data-a="grade" data-v="good" data-af="1">Kunne det<small>kendt</small></button></div>'+
    '<p class="kbd">Tastatur: 1 = Igen, 2 = Næsten, 3 = Kunne det.</p>':
    '<div class="actions one"><button class="btn primary" data-a="reveal" data-af="1">Vis svar</button></div><p class="kbd">Tastatur: mellemrum viser svaret.</p>';
  var article='<article class="card"><p class="tag">'+(lab?'<b class="pill">'+lab+'</b>':'')+tag(c.t)+'</p><p class="q">'+prompt+'</p>'+
    (isImg||fig?ans+media+'<button class="linkbtn" data-a="zoom">'+(st.zoom?'Vis hele figuren':'Forstør figuren')+'</button>':ans)+'</article>';
  return {article:article,actions:actions};
}
function cardView(){
  var c=byId[C.queue[0]],p=cardParts(c,C,'');
  return '<div class="wrap">'+
  '<div class="top"><button class="linkbtn" data-a="home">Tilbage til menu</button><span class="count">'+C.queue.length+' i køen, '+C.done+' af '+C.total+' kendt</span></div>'+
  '<div class="bar"><i style="width:'+(C.done/C.total*100)+'%"></i></div>'+p.article+p.actions+'</div>';
}
function reveal(){curSt().revealed=true;render();var a=document.getElementById('ans');if(a){try{a.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}catch(e){}}}
function grade(g){
  if(S.view==='mix')return mixGrade(g);
  var id=C.queue.shift();
  if(g==='good'){known.add(id);saveKnown();C.done++;}
  else{
    var pos=Math.min(g==='again'?3:9,C.queue.length);
    C.queue.splice(pos,0,id);C.tries++;
    if(g==='again')C.missed.add(id);
  }
  C.revealed=false;C.zoom=false;
  if(!C.queue.length)S.view='cdone';
  render();window.scrollTo(0,0);
}
function cdoneView(){
  var m=C.missed.size;
  return '<div class="wrap"><h1>Runden er færdig</h1>'+
  '<p class="lede">Du har gennemgået '+C.total+' kort og markeret dem alle som kendt'+(C.tries?' efter '+C.tries+' gange, hvor du ikke kunne dem straks':'')+'.</p>'+
  '<div class="stack">'+
  (m?'<button class="btn primary" data-a="retryMissed">Gentag de '+m+' kort, du missede</button>':'')+
  '<button class="btn" data-a="again">Kør samme runde igen</button>'+
  '<button class="btn" data-a="home">Tilbage til menu</button></div></div>';
}

/* ---------- quiz ---------- */
function startQuiz(list){
  var p=list||MCQ.filter(function(q){return on(q.t);});
  if(!p.length){S.msg=!S.decks.size?'Vælg mindst én pakke.':!T.some(function(t){return on(t.k);})?'Vælg mindst ét emne.':'Ingen quizspørgsmål i det valgte.';render();return;}
  S.msg='';
  p=shuffle(p);if(!list&&prefs.qn!=='all')p=p.slice(0,Number(prefs.qn));
  Q={list:p.map(function(q){return {q:q,order:shuffle(q.o.map(function(_,i){return i;}))};}),i:0,pick:null,score:0,missed:[]};
  S.view='quiz';render();window.scrollTo(0,0);
}
function quizParts(it,pk,lab,nextLabel){
  var q=it.q,picked=pk!==null,letters=['A','B','C','D','E'];
  var opts=it.order.map(function(oi,di){
    var cls='opt';
    if(picked){if(oi===q.c)cls+=' right';else if(di===pk)cls+=' wrong';}
    return '<button class="'+cls+'" data-a="pick" data-v="'+di+'"'+(picked?' disabled':'')+'><span class="l">'+letters[di]+'</span><span>'+esc(q.o[oi])+'</span></button>';
  }).join('');
  var fb='';
  if(picked){
    var ok=it.order[pk]===q.c;
    fb='<div class="answer" tabindex="-1" id="ans"><p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Rigtigt.':'Ikke helt. Det rigtige svar er: '+esc(q.o[q.c]))+'</p><div class="ans-note" style="margin-top:0">'+fmt(q.e)+'</div></div>';
  }
  var article='<article class="card"><p class="tag">'+(lab?'<b class="pill">'+lab+'</b>':'')+tag(q.t)+'</p><p class="q">'+esc(q.q)+'</p><div class="opts">'+opts+'</div>'+fb+'</article>';
  var actions=picked?'<div class="actions one"><button class="btn primary" data-a="next" data-af="1">'+nextLabel+'</button></div>':'<p class="kbd">Tastatur: tryk 1–4 for at vælge svar.</p>';
  return {article:article,actions:actions};
}
function quizView(){
  var last=Q.i===Q.list.length-1,p=quizParts(Q.list[Q.i],Q.pick,'',last?'Se resultat':'Næste spørgsmål');
  return '<div class="wrap">'+
  '<div class="top"><button class="linkbtn" data-a="home">Afslut quiz</button><span class="count">Spørgsmål '+(Q.i+1)+' af '+Q.list.length+'</span></div>'+
  '<div class="bar"><i style="width:'+(Q.i/Q.list.length*100)+'%"></i></div>'+p.article+p.actions+'</div>';
}
function pick(di){
  if(S.view==='mix')return mixPick(di);
  if(Q.pick!==null)return;
  var it=Q.list[Q.i];Q.pick=di;
  if(it.order[di]===it.q.c)Q.score++;else Q.missed.push(it.q);
  render();
  var a=document.getElementById('ans');if(a){try{a.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}catch(e){}}
}
function next(){
  if(S.view==='mix')return mixNext();
  if(Q.i>=Q.list.length-1){S.view='qdone';render();window.scrollTo(0,0);return;}
  Q.i++;Q.pick=null;render();window.scrollTo(0,0);
}
function qdoneView(){
  var n=Q.list.length,pc=Math.round(Q.score/n*100);
  var miss=Q.missed.map(function(q){
    return '<div class="miss"><p class="mq">'+esc(q.q)+'</p><p class="ma">'+esc(q.o[q.c])+'</p><p class="me">'+fmt(q.e)+'</p></div>';
  }).join('');
  return '<div class="wrap"><h1>Resultat</h1><p class="score">'+Q.score+' / '+n+'</p>'+
  '<p class="lede">'+pc+' % rigtige.'+(Q.missed.length?' Her er de spørgsmål, du missede:':' Du svarede rigtigt på det hele.')+'</p>'+miss+
  '<div class="stack">'+(Q.missed.length?'<button class="btn primary" data-a="retryQuiz">Prøv de '+Q.missed.length+' forkerte igen</button>':'')+
  '<button class="btn" data-a="startQuiz">Ny quiz</button><button class="btn" data-a="home">Tilbage til menu</button></div></div>';
}

/* ---------- blandet runde ---------- */
function startMix(list){
  var cp,qp;
  if(list){cp=list.cards.slice();qp=list.qs.slice();}
  else{
    cp=shuffle(pool('all')).map(function(c){return c.id;});
    qp=shuffle(MCQ.filter(function(q){return on(q.t);}));
    if(prefs.qn!=='all'){var n=Number(prefs.qn);cp=cp.slice(0,n);qp=qp.slice(0,n);}
  }
  if(!cp.length&&!qp.length){S.msg=!S.decks.size?'Vælg mindst én pakke.':!T.some(function(t){return on(t.k);})?'Vælg mindst ét emne.':'Ingen kort at vise. Slå "Skjul kendte kort" fra, eller nulstil fremskridt.';render();return;}
  S.msg='';
  var queue=[],ia=0,ib=0,na=cp.length,nb=qp.length;
  while(ia<na||ib<nb){
    if(ib>=nb||(ia<na&&ia*nb<=ib*na)){queue.push({k:'c',id:cp[ia++]});}
    else{var q=qp[ib++];queue.push({k:'q',it:{q:q,order:shuffle(q.o.map(function(_,i){return i;}))}});}
  }
  M={queue:queue,total:queue.length,done:0,score:0,nq:nb,nc:na,tries:0,missedC:new Set(),missedQ:[],revealed:false,pick:null,zoom:false};
  S.view='mix';render();window.scrollTo(0,0);
}
function mixView(){
  var e=M.queue[0],p=e.k==='c'?cardParts(byId[e.id],M,'Flashcard'):quizParts(e.it,M.pick,'Quiz','Næste');
  return '<div class="wrap">'+
  '<div class="top"><button class="linkbtn" data-a="home">Afslut runden</button><span class="count">'+M.done+' af '+M.total+' gennemført</span></div>'+
  '<div class="bar"><i style="width:'+(M.done/M.total*100)+'%"></i></div>'+p.article+p.actions+'</div>';
}
function mixGrade(g){
  var e=M.queue.shift();
  if(g==='good'){known.add(e.id);saveKnown();M.done++;}
  else{
    var pos=Math.min(g==='again'?3:9,M.queue.length);
    M.queue.splice(pos,0,e);M.tries++;
    if(g==='again')M.missedC.add(e.id);
  }
  M.revealed=false;M.zoom=false;
  if(!M.queue.length)S.view='mdone';
  render();window.scrollTo(0,0);
}
function mixPick(di){
  if(M.pick!==null)return;
  var it=M.queue[0].it;M.pick=di;
  if(it.order[di]===it.q.c)M.score++;else M.missedQ.push(it.q);
  render();
  var a=document.getElementById('ans');if(a){try{a.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}catch(e){}}
}
function mixNext(){
  M.queue.shift();M.done++;M.pick=null;
  if(!M.queue.length)S.view='mdone';
  render();window.scrollTo(0,0);
}
function mdoneView(){
  var mq=M.missedQ,mc=M.missedC.size;
  var miss=mq.map(function(q){
    return '<div class="miss"><p class="mq">'+esc(q.q)+'</p><p class="ma">'+esc(q.o[q.c])+'</p><p class="me">'+fmt(q.e)+'</p></div>';
  }).join('');
  return '<div class="wrap"><h1>Runden er færdig</h1>'+
  (M.nq?'<p class="score">'+M.score+' / '+M.nq+'</p><p class="lede">rigtige quizspørgsmål.</p>':'')+
  (M.nc?'<p class="lede">Du har gennemgået '+M.nc+' flashcards og markeret dem alle som kendt'+(M.tries?' efter '+M.tries+' gange, hvor du ikke kunne dem straks':'')+'.</p>':'')+
  (mq.length?'<h2>Quizspørgsmål, du missede</h2>'+miss:'')+
  '<div class="stack">'+((mq.length||mc)?'<button class="btn primary" data-a="retryMix">Gentag de '+(mq.length+mc)+' missede</button>':'')+
  '<button class="btn" data-a="startMix">Ny blandet runde</button><button class="btn" data-a="home">Tilbage til menu</button></div></div>';
}

/* ---------- rendering og events ---------- */
function render(){
  var h={home:home,cards:cardView,cdone:cdoneView,quiz:quizView,qdone:qdoneView,mix:mixView,mdone:mdoneView}[S.view]();
  app.innerHTML=h;
  var t=app.querySelector('[data-af]');
  if(t&&(S.view==='cards'||S.view==='quiz'||S.view==='mix')){try{t.focus({preventScroll:true});}catch(e){}}
}
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
  switch(a){
    case 'deck':S.msg='';
      if(S.decks.has(v)){S.decks.delete(v);}else{S.decks.add(v);T.forEach(function(t){if(t.d===v)S.topics.add(t.k);});}
      prefs.offDecks=DK.filter(function(d){return !S.decks.has(d.k);}).map(function(d){return d.k;});savePrefs();render();break;
    case 'topic':S.msg='';if(S.topics.has(v))S.topics.delete(v);else S.topics.add(v);render();break;
    case 'openDeck':if(S.open.has(v))S.open.delete(v);else S.open.add(v);render();break;
    case 'allDeck':T.forEach(function(t){if(t.d===v)S.topics.add(t.k);});render();break;
    case 'noDeck':T.forEach(function(t){if(t.d===v)S.topics.delete(t.k);});render();break;
    case 'toggleCat':if(S.catOpen.has(v))S.catOpen.delete(v);else S.catOpen.add(v);render();break;
    case 'catOn':case 'catOff':S.msg='';
      DK.forEach(function(d){if(d.c!==v)return;if(a==='catOn'){S.decks.add(d.k);T.forEach(function(t){if(t.d===d.k)S.topics.add(t.k);});}else S.decks.delete(d.k);});
      prefs.offDecks=DK.filter(function(d){return !S.decks.has(d.k);}).map(function(d){return d.k;});savePrefs();render();break;
    case 'occ':prefs.occ=v;savePrefs();render();break;
    case 'qn':prefs.qn=v==='all'?'all':Number(v);savePrefs();render();break;
    case 'startCards':startCards(v);break;
    case 'startQuiz':startQuiz();break;
    case 'startMix':startMix();break;
    case 'retryMix':startMix({cards:Array.from(M.missedC),qs:M.missedQ.slice()});break;
    case 'reveal':reveal();break;
    case 'grade':grade(v);break;
    case 'zoom':var zs=curSt();zs.zoom=!zs.zoom;var m=app.querySelector('.media');if(m)m.classList.toggle('zoom',zs.zoom);el.textContent=zs.zoom?'Vis hele figuren':'Forstør figuren';break;
    case 'again':startCards(C.kind);break;
    case 'retryMissed':
      var ids=Array.from(C.missed);C={kind:C.kind,queue:shuffle(ids),total:ids.length,done:0,tries:0,missed:new Set(),revealed:false,zoom:false};S.view='cards';render();window.scrollTo(0,0);break;
    case 'pick':pick(Number(v));break;
    case 'next':next();break;
    case 'retryQuiz':startQuiz(Q.missed.slice());break;
    case 'home':S.view='home';S.resetArmed=false;render();window.scrollTo(0,0);break;
    case 'reset':
      if(S.resetArmed){known=new Set();saveKnown();S.resetArmed=false;}else{S.resetArmed=true;}
      render();break;
  }
});
app.addEventListener('change',function(e){
  if(e.target.getAttribute('data-a')==='hideKnown'){prefs.hideKnown=e.target.checked;savePrefs();render();}
});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(S.view==='cards'){
    if(!C.revealed){if((e.key===' '||e.key==='Enter')&&!onBtn){e.preventDefault();reveal();}}
    else{
      if(e.key==='1')grade('again');else if(e.key==='2')grade('hard');else if(e.key==='3')grade('good');
    }
  }else if(S.view==='mix'){
    var e0=M.queue[0];
    if(e0.k==='c'){
      if(!M.revealed){if((e.key===' '||e.key==='Enter')&&!onBtn){e.preventDefault();reveal();}}
      else{if(e.key==='1')grade('again');else if(e.key==='2')grade('hard');else if(e.key==='3')grade('good');}
    }else{
      if(M.pick===null){var mn=Number(e.key);if(mn>=1&&mn<=e0.it.q.o.length)pick(mn-1);}
      else if((e.key==='Enter'||e.key===' ')&&!onBtn){e.preventDefault();next();}
    }
  }else if(S.view==='quiz'){
    if(Q.pick===null){var n=Number(e.key);if(n>=1&&n<=Q.list[Q.i].q.o.length)pick(n-1);}
    else if((e.key==='Enter'||e.key===' ')&&!onBtn){e.preventDefault();next();}
  }
});
render();
})();
</script>
</body>
</html>
